<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>[开发版] 80分(上海规则)</title>
<style>
  :root{--felt:#0f5132;--felt2:#0b3d26;--gold:#ffd75e;
        /* 牌宽是整个界面的标尺:牌面、字号、间距都跟着它缩放 */
        --cardW:clamp(48px,2.9vw + 1.3vh,72px);
        --cardH:calc(var(--cardW)*1.44);
        --miniW:calc(var(--cardW)*0.68);
        --miniH:calc(var(--miniW)*1.44);
        --fsBase:clamp(13px,0.55vw + 0.5vh + 6px,18px);
        --fsSmall:clamp(12px,0.45vw + 0.4vh + 6px,16px)}
  *{box-sizing:border-box}
  html,body{height:100%}
  body{font-family:"PingFang SC","Microsoft YaHei",sans-serif;margin:0;
       background:radial-gradient(ellipse at center,var(--felt),var(--felt2));
       color:#fff;overflow:hidden}          /* 整页不滚动,滚动只发生在右侧面板内部 */
  /* 左右布局:左边牌桌,右边历史/笔记/教练。整体锁在一屏高度内 */
  #app{display:grid;height:100dvh;padding:8px;gap:8px;margin:0 auto;max-width:1700px;
       grid-template-columns:minmax(0,1fr) clamp(250px,24vw,380px);
       grid-template-rows:auto minmax(0,1fr)}
  #status{grid-column:1/-1}
  #main{grid-column:1;display:flex;flex-direction:column;gap:6px;min-height:0;min-width:0}
  #side{grid-column:2;display:flex;flex-direction:column;gap:6px;min-height:0;min-width:0}
  #status{display:flex;gap:14px;flex-wrap:wrap;background:rgba(0,0,0,.35);border-radius:8px;
          padding:8px 14px;font-size:var(--fsBase);align-items:center}
  #status b{color:var(--gold)}
  /* 阶段性说明(发牌中/造反/扣底):挤不进第一行就自己换行,不占额外的常驻高度 */
  .phaseHint{flex-basis:100%;color:#9fd6b5;font-size:var(--fsSmall)}
  /* 牌桌吃掉左栏剩余高度,中间出牌区可伸缩 */
  #table{flex:1;min-height:0;display:grid;gap:6px;
         grid-template-rows:auto minmax(0,1fr) auto;
         grid-template-columns:minmax(56px,110px) minmax(0,1fr) minmax(56px,110px)}
  .seat{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
        font-size:var(--fsSmall)}
  .seat .name{background:rgba(0,0,0,.35);padding:2px 10px;border-radius:10px;white-space:nowrap}
  .seat .name.turn{background:var(--gold);color:#222;font-weight:bold}
  .backs{color:#9fd6b5;font-size:var(--fsSmall)}
  /* 出牌区不跟着牌桌无限拉高,免得四家的牌被扯得太散 */
  #center{grid-area:2/2;display:grid;grid-template-rows:1fr 1fr 1fr;grid-template-columns:1fr 1fr 1fr;
          align-items:center;justify-items:center;min-height:0;width:100%;
          max-height:calc(var(--cardH)*3.4);align-self:center}
  .played{display:flex;gap:2px;min-height:var(--cardH);align-items:center}
  #msg{text-align:center;font-size:calc(var(--fsBase)*1.1);color:var(--gold);pointer-events:none}
  /* 当前谁大:我方绿、对方橙红,一眼判断该抢还是该垫 */
  .memRow{margin:0 0 8px;padding-bottom:6px;border-bottom:1px solid rgba(255,255,255,.08)}
  .memSub{opacity:.85;padding-left:1em}
  .msgWin{margin-top:4px;font-size:var(--fsBase);font-weight:bold}
  .msgWin.ours{color:#7ee787}
  .msgWin.theirs{color:#ff9d6e}
  .card{position:relative;display:inline-block;width:var(--cardW);height:var(--cardH);flex:none;
        background:#fff;color:#111;border-radius:5px;border:1px solid #999;
        font-weight:bold;user-select:none;box-shadow:0 1px 3px rgba(0,0,0,.4)}
  /* 四色牌:黑桃黑、红桃红、方块深玫红、草花深墨绿 —— 拉开辨识度但不刺眼 */
  .card.sS{color:#141414}
  .card.sH{color:#c0392b}
  .card.sD{color:#b0185c}
  .card.sC{color:#0a3b23}   /* 比牌桌绿深不少,接近墨黑;只作辅助识别,不喧宾夺主 */
  .card.jb{color:#c0392b}   /* 大王 */
  .card.js{color:#141414}   /* 小王 */
  /* 牌面字号跟着牌宽走 —— 比旧版明显放大,远看也认得出 */
  .card .tl{position:absolute;top:2px;left:3px;font-size:calc(var(--cardW)*.44);line-height:1}
  .card .br{position:absolute;bottom:2px;right:3px;font-size:calc(var(--cardW)*.44);line-height:1;transform:rotate(180deg)}
  /* 花色符号原本只有数字的 0.8 倍,偏小;提到与数字相当 */
  .card .tr{position:absolute;top:2px;right:3px;font-size:calc(var(--cardW)*.42);line-height:1}
  .card .bl{position:absolute;bottom:2px;left:3px;font-size:calc(var(--cardW)*.42);line-height:1}
  .card .joker{position:absolute;left:0;right:0;top:14%;bottom:0;writing-mode:vertical-lr;
               text-align:left;font-size:calc(var(--cardW)*.19);letter-spacing:1px;padding-left:32%}
  .mini{width:var(--miniW);height:var(--miniH)}
  .mini .tl,.mini .br{font-size:calc(var(--miniW)*.44)}
  .mini .tr,.mini .bl{font-size:calc(var(--miniW)*.42)}
  .mini .joker{font-size:calc(var(--miniW)*.19);padding-left:32%;top:10%}
  #hand{flex:none;display:flex;flex-wrap:wrap;gap:0;justify-content:center;align-content:center;
        padding:4px;min-height:calc(var(--cardH) + 18px)}
  #hand .card{margin-left:calc(var(--cardW)*-.38);cursor:pointer;transition:transform .08s}
  #hand .card:first-child{margin-left:0}
  /* 手牌是叠着的,右半边字符会被下一张压住并互相挤占;只留左半边(1数字+1花色)足够读牌 */
  #hand .card .tr,#hand .card .br{display:none}
  #hand .card.sel{transform:translateY(-14px);outline:2px solid var(--gold)}
  #hand .card.hintc{outline:2px dashed #6ec9ff;box-shadow:0 0 8px #6ec9ff}
  .coachBox{background:rgba(110,201,255,.1);border:1px solid rgba(110,201,255,.4);
            border-radius:8px;padding:8px 10px;margin:6px 0;line-height:1.7}
  .coachStep{color:#6ec9ff;font-weight:bold}
  /* 笔记现在是右栏的一个页签,内容直接铺在 #panel 里,滚动交给 #panel 统一处理 */
  #noteList{display:flex;flex-direction:column-reverse;gap:4px}
  .note{background:#245c41;border-radius:10px 10px 10px 2px;padding:4px 8px;align-self:flex-start;
        max-width:95%;word-break:break-all}
  #noteInputRow{display:flex;gap:4px;margin-bottom:8px}
  #noteInput{flex:1;min-width:0;border:0;border-radius:6px;padding:4px 8px;font-size:var(--fsSmall)}
  #noteSend{padding:4px 10px;font-size:var(--fsSmall)}
  /* 底部三区:左右两栏等宽撑开,中间那组才能真正居中(不随左右内容多少而漂移)。
     三区一律 align-items:end 底部对齐 —— 发牌区为了锚定要按底行排,若其余两区居中
     就会比它高出一截,看着像发牌按钮"沉下去"了。 */
  #controls{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:end;
            padding:4px;flex:none}
  /* 发牌互动区:右对齐 —— 新按钮往左长,最右那颗位置不动,手指肌肉记忆才稳。
     预留两行高度:选项多到换行时操作行不会突然变高把牌桌顶上去(那正是误点的来源)。
     align-content:flex-end 让换行往上堆,最下面那行(含锚点按钮)始终贴在同一位置。 */
  #dealZone{display:flex;gap:6px;align-items:flex-end;justify-content:flex-end;
            flex-wrap:wrap;align-content:flex-end;min-height:4.2em}
  #mainZone{display:flex;gap:10px;align-items:flex-end;justify-content:center}
  /* 庄家区:左对齐,只有坐庄时才用得上 */
  #dealerZone{display:flex;gap:8px;align-items:flex-end;justify-content:flex-start}
  /* 三区所有按钮统一一套尺寸(同字号、同内边距、同最小宽度),排在一行才齐整;
     宽度按最长文案「亮无将(大)」量(≈5.9em),这样发牌选项增减也不改变按钮大小。
     主次靠颜色区分(出牌金色 / 次要灰色 / 问教练蓝色),不靠大小。 */
  #controls button{font-size:var(--fsSmall);padding:6px 8px;min-width:6.6em;
                   white-space:nowrap;text-align:center;line-height:1.25}
  #dealZone span{color:#9fd6b5;font-size:var(--fsSmall)}
  button{background:var(--gold);color:#222;border:0;border-radius:6px;padding:7px 16px;
         font-size:var(--fsBase);font-weight:bold;cursor:pointer}
  button.minor{background:#c8d6cf}
  button:disabled{opacity:.35;cursor:default}
  #tabs{display:flex;gap:6px;flex:none;flex-wrap:wrap}
  #tabs button{font-size:var(--fsSmall);padding:5px 10px;background:#2c6e4f;color:#fff}
  #tabs button.on{background:var(--gold);color:#222}
  #panel{background:rgba(0,0,0,.3);border-radius:8px;padding:8px 12px;font-size:var(--fsSmall);
         flex:1;min-height:0;overflow-y:auto;color:#cfe8d9}
  .trickRow{display:flex;gap:10px;align-items:center;margin:3px 0 8px;flex-wrap:wrap}
  /* 墩序数(和赢家/得分)独占一行,下面才是四家的牌 —— 一行混排太挤,看不清哪张属于哪墩 */
  .trickRow .who{color:var(--gold);flex-basis:100%;margin-bottom:2px}
  .suitGroup{margin:4px 0}
  .toggleRow{display:flex;gap:14px;align-items:center;margin-bottom:6px;color:#9fd6b5}
  #overlay,#setOverlay{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;
           align-items:center;justify-content:center;z-index:10}
  #setOverlay{z-index:11}
  #overlay .panel,#setOverlay .panel{background:#173b2a;border:2px solid var(--gold);border-radius:12px;
                  padding:26px 34px;text-align:center;font-size:17px;line-height:1.9;
                  max-height:80vh;overflow-y:auto}
  #setOverlay .panel{text-align:left;min-width:min(420px,90vw)}
  .setRow{display:flex;align-items:center;gap:10px;margin:8px 0;font-size:15px;flex-wrap:wrap}
  .setRow>label:first-child{flex:1;min-width:150px;color:#cfe8d9}
  .setRow select,.setRow input[type=number]{border:0;border-radius:6px;padding:5px 8px;font-size:14px}
  .setRow input[type=number]{width:72px}
  .setHint{font-size:12px;color:#9fd6b5;opacity:.8;margin:-4px 0 10px}
  #btnSet{background:#2c6e4f;color:#fff;font-size:13px;padding:4px 10px}
  #tests{font-family:ui-monospace,Menlo,monospace;padding:20px;display:none}
  .pass{color:#7ee787}.fail{color:#ff7b72;font-weight:bold}
  /* ---- 动画 ---- */
  @keyframes playIn{from{opacity:0;transform:translateY(-16px) scale(.85)}to{opacity:1;transform:none}}
  .played .card{animation:playIn .28s ease-out}
  @keyframes winPulse{0%,100%{box-shadow:none}50%{box-shadow:0 0 14px var(--gold)}}
  .seat .name.won{animation:winPulse .9s ease-in-out 2;background:var(--gold);color:#222}
  #hand .card:hover{transform:translateY(-6px)}
  #hand .card.sel:hover{transform:translateY(-14px)}
  #versionTag{position:fixed;right:10px;bottom:4px;font-size:11px;color:rgba(255,255,255,.3);
              pointer-events:none;z-index:1}
  /* ---- 窄屏竖屏(手机竖握):左右两栏塞不下,改上下叠,整体仍锁一屏 ---- */
  @media (max-width:820px) and (orientation:portrait){
    :root{--cardW:clamp(32px,9vw,50px)}
    #app{grid-template-columns:minmax(0,1fr);
         grid-template-rows:auto minmax(0,1.35fr) minmax(0,1fr)}
    #main,#side{grid-column:1}
    #status{gap:8px}
  }
  /* ---- 横屏(含手机横握):一律保持左右布局,侧栏收窄给牌桌让位 ---- */
  @media (orientation:landscape) and (max-height:600px){
    :root{--cardW:clamp(32px,2.4vw + 1.6vh,48px)}
    #app{grid-template-columns:minmax(0,1fr) clamp(170px,20vw,290px);gap:6px;padding:6px}
    /* 竖向空间紧,状态栏不许折行,超出就横向滑动 */
    #status{gap:10px;padding:4px 10px;flex-wrap:nowrap;overflow-x:auto;white-space:nowrap}
    #controls{gap:6px;padding:2px}
    /* 横屏收紧但仍保持三区按钮同尺寸(只等比缩,不打破一致性);
       min-width 必须仍能包住最长文案「亮无将(大)」,否则它会独自变宽 */
    #controls button{padding:4px 6px;min-width:6.4em}
    #tabs{gap:4px}
    #tabs button{padding:4px 7px}
    /* 25 张挤一行(重叠多一点),省下的高度还给牌桌 */
    #hand{padding:2px;min-height:calc(var(--cardH) + 8px)}
    #hand .card{margin-left:calc(var(--cardW)*-.46)}
    #hand .card:first-child{margin-left:0}
  }
</style>
</head>
<body>

<div id="app">
  <div id="status"></div>
  <div id="main">
    <div id="table">
      <div class="seat" style="grid-area:1/2"><span class="name" id="n2">北(队友)</span><span class="backs" id="b2"></span></div>
      <div class="seat" style="grid-area:2/1"><span class="name" id="n3">西</span><span class="backs" id="b3"></span></div>
      <div class="seat" style="grid-area:2/3"><span class="name" id="n1">东</span><span class="backs" id="b1"></span></div>
      <div id="center">
        <div class="played" id="p2" style="grid-area:1/2"></div>
        <div class="played" id="p3" style="grid-area:2/1"></div>
        <div id="msg" style="grid-area:2/2"></div>
        <div class="played" id="p1" style="grid-area:2/3"></div>
        <div class="played" id="p0" style="grid-area:3/2"></div>
      </div>
      <div class="seat" style="grid-area:3/2;align-self:end"><span class="name" id="n0">南(你)</span></div>
    </div>
    <div id="hand"></div>
    <!-- 底部三区(虚拟分区,不画线):发牌互动区靠左 / 主操作区居中 / 庄家区靠右 -->
    <div id="controls">
      <div id="dealZone"></div>
      <div id="mainZone">
        <button id="btnPlay">出牌</button>
        <button id="btnClear" class="minor">重选</button>
        <button id="btnHint" style="background:#6ec9ff">问教练</button>
      </div>
      <div id="dealerZone">
        <button id="btnBury" class="minor">扣底</button>
        <button id="btnKitty" class="minor" onclick="window.__showKitty()">看底牌</button>
      </div>
    </div>
  </div>
  <div id="side">
    <div id="tabs">
      <button data-tab="score">抢分记录</button>
      <button data-tab="log">对局记录</button>
      <button data-tab="hist">出牌历史</button>
      <button data-tab="coach">教练</button>
      <button data-tab="mem">记牌表</button>
      <button data-tab="notes">笔记</button>
    </div>
    <div id="panel"></div>
  </div>
</div>
<div id="overlay"><div class="panel" id="overlayContent"></div></div>
<div id="setOverlay"><div class="panel" id="setContent"></div></div>
<div id="tests"></div>
<div id="versionTag">80分 v0.3.0-dev(开发版)</div>

<script src="terms-shanghai.js"></script>
<script>
/* ============================================================
 * 80分 游戏引擎 —— 纯函数,不碰 DOM。
 * trump = {suit:'S'|'H'|'D'|'C'|null, rank}。suit 为 null 表示无主。
 * ============================================================ */

const RULES = {
  levelStart: 2,
  handSize: 25,
  kittySize: 8,
  // 抠底倍数 = 最后一墩每人出牌数 × 2
  kittyMultiplier: (lastLeadSize)=>2*(lastLeadSize||1),
  offsuitRankTractor: true,     // 主AA+副常主对可连(常驻)
  strictTractorFollow: true,    // 领出拖拉机、手中有同长(或更长可拆)拖拉机必须跟
  partialTractorFollow: true,   // 【可调】领出长拖拉机、手中只有更短拖拉机时必须跟出短的(默认开)
  pointRebelThreshold: 15,      // 【可调】手牌分数 ≤ 此值可完全造反(5的倍数,≤30;0=关闭)
  trumpRebelThreshold: 3,       // 【可调】手牌主牌张数 ≤ 此值也可完全造反(-1=关闭)
  maxRedeal: 3,                 // 同一局最多连续重新发牌次数(防止一直重发)
};

const SUITS = ['S','H','D','C'];

function makeDeck(){                      // 两副牌 108 张,id 唯一
  const cards=[]; let id=0;
  for(let copy=0;copy<2;copy++){
    for(const s of SUITS) for(let r=2;r<=14;r++) cards.push({suit:s,rank:r,id:id++});
    cards.push({suit:'X',rank:15,id:id++});   // 小王
    cards.push({suit:'X',rank:16,id:id++});   // 大王
  }
  return cards;
}

function cardPoints(c){ return c.rank===5?5 : (c.rank===10||c.rank===13)?10 : 0; }
function countPoints(cards){ return cards.reduce((a,c)=>a+cardPoints(c),0); }

function rng(seed){ let a=seed>>>0; return function(){ a|=0; a=(a+0x6D2B79F5)|0;
  let t=Math.imul(a^(a>>>15),1|a); t=(t+Math.imul(t^(t>>>7),61|t))^t;
  return ((t^(t>>>14))>>>0)/4294967296; }; }

function shuffle(arr, rand){ const a=arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(rand()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a; }

// 切牌定先:各抽一张按自然大小(无级数,A>K>…>2,王最大;平手按黑桃>红桃>梅花>方块)
function cutForFirst(seed){
  const deck=shuffle(makeDeck(), rng(seed*7+3));
  const cuts=[0,1,2,3].map(s=>deck[s]);
  const sv={S:3,H:2,C:1,D:0,X:4};
  let first=0;
  for(let s=1;s<4;s++){
    const a=cuts[s],b=cuts[first];
    if(a.rank>b.rank||(a.rank===b.rank&&sv[a.suit]>sv[b.suit])) first=s;
  }
  return {cuts, first};
}

// firstTaker 先拿牌,逆时针轮流;前 100 张为手牌,后 8 张为底
function dealRound(seed, firstTaker=0){
  const deck=shuffle(makeDeck(), rng(seed));
  const hands=[[],[],[],[]];
  for(let i=0;i<100;i++) hands[(firstTaker+i)%4].push(deck[i]);
  return {hands, kitty:deck.slice(100), deck};
}

// ---- 主牌与大小序 ----
function effSuit(c, trump){
  if(c.suit==='X' || c.rank===trump.rank) return 'T';
  if(trump.suit && c.suit===trump.suit) return 'T';
  return c.suit;
}

function natOrder(trumpRank){ const r=[]; for(let x=2;x<=14;x++) if(x!==trumpRank) r.push(x); return r; }

// 有主:0..11 主花色散牌,12 副常主,13 正常主,14 小王,15 大王。
// 相邻可连:主A+副常、副常+正常、正常+小王、小王+大王;异花副常同级不连。
// 无主:13 常主(各花色同级),14 小王,15 大王。
function ordIdx(c, trump){
  if(c.rank===16) return 15;
  if(c.rank===15) return 14;
  if(c.rank===trump.rank){
    if(!trump.suit) return 13;
    return c.suit===trump.suit?13:12;
  }
  return natOrder(trump.rank).indexOf(c.rank);
}

// ---- 牌型判定 ----
function pairKey(c){ return c.suit+':'+c.rank; }

function decompose(cards, trump){
  const by={};
  for(const c of cards)(by[pairKey(c)]=by[pairKey(c)]||[]).push(c);
  const pairs=[], singles=[];
  for(const k in by){
    const arr=by[k];
    if(arr.length>=2) pairs.push([arr[0],arr[1]]);
    if(arr.length%2===1) singles.push(arr[arr.length-1]);
  }
  pairs.sort((a,b)=>ordIdx(a[0],trump)-ordIdx(b[0],trump));
  const comps=[]; let run=[];
  const flush=()=>{
    if(!run.length) return;
    if(run.length>=2) comps.push({type:'tractor',len:run.length,cards:run.flat(),
                                  top:ordIdx(run[run.length-1][0],trump)});
    else comps.push({type:'pair',cards:run[0],top:ordIdx(run[0][0],trump)});
    run=[];
  };
  for(const p of pairs){
    if(run.length && ordIdx(p[0],trump)===ordIdx(run[run.length-1][0],trump)+1) run.push(p);
    else { flush(); run=[p]; }
  }
  flush();
  for(const s of singles) comps.push({type:'single',cards:[s],top:ordIdx(s,trump)});
  return comps;
}

function classify(cards, trump){
  if(!cards||!cards.length) return null;
  const es=effSuit(cards[0],trump);
  if(!cards.every(c=>effSuit(c,trump)===es)) return null;
  if(cards.length===1) return {type:'single',suit:es,top:ordIdx(cards[0],trump),cards};
  const comps=decompose(cards,trump);
  if(comps.length===1){ const c=comps[0]; return {type:c.type,len:c.len,suit:es,top:c.top,cards}; }
  return {type:'throw',suit:es,cards,comps,top:Math.max(...comps.map(c=>c.top))};
}

// ---- 跟牌合法性(门内有对必对) ----
function countPairsIn(cards){
  const by={}; for(const c of cards) by[pairKey(c)]=(by[pairKey(c)]||0)+1;
  return Object.values(by).reduce((a,n)=>a+Math.floor(n/2),0);
}
function maxTractorLen(cards, trump){
  return Math.max(0,...decompose(cards,trump).filter(c=>c.type==='tractor').map(c=>c.len));
}
function pairsInLead(lead){
  if(lead.type==='pair') return 1;
  if(lead.type==='tractor') return lead.len;
  if(lead.type==='throw') return lead.comps.reduce((a,c)=>a+(c.type==='pair'?1:c.type==='tractor'?c.len:0),0);
  return 0;
}

function isLegalFollow(hand, lead, chosen, trump){
  const n=lead.cards.length;
  if(chosen.length!==n) return false;
  const ids=new Set(hand.map(c=>c.id));
  const seen=new Set();
  for(const c of chosen){ if(!ids.has(c.id)||seen.has(c.id)) return false; seen.add(c.id); }
  const suitInHand=hand.filter(c=>effSuit(c,trump)===lead.suit);
  const chosenInSuit=chosen.filter(c=>effSuit(c,trump)===lead.suit);
  if(chosenInSuit.length!==Math.min(n,suitInHand.length)) return false;
  const need=pairsInLead(lead);
  if(need>0){
    const must=Math.min(need,countPairsIn(suitInHand));
    if(countPairsIn(chosenInSuit)<must) return false;
  }
  if(RULES.strictTractorFollow && lead.type==='tractor'){
    const m=maxTractorLen(suitInHand,trump);
    const cm=maxTractorLen(chosenInSuit,trump);
    if(m>=lead.len && cm<lead.len) return false;                    // 有长必跟(可拆子拖拉机)
    if(RULES.partialTractorFollow && m>=2 && m<lead.len && cm<m) return false; // 【可调】短拖也必须跟
  }
  return true;
}

// ---- 一墩胜负 ----
function structSig(comps){ return comps.map(c=>c.type+(c.len||'')).sort().join(','); }
function structMatches(cand, lead){
  const a=cand.type==='throw'?cand.comps:[cand];
  const b=lead.type==='throw'?lead.comps:[lead];
  return structSig(a)===structSig(b);
}

function resolveTrick(plays, trump){
  const lead=classify(plays[0].cards,trump);
  let winIdx=0, best=lead;
  for(let i=1;i<plays.length;i++){
    const cl=classify(plays[i].cards,trump);
    if(!cl || !structMatches(cl,lead)) continue;
    if(cl.suit===best.suit){ if(cl.top>best.top){winIdx=i;best=cl;} }
    else if(cl.suit==='T'){ winIdx=i; best=cl; }
  }
  return {winner:plays[winIdx].seat,
          points:countPoints(plays.flatMap(p=>p.cards)),
          winningPlay:best};
}

// ---- 甩牌校验(失败仅强制出小,不罚分) ----
function canBeatComp(suitCards, comp, trump){
  if(comp.type==='single') return suitCards.some(c=>ordIdx(c,trump)>comp.top);
  const comps=decompose(suitCards,trump);
  if(comp.type==='pair')
    return comps.some(c=>(c.type==='pair'||c.type==='tractor')&&c.top>comp.top);
  return comps.some(c=>c.type==='tractor'&&c.len>=comp.len&&c.top>comp.top);
}
function checkThrow(hands, seat, cards, trump){
  const lead=classify(cards,trump);
  if(!lead||lead.type!=='throw') return {ok:true};
  for(const comp of lead.comps){
    for(let p=0;p<4;p++){
      if(p===seat) continue;
      const sc=hands[p].filter(c=>effSuit(c,trump)===lead.suit);
      if(canBeatComp(sc,comp,trump)){
        const lowest=lead.comps.reduce((a,c)=>c.top<a.top?c:a);
        return {ok:false, forced:lowest.cards};
      }
    }
  }
  return {ok:true};
}

// ---- 亮主/反主/造反/加固 ----
// strength: 1=单张常主,2=一对常主,3=小王对,4=大王对(王对→无主)。
function declarationOf(cards, trumpRank){
  if(cards.length===1 && cards[0].rank===trumpRank) return {suit:cards[0].suit,strength:1};
  if(cards.length===2 && pairKey(cards[0])===pairKey(cards[1])){
    if(cards[0].rank===trumpRank) return {suit:cards[0].suit,strength:2};
    if(cards[0].rank===15) return {suit:null,strength:3};
    if(cards[0].rank===16) return {suit:null,strength:4};
  }
  return null;
}
function canOverride(cur, next){ return !cur || next.strength>cur.strength; }
function declOptions(hand, trumpRank){
  const opts=[];
  for(const s of SUITS){
    const n=hand.filter(c=>c.suit===s&&c.rank===trumpRank).length;
    if(n>=2) opts.push({suit:s,strength:2});
    else if(n===1) opts.push({suit:s,strength:1});
  }
  return opts.sort((a,b)=>b.strength-a.strength);
}
function jokerPairOf(hand){
  const bj=hand.filter(c=>c.rank===16).length, sj=hand.filter(c=>c.rank===15).length;
  if(bj>=2) return {suit:null,strength:4};
  if(sj>=2) return {suit:null,strength:3};
  return null;
}
// 定主后谁坐庄。庄定盘:庄家恒不变 —— 亮主/反主/王对造反都只改主色,不易庄不拿底;
// 无庄盘(首局、或完全造反后的抢庄盘):最终亮主者坐庄,无人亮主则先拿牌者坐庄。
function dealerAfterDecl({dealerKnown, dealer, declSeat, firstTaker}){
  if(dealerKnown) return dealer;
  return declSeat>=0?declSeat:firstTaker;
}

// 加固:仅亮主者本人、单张→一对、且必须先于任何造反(王对/低分造反)
function canReinforce2(decl, seat, hand, trumpRank, rebelHappened){
  if(!decl||decl.seat!==seat||decl.strength!==1||rebelHappened||decl.suit===null) return false;
  return hand.filter(c=>c.suit===decl.suit&&c.rank===trumpRank).length>=2;
}

// 完全造反资格:手牌分数 ≤ pointRebelThreshold,或主牌张数 ≤ trumpRebelThreshold
function canFullRebel(hand, trump){
  const p=RULES.pointRebelThreshold, t=RULES.trumpRebelThreshold;
  const pts=countPoints(hand);
  const nT=hand.filter(c=>effSuit(c,trump)==='T').length;
  const byPts=p>0&&pts<=p, byTrump=t>=0&&nT<=t;
  return {ok:byPts||byTrump, pts, nT, byPts, byTrump};
}

// ---- 本局结算 ----
function scoreRound({defPoints, kitty, defWonLastTrick, lastLeadSize}){
  const kittyPts=countPoints(kitty);
  const mult=RULES.kittyMultiplier(lastLeadSize);
  const total=defPoints + (defWonLastTrick ? kittyPts*mult : 0);
  if(total<80){
    return {defendersWin:false, total, kittyPts, mult, declarerLevelsUp: total===0?3 : total<40?2 : 1};
  }
  return {defendersWin:true, total, kittyPts, mult, defenderLevelsUp: Math.floor((total-80)/40)};
}

// ---- 整场推进:升级与庄家轮换 ----
// 庄家方守住 → 升级、前庄对家连庄;闲家上台 → 闲家升级、前庄下家坐庄。
// 任一队级数打过 A(>14)整场获胜。
function advanceMatch(levels, declSeat, sc){
  const declTeam=declSeat%2;
  const L=levels.slice();
  let dealer;
  if(!sc.defendersWin){ L[declTeam]+=sc.declarerLevelsUp; dealer=(declSeat+2)%4; }
  else { L[1-declTeam]+=sc.defenderLevelsUp; dealer=(declSeat+1)%4; }
  const matchOver=L[0]>14||L[1]>14;
  return {levels:L, dealer, matchOver, winnerTeam:matchOver?(L[0]>14?0:1):null};
}

/* ---- 随机合法 AI(M3 换启发式) ---- */
function removeCard(hand,c){ const i=hand.findIndex(x=>x.id===c.id); hand.splice(i,1); }
function pickRandom(arr,k,rand){ return shuffle(arr,rand).slice(0,k); }

function aiLead(hand, trump, rand){
  if(rand()<0.3){
    const bySuit={};
    hand.forEach(c=>{(bySuit[effSuit(c,trump)]=bySuit[effSuit(c,trump)]||[]).push(c);});
    const pairs=[];
    for(const s in bySuit) decompose(bySuit[s],trump).forEach(c=>{
      if(c.type==='pair') pairs.push(c.cards);
      if(c.type==='tractor') for(let i=0;i<c.len;i++) pairs.push(c.cards.slice(i*2,i*2+2));
    });
    if(pairs.length) return pairs[Math.floor(rand()*pairs.length)];
  }
  return [hand[Math.floor(rand()*hand.length)]];
}

function bruteFollow(hand, lead, trump, rand){
  const n=lead.cards.length;
  for(let t=0;t<300;t++){
    const c=pickRandom(hand,n,rand);
    if(isLegalFollow(hand,lead,c,trump)) return c;
  }
  return hand.slice(0,n);
}

function genFollow(hand, lead, trump, rand){
  const n=lead.cards.length;
  const inSuit=hand.filter(c=>effSuit(c,trump)===lead.suit);
  const rest=hand.filter(c=>effSuit(c,trump)!==lead.suit);
  let chosen=[];
  if(inSuit.length<=n){
    chosen=[...inSuit, ...pickRandom(rest,n-inSuit.length,rand)];
  }else{
    const comps=decompose(inSuit,trump);
    if(RULES.strictTractorFollow && lead.type==='tractor'){
      const full=comps.find(c=>c.type==='tractor'&&c.len>=lead.len);
      if(full) chosen=full.cards.slice(0,lead.len*2);
      else if(RULES.partialTractorFollow){
        const part=comps.filter(c=>c.type==='tractor').sort((a,b)=>b.len-a.len)[0];
        if(part) chosen=part.cards.slice();
      }
    }
    const targetPairs=Math.min(pairsInLead(lead),countPairsIn(inSuit));
    if(targetPairs>0){
      const used=new Set(chosen.map(c=>c.id));
      const pairUnits=[];
      comps.forEach(c=>{
        if(c.type==='pair') pairUnits.push(c.cards);
        if(c.type==='tractor') for(let i=0;i<c.len;i++) pairUnits.push(c.cards.slice(i*2,i*2+2));
      });
      let have=Math.floor(chosen.length/2);
      for(const u of pairUnits){
        if(have>=targetPairs||chosen.length+2>n) break;
        if(u.some(c=>used.has(c.id))) continue;
        u.forEach(c=>used.add(c.id));
        chosen.push(...u); have++;
      }
    }
    const used2=new Set(chosen.map(c=>c.id));
    chosen.push(...pickRandom(inSuit.filter(c=>!used2.has(c.id)),n-chosen.length,rand));
  }
  return isLegalFollow(hand,lead,chosen,trump)?chosen:bruteFollow(hand,lead,trump,rand);
}

// 埋底 v2:造缺短门、不埋分、不拆对、留A/K、绝不埋主(攻略共识)
function aiDiscard(hand, trump){
  const groups={};
  hand.forEach(c=>{const s=effSuit(c,trump);(groups[s]=groups[s]||[]).push(c);});
  const w=c=>{
    const s=effSuit(c,trump);
    if(s==='T') return 1000+ordIdx(c,trump);
    const g=groups[s];
    const isPair=g.filter(x=>pairKey(x)===pairKey(c)).length>=2;
    const shortBonus=g.length<=RULES.kittySize ? -40+g.length*6 : 0;  // 短门整门埋掉造缺
    return ordIdx(c,trump)
      +(cardPoints(c)?60:0)     // 别埋分(抠底翻倍伤不起)
      +(isPair?35:0)            // 别拆对
      +(c.rank>=13?30:0)        // 留 A/K 控门
      +shortBonus;
  };
  return hand.map(c=>({c,w:w(c)})).sort((a,b)=>a.w-b.w)
             .slice(0,RULES.kittySize).map(x=>x.c);
}

// 缺门推断:从出牌历史看谁在哪门没跟牌(每4手为一墩,首手为领出)
function makeVoids(history, trump){
  const voids=[{},{},{},{}];
  for(let i=0;i<history.length;i+=4){
    const trick=history.slice(i,i+4);
    const lead=classify(trick[0].cards,trump);
    if(!lead) continue;
    for(let j=1;j<trick.length;j++){
      if(trick[j].cards.some(c=>effSuit(c,trump)!==lead.suit))
        voids[trick[j].seat][lead.suit]=true;
    }
  }
  return voids;
}

/* ============================================================
 * M3 启发式 AI:记牌 + 规则评估。
 * 返回 {cards, reason, score} —— reason 供教练模式复用。
 * view = {seat, hand, trump, history:[{seat,cards}...], buriedKnown}
 * ============================================================ */
function keyToCard(k){ const i=k.indexOf(':'); return {suit:k.slice(0,i),rank:+k.slice(i+1)}; }

// 记牌:已见 = 自己手牌 + 全部出牌历史 + (庄家还知道底牌)
function makeMemory(view){
  const seen={};
  const add=c=>{ const k=pairKey(c); seen[k]=(seen[k]||0)+1; };
  view.hand.forEach(add);
  (view.history||[]).forEach(p=>p.cards.forEach(add));
  (view.buriedKnown||[]).forEach(add);
  const unseen={};
  makeDeck().slice(0,54).forEach(c=>{ const k=pairKey(c); unseen[k]=2-(seen[k]||0); });
  return {unseen};
}
function maxUnseenIdx(mem, suitEff, trump){
  let m=-1;
  for(const k in mem.unseen){
    if(mem.unseen[k]<=0) continue;
    const c=keyToCard(k);
    if(effSuit(c,trump)!==suitEff) continue;
    m=Math.max(m,ordIdx(c,trump));
  }
  return m;
}
function unseenPairAbove(mem, suitEff, idx, trump){
  for(const k in mem.unseen){
    if(mem.unseen[k]<2) continue;
    const c=keyToCard(k);
    if(effSuit(c,trump)===suitEff && ordIdx(c,trump)>idx) return true;
  }
  return false;
}
// 该牌型是否已是本门在外最大(“钢板”)
function isBossPlay(cl, mem, trump){
  if(cl.type==='single') return cl.top>=maxUnseenIdx(mem,cl.suit,trump);
  return !unseenPairAbove(mem,cl.suit,cl.top,trump);
}

const cheapSort=(cards,trump)=>cards.slice().sort((a,b)=>
  (ordIdx(a,trump)+(cardPoints(a)?8:0))-(ordIdx(b,trump)+(cardPoints(b)?8:0)));
const dumpSort=(cards,trump)=>cards.slice().sort((a,b)=>
  (cardPoints(b)-cardPoints(a))||(ordIdx(a,trump)-ordIdx(b,trump)));
// 垫牌排序:优先垫短门(造缺)、不拆对、不垫分、不垫A/K、绝不垫主
const discardSort=(cards,trump)=>{
  const groups={};
  cards.forEach(c=>{const s=effSuit(c,trump);(groups[s]=groups[s]||[]).push(c);});
  const v=c=>{
    const s=effSuit(c,trump);
    if(s==='T') return 500+ordIdx(c,trump);
    const g=groups[s];
    const isPair=g.filter(x=>pairKey(x)===pairKey(c)).length>=2;
    return ordIdx(c,trump)+(cardPoints(c)?30:0)+(isPair?14:0)
          +(c.rank>=13?10:0)+(g.length<=2?-5:0);
  };
  return cards.slice().sort((a,b)=>v(a)-v(b));
};

// 构造性跟牌:满足全部义务,自由部分按策略挑(cheap=跟小 / dump=贴分)。seed 为预选结构。
function buildFollow(hand, lead, trump, strat, seed){
  const n=lead.cards.length;
  const inSuit=hand.filter(c=>effSuit(c,trump)===lead.suit);
  const rest=hand.filter(c=>effSuit(c,trump)!==lead.suit);
  let chosen=(seed||[]).slice();
  const used=new Set(chosen.map(c=>c.id));
  const fillSort=strat==='dump'?dumpSort:cheapSort;
  if(inSuit.length<=n){
    inSuit.forEach(c=>{ if(!used.has(c.id)){chosen.push(c);used.add(c.id);} });
    const restSort=strat==='dump'?dumpSort(rest,trump):discardSort(rest,trump);  // 垫牌讲究:造缺不拆对
    for(const c of restSort){ if(chosen.length>=n)break;
      if(!used.has(c.id)){chosen.push(c);used.add(c.id);} }
  }else{
    const comps=decompose(inSuit,trump);
    if(RULES.strictTractorFollow && lead.type==='tractor' && !chosen.length){
      const full=comps.find(c=>c.type==='tractor'&&c.len>=lead.len);
      if(full) full.cards.slice(0,lead.len*2).forEach(c=>{chosen.push(c);used.add(c.id);});
      else if(RULES.partialTractorFollow){
        const part=comps.filter(c=>c.type==='tractor').sort((a,b)=>b.len-a.len)[0];
        if(part) part.cards.forEach(c=>{chosen.push(c);used.add(c.id);});
      }
    }
    const targetPairs=Math.min(pairsInLead(lead),countPairsIn(inSuit));
    let have=Math.floor(chosen.length/2);
    if(targetPairs>have){
      const units=[];
      comps.forEach(c=>{
        if(c.type==='pair') units.push(c.cards);
        if(c.type==='tractor') for(let i=0;i<c.len;i++) units.push(c.cards.slice(i*2,i*2+2));
      });
      const uval=u=>strat==='dump'
        ? -countPoints(u)*10+ordIdx(u[0],trump)
        : ordIdx(u[0],trump)+(countPoints(u)?16:0);
      units.sort((a,b)=>uval(a)-uval(b));
      for(const u of units){
        if(have>=targetPairs||chosen.length+2>n) break;
        if(u.some(c=>used.has(c.id))) continue;
        u.forEach(c=>{chosen.push(c);used.add(c.id);}); have++;
      }
    }
    for(const c of fillSort(inSuit.filter(c=>!used.has(c.id)),trump)){
      if(chosen.length>=n) break;
      chosen.push(c); used.add(c.id);
    }
  }
  return isLegalFollow(hand,lead,chosen,trump)?chosen:null;
}

// 当前墩暂时的赢家
function currentWinner(plays, trump){
  const lead=classify(plays[0].cards,trump);
  let win=0,best=lead;
  for(let i=1;i<plays.length;i++){
    const cl=classify(plays[i].cards,trump);
    if(!cl||!structMatches(cl,lead)) continue;
    if(cl.suit===best.suit){ if(cl.top>best.top){win=i;best=cl;} }
    else if(cl.suit==='T'){ win=i;best=cl; }
  }
  return {seat:plays[win].seat, cl:best};
}

// 最省的吃法(本门压过,或断门时用主敲脱);吃不动返回 null
function minWinFollow(hand, lead, trump, curBest){
  if(lead.type==='throw') return null;
  const n=lead.cards.length;
  const inSuit=hand.filter(c=>effSuit(c,trump)===lead.suit);
  const pairUnitsOf=cards=>{
    const us=[];
    decompose(cards,trump).forEach(c=>{
      if(c.type==='pair') us.push(c.cards);
      if(c.type==='tractor') for(let i=0;i<c.len;i++) us.push(c.cards.slice(i*2,i*2+2));
    });
    return us;
  };
  let seed=null;
  if(inSuit.length>=n){
    if(curBest.suit!==lead.suit) return null;   // 已被主吃,本门压不了
    if(lead.type==='single'){
      const c=cheapSort(inSuit.filter(x=>ordIdx(x,trump)>curBest.top),trump)[0];
      if(c) seed=[c];
    }else if(lead.type==='pair'){
      seed=pairUnitsOf(inSuit).filter(u=>ordIdx(u[0],trump)>curBest.top)
        .sort((a,b)=>ordIdx(a[0],trump)-ordIdx(b[0],trump))[0]||null;
    }else{
      const tr=decompose(inSuit,trump)
        .filter(c=>c.type==='tractor'&&c.len>=lead.len&&c.top>curBest.top)
        .sort((a,b)=>a.top-b.top)[0];
      if(tr) seed=tr.cards.slice((tr.len-lead.len)*2);
    }
  }else if(inSuit.length===0 && lead.suit!=='T'){
    const trumps=hand.filter(c=>effSuit(c,trump)==='T');
    if(trumps.length<n) return null;
    const mustBeat=curBest.suit==='T'?curBest.top:-1;
    if(lead.type==='single'){
      const c=cheapSort(trumps.filter(x=>ordIdx(x,trump)>mustBeat),trump)[0];
      if(c) seed=[c];
    }else if(lead.type==='pair'){
      seed=pairUnitsOf(trumps).filter(u=>ordIdx(u[0],trump)>mustBeat)
        .sort((a,b)=>ordIdx(a[0],trump)-ordIdx(b[0],trump))[0]||null;
    }else{
      const tr=decompose(trumps,trump)
        .filter(c=>c.type==='tractor'&&c.len>=lead.len&&c.top>mustBeat)
        .sort((a,b)=>a.top-b.top)[0];
      if(tr) seed=tr.cards.slice((tr.len-lead.len)*2);
    }
  }
  if(!seed) return null;
  return buildFollow(hand,lead,trump,'cheap',seed);
}

// ---- 跟牌共享上下文(AI 与教练同一标尺) ----
function followCtx(view, plays){
  const trump=view.trump;
  const lead=classify(plays[0].cards,trump);
  const cur=currentWinner(plays,trump);
  const partnerWinning=cur.seat%2===view.seat%2;
  const isLast=plays.length===3;
  const ptsTable=countPoints(plays.flatMap(p=>p.cards));
  const mem=makeMemory(view);
  const voids=makeVoids(view.history||[],trump);
  const leader=plays[0].seat;
  const remaining=[];                       // 我之后还没出牌的座位
  for(let i=plays.length+1;i<4;i++) remaining.push((leader+i)%4);
  const remainingOpp=remaining.filter(s=>s%2!==view.seat%2);
  // 后手对手在本门缺门 → 即使钢板也可能被敲脱("毙上家放下家")
  const oppRuffRisk=lead.suit!=='T'&&remainingOpp.some(s=>voids[s][lead.suit]);
  const curBoss=isBossPlay(cur.cl,mem,trump)&&!oppRuffRisk;
  const certainty=isLast?1:(curBoss?0.9:(remainingOpp.length?0.35:0.75));
  return {trump,lead,cur,partnerWinning,isLast,ptsTable,mem,voids,
          remainingOpp,oppRuffRisk,curBoss,certainty};
}
function scoreWinPlay(X,cards){
  const cost=Math.max(...cards.map(c=>ordIdx(c,X.trump)))+countPoints(cards)*2;
  let s=30+X.ptsTable*1.5+(X.isLast?25:0)-cost*0.8;
  if(!X.isLast&&X.oppRuffRisk){
    const cl=classify(cards,X.trump);
    if(cl&&cl.suit!=='T') s-=12;            // 本门吃但后手对手可能毙
  }
  return s;
}
function scoreDumpPlay(X,cards){ return X.certainty*(20+countPoints(cards)*4); }
function scoreCheapPlay(X,cards){ return 10-countPoints(cards)*5; }

// 跟牌决策
function aiChooseFollow(view, plays){
  const X=followCtx(view,plays);
  const {trump,lead}=X;
  const cands=[];
  if(!X.partnerWinning){
    const win=minWinFollow(view.hand,lead,trump,X.cur.cl);
    if(win) cands.push({cards:win,score:scoreWinPlay(X,win),
      reason:X.isLast?'最后一手,稳吃这墩':(X.oppRuffRisk?'尝试吃,但后手或被毙':'能吃住,争这墩')});
  }else{
    const dump=buildFollow(view.hand,lead,trump,'dump',null);
    if(dump) cands.push({cards:dump,score:scoreDumpPlay(X,dump),
      reason:X.certainty>0.8?'队友稳赢,贴分':'队友暂大,试贴分'});
  }
  const cheap=buildFollow(view.hand,lead,trump,'cheap',null);
  if(cheap) cands.push({cards:cheap,score:scoreCheapPlay(X,cheap),reason:'跟小,保留实力'});
  cands.sort((a,b)=>b.score-a.score);
  const ctx={partnerWinning:X.partnerWinning,isLast:X.isLast,ptsTable:X.ptsTable,
             curSeat:X.cur.seat,curBoss:X.curBoss,leadSuit:lead.suit};
  if(cands.length) return {...cands[0],cands,ctx};
  return {cards:genFollow(view.hand,lead,trump,rng(view.seat+1)),reason:'兜底',score:0,cands:[],ctx};
}

// 教练用:给任意一手(合法)跟牌打分,与 aiChooseFollow 同一套标尺
function coachScoreFollow(view, plays, cards){
  const X=followCtx(view,plays);
  const cl=classify(cards,X.trump);
  let wouldWin=false;
  if(cl&&structMatches(cl,X.lead)){
    if(cl.suit===X.cur.cl.suit) wouldWin=cl.top>X.cur.cl.top;
    else if(cl.suit==='T') wouldWin=true;
  }
  if(wouldWin&&!X.partnerWinning) return scoreWinPlay(X,cards);
  if(X.partnerWinning) return scoreDumpPlay(X,cards)-(wouldWin?5:0);  // 压过队友略减分
  return scoreCheapPlay(X,cards);
}

// ---- 领出共享上下文与评分(AI 与教练同一标尺) ----
function leadCtx(view){
  const trump=view.trump;
  const mem=makeMemory(view);
  const voids=makeVoids(view.history||[],trump);
  const myTeam=view.seat%2;
  const oppVoid=s=>[0,1,2,3].some(p=>p%2!==myTeam&&voids[p][s]);
  const partnerVoid=s=>!!voids[(view.seat+2)%4][s];
  const nTrump=view.hand.filter(c=>effSuit(c,trump)==='T').length;
  const isDecl=view.declSeat!==undefined&&view.declSeat>=0&&view.declSeat%2===myTeam;
  return {trump,mem,voids,oppVoid,partnerVoid,nTrump,isDecl};
}
function scoreLeadPlay(L, cl, cards){
  const {trump,mem}=L;
  if(!cl) return {score:-20,reason:'不成牌型'};
  const comps=cl.type==='throw'?cl.comps:[cl];
  const allBoss=comps.every(c=>isBossPlay({type:c.type,len:c.len,suit:cl.suit,top:c.top},mem,trump));
  const pts=countPoints(cards), size=cards.length;
  const ruffable=cl.suit!=='T'&&L.oppVoid(cl.suit);
  if(cl.type==='throw'){
    if(allBoss&&!ruffable) return {score:68+size*3,reason:'整门都是最大,甩牌施压'};
    return {score:5-pts*4,reason:'甩牌有风险'};
  }
  if(allBoss){
    let s=55+size*8, reason='本门在外已无更大,先收一墩';
    if(cl.suit==='T'&&cl.type==='single'){ s-=33; reason='大主牌留作后手'; }
    else if(cl.suit==='T') s-=5;
    if(ruffable){ s-=35; reason='虽是钢板,但对手缺门可能被毙'; if(pts) s-=10; }
    return {score:s,reason};
  }
  if(cl.type==='tractor') return {score:30+size*4-(ruffable?10:0),reason:'拖拉机难跟,压一手'};
  if(cl.type==='pair')
    return {score:20-cl.top*0.5-pts*4-(ruffable?8:0),
            reason:pts?'分对慎出,无保护先探路':'出对子探路'};
  let s=16-cl.top*0.8-pts*6-(cl.suit==='T'?6:0)-(ruffable&&pts?8:0), reason='小牌探路';
  if(L.partnerVoid(cl.suit)&&!pts){ s+=8; reason='队友缺这门,给他机会'; }
  return {score:s,reason};
}

// 领出决策
function aiChooseLead(view){
  const L=leadCtx(view);
  const {trump}=L;
  const bySuit={};
  view.hand.forEach(c=>{(bySuit[effSuit(c,trump)]=bySuit[effSuit(c,trump)]||[]).push(c);});
  const cands=[];
  for(const s in bySuit){
    const comps=decompose(bySuit[s],trump);
    for(const comp of comps){
      const cl={type:comp.type,len:comp.len,suit:s,top:comp.top,cards:comp.cards};
      const r=scoreLeadPlay(L,cl,comp.cards);
      cands.push({cards:comp.cards,score:r.score,reason:r.reason});
    }
    // 甩牌候选:整门多组件且全是钢板(引擎 checkThrow 仍会最终把关)
    if(s!=='T'&&comps.length>=2&&bySuit[s].length<=6){
      const cl=classify(bySuit[s],trump);
      if(cl&&cl.type==='throw'){
        const r=scoreLeadPlay(L,cl,bySuit[s]);
        if(r.score>40) cands.push({cards:bySuit[s],score:r.score,reason:r.reason});
      }
    }
  }
  // 吊主清场:庄家方且主力雄厚(≥8张),用非王主牌吊,大怪留后手
  if(L.isDecl&&L.nTrump>=8){
    const nonJoker=(bySuit['T']||[]).filter(c=>c.suit!=='X');
    const comps=decompose(nonJoker,trump);
    const unit=comps.filter(c=>c.type==='pair').sort((a,b)=>b.top-a.top)[0]
            ||comps.filter(c=>c.type==='single').sort((a,b)=>b.top-a.top)[0];
    if(unit) cands.push({cards:unit.cards,score:46,reason:'主力雄厚,吊主清场'});
  }
  cands.sort((a,b)=>b.score-a.score);
  const best=cands[0]||{cards:[view.hand[0]],reason:'兜底',score:0};
  return {...best,cands:cands.slice(0,3)};
}

// 教练用:给任意一手领出打分
function coachScoreLead(view, cards){
  return scoreLeadPlay(leadCtx(view),classify(cards,view.trump),cards).score;
}

// 全 AI 无头模拟一整局(测试用;简化亮主为一轮制)
// smartSeats:使用启发式 AI 的座位,其余用随机 AI
function simulateRound(seed, smartSeats=[0,1,2,3]){
  const {first}=cutForFirst(seed);
  const {hands,kitty}=dealRound(seed,first);
  let best=null, declSeat=-1;
  for(let s=0;s<4;s++){
    const o=declOptions(hands[s],RULES.levelStart)[0];
    if(o && (!best||o.strength>best.strength)){ best=o; declSeat=s; }
  }
  const rand=rng(seed^0x9e3779b9);
  let trump;
  if(!best){ trump={suit:null,rank:RULES.levelStart}; declSeat=first; }
  else{
    trump={suit:best.suit,rank:RULES.levelStart};
    for(let s=0;s<4;s++){
      if(s!==declSeat && jokerPairOf(hands[s]) && rand()<0.3){
        trump={suit:null,rank:RULES.levelStart}; declSeat=s; break;  // 无庄盘:造反者坐庄
      }
    }
  }
  hands[declSeat].push(...kitty);
  const buried=aiDiscard(hands[declSeat],trump);
  buried.forEach(c=>removeCard(hands[declSeat],c));
  const declTeam=declSeat%2;
  const smart=new Set(smartSeats);
  const history=[];
  let leader=declSeat, defPoints=0, lastWinner=declSeat, lastLeadSize=1, tricks=0;
  while(hands.some(h=>h.length)){
    const plays=[];
    for(let i=0;i<4;i++){
      const seat=(leader+i)%4;
      const view={seat,hand:hands[seat],trump,declSeat,history:[...history,...plays],
                  buriedKnown:seat===declSeat?buried:[]};
      let cards;
      if(i===0){
        cards=smart.has(seat)?aiChooseLead(view).cards:aiLead(hands[seat],trump,rand);
        const chk=checkThrow(hands,seat,cards,trump);
        if(!chk.ok) cards=chk.forced;
      }else{
        const lead=classify(plays[0].cards,trump);
        cards=smart.has(seat)?aiChooseFollow(view,plays).cards
                             :genFollow(hands[seat],lead,trump,rand);
        if(!isLegalFollow(hands[seat],lead,cards,trump))
          throw new Error('AI 出牌不合法 seed='+seed+' seat='+seat);
      }
      cards.forEach(c=>removeCard(hands[seat],c));
      plays.push({seat,cards});
    }
    history.push(...plays);
    lastLeadSize=plays[0].cards.length;
    const res=resolveTrick(plays,trump);
    leader=res.winner; lastWinner=res.winner; tricks++;
    if(res.winner%2!==declTeam) defPoints+=res.points;
    if(tricks>100) throw new Error('死循环 seed='+seed);
  }
  return {...scoreRound({defPoints,kitty:buried,defWonLastTrick:lastWinner%2!==declTeam,lastLeadSize}),
          defPoints, tricks, declSeat, noTrump:!trump.suit};
}

if(typeof module!=='undefined') module.exports={RULES,makeDeck,cardPoints,countPoints,rng,dealRound,
  cutForFirst,effSuit,ordIdx,decompose,classify,isLegalFollow,resolveTrick,checkThrow,declarationOf,
  canOverride,declOptions,jokerPairOf,canReinforce2,canFullRebel,dealerAfterDecl,scoreRound,advanceMatch,countPairsIn,maxTractorLen,
  structMatches,removeCard,aiLead,genFollow,aiDiscard,simulateRound,bruteFollow,
  makeMemory,maxUnseenIdx,unseenPairAbove,isBossPlay,buildFollow,currentWinner,minWinFollow,
  aiChooseFollow,aiChooseLead,coachScoreFollow,coachScoreLead,makeVoids,followCtx,leadCtx,scoreLeadPlay};
</script>

  ok('低分造反阈值为5的倍数且≤30',
     E.RULES.pointRebelThreshold%5===0&&E.RULES.pointRebelThreshold<=30);
  // 完全造反资格(阈值:分数≤15 或 主牌≤3)
  const weakPts=[C('C',3),C('C',4),C('C',6),C('D',3),C('H',5),C('H',10)]; // 15分,主0张
  ok('15分(含)可造反', E.canFullRebel(weakPts,T).ok===true);
  const weakTr=[C('S',3),C('S',4),C('X',15),C('H',13),C('H',13),C('D',10),C('D',10)]; // 主3张,分50
  ok('主牌3张(含)可造反', E.canFullRebel(weakTr,T).ok&&E.canFullRebel(weakTr,T).byTrump);
  const strong=[C('S',3),C('S',4),C('S',6),C('X',16),C('H',13),C('D',10)]; // 主4张,分20
  ok('分数、主牌都够则不可造反', E.canFullRebel(strong,T).ok===false);

  // ---- 教练评分标尺 ----
  {
    // 对手稳赢:贴分应比跟小得分更低(送分被罚)
    const plays=[{seat:1,cards:[C('H',14)]},{seat:2,cards:[C('H',6)]},{seat:3,cards:[C('H',3)]}];
    const view={seat:0,hand:[C('H',10),C('H',4),C('D',3)],trump:T,history:plays,buriedKnown:[]};
    const sDump=E.coachScoreFollow(view,plays,[view.hand[0]]);
    const sCheap=E.coachScoreFollow(view,plays,[view.hand[1]]);
    ok('教练标尺:对手大时送10分比跟4差', sCheap>sDump);
    // 队友稳赢:贴分比跟小得分高
    const plays2=[{seat:1,cards:[C('H',5)]},{seat:2,cards:[C('H',14)]},{seat:3,cards:[C('H',3)]}];
    const view2={seat:0,hand:[C('H',10),C('H',4),C('D',3)],trump:T,history:plays2,buriedKnown:[]};
    ok('教练标尺:队友大时贴10分比跟4好',
       E.coachScoreFollow(view2,plays2,[view2.hand[0]])>E.coachScoreFollow(view2,plays2,[view2.hand[1]]));
    // 领出:AI最优选与教练评分一致(自我一致性)
    const view3={seat:0,hand:[...P('X',16),C('H',4),C('C',7)],trump:T,history:[],buriedKnown:[]};
    const best=E.aiChooseLead(view3);
    ok('教练标尺:领出评分与AI自洽',
       E.coachScoreLead(view3,best.cards)>=E.coachScoreLead(view3,[view3.hand[2]])-0.01);
    ok('AI返回候选列表供教练展示', Array.isArray(best.cands)&&best.cands.length>=1);
  }

  // ---- 定主后谁坐庄(王对造反不得在庄定盘换庄) ----
  {
    const D=E.dealerAfterDecl;
    ok('庄定盘:亮主不换庄', D({dealerKnown:true,dealer:1,declSeat:3,firstTaker:1})===1);
    ok('庄定盘:王对造反只改主色,庄家不变',
       D({dealerKnown:true,dealer:1,declSeat:2,firstTaker:1})===1);
    ok('庄定盘:无人亮主也不换庄', D({dealerKnown:true,dealer:2,declSeat:-1,firstTaker:2})===2);
    ok('无庄盘:最终亮主者坐庄', D({dealerKnown:false,dealer:-1,declSeat:3,firstTaker:0})===3);
    ok('无庄盘:无人亮主则先拿牌者坐庄', D({dealerKnown:false,dealer:-1,declSeat:-1,firstTaker:2})===2);
  }

  // ---- 整场推进(升级/轮庄/胜负) ----
  {
    let a=E.advanceMatch([2,2],1,{defendersWin:false,declarerLevelsUp:2});
    ok('庄守住:升级且对家连庄', a.levels[1]===4&&a.dealer===3&&!a.matchOver);
    a=E.advanceMatch([2,2],1,{defendersWin:true,defenderLevelsUp:1});
    ok('闲家上台:升级且前庄下家坐庄', a.levels[0]===3&&a.dealer===2);
    a=E.advanceMatch([2,2],1,{defendersWin:true,defenderLevelsUp:0});
    ok('闲家80~119:上台不升级', a.levels[0]===2&&a.dealer===2);
    a=E.advanceMatch([13,2],0,{defendersWin:false,declarerLevelsUp:3});
    ok('打过A:整场结束', a.matchOver&&a.winnerTeam===0);
    a=E.advanceMatch([14,2],0,{defendersWin:false,declarerLevelsUp:1});
    ok('A级守住即打过A', a.matchOver&&a.winnerTeam===0);
  }

  // ---- M3 启发式 AI ----
  // 记牌:两张HA都见过后,HK就是本门最大
  {
    const view={seat:0,hand:[C('H',13)],trump:T,
      history:[{seat:1,cards:P('H',14)}],buriedKnown:[]};
    const mem=E.makeMemory(view);
    ok('记牌:HA出尽后HK封顶', E.isBossPlay(E.classify([view.hand[0]],T),mem,T)===true);
    const view2={seat:0,hand:[C('H',13)],trump:T,history:[],buriedKnown:[]};
    ok('记牌:HA未见时HK非最大', E.isBossPlay(E.classify([view2.hand[0]],T),E.makeMemory(view2),T)===false);
  }
  // 跟牌:对手暂大且能吃 → 用最省的牌吃(HQ 而非 HA)
  {
    const plays=[{seat:1,cards:[C('H',10)]}];
    const view={seat:2,hand:[C('H',12),C('H',14),C('H',3),C('D',4)],trump:T,history:plays,buriedKnown:[]};
    const ch=E.aiChooseFollow(view,plays);
    ok('用最省的牌吃(Q不动A)', ch.cards.length===1&&ch.cards[0].rank===12);
  }
  // 跟牌:队友稳赢且自己最后一手 → 贴分(出H10而非H4)
  {
    const plays=[{seat:1,cards:[C('H',5)]},{seat:2,cards:[C('H',14)]},{seat:3,cards:[C('H',3)]}];
    const view={seat:0,hand:[C('H',10),C('H',4),C('D',3)],trump:T,history:plays,buriedKnown:[]};
    const ch=E.aiChooseFollow(view,plays);
    ok('队友大,最后一手贴分', ch.cards[0].rank===10);
  }
  // 跟牌:对手稳赢 → 跟小不送分(出H4而非H10)
  {
    const plays=[{seat:1,cards:[C('H',14)]},{seat:2,cards:[C('H',6)]},{seat:3,cards:[C('H',3)]}];
    const view={seat:0,hand:[C('H',10),C('H',4),C('D',3)],trump:T,history:plays,buriedKnown:[]};
    const ch=E.aiChooseFollow(view,plays);
    ok('对手大,跟小不送分', ch.cards[0].rank===4);
  }
  // 领出:手握双大王 → 先收一墩
  {
    const view={seat:0,hand:[...P('X',16),C('H',4),C('C',7)],trump:T,history:[],buriedKnown:[]};
    const ch=E.aiChooseLead(view);
    ok('领出钢板(大王对)先收', ch.cards.length===2&&ch.cards[0].rank===16);
  }
  // ---- M7 策略升级 ----
  // 缺门推断
  {
    const hist=[{seat:1,cards:[C('H',7)]},{seat:2,cards:[C('C',3)]},
                {seat:3,cards:[C('H',8)]},{seat:0,cards:[C('H',4)]}];
    const v=E.makeVoids(hist,T);
    ok('缺门推断:座2红桃缺门', v[2]['H']===true&&!v[3]['H']);
  }
  // 埋底 v2:造缺短门、不埋分
  {
    const hand=[C('C',3),C('C',4),                        // 短门梅花 → 应整门埋掉
      C('H',10),...P('H',9),C('H',14),C('H',6),C('H',7),C('H',8),C('H',3),
      C('D',6),C('D',7),C('D',8),C('D',9),C('D',11),C('D',12),C('D',4),C('D',3)];
    const d=E.aiDiscard(hand,T);
    ok('埋底:短门整门埋掉', d.filter(c=>c.suit==='C').length===2);
    ok('埋底:不埋分牌', !d.some(c=>E.cardPoints(c)>0));
    ok('埋底:不拆红桃9对', d.filter(c=>c.suit==='H'&&c.rank===9).length===0);
  }
  // 领出:对手缺门时钢板降权
  {
    const histVoid=[{seat:0,cards:[C('H',7)]},{seat:2,cards:[C('C',3)]},
                    {seat:3,cards:[C('H',14)]},{seat:1,cards:[C('H',4)]}];  // 座2(对手)缺红桃
    const hand=[C('H',14),C('C',5),C('C',6)];
    const vNo={seat:1,hand,trump:T,history:[],buriedKnown:[]};
    const vYes={seat:1,hand,trump:T,history:histVoid,buriedKnown:[]};
    // 无缺门信息时 HA(另一张已现)是钢板高分;对手缺门后应明显降分
    const sNo=E.coachScoreLead({...vNo,history:[{seat:0,cards:[C('H',14)]},{seat:2,cards:[C('H',3)]},{seat:3,cards:[C('H',5)]},{seat:1,cards:[C('H',4)]}]},[hand[0]]);
    const sYes=E.coachScoreLead(vYes,[hand[0]]);
    ok('领出:对手缺门钢板降权', sYes<sNo);
  }
  // 领出:整门钢板 → 甩牌
  {
    const view={seat:0,hand:[...P('H',14),C('H',13),C('C',4),C('C',5)],trump:T,
                history:[{seat:1,cards:[C('H',13)]},{seat:2,cards:[C('H',3)]},{seat:3,cards:[C('H',5)]},{seat:0,cards:[C('H',4)]}],
                buriedKnown:[]};   // 另一张HK已现 → AA+K全钢板
    const ch=E.aiChooseLead(view);
    ok('领出:整门钢板甩牌', ch.cards.length===3&&ch.reason.includes('甩'));
  }
  // 领出:庄家方主力雄厚吊主,且不用大怪
  {
    const trumps=[...P('S',5),...P('S',6),C('S',9),C('S',11),C('S',13),C('X',16)];
    const view={seat:0,declSeat:0,hand:[...trumps,C('H',3),C('C',4)],trump:T,history:[],buriedKnown:[]};
    const ch=E.aiChooseLead(view);
    const drain=ch.cands.find(c=>c.reason.includes('吊主'));
    ok('庄家主多有吊主候选且不带大怪', !!drain&&!drain.cards.some(c=>c.rank===16));
  }
  // 贴分确定性:后手对手缺门 → 贴分降权
  {
    const mkView=h=>({seat:3,hand:[C('H',10),C('H',4),C('D',3)],trump:T,history:h,buriedKnown:[]});
    const plays=[{seat:1,cards:[C('H',14)]},{seat:2,cards:[C('H',6)]}];  // 队友(1)领出HA暂大,座0(对手)未出
    const histVoid=[{seat:1,cards:[C('H',9)]},{seat:2,cards:[C('H',3)]},
                    {seat:3,cards:[C('H',5)]},{seat:0,cards:[C('D',4)]}]; // 座0缺红桃
    const dNo=E.coachScoreFollow(mkView([]),plays,[C('H',10)]);
    const dYes=E.coachScoreFollow(mkView(histVoid),plays,[C('H',10)]);
    ok('后手对手缺门时贴分更谨慎', dYes<dNo);
  }
  // 启发式优于随机:同样的局,聪明防守方比随机防守方抓分更多(均值)
  {
    let smartSum=0,randSum=0,n=0;
    for(let s=1;s<=120;s++){
      const r1=E.simulateRound(s,[0,2]);       // 南北聪明
      const r0=E.simulateRound(s,[]);          // 全随机
      if(r1&&r0&&r1.declSeat%2===1&&r0.declSeat%2===1){ smartSum+=r1.defPoints; randSum+=r0.defPoints; n++; }
    }
    ok(`启发式防守优于随机(${(smartSum/n).toFixed(0)} vs ${(randSum/n).toFixed(0)} 分,${n}局)`,
       n>10 && smartSum>randSum);
  }

  let simOK=true, played=0, nt=0;
  for(let s=1;s<=40;s++){
    try{
      const r=E.simulateRound(s);
      if(r){ played++; if(r.noTrump)nt++;
        if(r.total<0||r.tricks<13) simOK=false; }
    }catch(e){ simOK=false; }
  }
  ok('40局全AI模拟无崩溃(含'+nt+'局无主)', simOK&&played>30);

  return {pass,fail,out};
}
if(typeof module!=='undefined'){ module.exports.runTests=runTests; }
</script>

<script>
/* ============================================================
 * 界面层 —— 只调用引擎公开函数
 * ============================================================ */
(function(){
if(typeof document==='undefined') return;
const ENGINE={RULES,makeDeck,cardPoints,countPoints,rng,dealRound,cutForFirst,effSuit,ordIdx,decompose,
  classify,isLegalFollow,resolveTrick,checkThrow,declarationOf,canOverride,declOptions,jokerPairOf,
  canReinforce2,scoreRound,countPairsIn,maxTractorLen,structMatches,removeCard,aiLead,genFollow,

if(location.hash==='#test'){

}

// ---- 术语(全国版/沪语版) ----
const TERMS_CN={bigJoker:'大王',smallJoker:'小王',trump:'主牌',noTrump:'无主',tractor:'拖拉机',
  throwP:'甩牌',ruff:'毙牌',discard:'垫牌',declare:'亮主',counter:'反主',reinforce:'加固',
  declareV:'亮',counterV:'反',   // 按钮上用的短动词,免得"亮主无主(大)"这种叠字
  bury:'扣底',lead:'领出',zheng:'正常主',fu:'副常主',voidSuit:'断门',openVoid:'开局断门',
  rankA:'A',rankK:'K',rankQ:'Q',rankJ:'J',levelUp:'升级',
  defenders:'闲家',tiaoji:'跳级',guangtou:'剃光头'};   // 闲家/跳级/剃光头:沪语全国通用
let useSH=false; try{ useSH=localStorage.getItem('80fendev-lang')==='sh'; }catch(e){}
const T=k=>(useSH&&window.TERMS_SH&&window.TERMS_SH[k])||TERMS_CN[k]||k;

const SUIT_SYM={S:'♠',H:'♥',D:'♦',C:'♣'};
const SUIT_NAME={S:'黑桃♠',H:'红桃♥',D:'方块♦',C:'梅花♣'};
const SEAT_NAME=['南(你)','东','北(队友)','西'];
const HUMAN=0;
const typeName=t=>({single:'单张',pair:'对子',tractor:T('tractor'),throw:T('throwP')}[t]);
const rankName=r=>r===14?T('rankA'):r===13?T('rankK'):r===12?T('rankQ'):r===11?T('rankJ'):String(r);
let G=null, seedBase=Date.now()%100000, activeTab='score', replayMode=false, histBySuit=false;
let notes=[]; try{ notes=JSON.parse(localStorage.getItem('80fendev-notes')||'[]'); }catch(e){}

// ---- 音效(WebAudio 合成,无外部资源,可关) ----
let sndOn=true; try{ sndOn=localStorage.getItem('80fendev-snd')!=='off'; }catch(e){}
let _actx=null;
function beep(freq,dur=0.08,type='sine',gain=0.06,delay=0){
  if(!sndOn) return;
  try{
    _actx=_actx||new (window.AudioContext||window.webkitAudioContext)();
    const o=_actx.createOscillator(), g=_actx.createGain();
    o.type=type; o.frequency.value=freq;
    g.gain.setValueAtTime(gain,_actx.currentTime+delay);
    g.gain.exponentialRampToValueAtTime(0.001,_actx.currentTime+delay+dur);
    o.connect(g); g.connect(_actx.destination);
    o.start(_actx.currentTime+delay); o.stop(_actx.currentTime+delay+dur+0.02);
  }catch(e){}
}
const sndPlay=()=>beep(520,0.05,'triangle',0.05);
const sndWin =()=>{beep(660,0.09,'sine',0.06);beep(880,0.12,'sine',0.06,0.09);};
const sndLose=()=>beep(220,0.15,'sine',0.05);
const sndEnd =()=>{[523,659,784].forEach((f,i)=>beep(f,0.22,'sine',0.05,i*0.12));};
const sndOops=()=>beep(180,0.18,'square',0.04);

// ---- 对局设置(规则 + 节奏),见设置菜单 ----
// 引擎里的 RULES 是运行时真值;这里先快照出厂默认,玩家改动存进 S.rules 再套回 RULES。
// 只放真正被引用、且改了不会和发牌逻辑冲突的项:
// offsuitRankTractor/handSize 代码里没引用,kittySize/levelStart 改了会和 dealRound 的固定 8 张底牌冲突。
const RULE_DEFAULTS={
  pointRebelThreshold:RULES.pointRebelThreshold,
  trumpRebelThreshold:RULES.trumpRebelThreshold,
  maxRedeal:RULES.maxRedeal,
  strictTractorFollow:RULES.strictTractorFollow,
  partialTractorFollow:RULES.partialTractorFollow,
};
const S_DEFAULT={
  fullRebel:'off',   // 低分/少主:off=关闭 | redeal=仅重新发牌(不抢庄) | scramble=完全造反(双方抢庄)
  aiThinkMin:1.0,    // AI 出牌思考秒数(下限)
  aiThinkMax:3.0,    // AI 出牌思考秒数(上限)
  trickHold:3.0,     // 一墩出完后牌留桌秒数
  manualNext:false,  // true = 手动点击进入下一墩
  declWait:10.0,     // 发完牌后留给你亮主/反主的时间(秒),可点「不亮」提前结束
};
let S={...S_DEFAULT, rules:{...RULE_DEFAULTS}};
try{
  const saved=JSON.parse(localStorage.getItem('80fendev-set')||'{}');
  Object.assign(S,saved);
  S.rules={...RULE_DEFAULTS,...(saved.rules||{})};   // 老存档没有 rules 字段时回落到出厂值
}catch(e){}
function applyRules(){ Object.assign(RULES,S.rules); }
applyRules();
function saveS(){ try{ localStorage.setItem('80fendev-set',JSON.stringify(S)); }catch(e){} }
// 秒 → 毫秒,顺手挡掉手输的空值/负数/非数字
const secs=(v,fallback)=>1000*Math.max(0,(typeof v==='number'&&isFinite(v))?v:fallback);
function aiThinkMs(){
  const lo=Math.max(0,+S.aiThinkMin||0), hi=Math.max(lo,+S.aiThinkMax||0);
  return 1000*(lo+Math.random()*(hi-lo));
}

// ---- 设置菜单 ----
function openSettings(){
  const el=document.getElementById('setContent');
  el.innerHTML=
    `<div style="font-size:20px;color:var(--gold);margin-bottom:12px">⚙ 设置</div>`+
    `<div style="color:var(--gold);font-size:14px;margin-top:4px">规则</div>`+
    `<div class="setRow"><label>低分/少${T('trump')}时</label>
       <select id="stRebel">
         <option value="off">关闭</option>
         <option value="redeal">仅重新发牌(不抢庄)</option>
         <option value="scramble">完全${T('counter')}(重发+双方抢庄)</option>
       </select></div>`+
    `<div class="setRow"><label>　└ 低分阈值(分)</label>
       <input type="number" id="rPts" min="0" max="30" step="5"><span class="setHint" style="margin:0">0=关</span></div>`+
    `<div class="setRow"><label>　└ 少${T('trump')}阈值(张)</label>
       <input type="number" id="rTrump" min="-1" max="10" step="1"><span class="setHint" style="margin:0">-1=关</span></div>`+
    `<div class="setRow"><label>　└ 同局最多重发</label>
       <input type="number" id="rRedeal" min="0" max="10" step="1"><span class="setHint" style="margin:0">次</span></div>`+
    `<div class="setHint" id="rRebelHint"></div>`+
    `<div class="setRow"><label><input type="checkbox" id="rStrict"> 领出${T('tractor')}必须跟${T('tractor')}</label></div>`+
    `<div class="setRow"><label><input type="checkbox" id="rPartial"> 　└ 只有更短的${T('tractor')}也必须跟</label></div>`+
    `<div style="color:var(--gold);font-size:14px;margin-top:10px">节奏</div>`+
    `<div class="setRow"><label>发完牌后${T('declare')}等待(秒)</label>
       <input type="number" id="stDeclWait" min="0" max="60" step="1"></div>`+
    `<div class="setHint">等待期间可随时${T('declare')}/${T('counter')};点「不${T('declare')}」立即结束等待</div>`+
    `<div class="setRow"><label>AI 出牌思考(秒)</label>
       <input type="number" id="stMin" min="0" max="10" step="0.5"> –
       <input type="number" id="stMax" min="0" max="10" step="0.5"></div>`+
    `<div class="setRow"><label><input type="checkbox" id="stManual"> 手动点击进入下一墩</label></div>`+
    `<div class="setRow"><label>每墩出完留桌(秒)</label>
       <input type="number" id="stHold" min="0" max="15" step="0.5"></div>`+
    `<div class="setHint" id="stHoldHint"></div>`+
    `<div style="color:var(--gold);font-size:14px;margin-top:10px">显示与音效</div>`+
    `<div class="setRow"><label><input type="checkbox" id="stLang"> 沪语版(术语切换)</label></div>`+
    `<div class="setRow"><label><input type="checkbox" id="stSnd"> 🔊 音效</label></div>`+
    `<div style="color:var(--gold);font-size:14px;margin-top:10px">教练</div>`+
    `<div class="setRow"><label><input type="checkbox" id="cOn"> 教练总开关</label></div>`+
    `<div class="setRow"><label>失误反馈灵敏度</label>
       <select id="cSens">${['高','中','低','关'].map(s=>`<option value="${s}">${s}</option>`).join('')}</select></div>`+
    `<div class="setRow"><label><input type="checkbox" id="cStrict"> 严格模式(大失误可撤回)</label></div>`+
    `<div class="setRow"><label><input type="checkbox" id="cReview"> 局后复盘</label></div>`+
    `<div class="setRow"><label><input type="checkbox" id="cQuiz"> 提问引导</label></div>`+
    `<div class="setRow"><label><input type="checkbox" id="cMemShow"> 记牌表常显(不用每墩点开验证)</label></div>`+
    `<div style="margin-top:16px;text-align:center">
       <button id="stClose">完成</button>
       <button class="minor" id="stReset">恢复默认</button>
     </div>`;
  const $=id=>document.getElementById(id);
  const fill=()=>{
    $('stRebel').value=S.fullRebel; $('stMin').value=S.aiThinkMin;
    $('stMax').value=S.aiThinkMax;  $('stHold').value=S.trickHold;
    $('stDeclWait').value=S.declWait;
    $('stManual').checked=!!S.manualNext;
    $('stHold').disabled=!!S.manualNext;
    $('stHoldHint').textContent=S.manualNext?'(手动模式下由你点「下一墩」决定)':'';
    $('stLang').checked=useSH; $('stSnd').checked=sndOn;
    $('cOn').checked=C.on; $('cSens').value=C.gapSens; $('cStrict').checked=C.strict;
    $('cReview').checked=C.review; $('cQuiz').checked=C.quiz; $('cMemShow').checked=C.memShow;
    $('rPts').value=S.rules.pointRebelThreshold;
    $('rTrump').value=S.rules.trumpRebelThreshold;
    $('rRedeal').value=S.rules.maxRedeal;
    $('rStrict').checked=S.rules.strictTractorFollow;
    $('rPartial').checked=S.rules.partialTractorFollow;
    $('rPartial').disabled=!S.rules.strictTractorFollow;   // 不严格跟拖拉机时,短拖规则没有意义
    // 三个造反阈值只在造反规则打开时生效,关掉就灰掉并说明
    const rebelOff=S.fullRebel==='off';
    ['rPts','rTrump','rRedeal'].forEach(id=>$(id).disabled=rebelOff);
    if(rebelOff){
      $('rRebelHint').textContent='(上面选「关闭」时,这三项不生效)';
    }else{
      // 0 / -1 是「该条件关闭」的哨兵值,别照字面写成 "≤-1 张时触发"
      const conds=[
        S.rules.pointRebelThreshold>0?`手牌 ≤${S.rules.pointRebelThreshold} 分`:'',
        S.rules.trumpRebelThreshold>=0?`${T('trump')} ≤${S.rules.trumpRebelThreshold} 张`:'',
      ].filter(Boolean);
      $('rRebelHint').textContent=conds.length
        ? `满足任一即可触发:${conds.join(' 或 ')}`
        : '⚠️ 两个阈值都已关闭,实际永远不会触发';
    }
  };
  fill();
  const num=(id,key)=>$(id).onchange=e=>{ const v=parseFloat(e.target.value);
    S[key]=isFinite(v)&&v>=0?v:S_DEFAULT[key]; saveS(); fill(); };
  // 规则参数:允许负数(少主阈值 -1 = 关闭),写回 RULES 后立即生效
  const ruleNum=(id,key,min)=>$(id).onchange=e=>{ const v=parseFloat(e.target.value);
    S.rules[key]=isFinite(v)&&v>=min?v:RULE_DEFAULTS[key]; saveS(); applyRules(); fill(); if(G) render(); };
  const ruleBool=(id,key)=>$(id).onchange=e=>{ S.rules[key]=e.target.checked; saveS(); applyRules(); fill(); };
  ruleNum('rPts','pointRebelThreshold',0);
  ruleNum('rTrump','trumpRebelThreshold',-1);
  ruleNum('rRedeal','maxRedeal',0);
  ruleBool('rStrict','strictTractorFollow');
  ruleBool('rPartial','partialTractorFollow');
  $('stRebel').onchange=e=>{ S.fullRebel=e.target.value; saveS(); fill(); if(G) render(); };
  num('stMin','aiThinkMin'); num('stMax','aiThinkMax'); num('stHold','trickHold');
  num('stDeclWait','declWait');
  $('stManual').onchange=e=>{ S.manualNext=e.target.checked; saveS(); fill(); };
  $('stLang').onchange=e=>{ useSH=e.target.checked;
    try{ localStorage.setItem('80fendev-lang',useSH?'sh':'cn'); }catch(_){ } if(G) render(); };
  $('stSnd').onchange=e=>{ sndOn=e.target.checked;
    try{ localStorage.setItem('80fendev-snd',sndOn?'on':'off'); }catch(_){ } };
  $('cOn').onchange=e=>{ C.on=e.target.checked; saveC(); if(G) render(); };
  $('cSens').onchange=e=>{ C.gapSens=e.target.value; saveC(); };
  $('cStrict').onchange=e=>{ C.strict=e.target.checked; saveC(); };
  $('cReview').onchange=e=>{ C.review=e.target.checked; saveC(); };
  $('cQuiz').onchange=e=>{ C.quiz=e.target.checked; saveC(); };
  $('cMemShow').onchange=e=>{ C.memShow=e.target.checked; saveC(); if(G) renderPanel(); };
  $('stReset').onclick=()=>{ S={...S_DEFAULT, rules:{...RULE_DEFAULTS}};
    saveS(); applyRules(); fill(); if(G) render(); };
  $('stClose').onclick=closeSettings;
  document.getElementById('setOverlay').style.display='flex';
}
function closeSettings(){ document.getElementById('setOverlay').style.display='none'; }
