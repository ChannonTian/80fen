   * 也就是把那个 2 去掉。drawTrumpVsOne=0 退回旧行为。 */
  const share=AIP.drawTrumpVsOne?hl/unseenTotal:2*hl/unseenTotal;
  const oppTrump=unseenTrump*Math.min(1,share);
  return L._dt=clamp(AIP.drawTrumpUnit*(L.nTrump-oppTrump),-AIP.drawTrumpCap,AIP.drawTrumpCap);
}

/* 「我方主牌占不占优」这个**判据**(v0.5.9)。
 *
 * 和上面那个 drawTrumpValue 分开,是因为它们回答的是两个不同的问题:
 *   · drawTrumpValue 是一个**打分项**,它的量纲(drawTrumpUnit 6、cap 30)是围着
 *     那条「一家比两家」的偏差标定出来的 —— 直接把偏差修掉,正半边会突然放大,
 *     AI 变得过度钓主。实测:把 drawTrumpVsOne 打开影响打分项,
 *     配对对照 −0.85 分/局,庄家丢最后一墩 26.2% → 37.8%。**数值在补偿偏差,不能只修一半。**
 *   · 而 tiaoWangValue 里要的只是一个**符号**:我方主牌到底占不占优。
 *     那里必须比对,否则 edge 恒为负(实测均值 −18.8),tiaoNoEdge 永久生效。
 *
 * 所以判据单独算:领一轮主,我出一张、队友出一张、两个对手各出一张,两边各消耗两张。
 * 队友的期望和一个对手的期望抵消,化简就是 `我的主牌数 − 单家期望主牌数`。
 * 打分项那边的偏差留到 drawTrumpUnit 重标定时一起动(见 DESIGN.md §7)。
 */
function trumpEdgeCount(L){
  if(L._tec!==undefined) return L._tec;
  const {mem,trump}=L;
  let unseenTotal=0, unseenTrump=0;
  for(const k in mem.unseen){
    const n=mem.unseen[k]; if(n<=0) continue;
    unseenTotal+=n;
    if(effSuit(keyToCard(k),trump)==='T') unseenTrump+=n;
  }
  if(unseenTotal<=0) return L._tec=0;
  const hl=(L.hand||[]).length;
  return L._tec=L.nTrump-unseenTrump*Math.min(1,hl/unseenTotal);
}

/* 送毙(v4)—— 主打队友的断门。
 * v3 里全部的队内配合只有兜底分支的一句 `+8 队友缺这门,给他机会`,
 * 在一堆 20~60 分的候选里等于没有,而且它只是给已有候选加分,不是一类独立策略。
 * 现在按期望收益算:
 *   队友确实缺这门(pPartnerVoid)× 对手不缺这门(否则是送给对手毙)
 *   × ( 这一墩能收到的分 + 牌权回到我方的价值 )
 * 两个概率都来自 makeVoidProb / maxHoldIn 的软推断,不是新造的假设。
 * 带开关 AIP.feedRuff,便于单组件消融(设计文档 §6 的教训:先确认参数真的在起作用)。
 */
function feedRuffValue(L, cl, cards){
  if(!AIP.feedRuff||cl.suit==='T') return 0;
  // 带分送毙只在对手**不太可能**断这门时才成立 —— 否则是把分领进对手的断门(B1)
  if(countPoints(cards)>0&&(!AIP.feedRuffPts||(L.oppVoidP&&L.oppVoidP(cl.suit)>=0.5))) return 0;
  const pv=L.partnerVoidP?L.partnerVoidP(cl.suit):0;
  if(pv<AIP.feedRuffMinP) return 0;
  // 队友手上还得有主牌可毙 —— 在外一张主都没有时这条不成立
  const trAvail=unseenBeats(L.mem,{suit:'T',top:-1,type:'single'},L.trump).total;
  if(trAvail<=0) return 0;
  const oppNotVoid=1-(L.oppVoidP?L.oppVoidP(cl.suit):0);
  const rem=unseenPointsIn(L.mem,cl.suit,L.trump);
  const gain=Math.min(12,rem*0.33)+AIP.oppTempo     // 这墩的分 + 牌权留在我方
            +(AIP.feedRuffPts?countPoints(cards):0);  // 带分送毙:他毙下来,我这几分也归我方
  return AIP.feedRuff*pv*oppNotVoid*gain;
}

/* ============================================================
 * v0.5.8 ④⑥ —— 非钢板领出的统一期望分口径
 *
 * 旧版的 scoreLeadCore 其实是**两套完全不同的评分器**:
 *   · 钢板 / 甩牌 → leadPointsEV + pWin + tempo + futureValue,一套真的期望分模型;
 *   · 其余全部   → 一条手写常数式,唯一的牌力项是**负的一次项**:
 *         对子  20 − top×0.5 − pts×4 − …
 *         单张  16 − top×0.8 − pts×6 − …
 *
 * 后果一(反馈④):手上 ♣J♣J 和 ♣8♣8,打分 6.7 vs 8.2,差的 1.5 分**全部**来自
 * −top×0.5。打分器里根本没有「一对J 大概率压得住场、还能把对方的一对10 逼出来」
 * 这件事的位置 —— leadPointsEV 只在钢板分支被调用,LEAD_PWIN 又是按**牌型**
 * 写死的常数(pair 一律 0.45,不管是一对3 还是一对A)。
 *
 * 后果二(反馈⑥):非钢板候选之间只按「谁更小」排序,于是
 * probePenalty / tiaoWangValue / feedRuffValue / probeSafeBonus 全是往这条式子里
 * 加加减减的常数,彼此没有共同量纲 —— 这就是「按下一个冒出另一个」在领出侧的发源地。
 *
 * 现在改成和跟牌侧同一个式子:
 *     Score = p·Gain − (1−p)·Loss + Tempo − Future
 * p 由记牌直接算(pSurvive/pBeaterIn 是现成的,跟牌侧一直在用)。
 * p 一算出来,几个补丁就可以退休:
 *   · 小牌探路的 p 天然低 → 自动降权,probePenalty 不再需要;
 *   · 一对J 的 p 高于一对8 → 反馈④自动修好,−top×k 不再需要;
 *   · LEAD_PWIN 那张按牌型写死的常数表也不再需要(tempo 改用算出来的 p 加权)。
 * tiaoWangValue / feedRuffValue 保留:它们表达的是 EV 模型看不见的东西
 * (逼对手消耗主牌、把牌权交给队友去毙),不是这条式子的替代品。
 * ============================================================ */

// 这一手领出后,本队守住这墩的概率。复用跟牌侧的 pSurvive:
// 它已经把「在外有几张压得住」「谁可能缺门来毙」都算进去了。
function leadWinP(L, cl, cards){
  const LS=Object.create(L);
  LS.ptsTable=countPoints(cards)+(unseenPointsIn(L.mem,cl.suit,L.trump)>0?5:0);
  LS.lead=null;                       // pSurvive 会退回用 cl.suit 当领出门,正确
  const mine=pSurvive(LS,cl,L.remainingOpp);
  if(!AIP.leadTeamP) return mine;
  /* v0.6.0 —— 领出侧的牌权概率问的应该是「**本队**赢不赢得下这墩」,
   * 而不是「**我这张**活不活得下来」。
   *
   * 这是「钓主没人接」的真正病根,而且它在领出侧、不在跟牌侧:
   * `pSurvive(这一手, 两个对手)` 把**队友把它压过去**和**对手把它压过去**
   * 算成同一件事 —— 都叫「没活下来」。可钓主的**目的**就是让队友接过去。
   * 于是「小主换牌权」在打分器里永远算不出正值,只能靠 tiaoWangValue 里那个
   * 虚的 drawOut(逼对手吐主)去凑,而领一张小主根本吐不出对手的大主(他跟最小的)。
   *
   *     pTeam = P(两个对手都压不过) + P(有对手压过) × P(队友再压回来)
   *
   * 判据由此变成**队友有没有更大的牌**,这正是钓主该问的问题。 */
  return clamp(mine+(1-mine)*partnerRescueP(L,cl),0.02,0.99);
}

/* 「对手压过去了,队友还能不能压回来」(v0.6.0)。
 * 和跟牌侧的 pPartnerTakes 同一个问题、同一套坛子口径,只是领出时还没有台面信息:
 * 在外压得住我这一手的牌有多少张,其中多大比例按期望落在队友手上。
 * 再收一道 leadRescueDamp —— 队友要压过的是**对手打出的那张**(通常比我这张大),
 * 而且他未必肯为一墩空气花大牌。 */
function partnerRescueP(L, cl){
  if(L.seat===undefined) return 0;
  const b=unseenBeats(L.mem,cl,L.trump);
  if(b.higher<=0) return 0;                     // 在外已无更大 —— 本来就赢了,不需要救
  const partner=(L.seat+2)%4;
  const opps=[0,1,2,3].filter(p=>p%2!==L.seat%2);
  const ptN=expHoldIn(L,partner,cl.suit);
  const oppN=opps.reduce((a,p)=>a+expHoldIn(L,p,cl.suit),0);
  if(ptN+oppN<=0) return 0;
  let share=ptN/(ptN+oppN);
  /* v0.7.1:这一墩是**怎么**输掉的,决定队友能不能救。
   * 旧版把两件事混成一个 share:队友在本门还有更大的牌。可只要有对手在这门断门,
   * 这墩就是被一张**主**盖走的 —— 队友手上那张本门的 A 一点用都没有,他要盖的是主。
   * 于是「明知对手断门、还带着分领这门」在打分器里能算出正的本队胜率。
   * 实测(正式版 150 局):带分领进已知断门、且当时另有门可领的,113 次,
   * 丢掉 88 次,送出 1245 分。
   * 按「这墩被毙掉的概率」把本门那一截折掉,只留下队友**毙回来**的那一截。
   * rescueRuffAware=0 即退回旧行为。 */
  const pRuff=cl.suit!=='T'&&L.oppVoidP?L.oppVoidP(cl.suit):0;
  share*=1-pRuff*AIP.rescueRuffAware;
  // 副牌:队友也可能是**毙**回来的,不必本门有大牌
  let ruff=0;
  if(cl.suit!=='T'&&L.partnerVoidP){
    const trAvail=unseenBeats(L.mem,{suit:'T',top:-1,type:'single'},L.trump).total;
    if(trAvail>0) ruff=L.partnerVoidP(cl.suit)*0.7;
  }
  return clamp((share+ruff-share*ruff)*AIP.leadRescueDamp,0,0.9);
}

// 这一墩输掉时送出去多少分:我出的分 + 赢的那个对手顺手掏出的分 + 队友被迫漏的分
function leadLossPoints(L, cl, cards){
  const share=unseenPointsIn(L.mem,cl.suit,L.trump)/3;
  const scale=cl.suit==='T'?AIP.leadTrumpEVScale:1;   // 主门人人攥着不放,同一个折
  return (Math.min(10,share*AIP.dumpOpp)+Math.min(3,share*0.15))*scale;
}

/* ============================================================
 * v0.6.1 —— 「不要主动领主牌」这条先验,从符号偏差里拿出来写明白
 *
 * v0.6.0 的实测结论是:`drawTrumpValue` 那个「一家比两家」的负偏差(均值 −18.8),
 * 实际扮演的是**一条强烈反对主动领主牌的先验**;把比较改对并重标定,三档全部掉分,
 * 庄家丢最后一墩从 28% 跳到 35%。也就是说先验是对的,只是藏错了地方。
 *
 * 藏在符号里有三个坏处:它的强度跟着一个**估错的量**走;它同时污染了钓主的正半边
 * (真该钓主时也被压住);而且没人看得出打分器里到底是什么在反对领主牌。
 *
 * 摊开来说,领一轮主牌的真实代价有两截:
 *   · **我这张**的留手价值 —— 已经在 `futureValue` 的 `trumpHold` 里,不重复算;
 *   · **队友被迫也跟出一张主** —— 这一截从来没人算过。领主牌逼四家各出一张:
 *     张数上两边打平,但我方那两张本来是留着毙牌和护底的,
 *     对手那两张往往是他们最小的(他们没有义务吐大牌)。所以这一轮**我方净亏一张主的期权**。
 * 代价按「队友手上还有主的概率」加权 —— 他要是主已断,这一截就不存在。
 * ============================================================ */
function trumpLeadPrior(L, cards){
  if(!AIP.trumpLeadPrior) return 0;
  const partner=(L.seat+2)%4;
  const ptN=L.seat===undefined?1:expHoldIn(L,partner,'T');
  const pHas=clamp(ptN,0,1);                       // 期望 ≥1 张就当他肯定还有主
  /* 我方主牌占优时这条代价要让路 —— 「逼队友也吐一张主」只在主牌稀缺时才是损失,
   * 主牌碾压的时候把双方一起清空恰恰是目的(那就是钓主)。
   * 所以按 dt 从满额线性退到 0:dt ≤ 0 全额,dt 顶到 drawTrumpCap 则完全豁免。 */
  const dt=drawTrumpValue(L);
  const scarce=clamp(1-dt/AIP.drawTrumpCap,0,1);
  /* 还要乘上「此刻攥着主牌到底值不值钱」。这条先验的全部理由是
   * 「我方那两张主本来留着毙牌和护底」—— 收官阶段底里没分时,那两件事都不存在了,
   * 攥着主牌毫无意义,该兑现就兑现。`phaseK` 正好是这个量:
   * 开局 1.0、中盘 0.7、收官则由底分决定(底分 0 → 0.15,底分 20 → ≈1.05)。 */
  const worth=phaseK(L);
  // 张数上封顶在 2:再长的一手,队友本来也躲不掉要跟,边际代价饱和
  return AIP.trumpLeadPrior*pHas*Math.min(cards.length,2)*scarce*worth;
}

function scoreLeadEV(L, cl, cards, pre){
  const {pts,ruffP,fut}=pre;
  const p=leadWinP(L,cl,cards);
  let pMine;
  if(AIP.leadTempoSplit){
    const LS=Object.create(L);
    LS.ptsTable=countPoints(cards)+(unseenPointsIn(L.mem,cl.suit,L.trump)>0?5:0); LS.lead=null;
    pMine=Math.min(p,pSurvive(LS,cl,L.remainingOpp));
  }
  const gain=pts+leadPointsEV(L,cl,cards);
  const loss=pts+leadLossPoints(L,cl,cards);
  let s=(p*gain-(1-p)*loss)*(L.pw||1)-fut, reason;
  // 牌型本身的可打性:拖拉机/对子难被跟死,同样的 p 下更该打 —— 这一点 p 表达不了
  if(cl.type==='tractor') s+=AIP.leadShapeBonus*(cards.length-1);
  else if(cl.type==='pair') s+=AIP.leadShapeBonus;
  if(cl.type==='tractor') reason=p>0.6?'拖拉机难跟,压一手':'拖拉机,但在外还有更大的';
  else if(cl.type==='pair') reason=p>0.6?'这一对多半压得住,先收一墩':(pts?'分对慎出':'出对子');
  else reason=p>0.6?'这张多半压得住':'小牌探路';
  if(cl.suit==='T'){
    /* 钓主的正半边在旧口径里是被**故意砍掉**的:「对所有主牌领出一律加正的 edge 奖励
     * 反而掉分(unit 0→+2.0、4→0.0、8→−2.8)」。那个结论成立的前提是,
     * 在那条手写常数式里 edge 是一个**跨候选的常数偏移**,把低主领出也一起抬了上去。
     * 换成 EV 口径之后它不再是常数:按 p 加权,压得住场的主拖拉机拿到大部分奖励,
     * 一张孤零零的小主 p 很低、几乎拿不到 —— 该分开的两件事这才真的分开了。
     * 同理,leadWeakTrump 那个「白烧一张主」的罚分本来就该按**输掉的概率**收。 */
    const dt=drawTrumpValue(L);
    /* v0.6.1:`Math.min(0,dt)` 这一截就是那条被藏起来的先验。改成显式项之后,
     * 负半边只保留「主牌确实不占优」这一层判断,强度交给 trumpLeadPrior。
     * trumpLeadPrior=0 即退回 v0.6.0 的行为(纯靠 min(0,dt) + leadWeakTrump)。 */
    // dt 的负半边同样只在「攥着主牌还值钱」时才该扣满 —— 同一个理由
    const dtNeg=Math.min(0,dt)*(AIP.trumpLeadPrior?AIP.dtNegDamp*phaseK(L):1);
    const trumpPen=-dtNeg+AIP.leadWeakTrump*(1-p)+trumpLeadPrior(L,cards);
    s+=p*Math.max(0,dt)-trumpPen;
    pre.trumpPen=trumpPen;
    if(dt>8&&p>0.5&&cards.every(c=>c.suit!=='X')) reason='主牌多于对手,钓主清场';
    // 钓主:EV 模型看不见「把牌权过渡给队友」的那一小截额外价值
    const tw=tiaoWangValue(L,cl,cards);
    s+=tw;
    /* v0.6.0:理由字符串跟着**判据**走,不再跟着 tw 的大小走。
     * 现在「这是不是一次钓主」的判据是:这张压不住场(p_mine 低),
     * 但本队仍有相当把握拿下这墩 —— 也就是 pTeam 里**队友救回来**的那一截占了大头。
     * 旧版用 `tw > leadWeakTrump/2` 当判据,而 tw 的大头是 drawOut(逼对手吐主),
     * 关掉 drawOut 之后钓主的理由字符串会整个消失,可行为本身反而更对了。 */
    const rescue=AIP.leadTeamP?partnerRescueP(L,cl):0;
    if(cl.type==='single'&&rescue>=AIP.tiaoLabelP&&p<0.75&&cards.every(c=>c.suit!=='X'))
      reason='钓主:小主换牌权,交给队友接';
    else if(tw>AIP.leadWeakTrump*0.5) reason='钓主:小主换牌权,逼对手出大牌';
    else if(p<0.4&&!(dt>8&&p>0.5)) reason='小主领出压不住场,吊不出对手的大主';
  }else{
    const fr=feedRuffValue(L,cl,cards);
    if(fr>0){ s+=fr; reason='主打队友的断门,让他毙下这墩'; }
    else if(L.partnerAce&&L.partnerAce[cl.suit]&&p<0.6){
      s+=AIP.probeSafeBonus; reason='队友多半握着这门的 A —— 这是贴分,不是探路'; }
    // unseenPointsIn 数的是**在外**的分:我自己手上这张分牌不在其中。
    // 所以话得说成「别人手上没分了」,不能说成「这门的分打光了」—— 我领出的可能正是分牌。
    else if(p<0.4&&unseenPointsIn(L.mem,cl.suit,L.trump)===0) reason='这门在外已无分,交牌权代价小';
  }
  if(ruffP>0.25&&cl.suit!=='T'&&p>0.6){ reason='压得住,但对手可能缺门来毙'; }
  if(AIP.voidLeadCost&&cl.suit!=='T') s-=AIP.voidLeadCost*ruffP;
  return {score:s,reason,pWin:p,pMine,trumpPen:pre.trumpPen};
}

function scoreLeadPlay(L, cl, cards){
  const r=scoreLeadCore(L,cl,cards);
  if(r.pWin===undefined) return r;
  return {score:r.score+leadTempo(L,cards,r.pWin,r.pMine), reason:r.reason, trumpPen:r.trumpPen, pWin:r.pWin};
}

function scoreLeadCore(L, cl, cards){
  const {trump,mem}=L;
  if(!cl) return {score:-20,reason:'不成牌型'};
  const comps=cl.type==='throw'?cl.comps:[cl];
  const allBoss=comps.every(c=>isBossPlay({type:c.type,len:c.len,suit:cl.suit,top:c.top},mem,trump));
  const pts=countPoints(cards), size=cards.length;
  const ruffP=cl.suit!=='T'?L.oppVoidP(cl.suit):0;   // 对手缺这门的概率
  const ruffable=ruffP>0.5;
  const fut=futureValue(cards,L);              // 机会成本:这手留着以后值多少
  if(cl.type==='throw'){
    if(allBoss&&!ruffable)
      return {score:68+size*3+leadPointsEV(L,cl,cards)*1.4*(L.pw||1)-fut*0.35,
              reason:'整门都是最大,甩牌施压',pWin:LEAD_PWIN.throwBoss};
    return {score:5-pts*4,reason:'甩牌有风险'};
  }
  if(allBoss&&AIP.bossRuffEV&&cl.suit!=='T'&&ruffP>AIP.bossRuffEVP){
    const r=scoreLeadEV(L,cl,cards,{pts,ruffP,fut:fut*AIP.futLeadCashDamp});
    r.reason='虽是钢板,但对手多半断这门 —— 按被毙的概率算';
    return r;
  }
  if(allBoss&&AIP.leadEV2){
    /* v0.6.1 —— 钢板领出也走统一期望分口径,`bossBase` / `bossSize` 就此退休。
     *
     * v0.5.8 把非钢板换成了真实的期望分,钢板这一支却还是
     * `40 + size×8 + ev×1.4 − fut×k`,一个**比真实 stake 还大的标定常数**。
     * v0.5.8 想给护底 flat 项封顶在它保护的那笔分上,一封就输给这个常数;
     * v0.6.0 把它从 40 扫到 34 挣了 0.41 分,但那只是把它调小,没让它变成「真实的分」。
     *
     * 现在两支合并:`p·Gain − (1−p)·Loss + Tempo − Future`。
     * 「拿住牌权继续兑现手上的钢板」这件事本来就由 `leadTempo` 按贴现和算出来了 ——
     * 那正是 v4 从 56 里拆出来的那一截。剩下的只需要两条钢板专属的修正:
     *   · 副牌钢板的机会成本折 `futLeadCashDamp` —— 它的「未来价值」本来就是
     *     「以后领出去收分」,现在领出就是在兑现它,不该重复扣一遍;
     *     主牌钢板不同,出掉是真的丧失压制力,照全额扣。
     *   · 一点结构溢价 `bossShapeBonus` —— 整手压得住这件事本身有额外确定性,
     *     而 p 已经贴到 0.95 上下,再高也表达不出来。
     * `ruffP > 0.25` 那条特例罚分也删掉:`leadWinP` 里 `pSurvive` 的
     * `pVoidLead × 0.8 × 0.85` 算的就是被毙的概率,不需要再补一刀。 */
    const pre2={pts,ruffP,fut:fut*(cl.suit==='T'?1:AIP.futLeadCashDamp)};
    const r=scoreLeadEV(L,cl,cards,pre2);
    r.score+=AIP.bossShapeBonus;
    if(!/钓主|清场|不占优/.test(r.reason))
      r.reason=cl.suit==='T'?(L.phase==='end'?'收官清主':'主牌钢板,压制力兑现')
                            :'本门在外已无更大,先收一墩';
    return r;
  }
  if(allBoss){
    // 稳赢的一手:收益 = 这墩能收的分 + 拿住牌权的战略值,成本 = 机会成本。
    // 副牌钢板的机会成本只算 0.35 —— 它的「未来价值」本来就是「以后领出去收分」,
    // 现在领出就是在兑现它,不该重复扣一遍;主牌钢板不同,出掉是真的丧失压制力。
    const ev=leadPointsEV(L,cl,cards);
    let s=(AIP.bossBase)+size*(AIP.bossSize)+ev*1.4*(L.pw||1)-fut*(cl.suit==='T'?1:0.35), reason='本门在外已无更大,先收一墩';
    if(cl.suit==='T'){
      // 大主牌/王对是全场压制力,开局中盘直出等于自废武功。
      // 「有多不可替代」交给 Future 去表达(王对 18~30,普通主牌 2.5~8),
      // 这里只留一个统一的基础折扣,避免把「清主」这种好棋也一并否掉。
      s-=L.phase==='end'?4:AIP.leadTrumpPenalty;
      reason=L.phase==='end'?'收官清主':'大主牌留作后手,压制到收官';
      // 钓主的奖励只给非王的主牌:用王去吊,吊出来的主牌数量一样,却把全场最后的控制权
      // 提前花掉了(「大怪留后手」)。负半边照扣 —— 主牌不占优时,连王带主都不该主动动。
      const dt=drawTrumpValue(L);
      s+=cards.every(c=>c.suit!=='X')?dt:Math.min(0,dt);
      if(dt>8&&cards.every(c=>c.suit!=='X')) reason='主牌多于对手,钓主清场(大怪留后手)';
      else if(dt<-8) reason='主牌不占优,先不动主';
    }
    if(ruffP>0.25){ s-=(35+(pts?10:0))*ruffP; reason='虽是钢板,但对手可能缺门来毙'; }
    return {score:s,reason,pWin:cl.suit==='T'?0.97:LEAD_PWIN.boss*(1-ruffP)};
  }
  // 非钢板的主牌领出压不住场,对手用最小的主跟掉 —— 吊不出他的大主,只烧掉自己的。
  // 所以这里**只取 drawTrumpValue 的负半边**:没有主牌优势要罚,有优势也不奖励
  // (奖励留给钢板那一支,只有压得住的主牌才真的能把对手的主逼出来)。
  // 实测:对所有主牌领出一律加正的 edge 奖励反而掉分(unit 0→+2.0、4→0.0、8→−2.8),
  // 因为那是一个跨候选的常数偏移,把低主领出也一起抬了上去,正是要修的毛病。
  const dtc=cl.suit==='T'?Math.min(0,drawTrumpValue(L))-AIP.leadWeakTrump:0;
  // v0.5.8 ④⑥:非钢板走统一 EV 口径(见 scoreLeadEV)。旧的三条手写常数式留在下面,
  // AIP.leadEV=0 即回退,便于单组件消融。
  if(AIP.leadEV) return scoreLeadEV(L,cl,cards,{pts,size,ruffP,ruffable,fut,dtc});
  if(cl.type==='tractor')
    return {score:30+size*4-(ruffable?10:0)-fut+dtc,reason:'拖拉机难跟,压一手',pWin:LEAD_PWIN.tractor};
  if(cl.type==='pair'){
    // 对子的「探路」比单张危险小(对子难被跟死),但同样受豁免条件约束
    const safePair=cl.suit!=='T'&&((L.partnerAce&&L.partnerAce[cl.suit])
                   ||unseenPointsIn(L.mem,cl.suit,L.trump)===0);
    return {score:20-cl.top*0.5-pts*4-(ruffable?8:0)-fut+dtc
                  -(cl.suit!=='T'&&!safePair?AIP.probePenalty*AIP.probePairScale:0),
            reason:pts?'分对慎出,无保护先探路':'出对子探路',
            pWin:LEAD_PWIN.pair};
  }
  let s=16-cl.top*0.8-pts*6-(ruffable&&pts?8:0)-fut, reason='小牌探路';
  if(cl.suit==='T'){
    // 低主领出有两种完全不同的情形,旧版混为一谈、一律重罚:
    //   · 对手主已断 / 我方主不占优 → 确实是白烧一张主再把牌权送出去
    //   · 对手还必须跟主、我方主占优 → 这是**钓主**,用极小的消耗逼对手出大牌、
    //     或者把牌权过渡给队友。判据见 tiaoWangValue(要下界,所以以前做不了)。
    const tw=tiaoWangValue(L,cl,cards);
    s+=Math.min(0,drawTrumpValue(L))-AIP.leadWeakTrump+tw;
    reason=tw>AIP.leadWeakTrump*0.5?'钓主:小主换牌权,逼对手出大牌'
          :'小主领出压不住场,吊不出对手的大主';
  }else{
    /* 副色小牌「探路」通常是坏棋:把牌权无消耗地交出去,还可能连分一起送。
     * 只有几种情形下它不是探路,而是有明确目的的一手 —— 其余一律降到兜底,
     * 让钓主之类的候选先出线。 */
    const fr=feedRuffValue(L,cl,cards);
    const partnerHasAce=L.partnerAce&&L.partnerAce[cl.suit];
    const noPts=unseenPointsIn(L.mem,cl.suit,L.trump)===0;
    if(fr>0){ s+=fr; reason='主打队友的断门,让他毙下这墩'; }
    else if(partnerHasAce){ s+=AIP.probeSafeBonus; reason='队友多半握着这门的 A —— 这是贴分,不是探路'; }
    else if(noPts){ reason='这门在外已无分,交牌权代价小'; }
    else { s-=AIP.probePenalty; reason='副色小牌探路(下策:白交牌权)'; }
  }
  return {score:s,reason,pWin:LEAD_PWIN.single};
}

/* ============================================================
 * v0.7.0 —— 收官蒙特卡洛(`endgameSearch`)
 *
 * 设计文档 §7 第一行「无跨墩规划」。v0.5.8~v0.6.1 连撞三次
 * 「结构改对了反而掉分」(护底封顶、drawTrumpValue 的符号、bossBase),
 * 追到底都是同一件事:**打分器只算一墩**,而护底、钓主、钢板串问的都是
 * 「这一手在往后几墩里还能换来什么」。那几个量纲错误的大常数,
 * 就是模型用来顶替这块缺失的补丁 —— 所以先做推演,再回头拆常数。
 *
 * 为什么从收官做起:剩 5 张时状态空间已经很小,而底牌翻倍让最后几墩的
 * 单墩价值远高于中盘 —— 算力回报率最高的一段。
 *
 * 三件事和启发式那一套彻底不同:
 *
 * ① **目标函数是阶梯本身,不是期望分。** 每个样本推演到局末,直接按引擎的
 *    `scoreRound` 结算,再折成「我方净升几级」。用户那条式子
 *    `[底分×抠底倍数×P(守住) + 当前分 − 目标分] vs [本墩得分×P(拿下) + 当前分 − 目标分]`
 *    在这里是**自动成立**的:抠底倍数由推演里最后一墩实际出几张决定,
 *    守住概率由样本频率给出,目标分由 scoreRound 的 0/40/80/120/160/200 台阶给出。
 *    不需要 pointWeight 那个高斯包络去近似跨线概率。
 * ② **抽样受记牌约束。** 未见牌按「每家手牌数相同 + 硬缺门 + maxHoldIn 上界」
 *    分配到三家和底牌;分不动就重抽(有次数上限,抽不出就退回启发式)。
 * ③ **推演策略必须便宜。** 用不起 aiChooseFollow(它每次都要重建记牌)。
 *    rollout 用 minWinFollow / buildFollow 这一层构造式候选 ——
 *    它们只需要 hand/lead/trump,而且天然合法。
 *
 * 预算:候选数 × 样本数 有硬上限,超时直接退回启发式打分。
 * 开关 AIP.egSearch=0 整块关闭。
 * ============================================================ */

// 便宜的推演策略:够用就行,不追求最优 —— 样本量比单样本质量更值钱
function rolloutLead(hand, trump, mem){
  const bySuit={};
  hand.forEach(c=>{(bySuit[effSuit(c,trump)]=bySuit[effSuit(c,trump)]||[]).push(c);});
  let best=null, bestKey=-1e9;
  for(const su in bySuit){
    for(const comp of decompose(bySuit[su],trump)){
      const cl={type:comp.type,len:comp.len,suit:su,top:comp.top};
      const boss=isBossPlay(cl,mem,trump);
      // 钢板先收(带分的更先);否则出最小的、不带分的
      const k=(boss?100:0)+(boss?countPoints(comp.cards)*2+comp.cards.length*3:-comp.top-countPoints(comp.cards)*4)
             -(su==='T'&&!boss?20:0);
      if(k>bestKey){ bestKey=k; best=comp.cards; }
    }
  }
  return best||[hand[0]];
}
function rolloutFollow(hand, lead, trump, plays, seat){
  const cur=currentWinner(plays,trump);
  const partnerWinning=cur.seat%2===seat%2;
  const isLast=plays.length===3;
  const pts=countPoints(plays.flatMap(p=>p.cards));
  if(!partnerWinning){
    // 台面有分、或这是能一锤定音的最后一手 → 吃;否则跟小
    const win=(pts>0||isLast)?minWinFollow(hand,lead,trump,cur.cl,isLast):null;
    if(win) return win;
    return buildFollow(hand,lead,trump,'cheap',null)||buildFollow(hand,lead,trump,'discard',null);
  }
  /* 队友暂大:末家(他已经赢定)就贴分,否则跟小。
   * 这里**不能**调 makeMemory 去判钢板 —— 那是一次 108 张的重建,
   * 而这个函数在每个样本的每一墩都会被调到,实测占了搜索开销的大半。
   * 推演策略便宜比精确重要:样本量能买回来的东西比单样本质量多。 */
  const strat=isLast?'dump':'cheap';
  return buildFollow(hand,lead,trump,strat,null)||buildFollow(hand,lead,trump,'cheap',null);
}

/* 按约束抽一副「其余三家 + 底牌」的可能牌。
 * 约束:各家张数(已出过牌的那几家少一张)、硬缺门、maxHoldIn 的上界。
 * 用「最受限的牌先安排」的贪心 + 有界重试,抽不出就返回 null。 */
function sampleWorld(ctx, rand){
  const {unseen,sizes,seats,voids,trump,kittySize,capOf,pVoidOf}=ctx;
  for(let attempt=0;attempt<AIP.egRetries;attempt++){
    let pool=shuffle(unseen,rand);
    const hands={}, cnt={}, used={};
    seats.forEach(s=>{hands[s]=[];cnt[s]={};});
    let kitty=[], ok=true;
    /* v0.7.15:底牌不是均匀抽的。旧版把底牌当「三家都塞满之后剩下的牌」——
     * 剩下的恰恰是约束最少的那些,也就是主牌(副牌门有缺门约束,主门几乎没有),
     * 于是抽出来的底牌里主牌偏多、对手手里的主牌偏少 —— 闲家搜出来的世界系统性低估
     * 庄家方的主。而庄家埋底的策略是已知的(faceValue:绝不埋主、不埋 A、尽量不埋分),
     * 这里就按它抽:先从「非主、非 A」的牌里挑底牌,分牌降权,再把其余的牌分给三家。 */
    if(AIP.egKittyModel&&kittySize>0){
      const elig=pool.filter(c=>effSuit(c,trump)!=='T'&&c.rank!==14);
      const w=c=>cardPoints(c)?AIP.egKittyPtW:1;
      const rest=new Set();
      while(kitty.length<kittySize&&elig.length){
        let tot=0; for(const c of elig) if(!rest.has(c.id)) tot+=w(c);
        if(tot<=0) break;
        let r=rand()*tot, pick=null;
        for(const c of elig){ if(rest.has(c.id)) continue; r-=w(c); if(r<=0){ pick=c; break; } }
        if(!pick) break;
        kitty.push(pick); rest.add(pick.id);
      }
      pool=pool.filter(c=>!rest.has(c.id));
    }
    /* v0.7.15:亮主的那家手里**一定**还有他亮出来的那几张(级牌 / 王对),直到打出来为止。
     * 这是硬信息,不是推断 —— 先把它们钉给他,再分其余的牌。 */
    if(ctx.known&&ctx.known.length){
      const fixed=new Set();
      for(const k of ctx.known){
        if(!seats.includes(k.seat)||hands[k.seat].length>=sizes[k.seat]) continue;
        const c=pool.find(x=>!fixed.has(x.id)&&x.suit===k.suit&&x.rank===k.rank);
        if(!c) continue;
        fixed.add(c.id); hands[k.seat].push(c); const su=effSuit(c,trump); cnt[k.seat][su]=(cnt[k.seat][su]||0)+1;
      }
      pool=pool.filter(c=>!fixed.has(c.id));
    }
    // 先把「能去的地方最少」的牌安排掉
    const order=pool.slice().sort((a,b)=>
      seats.filter(s=>!voids[s][effSuit(a,trump)]).length
     -seats.filter(s=>!voids[s][effSuit(b,trump)]).length);
    for(const c of order){
      const su=effSuit(c,trump);
      const cand=seats.filter(s=>hands[s].length<sizes[s]&&!voids[s][su]
                   &&(cnt[s][su]||0)<capOf(s,su));
      if(!cand.length){
        if(kitty.length<kittySize){ kitty.push(c); continue; }
        ok=false; break;
      }
      // 按剩余空位加权,避免最后一家被塞满;egVoidW 时再乘「他还有这门」的概率
      let tot=0; const w=cand.map(s=>{let x=sizes[s]-hands[s].length;
        if(pVoidOf) x*=Math.pow(Math.max(0,1-pVoidOf(s,su)),AIP.egVoidW);
        tot+=x; return x;});
      // 全被压成 0(几家都「几乎肯定」没这门,可硬约束又只允许他们)就退回按空位
      if(tot<=0){ tot=0; cand.forEach((s,i)=>{ w[i]=sizes[s]-hands[s].length; tot+=w[i]; }); }
      let r=rand()*tot, pick=cand[0];
      for(let i=0;i<cand.length;i++){ r-=w[i]; if(r<=0){ pick=cand[i]; break; } }
      hands[pick].push(c); cnt[pick][su]=(cnt[pick][su]||0)+1;
    }
    if(!ok) continue;
    if(seats.some(s=>hands[s].length!==sizes[s])) continue;
    return {hands,kitty};
  }
  return null;
}

/* 从当前局面推演到局末,返回本局闲家总分与最后一墩信息 */
function rolloutToEnd(st){
  const {trump,declSeat}=st;
  const hands=st.hands.map(h=>h.slice());
  let plays=st.plays.map(p=>({seat:p.seat,cards:p.cards.slice()}));
  let leader=st.leader, defPoints=st.defPoints, lastWinner=-1, lastLeadSize=1;
  let guard=0;
  while(hands.some(h=>h.length)||plays.length){
    if(plays.length===0){
      const cards=rolloutLead(hands[leader],trump,st.mem);
      cards.forEach(c=>removeCard(hands[leader],c));
      plays.push({seat:leader,cards});
    }
    while(plays.length<4){
      const seat=(plays[0].seat+plays.length)%4;
      const lead=classify(plays[0].cards,trump);
      let cards=rolloutFollow(hands[seat],lead,trump,plays,seat);
      if(!cards||!isLegalFollow(hands[seat],lead,cards,trump))
        cards=genFollow(hands[seat],lead,trump,st.rand);
      cards.forEach(c=>removeCard(hands[seat],c));
      plays.push({seat,cards});
    }
    lastLeadSize=plays[0].cards.length;
    const res=resolveTrick(plays,trump);
    if(res.winner%2!==declSeat%2) defPoints+=res.points;
    lastWinner=res.winner; leader=res.winner; plays=[];
    if(++guard>30) break;
  }
  return {defPoints,lastWinner,lastLeadSize};
}

/* 收官精确解(v0.7.15):牌少到一定程度时,一个抽样世界不再用推演策略打完,
 * 而是对四家做完全信息的极小极大(双明手)。目标仍是 levelUtility(根方视角),
 * 对手最小化、本队最大化,alpha-beta 剪枝。领出只取拆解后的组件(和 rolloutLead 同口径,
 * 不甩牌);跟牌枚举所有合法子集并按牌面去重。 */
/* 单张的等价归并:完全信息下,同一门里两张牌之间若没有别家的牌、分值又相同,
 * 出哪一张结果完全一样 —— 双明手求解的标准剪枝。others = 别家手里 + 本墩已出的牌。
 *
 * ⚠️ 这条剪枝**在两副牌里不成立**,拆不拆对子有价值,而它看不见这件事。
 * 实测:手里 ♥6♥6 + ♥7,跟一张牌时归并之后**只剩「出 ♥6」**——「出 ♥7、把 ♥6♥6
 * 留成一对」被当成等价扔掉了。桥牌里只有大小次序,这里还有牌型。
 * egExact 那两批「持平」的读数里有多少是这个造成的,没有量过;
 * 要再捡起收官精确解这条线,先修它再重测。 */
function egDedupSingles(moves, others, trump){
  if(moves.length<2) return moves;
  const out=[], keep=[];
  for(const mv of moves){
    if(mv.length!==1){ out.push(mv); continue; }
    const c=mv[0], su=effSuit(c,trump), idx=ordIdx(c,trump), pts=cardPoints(c);
    let dup=false;
    for(const k of keep){
      if(k.su!==su||k.pts!==pts) continue;
      const lo=Math.min(k.idx,idx), hi=Math.max(k.idx,idx);
      if(!others.some(o=>effSuit(o,trump)===su&&ordIdx(o,trump)>lo&&ordIdx(o,trump)<hi)){ dup=true; break; }
    }
    if(!dup){ keep.push({su,idx,pts}); out.push(mv); }
  }
  return out;
}
function egMoves(hand, lead, trump, others){
  if(!lead){
    const bySuit={}; hand.forEach(c=>{(bySuit[effSuit(c,trump)]=bySuit[effSuit(c,trump)]||[]).push(c);});
    const out=[]; for(const su in bySuit) for(const comp of decompose(bySuit[su],trump)) out.push(comp.cards);
    return others?egDedupSingles(out,others,trump):out;
  }
  const k=lead.cards.length, n=hand.length, out=[], seen=new Set();
  const rec=(start,pick)=>{
    if(pick.length===k){
      const key=pick.map(c=>c.suit+c.rank).sort().join(',');
      if(seen.has(key)) return; seen.add(key);
      if(isLegalFollow(hand,lead,pick,trump)) out.push(pick.slice());
      return;
    }
    for(let i=start;i<=n-(k-pick.length);i++){ pick.push(hand[i]); rec(i+1,pick); pick.pop(); }
  };
  rec(0,[]);
  return others?egDedupSingles(out,others,trump):out;
}
function egSolve(st, alpha, beta){
  const {hands,trump,declSeat,kitty,rootTeam}=st;
  let plays=st.plays;
  if(plays.length===4){
    const res=resolveTrick(plays,trump);
    const defPoints=st.defPoints+(res.winner%2!==declSeat%2?res.points:0);
    if(!hands.some(h=>h.length)){
      const sc=scoreRound({defPoints,kitty,defWonLastTrick:res.winner%2!==declSeat%2,lastLeadSize:plays[0].cards.length});
      return levelUtility(sc,rootTeam,declSeat%2);
    }
    return egSolve({...st,plays:[],leader:res.winner,defPoints},alpha,beta);
  }
  const seat=plays.length?(plays[0].seat+plays.length)%4:st.leader;
  const lead=plays.length?classify(plays[0].cards,trump):null;
  const others=[]; for(let i=0;i<4;i++) if(i!==seat) for(const c of hands[i]) others.push(c);
  for(const p of plays) for(const c of p.cards) others.push(c);
  const moves=egMoves(hands[seat],lead,trump,others);
  const maxing=seat%2===rootTeam;
  let best=maxing?-1e9:1e9;
  for(const mv of moves){
    const gone=new Set(mv.map(c=>c.id));
    const h2=hands.slice(); h2[seat]=hands[seat].filter(c=>!gone.has(c.id));
    const v=egSolve({...st,hands:h2,plays:plays.concat([{seat,cards:mv}])},alpha,beta);
    if(maxing){ if(v>best) best=v; if(best>alpha) alpha=best; }
    else { if(v<best) best=v; if(best<beta) beta=best; }
    if(alpha>=beta) break;
  }
  return best;
}

/* 折成「我方净升几级」—— 这就是真正的目标函数,阶梯与抠底倍数都在 scoreRound 里。
 *
 * 但**纯阶梯是一个阶跃函数**:两个候选差 5 分,多数样本落在同一级台阶上,
 * u 完全相同 —— 搜索在台阶内部是瞎的。所以再掺一点点连续项打破平局:
 * 一级台阶 40 分,`egPointsEps × 40` 要明显小于 1,阶梯才仍然主导,
 * 同时台阶内部有梯度可循。这正是「以阶梯为目标、以分数为次序」的写法。
 */
function levelUtility(sc, myTeam, declTeam){
  const gain=sc.defendersWin
    ? (declTeam===myTeam?0:1+(sc.defenderLevelsUp||0))
    : (declTeam===myTeam?(sc.declarerLevelsUp||0):0);
  const lose=sc.defendersWin&&declTeam===myTeam?1:0;      // 丢庄
  const myPts=declTeam===myTeam?(200-sc.total):sc.total;  // 本队这一局拿到的分
  return gain-lose+AIP.egPointsEps*myPts;
}

/* 对一组候选做收官搜索。返回 [{cards, u}] 或 null(条件不满足/预算不够) */
function endgameSearch(view, plays, cands){
  if(!AIP.egSearch) return null;
  const trump=view.trump;
  const n=view.hand.length;
  if(n<1||n>AIP.egMaxCards) return null;
  if(view.declSeat===undefined||view.declSeat<0) return null;
  if(cands.length<2||cands.length>AIP.egMaxCands) return null;   // 只有一个候选,没什么可搜的
  const mem=makeMemory(view);
  const unseen=[];
  let uid=0;
  for(const k in mem.unseen){
    const c=keyToCard(k);
    for(let i=0;i<mem.unseen[k];i++) unseen.push({suit:c.suit,rank:c.rank,id:'e'+(uid++)});
  }
  const seats=[0,1,2,3].filter(s=>s!==view.seat);
  const played=new Set((plays||[]).map(p=>p.seat));
  const sizes={}; seats.forEach(s=>{ sizes[s]=n-(played.has(s)?1:0); });
  const kittySize=view.buriedKnown&&view.buriedKnown.length?0:RULES.kittySize;
  if(unseen.length!==seats.reduce((a,s)=>a+sizes[s],0)+kittySize) return null;
  const voids=makeVoids(view.history||[],trump);
  const reads=makeReads(view.history||[],trump);
  const capOf=(s,su)=>maxHoldIn(reads,mem,s,su,trump);
  const pVoidOf=AIP.egVoidW>0?makeVoidProb(reads,mem,trump,n,{declSeat:view.declSeat,me:view.seat}):null;
  const rand=rng((view.history||[]).length*7919+view.seat*31+n*17+1);
  /* 亮主者手里钉死的牌:亮 k 张级牌 → 他手里有 k 张该门级牌(减去他已经打出的);王对同理。 */
  const known=[];
  const decl=view.curDecl||view.decl;
  if(AIP.egDeclKnown&&decl&&decl.seat>=0&&decl.seat!==view.seat&&seats.includes(decl.seat)){
    const want=decl.strength>=3?{suit:'X',rank:decl.strength===4?16:15,n:2}
             :decl.suit?{suit:decl.suit,rank:trump.rank,n:decl.strength}:null;
    if(want){
      let playedByHim=0;
      for(const pl of (view.history||[])) if(pl.seat===decl.seat) for(const c of pl.cards) if(c.suit===want.suit&&c.rank===want.rank) playedByHim++;
      for(const pl of (plays||[])) if(pl.seat===decl.seat) for(const c of pl.cards) if(c.suit===want.suit&&c.rank===want.rank) playedByHim++;
      for(let i=0;i<want.n-playedByHim;i++) known.push({seat:decl.seat,suit:want.suit,rank:want.rank});
    }
  }
  const ctx={unseen,sizes,seats,voids,trump,kittySize,capOf,known,pVoidOf};
  const myTeam=view.seat%2, declTeam=view.declSeat%2;
  const rs=roundScore(view);
  const worlds=[];
  const nSamp=AIP.egSamplesBy>0&&n>5?Math.max(AIP.egMinSamples,AIP.egSamples-AIP.egSamplesBy*(n-5)):AIP.egSamples;
  for(let i=0;i<nSamp;i++){
    const w=sampleWorld(ctx,rand);
    if(w) worlds.push(w);
  }
  if(worlds.length<AIP.egMinSamples) return null;
  const out=cands.map(c=>({cards:c.cards,u:0}));
  for(const w of worlds){
    const kitty=view.buriedKnown&&view.buriedKnown.length?view.buriedKnown:w.kitty;
    for(const o of out){
      const hands=[[],[],[],[]];
      seats.forEach(s=>{hands[s]=w.hands[s].slice();});
      hands[view.seat]=view.hand.filter(x=>!o.cards.some(y=>y.id===x.id));
      const p2=(plays||[]).map(p=>({seat:p.seat,cards:p.cards.slice()}));
      p2.push({seat:view.seat,cards:o.cards});
      let leader=p2[0].seat, defPoints=rs.def, pl=p2;
      if(p2.length===4){
        const res=resolveTrick(p2,trump);
        if(res.winner%2!==declTeam) defPoints+=res.points;
        leader=res.winner; pl=[];
        if(!hands.some(h=>h.length)){
          const sc=scoreRound({defPoints,kitty,defWonLastTrick:res.winner%2!==declTeam,
                               lastLeadSize:p2[0].cards.length});
          o.u+=levelUtility(sc,myTeam,declTeam); continue;
        }
      }
      if(AIP.egExact&&n<=AIP.egExact){
        o.u+=egSolve({hands,plays:pl,leader,defPoints,trump,declSeat:view.declSeat,kitty,rootTeam:myTeam},-1e9,1e9);
        continue;
      }
      const r=rolloutToEnd({hands,plays:pl,leader,defPoints,trump,declSeat:view.declSeat,mem,rand});
      const sc=scoreRound({defPoints:r.defPoints,kitty,
        defWonLastTrick:r.lastWinner>=0?r.lastWinner%2!==declTeam:false,
        lastLeadSize:r.lastLeadSize});
      o.u+=levelUtility(sc,myTeam,declTeam);
    }
  }
  out.forEach(o=>{o.u/=worlds.length;});
  out.samples=worlds.length;
  return out;
}

// 领出决策
function aiChooseLead(view){
  const L=leadCtx(view);
  const {trump}=L;
  const bySuit={};
  view.hand.forEach(c=>{(bySuit[effSuit(c,trump)]=bySuit[effSuit(c,trump)]||[]).push(c);});
  const cands=[];
  for(const s in bySuit){
    const comps=decompose(bySuit[s],trump);
    for(const comp of comps){
      const cl={type:comp.type,len:comp.len,suit:s,top:comp.top,cards:comp.cards};
      const r=scoreLeadPlay(L,cl,comp.cards);
      cands.push({cards:comp.cards,score:r.score,reason:r.reason,suit:s,trumpPen:r.trumpPen,pWin:r.pWin});
    }
    // 甩牌候选:整门多组件且全是钢板(引擎 checkThrow 仍会最终把关)
    if(s!=='T'&&comps.length>=2&&bySuit[s].length<=6){
      const cl=classify(bySuit[s],trump);
      if(cl&&cl.type==='throw'){
        const r=scoreLeadPlay(L,cl,bySuit[s]);
        if(r.score>40) cands.push({cards:bySuit[s],score:r.score,reason:r.reason});
      }
    }
    /* 甩**子集**:本门里压不住的那几组一起甩,把带不动的小牌留下。
     *
     * 报障三条其实是同一件事,根子都在上面那段只认「整门」:
     *   · ♣KK 领出后确认没人有 ♣ 对 → 剩下的 ♣10♣10 和 ♣7♣7 该一次甩掉,
     *     可只要手上还有一张管不住的 ♣ 小牌,整门就甩不成立,候选压根不生成;
     *   · 副色 AAK / AKK 同理 —— A 和 KK 各自都压不住,整门带上一张小牌就废了;
     *   · 教练「不能辨别撒牌比单张更大」也是它:候选集里没有子集甩牌,
     *     只能拿单张去比,自然永远建议单张。
     *
     * 为什么值得甩:一墩里「后出的牌结构必须和领出的一样才参与比较」(RULES E)。
     * 分两次打两个对子,对手有**一个**主对就能端走一次;两对一起甩,
     * 他得同时有**两个**主对才拿得走 —— 概率低得多。牌型本身就是护甲。
     *
     * 判据只用「这一组在本门压不住」(isBossPlay),不猜对手断不断门 ——
     * 断门归 ruffable 那一项管,两件事不混在一起。 */
    if(AIP.throwBossSubset&&s!=='T'&&comps.length>=2){
      const boss=comps.filter(cp=>isBossPlay({type:cp.type,len:cp.len,suit:s,top:cp.top},L.mem,trump));
      if(boss.length>=2&&boss.length<comps.length){
        const cs=boss.reduce((a2,cp)=>a2.concat(cp.cards),[]);
        const cl2=classify(cs,trump);
        if(cl2&&cl2.type==='throw'){
          const r2=scoreLeadPlay(L,cl2,cs);
          if(r2.score>40) cands.push({cards:cs,score:r2.score,reason:r2.reason});
        }
      }
    }
  }
  // v3 这里还硬塞过一颗 `score:46 主力雄厚,钓主清场` 的候选。常数 46 无条件压过其他所有
  // 候选,且不看对手还剩几张主 —— 现在钓主的收益由 drawTrumpValue 在正常评分里算出来,
  // 所有主牌组件都能参与竞争,不需要这颗特例。
  /* §7.13 阶段 0:领主的代价是相对的(见 AIP.trumpLeadRel)。
   * 手上没有「副花里高概率赢墩、对手又不太可能断这门」的一手时,钓主不再背那两笔绝对罚分。 */
  if(AIP.trumpLeadRel&&view.hand.length>AIP.egMaxCards){
    // 只在产品方说的那个情形里改判:原本的首选是**领进对手多半断的副花**。
    // 首选若是副花里的钢板 / 高概率赢墩的牌,或者只是副花小牌探路,都不动。
    const top=cands.reduce((a,c)=>c.score>a.score?c:a,cands[0]);
    const intoVoid=top&&top.suit!=='T'&&L.oppVoidP(top.suit)>=0.5;
    if(intoVoid) for(const c of cands) if(c.suit==='T'&&c.trumpPen>0){
      c.score+=AIP.trumpLeadRel*c.trumpPen;
      c.reason='副花里没有稳当的一手,只剩领进对手断门 —— 钓主,把牌权交出去';
    }
  }
  cands.sort((a,b)=>b.score-a.score);
  let best=cands[0]||{cards:[view.hand[0]],reason:'兜底',score:0};
  /* v0.7.0:收官交给搜索。只用它**排序**(目标函数是「净升几级」,和分制不同量纲),
   * 而且要比启发式选中的那个高出 egMargin 级才改判 —— 样本噪声区里仍然听启发式的。 */
  const eg=endgameSearch(view,null,cands.slice(0,AIP.egMaxCands));
  if(eg){
    const cur=eg.find(o=>o.cards===best.cards);
    const top=eg.slice().sort((a,b)=>b.u-a.u)[0];
    if(top&&cur&&top.cards!==cur.cards&&top.u-cur.u>AIP.egMargin){
      const c=cands.find(x=>x.cards===top.cards);
      if(c) best={...c,reason:'收官推演:'+c.reason+`(${eg.samples}样本,净升 ${top.u.toFixed(2)} 级)`};
    }else if(cur) best={...best,reason:best.reason+`(收官推演确认,净升 ${cur.u.toFixed(2)} 级)`};
  }
  return {...best,cands:cands.slice(0,3)};
}

// 教练用:给任意一手领出打分
function coachScoreLead(view, cards){
  return scoreLeadPlay(leadCtx(view),classify(cards,view.trump),cards).score;
}

// 全 AI 无头模拟一整局(测试用;简化亮主为一轮制)
// smartSeats:使用启发式 AI 的座位,其余用随机 AI
function simulateRound(seed, smartSeats=[0,1,2,3]){
  const {first}=cutForFirst(seed);
  const {hands,kitty}=dealRound(seed,first);
  let best=null, declSeat=-1;
  for(let s=0;s<4;s++){
    const o=declOptions(hands[s],RULES.levelStart)[0];
    if(o && (!best||o.strength>best.strength)){ best=o; declSeat=s; }
  }
  const rand=rng(seed^0x9e3779b9);
  let trump;
  if(!best){ trump={suit:null,rank:RULES.levelStart}; declSeat=first; }
  else{
    trump={suit:best.suit,rank:RULES.levelStart};
    for(let s=0;s<4;s++){
      if(s!==declSeat && jokerPairOf(hands[s]) && rand()<0.3){
        trump={suit:null,rank:RULES.levelStart}; declSeat=s; break;  // 无庄盘:造反者坐庄
      }
    }
  }
  hands[declSeat].push(...kitty);
  const buried=aiDiscard(hands[declSeat],trump);
  buried.forEach(c=>removeCard(hands[declSeat],c));
  const declTeam=declSeat%2;
  const smart=new Set(smartSeats);
  const history=[];
  let leader=declSeat, defPoints=0, lastWinner=declSeat, lastLeadSize=1, tricks=0, cardsPlayed=0;
  while(hands.some(h=>h.length)){
    const plays=[];
    for(let i=0;i<4;i++){
      const seat=(leader+i)%4;
      const view={seat,hand:hands[seat],trump,declSeat,history:[...history,...plays],
                  buriedKnown:seat===declSeat?buried:[]};
      let cards;
      if(i===0){
        cards=smart.has(seat)?aiChooseLead(view).cards:aiLead(hands[seat],trump,rand);
        const chk=checkThrow(hands,seat,cards,trump);
        if(!chk.ok) cards=chk.forced;
      }else{
        const lead=classify(plays[0].cards,trump);
        cards=smart.has(seat)?aiChooseFollow(view,plays).cards
                             :genFollow(hands[seat],lead,trump,rand);
        if(!isLegalFollow(hands[seat],lead,cards,trump))
          throw new Error('AI 出牌不合法 seed='+seed+' seat='+seat);
      }
      cards.forEach(c=>removeCard(hands[seat],c));
      cardsPlayed+=cards.length;
      plays.push({seat,cards});
    }
    history.push(...plays);
    lastLeadSize=plays[0].cards.length;
    const res=resolveTrick(plays,trump);
    leader=res.winner; lastWinner=res.winner; tricks++;
    if(res.winner%2!==declTeam) defPoints+=res.points;
    if(tricks>100) throw new Error('死循环 seed='+seed);
  }
  return {...scoreRound({defPoints,kitty:buried,defWonLastTrick:lastWinner%2!==declTeam,lastLeadSize}),
          defPoints, tricks, declSeat, cardsPlayed, noTrump:!trump.suit};
}

    // 接到 advanceMatch 上
    let a=E.advanceMatch([3,2],0,{defendersWin:false,declarerLevelsUp:3},G4);
    ok('advanceMatch:打3升3级被5拦下并报关卡', a.levels[0]===5&&a.gateStopped===5);
    a=E.advanceMatch([3,2],0,{defendersWin:false,declarerLevelsUp:3},null);
    ok('advanceMatch:不开关卡时照常升到6', a.levels[0]===6&&a.gateStopped===null);
    a=E.advanceMatch([5,2],0,{defendersWin:false,declarerLevelsUp:3},G4);
    ok('advanceMatch:已在关卡上,升级不再被同一关卡拦', a.levels[0]===8&&a.gateStopped===null);

    // 第二层:过关要本队坐庄打过这一级(报障:闲家本级2、抢到150分直接打3)
    const win150=E.scoreRound({defPoints:150,kitty:[],defWonLastTrick:false,lastLeadSize:1});
    ok('150分的结算是上台升1级', win150.defendersWin&&win150.defenderLevelsUp===1);
    // 队1坐庄打2,队0(闲家)本级也是2 —— 队0从没坐庄打过2
    a=E.advanceMatch([2,2],1,win150,G4,[-1,-1]);
    ok('必打:闲家停在关卡上,上台只换庄不升级', a.levels[0]===2&&a.gateHeld===2);
    ok('必打:被卡住时下一局由这一方坐庄', a.dealer%2===0);
    // 同一局面,队0此前已坐庄打过2 → 照常升级
    a=E.advanceMatch([2,2],1,win150,G4,[2,-1]);
    ok('必打:已坐庄守住过就放行', a.levels[0]===3&&a.gateHeld===null);
    // 不是关卡的级数不受这条约束
    a=E.advanceMatch([3,2],1,win150,G4,[-1,-1]);
    ok('必打:非关卡级数照常升', a.levels[0]===4&&a.gateHeld===null);
    // 庄家方守住的那一局,本身就是「打过」的证据,不该卡自己
    a=E.advanceMatch([2,2],0,{defendersWin:false,declarerLevelsUp:2},G4,[-1,-1]);
    ok('必打:庄家守住不卡自己(这一局就是在打这一级)', a.levels[0]===4&&a.gateHeld===null);
    ok('必打:坐庄守住这一局记进 played', a.played[0]===2);
    // v0.7.1:坐庄输了不算打过这一关 —— 报障就出在这(关卡10上丢庄,再上台却过了10)
    a=E.advanceMatch([10,10],0,win150,G4,[-1,-1]);
    ok('必打:坐庄丢庄不记进 played', a.played[0]===-1);
    // 队0 在关卡10坐庄丢庄 → 队1 上台也停在10(它自己也没打过10)
    ok('必打:对手同样卡在这一关', a.levels[1]===10&&a.gateHeld===10);
    // 关键报障复现:队0 卡在10,后来上台 —— 若按旧口径(坐过庄就算)会直接过 11
    ok('必打:丢过庄的那一方,上台仍要补打这一关',
       E.advanceMatch([10,10],1,win150,G4,[-1,-1]).levels[0]===10);
    // 不传 played = 只做第一层,老行为不变
    a=E.advanceMatch([2,2],1,win150,G4);
    ok('必打:不传 played 时退回只挡跳级', a.levels[0]===3&&a.gateHeld===null);
    // 不会卡死:被卡住 → 下一局自己坐庄打这一关 → 再上台就能过
    let lv=[2,2], pl=[-1,-1], st=E.advanceMatch(lv,1,win150,G4,pl);

    ok('必打:补打一局后即可过关', st.levels[0]===3&&st.gateHeld===null);
  }

  // ---- 速通模式:级数只走 2/5/10/K/A,每局最多一档 ----

  // ---- M3 启发式 AI ----
  // 记牌:两张HA都见过后,HK就是本门最大
  {
    const view={seat:0,hand:[C('H',13)],trump:T,
      history:[{seat:1,cards:P('H',14)}],buriedKnown:[]};
    const mem=E.makeMemory(view);
    ok('记牌:HA出尽后HK封顶', E.isBossPlay(E.classify([view.hand[0]],T),mem,T)===true);
    const view2={seat:0,hand:[C('H',13)],trump:T,history:[],buriedKnown:[]};
    ok('记牌:HA未见时HK非最大', E.isBossPlay(E.classify([view2.hand[0]],T),E.makeMemory(view2),T)===false);
    /* 理论最大对子(v4.6):同点数的两张可能分在两家,凑不成对。
     * 开局未见牌多、每家手牌也多,「凑成对」的概率还有 0.26,不该当钢板;
     * 打到只剩几张时同一个局面就该当钢板了。 */
    {
      const filler=n=>{const f=[];for(let i=0;i<n;i++)f.push(C('C',3+(i%9)));return f;};
      const opener={seat:0,hand:[...P('H',13),...filler(23)],trump:T,history:[],buriedKnown:[]};
      const mOpen=E.makeMemory(opener);
      ok('对子:开局 HA 两张全未见 → HK 对不算钢板',
         E.isBossPlay(E.classify([C('H',13),C('H',13)],T),mOpen,T)===false);
      ok('对子:此时「在外有更大对」的概率显著大于阈值',
         E.pPairAbove(mOpen,'H',E.ordIdx(C('H',13),T),T)>0.2);
      // 只剩 3 张手牌:未见牌少,两张 HA 落在同一家的概率掉下来
      const late={seat:0,hand:[...P('H',13),C('C',3)],trump:T,history:[],buriedKnown:[]};
      // 把绝大多数牌都记成已见,只留 HA 两张 + 少量
      const mLate=E.makeMemory(late);
      for(const k in mLate.unseen){
        const c=E.keyToCard(k);
        if(!(c.suit==='H'&&c.rank===14)) mLate.unseen[k]=0;
      }
      ok('对子:收官只剩两张 HA 未见 → 概率降到阈值下,HK 对当钢板',
         E.isBossPlay(E.classify([C('H',13),C('H',13)],T),mLate,T)===true);
      ok('对子:严格意义上仍有更大的对(判据确实走的是概率这条路)',
         E.unseenPairAbove(mLate,'H',E.ordIdx(C('H',13),T),T)===true);
      // 阈值置 0 = 退回旧的布尔判据
      const save=E.AIP.pairBossMaxP; E.AIP.pairBossMaxP=0;
      ok('对子:阈值置 0 时退回旧判据',
         E.isBossPlay(E.classify([C('H',13),C('H',13)],T),mLate,T)===false);
      E.AIP.pairBossMaxP=save;
    }

  {

    ok('他主牌多时,主K 也盖不住 → 不生成(该考虑的是别毙)',

  {
    const mkX=(hand,pts,phase,buried)=>{
      const v={seat:0,trump:T,history:[],buriedKnown:buried||[],hand};
      return {trump:T,mem:E.makeMemory(v),ptsTable:pts,pw:1,phase,hand,
              buriedKnown:buried||[],isDecl:true,oppVoidP:()=>0.3};

      ok('亮主:队友坐庄不高于对手坐庄', mate.score<=opp.score);
      ok('亮主:无庄盘门槛低于有庄盘',
         E.declThreshold({vis:weak,dealerKnown:false})<E.declThreshold({vis:weak,dealerKnown:true}));
      // 造反动力:对手已亮 > 无人亮 > 队友已亮
      const base={vis:strong,dealerKnown:true,dealer:1,seat:0,trumpRank:2,
                  gates:[],levels:[2,2],firstTaker:0};
      const o2={suit:'S',strength:2};
      const vsOpp=E.scoreDeclOption({...base,curDecl:{seat:1,suit:'H',strength:1}},o2).score;
      const vsNone=E.scoreDeclOption({...base,curDecl:null},o2).score;
      const vsMate=E.scoreDeclOption({...base,curDecl:{seat:2,suit:'H',strength:1}},o2).score;
      ok('造反动力:对手已亮 > 无人亮 > 队友已亮', vsOpp>vsNone && vsNone>vsMate);
      // 必打关卡:对手卡关时更愿意亮/反
      const gated=E.scoreDeclOption({...base,curDecl:null,gates:[2,5,10,13],levels:[2,2]},o2).score;
      ok('必打关卡提高扰乱意愿', gated>vsNone)
    }
    // 3b. 从出牌方式反推缺门:硬演绎,不是概率
    {
      const base=[C('S',9),C('S',8),C('D',3),C('D',5),C('C',6),C('C',7),C('C',9),C('D',8)];
      // 东(座1)领 HA、西(座3,东的队友)跟了张不带分的 HQ ——
      // 队友暂大却没贴分 ⇒ 他本门既没有分牌,也没有比 Q 更小的废牌
      const hist=[{seat:1,cards:[C('H',14)]},{seat:2,cards:[C('H',3)]},
                  {seat:3,cards:[C('H',12)]},{seat:0,cards:[C('H',4)]}];
      const view={seat:2,declSeat:0,hand:[C('H',13),C('H',13),C('H',10),C('H',10),...base],
                  trump:T,history:hist,buriedKnown:[]};
      const mem=E.makeMemory(view);
      const withRead=E.maxHoldIn(E.makeReads(hist,T),mem,3,'H',T);
      const noRead=E.maxHoldIn(E.makeReads([],T),mem,3,'H',T);
      ok('出牌方式反推:持有上界大幅收紧', withRead<=3 && noRead>10);
      const pv=E.makeVoidProb(E.makeReads(hist,T),mem,T,view.hand.length);
      const pv0=E.makeVoidProb(E.makeReads([],T),mem,T,view.hand.length);
      // voidReadTrust(v0.7.21,calib-infer 校准)把行为读牌从「推到 0 张 = 100% 断门」软化了 ——
      // 这条问的是「显著抬升」,按相对无读牌时的抬升量看
      ok('出牌方式反推:断门概率显著抬升', pv(3,'H')>0.6||(E.AIP.voidReadTrust<1&&pv(3,'H')-pv0(3,'H')>0.3));
      // 队友暂大时用贴分序、否则用最便宜序 —— 两条序不能混用
      ok('贴分序:分牌排在废牌之前', E.dumpKey(C('H',10),T)<E.dumpKey(C('H',3),T));
      ok('最便宜序:分牌排在废牌之后', E.cheapKey(C('H',10),T)>E.cheapKey(C('H',3),T));
      // 领出多张时不采信(义务约束下他出什么未必是他想出什么)
      const pairHist=[{seat:1,cards:[C('H',14),C('H',14)]},{seat:2,cards:[C('H',3),C('H',3)]},
                      {seat:3,cards:[C('H',12),C('H',11)]},{seat:0,cards:[C('H',4),C('H',5)]}];
      const r2=E.makeReads(pairHist,T);
      ok('领出多张时不做此推断', !r2.fCheap[3]['H'] && !r2.fDump[3]['H']);
    }
    // 8b. 亮单 vs 亮对:信心足该锁死,信心不足才试探留后手
    {
      const mk=o=>({vis:[],seat:0,trumpRank:2,curDecl:null,dealerKnown:true,dealer:1,
                    firstTaker:0,gates:[],levels:[2,2],...o});
      const conf=[C('S',2),C('S',2),C('S',7),C('S',9),C('S',11),C('S',13),C('S',14),C('X',16),C('H',3),C('D',4)];
      const soft=[C('S',2),C('S',2),C('S',7),C('S',9),C('H',11),C('H',13),C('C',14),C('D',5),C('H',3),C('D',4)];
      const both=E.declOptions(conf,2).filter(o=>o.suit==='S');
      ok('有对时同时提供亮单与亮对', both.length===2&&both.some(o=>o.strength===1)&&both.some(o=>o.strength===2));
      const pick=v=>{const c=mk({vis:v});
        return E.scoreDeclOption(c,{suit:'S',strength:2}).score
             > E.scoreDeclOption(c,{suit:'S',strength:1,hasPair:true}).score ? '对':'单';};
      ok('信心足选亮对', pick(conf)==='对');
      ok('信心不足选亮单试探', pick(soft)==='单');
    }
    // 8c. 无将 + 级数是分牌:不减半,闲家还要再加;无庄盘无将仍拿抢摊红利
    {
      const mk=o=>({vis:[C('X',16),C('X',16),C('S',10),C('H',10),C('D',14),C('C',14),
                         C('H',13),C('S',13),C('D',9),C('C',8)],
                    seat:0,curDecl:null,firstTaker:0,gates:[],levels:[2,2],...o});
      const NTo={suit:null,strength:4};
      const ptDef=E.scoreDeclOption(mk({trumpRank:10,dealerKnown:true,dealer:1}),NTo).score;
      const ptDecl=E.scoreDeclOption(mk({trumpRank:10,dealerKnown:true,dealer:0}),NTo).score;
      const plain=E.scoreDeclOption(mk({trumpRank:7,dealerKnown:true,dealer:1}),NTo).score;
      ok('无将:级数是分牌时加成显著', ptDef-plain>25);
      ok('无将:闲家的加成高于庄家方', ptDef>ptDecl);
      const noDealer=E.scoreDeclOption(mk({trumpRank:7,dealerKnown:false,dealer:-1}),NTo).score;
      ok('无将:无庄盘仍拿抢摊红利', noDealer>plain+40);
      // 有主的抢摊红利要高于无将
      const sOpt={suit:'S',strength:1};
      const gS=E.scoreDeclOption(mk({trumpRank:7,dealerKnown:false,dealer:-1}),sOpt).score
              -E.scoreDeclOption(mk({trumpRank:7,dealerKnown:true,dealer:1}),sOpt).score;
      const gN=noDealer-plain;
      ok('抢摊红利:有主高于无将', gS>gN);
    }
    // 9. globalIdx:主牌恒高于任何副牌
    ok('globalIdx 主牌恒高于副牌', E.globalIdx(C('S',3),T)>E.globalIdx(C('H',14),T));
    // 10. easeEnds:中间平缓、两头陡峭
    {
      const g=E.easeEnds, mid=g(0.55)-g(0.45), end=g(0.10)-g(0.0);
      ok('easeEnds 两头比中间陡', end>mid && Math.abs(g(0.5)-0.5)<1e-9 && g(0)===0);
    }
  }

  // 启发式优于随机:同样的局,聪明防守方比随机防守方抓分更多(均值)
  {
    let smartSum=0,randSum=0,n=0;
    for(let s=1;s<=120;s++){
      const r1=E.simulateRound(s,[0,2]);       // 南北聪明
      const r0=E.simulateRound(s,[]);          // 全随机
      if(r1&&r0&&r1.declSeat%2===1&&r0.declSeat%2===1){ smartSum+=r1.defPoints; randSum+=r0.defPoints; n++; }
    }
    ok(`启发式防守优于随机(${(smartSum/n).toFixed(0)} vs ${(randSum/n).toFixed(0)} 分,${n}局)`,
       n>10 && smartSum>randSum);
  }

  let simOK=true, played=0, nt=0;
  for(let s=1;s<=40;s++){
    try{
      const r=E.simulateRound(s);
      if(r){ played++; if(r.noTrump)nt++;
        /* 这里要保证的是「这一局真的打完了」,而不是「打了至少 13 墩」。
         * 旧判据 tricks<13 悄悄假设了领出多半是单张 —— v0.7.9 的子集甩牌
         * 让一次领出可以带走四张,合法局面下墩数掉到 12 就会误报。
         * 换成真正的不变量:四家 25 张必须全部出完(2×54 − 8 张底牌)。 */
        if(r.total<0||r.cardsPlayed!==100) simOK=false; }
    }catch(e){ simOK=false; }
  }
  ok('40局全AI模拟无崩溃(含'+nt+'局无主)', simOK&&played>30);

  return {pass,fail,out};
}
if(typeof module!=='undefined'){ module.exports.runTests=runTests; }
</script>

/* ---- 术语表(全国版 / 沪语版 / English)----
 *
 * v0.7.10:沪语那份原来单独挂在 `terms-shanghai.js` 里 —— 产品本体号称单文件,
 * 却拖着一个外部依赖,双击 index.html 时少放一个文件就静默退回全国版。现在并回来了。
 *
 * 三档共用一张表:缺的词逐级回退到全国版,再回退到键名本身。
 * 只译**术语**(牌张、牌型、动作、座位、花色),界面文案仍是中文 ——
 * 英语档的用途是让不懂中文术语的人看懂「这一手在干什么」,不是做完整本地化。

const TERMS={
  cn:{bigJoker:'大王',smallJoker:'小王',trump:'主牌',noTrump:'无主',tractor:'拖拉机',
    throwP:'甩牌',ruff:'毙牌',discard:'垫牌',declare:'亮主',counter:'反主',reinforce:'加固',
    declareV:'亮',counterV:'反',   // 按钮上用的短动词,免得"亮主无主(大)"这种叠字
    bury:'扣底',lead:'领出',zheng:'正常主',fu:'副常主',voidSuit:'断门',openVoid:'开局断门',
    rankA:'A',rankK:'K',rankQ:'Q',rankJ:'J',levelUp:'升级',
    defenders:'闲家',declarers:'庄家方',tiaoji:'跳级',guangtou:'剃光头',
    fishTrump:'钓主',   // 领出主牌:消耗对手的主,或把牌权让给队友。维基写作「吊主」,同音,本项目统一用「钓」
    suitS:'黑桃♠',suitH:'红桃♥',suitD:'方块♦',suitC:'梅花♣',
    seat0:'南(你)',seat1:'东',seat2:'北(队友)',seat3:'西'},
  sh:{bigJoker:'大怪',smallJoker:'小怪',
    trump:'将牌',        // 也可作「王」
    noTrump:'无将',tractor:'飞机大炮',throwP:'撒牌',ruff:'敲脱',discard:'氽废',
    declare:'翻',        // 亮主;也可作「摊」
    counter:'造反',      // 反主
    declareV:'翻',       // 按钮上的短动词,如「翻无将(大)」
    counterV:'反',
    reinforce:'加固',
    bury:'灭底',         // 埋底
    lead:'先出',
    zheng:'主将',        // 级数牌直接跟在后面,如「主2」
    fu:'副将',
    voidSuit:'搿一门么了',   // 断门(无固定术语)
    openVoid:'天绝',
    rankA:'Ace',rankK:'老K',rankQ:'皮蛋',
    rankJ:'J钩',         // 念 djia
    levelUp:'打上去',
    fishTrump:'钓王'},
    // 闲家/跳级/剃光头/花色/座位:沪语与全国版同,回退即可
  en:{bigJoker:'Big Joker',smallJoker:'Small Joker',trump:'trump',noTrump:'no-trump',
    tractor:'tractor',throwP:'throw',ruff:'ruff',discard:'discard',
    declare:'declare',counter:'counter',reinforce:'reinforce',
    declareV:'Declare',counterV:'Counter',
    bury:'bury',lead:'lead',
    zheng:'primary trump',   // 主门的级数牌
    fu:'off-suit trump',     // 其余三门的级数牌
    voidSuit:'void',openVoid:'void from the deal',
    rankA:'A',rankK:'K',rankQ:'Q',rankJ:'J',levelUp:'level up',
    /* 维基 / Pagat 的英文口径:庄家一方叫 declarers(维基也叫 defenders),闲家叫 opponents(也叫 attackers)。
     * 这里曾把闲家译成 defenders —— 恰好和维基反过来。 */
    defenders:'opponents',declarers:'declarers',tiaoji:'skip a level',guangtou:'shutout',
    fishTrump:'draw trumps',
    suitS:'Spades♠',suitH:'Hearts♥',suitD:'Diamonds♦',suitC:'Clubs♣',
    seat0:'South (you)',seat1:'East',seat2:'North (partner)',seat3:'West'}
};
/* localStorage 的前缀按**文件名**走,不写死一个常量:
 *   index.html(以及 / 这个目录首页) → 历史键名
 *   80fen-test.html                  → 80fen-t-
 *   80fen-contest-<选手>-v1.html     → 80fen-c-<选手>-
 * 正式版留用历史键名是有意的 —— 换掉等于把所有在玩的人的设置和笔记凭空抹掉。
 * 而**跟着文件名推、不写成常量**也是有意的:晋级是整份复制 + 改两处身份标记,
 * 前缀要是第三处得手改的东西,迟早有一次会忘 —— 忘了就是把线上玩家切到
 * 测试版的存储上。观察页也吃这条规则,所以生成器不用再替换一遍键名。 */
const LSP=(()=>{
  const f=(String(location.pathname).match(/[^/]*$/)||[''])[0];
  const c=f.match(/^80fen-contest-(.+)-v\d+\.html$/);
  if(c) return '80fen-c-'+c[1]+'-';
  return f==='80fen-test.html' ? '80fen-t-' : f==='80fen-play-ui-test.html' ? '80fen-put-' : '80fentest-';
})();
let lang='sh';
try{ const v=localStorage.getItem(LSP+'lang');
     if(v&&TERMS[v]) lang=v; else if(v==='cn') lang='cn'; }catch(e){}
const T=k=>(TERMS[lang]&&TERMS[lang][k])||TERMS.cn[k]||k;

const SUIT_SYM={S:'♠',H:'♥',D:'♦',C:'♣'};
// 花色与座位跟着语言走:英语档下「南(你)」读不通,而它们和牌型一样是术语。
const SUIT_NAME={get S(){return T('suitS');},get H(){return T('suitH');},
                 get D(){return T('suitD');},get C(){return T('suitC');}};
const SEAT_NAME={get 0(){return T('seat0');},get 1(){return T('seat1');},
                 get 2(){return T('seat2');},get 3(){return T('seat3');},get length(){return 4;}};
const HUMAN=0;
/* 座位简称:中文取首字("北/西/东/南"),拉丁字母的座位名(英语档)取首字母后补一个空格,
 * 否则 "E"+"declare" 会连成 "Edeclare"。原来写在 render() 里,出牌记录也要用,提到顶层。 */
const seatAbbr=i=>{const nm=SEAT_NAME[i];return /^[A-Za-z]/.test(nm)?nm.slice(0,1)+' ':nm.slice(0,1);};
const typeName=t=>({single:'单张',pair:'对子',tractor:T('tractor'),throw:T('throwP')}[t]);
const rankName=r=>r===14?T('rankA'):r===13?T('rankK'):r===12?T('rankQ'):r===11?T('rankJ'):String(r);
// logMode:对局记录页签里的三种看法 —— 事件流 / 每墩出牌 / 按花色归堆。
// 原来「对局记录」和「出牌历史」是两个页签,内容有一半是重的(都在列每墩谁出了什么),
// 合成一个页签、三个视图,右栏少一个按钮,也不用来回切着找同一件事。
let G=null, seedBase=Date.now()%100000, activeTab='score', logMode='event';
// 每墩视图的两个看法开关:logAsc = 第 1 墩在上(复盘从头看),logFocus = 只放大第 N 墩(0 = 列全部)
let logAsc=false, logFocus=0;
let notes=[]; try{ notes=JSON.parse(localStorage.getItem(LSP+'notes')||'[]'); }catch(e){}
// 旧版笔记存的是纯字符串,没有局数;读进来补成 {r,t},历史笔记 r=null 就不显示局号
notes=notes.map(n=>typeof n==='string'?{r:null,t:n}:n).filter(n=>n&&n.t);

/* 右栏宽度:复盘时四家的牌挤在 mini 尺寸里看不清,允许拉宽两档。
 * 存倍率而不是绝对宽度 —— 横屏窄栏那套 @media 基准要保留,只是整体乘一下。 */
const SIDE_STEPS=[1,1.35,1.75], SIDE_NAMES=['标准','加宽','特宽'];
let sideStep=0; try{ sideStep=+(localStorage.getItem(LSP+'sidew')||0); }catch(e){}
if(!(sideStep>=0&&sideStep<SIDE_STEPS.length)) sideStep=0;
function applySideW(){ document.documentElement.style.setProperty('--sideScale',SIDE_STEPS[sideStep]); }
applySideW();

// ---- 音效(WebAudio 合成,无外部资源,可关) ----
let sndOn=true; try{ sndOn=localStorage.getItem(LSP+'snd')!=='off'; }catch(e){}
let _actx=null;
function beep(freq,dur=0.08,type='sine',gain=0.06,delay=0){
  if(!sndOn) return;
  try{
    _actx=_actx||new (window.AudioContext||window.webkitAudioContext)();
    const o=_actx.createOscillator(), g=_actx.createGain();
    o.type=type; o.frequency.value=freq;
    g.gain.setValueAtTime(gain,_actx.currentTime+delay);
    g.gain.exponentialRampToValueAtTime(0.001,_actx.currentTime+delay+dur);
    o.connect(g); g.connect(_actx.destination);
    o.start(_actx.currentTime+delay); o.stop(_actx.currentTime+delay+dur+0.02);
  }catch(e){}
}
const sndPlay=()=>beep(520,0.05,'triangle',0.05);
const sndWin =()=>{beep(660,0.09,'sine',0.06);beep(880,0.12,'sine',0.06,0.09);};
const sndLose=()=>beep(220,0.15,'sine',0.05);
const sndEnd =()=>{[523,659,784].forEach((f,i)=>beep(f,0.22,'sine',0.05,i*0.12));};
const sndOops=()=>beep(180,0.18,'square',0.04);

// ---- 对局设置(规则 + 节奏),见设置菜单 ----
// 引擎里的 RULES 是运行时真值;这里先快照出厂默认,玩家改动存进 S.rules 再套回 RULES。
// 只放真正被引用、且改了不会和发牌逻辑冲突的项:
// offsuitRankTractor/handSize 代码里没引用,kittySize/levelStart 改了会和 dealRound 的固定 8 张底牌冲突。
const RULE_DEFAULTS={
  pointRebelThreshold:RULES.pointRebelThreshold,
  trumpRebelThreshold:RULES.trumpRebelThreshold,
  maxRedeal:RULES.maxRedeal,
  strictTractorFollow:RULES.strictTractorFollow,
  partialTractorFollow:RULES.partialTractorFollow,
};
const S_DEFAULT={
  fullRebel:'off',   // 低分/少主:off=关闭 | redeal=仅重新发牌(不抢庄) | scramble=完全造反(双方抢庄)
  speedRun:false,    // 速通:级数只走 2/5/10/K/A,每局最多升一档(见 RULES.speedRun)
  gatesOn:true,      // 必打关卡:跳级途中撞上就停在关卡上
  gates:[2,5,10,13], // 关卡级数(13=K)

  aiThinkMin:1.0,    // AI 出牌思考秒数(下限)
  aiThinkMax:3.0,    // AI 出牌思考秒数(上限)
  trickHold:3.0,     // 一墩出完后牌留桌秒数
  manualNext:false,  // true = 手动点击进入下一墩
  declWait:10.0,     // 发完牌后留给你亮主/反主的时间(秒),可点「不亮」提前结束
  autoLast:true,     // 这一手没得选(剩的牌恰好等于本墩要出的张数)时自动出,不用再点一下
  allowUndo:false,   // 悔牌:回到你上一手出牌前的整桌快照,独立于教练严格模式(见 undoLastPlay)
  engineVer:['','','',''],   // 各座位的 AI 引擎版本,'' = 内置最新版(见 eng();座位 0 = 你托管时)
};
/* 托管与「没得选」时的节奏:托管是**快进一段**,不是看 AI 慢慢想,
 * 所以思考/留桌时间都压到这两个常数以内;没得选的那一手给一个短停顿,
 * 让人看清出的是什么再收墩(直接出会像卡了一下)。 */
const AUTO_STEP_MS=350, AUTO_HOLD_MS=700, FORCED_MS=450;
let S={...S_DEFAULT, gates:[...S_DEFAULT.gates], rules:{...RULE_DEFAULTS}};
try{
  const saved=JSON.parse(localStorage.getItem(LSP+'set')||'{}');
  Object.assign(S,saved);

/* ---- 各座位的 AI 引擎版本(测试版专属)----
 * 历史版本的整块引擎 + AI 由 engines/build.js 从 git 历史里原样抽成 engines/<版本>.js,
 * 选到哪版才按需加载(正式版 index.html 没有这一套,也不加载任何历史引擎)。
 * 只换「做决定」的那几个入口:抢亮/加固打分、扣底、领出、跟牌。规则判定(合法性、
 * 甩牌检查、胜负结算)永远是当前版 —— 旧 AI 出了现行规则不认的牌,出牌处已有兜底。
 * 教练(问教练、失误反馈)也固定用当前版:它是标尺,不跟着座位换。
 * 选了还没加载完(或加载失败)的座位,这期间按最新版出,见 eng()。 */
/* 正式版不要这一套(产品方,v0.7.30:「正式版不需要」)。跟 LSP 一样按**文件名**认身份,不写成常量 ——
 * 晋级是整份复制 + 改两处标记,这里要是第三处得手改的东西,迟早有一次会忘。
 * 正式版是 index.html(Pages 上根路径时文件名为空);其余(测试版、开发版、contest)照旧可选。 */
const ENGINE_PICKER=(()=>{ const f=(String(typeof location!=='undefined'?location.pathname:'').match(/[^/]*$/)||[''])[0];
  return !(f===''||f==='index.html'); })();
const ENGINE_VERSIONS=ENGINE_PICKER?['v0.7.0','v0.5.7']:[];   // 内置最新版不在表里,用 '' 表示;正式版为空 → 各座位都回落到最新版
// 老存档没有这一格、或存的版本已从 ENGINE_VERSIONS 里撤掉 → 回落到最新版
S.engineVer=[0,1,2,3].map(i=>{ const v=(S.engineVer||[])[i]; return ENGINE_VERSIONS.includes(v)?v:''; });
const CUR_ENGINE={aiChooseLead,aiChooseFollow,aiDeclDecide,scoreDeclOption,aiDiscard};
const engLoading={};
function engReady(v){ return !!(v&&window.__ENGINES&&window.__ENGINES[v]); }
function loadEngine(v){
  if(!v||engReady(v)) return Promise.resolve(true);
  if(!engLoading[v]) engLoading[v]=new Promise(res=>{
    const sc=document.createElement('script');
    sc.src=`engines/${v}.js`;
    sc.onload=()=>res(engReady(v));
    sc.onerror=()=>{ delete engLoading[v]; sc.remove(); res(false); };   // 失败了下次还能重试
    document.head.appendChild(sc);
  });
  return engLoading[v];
}
function eng(seat){ const v=S.engineVer[seat]; return engReady(v)?window.__ENGINES[v]:CUR_ENGINE; }
// 实际生效的版本名('' = 最新版);选了但没加载上的也算最新版,座位名上就不挂版本号
function engName(seat){ const v=S.engineVer[seat]; return engReady(v)?v:''; }
function loadSelectedEngines(){
  for(const v of new Set(S.engineVer.filter(Boolean)))
    loadEngine(v).then(ok=>{
      if(!ok) showToast(`AI 引擎 ${v} 加载失败,对应座位先按最新版出牌`);
      if(G) render();
    });
}
loadSelectedEngines();

function aiThinkMs(){
  const lo=Math.max(0,+S.aiThinkMin||0), hi=Math.max(lo,+S.aiThinkMax||0);
  const ms=1000*(lo+Math.random()*(hi-lo));
  return (G&&G.auto)?Math.min(ms,AUTO_STEP_MS):ms;   // 托管中四家一起快进
}

  if(ENGINE_PICKER) for(const s of [0,1,2,3]) $('stEng'+s).onchange=e=>{
    const v=e.target.value;
    S.engineVer=S.engineVer.map((x,i)=>i===s?v:x);   // 换新数组:S_DEFAULT 的那份不能被改到
    saveS(); fill(); if(G) render();
    loadEngine(v).then(ok=>{
      if(!ok) showToast(`AI 引擎 ${v} 加载失败,${SEAT_NAME[s]}先按最新版出牌`);
      else if(v&&G&&!G.ended) log(`AI 引擎:${SEAT_NAME[s]} 换成 ${v}`);
      if(document.getElementById('stEngHint')) fill();
      if(G) render();
    });
  };
  $('stUndoBtn').onclick=()=>{ if(undoLastPlay()) closeSettings(); else fill(); };
  $('stReset').onclick=()=>{ S={...S_DEFAULT, gates:[...S_DEFAULT.gates], rules:{...RULE_DEFAULTS},
      engineVer:[...S_DEFAULT.engineVer]};
    if(G&&G.auto) window.__setAuto(false);      // 「恢复默认」也把托管交还
    saveS(); applyRules(); fill(); if(G) render(); };
  // 取消:每项改动本来就是即改即存,这里把开菜单那一刻的快照整个套回去(含持久化),
  // 而不是只清内存——不然关掉重开又会看到"取消"前改过的值。
  $('stCancel').onclick=()=>{
    S=snapshot.S; C=snapshot.C; lang=snapshot.lang; sndOn=snapshot.sndOn;
    saveS(); saveC(); applyRules();
    if(G&&G.auto!==snapshot.auto) window.__setAuto(snapshot.auto);
    try{
      localStorage.setItem(LSP+'lang',lang);
      localStorage.setItem(LSP+'snd',sndOn?'on':'off');
    }catch(_){ }
    if(G) render();
    closeSettings();
  };
  $('stClose').onclick=closeSettings;
  // 重开整场:级数/庄家全部归零,不是"下一局"那种保留级数的推进,破坏性操作要确认
  $('stNewMatch').onclick=()=>{
    if(!confirm('重开整场会把双方级数和庄家全部归零(从打2重新开始),当前进度无法找回。确定吗?')) return;
    closeSettings();
    window.__newMatch();
  };
  document.getElementById('setOverlay').style.display='flex';
}
function closeSettings(){ document.getElementById('setOverlay').style.display='none'; }

window.__closeSet=closeSettings;
// 复用设置浮层做通用弹窗(看底牌、看初始手牌)

    `<div class="trickRow">${sortForDisplay(G.buried,curTrumpForSort()).map(c=>cardHTML(c,'mini')).join('')}</div>`);
