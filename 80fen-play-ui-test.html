/* ===== theme.css ===== */
/* Shared visual language, based on the main repository's teaching UI. */
:root{
  --ol:#55731c;--ol-rim:#3d5412;--ol-bg:#e7f0d2;--ol-tx:#3a5011;--ol-dk:#2a3b0c;
  --rd:#b03e27;--rd-rim:#8a2c16;--rd-bg:#f9e3dc;--rd-tx:#8a2c16;
  --bl:#3b6e92;--bl-rim:#2c5876;--bl-bg:#e0edf5;--bl-tx:#2a5271;
  --pu:#7e5c99;--pu-bg:#f0eaf5;--gd:#edcf83;--gd-tx:#57431b;
  --tx:#33362e;--tx2:#71766a;--line:#d8dccf;--dis:#e5e7de;--dis-tx:#909586;
  --page:#fffcf6;--felt:#f0f2e9;--card-line:#aeb3a5;
  --ui-font:"PingFang SC","Noto Sans SC","Microsoft YaHei",-apple-system,BlinkMacSystemFont,sans-serif;
  --card-font:"PingFang SC","Noto Sans SC",Arial,sans-serif;
  --ink:var(--tx);--muted:var(--tx2);--red:var(--rd);--gold:var(--ol);
  font-family:var(--ui-font);color:var(--tx);background:var(--page)
}
body{background:var(--page);color:var(--tx)}button,input,a{font-family:inherit}button:focus-visible,a:focus-visible,input:focus-visible{outline-color:var(--bl)}
/* Plain white cards. Information stays at the edges; the centre stays blank. */
.playing-card{background:#fff;border:1.5px solid var(--card-line);color:var(--tx);box-shadow:0 2px 0 #33362e14;border-radius:8px;font-family:var(--card-font)}
.playing-card :is(.index,.bottom-index){font-family:var(--card-font)!important;font-weight:800;font-variant-numeric:lining-nums tabular-nums}
.playing-card .index{letter-spacing:-1.5px}.playing-card .index i{font-family:Arial,sans-serif;letter-spacing:0}.playing-card.joker .index{font-family:var(--ui-font)!important}.playing-card .bottom-index{opacity:.7}
.playing-card.suit-S{color:#262c2c}.playing-card.suit-H,.playing-card.red{color:#b33a2b}.playing-card.suit-D{color:#a8286a}.playing-card.suit-C{color:#245843}
.playing-card .point-mark{background:var(--gd);color:var(--gd-tx);border-radius:4px;font-family:var(--ui-font);font-weight:800}
#game{background:var(--page);color:var(--tx);box-shadow:none;font-family:var(--ui-font)}
#game .status-bar{background:var(--page);border-bottom:2px solid var(--line)}
#game .status-main{gap:10px}#game .brand{font-family:var(--card-font);color:var(--ol);font-weight:800;letter-spacing:-1px}#game .brand>span{font-family:var(--ui-font)}
#game .trump-status{color:var(--tx)}#game .trump-status i{color:var(--rd)}#game .trump-status i.suit-S{color:#262c2c}#game .trump-status i.suit-D{color:#a8286a}#game .trump-status i.suit-C{color:#245843}#game .trump-status em{color:var(--tx2)}
#game .menu-button{color:var(--tx2);font-size:21px}#game .score-line{color:var(--tx2)}#game .score-line b{color:var(--ol)}#game .score-track{background:var(--line);height:7px}#game .score-track i{background:var(--ol)}
.learn-link{display:inline-flex;align-items:center;justify-content:center;min-width:44px;min-height:40px;padding:0 7px;border:1.5px solid var(--line);border-radius:11px;color:var(--ol-tx);font-size:14px;font-weight:750;text-decoration:none;background:#fff;flex-shrink:0}
#game.wide .learn-link{order:1}#game.wide .status-bar{gap:22px}#game.wide.compact .status-bar{gap:12px}
#game .felt{background:var(--felt);border:2px solid var(--line);box-shadow:none;transform:none;border-radius:36px;inset:28px 5px -8px}#game.wide .felt{inset:20px 0 -8px;border-radius:48px}#game.wide.compact .felt{inset:8px 0 -5px;border-radius:26px}
#game .felt:after{display:none}#game .table-mark{display:none}
#game .player-label{color:var(--tx);text-shadow:none;font-weight:750}#game .player-label small{color:var(--tx2);font-weight:500}#game .player-label .seat-dot{background:#b0b7a5;box-shadow:none}#game .player.winner .seat-dot{background:var(--ol);box-shadow:none}
#game .played-hand,#game .winner .played-hand{filter:none}#game .winner .playing-card{border-color:var(--ol);box-shadow:0 0 0 1px var(--ol)}#game .winner-label{color:var(--ol-tx);background:var(--ol-bg);border:1px solid #b8cc95;border-radius:7px;font-weight:750}
#game .empty-opponent{background:#e4e9da;border:2px solid #c8d2ba;border-radius:7px;box-shadow:2px 2px 0 #d1d9c7;transform:rotate(4deg)}
#game .table-points{color:var(--tx2)}#game .table-points strong{color:var(--ol);font-family:var(--card-font);font-weight:800;text-shadow:none}#game .declaration-pile>p{color:var(--ol-tx);font-weight:650}
#game .drop-cue{border-color:var(--bl);background:#e0edf555;border-radius:30px}#game .drop-cue span{background:#fff;border:2px solid var(--bl);color:var(--bl-tx);box-shadow:0 3px 0 #3b6e9222;border-radius:12px;font-weight:750}
#game .arena.drag-over .drop-cue{background:#e0edf5aa}#game .arena.drag-invalid .drop-cue{background:#f9e3dc66;border-color:var(--rd)}#game .arena.drag-invalid .drop-cue span{color:var(--rd-tx);border-color:var(--rd)}
#game .turn-copy strong{color:var(--tx);font-weight:750}#game .turn-copy span{color:var(--tx2)}
#game .table-edge>button,#game .bid-actions button,#game .bottom-tools #buryConfirm{background:var(--ol);color:#fff;border:0;border-bottom:3px solid var(--ol-rim);border-radius:12px;box-shadow:none;font-weight:800}
#game .table-edge>button:active:not(:disabled),#game .bid-actions button:active:not(:disabled){translate:0 2px}
#game .table-edge>button:disabled,#game .bid-actions button:disabled,#game .bottom-tools #buryConfirm:disabled{background:var(--dis);color:var(--dis-tx);border-color:#cdd2c3;opacity:1;box-shadow:none}
#game .hand-card{background:#fff;border:1.5px solid var(--card-line);box-shadow:-1px 2px 0 #33362e22;border-radius:8px}
#game .hand-card.selected{background:var(--bl-bg);border:2px solid var(--bl);box-shadow:-1px 2px 0 #2c587644}#game .hand-card.selected:after{content:'✓';color:var(--bl-tx);font-size:13px;top:4px;right:4px;font-family:var(--ui-font)}
#game .hand-card.off-suit{filter:none;background:#f7f7f2}#game .hand-card.selected.off-suit{background:var(--bl-bg)}#game .hand-card.peek{filter:none;border-color:var(--bl)}
#game .hand-wheel,#game #panHint{color:var(--tx2)}#game .hand-wheel.no-overflow #panHint{color:var(--tx2)}
#pan::-webkit-slider-runnable-track{background:#c4cdb8;height:4px}#pan::-webkit-slider-thumb{background:var(--bl-bg);border:2px solid var(--bl);box-shadow:none;border-radius:8px}
#pan::-moz-range-track{background:#c4cdb8;height:4px}#pan::-moz-range-thumb{background:var(--bl-bg);border:2px solid var(--bl);box-shadow:none;border-radius:8px}
#game .bottom-tools{background:var(--page);border-top:2px solid var(--line)}#game .bottom-tools button{background:#fff;color:var(--tx);border:1.5px solid var(--line);border-bottom:3px solid #c5ccb9;border-radius:10px;font-weight:700}#game .bottom-tools button:disabled{opacity:.45}
#game .live-message{background:#fff;color:var(--tx);border:2px solid var(--line);box-shadow:0 3px 0 #33362e14;font-weight:650}
#loupe,#dragGhost{filter:drop-shadow(0 3px 0 #33362e33)}#loupe .playing-card{background:#fff;border:2px solid var(--bl);box-shadow:none}#dragGhost .playing-card{background:#fff;border-color:var(--bl);box-shadow:0 2px 0 #33362e22}#dragGhost .drag-count{background:var(--bl-bg);color:var(--bl-tx);border:1px solid var(--bl);border-radius:8px;font-weight:700}
#sheet{background:var(--page);color:var(--tx);border:2px solid var(--line);box-shadow:none}#sheet::backdrop{background:#33362e55;backdrop-filter:none}#sheet .sheet-header{border-bottom:2px solid var(--line)}#sheet .sheet-copy{color:var(--tx2)}#sheet .menu-option{background:#fff;border:2px solid var(--line);border-radius:12px;font-weight:750;color:var(--tx)}#sheet .menu-option small{color:var(--tx2);font-weight:500}#sheet .sheet-link{color:var(--bl-tx)}
#sheet .layout-label{color:var(--tx2)}#sheet .layout-options button{background:#fff;color:var(--tx);border:2px solid var(--line);font-weight:700}#sheet .layout-options button[aria-pressed=true]{background:var(--bl-bg);border-color:var(--bl);color:var(--bl-tx)}
#sheet .overview-title{color:var(--tx)}#sheet .overview-title span{color:var(--tx2)}#sheet .card-grid .playing-card.selected{outline-color:var(--bl);background:var(--bl-bg)}#sheet .history-entry{border-color:var(--line)}#sheet .history-entry b,#sheet .result-note{color:var(--ol-tx)}
#sheetFooter{background:#fff;border-top:2px solid var(--line)}#sheetFooter .sheet-actions button{background:#fff;color:var(--tx);border:2px solid var(--line);font-weight:700}#sheetFooter .sheet-actions button:last-child{background:var(--ol);border-color:var(--ol-rim);color:#fff;border-bottom-width:3px}#sheetFooter .sheet-actions button:disabled{background:var(--dis);color:var(--dis-tx);border-color:var(--line);opacity:1}
@media(max-width:340px){#game .status-bar{padding-left:12px;padding-right:10px}#game .status-main{gap:6px}#game .trump-status{font-size:15px}#game .trump-status em{font-size:13px;margin-left:6px}}
/* Two digits get the same optical treatment as the teaching cards' .tl.two. */
.playing-card .index.two .rank-value{font-size:.8em;letter-spacing:-1px}

/* ===== leo-theme.css ===== */

#game .status-bar{border:0;padding-top:5px;padding-bottom:9px}#game .status-main{gap:10px;height:46px}#game .brand{font-size:26px}#game .trump-status{font-size:14px;text-align:right}#game .trump-status em{font-size:13px;margin-left:7px}#game .trump-status i{font-size:20px;margin-right:3px}#game .menu-button{width:36px;flex:none;color:var(--leo-brown)}

#game .player.north{top:0}#game .player.west,#game .player.east{top:43%}#game .player-label{gap:5px;margin-bottom:7px;font-size:14px}#game .player-label small{font-size:12px;color:#626a54}#game .seat-dot{display:none}
#game .seat-name{display:flex;flex-direction:column;line-height:1.35}#game .seat-name small{font-weight:500}#game .seat-avatar{width:31px;height:34px;border:1.5px solid #c0c9b4;border-radius:11px;background:#f5f6ef;display:grid;place-items:center;font-size:13px;color:#647159}
#game .leo-seat{width:48px;height:44px;padding:0;position:relative;background:transparent;flex:none;border-radius:12px}#game .leo-seat .leo-avatar{width:46px}#game .leo-seat:after{content:'?';position:absolute;right:0;bottom:0;border:1px solid #b29977;background:#fff7df;color:var(--leo-brown);width:15px;height:15px;line-height:14px;border-radius:50%;font-size:11px;font-weight:800}
#game .player.north .player-label{background:var(--page);padding:0 9px 0 2px;border-radius:18px;margin-bottom:6px}#game .winner-label{border-color:#a6b991;background:#f4f7e8;font-size:12px;color:#3c5836}
#game .table-points{background:#f8f5df;border:1.5px solid #b5bb98;border-radius:50%;width:75px;height:75px;justify-content:center;align-items:baseline;align-content:center;flex-wrap:wrap;gap:0 4px;top:66%;padding:9px}#game .table-points>span:first-child{width:100%;text-align:center;font-size:12px;line-height:15px}#game .table-points strong{font-size:28px;line-height:31px;color:#5d6242}#game .table-points>span:last-child{font-size:12px}
#game .table-edge{padding:7px 18px 0;min-height:57px}#game .turn-copy{gap:3px}#game .turn-copy strong{font-size:17px}#game .turn-copy span{font-size:13px}#game .table-edge>button,#game .bid-actions button,#game .bottom-tools #buryConfirm{background:var(--leo-brown);border-bottom-color:#583920;border-radius:14px}
#game .hand-card{border-color:#b2a18b;border-radius:9px}#game .hand-card.off-suit{background:#f5f1e9}#game .hand-card.selected{border-color:var(--bl);background:var(--bl-bg)}
#game .bottom-tools{border-top:1px solid var(--line);gap:8px}#game .bottom-tools button{border-color:var(--line);border-bottom-color:#c9b99f;color:var(--leo-brown);background:#fffdf8;border-radius:12px;font-weight:750}#game .hand-wheel{font-size:13px}
#game.wide .status-bar{height:66px;padding:0 30px;gap:20px}#game.wide .mode-nav{order:1}#game.wide .trump-status{order:1;font-size:17px;margin-left:10px}#game.wide .score-line{max-width:340px}#game.wide .felt{inset:31px 8px -3px;border-radius:42% 42% 28% 28% / 25% 25% 20% 20%}#game.wide .player.north{top:0}#game.wide .player-label{font-size:16px}#game.wide .leo-seat{width:60px;height:52px}#game.wide .leo-seat .leo-avatar{width:56px}#game.wide .seat-avatar{width:40px;height:40px}#game.wide .table-points{top:60%;width:90px;height:90px}#game.wide .table-points strong{font-size:34px}
#game.wide.compact .status-bar{height:46px;padding:0 16px;gap:12px}#game.wide.compact .brand{font-size:24px}#game.wide.compact .mode-nav a,#game.wide.compact .mode-nav span{padding:5px 9px}#game.wide.compact .leo-seat{height:30px;width:34px}#game.wide.compact .leo-seat .leo-avatar{width:33px}#game.wide.compact .seat-avatar{display:none}#game.wide.compact .seat-name{flex-direction:row;gap:5px;align-items:center}#game.wide.compact .player-label{font-size:13px;margin-bottom:3px}#game.wide.compact .felt{inset:20px 0 0}#game.wide.compact .table-points{height:56px;width:56px;left:50%;top:53%;padding:4px}#game.wide.compact .table-points strong{font-size:23px;line-height:24px}#game.wide.compact .table-points>span:first-child{font-size:10px;line-height:11px}#game.wide.compact .table-edge{min-height:44px}
.coach-note{display:flex;align-items:center;gap:16px;margin-bottom:18px}.coach-note .leo-avatar{width:88px}.coach-note h3{font-size:20px;margin:0 0 5px}.coach-note p{font-size:14px;color:var(--tx2);margin:0}.coach-advice{font-size:17px;line-height:1.8;margin:0 0 18px;padding:18px;background:#fffdf8;border:1.5px solid var(--line);border-radius:16px}.coach-advice b{color:var(--ol-tx)}
@media(max-width:370px){#game .status-main{gap:5px}#game .mode-nav a,#game .mode-nav span{padding:7px}#game .trump-status em{display:block;font-size:12px;line-height:12px;margin:0}#game .brand{font-size:23px}#game .menu-button{width:30px}}
@media(max-height:700px) and (orientation:portrait){#game .status-main{height:43px}#game .leo-seat{width:36px;height:34px}#game .leo-seat .leo-avatar{width:35px}#game .player-label{margin-bottom:4px}#game .table-points{width:58px;height:58px;padding:5px;top:72%}#game .table-points strong{font-size:24px;line-height:25px}#game .table-edge{min-height:49px}#game .seat-avatar{display:none}}
/* Short landscape: keep trick points beside the north play, never beneath it. */
#game.wide.compact .table-points{left:calc(50% - 125px);top:34%}
/* Small phones need a real table, not a miniature table behind the cards. */
@media(max-height:660px) and (orientation:portrait){
  #game .status-bar{padding-top:0;padding-bottom:4px}#game .status-main{height:40px}#game .score-line{height:21px}
  #game .hand-area{height:188px}#game .table-edge{min-height:46px;padding:3px 12px 0;gap:10px}#game .turn-copy strong{font-size:15px}
  #game .player.north{top:0}#game .player.north .player-label{margin-bottom:3px}#game .player.west,#game .player.east{top:45%}
  #game .felt{inset:28px 3px 0;border-radius:38% 38% 22% 22% / 16% 16% 15% 15%}
  #game .player-label{font-size:13px;line-height:17px}#game .seat-name small{font-size:11px}#game .winner-label{bottom:-11px;line-height:16px;font-size:11px}
  #game .table-points{top:auto;bottom:7px;transform:translateX(-50%);width:auto;height:32px;padding:3px 9px;gap:4px;flex-wrap:nowrap;border-radius:10px}
  #game .table-points>span:first-child{width:auto;font-size:11px;line-height:18px}#game .table-points strong{font-size:22px;line-height:24px}#game .table-points>span:last-child{font-size:11px}
  #game .bottom-tools{height:52px;padding-top:3px;padding-bottom:max(4px,env(safe-area-inset-bottom))}#game .bottom-tools button{min-height:42px}
  #game .arena.finished .table-points{display:none}#game .my-play{bottom:8px}
}

/* ===== table-surface.css ===== */
/* Shared table vocabulary: restrained felt, relative seats, consistent card proportions. */
:root{--table-felt:#e4eddb;--table-rim:#b1c0a2;--selection-light:#f0faff;--table-ink:#45593e}
#game .felt,.learning-table{background:var(--table-felt);border:1.5px solid var(--table-rim);border-radius:36px;box-shadow:none}
#game .felt:after{display:none}
#game .playing-card{container-type:inline-size}
#game .playing-card .index,#game.wide .playing-card .index,#game.wide.compact .playing-card .index{font:650 34cqw/1.08 var(--card-font)!important;letter-spacing:-.04em;left:6%;top:6%;display:flex;flex-direction:column;gap:2px}
#game .playing-card .index.two{font-size:34cqw!important;letter-spacing:-.08em}
#game .playing-card .index i{font-size:30cqw!important;line-height:1.05;font-style:normal}
#game .playing-card.joker .index,#game .playing-card.joker .index i{font-size:27cqw!important;letter-spacing:0;line-height:1.12}
#game .playing-card .bottom-index{display:none}#game .point-mark{font-size:15cqw;line-height:1.1;padding:2px}
#game .table-points,#game.wide .table-points,#game.wide.compact .table-points{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;left:50%;top:60%;bottom:auto;transform:translate(-50%,-50%);width:138px;height:auto;min-height:64px;padding:8px;border:0;border-radius:16px;background:#f8fbf080;text-align:center;color:var(--table-ink)}
#game .table-points #instruction{font:600 15px/1.4 var(--ui-font);color:var(--table-ink)}#game .table-points div{font-size:13px}#game .table-points b{font-size:20px}#game .table-points.no-points>div{display:none}
#game .arena.finished .table-points{display:flex}#game .table-edge{justify-content:center;min-height:40px;padding:0 15px;gap:12px}#game .turn-copy{text-align:center}#game .turn-copy span{font-size:13px}#game .table-edge.bidding .turn-copy{display:none}
#game .coach-tool{display:flex;align-items:center;justify-content:center;gap:3px;min-width:72px}#game .coach-tool .leo-avatar{width:29px;height:29px;flex:none}#game .coach-tool span:last-child{font-size:12px}#game .bottom-tools #kitty:disabled{display:none}

.kitty-empty{display:grid;place-items:center;border:1px dashed #b9ae98;color:#a99b81;font-size:23px;background:#f7f3e9}
#app .eight-kitty .card.sel{background:white;box-shadow:none;border:2px solid #89aebf}
@media(max-height:700px) and (orientation:portrait){#app .kitty-display{padding:10px}.kitty-heading{margin-bottom:8px}.kitty-heading strong{font-size:16px}#app .eight-kitty{grid-template-columns:repeat(4,44px);gap:6px}#app .eight-kitty>.card,#app .kitty-fixed,#app .kitty-empty{--cardW:44px;--cardH:62px;width:44px;height:62px}#app .picked-cards{gap:6px;min-height:66px}#app .recognition-table{gap:12px;padding:10px}#app .attempted-play .card{--cardW:48px;--cardH:70px}#app .attempted-play{bottom:11%}}
@media(min-width:640px) and (max-height:500px) and (orientation:landscape){#app .kitty-display{max-width:none;padding:12px}.kitty-heading{margin-bottom:10px}#app .eight-kitty{grid-template-columns:repeat(8,44px);gap:7px}#app .eight-kitty>.card,#app .kitty-fixed,#app .kitty-empty{--cardW:44px;--cardH:64px;width:44px;height:64px}#app .throw-center,#app[data-type=forcedpick] .throw-center{top:42%}#app .attempted-play{bottom:8%}#app .attempted-play .card{--cardW:44px;--cardH:64px}#app .evidence-cards .card,#app .evidence-back{--cardW:52px;--cardH:74px;width:52px;height:74px;margin-left:-28px}#app .evidence-cards>:first-child{margin-left:0}#app .evidence-hand[data-seat="2"]{top:-38px}#app .evidence-hand[data-seat="2"]>span{top:87px}#app .recognition-table{gap:10px}#app .picked-cards{min-height:64px}}
/* A receipt may cover the winning pile briefly; permanent center instructions may not. */
#game .player .winner-label{bottom:13px;left:50%;transform:translateX(-50%);background:#f0f9e7;white-space:nowrap;border:1px solid #98ae80;border-radius:8px;z-index:5;line-height:22px;padding:0 7px}
#game .arena.finished .winner-label{animation:receipt 3s forwards}
@keyframes receipt{0%,85%{opacity:1}100%{opacity:0}}
#game .is-bidding .winner-label{animation:none}
#game .table-edge.bidding{min-height:56px;padding:4px 12px;justify-content:center}
#game .bid-actions{display:flex;justify-content:center;width:auto}
#game .bid-actions #bidAction{min-width:176px;min-height:48px;height:48px;padding:0 20px}
#game.is-bidding .table-points{display:none!important}
#game.is-bidding .my-play.declared{top:38%;bottom:auto;left:50%;transform:translateX(-50%);padding:5px 10px;background:#f3fae9;display:flex;flex-direction:column;gap:5px;z-index:3}
#game.is-bidding .my-play.declared .played-hand{height:84px}
#game.is-bidding .my-play.declared .playing-card{width:58px;height:84px}
#game.choosing-bid .hand-card.bid-eligible{border-color:#6f9957;box-shadow:0 0 0 2px #91b779}
#game.wide.compact .table-edge.bidding{min-height:48px;width:200px;padding:0;bottom:calc(var(--toolbar-height) + var(--hand-height) + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%)}
#game.wide.compact.is-bidding .my-play.declared{top:33px;padding:3px 8px;flex-direction:row;gap:6px;border-radius:10px}
#game.wide.compact.is-bidding .my-play.declared .played-hand{height:52px}
#game.wide.compact.is-bidding .my-play.declared .playing-card{width:38px;height:52px}
#game.wide.compact .my-seat-label{font-size:12px}
#game.wide.compact .table-points{top:calc(100% - 10px);min-height:20px;height:20px}
@media(max-height:660px) and (orientation:portrait){#game.is-bidding .my-play.declared{top:31%;padding:3px 8px;flex-direction:row;gap:5px}#game.is-bidding .my-play.declared .playing-card{width:44px;height:62px}#game.is-bidding .my-play.declared .played-hand{height:62px}#game .bid-actions #bidAction{min-height:44px;height:44px}#game .table-edge.bidding{min-height:50px}}
#game.wide:not(.compact) .table-points{top:48%}
#game.wide:not(.compact) .my-play:not(.declared){bottom:16px}
#game.wide.compact.is-bidding .my-play.declared{top:28px}
@media(max-height:700px) and (orientation:portrait){#app[data-type=discard] #table{padding:0;gap:8px}#app .kitty-display{padding:6px}.kitty-heading{margin-bottom:6px}.kitty-heading strong{font-size:15px}#app .eight-kitty>.card,#app .kitty-fixed,#app .kitty-empty{--cardH:60px;height:60px}}
#game.wide:not(.compact) .my-play:not(.declared){bottom:80px}
#game.wide:not(.compact) .my-play:not(.declared){bottom:60px}
.course-card,.course-card.current,.course-card.previewed,.course-card:last-child{display:block;position:absolute;left:calc(var(--i)*(100% - var(--cw))/(var(--count) - 1));top:30px;width:var(--cw);height:var(--ch);transform:translateY(var(--arc)) rotate(var(--angle))!important}
.course-card.current{transform:translateY(calc(var(--arc) - 14px)) rotate(var(--angle))!important}
#game.wide:not(.compact) .table-edge:not(.bidding){left:auto;right:32px;transform:none;width:auto}
#game.wide:not(.compact) .table-edge:not(.bidding) .turn-copy{display:none}
#game.wide.compact.is-bidding .my-play.declared{top:auto;bottom:52px}
@media(max-height:360px) and (orientation:landscape){#game.wide.compact.is-bidding .my-play.declared{bottom:0}#game.wide.compact .table-edge.bidding{left:24px;transform:none;width:150px;bottom:calc(var(--toolbar-height) + var(--hand-height) + env(safe-area-inset-bottom) + 4px)}#game.wide.compact .bid-actions #bidAction{min-width:150px}}
/* Short landscape has a dedicated footer action slot, never over another seat. */
#game.wide.compact .table-edge:not(.bidding){height:0;min-height:0;padding:0;pointer-events:none}
#game.wide.compact #tapPlay{position:fixed;left:auto;right:max(14px,calc((100vw - 1600px)/2 + 14px));bottom:calc(3px + env(safe-area-inset-bottom));width:118px;min-width:118px;height:44px;min-height:44px;pointer-events:auto;z-index:40}
#game.wide.compact.has-play-action .bottom-tools{padding-right:142px}
#game.wide.compact.has-play-action .bottom-tools #expand{display:none}
#game.wide.compact .my-play:not(.declared){top:30px;bottom:auto}
@media(max-height:360px) and (orientation:landscape){#game.wide.compact .table-points{top:calc(100% + 12px)}}
#game.wide.compact .table-edge:not(.bidding){z-index:30}
#game .my-play-owner{position:absolute;left:50%;top:-20px;transform:translateX(-50%);font-size:12px;color:#526246;white-space:nowrap}

/* ===== play-v2-compat(产品 DOM 映射层) ===== */
/* =====================================================================
   UI 测试版 v2 兼容层:产品的 DOM/类名 → 原型(ui/dist)视觉系统
   前置于本文件的还有原样拼接的 table.css / landscape.css / theme.css /
   leo-theme.css / table-surface.css;本层负责:
   1) 产品 .card(.tl/.tr/.bl/.br) 映射为原型纸面卡观感
   2) 手牌扇形绝对布局层(配合 play-v2.js 的排布/手势)
   3) 产品顶栏 #status 隐藏,信息镜像到 trumpStatus / scoreLine / phaseLine
   4) 记录抽屉(五页签)、菜单 sheet、弹窗/设置/吐司等产品样式重上色
   ===================================================================== */
:root{--gold:#b07d2b}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--page);color:var(--tx);font-family:var(--ui-font);overflow:hidden}
button,input,select{font-family:inherit}
#game{height:100vh;height:100svh;max-width:none}

/* ---------- 顶栏镜像 ---------- */
#status{display:none!important}
#phaseLine{padding:0 16px 3px;font-size:12px;color:var(--tx2);line-height:1.4}
#phaseLine:empty{display:none}
#scoreLine .score-total{color:var(--tx2);font-size:13px}

/* ---------- 座位:产品 .name/.backs 装进原型 .player-label ---------- */
#game .player-label .name{font-weight:650;color:var(--tx)}
#game .player-label .name.turn{background:var(--gd);color:var(--gd-tx);border-radius:8px;padding:1px 8px}
#game .player-label .name.won{background:var(--ol-bg);color:var(--ol-tx);border-radius:8px;padding:1px 8px}
#game .player-label .backs{display:block;font-size:12px;font-weight:500;color:#626a54;line-height:1.3}
#game .player.winner .player-label{background:#f3fbdfff!important;outline:1px solid #9aac83}
#game .player.winner .played .card{border-color:var(--ol);box-shadow:0 0 0 1px var(--ol)}

/* ---------- 牌面:产品角标结构 → 原型纸面卡 ---------- */
#game .card{container-type:inline-size;position:relative;flex:none;
  background:#fff;color:var(--tx);border:1.5px solid var(--card-line);border-radius:8px;
  box-shadow:0 2px 0 #33362e14;font-family:var(--card-font);font-weight:800;
  font-variant-numeric:lining-nums tabular-nums;user-select:none}
#game .card.sS{color:#262c2c}
#game .card.sH,#game .card.jb{color:#b33a2b}
#game .card.sD{color:#a8286a}
#game .card.sC{color:#245843}
#game .card.js{color:#262c2c}
#game .card .tl{position:absolute;left:6%;top:5%;font-size:34cqw;line-height:1.08;letter-spacing:-.04em}
#game .card.two .tl{font-size:27cqw;letter-spacing:-.08em}
#game .card .bl{position:absolute;left:6%;top:calc(5cqw + 38cqw);font-size:29cqw;line-height:1;font-family:Arial,sans-serif}
#game .card.two .bl{top:calc(5cqw + 31cqw)}
#game .card .tr,#game .card .br{display:none}
#game .card .joker{position:absolute;left:0;right:0;top:52%;bottom:0;writing-mode:vertical-lr;
  text-align:left;font-size:15cqw;letter-spacing:2px;padding-left:30%;opacity:.85}
#game .card .point-mark{position:absolute;right:6%;bottom:6%;background:var(--gd);color:var(--gd-tx);
  border-radius:4px;font:800 15cqw/1.2 var(--ui-font);padding:2px 4px}
#game .mini{width:var(--miniW,44px);height:calc(var(--miniW,44px)*1.44)}
#game .mini .tl{font-size:44cqw}
#game .mini .bl{display:none}

/* ---------- 手牌:扇形绝对布局(排布与手势见 play-v2.js) ---------- */
#game .hand-area{position:relative}
#game #fanViewport{position:relative;overflow:hidden;touch-action:none;height:100%}
#game #hand{position:relative;height:100%;width:100%;margin:0;padding:0}
#game #hand .card{position:absolute;margin:0;cursor:pointer;transform-origin:50% 100%;z-index:1;
  transition:transform .13s ease,border-color .13s,background .13s,box-shadow .13s}
#game #hand .card.sel{background:var(--bl-bg);border-color:#82aabc;box-shadow:-1px 2px 0 #2c587644}
#game #hand .card.sel::after{content:'✓';position:absolute;top:4px;right:5px;font-size:12px;color:var(--bl-tx);font-family:var(--ui-font)}
#game #hand .card.hintc{outline:2px dashed var(--bl);outline-offset:-1px}
#game #hand .card.peek{border-color:var(--bl)}
html.hasHover #game #hand .card:hover{border-color:#8fb4c5}
#game.wide #hand{--cardW:88px}

/* ---------- 桌面出牌堆:--i 级联(由 play-v2.js 盖章);
     尺寸走 --pile-cw/--pile-step(applyLayout 按布局设定),花色角标保留 ---------- */
#game .played{position:relative;min-height:calc(var(--pile-cw,56px)*1.48);width:100%;display:block}
#game .played .card{position:absolute;top:0;left:calc(var(--i,0)*var(--pile-step,20px));
  transform:rotate(calc((var(--i,0) - .5)*4deg));width:var(--pile-cw,56px);height:calc(var(--pile-cw,56px)*1.48)}
#game .played .card .tl{font-size:32cqw}
#game .played .card .bl{top:calc(5cqw + 36cqw);font-size:27cqw}
#game .played .card.two .bl{top:calc(5cqw + 29cqw)}
#game .played:empty{min-height:0}
#game .my-play-owner{position:absolute;left:50%;top:-22px;transform:translateX(-50%);
  font-size:12px;color:#526246;white-space:nowrap}
#game .my-play{z-index:2}

/* ---------- 桌沿:跟牌提示(#msg 产品持续写入) + 出牌按钮 + 亮主操作条
     原型把定位规则绑在 #tapPlay / .bidding 上,本页按钮是 #btnPlay、
     controls 没有 .bidding 类 —— 那些 :not(.bidding) 规则特异性更高,
     这里用 !important 显式接管:操作条永远全宽、提示弹性靠左、按钮恒定靠右 ---------- */
#game .table-edge{
  position:static!important;left:auto!important;right:auto!important;transform:none!important;
  width:100%!important;height:auto!important;min-height:52px!important;padding:6px 14px!important;
  pointer-events:auto!important;
  display:flex!important;align-items:center!important;justify-content:center!important;
  gap:12px!important;flex-wrap:wrap!important}
#game.wide.compact .table-edge{min-height:46px!important}
#game .table-edge .turn-copy{flex:1 1 200px;min-width:0;text-align:left;display:block!important}
#game .table-edge .turn-copy #msg{display:block!important;max-width:none!important}
#game .table-edge #btnPlay{flex:none;position:static!important;width:118px;height:46px;font-size:16px}
#game .table-edge .bid-actions{flex-basis:100%;width:100%}
#game .table-edge.dealing{min-height:64px}
#game .table-edge #btnPlay:disabled{background:var(--dis);color:var(--dis-tx);border-bottom-color:#cdd2c3}
#game .turn-copy #msg{color:var(--tx);font-size:14px;line-height:1.5}
#game .turn-copy .msgWin{margin-top:2px;font-size:13px;font-weight:650}
#game .turn-copy .msgWin.ours{color:var(--ol-tx)}
#game .turn-copy .msgWin.theirs{color:var(--rd-tx)}

/* 竖屏:提示最多两行,把高度让给牌桌 */
@media (max-width:820px){
  #game .table-edge{padding:4px 10px;min-height:46px}
  #game .turn-copy #msg{font-size:12px;line-height:1.35;display:-webkit-box;
    -webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
}

/* 亮主/发牌操作条按钮(独立一行,居中) */
#game .bid-actions{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-items:center}
#game .bid-actions button{font-size:14px;padding:8px 12px;min-width:0}
#game .bid-actions button.minor{background:#fffdf8;color:var(--leo-brown);border:1.5px solid var(--line);border-bottom:3px solid #c9b99f}
#game .bid-actions span{color:var(--tx2);font-size:13px}

/* ---------- 底部工具 ---------- */
/* 原型只有 5 颗按钮且无 wrap;本页 7~8 颗,窄屏必须允许换行,否则横向溢出 */
#game .bottom-tools{flex-wrap:wrap;row-gap:5px;height:auto;
  min-height:calc(53px + env(safe-area-inset-bottom));padding-top:4px}
#game .bottom-tools button{flex:0 1 auto;height:44px;min-height:44px;
  display:inline-flex;align-items:center;justify-content:center}
@media (max-width:420px){
  #game .bottom-tools{gap:6px;padding-left:8px;padding-right:8px}
  #game .bottom-tools button{font-size:13px;padding:8px 10px}
}
#game .bottom-tools{gap:8px}
#game .bottom-tools button{min-height:44px}
#game .bottom-tools #btnBury{background:var(--leo-brown);color:#fff;border:0;border-bottom:3px solid #583920;border-radius:14px}
#game .bottom-tools #btnBury:disabled{background:var(--dis);color:var(--dis-tx);border-color:#cdd2c3}
#game .bottom-tools #recordsBtn{border-color:var(--line)}

/* ---------- 记录抽屉(五页签 + 面板) ---------- */
#side{position:fixed;top:0;right:0;bottom:0;width:min(460px,94vw);z-index:60;
  background:var(--page);border-left:2px solid var(--line);box-shadow:-8px 0 0 #44362912;
  transform:translateX(105%);transition:transform .22s ease;display:flex;flex-direction:column;
  gap:8px;padding:12px 14px calc(12px + env(safe-area-inset-bottom))}
#side.open{transform:none}
#side .records-head{display:flex;align-items:center;justify-content:space-between;flex:none}
#side .records-head b{font-size:16px;color:var(--leo-brown)}
#side .records-head button{background:#fffdf8;color:var(--tx2);border:1.5px solid var(--line);
  border-radius:10px;width:34px;height:34px;min-height:0;padding:0;font-size:18px;font-weight:400}
#side-backdrop{position:fixed;inset:0;background:#44362933;z-index:59;display:none}
#side-backdrop.show{display:block}
#tabs{display:flex;gap:6px;flex-wrap:wrap;flex:none}
#tabs button{font-size:13px;padding:6px 10px;min-width:0;background:#fffdf8;color:var(--tx2);
  border:1.5px solid var(--line);border-bottom:3px solid #c9b99f;border-radius:10px;display:inline-flex;align-items:center;gap:4px}
#tabs button .leo-avatar{width:18px;height:18px}
#tabs button.on{background:var(--ol-bg);color:var(--ol-tx);border-color:#b6ce85}
#panel{flex:1;min-height:0;overflow-y:auto;font-size:14px;line-height:1.6;color:var(--tx);
  background:#fffdf8;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px}
#panel button.on{background:var(--ol-bg);color:var(--ol-tx);border-color:#b6ce85}
.trickRow{display:flex;gap:10px;align-items:center;margin:3px 0 8px;flex-wrap:wrap}
.trickRow .who{color:var(--leo-brown);flex-basis:100%;margin-bottom:2px;font-weight:650}
.suitGroup{margin:4px 0}
.toggleRow{display:flex;gap:14px;align-items:center;margin-bottom:6px;color:var(--tx2)}
.trickSeek{display:flex;align-items:center;gap:8px;margin:4px 0}
.trickSeek span{white-space:nowrap;opacity:.75}
.coachBox{background:var(--bl-bg);border:1.5px solid #b7d3d8;border-radius:12px;padding:8px 10px;margin:6px 0;line-height:1.7}
.coachStep{color:var(--bl-tx);font-weight:bold}
.memRow{margin:0 0 8px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.memSub{opacity:.85;padding-left:1em}
#noteList{display:flex;flex-direction:column-reverse;gap:4px}
.note{background:var(--ol-bg);color:var(--tx);border-radius:10px 10px 10px 2px;padding:4px 8px;align-self:flex-start;max-width:95%;word-break:break-all}
#noteInputRow{display:flex;gap:4px;margin-bottom:8px}
#noteInput{flex:1;min-width:0;border:1.5px solid var(--line);border-radius:8px;padding:4px 8px;font-size:13px;background:#fff}
#noteSend{padding:4px 10px;font-size:13px}
.pass{color:var(--ol-tx)}.fail{color:var(--rd-tx);font-weight:bold}

/* ---------- 产品弹窗/设置/吐司(重上色) ---------- */
/* 弹窗/面板/sheet 里的按钮基础样式(v2 换掉了产品整块 CSS,这些上下文
   在原型按钮规则的作用域之外,不补就是浏览器默认灰) */
#overlay .panel button,#setOverlay .panel button,#sheet .sheet-actions button,#sheetFooter button{
  background:var(--leo-brown);color:#fff;border:0;border-bottom:3px solid #583920;
  border-radius:12px;padding:8px 18px;font-size:15px;font-weight:700;cursor:pointer;margin:2px}
#overlay .panel button.minor,#setOverlay .panel button.minor,
#sheet .sheet-actions button.minor,#sheetFooter button.minor,.setHeaderBtns button{
  background:#fffdf8;color:var(--leo-brown);border:1.5px solid var(--line);
  border-bottom:3px solid #c9b99f}
#overlay .panel button:disabled,#setOverlay .panel button:disabled{opacity:.4;cursor:default}
#sheet .menu-option{width:100%;text-align:left;display:block;margin:8px 0}
/* 右栏面板里的操作按钮(页签切换/测验选项/发送)走次要样式,选中态橄榄绿 */
#panel button{background:#fffdf8;color:var(--tx);border:1.5px solid var(--line);
  border-bottom:3px solid #c9b99f;border-radius:10px;padding:5px 12px;font-size:13px;font-weight:650;cursor:pointer}
#overlay,#setOverlay{position:fixed;inset:0;background:rgba(68,54,41,.45);display:none;
  align-items:center;justify-content:center;z-index:70}
#setOverlay{z-index:71}
#overlay .panel,#setOverlay .panel{background:#fffdf8;border:2px solid var(--line);color:var(--tx);
  border-radius:18px;box-shadow:0 6px 0 #44362914;padding:26px 34px;text-align:center;
  font-size:16px;line-height:1.9;max-height:82vh;overflow-y:auto}
#overlay .panel b,#setOverlay .panel b{color:var(--leo-brown)}
#setOverlay .panel{text-align:left;width:min(430px,92vw)}
.setRow{display:flex;align-items:center;gap:10px;margin:8px 0;font-size:15px;flex-wrap:wrap}
.setRow>label:first-child{flex:1;min-width:150px;color:var(--tx)}
.setRow select,.setRow input[type=number]{border:1.5px solid var(--line);border-radius:8px;padding:5px 8px;font-size:14px;background:#fff;color:var(--tx)}
.setRow input[type=number]{width:72px}
.setHint{font-size:12px;color:var(--tx2);opacity:.9;margin:-4px 0 10px}
.setHeader{position:sticky;top:-26px;margin:-26px -34px 14px;padding:18px 34px 12px;
  background:#fffdf8;z-index:2;border-bottom:1.5px solid var(--line)}
.setHeader b{display:block;font-size:19px;color:var(--leo-brown);margin-bottom:10px}

<script>
/* ============================================================
 * 80分 游戏引擎 —— 纯函数,不碰 DOM。
 * trump = {suit:'S'|'H'|'D'|'C'|null, rank}。suit 为 null 表示无主。
 * ============================================================ */

const RULES = {
  levelStart: 2,
  handSize: 25,
  kittySize: 8,
  // 抠底倍数 = 最后一墩每人出牌数 × 2
  kittyMultiplier: (lastLeadSize)=>2*(lastLeadSize||1),
  offsuitRankTractor: true,     // 主AA+副常主对可连(常驻)
  strictTractorFollow: true,    // 领出拖拉机、手中有同长(或更长可拆)拖拉机必须跟
  partialTractorFollow: true,   // 【可调】领出长拖拉机、手中只有更短拖拉机时必须跟出短的(默认开)
  pointRebelThreshold: 15,      // 【可调】手牌分数 ≤ 此值可完全造反(5的倍数,≤30;0=关闭)
  trumpRebelThreshold: 3,       // 【可调】手牌主牌张数 ≤ 此值也可完全造反(-1=关闭)
  maxRedeal: 3,                 // 同一局最多连续重新发牌次数(防止一直重发)
  /* 速通模式:级数只在 2/5/10/K/A 这几档上走,每局最多前进一档。
   * 一整场从 2 打到 A 正常要十几局,试玩时太长;速通把它压到最多 4 局。
   * 打开时必打关卡自动失效 —— 阶梯本身就是关卡,再叠一层只会更慢。 */
  speedRun: false,
  speedLadder: [2,5,10,13,14],  // 2 / 5 / 10 / K / A
};

const SUITS = ['S','H','D','C'];

function makeDeck(){                      // 两副牌 108 张,id 唯一
  const cards=[]; let id=0;
  for(let copy=0;copy<2;copy++){
    for(const s of SUITS) for(let r=2;r<=14;r++) cards.push({suit:s,rank:r,id:id++});
    cards.push({suit:'X',rank:15,id:id++});   // 小王
    cards.push({suit:'X',rank:16,id:id++});   // 大王
  }
  return cards;
}

function cardPoints(c){ return c.rank===5?5 : (c.rank===10||c.rank===13)?10 : 0; }
function countPoints(cards){ return cards.reduce((a,c)=>a+cardPoints(c),0); }

function rng(seed){ let a=seed>>>0; return function(){ a|=0; a=(a+0x6D2B79F5)|0;
  let t=Math.imul(a^(a>>>15),1|a); t=(t+Math.imul(t^(t>>>7),61|t))^t;
  return ((t^(t>>>14))>>>0)/4294967296; }; }

function shuffle(arr, rand){ const a=arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(rand()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a; }

// 切牌定先:各抽一张按自然大小(无级数,A>K>…>2,王最大;平手按黑桃>红桃>梅花>方块)
function cutForFirst(seed){
  const deck=shuffle(makeDeck(), rng(seed*7+3));
  const cuts=[0,1,2,3].map(s=>deck[s]);
  const sv={S:3,H:2,C:1,D:0,X:4};
  let first=0;
  for(let s=1;s<4;s++){
    const a=cuts[s],b=cuts[first];
    if(a.rank>b.rank||(a.rank===b.rank&&sv[a.suit]>sv[b.suit])) first=s;
  }
  return {cuts, first};
}

// firstTaker 先拿牌,逆时针轮流;前 100 张为手牌,后 8 张为底
function dealRound(seed, firstTaker=0){
  const deck=shuffle(makeDeck(), rng(seed));
  const hands=[[],[],[],[]];
  for(let i=0;i<100;i++) hands[(firstTaker+i)%4].push(deck[i]);
  return {hands, kitty:deck.slice(100), deck};
}

// ---- 主牌与大小序 ----
function effSuit(c, trump){
  if(c.suit==='X' || c.rank===trump.rank) return 'T';
  if(trump.suit && c.suit===trump.suit) return 'T';
  return c.suit;
}

function natOrder(trumpRank){ const r=[]; for(let x=2;x<=14;x++) if(x!==trumpRank) r.push(x); return r; }

// 有主:0..11 主花色散牌,12 副常主,13 正常主,14 小王,15 大王。
// 相邻可连:主A+副常、副常+正常、正常+小王、小王+大王;异花副常同级不连。
// 无主:13 常主(各花色同级),14 小王,15 大王。
function ordIdx(c, trump){
  if(c.rank===16) return 15;
  if(c.rank===15) return 14;
  if(c.rank===trump.rank){
    if(!trump.suit) return 13;
    return c.suit===trump.suit?13:12;
  }
  return natOrder(trump.rank).indexOf(c.rank);
}

// ---- 牌型判定 ----
function pairKey(c){ return c.suit+':'+c.rank; }

function decompose(cards, trump){
  const by={};
  for(const c of cards)(by[pairKey(c)]=by[pairKey(c)]||[]).push(c);
  const pairs=[], singles=[];
  for(const k in by){
    const arr=by[k];
    if(arr.length>=2) pairs.push([arr[0],arr[1]]);
    if(arr.length%2===1) singles.push(arr[arr.length-1]);
  }
  pairs.sort((a,b)=>ordIdx(a[0],trump)-ordIdx(b[0],trump));
  const comps=[]; let run=[];
  const flush=()=>{
    if(!run.length) return;
    if(run.length>=2) comps.push({type:'tractor',len:run.length,cards:run.flat(),
                                  top:ordIdx(run[run.length-1][0],trump)});
    else comps.push({type:'pair',cards:run[0],top:ordIdx(run[0][0],trump)});
    run=[];
  };
  /* 同一个 ordIdx 可能有不止一对 —— 三门副级牌对全是同一个序号,无主局的四门级数牌对
   * 也是。它们对成链是**可替换**的,所以不能一趟扫:遇到同序号当场断链的话,
   * **手上多出一对同序号的对子反而会把本来连得上的链切短**。主♠打2、手上
   * ♠A♠A(11)+♥2♥2(12)+♦2♦2(12)+♠2♠2(13),一趟扫切成两个二连对,而 11→12→13
   * 本该是一个三连对。
   * 改成分层:同序号的第 1 对算第 0 层、第 2 对第 1 层……,一层一层地扫,
   * 层内 ordIdx 严格递增,最长的链必然落在第 0 层。
   * 只有一层时(绝大多数手牌)这一段和原来的一趟扫**逐字等价**。 */
  const layer=[];
  for(let i=0;i<pairs.length;i++)
    layer.push(i && ordIdx(pairs[i-1][0],trump)===ordIdx(pairs[i][0],trump) ? layer[i-1]+1 : 0);
  const nLayer=layer.length ? Math.max(...layer)+1 : 0;
  for(let L=0;L<nLayer;L++){
    for(let i=0;i<pairs.length;i++){
      if(layer[i]!==L) continue;
      const p=pairs[i];
      if(run.length && ordIdx(p[0],trump)===ordIdx(run[run.length-1][0],trump)+1) run.push(p);
      else { flush(); run=[p]; }
    }
    flush();
  }
  for(const s of singles) comps.push({type:'single',cards:[s],top:ordIdx(s,trump)});
  return comps;
}

function classify(cards, trump){
  if(!cards||!cards.length) return null;
  const es=effSuit(cards[0],trump);
  if(!cards.every(c=>effSuit(c,trump)===es)) return null;
  if(cards.length===1) return {type:'single',suit:es,top:ordIdx(cards[0],trump),cards};
  const comps=decompose(cards,trump);
  if(comps.length===1){ const c=comps[0]; return {type:c.type,len:c.len,suit:es,top:c.top,cards}; }
  return {type:'throw',suit:es,cards,comps,top:Math.max(...comps.map(c=>c.top))};
}

// ---- 跟牌合法性(门内有对必对) ----
function countPairsIn(cards){
  const by={}; for(const c of cards) by[pairKey(c)]=(by[pairKey(c)]||0)+1;
  return Object.values(by).reduce((a,n)=>a+Math.floor(n/2),0);
}
function maxTractorLen(cards, trump){
  return Math.max(0,...decompose(cards,trump).filter(c=>c.type==='tractor').map(c=>c.len));
}
function pairsInLead(lead){
  if(lead.type==='pair') return 1;
  if(lead.type==='tractor') return lead.len;
  if(lead.type==='throw') return lead.comps.reduce((a,c)=>a+(c.type==='pair'?1:c.type==='tractor'?c.len:0),0);
  return 0;
}

function isLegalFollow(hand, lead, chosen, trump){
  const n=lead.cards.length;
  if(chosen.length!==n) return false;
  const ids=new Set(hand.map(c=>c.id));
  const seen=new Set();
  for(const c of chosen){ if(!ids.has(c.id)||seen.has(c.id)) return false; seen.add(c.id); }
  const suitInHand=hand.filter(c=>effSuit(c,trump)===lead.suit);
  const chosenInSuit=chosen.filter(c=>effSuit(c,trump)===lead.suit);
  if(chosenInSuit.length!==Math.min(n,suitInHand.length)) return false;
  const need=pairsInLead(lead);
  if(need>0){
    const must=Math.min(need,countPairsIn(suitInHand));
    if(countPairsIn(chosenInSuit)<must) return false;
  }
  if(RULES.strictTractorFollow && lead.type==='tractor'){
    const m=maxTractorLen(suitInHand,trump);
    const cm=maxTractorLen(chosenInSuit,trump);
    if(m>=lead.len && cm<lead.len) return false;                    // 有长必跟(可拆子拖拉机)
    if(RULES.partialTractorFollow && m>=2 && m<lead.len && cm<m) return false; // 【可调】短拖也必须跟
  }
  return true;
}

// ---- 一墩胜负 ----
function structSig(comps){ return comps.map(c=>c.type+(c.len||'')).sort().join(','); }
/* 候选这一手够不够格和领出比大小 —— 「结构对得上」的准确含义。
 *
 * 口径:候选的组件可以**拆**,不能**并**。拖拉机拆得成对子和单张、对子拆得成两张单;
 * 反过来两张单并不成一对、两个不相连的对子并不成拖拉机。于是:
 *   · 一对主 盖得住「两张单」的甩牌 —— 毙掉撒牌最常见的形态就是这个
 *   · 一副主拖拉机 盖得住「两个不相连的对子」
 *   · 两张单 盖不住一对、两个不相连的对子 盖不住拖拉机(和以前一样)
 *
 * 旧版要求组件构成**逐字相同**(structSig 相等),于是主 ♥8♥8 去毙 ♦Q+♦J 的撒牌时,
 * 这一手在 resolveTrick 里被整个跳过,撒牌方反而收了这一墩。
 * 而 checkThrow 那一侧的 canBeatComp 早就认「拖拉机压对子」—— 一副引擎里两套口径。
 *
 * 实现:只需要把领出里的**连对段**(对子算 1 段、长度 L 的拖拉机算 L 段)装进候选的
 * 连对段里,一段装得下几对就是它的容量;单张不用管,装完之后剩的牌必然正好够。
 * 段数是个位数,直接回溯。 */
function structMatches(cand, lead){
  if(cand.cards.length!==lead.cards.length) return false;
  const runs=x=>(x.type==='throw'?x.comps:[x])
    .filter(c=>c.type!=='single').map(c=>c.type==='tractor'?c.len:1).sort((a,b)=>b-a);
  const need=runs(lead), cap=runs(cand);
  const fit=(i)=>{
    if(i===need.length) return true;
    for(let j=0;j<cap.length;j++){
      if(cap[j]<need[i]) continue;
      cap[j]-=need[i];
      if(fit(i+1)) return true;
      cap[j]+=need[i];
    }
    return false;
  };
  return fit(0);
}

function resolveTrick(plays, trump){
  const lead=classify(plays[0].cards,trump);
  let winIdx=0, best=lead;
  for(let i=1;i<plays.length;i++){
    const cl=classify(plays[i].cards,trump);
    if(!cl || !structMatches(cl,lead)) continue;
    if(cl.suit===best.suit){ if(cl.top>best.top){winIdx=i;best=cl;} }
    else if(cl.suit==='T'){ winIdx=i; best=cl; }
  }
  return {winner:plays[winIdx].seat,
          points:countPoints(plays.flatMap(p=>p.cards)),
          winningPlay:best};
}

// ---- 甩牌校验(失败仅强制出小,不罚分) ----
function canBeatComp(suitCards, comp, trump){
  if(comp.type==='single') return suitCards.some(c=>ordIdx(c,trump)>comp.top);
  const comps=decompose(suitCards,trump);
  if(comp.type==='pair')
    return comps.some(c=>(c.type==='pair'||c.type==='tractor')&&c.top>comp.top);
  return comps.some(c=>c.type==='tractor'&&c.len>=comp.len&&c.top>comp.top);
}
function checkThrow(hands, seat, cards, trump){
  const lead=classify(cards,trump);
  if(!lead||lead.type!=='throw') return {ok:true};
  /* 先把**被压住的**组件全找出来,不是找到一个就收工 —— 罚出哪一组只在这些里面挑。 */
  const beaten=lead.comps.filter(comp=>{
    for(let p=0;p<4;p++){
      if(p===seat) continue;
      const sc=hands[p].filter(c=>effSuit(c,trump)===lead.suit);
      if(canBeatComp(sc,comp,trump)) return true;
    }
    return false;
  });
  if(!beaten.length) return {ok:true};
  /* 罚出**被压住的那些里最小的一组**:先比张数(单张 < 对子 < 拖拉机),张数相同再比 top。
   *
   * 两处都曾经写错(v0.7.16 一起改口):
   *   ① 挑选范围是「被压住的」,不是全部组件。甩 ♥3♥3 + ♥A、别家 ♥K♥K —— ♥A 是这门
   *      最大的,没人压得住,被压的只有 ♥3♥3,那就出 ♥3♥3,不能因为「♥A 张数少」去出 ♥A。
   *   ② 在这个范围里「最小」先比张数。甩 ♠4♠4 + ♠9、别家 ♠5♠5 + ♠K 两组都被压,
   *      出 ♠9;旧写法只比 top 会出 ♠4♠4 —— 一对比一张单贵得多,「罚」反而罚重了,
   *      还把一对拆散。
   * 两个例子单看任何一个都分不出这两条,合起来才定得下来。 */
  const size=c=>c.cards.length;
  const lowest=beaten.reduce((a,c)=>
    size(c)!==size(a) ? (size(c)<size(a)?c:a) : (c.top<a.top?c:a));
  return {ok:false, forced:lowest.cards};
}

// ---- 亮主/反主/造反/加固 ----
// strength: 1=单张常主,2=一对常主,3=小王对,4=大王对(王对→无主)。
function declarationOf(cards, trumpRank){
  if(cards.length===1 && cards[0].rank===trumpRank) return {suit:cards[0].suit,strength:1};
  if(cards.length===2 && pairKey(cards[0])===pairKey(cards[1])){
    if(cards[0].rank===trumpRank) return {suit:cards[0].suit,strength:2};
    if(cards[0].rank===15) return {suit:null,strength:3};
    if(cards[0].rank===16) return {suit:null,strength:4};
  }
  return null;
}
// 反主:强度必须更高。**同一个人不能反自己** —— 他想加强只有「加固」这一条路
// (同花色单张→一对,见 canReinforce2);改花色、或用王对把自己的主反成无将,
// 都不是加固而是自己打乱自己。旧版这里只比 strength、不看座位,而 aiDeclDecide
// 拿它当唯一的合法性闸门,于是 AI 真的会反自己(实测:自己亮♠单张后,
// 改亮♥对 / 小王对 / 大王对三种都返回 true),对应的惩罚却只有 −9 分,压不住无将的抢摊红利。
function canOverride(cur, next, seat){
  if(!cur) return true;
  if(next.strength<=cur.strength) return false;
  if(seat!==undefined && cur.seat===seat) return false;
  return true;
}
// 有对并非必亮对 —— 亮单与亮对是两个不同的选择,都要交给打分:
//   亮单:不暴露这一对,更容易被别家一对常主反掉,但保留了「加固」这条后路;
//   亮对:除大小王对外无人能反,但把一对牌明明白白摊给对手看。
// 实战里,对该门作主信心不足却想试一手、或扰乱对手的动机大过手牌本身好坏时,会选亮单。
function declOptions(hand, trumpRank){
  const opts=[];
  for(const s of SUITS){
    const n=hand.filter(c=>c.suit===s&&c.rank===trumpRank).length;
    if(n>=2){ opts.push({suit:s,strength:2}); opts.push({suit:s,strength:1,hasPair:true}); }
    else if(n===1) opts.push({suit:s,strength:1});
  }
  return opts.sort((a,b)=>b.strength-a.strength);
}
function jokerPairOf(hand){
  const bj=hand.filter(c=>c.rank===16).length, sj=hand.filter(c=>c.rank===15).length;
  if(bj>=2) return {suit:null,strength:4};
  if(sj>=2) return {suit:null,strength:3};
  return null;
}
// 定主后谁坐庄。庄定盘:庄家恒不变 —— 亮主/反主/王对造反都只改主色,不易庄不拿底;
// 无庄盘(首局、或完全造反后的抢庄盘):最终亮主者坐庄,无人亮主则先拿牌者坐庄。
function dealerAfterDecl({dealerKnown, dealer, declSeat, firstTaker}){
  if(dealerKnown) return dealer;
  return declSeat>=0?declSeat:firstTaker;
}

// 加固:仅亮主者本人、单张→一对、且必须先于任何造反(王对/低分造反)
function canReinforce2(decl, seat, hand, trumpRank, rebelHappened){
  if(!decl||decl.seat!==seat||decl.strength!==1||rebelHappened||decl.suit===null) return false;
  return hand.filter(c=>c.suit===decl.suit&&c.rank===trumpRank).length>=2;
}

// 完全造反资格:手牌分数 ≤ pointRebelThreshold,或主牌张数 ≤ trumpRebelThreshold
function canFullRebel(hand, trump){
  const p=RULES.pointRebelThreshold, t=RULES.trumpRebelThreshold;
  const pts=countPoints(hand);
  const nT=hand.filter(c=>effSuit(c,trump)==='T').length;
  const byPts=p>0&&pts<=p, byTrump=t>=0&&nT<=t;
  return {ok:byPts||byTrump, pts, nT, byPts, byTrump};
}

// ---- 本局结算 ----
function scoreRound({defPoints, kitty, defWonLastTrick, lastLeadSize}){
  const kittyPts=countPoints(kitty);
  const mult=RULES.kittyMultiplier(lastLeadSize);
  const total=defPoints + (defWonLastTrick ? kittyPts*mult : 0);
  if(total<80){
    return {defendersWin:false, total, kittyPts, mult, declarerLevelsUp: total===0?3 : total<40?2 : 1};
  }
  return {defendersWin:true, total, kittyPts, mult, defenderLevelsUp: Math.floor((total-80)/40)};
}

// ---- 整场推进:升级与庄家轮换 ----
// 庄家方守住 → 升级、前庄对家连庄;闲家上台 → 闲家升级、前庄下家坐庄。
// 任一队级数打过 A(>14)整场获胜。
// 必打关卡有两层,旧版只做了第一层:
//   1) **不可跳级**:升级途中跨过关卡就停在关卡上(打3升3级本应到6,5是关卡则停在5)。
//   2) **必须打过**:过这一关的条件是本队在该级**坐庄守住**过(v0.7.1 前只要求坐过庄)。
// 第二层原来是缺的,而且缺得不显眼:旧注释写「落点正好等于关卡不算跳过 ——
// 那本来就要在该级打一局」,这句话对庄家成立、对闲家不成立 ——
// 一局打的是**庄家方**的级数,所以一支队停在 2 上当闲家、上台升一级,
// 是从没打过这一关就过去了(实战报障:闲家本级 2,抢到 150 分直接打 3)。
function clampAtGate(from, to, gates){
  if(!gates||!gates.length||to<=from) return {level:to, gate:null};
  const hit=gates.filter(g=>g>from&&g<to).sort((a,b)=>a-b)[0];
  return hit===undefined?{level:to, gate:null}:{level:hit, gate:hit};
}

/* played[team] = 该队已经**坐庄守住**过的最高级数(没有则 -1)。
 * 传 null / 不传 = 只做第一层(不可跳级),用于旧调用方与消融。
 * 返回值里带上更新后的 played,调用方存回去即可 —— 引擎自己不留状态。
 *
 * v0.7.1:口径从「坐过庄」收紧为「坐庄且守住」。
 * 旧版把「这一局在打这一级」本身当成打过的证据 —— 但坐庄输了是**没打过这一关**,
 * 只是被人从这一级上打下去了。实战报障:关卡 10 上坐庄丢庄,下一次上台却直接过了 10。
 * 收紧之后不会卡死:停在关卡上的一方下一局必坐庄(守住是对家连庄、上台是自己坐庄),
 * 只是可能要在同一级上反复坐几局,直到真正守住。 */
function advanceMatch(levels, declSeat, sc, gates, played){
  const declTeam=declSeat%2;
  const L=levels.slice();
  const pl=played?played.slice():null;
  if(pl&&!sc.defendersWin) pl[declTeam]=Math.max(pl[declTeam],L[declTeam]);
  let dealer, up, team;
  if(!sc.defendersWin){ team=declTeam; up=sc.declarerLevelsUp; dealer=(declSeat+2)%4; }
  else { team=1-declTeam; up=sc.defenderLevelsUp; dealer=(declSeat+1)%4; }
  if(RULES.speedRun){
    // 只在阶梯上走,一局最多一档;在 A 上再赢就是打过 A(>14 → 整场结束)
    const ld=RULES.speedLadder;
    const nx=ld.find(x=>x>L[team]);
    L[team]=up>0?(nx===undefined?L[team]+1:nx):L[team];
    const over=L[0]>14||L[1]>14;
    return {levels:L, dealer, matchOver:over,
            winnerTeam:over?(L[0]>14?0:1):null,
            gateStopped:null, gateHeld:null, played:pl};
  }
  const c=clampAtGate(L[team], L[team]+up, gates);
  let level=c.level, gateStopped=c.gate, gateHeld=null;
  // 停在关卡上、却没在这一级坐庄守住过 → 原地不动。
  if(gates&&gates.length&&pl&&up>0&&gates.includes(L[team])&&pl[team]<L[team]){
    level=L[team]; gateStopped=null; gateHeld=L[team];
  }
  L[team]=level;
  const matchOver=L[0]>14||L[1]>14;
  return {levels:L, dealer, matchOver, winnerTeam:matchOver?(L[0]>14?0:1):null,
          gateStopped,        // 非 null = 跳级被关卡拦下,停在关卡上
          gateHeld,           // 非 null = 卡在这一关上,因为本队还没坐庄守住过这一级
          played:pl};
}

/* ---- 随机合法 AI(M3 换启发式) ---- */
function removeCard(hand,c){ const i=hand.findIndex(x=>x.id===c.id); hand.splice(i,1); }
function pickRandom(arr,k,rand){ return shuffle(arr,rand).slice(0,k); }

function aiLead(hand, trump, rand){
  if(rand()<0.3){
    const bySuit={};
    hand.forEach(c=>{(bySuit[effSuit(c,trump)]=bySuit[effSuit(c,trump)]||[]).push(c);});
    const pairs=[];
    for(const s in bySuit) decompose(bySuit[s],trump).forEach(c=>{
      if(c.type==='pair') pairs.push(c.cards);
      if(c.type==='tractor') for(let i=0;i<c.len;i++) pairs.push(c.cards.slice(i*2,i*2+2));
    });
    if(pairs.length) return pairs[Math.floor(rand()*pairs.length)];
  }
  return [hand[Math.floor(rand()*hand.length)]];
}

function bruteFollow(hand, lead, trump, rand){
  const n=lead.cards.length;
  for(let t=0;t<300;t++){
    const c=pickRandom(hand,n,rand);
    if(isLegalFollow(hand,lead,c,trump)) return c;
  }
  return hand.slice(0,n);
}

function genFollow(hand, lead, trump, rand){
  const n=lead.cards.length;
  const inSuit=hand.filter(c=>effSuit(c,trump)===lead.suit);
  const rest=hand.filter(c=>effSuit(c,trump)!==lead.suit);
  let chosen=[];
  if(inSuit.length<=n){
    chosen=[...inSuit, ...pickRandom(rest,n-inSuit.length,rand)];
  }else{
    const comps=decompose(inSuit,trump);
    if(RULES.strictTractorFollow && lead.type==='tractor'){
      const full=comps.find(c=>c.type==='tractor'&&c.len>=lead.len);
      if(full) chosen=full.cards.slice(0,lead.len*2);
      else if(RULES.partialTractorFollow){
        const part=comps.filter(c=>c.type==='tractor').sort((a,b)=>b.len-a.len)[0];
        if(part) chosen=part.cards.slice();
      }
    }
    const targetPairs=Math.min(pairsInLead(lead),countPairsIn(inSuit));
    if(targetPairs>0){
      const used=new Set(chosen.map(c=>c.id));
      const pairUnits=[];
      comps.forEach(c=>{
        if(c.type==='pair') pairUnits.push(c.cards);
        if(c.type==='tractor') for(let i=0;i<c.len;i++) pairUnits.push(c.cards.slice(i*2,i*2+2));
      });
      let have=Math.floor(chosen.length/2);
      for(const u of pairUnits){
        if(have>=targetPairs||chosen.length+2>n) break;
        if(u.some(c=>used.has(c.id))) continue;
        u.forEach(c=>used.add(c.id));
        chosen.push(...u); have++;
      }
    }
    const used2=new Set(chosen.map(c=>c.id));
    chosen.push(...pickRandom(inSuit.filter(c=>!used2.has(c.id)),n-chosen.length,rand));
  }
  return isLegalFollow(hand,lead,chosen,trump)?chosen:bruteFollow(hand,lead,trump,rand);
}

/* ============================================================
 * v3 公共标尺 —— 三个阶段(亮主/扣底/出牌)共用的基础量。
 * 一切分值都尽量折算成「分」(5/10/K 的那个分),这样期望收益与
 * 机会成本能直接相减,而不是靠一堆不同量纲的魔法数打架。
 * ============================================================ */

const AIP = {                 // v3 可调参数,全部集中在这里便于调参
  voidValue: 68,              // 完全断门的战略价值(折算成分;扫参在 62~100 区间是平的,取低端)
  voidChainCredit: 0.55,      // 靠稳赢牌保住牌权再断门的折价(笔记里的「视为50%」)
  buryTrumpBlock: 400,        // 主牌埋底的硬性阻力
  buryAceBlock: 200,          // 副花色 A 埋底的硬性阻力(见 faceValue;旧版是 +30,会被断门收益压过)
  /* 跟牌侧「他这门有几张」的两条收紧(见 pSurvive 的 kOf)。各自 0 = 退回人均份额。 */
  holdKRange: 1,             // 持有区间(硬上下界)夹一道
  voidCondK: 1,              // 已知断门 → 条件概率抬高他在别门(尤其主门)的密度
  voidCondMax: 2.2,          // 抬高倍数的上限(断三门时 pool 会很小,别让它发散)
  /* 「毙得够高」的候选(见 ruffGuardFollow + oppSpendCeil)。默认开,台面 ≥10 分才考虑。
   *
   * v0.7.1 第一版按「他有没有更大的主」定门槛,实测 −0.92 ±0.15,插桩查明原因:
   * 断门那家主牌密度高,能过门槛的只剩大小王 —— 178 次触发里 85% 打的是王,
   * 而 78% 的墩台面是 0 分。掏一张王去赢一墩空气。
   *
   * v0.7.3 换成「他肯不肯花」(oppSpendCeil):门槛取「他拿得出」与「他肯拿出」的小者。
   * 王的占比 85% → 29%,中间那一档(副级牌 25%、主Q 10%、主A 9%、正级牌 7%)终于出线。
   * 配对四批 2800 副:+0.11±0.12 / +0.14±0.10 / +0.07±0.12 / +0.23±0.10,
   * 合并 **+0.15 ±0.05(t=2.69)**;可避免的被盖毙 118 → 110 次、870 → 765 分;
   * 庄家丢最后一墩 +1.7 个百分点(不设闸时是 +2.8~4.6,所以分的闸还是要留)。 */
  ruffGuard: 1,
  /* 埋分的影子成本:每 1 分底分,额外折算多少「分」的留手负担。
   * 动机是 riskBury 只算直接损失,没算「为守住这笔底分,整局都要留手」。
   * 实测这个杠杆推不动:shadow 0.15/0.3/0.6 三档,平均埋底分只从 11.8 掉到
   * 11.3/11.2/10.7,分数 −0.18±0.12 / −0.13±0.15 / +0.25±0.25 全在噪声里。
   * 默认 0。留着是因为它是上面那个 2×2 的自变量。 */
  buryPtShadow: 0,
  buryLowConf: 2,             // (v0.7.23 测试版默认开)守末墩没信心时每分底分的额外代价(0 = 旧行为),见 aiDiscard
  buryConfLine: 0.75,
  buryConfBand: 0.2,
  /* 队友「压回来」要分清是被本门大牌压的、还是被毙掉的(见 partnerRescueP)。
   * 0 = 退回旧行为(两种情形共用一个 share)。 */
  rescueRuffAware: 1,
  /* 规则级加成(push 的第 5 参是**罚分**,所以负数才是加成)。取 −25,和它的同门规则
   * ruffOppBonus / ruffPartnerBonus 同量级。为什么需要加成:0 的时候候选生成了 437 次
   * 只被选中 6 次 —— 大主被 futureValue 的留手价值压着不肯出,而那笔留手价值是按
   * 「守最后一墩」标定的,和「这一墩会不会被原样端走」不是一回事。这是 §8 记过的
   * 同一个上游缺口(打分器只算一墩)。实测 150 局:可避免的被盖毙 123 → 92 次。 */
  ruffGuardBonus: -25,
  ruffGuardMinPts: 10,       // 台面分下限(0 = 不设闸)。空气墩上这条规则挣不到钱
  ruffGuardEnd: 1,           // 收官阶段也允许(0 = 只在中盘)
  /* 对手的「肯不肯花」模型(见 oppSpendCeil)。0 = 退回只按持有分布定门槛。 */
  oppSpendModel: 1,
  oppSpendGain: 1,           // 台面分在他眼里的权重
  oppSpendTempo: 4,          // 拿到牌权对他值多少分

// 全局牌力序:主牌恒高于任何副牌。
// 修的是「无分墩最后一手拿低将牌当废牌垫掉」——根因是 ordIdx 在各门内
// 独立编号,主花色的 3 和副花色的 3 数值相近,排序时被当成等价废牌。
function globalIdx(c, trump){ return effSuit(c,trump)==='T' ? 100+ordIdx(c,trump) : ordIdx(c,trump); }

// 中间平缓、两头陡峭、单调递增,g(0)=0 g(0.5)=0.5 g(1)=1。
// 笔记里无将折扣要的就是这条曲线:将牌从 0→3 张和从 7→10 张时收益变化剧烈,
// 中间区间(4~6 张)则钝感。
function easeEnds(t){ t=Math.max(0,Math.min(1,t)); return 0.5-Math.asin(1-2*t)/Math.PI; }
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));

// 某门(副花色)里我手上从最大往下能连着「稳赢」的张数。
// 有 A 则 A 稳赢;A 出完 K 变最大,于是 K 也算进链条,以此类推。
// 这条链决定了「牌权易手之前我还能撒掉几张」。
function bossChain(suitCards, trump, mem){
  const sorted=suitCards.slice().sort((a,b)=>ordIdx(b,trump)-ordIdx(a,trump));
  const held={};
  sorted.forEach(c=>{ held[pairKey(c)]=(held[pairKey(c)]||0)+1; });
  // 在外(别家手里)比我某张牌更大的牌,若已被我全部持有则该牌仍是稳赢
  let n=0;
  for(const c of sorted){
    const idx=ordIdx(c,trump);
    let bigger=0;
    for(const k in mem.unseen){
      if(mem.unseen[k]<=0) continue;
      const u=keyToCard(k);
      if(effSuit(u,trump)!==effSuit(c,trump)) continue;
      if(ordIdx(u,trump)>idx) bigger+=mem.unseen[k];
    }
    if(bigger>0) break;
    n++;
  }
  return n;
}

// 庄家方赢下最后一墩的概率(决定分牌该不该扣底)。
// 主要看主牌厚度与是否握有大怪 —— 能压到最后的才敢把分埋进底。
function pWinLastTrick(hand, trump){
  const nT=hand.filter(c=>effSuit(c,trump)==='T').length;
  const bj=hand.filter(c=>c.rank===16).length, sj=hand.filter(c=>c.rank===15).length;
  const avg=trump.suit?9:3;                       // 无将时主牌总数只有12张
  let p=easeEnds(clamp(nT/(avg*2),0,1));          // 主牌厚度
  p+=bj>=2?0.22:bj?0.10:0;                        // 大王对≈锁死最后一墩
  p+=sj>=2?0.10:sj?0.04:0;
  return clamp(p,0.05,0.95);
}

/* ============================================================
 * 阶段二:扣底适合度评分(v3)
 *
 *   Bury(c) = −Face(c) + Void(c) + PointΔ(c)
 *
 * Face  牌面价值(留着能赢墩拿分的能力),越大越不该埋
 * Void  该牌对「牌权易手前断门」的边际贡献 × 无将折扣
 * PointΔ 分牌专用:持有丢分风险 − 扣底丢分风险(正=埋更划算)
 *
 * 断门是集合性质(埋掉一门的最后一张才算断),所以不是一次性排序,
 * 而是贪心逐张选:每选一张就重算剩余各门的断门增益。
 * ============================================================ */

// 牌面价值:留在手里能赢墩/拿分的能力
function faceValue(c, groups, trump){
  const s=effSuit(c,trump);
  if(s==='T') return AIP.buryTrumpBlock+ordIdx(c,trump)*6;   // 绝不埋主
  const g=groups[s]||[];
  const same=g.filter(x=>pairKey(x)===pairKey(c)).length;
  let v=ordIdx(c,trump)*2.2;
  if(same>=2) v+=18;                                  // 别拆对
  /* 副花色 A:硬性阻力,不是「+30 分再和断门收益比大小」。
   * 实战反馈 + 实测:旧版在手握副 A 的局里有 19.3% 把它埋了。
   * 判据很简单 —— A 赢不下一墩,只可能是有人在这门断门并毙掉它;
   * 开局各家 25 张、一门 12~13 张,天然断门的概率很低,
   * 也就是说这张 A 赢一墩几乎是确定的,而底里埋一张牌换来的是「可能」造出一个断门。
   * 拿一个确定的墩去换一个可能的断门,不划算 —— 没有人扣 A。 */
  if(c.rank===14) v+=AIP.buryAceBlock;
  else if(c.rank===13){
    v+=14;
    if(g.some(x=>x.rank===14)) v+=10;                 // 手握 A 时 K 是撒牌的第二张
  }
  return v;
}

// 埋掉 suit 门的第 k 张之后,该门的断门概率
function voidProb(remaining, chain){
  if(remaining<=0) return 1;
  if(remaining<=chain) return AIP.voidChainCredit;     // 靠稳赢牌撒完再断
  return 0;
}

// 埋底 v3:断门贡献 + 牌面价值 + 分牌丢分风险对比 + 无将折扣 + 必打关卡
function aiDiscard(hand, trump, opt){
  opt=opt||{};
  const n=RULES.kittySize;
  const mem=opt.mem||makeMemory({hand,history:[],buriedKnown:[]});
  const nT=hand.filter(c=>effSuit(c,trump)==='T').length;
  // 无将/少主时断门价值大打折扣:毙牌选择少,断门换不来多少墩。
  // 分母是「再多的主牌也换不来更多毙牌机会」的饱和点,取人均主牌数的约 1.35 倍:
  //   有主局主牌 36 张、人均 9  → 饱和在 12
  //   无将局主牌总共 12 张、人均 3 → 饱和在 5(单家不可能到 12,那是全场总数)
  const nTsat=trump.suit?AIP.ruffSatTrump:AIP.ruffSatNT;
  const voidDiscount=easeEnds(clamp(nT/nTsat,0,1));
  const pLast=pWinLastTrick(hand,trump);
  const gateDamp=opt.gateAhead?AIP.gateDamp:1;        // 对手面临必打关卡 → 损失封顶

  const rest=hand.slice();
  const picked=[];
  for(let step=0;step<n;step++){
    const groups={};
    rest.forEach(c=>{const s=effSuit(c,trump);(groups[s]=groups[s]||[]).push(c);});
    const nSide=rest.filter(c=>effSuit(c,trump)!=='T').length;
    const remain=n-step;                                // 连这一张在内还要埋几张
    const chains={}, share={};
    for(const s in groups){
      if(s==='T'){ chains[s]=0; share[s]=0; continue; }
      chains[s]=bossChain(groups[s],trump,mem);
      // 断门是集合性质:整门埋完才兑现。若只在「埋掉最后一张」时给分,
      // 这个台阶对贪心是不可见的 —— 它永远走不到那一步,于是 voidValue 形同虚设。
      // 所以把整门的断门价值**摊到需要埋的那几张上**,让梯度露出来。
      const len=groups[s].length, ch=chains[s];
      if(len<=remain) share[s]=AIP.voidValue*voidDiscount/len;                    // 整门埋掉=天绝
      else if(len-ch>0&&len-ch<=remain)
        share[s]=AIP.voidChainCredit*AIP.voidValue*voidDiscount/(len-ch);         // 埋到只剩稳赢牌
      else share[s]=0;                                                            // 这门这轮断不掉
    }
    let best=null;
    for(const c of rest){
      const s=effSuit(c,trump);
      const gain=s==='T'?0:share[s];
      // 分牌:比较「持有丢分」与「扣底丢分」两种风险
      let ptDelta=0;
      const pts=cardPoints(c);
      if(pts){
        // 「门长于平均」要按**埋完之后**的手牌算,不是按现在这 33 张:
        //   门长 —— 扣掉这门还会被埋走的那一份;
        //   基准 —— 埋完剩 25 张,其中 nT 张是主,副牌人均门长 = (25−nT)/3。
        const willBury=nSide>0?remain*((groups[s]||[]).length/nSide):0;
        const lenFinal=Math.max(0,(groups[s]||[]).length-willBury);
        const bench=Math.max(1,(25-nT)/3);
        const pHold=clamp(0.50-0.035*(lenFinal-bench),0.15,0.65);
        const riskHold=pts*pHold;
        /* 底牌翻倍,但只在丢掉最后一墩时兑现 —— 这是**直接**损失。
         * v0.7.1 补一项影子成本(buryPtShadow):把分埋进底里,等于给后半局
         * 加了一条「必须守住最后一墩」的约束,整局都要为它留手。
         * 这笔钱以前没人付:pLast 被当成外生给定的,其实它是被这个决定买下来的。
         * ruffGuard 那次实验第一次量到了它 —— 想在中盘花一张大主去躲盖毙,
         * 就得拿丢最后一墩 26.3%→33.7% 去换,净 −0.51/局。 */
        let riskBury=pts*(AIP.kittyMult*(1-pLast)*gateDamp+AIP.buryPtShadow);
        /* buryLowConf(产品方,2026-09-25):「庄家对守住最后一墩没信心时,埋底干脆 0 分」。
         * pWinLastTrick 本身是准的(audit-bury:估 54% 实 51% … 估 93% 实 89%),
         * 但线性的 `分 × 2 ×(1 − p)` 压不过断门收益 —— p 在 0.5~0.7 的局仍平均埋 9~12 分、每局被抠 9~10 分。
         * 信心低于 buryConfLine 时每分再加一笔,越低越重(buryConfBand 内线性爬满)。 */
        if(AIP.buryLowConf) riskBury+=pts*AIP.buryLowConf*clamp((AIP.buryConfLine-pLast)/AIP.buryConfBand,0,1);
        // 扣底阶段还没开打,reserveUnit 无从谈起,这里保持常数 2
        ptDelta=riskHold-riskBury;
      }
      const score=-faceValue(c,groups,trump)+gain+ptDelta;
      if(!best||score>best.score) best={c,score};
    }
    picked.push(best.c);
    rest.splice(rest.findIndex(x=>x.id===best.c.id),1);
  }
  return picked;
}

/* ============================================================
 * 阶段一:亮主/造反评分(v3)
 *
 *   V(opt) = 100·Grab + 60·SuitFit + 25·Level + 20·Dealer
 *          + 30·Rebel + 18·Gate − 12·Reveal
 *   亮 ⇔ V ≥ θ(v),θ 随已见牌数 v 递减(等下去的信息价值在缩水)
 *
 * 每发到一张牌重算一次:v 越大,SuitFit 的外推越可信、观望价值越低。
 * ============================================================ */

// 已见 v 张里有 seen 张符合条件,外推我最终 25 张手牌里的期望张数。
// 用超几何期望而不是线性外推 —— 后者在 v 小时会疯掉(第1张就是主 ⇒ 25张全是主),
// 这条式子天然带收缩:v 小则结果贴近先验均值,v 大则贴近实际观测。
function projectLen(seen, v, total){
  total=total||36;
  if(v<=0) return total*25/108;
  return seen+(25-v)*(total-seen)/(108-v);
}

// 若以 opt 为主,我手上算作主牌的可见张数
function trumpCountUnder(vis, opt, trumpRank){
  return vis.filter(c=>c.suit==='X'||c.rank===trumpRank
                    ||(opt.suit&&c.suit===opt.suit)).length;
}

// 副牌面质量(无将局特别看重):A/K/对子的密度
function sideQuality(vis, opt, trumpRank){
  const side=vis.filter(c=>c.suit!=='X'&&c.rank!==trumpRank&&c.suit!==opt.suit);
  if(!side.length) return 0;
  const cnt={};
  side.forEach(c=>{cnt[pairKey(c)]=(cnt[pairKey(c)]||0)+1;});
  let q=0;
  side.forEach(c=>{ if(c.rank===14) q+=1; else if(c.rank===13) q+=0.6; });
  for(const k in cnt) if(cnt[k]>=2) q+=0.8;
  return clamp(q/(side.length*0.42)-1,-1,1);
}

// D: {vis, seat, trumpRank, curDecl, dealerKnown, dealer, firstTaker, gates, levels}
// 别家凑出一对常主(从而反掉我亮的单张)的粗略概率。
// 某一门的两张级牌都落进同一家 25 张手里 ≈ (25/108)(24/107) ≈ 0.052,两个对手则约 0.104;
// 对「两张都还没见过」的每一门独立累计。
function pPairOverride(vis, trumpRank){
  let f=0;
  for(const s of SUITS){
    const seen=vis.filter(c=>c.suit===s&&c.rank===trumpRank).length;
    if(seen===0) f++;
  }
  return clamp(1-Math.pow(1-0.104,f),0,0.8);
}

/* 手牌契合度那一段单独拆出来(v4)。
 * 它回答的是纯粹的「以这个花色(或无将)为主时,我这手牌有多强」——
 * 不含抢庄红利、暴露代价、谁已亮主这些与主色无关的项。
 * 拆出来是为了给造反做**基线**:造反的正确判据不是「新主够不够好」,
 * 而是「比现在这个主好多少」。v3 从头到尾没有算过现状,于是会出现
 * 「手握长♠、却因为摸到小王对去反无将」这种没有逻辑的行为。
 */
function declHandQuality(D, opt){
  const v=D.vis.length, why=[];
  const iAmDefender=D.dealerKnown&&D.dealer>=0&&D.dealer%2!==D.seat%2;
  let fit;
  if(opt.suit){
    const L=projectLen(trumpCountUnder(D.vis,opt,D.trumpRank),v,36);
    fit=clamp((L-9)/5,-1,1);                        // 有主局主牌总数36张,人均9
    if(fit>0.25) why.push(`预计${L.toFixed(0)}张主`);
  }else{
    // 无将:主牌总共只有 12 张(4王+8级牌)。这时候「期望长度」不是好尺子 ——
    // 关键是这 12 张里**最大的那几张**在不在我手上:握大王对 + 两张级牌(4/12)
    // 和握四张级牌无王(4/12)在张数上完全等价,实战里天差地别。
    // 所以无将的 fit 用**牌力占比**:大王 1.0、小王 0.75、级牌 0.4,除以全场总和归一。
    const reluctance=AIP.ntReluctance*(D.dealerKnown?1:0.3);
    fit=0.6*ntTrumpShare(D.vis,D.trumpRank)*2-0.6
       +0.6*sideQuality(D.vis,opt,D.trumpRank)-reluctance
       +(iAmDefender?AIP.ntDefenderEdge:-AIP.ntDefenderEdge*0.6);
    fit=clamp(fit,-1,1);
    if(fit>0) why.push('无将且大牌集中在我手上');
  }
  let s=60*fit;
  // 级数为 5/10/K:那 8 张级牌本身就是 40 或 80 分。
  //    关键在稀释度 —— 有主局它们被摊薄在 36 张主牌里,谁主花色长谁通吃;
  //    无将局主牌总共 12 张,其中 8 张是分,即「主牌里三分之二是分」,
  //    且常主压死一切副牌,每张≈一墩稳赢外加 5~10 分。
  //    对闲家更是如此:改无将等于拆掉庄家那台长将牌碾压机,把分牌拉回可争夺状态,
  //    庄家没了长主也更难保住最后一墩,抠底对闲家开了口子。所以不减半,反而要加。
  if([5,10,13].includes(D.trumpRank)){
    let lv=opt.suit?1:1.35;
    if(!opt.suit&&iAmDefender) lv+=0.35;
    s+=AIP.ptLevelBonus*lv; why.push(opt.suit?'级数带分':'无将局主牌里大半是分');
  }
  return {q:s, fit, why};
}

// 无将局那 12 张主牌里,我手上占了多少「牌力」(而不是多少张)
function ntTrumpShare(vis, trumpRank){
  const w=c=>c.rank===16?1.0:c.rank===15?0.75:c.rank===trumpRank?0.4:0;
  const total=2*1.0+2*0.75+8*0.4;                 // 全场:2大王 + 2小王 + 8张级牌
  return clamp(vis.reduce((a,c)=>a+w(c),0)/total,0,1);
}

function scoreDeclOption(D, opt){
  const v=D.vis.length;
  const iAmDefender=D.dealerKnown&&D.dealer>=0&&D.dealer%2!==D.seat%2;
  const hq=declHandQuality(D,opt);
  const fit=hq.fit, why=hq.why.slice();
  let s=hq.q;
  // 1. 无庄开局:亮主=坐庄=拿底8张(外加自己定主色),抢摊抢反是默认策略。
  //    无将的红利略低一档 —— 无庄盘坐庄的价值有一半来自长将牌压场,
  //    而无将局主牌总共才 12 张,谁也压不了场。但红利仍在,不该被排除。
  /* v0.5.8 ⑤:**庄位已经在本队手上时,这份红利已经到手了,不能再算一遍。**
   *
   * 「打2 造反自己对门」的根因就在这一行。无庄盘里最终亮主者坐庄拿底,
   * 而 grabBonus(85)只加在候选上、不进 base(base 只取 declHandQuality),
   * 于是从**自己队友**手里把庄抢过来,账面上白赚 85 分;
   * 「队友已亮」的罚分只有 −30,无庄盘门槛又只有 10−10·prog(+12)≈12~22。
   *
   * 实测(♠2♠2 + 长♠,队友已亮 ♦):
   *   无庄开局、队友已亮 → 增量 +91.7 / 门槛 17.2 → 造反自己对门
   *   同一手牌、庄已定   → 增量  −7.3 / 门槛 35.4 → 正确地不动
   * 而且 base 用的是**我自己**在队友主色下的契合度,队友主色我越短基线越负、
   * 增量越大 —— AI 恰好在「队友有长门而我没有」时最想反队友,正好反了。
   *
   * 队友已亮时只保留 grabPartnerKeep 这一小截:同队之内谁坐庄确实有差别
   * (我手更适合坐庄时值一点),但那是个位数,不是 85。grabPartnerKeep=1 退回旧行为。 */
  if(!D.dealerKnown){
    const partnerHasIt=D.curDecl&&D.curDecl.seat%2===D.seat%2&&D.curDecl.seat!==D.seat;
    const raw=opt.suit?AIP.grabBonus:AIP.grabBonusNT;
    s+=partnerHasIt?raw*AIP.grabPartnerKeep:raw;
    why.push(partnerHasIt?'庄位已在本队':'无庄抢摊');
  }
  // 2~3. 手牌契合度 + 级数,已在 declHandQuality 里算好(拆出去是为了给造反做基线)
  // 4. 庄家归属
  if(D.dealerKnown){
    if(D.dealer===D.seat) s+=20*0.5;
    else if(D.dealer%2===D.seat%2){                 // 队友坐庄:让他先亮,除非我这门极强
      if(fit<0.6){ s+=20*(-0.7); why.push('队友坐庄,先观望'); }
    }else{ s+=20*0.3; why.push('对手坐庄'); }
  }
  // 5. 谁已亮主(只影响造反)
  if(D.curDecl){
    const prog=v/25;
    if(D.curDecl.seat===D.seat) s+=30*(-0.3);
    else if(D.curDecl.seat%2===D.seat%2){ s+=30*(-1.0); why.push('队友已亮,不必打乱'); }
    else{ s+=30*(0.4+0.6*prog); why.push('对手已亮,越晚越该反'); }
  }
  // 6. 必打关卡:对手坐庄且下一级无法跳过 → 扰乱对手预期优势的权重上升
  if(D.gates&&D.gates.length&&D.dealerKnown&&D.dealer%2!==D.seat%2){
    const oppLv=D.levels?D.levels[D.dealer%2]:null;
    if(oppLv!==null&&D.gates.includes(oppLv)){ s+=18; why.push('对手卡关,损失有限'); }
  }
  // 7. 暴露手牌信息的代价:王对造反等于把一对王亮给对手针对
  s-=12*(opt.strength>=3?1:opt.strength===2?0.4:0.2);
  // 8. 手上有对却只亮单张:省下暴露、留着「加固」这条后路,但要担被别家一对常主反掉的风险。
  //    信心越足(fit 越高)越不愿意冒这个险 —— 于是自然形成
  //    「信心不足想试一手 → 亮单」「手牌够好 → 亮对(或先亮单再加固)」。
  /* v0.7.15:闲家亮对。第一赛季数据:陪练坐庄、闲家(五份提交)亮的是一对时,守住率只有
   * 53%(非分级)/ 39%(分级),而陪练自己当闲家几乎不亮对(对手坐庄的局里 22~33%),
   * 对手坐庄却在陪练亮对时只守住 15~32%。闲家亮对是最被低估的一手:主定在自己的长门上,
   * 庄家 8 张底牌的优势被抵掉大半,而且一对常主只有王对反得掉。 */
  if(AIP.defDeclPair&&iAmDefender&&opt.strength===2){ s+=AIP.defPairBonus; why.push('闲家亮对,把主定在自己长门'); }
  if(opt.hasPair&&opt.strength===1&&!(AIP.defDeclPair&&iAmDefender)){
    // 「留后路」这件事只在心里没底时才值钱:信心越足,那条后路越用不上
    s+=AIP.declSingleOption*(1-Math.max(0,fit));
    // 被一对常主反掉不只是丢了主色 —— 无庄盘还连庄位和那 8 张底一起丢
    s-=pPairOverride(D.vis,D.trumpRank)*AIP.declOverrideCost
        *(D.dealerKnown?1:1.5)*Math.max(0,fit);
    why.push('先亮单张试探,留加固后手');
  }
  return {score:s, reason:why.join('、')||'手牌一般'};
}

// θ(v):亮的门槛。无庄盘门槛低(抢庄红利大);有庄盘早期高、越晚越低
function declThreshold(D){
  const prog=D.vis.length/25;
  return D.dealerKnown ? 34-22*prog : 10-10*prog;
}

// 返回最优亮主/造反选择,或 null 表示这一张不动
function aiDeclDecide(D){
  const cands=[...declOptions(D.vis,D.trumpRank)];
  const jp=jokerPairOf(D.vis); if(jp) cands.push(jp);
  const legal=cands.filter(o=>canOverride(D.curDecl,o,D.seat));
  if(!legal.length) return null;
  /* 造反用**增量**判据(v4)。
   * v3 是绝对门槛 `V(opt) ≥ θ`,而 V(opt) 只回答「以 opt 为主时我这手牌好不好」。
   * 造反要回答的是另一个问题:「换成这个主,比现在这个主好多少」。
   * v3 从头到尾没有算过现状,于是会出现「手握长♠、却因为摸到小王对去反无将」。
   * 基线只取与主色有关的那一段(declHandQuality),抢庄红利 / 暴露代价 / 谁已亮主
   * 这些本来就是造反的边际成本收益,留在增量侧。
   */
  const base=D.curDecl
    ? declHandQuality(D,{suit:D.curDecl.suit,strength:D.curDecl.strength}).q : 0;
  const scored=legal.map(o=>{
    const r=scoreDeclOption(D,o);
    return {opt:o, score:r.score-base, reason:r.reason,
            baseline:base, absolute:r.score};
  }).sort((a,b)=>b.score-a.score);
  // 造反的门槛比首亮高一档:打乱一个已经成立的主色,本身有摩擦成本
  const iAmDef=D.dealerKnown&&D.dealer>=0&&D.dealer%2!==D.seat%2;
  const th=declThreshold(D)+(D.curDecl?AIP.rebelThresholdAdd:0)+(iAmDef?AIP.defThreshAdd:0);
  const top=scored[0];
  return {...top, threshold:th, pass:top.score>=th, cands:scored.slice(0,3)};
}

// 缺门推断(硬):从出牌历史看谁在哪门没跟牌(每4手为一墩,首手为领出)
function makeVoids(history, trump){
  const voids=[{},{},{},{}];
  for(let i=0;i<history.length;i+=4){
    const trick=history.slice(i,i+4);
    const lead=classify(trick[0].cards,trump);
    if(!lead) continue;
    for(let j=1;j<trick.length;j++){
      if(trick[j].cards.some(c=>effSuit(c,trump)!==lead.suit))
        voids[trick[j].seat][lead.suit]=true;
    }
  }
  return voids;
}

// cheapSort 的排序键,单门内比较用:越小越「便宜」
// 注意:这把尺子同时是**对手模型**的一部分(makeReads 用它反推「他手上没有比 X 更便宜的牌」)。
// 主牌的溢价不修,对手模型就会一直假设别人先打大王再打主A,maxHoldIn 的演绎跟着跑偏。
function cheapKey(c, trump){ return globalIdx(c,trump)+(cardPoints(c)?8:0)+controlPremium(c,trump); }

/* ============================================================
 * 缺门推断(软):从**出牌方式**反推。
 *
 * 前提:一个理智的人跟牌时,若既没有压制意图、也没有贴分动机,会出本门最便宜的牌。
 * 于是「他出了 X」就等于「他手上没有比 X 更便宜的本门牌」—— 这是硬演绎,不是概率。
 * 再与记牌一交叉,就得到他在这门最多还能有几张;上界为 0 即断门。
 *
 * 例:东领出副 A,西跟了一张 Q(既没压过、也不是贴分时机)。
 *    ⇒ 西手上没有比 Q 更便宜的这门牌。若我恰好握着 K、K、10、10,
 *      那么「不比 Q 便宜」的牌几乎都在我手里,西的上界掉到 1~2 张,断门概率陡增。
 *
 * 两个前提缺一不可,所以只在「他那队当时不是暂大」且「他这手没有压过当时最大」时采信 ——
 * 队友暂大时最优解是贴分(出最大的分牌)而不是出最小,这条演绎就不成立。
 *
 * 局限(必须挂在门口):它假设对手用和 AI 同一套「最便宜」排序。
 * 遇到刻意骗牌的人(故意出高牌制造断门假象)会被带沟里。
 * ============================================================ */
// 贴分序的排序键,与 dumpSort 一致:分大的排前,同分值挑小的
function dumpKey(c, trump){ return -cardPoints(c)*100+globalIdx(c,trump); }

function makeReads(history, trump){
  // 两种「他会先出什么」的序,对应两种局面,各自留一条下界
  const fCheap=[{},{},{},{}];     // 他那队不是暂大 → 出最便宜的
  const fDump =[{},{},{},{}];     // 他那队暂大   → 贴最大的分
  const hard=[{},{},{},{}];
  for(let i=0;i+3<history.length;i+=4){
    const trick=history.slice(i,i+4);
    const lead=classify(trick[0].cards,trump);
    if(!lead) continue;
    let best=lead, bestSeat=trick[0].seat;
    for(let j=1;j<trick.length;j++){
      const p=trick[j], cl=classify(p.cards,trump);
      if(p.cards.some(c=>effSuit(c,trump)!==lead.suit)){
        hard[p.seat][lead.suit]=true;                 // 没跟本门 = 硬缺门
      }else if(lead.cards.length===1){
        // 只在领出单张时采信:多张牌的跟法受「有对必对/拖拉机必跟」的义务约束,
        // 他出什么未必是他想出什么,这条演绎会失真。
        const beats=cl&&structMatches(cl,best)&&
          ((cl.suit===best.suit&&cl.top>best.top)||(cl.suit==='T'&&best.suit!=='T'));
        if(!beats){
          const partnerWinning=bestSeat%2===p.seat%2;
          const tgt=partnerWinning?fDump:fCheap;
          const key=partnerWinning?dumpKey:cheapKey;
          const k=Math.min(...p.cards.map(c=>key(c,trump)));
          const cur=tgt[p.seat][lead.suit];
          tgt[p.seat][lead.suit]=cur!==undefined?Math.max(cur,k):k;
        }
      }
      if(cl&&structMatches(cl,lead)){
        if(cl.suit===best.suit){ if(cl.top>best.top){best=cl;bestSeat=p.seat;} }
        else if(cl.suit==='T'){ best=cl; bestSeat=p.seat; }
      }
    }
  }
  return {fCheap,fDump,hard};
}

// 结合两条演绎下界与记牌,算他在这门最多还能有几张。
// 任一条下界排除掉的牌都不可能在他手上 —— 两条是「且」的关系,越多轮次上界收得越紧。
function maxHoldIn(reads, mem, seat, suitEff, trump){
  const fc=reads.fCheap[seat]?reads.fCheap[seat][suitEff]:undefined;
  const fd=reads.fDump[seat] ?reads.fDump[seat][suitEff] :undefined;
  let n=0;
  for(const k in mem.unseen){
    const cnt=mem.unseen[k]; if(cnt<=0) continue;
    const c=keyToCard(k);
    if(effSuit(c,trump)!==suitEff) continue;
    if(fc!==undefined && cheapKey(c,trump)<fc) continue;
    if(fd!==undefined && dumpKey(c,trump) <fd) continue;
    n+=cnt;
  }
  return n;
}

// 某家在某门缺门的概率。硬缺门=1;上界为0=1;否则按他手上牌占未见牌的比例衰减。
function makeVoidProb(reads, mem, trump, handLeft, who){
  let unseenTotal=0;
  for(const k in mem.unseen) unseenTotal+=Math.max(0,mem.unseen[k]);
  const share=clamp(handLeft/Math.max(1,unseenTotal),0.02,0.6);
  const cache={};                       // 同一次决策里会被反复问,记忆化
  return (seat, suitEff)=>{
    if(suitEff==='T') return 0;
    if(reads.hard[seat]&&reads.hard[seat][suitEff]) return 1;
    const ck=seat+':'+suitEff;
    if(cache[ck]!==undefined) return cache[ck];
    const m=maxHoldIn(reads,mem,seat,suitEff,trump);
    let p;
    if(AIP.voidReadTrust<1){
      let raw=0; for(const k in mem.unseen) if(mem.unseen[k]>0&&effSuit(keyToCard(k),trump)===suitEff) raw+=mem.unseen[k];
      const pOf=n=>n===0?1:clamp(Math.pow(1-share,n),0,0.97);
      p=raw===0?1:AIP.voidReadTrust*pOf(m)+(1-AIP.voidReadTrust)*pOf(raw);
    }else if(m===0){
      // 0 张是怎么来的:这门在外本来就一张不剩(硬)—— 还是靠「他会先出最便宜的」推出来的(软)
      p=1;
      if(AIP.voidReadSoft){
        let raw=0; for(const k in mem.unseen) if(mem.unseen[k]>0&&effSuit(keyToCard(k),trump)===suitEff) raw+=mem.unseen[k];
        if(raw>0) p=AIP.voidReadSoft;
      }
    }else p=clamp(Math.pow(1-share,m),0,0.97);
    if(AIP.declVoidPrior&&who&&who.declSeat!==undefined&&who.declSeat>=0
       &&seat===who.declSeat&&who.me!==who.declSeat&&p<1)
      p=p+(1-p)*AIP.declVoidPrior;
    return cache[ck]=p;
  };
}

/* 持有区间:上界 + **下界**(v4.7)。
 *
 * 设计文档 §7 把「对手建模只到缺门级」列为第二大短板,原话是
 * 「维护每家×每门的持有区间而非单个概率:下界由『必须跟牌却没跟』给出,
 *  上界由演绎给出」。上界一直有(maxHoldIn),下界一直没做 ——
 * 而钓主的收益判断恰恰只要下界:**对手手上还有没有主牌可跟**。
 *
 * 下界几乎是白捡的,因为升级里有一条很强的约束:
 * **每家手牌数在任何时刻都相同**(每墩每家出一样多张)。于是
 *     下界(座, 门) ≥ 手牌数 − Σ_{其他门} 上界(座, 其他门)
 * 三门都被演绎压到很低时,剩下的牌只能在第四门里 —— 这是硬演绎,不是概率。
 *
 * handSize 传本家手牌数即可(领出时四家相同;跟牌时已出过牌的那几家少一张,
 * 少算一张的方向是保守的,不会高估下界)。
 */
function makeHoldRange(reads, mem, trump, handSize){
  const suits=['T','S','H','D','C'].filter(s=>s==='T'||s!==trump.suit);
  const cache={};
  return (seat, suitEff)=>{
    const ck=seat+':'+suitEff;
    if(cache[ck]) return cache[ck];
    const hi=s=>(reads.hard[seat]&&reads.hard[seat][s])?0
                :Math.min(handSize,maxHoldIn(reads,mem,seat,s,trump));
    let others=0;
    for(const s of suits) if(s!==suitEff) others+=hi(s);
    const lo=Math.max(0,handSize-others);
    return cache[ck]={lo,hi:hi(suitEff)};
  };
}

/* ============================================================
 * M3 启发式 AI:记牌 + 规则评估。
 * 返回 {cards, reason, score} —— reason 供教练模式复用。
 * view = {seat, hand, trump, history:[{seat,cards}...], buriedKnown}
 * ============================================================ */
function keyToCard(k){ const i=k.indexOf(':'); return {suit:k.slice(0,i),rank:+k.slice(i+1)}; }

// 记牌:已见 = 自己手牌 + 全部出牌历史 + (庄家还知道底牌)
function makeMemory(view){
  const seen={};
  const add=c=>{ const k=pairKey(c); seen[k]=(seen[k]||0)+1; };
  view.hand.forEach(add);
  (view.history||[]).forEach(p=>p.cards.forEach(add));
  (view.buriedKnown||[]).forEach(add);
  const unseen={};
  makeDeck().slice(0,54).forEach(c=>{ const k=pairKey(c); unseen[k]=2-(seen[k]||0); });
  return {unseen};
}
function maxUnseenIdx(mem, suitEff, trump){
  let m=-1;
  for(const k in mem.unseen){
    if(mem.unseen[k]<=0) continue;
    const c=keyToCard(k);
    if(effSuit(c,trump)!==suitEff) continue;
    m=Math.max(m,ordIdx(c,trump));
  }
  return m;
}
function unseenPairAbove(mem, suitEff, idx, trump){
  for(const k in mem.unseen){
    if(mem.unseen[k]<2) continue;
    const c=keyToCard(k);
    if(effSuit(c,trump)===suitEff && ordIdx(c,trump)>idx) return true;
  }
  return false;
}
/* 「在外还有更大的对子」不是一个布尔问题(v4.6)。
 * 同点数的两张牌可能分在两家手里,那就凑不成对 —— 而旧版的 unseenPairAbove
 * 只要看到「这个点数还有两张没见」就判定对手有对,等于按 100% 估一件小概率的事,
 * 于是 AI 系统性低估自己的对子,该领的对子不敢领。
 *
 * 两张同点数落在**同一家**的概率(三家各 h 张、未见共 U 张):
 *     p = 3 · h(h−1) / (U(U−1))
 * 开局 h=25、U=83 → 0.26;收官 h=5、U=23 → 0.12。
 * 所谓「理论最大对子」正是这件事:它跟单张最大牌是两套账,而且随着这门越打越薄,
 * 剩下的同点两张越不可能还在一家手上。
 *
 * h 由 U 反推(未见 = 三家手牌 + 8 张底),庄家知道底牌时会略微低估 h,方向是保守的。 */
function pPairAbove(mem, suitEff, idx, trump){
  let U=0;
  for(const k in mem.unseen) U+=Math.max(0,mem.unseen[k]);
  const h=Math.max(1,(U-RULES.kittySize)/3);
  const pTogether=U>1?clamp(3*h*(h-1)/(U*(U-1)),0,1):0;
  let pNone=1;
  for(const k in mem.unseen){
    if(mem.unseen[k]<2) continue;
    const c=keyToCard(k);
    if(effSuit(c,trump)!==suitEff||ordIdx(c,trump)<=idx) continue;
    pNone*=1-pTogether;                 // 每个更高点数各自独立地「凑成对」
  }
  return 1-pNone;
}
// 该牌型是否已是本门在外最大(“钢板”)
function isBossPlay(cl, mem, trump){
  if(cl.type==='single') return cl.top>=maxUnseenIdx(mem,cl.suit,trump);
  if(!unseenPairAbove(mem,cl.suit,cl.top,trump)) return true;   // 严格意义上已无更大的对
  // 严格意义上还有,但可能根本凑不成对 —— 概率低于阈值就当钢板
  return pPairAbove(mem,cl.suit,cl.top,trump)<AIP.pairBossMaxP;
}

// 跟小:挑最小且无分的。两处修正 ——
// (a) 用 globalIdx 而非 ordIdx,低主牌不再被误判成废牌;
// (b) 加「控门溢价」:A/K 虽然不是分牌却是撒牌的本钱。手持 A,K,10 被对手领 A 压死时,
//     旧版会当成「A 最便宜」把 A 丢掉,新版会出 10、留 A+K 以后一起撒。
/* v0.5.8 ①：控门溢价**只对副牌成立**。
 *
 * 它按自然点数判 A/K/Q,而这个溢价的语义是「撒牌的本钱」—— 只在副花色里说得通。
 * 主牌也走同一条键,于是主♠打2 时的「便宜序」被彻底打乱:
 *
 *   主J 108 < 副常主 112 < 主Q 113 < 小王 114 < 大王 115 < 主K 130 < 主A 141
 *
 * 也就是 AI 认为**大小王比主K/主A 更便宜**、副常主比主Q 更便宜。实测断门毙牌:
 * 手持「主A+大王」出大王、「主K+小王」出小王、「主Q+副常主」出副常主。
 * 这一条同时是「毙牌消耗大牌」和「收官前保底手段就没了」两条反馈的根因 ——
 * 中盘每一次断门,AI 都在优先烧掉自己最后的护底牌。
 * 开关 AIP.trumpNoPremium=0 可退回旧行为做消融。 */
/* 主牌那一侧要的不是「A/K/Q 溢价」,而是**梯子顶端的控制溢价**。
 * globalIdx 只是序号:大小王只比主K 高 4~5 个序号,可它们的控制价值差着量级 ——
 * 这正是 trumpHold 当年从「绝对刻度」改成「相对刻度」的同一个道理。
 * 没有这一截,分牌那个 +8 就足以让 AI 拿小王去换一张主K。
 * 取值刻意小(≤14),只保证顶端四张不会被当成便宜牌,不干扰下面的正常序。
 * trumpTopPremium=0 即关闭。 */
const trumpTop=(c,trump)=>!AIP.trumpTopPremium?0
  :c.rank===16?14:c.rank===15?10
  :(c.rank===trump.rank?(c.suit===trump.suit?6:4):0);
const controlPremium=(c,trump)=>
  (AIP.trumpNoPremium&&trump&&effSuit(c,trump)==='T')?trumpTop(c,trump)
  :(c.rank===14?30:c.rank===13?12:c.rank===12?4:0);
/* v0.5.8 ⑨:必赢时「最省」的定义要反过来 —— 稳拿这一墩时,手上的主分牌该趁机兑现,
 * 留在手里迟早要出,拖到没牌权时更可能白送给对手。cashPointW 是「一张分值折合几级牌序」,
 * 取 0.8:trumpHoldTop 14 摊在约 12 级上 ≈ 1.2 分/级,10 分 ≈ 8 级。 */
const ptPenalty=(c,certain)=>certain&&AIP.cashPointW
  ? -cardPoints(c)*AIP.cashPointW      // 稳拿这墩:分越大越该现在出
  : (cardPoints(c)?8:0);               // 否则维持旧口径,一律回避分牌
const cheapSort=(cards,trump,certain)=>cards.slice().sort((a,b)=>
  (globalIdx(a,trump)+ptPenalty(a,certain)+controlPremium(a,trump))
 -(globalIdx(b,trump)+ptPenalty(b,certain)+controlPremium(b,trump)));
/* 贴分:先塞大分,同分值挑最小的牌;同样主牌垫后。
