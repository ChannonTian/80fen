// ---- 教练设置(全部可开关可调,默认全开) ----
let C={on:true, gapSens:'中', strict:false, review:true, quiz:true, memShow:false};
try{ Object.assign(C,JSON.parse(localStorage.getItem(LSP+'coach')||'{}')); }catch(e){}
function saveC(){ try{ localStorage.setItem(LSP+'coach',JSON.stringify(C)); }catch(e){} }
// 教练的「失误」门槛,单位是折算后的期望分。
// 领出与跟牌的评分基准不同(领出含「拿住牌权」的战略值,量纲约为跟牌的 4 倍),
// 所以领出的差值先除以 LEAD_GAP_SCALE 再比,否则教练会对领出唠叨、对跟牌失明。
const GAP_THR={'高':6,'中':12,'低':22,'关':Infinity};
const LEAD_GAP_SCALE=4;
const desc=cards=>cards.map(miniName).join('+');
function viewFor(seat){
  return {seat,hand:G.hands[seat],trump:G.trump,declSeat:G.declSeat,
          history:[...G.tricks.flatMap(t=>t.plays),...G.trick],
          buriedKnown:seat===G.declSeat?G.buried:[],
          decl:G.decl};            // 谁亮的什么主(v0.7.15:收官抽样把亮主者的级牌钉在他手里)
}

function cardHTML(c,cls=''){
  if(c.suit==='X'){
    return `<div class="card ${c.rank===16?'jb':'js'} ${cls}" data-id="${c.id}"><span class="joker">JOKER</span>`+
           `<span class="tl">${c.rank===16?'大':'小'}</span></div>`;
  }
  const sym=SUIT_SYM[c.suit];
  const rs=c.rank>10?{11:'J',12:'Q',13:'K',14:'A'}[c.rank]:String(c.rank);
  return `<div class="card s${c.suit} ${cls}" data-id="${c.id}">`+
    `<span class="tl">${rs}</span><span class="tr">${sym}</span>`+
    `<span class="bl">${sym}</span><span class="br">${rs}</span></div>`;
}
function miniName(c){
  if(c.suit==='X') return c.rank===16?T('bigJoker'):T('smallJoker');
  return SUIT_SYM[c.suit]+rankName(c.rank);
}
// 副花色按红黑相间排列(依主花色选择顺序)
const ALT_ORDER={S:['H','C','D'],H:['S','D','C'],C:['D','S','H'],D:['S','H','C'],
                 null:['S','H','C','D']};
function sortForDisplay(hand,trump){
  const alt=ALT_ORDER[trump&&trump.suit?trump.suit:null]||['S','H','C','D'];
  const suitOrd=s=>s==='T'?0:alt.indexOf(s)+1;
  return hand.slice().sort((a,b)=>{
    const sa=effSuit(a,trump),sb=effSuit(b,trump);
    if(sa!==sb) return suitOrd(sa)-suitOrd(sb);
    const oa=ordIdx(a,trump),ob=ordIdx(b,trump);
    if(oa!==ob) return ob-oa;
    // 同级的级数将牌(副常主;无主时各花色常主)ordIdx 相同 —— 再按花色归堆,免得散排
    return suitOrd(a.suit)-suitOrd(b.suit);
  });
}
function trumpLabel(t){ return t? (t.suit?`${SUIT_SYM[t.suit]} 打${rankName(t.rank)}`:`${T('noTrump')} 打${rankName(t.rank)}`) : '未定'; }
function log(t){ G.log.unshift({text:t}); }
function setMsg(t){ document.getElementById('msg').textContent=t||''; }
// #msg 被结算/设置浮层挡住时看不见,凡是"点了按钮必须看到反馈"的场合用这个
let toastTimer=null;
function showToast(t){
  const el=document.getElementById('toast');
  el.textContent=t;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>el.classList.remove('show'),2200);
}
function curTrumpForSort(){ return G.trump|| (G.decl&&G.decl.suit?{suit:G.decl.suit,rank:G.trumpRank}:{suit:null,rank:G.trumpRank}); }

// ================= 整场状态(跨局) =================
// played:每队已坐庄守住过的最高级数,必打关卡的「打过」判据(见 advanceMatch)
/* past:整场里已经打完的每一局的存档,给「跨局复盘」用。
 * 存的是当局结束那一刻的牌面(初始手牌 / 底牌 / 每墩出牌 / 事件流)和结算结果,
 * 都是已经不会再变的数组,直接持引用即可 —— 一整场十几局的量级,不必压缩。 */
let M={levels:[2,2], dealer:-1, round:0, played:[-1,-1], past:[]};
// null = 看当前这一局;数字 = 看 M.past 里的第几局
let logRound=null;
let scrambleNext=false;   // 下一次发牌是否按无庄盘(完全造反后)
let rotNext=0;            // 下一次发牌整桌转几个座位(种子局「交换队伍」,见 swapStart)
let redealCount=0;        // 本局已重新发牌次数
let autoCarry=false;      // 重新发牌(造反)时把托管带到新的一盘,否则开着托管的人一造反就被交还
// 无庄盘里各家按自己队伍的级数抢亮;庄定盘全桌用庄家级数
function rankOf(seat){ return G.dealerKnown?G.trumpRank:M.levels[seat%2]; }

// ================= 开局:(首盘切牌定先)→ 逐张发牌抢亮 =================
function newRound(){ startRound(seedBase++); }
// seed 单独作为参数(而不是内部固定 seedBase++)是为了让「重打本局」「用种子开局」
// 复用同一套发牌逻辑:前者传回 G.start,后者传解析出的种子码,见 startFromState / seedCode。
function startRound(seed){
  // 上一盘可能还有在途的定时器(AI 思考 / 收墩 / 亮主倒计时),不清掉会打到新一盘的局面上
  if(G){ clearTimeout(G.aiTimer); clearTimeout(G.holdTimer); clearTimeout(G.declTimer);
         clearInterval(G.declTick); }
  const carryAuto=autoCarry; autoCarry=false;
  const dealerKnown=M.dealer>=0 && !scrambleNext;   // 完全造反重发 → 本盘按无庄盘抢庄
  // 开局那一刻的整场状态,和 seed 一起才能完整复现这一局(见 seedCode / __redoRound)
  const start={seed, dealer:M.dealer, levels:M.levels.slice(), played:M.played.slice(),
               round:M.round, scramble:scrambleNext, rot:rotNext};
  scrambleNext=false; rotNext=0;
  const rot=start.rot;
  let first, cutsLog='';
  if(dealerKnown){
    first=M.dealer;                      // 庄定盘:庄家先拿牌
  }else{
    // 交换队伍:切牌结果跟着整桌转 rot 个座位 —— 先拿牌的人转过去,dealRound 发出来的
    // 每家手牌也就整体转过去了(第 i 张永远发给 first+i),原来谁拿什么牌,现在换成下一座拿
    const c=cutForFirst(seed); first=(c.first+rot)%4;
    const cut=s=>c.cuts[(s-rot+4)%4];
    cutsLog=`切牌定先:${[0,1,2,3].map(s=>`${SEAT_NAME[s].slice(0,1)}${miniName(cut(s))}`).join(' ')} → ${SEAT_NAME[first]} 先拿牌`;
  }
  const deal=dealRound(seed,first);
  // 无庄盘各家按自己级数抢亮,这里先按先拿牌者的级数起头,谁亮到就换成谁的(见 rankOf)
  const trumpRank=dealerKnown?M.levels[M.dealer%2]:M.levels[first%2];
  G={seed,start,firstTaker:first,trumpRank,dealerKnown,
     hands:deal.hands,kittyOrig:deal.kitty,buried:[],
     trump:null,declSeat:dealerKnown?M.dealer:-1,
     decl:null,rebelHappened:false,
     visCount:[0,0,0,0],dealt:0,
     leader:-1,trick:[],trickNo:0,tricks:[],defPoints:0,capturedCards:[],lastWinner:-1,
     lastLeadSize:1,phase:'dealing',selected:new Set(),log:[],awaitNext:false,
     aiTimer:null,holdTimer:null,declTimer:null,declTick:null,declDeadline:0,
     coachNotes:[],coachChat:[],hintCards:null,quiz:null,
     /* 托管挂在 G 上而不是 S 上 —— 它按局生效,不跟着设置一起存下来:
      * 新的一局必须从你自己的那一手开始,不能上次开着这次就替你打完。 */
     auto:carryAuto, autoTricks:0,
     undoStack:[]};   // 悔牌(见 undoLastPlay):你每出一手前的整桌快照,悔一次弹一个
  if(cutsLog) log(cutsLog);
  if(S.engineVer.some(Boolean))
    log('AI 引擎:'+[1,2,3,0].map(s=>`${SEAT_NAME[s]}${s===HUMAN?'(托管)':''} ${engName(s)||'最新版'}`).join('、'));
  if(dealerKnown) log(`第${M.round+1}局:${SEAT_NAME[M.dealer]} 坐庄,打${rankName(trumpRank)}(${T('counter')}只改主色,不易庄不拿底)`);
  render(); setMsg('发牌中…可随时'+T('declare')+'/'+T('counter'));
  dealTick();
}

function visHand(s){ return G.hands[s].slice(0,G.visCount[s]); }

// 发完牌后的亮主窗口:牌桌中心走秒,让人知道还剩多久,而不是干等
function startDeclCountdown(){
  const total=secs(S.declWait,S_DEFAULT.declWait);
  G.declDeadline=Date.now()+total;
  const paint=()=>{
    if(!G||G.phase!=='finalDecl') return;
    const left=Math.max(0,Math.ceil((G.declDeadline-Date.now())/1000));
    setMsg(`发牌完毕 —— 还有 ${left} 秒${T('declare')}/${T('counter')},点「不${T('declareV')}」可立即开始`);
  };
  paint();
  clearInterval(G.declTick);
  G.declTick=total>0?setInterval(paint,250):null;
  clearTimeout(G.declTimer);
  // 存下句柄:玩家点「不亮」时要能取消这个定时器提前结算
  G.declTimer=setTimeout(settleTrump,total);
}
function stopDeclCountdown(){ clearInterval(G.declTick); G.declTick=null; }

function dealTick(){
  if(G.phase!=='dealing') return;
  if(G.dealt>=100){ G.phase='finalDecl'; render();
    startDeclCountdown();
    if(G.auto) window.__skipDecl();      // 托管:AI 已在发牌中决定过了,不必再等倒计时
    return; }
  const seat=(G.firstTaker+G.dealt)%4;
  G.visCount[seat]++; G.dealt++;
  if(seat!==HUMAN||G.auto) aiDeclThink(seat);   // 托管:你这一家的抢亮/加固也交给 AI
  if(G.dealt%4===0||G.dealt>=100) render();
  setTimeout(dealTick,120);   // 100张 × 120ms ≈ 12秒发完
}

// AI 抢亮决策(基于已见手牌)—— 打分与门槛在 AI 层的 aiDeclDecide,这里只负责取上下文与执行
function aiDeclThink(seat){
  const vis=visHand(seat);
  const rand=rng(G.seed*13+G.dealt);
  const ctx={
    vis, seat, trumpRank:rankOf(seat), curDecl:G.decl,
    dealerKnown:G.dealerKnown, dealer:M.dealer, firstTaker:G.firstTaker,
    gates:S.gatesOn?S.gates:[], levels:M.levels,
  };
  // 加固:当初亮单张是「信心不足先试一手」,现在牌拿多了信心是否已经够把它锁死?
  // 用同一把尺子比较「亮对」与「维持单张」的分差,而不是一律加固。
  if(canReinforce2(G.decl,seat,vis,rankOf(seat),G.rebelHappened)){
    const asPair=eng(seat).scoreDeclOption(ctx,{suit:G.decl.suit,strength:2}).score;
    const asSingle=eng(seat).scoreDeclOption(ctx,{suit:G.decl.suit,strength:1,hasPair:true}).score;
    if(asPair>asSingle&&rand()<0.9){
      applyDecl(seat,{suit:G.decl.suit,strength:2},true); return;
    }
  }
  const d=eng(seat).aiDeclDecide(ctx);
  if(!d) return;
  // 分数越过门槛越多,越果断;贴着门槛则留一点随机,避免四家行为整齐划一
  const margin=d.score-d.threshold;
  if(margin<0) return;
  if(rand()<Math.min(0.95,0.45+margin/40)) applyDecl(seat,d.opt,false);
}

function applyDecl(seat,opt,isReinforce){
  if(!G.dealerKnown) G.trumpRank=rankOf(seat);   // 无庄盘:主牌级数跟着亮主者走
  G.decl={seat,suit:opt.suit,strength:opt.strength};
  // 亮出的级数牌/王对立即在桌上可见
  const vis=visHand(seat);
  G.declCards={seat, cards: opt.suit
    ? vis.filter(c=>c.suit===opt.suit&&c.rank===G.trumpRank).slice(0,opt.strength)
    : vis.filter(c=>c.rank===(opt.strength===4?16:15)).slice(0,2)};
  if(opt.strength>=3) G.rebelHappened=true;
  if(isReinforce) log(`${SEAT_NAME[seat]} ${T('reinforce')}:${SUIT_SYM[opt.suit]} 单张→一对`);
  else if(opt.suit===null) log(`${SEAT_NAME[seat]} ${opt.strength===4?T('bigJoker'):T('smallJoker')}对${T('counter')} → ${T('noTrump')}`);
  else log(`${SEAT_NAME[seat]} ${T('declare')} ${SUIT_SYM[opt.suit]}${opt.strength===2?'(一对)':''}`);
  render();
}

// 发牌结束:定主(庄定盘庄家不变;无庄盘最终亮主者坐庄拿底)
// 「不亮」:放弃剩余等待时间,立刻定主
window.__skipDecl=()=>{
  if(!G||G.phase!=='finalDecl') return;
  clearTimeout(G.declTimer); G.declTimer=null;
  settleTrump();
};

function settleTrump(){
  if(G.phase!=='finalDecl'&&G.phase!=='dealing') return;   // 防「不亮」和到点结算重复触发
  clearTimeout(G.declTimer); G.declTimer=null;
  stopDeclCountdown();
  G.trump={suit:G.decl?G.decl.suit:null,rank:G.trumpRank};
  G.declSeat=dealerAfterDecl({dealerKnown:G.dealerKnown, dealer:M.dealer,
                              declSeat:G.decl?G.decl.seat:-1, firstTaker:G.firstTaker});
  if(G.dealerKnown){
    log(G.decl?`定${T('trump')}:${trumpLabel(G.trump)}(庄家仍是 ${SEAT_NAME[G.declSeat]})`
              :`无人${T('declare')} → ${T('noTrump')},庄家仍是 ${SEAT_NAME[G.declSeat]}`);
  }else{
    log(G.decl?`定${T('trump')}:${trumpLabel(G.trump)},${SEAT_NAME[G.declSeat]} 坐庄`
              :`无人${T('declare')} → ${T('noTrump')},${SEAT_NAME[G.declSeat]} 坐庄`);
  }
  lowRebelPhase();
}

// 低分/少主:按设置决定是关闭、仅重新发牌,还是完全造反(重发 + 双方抢庄)
const rebelName=()=>S.fullRebel==='redeal'?'重新发牌':`完全${T('counter')}(重新发牌,双方抢庄)`;
function lowRebelPhase(){
  if(S.fullRebel==='off'){ afterTrumpSet(); return; }
  if(G.auto){ aiLowRebel(); return; }     // 托管:你这一家也按 AI 的口径决定造不造反
  const my=canFullRebel(G.hands[HUMAN],G.trump);
  if(my.ok){
    G.phase='lowrebel'; render();
    const why=[my.byPts?`仅 ${my.pts} 分(≤${RULES.pointRebelThreshold})`:'',
               my.byTrump?`${T('trump')}仅 ${my.nT} 张(≤${RULES.trumpRebelThreshold})`:'']
              .filter(Boolean).join('、');
    setMsg(`你手牌${why},可${rebelName()}`);
    return;
  }
  aiLowRebel();
}
function humanLowRebel(yes){
  if(yes){ log(`你手牌太弱,${rebelName()}`); doRebel(); }
  else aiLowRebel();
}
function aiLowRebel(){
  const rand=rng(G.seed*17+5);
  for(const s of (G.auto?[1,2,3,HUMAN]:[1,2,3])){      // 托管时你排在最后,不改变三家 AI 原有的先后
    const r=canFullRebel(G.hands[s],G.trump);
    if(r.ok && s%2!==G.declSeat%2 && rand()<0.7){
      log(`${SEAT_NAME[s]} ${r.byPts?'手牌分数不足':T('trump')+'太少'},${rebelName()}`);
      doRebel(); return;
    }
  }
  afterTrumpSet();
}
// 两种模式都重新发牌;完全造反模式下新的一盘按无庄盘处理(各家按自己级数抢庄拿底)
function doRebel(){
  if(redealCount>=RULES.maxRedeal){       // 连续重发太多次就直接开打,免得卡死
    log(`已重新发牌 ${redealCount} 次,本局直接开打`);
    afterTrumpSet(); return;
  }
  redealCount++;
  scrambleNext=(S.fullRebel==='scramble');
  autoCarry=!!G.auto;
  G.phase='redealing'; render();
  setMsg('重新发牌…');
  setTimeout(newRound,1200);
}

function afterTrumpSet(){
  G.leader=G.declSeat;
  G.hands[G.declSeat].push(...G.kittyOrig);
  if(G.declSeat===HUMAN&&!G.auto){
    G.phase='kitty'; G.selected.clear();
    setMsg(`你是庄家:选 ${RULES.kittySize} 张牌${T('bury')}`); render();
  }else{
    G.buried=eng(G.declSeat).aiDiscard(G.hands[G.declSeat],G.trump);
    G.buried.forEach(c=>removeCard(G.hands[G.declSeat],c));
    G.phase='play'; snapshotHands(); render();
    setMsg(`${SEAT_NAME[G.declSeat]} 是庄家`);
    setTimeout(step,900);
  }
}

function buryKitty(){
  if(G.selected.size!==RULES.kittySize){ setMsg(`需要恰好 ${RULES.kittySize} 张,当前 ${G.selected.size} 张`); return; }
  G.buried=G.hands[HUMAN].filter(c=>G.selected.has(c.id));
  G.hands[HUMAN]=G.hands[HUMAN].filter(c=>!G.selected.has(c.id));
  G.selected.clear(); G.phase='play'; snapshotHands();
  log(`你已${T('bury')}`); render();   // render() 会把"本墩:你 领出,等待出牌…"写进牌桌中心,不用再单独提示
  step();
}

// 开打瞬间存一份四家手牌,供局末复盘回看(局中不给看,免得成了透视)
function snapshotHands(){ G.initialHands=G.hands.map(h=>h.slice()); }

// ================= 出牌循环 =================
// step() 可能被重复调用(典型:收墩后排的 setTimeout(step,400) 还没跑,玩家已抢先出牌
// 又走了一次 playCards→step)。若不加约束,同一个座位会被排两次 AI 出牌 —— 那一手就重复出,
// 表现为座位顺序错乱、一墩挤进 5 张、四家手牌张数不等。
// 两道保险:① 排新的 AI 之前先撤掉上一个待执行的;② 回调真正执行时复核局面没被推进过。
function step(){
  /* `endRound` 只置 G.ended,不改 G.phase(结算弹层期间 phase 仍是 play)——
   * 所以光看 phase 挡不住「局已结束还被排上一手」:那时四家手牌全空,
   * aiChooseLead 会在空手牌上取 cards[0] 而炸掉。以前没人撞到,是因为局末最后一手
   * 一定是人点出来的、点完就没有下一次排程了;托管/自动出把那一手也接管之后,
   * 收尾阶段第一次有了「结算之后还有定时器在飞」的可能。 */
  if(G.phase!=='play'||G.ended) return;
  if(G.hands.every(h=>!h.length)) return;
  if(G.trick.length===4){ finishTrick(); return; }
  const seat=(G.leader+G.trick.length)%4;
  clearTimeout(G.aiTimer); G.aiTimer=null;
  // 轮到谁由 render() 里的本墩领出信息 + 名字高亮体现,不再单独提示
  if(seat===HUMAN){ render(); scheduleHumanAuto(); return; }
  render();
  const trickNoAtSchedule=G.trickNo, posAtSchedule=G.trick.length;
  G.aiTimer=setTimeout(()=>{
    G.aiTimer=null;
    // 过期校验:排这一手之后局面若已被推进(换墩/别人先出了/已满),这次回调作废
    if(G.phase!=='play'||G.trickNo!==trickNoAtSchedule||G.trick.length!==posAtSchedule) return;
    if((G.leader+G.trick.length)%4!==seat) return;
    const view=viewFor(seat);
    let cards, reason='';
    if(G.trick.length===0){
      const ch=eng(seat).aiChooseLead(view);
      cards=ch.cards; reason=ch.reason;
      const chk=checkThrow(G.hands,seat,cards,G.trump);
      if(!chk.ok) cards=chk.forced;
    }else{
      const lead=classify(G.trick[0].cards,G.trump);
      const ch=eng(seat).aiChooseFollow(view,G.trick);
      cards=ch.cards; reason=ch.reason;
      if(!isLegalFollow(G.hands[seat],lead,cards,G.trump))
        cards=genFollow(G.hands[seat],lead,G.trump,rng(G.seed+G.trickNo));
    }
    G.lastReasons=G.lastReasons||{}; G.lastReasons[seat]=reason;  // 教练模式(M5)复用
    playCards(seat,cards);
  },aiThinkMs());
}

/* 「这一手你没得选」:手上剩的牌恰好等于本墩要出的张数 —— 领出时是最后一张,
 * 跟牌时是最后一手,全出是唯一的合法选择。需求表里的「最后一墩自动出」说的就是它:
 * 没有选择余地,还要点一次。
 * 兜底:理论上全出必然合法(牌都在这儿了),真判成不合法就交还给人,别自作主张。 */
function forcedHand(){
  const hand=G.hands[HUMAN];
  if(!hand.length) return null;
  if(G.trick.length===0) return hand.length===1?hand.slice():null;
  const lead=classify(G.trick[0].cards,G.trump);
  if(!lead||hand.length!==lead.cards.length) return null;
  return isLegalFollow(hand,lead,hand,G.trump)?hand.slice():null;
}

/* 托管 / 最后一手自动出 —— 轮到你、但这一手不需要你做决定时,替你出掉。
 *
 * 两件事共用一条排程,因为它们的风险是同一个:排下去之后局面可能已经被推进
 * (你抢先点了出牌、上一墩收掉了),回调必须复核。校验与 step() 里排 AI 那一手同一套。
 * 教练:托管的墩**不写 coachNotes** —— 那不是你的选择,记进失误统计等于把 AI 的账
 * 算到你头上(局末复盘那句话也会跟着改口,见 endRound)。所以这里走的是 playCards,
 * 不是 humanPlay:后者才是「你自己出的牌」那条路,失误反馈只挂在那上面。 */
function scheduleHumanAuto(){
  if(!G||G.phase!=='play'||G.ended||G.trick.length>=4) return;
  if((G.leader+G.trick.length)%4!==HUMAN) return;
  const forced=S.autoLast?forcedHand():null;
  if(!G.auto&&!forced) return;
  clearTimeout(G.aiTimer);
  const trickNoAtSchedule=G.trickNo, posAtSchedule=G.trick.length;
  G.aiTimer=setTimeout(()=>{
    G.aiTimer=null;
    if(G.phase!=='play'||G.ended) return;
    if(G.trickNo!==trickNoAtSchedule||G.trick.length!==posAtSchedule) return;
    if((G.leader+G.trick.length)%4!==HUMAN) return;
    if(!G.auto&&!(S.autoLast&&forced)) return;        // 中途被关掉了
    let cards=forced;      // 没得选的那一手直接出,不必再劳烦 AI 算一遍
    if(!cards){
      const view=viewFor(HUMAN);
      if(G.trick.length===0){
        const ch=eng(HUMAN).aiChooseLead(view); cards=ch.cards;
        const chk=checkThrow(G.hands,HUMAN,cards,G.trump);
        if(!chk.ok) cards=chk.forced;
      }else{
        const lead=classify(G.trick[0].cards,G.trump);
        const ch=eng(HUMAN).aiChooseFollow(view,G.trick); cards=ch.cards;
        if(!isLegalFollow(G.hands[HUMAN],lead,cards,G.trump))
          cards=genFollow(G.hands[HUMAN],lead,G.trump,rng(G.seed+G.trickNo));
      }
      G.autoTricks++;                       // 只数「AI 真替你做了选择」的那几墩
    }
    G.selected.clear(); G.hintCards=null;
    playCards(HUMAN,cards);
  }, forced?FORCED_MS:aiThinkMs());
}

/* 托管开关。它不在 S 里(不持久化),也只在出牌阶段有意义 ——
 * 扣底、亮主、低分造反这些「一局只做一次」的决定仍然归你。 */
window.__G=()=>G;      // html 里的 inline onclick 在 IIFE 外面,取不到 G
window.__setAuto=on=>{
  if(!G) return;
  G.auto=!!on;
  if(G.auto){ G.selected.clear(); G.hintCards=null; log('托管开始 —— AI 替你出牌'); }
  else if(G.autoTricks||G.phase==='play') log('托管结束');
  render();
  if(G.auto){
    // 托管从哪个阶段打开,就从那个阶段起接手:每个阶段的收尾都是「等你点一下」,得替你点
    if(G.phase==='finalDecl') window.__skipDecl();
    else if(G.phase==='lowrebel') aiLowRebel();
    else if(G.phase==='kitty'){
      G.selected=new Set(eng(HUMAN).aiDiscard(G.hands[HUMAN],G.trump).map(c=>c.id));
      buryKitty();
    }else step();             // 出牌阶段可能正轮到你:立刻把这一手排上
  }
  else scheduleHumanAuto();   // 关掉托管后,「没得选」那条仍然生效
};

function humanPlay(){
  // 不能只靠按钮 disabled 把关 —— 渲染有时差,漏一手就会插到别人的顺位里
  if(G.phase!=='play'||G.trick.length>=4||(G.leader+G.trick.length)%4!==HUMAN) return;
  const sel=G.hands[HUMAN].filter(c=>G.selected.has(c.id));
  if(!sel.length){ setMsg('请先选牌'); return; }
  if(G.trick.length===0){
    const cl=classify(sel,G.trump);
    if(!cl){ setMsg(T('lead')+`必须是同一门(${T('trump')}算一门)`); return; }
    if(cl.type==='throw'){
      // 「这明明是拖拉机,为什么算甩牌」—— 报障过一次(6677),但引擎侧全牌型扫描没能复现。
      // 把判成甩牌的**拆解结果**打进出牌记录,下次再遇到就能直接看出是哪一组没接上。
      const TN={single:'单张',pair:'对子',tractor:'拖拉机'};
      log(`判定为${T('throwP')}:拆成 ${cl.comps.length} 组 —— `+
          cl.comps.map(x=>`${TN[x.type]||x.type}(${x.cards.map(c=>miniName(c)).join('')})`).join(' + ')+
          `。拖拉机要求两组在**当前牌序**里紧邻(级牌已从牌序里抽走,主门里正副级牌与大小王另算一档)`);
      const chk=checkThrow(G.hands,HUMAN,sel,G.trump);
      if(!chk.ok){
        log(`${T('throwP')}失败!被迫只出最小的一组(不罚分)`);
        setMsg(T('throwP')+'失败,只出最小的一组');
        G.selected.clear(); recordUndoPoint(); playCards(HUMAN,chk.forced); return;
      }
      log(T('throwP')+'成功');
    }
  }else{
    const lead=classify(G.trick[0].cards,G.trump);
    if(!isLegalFollow(G.hands[HUMAN],lead,sel,G.trump)){
      setMsg(`不合法:需出 ${lead.cards.length} 张;有本门必须跟,门内有对必对`);
      return;
    }
  }
  // ---- 教练:失误反馈(同一评分标尺对比) ----
  if(C.on && GAP_THR[C.gapSens]<Infinity && G.phase==='play'){
    const view=viewFor(HUMAN);
    let best,hs;
    const isLead=G.trick.length===0;
    if(isLead){ best=aiChooseLead(view); hs=coachScoreLead(view,sel); }
    else{ best=aiChooseFollow(view,G.trick); hs=coachScoreFollow(view,G.trick,sel); }
    const sameCards=best.cards.length===sel.length&&
      best.cards.every(c=>sel.some(x=>x.id===c.id));
    const gap=sameCards?0:(best.score-hs)/(isLead?LEAD_GAP_SCALE:1);
    if(gap>GAP_THR[C.gapSens]){
      const no=G.tricks.length+1;
      G.coachNotes.push({no,my:sel.slice(),best:best.cards.slice(),gap,reason:best.reason});
      if(C.strict && gap>GAP_THR[C.gapSens]*1.6 &&
         !confirm(`教练:更好的是 ${desc(best.cards)} —— ${best.reason}\n仍要出这手吗?`)) return;
      sndOops();
      // 不再弹到牌桌中心,记进教练页签的对话历史(见 renderCoachTab)
      G.coachChat.push({no,html:`⚠️ 你出 ${desc(sel)},更好的是 <b>${desc(best.cards)}</b> — ${best.reason}`});
      log(`教练(第${no}墩):你出 ${desc(sel)},建议 ${desc(best.cards)} — ${best.reason}`);
    }
  }
  G.selected.clear(); G.hintCards=null;
  recordUndoPoint();
  playCards(HUMAN,sel);
}

/* 悔牌(设置里开关默认关):与教练撤回(严格模式的出牌前确认)完全独立、不依赖它。
 * v0.7.24 只存了「trick 长度」,下一家一跟就对不上、按钮变灰 —— 实际上你打开设置时
 * AI 早就跟完了,所以等于永远悔不了。改成你每出一手之前给整桌拍一张快照(G 本身,
 * 不含定时器与快照栈),悔牌 = 丢掉之后发生的一切(包括 AI 跟的牌、收的墩)、回到快照。
 * 快照入栈,可以连续悔好几手;一局结束(G.ended)之后不能再悔。 */
function recordUndoPoint(){
  const {undoStack,aiTimer,holdTimer,declTimer,declTick,...rest}=G;
  undoStack.push(structuredClone(rest));
}
function undoLastPlay(){
  if(!G||G.phase!=='play'||G.ended||!G.undoStack.length) return false;
  clearTimeout(G.aiTimer); clearTimeout(G.holdTimer);
  const stack=G.undoStack, snap=stack.pop();
  G=Object.assign(snap,{undoStack:stack,aiTimer:null,holdTimer:null,declTimer:null,declTick:null});
  G.selected=new Set(); G.hintCards=null; G.quiz=null; G.awaitNext=false;
  render(); setMsg('已悔回上一手出牌前,重新选牌');
  return true;
}

// ---- 教练:问教练(四步框架 + 关键墩提问引导) ----
function askCoach(){
  if(!C.on||G.phase!=='play') return;
  if((G.leader+G.trick.length)%4!==HUMAN||G.trick.length>=4) return;
  const view=viewFor(HUMAN);
  const following=G.trick.length>0;
  const adv=following?aiChooseFollow(view,G.trick):aiChooseLead(view);
  const mem=makeMemory(view);
  const t=G.trump;
  // 提问引导:台面有分或跟主时,先考记牌再揭晓
  const ptsTable=following?countPoints(G.trick.flatMap(p=>p.cards)):0;
  const isKey=following&&(ptsTable>=10||classify(G.trick[0].cards,t).suit==='T');
  const buildAdvice=()=>{
    const lines=[];
    if(following){
      const lead=classify(G.trick[0].cards,t);
      const sn=lead.suit==='T'?T('trump'):SUIT_NAME[lead.suit];
      lines.push(`<span class="coachStep">① 义务</span> 跟 ${lead.cards.length} 张;有${sn}必须跟,门内有对必对`);
      lines.push(`<span class="coachStep">② 候选</span> `+adv.cands.map(c=>`${desc(c.cards)}(${c.reason},${c.score.toFixed(0)}分)`).join(' / '));
      const ctx=adv.ctx;
      const mx=maxUnseenIdx(mem,lead.suit,t);
      lines.push(`<span class="coachStep">③ 确定性</span> ${ctx.partnerWinning?(ctx.curBoss?'队友稳赢——在外已无更大':'队友只是暂大,后手还有对手'):'对手暂大'};${sn}在外最大约位次 ${mx<0?'(已出尽)':mx}`);
      lines.push(`<span class="coachStep">④ 价值</span> 台面 ${ctx.ptsTable} 分${ctx.isLast?';你是最后一手,结果确定':''}`);
    }else{
      lines.push(`<span class="coachStep">① 义务</span> 你${T('lead')},可任选一门`);
      lines.push(`<span class="coachStep">② 候选</span> `+adv.cands.map(c=>`${desc(c.cards)}(${c.reason},${c.score.toFixed(0)}分)`).join(' / '));
      lines.push(`<span class="coachStep">③④</span> 优先钢板收墩、避免白送分、大主牌留后手`);
    }
    lines.push(`<b style="color:#6ec9ff">建议:${desc(adv.cards)}</b> —— ${adv.reason}`);
    return lines.map(l=>`<div>${l}</div>`).join('');
  };
  const no=G.tricks.length+1;
  if(C.quiz&&isKey){
    const lead=classify(G.trick[0].cards,t);
    const myBest=Math.max(-1,...G.hands[HUMAN].filter(c=>effSuit(c,t)===lead.suit).map(c=>ordIdx(c,t)));
    let n=0;
    for(const k in mem.unseen){ if(mem.unseen[k]<=0) continue;
      const c=(k=>{const i=k.indexOf(':');return{suit:k.slice(0,i),rank:+k.slice(i+1)};})(k);
      if(effSuit(c,t)===lead.suit&&ordIdx(c,t)>myBest) n+=mem.unseen[k]; }
    G.quiz={no,answer:Math.min(n,3), advice:buildAdvice(),
      q:`先考你:这一门里,在外还有几张比你手中最大的更大?`};
  }else{
    G.quiz=null;
    // 直接记进对话历史(教练页签),不留"当前建议"这个单独状态,历史列表本身就显示最新一条
    G.coachChat.push({no,html:buildAdvice()});
  }
  G.hintCards=new Set(adv.cards.map(c=>c.id));
  activeTab='coach';
  render();
}

function playCards(seat,cards){
  cards.forEach(c=>removeCard(G.hands[seat],c));
  G.trick.push({seat,cards});
  sndPlay();
  render();
  if(G.trick.length===4) holdTrick();
  else step();
}

// 一墩四家出完:牌留在桌上给人看清楚,到点(或玩家点「下一墩」)再收墩
function holdTrick(){
  // 托管时忽略「手动点下一墩」:每墩都要点一下的话,托管就没有意义了
  if(S.manualNext&&!G.auto){
    G.awaitNext=true; render();
    setMsg('本墩出完 —— 点「下一墩」继续');
    return;
  }
  clearTimeout(G.holdTimer);
  G.holdTimer=setTimeout(finishTrick,
    G.auto?AUTO_HOLD_MS:secs(S.trickHold,S_DEFAULT.trickHold));
}
window.__nextTrick=()=>{ if(G&&G.awaitNext){ G.awaitNext=false; finishTrick(); } };

function finishTrick(){
  if(G.phase!=='play'||G.trick.length!==4) return;   // 防重复收墩/在空墩上再收一次
  clearTimeout(G.holdTimer); G.holdTimer=null;
  G.awaitNext=false;
  const res=resolveTrick(G.trick,G.trump);
  const declTeam=G.declSeat%2;
  const gotPts=res.winner%2!==declTeam;
  if(gotPts){
    G.defPoints+=res.points;
    G.capturedCards.push(...G.trick.flatMap(p=>p.cards).filter(c=>cardPoints(c)>0));
  }
  G.tricks.push({no:G.tricks.length+1,plays:G.trick.slice(),winner:res.winner,points:res.points,gotPts});
  log(`第${G.tricks.length}墩:${SEAT_NAME[res.winner]} 赢${res.points?`,${gotPts?T('defenders')+'得':T('declarers')+'保住'} ${res.points} 分`:',无分'}`);
  G.lastLeadSize=G.trick[0].cards.length;
  G.leader=res.winner; G.lastWinner=res.winner; G.trick=[]; G.trickNo++;
  G.hintCards=null; G.quiz=null;   // 教练提示随墩清空(记牌表重新蒙上)
  (res.winner%2===HUMAN%2?sndWin:sndLose)();
  const nEl=document.getElementById('n'+res.winner);
  if(nEl){ nEl.classList.add('won'); setTimeout(()=>nEl.classList.remove('won'),1900); }
  if(G.hands.every(h=>h.length===0)) endRound();
  else { render(); setMsg(''); setTimeout(step,400); }
}

function endRound(){
  redealCount=0;                 // 本局真正打完了,重发计数归零
  G.auto=false;                  // 托管按局生效:这一局打完就交还,下一局从你自己的手开始
  const declTeam=G.declSeat%2;
  const defWonLast=G.lastWinner%2!==declTeam;
  const sc=scoreRound({defPoints:G.defPoints,kitty:G.buried,defWonLastTrick:defWonLast,
                       lastLeadSize:G.lastLeadSize});
  // 整场推进要先算 —— 弹窗里的「升 N 级」必须是**实际生效**的那个数,
  // 否则会出现「上台升1级」和下一行「必打关卡,本次不升级」自相矛盾。
  // played 一直记着(即使关卡开关是关的),中途打开设置才不会丢掉前面的战绩;
  // 关着的时候 gates 传 null,判定本身自然不生效
  const before=M.levels.slice();
  const adv=advanceMatch(M.levels,G.declSeat,sc,S.gatesOn?S.gates:null,M.played);
  const upTeam=sc.defendersWin?1-declTeam:declTeam;
  const realUp=adv.levels[upTeam]-before[upTeam];      // 关卡拦下后可能小于 sc 里的名义级数
  const humanDecl=declTeam===HUMAN%2;
  const humanWon=sc.defendersWin!==humanDecl;
  let html=`<div style="font-size:22px;color:var(--gold)">${humanWon?'你们赢了!':'你们输了'}</div>`;
  html+=`<div>${T('defenders')}共得 <b>${sc.total}</b> 分`;
  if(defWonLast&&sc.kittyPts) html+=`(含${T('bury')}翻出 ${sc.kittyPts}×${sc.mult})`;
  html+=`</div>`;
  if(sc.total===0) html+=`<div style="color:var(--gold)">${T('guangtou')}!</div>`;   // 闲家0分
  html+=sc.defendersWin
    ? `<div>${T('defenders')}上台${realUp?`,${T('levelUp')} ${realUp} 级${realUp>1?`(${T('tiaoji')}!)`:''}`:''}</div>`
    : `<div>庄家方守住${realUp?`,${T('levelUp')} ${realUp} 级${realUp>1?`(${T('tiaoji')}!)`:''}`:''}</div>`;
  if(G.buried.length)
    html+=`<div style="margin-top:8px;font-size:13px">底牌:${G.buried.map(c=>miniName(c)).join(' ')}</div>`;
  // 教练:局后复盘关键回合(按分差取前3)
  /* 托管的墩不进失误统计(它们不是你的选择),所以这里也要**改口** ——
   * 否则替你打了十墩之后还夸你「没有明显失误」,这句表扬就不作数了。 */
  const autoNote=G.autoTricks?`(本局有 ${G.autoTricks} 墩是托管的,不计入失误统计)`:'';
  if(C.on&&C.review&&G.coachNotes.length){
    const top=G.coachNotes.slice().sort((a,b)=>b.gap-a.gap).slice(0,3);
    html+=`<div style="margin-top:10px;text-align:left;font-size:14px;background:rgba(110,201,255,.1);border-radius:8px;padding:8px 12px">`+
      `<b style="color:#6ec9ff">🎓 关键回合复盘</b>`+
      top.map(n=>`<div>第${n.no}墩:你出 ${desc(n.my)} → 教练建议 ${desc(n.best)}(${n.reason})</div>`).join('')+
      (autoNote?`<div style="opacity:.8">${autoNote}</div>`:'')+
      `</div>`;
  }else if(C.on&&C.review){
    html+=`<div style="margin-top:8px;font-size:14px;color:#6ec9ff">🎓 教练:`+
      (G.autoTricks?`本局你自己出的那几墩没有明显失误 ${autoNote}`:'本局没有明显失误,漂亮!')+`</div>`;
  }
  // 存档这一局,供跨局复盘(要在 M.round++ 之前拿局号,也要在 M.levels 被改写之前拿 before)
  M.past.push({no:M.round+1, trump:G.trump, declSeat:G.declSeat,
               defPoints:sc.total, defendersWin:sc.defendersWin,
               kittyPts:sc.kittyPts, mult:sc.mult,
               levelsBefore:before, levelsAfter:adv.levels.slice(),
               initialHands:G.initialHands, buried:G.buried.slice(),
               tricks:G.tricks, log:G.log});
  // 整场推进(adv 在上面已经算好)
  M.levels=adv.levels; M.dealer=adv.dealer; M.round++;
  if(adv.played) M.played=adv.played;
  G.ended={matchOver:adv.matchOver};
  if(adv.gateStopped!=null)
    html+=`<div style="margin-top:8px;font-size:15px;color:var(--gold)">`+
          `⛔ ${rankName(adv.gateStopped)} 必打,不可跳级 —— 本次升级停在 ${rankName(adv.gateStopped)}</div>`;
  if(adv.gateHeld!=null){

          `⛔ ${rankName(adv.gateHeld)} 必打 —— ${who}还没坐庄守住过 ${rankName(adv.gateHeld)},`+
          `本次不升级,下一局由${who}坐庄打 ${rankName(adv.gateHeld)}</div>`;
  }
  if(adv.matchOver){
    const weWon=adv.winnerTeam===0;
    html+=`<div style="margin-top:10px;font-size:20px;color:var(--gold)">${weWon?'你们打过 A,整场胜利!':'对方打过 A,整场告负'}</div>`;
    html+=`<div style="margin-top:14px"><button onclick="window.__newMatch()">重开整场</button> <button class="minor" onclick="window.__review()">复盘本局</button> <button class="minor" onclick="window.__copyRecord()">复制牌谱</button></div>`;
  }else{
    html+=`<div style="margin-top:6px;font-size:14px">级数 —— 你们:打${rankName(Math.min(M.levels[0],14))} / 对方:打${rankName(Math.min(M.levels[1],14))}</div>`;
    html+=`<div style="font-size:14px">下一局 ${SEAT_NAME[M.dealer]} 坐庄,打${rankName(M.levels[M.dealer%2])}</div>`;
    html+=`<div style="margin-top:14px"><button onclick="window.__next()">下一局</button> <button class="minor" onclick="window.__review()">复盘本局</button> <button class="minor" onclick="window.__copyRecord()">复制牌谱</button></div>`;
  }
  // 弹层之下的牌桌也要跟着进「已结束」态(托管按钮收起、发牌区改成「复盘中」),
  // 否则点「复盘本局」把弹层关掉之前,底下还留着上一秒的按钮
  render();
  document.getElementById('overlayContent').innerHTML=html;
  document.getElementById('overlay').style.display='flex';
  sndEnd();
}

/* 种子码:发牌种子 + 开局那一刻的整场状态。光有发牌种子不够——谁先拿牌取决于庄家,
 * 打几取决于级数,局数/关卡记录影响后面的升级,所以要一起带上才能在任何时候(包括
 * 打完几局之后、在别人手机上)还原出完全一样的这一局。格式举例:
 *   29857-D2-L3.5-R4        庄家=座位2,我方打3、对方打5,第5局(R 从 0 数)
 *   29857-L2.2-R0-X         X = 无庄盘(首局切牌定先 / 完全造反后抢庄)
 *   …-P5.-1                 关卡记录(必打关卡守住过的级,-1=没有),全是 -1 时省略
 *   …-T1                    交换队伍(整桌转了一座,见 swapStart);只有无庄盘的切牌要用到它,
 *                           庄定盘的庄家/级数在码里本身就已经是换过之后的
 * 必须是完整的码:光一个数字说不清庄家和级数,发出来的不是同一局,所以不收。 */
function seedCode(st){
  let c=`${st.seed}`;
  if(st.dealer>=0) c+=`-D${st.dealer}`;
  c+=`-L${st.levels[0]}.${st.levels[1]}-R${st.round}`;
  if(st.dealer<0||st.scramble) c+='-X';
  if(st.played.some(v=>v!==-1)) c+=`-P${st.played[0]}.${st.played[1]}`;
  if(st.rot) c+=`-T${st.rot}`;
  return c;
}
function parseSeedCode(txt){
  const t=String(txt||'').trim().toUpperCase().replace(/\s+/g,'');
  const m=t.match(/^(\d+)((?:-[A-Z][-\d.]*?)*)$/);
  if(!m) return null;
  const st={seed:+m[1]};
  if(!m[2]) return null;                     // 纯数字:缺庄家/级数,不收
  const parts=m[2].split(/-(?=[A-Z])/).filter(Boolean);
  let scr=false;
  for(const p of parts){
    const k=p[0], v=p.slice(1);
    if(k==='D'){ const d=+v; if(!(d>=0&&d<=3)) return null; st.dealer=d; }
    else if(k==='L'){ const l=v.split('.').map(Number);
      if(l.length!==2||l.some(x=>!(x>=2&&x<=14))) return null; st.levels=l; }
    else if(k==='R'){ const r=+v; if(!(r>=0)) return null; st.round=r; }
    else if(k==='P'){ const q=v.split('.').map(Number);
      if(q.length!==2||q.some(x=>!Number.isInteger(x))) return null; st.played=q; }
    else if(k==='X') scr=true;
    else if(k==='T'){ const r=+v; if(![0,1,2,3].includes(r)) return null; st.rot=r; }
    else return null;
  }
  if(!st.levels) return null;
  if(st.dealer==null&&!scr) return null;     // 既没庄家又没标无庄,说不清是哪种开局
  st.dealer=st.dealer==null?-1:st.dealer;
  st.scramble=scr&&st.dealer>=0;
  st.round=st.round||0; st.played=st.played||[-1,-1]; st.rot=st.rot||0;
  return st;
}
/* 交换队伍:同一局牌,两队角色互换 —— 整桌每人往下家挪一座(再换一次挪回来,
 * 不会挪两座变成跟队友换牌)。原来 A 队拿的牌、坐的庄、打的级数、关卡记录,
 * 全部换给 B 队;先拿牌的人、发牌顺序跟着转,所以每一张牌落在同一个「角色」手里。 */
function swapStart(st){
  const d=st.rot===1?-1:1;
  return {...st, dealer:st.dealer>=0?(st.dealer+d+4)%4:-1,
          levels:[st.levels[1],st.levels[0]], played:[st.played[1],st.played[0]],
          rot:(st.rot+d+4)%4};
}
// 把整场状态拨回 st 记的那一刻再发牌(M.past 这类历史存档不动)
function startFromState(st){
  M.levels=st.levels.slice(); M.dealer=st.dealer; M.round=st.round; M.played=st.played.slice();
  scrambleNext=!!st.scramble; rotNext=st.rot||0;
  redealCount=0;
  document.getElementById('overlay').style.display='none';
  startRound(st.seed);
}

                  :'重打本局:同一副牌、同样的庄家和级数重新发一次,当前进度会丢失。确定吗?')) return;

// 手牌单行自适应:张数一多就把牌往一起挤(而不是换行),换行会把高度让给牌桌抢走
function fitHandRow(){
  const el=document.getElementById('hand');
  const n=el.children.length;
  if(n<2){ el.style.removeProperty('--handGap'); return; }
  // --cardW 是 clamp(vw+vh) 表达式,getComputedStyle 在自定义属性上只返回原始文本、不会解析成像素,
  // 只能量实际卡牌元素的渲染宽度
  const cardW=el.children[0].getBoundingClientRect().width||60;
  const landscape=matchMedia('(orientation:landscape) and (max-height:600px)').matches;
  const naturalGap=cardW*(landscape?-0.46:-0.38);
  const avail=el.clientWidth-4;
  const neededGap=(avail-n*cardW)/(n-1);   // 总宽 = n*cardW + (n-1)*gap,解出刚好塞进 avail 的 gap
  const minVisible=Math.max(9,cardW*0.2);
  const minGap=-(cardW-minVisible);
  const gap=Math.max(minGap,Math.min(naturalGap,neededGap));
  el.style.setProperty('--handGap',gap+'px');
}
window.addEventListener('resize',()=>{ if(G) fitHandRow(); });

// ================= 渲染 =================
function render(){
  const t=G.trump;
  // 只报当前第几墩,不报总数 —— 一墩可以是单张/对子/拖拉机,总墩数本来就不固定
  const trickNo=G.ended?G.tricks.length:G.tricks.length+1;
  /* 座位缩写后面紧跟术语:中文「东翻」连写没问题,英文 "E"+"declare" 会糊成
   * "Edeclare"。拉丁字母开头就补一个空格。 */
  const declNow=G.decl?`${seatAbbr(G.decl.seat)}${T('declare')} ${G.decl.suit?SUIT_SYM[G.decl.suit]+(G.decl.strength===2?'对':''):(G.decl.strength===4?T('bigJoker'):T('smallJoker'))+'对'}`:'未定';

  // 出牌状态显示区拆分:阶段性说明(发牌/造反/扣底)去顶部状态栏;
  // 本墩领出信息(更常用、更值得占牌桌中心)直接写进 #msg,替掉"轮到你跟牌"这类泛泛提示
  let phaseHint='', centerMsg='', winnerMsg='', winnerOurs=false;
  if(G.phase==='dealing'||G.phase==='finalDecl'){
    phaseHint=`发牌中(${G.dealt}/100)${G.auto?'·托管中':''}… 当前:${G.decl?`${SEAT_NAME[G.decl.seat]} ${G.decl.suit?SUIT_SYM[G.decl.suit]+(G.decl.strength===2?'(一对)':''):T('noTrump')}`:'无人'+T('declare')}`;
  }else if(G.phase==='redealing') phaseHint='重新发牌中…';
  else if(G.phase==='lowrebel') phaseHint=`低分/少${T('trump')}:分数≤${RULES.pointRebelThreshold}或${T('trump')}≤${RULES.trumpRebelThreshold}张可${rebelName()}`;
  else if(G.phase==='kitty') phaseHint=`${T('bury')}阶段:庄家从手牌(含底牌)中选 ${RULES.kittySize} 张扣下`;
  else if(G.phase==='play'){
    // 托管中要一眼看得见 —— 否则「我的牌怎么自己出掉了」就是下一条报障
    if(G.auto) phaseHint='托管中:AI 正在替你出牌 —— 点「停止托管」随时收回';
    if(G.trick.length>0){
      const lead=classify(G.trick[0].cards,G.trump);
      const suitName=lead.suit==='T'?(t.suit?T('trump'):T('noTrump')):SUIT_NAME[lead.suit];
      centerMsg=`本墩:${SEAT_NAME[G.trick[0].seat]} ${T('lead')} 【${suitName}】 ${typeName(lead.type)}(${lead.cards.length}张),有${suitName}必须跟`;
      // 谁暂时最大 —— 决定该抢还是该垫,比"轮到你跟牌"有用得多
      const cw=currentWinner(G.trick,G.trump);
      const ours=cw.seat%2===HUMAN%2;
      const pts=countPoints(G.trick.flatMap(p=>p.cards));
      winnerMsg=`目前 ${cw.seat===HUMAN?'你':SEAT_NAME[cw.seat]} 最大(${ours?'我方':'对方'})`+
                (pts?` · 台面 ${pts} 分`:'');
      winnerOurs=ours;
    }else centerMsg=`本墩:${SEAT_NAME[G.leader]} ${T('lead')},等待出牌…`;
  }
  if(centerMsg){   // 空则保留上一次 setMsg() 的内容(如错误提示)
    document.getElementById('msg').innerHTML=centerMsg+
      (winnerMsg?`<div class="msgWin ${winnerOurs?'ours':'theirs'}">${winnerMsg}</div>`:'');
  }

  document.getElementById('status').innerHTML=
    `<span>${T('trump')}:<b>${t?trumpLabel(t):declNow}</b></span>`+
    `<span>庄家:<b>${G.declSeat>=0?SEAT_NAME[G.declSeat]:'抢亮中'}</b></span>`+
    `<span>${T('defenders')}得分:<b>${G.defPoints}</b></span>`+
    `<span>你的队伍:<b>${G.declSeat<0?'—':(G.declSeat%2===0?T('declarers'):T('defenders'))}</b></span>`+
    `<span>级数 你们:<b>${rankName(Math.min(M.levels[0],14))}</b> 对方:<b>${rankName(Math.min(M.levels[1],14))}</b></span>`+
    `<span>第${M.round+1}局 · 第 <b>${trickNo}</b> 墩</span>`+
    `<button id="btnSet" style="margin-left:auto" onclick="window.__openSet()">⚙ 设置</button>`+
    (phaseHint?`<span class="phaseHint">${phaseHint}</span>`:'');

  /* 座位名跟着语言走。这四个 span 的文字原来只写在静态 HTML 里、从不更新 ——
   * 加英语档之前没人发现,因为三种中文写法恰好一样。 */
  // 测试版:换了 AI 引擎的座位在名字后面挂版本号,一眼看出这家是哪一版在打
  for(let s=0;s<4;s++) document.getElementById('n'+s).textContent=SEAT_NAME[s]+(engName(s)?' ·'+engName(s):'');
  for(let s=1;s<4;s++){
    const n=(G.phase==='dealing'||G.phase==='finalDecl')?G.visCount[s]:G.hands[s].length;
    document.getElementById('b'+s).textContent='🂠 '+n+' 张';
    document.getElementById('n'+s).classList.toggle('turn',
      G.phase==='play'&&G.trick.length<4&&(G.leader+G.trick.length)%4===s);
  }
  document.getElementById('n0').classList.toggle('turn',
    G.phase==='play'&&G.trick.length<4&&(G.leader+G.trick.length)%4===0);
  const preplay=(G.phase!=='play');   // 开打前:亮主牌摆在亮主者面前
  for(let s=0;s<4;s++){
    const p=G.trick.find(x=>x.seat===s);
    /* 出牌区和手牌用同一把尺子(sortForDisplay)。原来这里按打出顺序摆:同一副牌
     * 在桌上和手上长得不一样,看的人得先在脑子里做一次映射 —— 甩四五张时尤其明显。 */
    let html=p?sortForDisplay(p.cards,curTrumpForSort()).map(c=>cardHTML(c)).join(''):'';
    if(preplay&&G.declCards&&G.declCards.seat===s)
      html=sortForDisplay(G.declCards.cards,curTrumpForSort()).map(c=>cardHTML(c)).join('');
    // 内容没变就别重建 DOM —— 否则 playIn 动画每次 render 都重放(牌一直闪)
    const slot=document.getElementById('p'+s);
    if(slot.__last!==html){ slot.innerHTML=html; slot.__last=html; }
  }
  const showHand=(G.phase==='dealing'||G.phase==='finalDecl')?visHand(HUMAN):G.hands[HUMAN];
  const hand=sortForDisplay(showHand,curTrumpForSort());
  document.getElementById('hand').innerHTML=
    hand.map(c=>cardHTML(c,G.selected.has(c.id)?'sel':(G.hintCards&&G.hintCards.has(c.id)?'hintc':''))).join('');
  document.querySelectorAll('#hand .card').forEach(el=>{
    el.onclick=()=>{
      if(!(G.phase==='play'||G.phase==='kitty')) return;
      const id=+el.dataset.id;
      G.selected.has(id)?G.selected.delete(id):G.selected.add(id);
      render();
    };
  });
  fitHandRow();

  // 抢亮/造反/低分造反条
  // 注意:内容没变时绝不重建 DOM —— 发牌期高频重绘会把正在点击的按钮销毁(点击被吞 bug)
  const strip=document.getElementById('dealZone');
  let stripHTML, bind=null;
  if(G.ended){
    stripHTML=G.ended.matchOver
      ?`<span style="color:var(--gold)">复盘中</span> <button onclick="window.__newMatch()">重开整场</button>`
      :`<span style="color:var(--gold)">复盘中</span> <button onclick="window.__next()">下一局</button>`;
    bind=null;
  }else if(G.awaitNext){
    stripHTML=`<button onclick="window.__nextTrick()">下一墩 ▶</button>`;
    bind=null;
  }else if(G.phase==='dealing'||G.phase==='finalDecl'){
    const vis=visHand(HUMAN);
    const V=G.decl?T('counterV'):T('declareV');   // 亮/反(沪语:翻/反)
    // 按钮顺序必须稳定:引擎给的 declOptions 是按强度排的,单张升级成对子会重排导致按钮跳位。
    // 这里改成固定花色顺序,再靠右对齐 —— 位置只会往左长,已有按钮不动。
    const btns=[];
    if(canReinforce2(G.decl,HUMAN,vis,rankOf(HUMAN),G.rebelHappened))
      btns.push(`<button data-a="re">${T('reinforce')}${SUIT_SYM[G.decl.suit]}</button>`);
    const jp=jokerPairOf(vis);
    // 王对(最长的一颗「亮无将(大)」—— 按钮定宽以此为准)排在花色左边,位置最靠前
    if(jp&&canOverride(G.decl,jp,HUMAN))
      btns.push(`<button data-a="d" data-s="" data-st="${jp.strength}">${V}${T('noTrump')}(${jp.strength===4?'大':'小'})</button>`);
    declOptions(vis,rankOf(HUMAN)).filter(o=>canOverride(G.decl,o,HUMAN))
      .sort((a,b)=>SUITS.indexOf(a.suit)-SUITS.indexOf(b.suit))
      .forEach(o=>
        btns.push(`<button data-a="d" data-s="${o.suit}" data-st="${o.strength}">${V}${SUIT_SYM[o.suit]}${o.strength===2?'(对)':''}</button>`));
    // 「不亮」不在这条 btns 里——它挪到 #dealerZone 的固定按钮了(见下面 btnSkipDecl),
    // 免得发完最后一张牌它一冒出来就顶到这条不断在长的亮主按钮行上,变成误点。
    stripHTML=btns.length?btns.join(''):`<span>(暂无可${T('declare')}的牌)</span>`;
    // 只绑亮主类按钮([data-a]);「不亮」用自己的 inline onclick,别被这里覆盖掉
    bind=()=>strip.querySelectorAll('button[data-a]').forEach(b=>b.onclick=()=>{
      if(b.dataset.a==='re') applyDecl(HUMAN,{suit:G.decl.suit,strength:2},true);
      else applyDecl(HUMAN,{suit:b.dataset.s||null,strength:+b.dataset.st},false);
    });
  }else if(G.phase==='lowrebel'){
    stripHTML=`<button id="lr1">${rebelName()}</button><button class="minor" id="lr0">不${T('counter')}</button>`;
    bind=()=>{
      document.getElementById('lr1').onclick=()=>humanLowRebel(true);
      document.getElementById('lr0').onclick=()=>humanLowRebel(false);
    };
  }else stripHTML='<span></span>';
  if(strip.__last!==stripHTML){
    strip.innerHTML=stripHTML; strip.__last=stripHTML;
    if(bind) bind();
  }

  const myTurn=!G.ended&&G.phase==='play'&&G.trick.length<4&&(G.leader+G.trick.length)%4===HUMAN;
  /* 托管自己占一颗按钮,落在庄家区(和扣底/看底牌同一区)—— 第一版把它塞进设置里、
   * 让「出牌」改口成「停止托管」,开一次要点三下,实测太不方便。放到桌面上要解决的是
   * 宽度:竖屏那一行原本按最长文案定死 min-width,五颗就挤爆了,所以竖屏改成按文案自适应
   * (见 @media 里的 #controls button)。托管中「出牌/重选/问教练」照旧灰掉 —— 不是不能点,
   * 是这时候本来就没有你要做的决定。 */
  const auto=!!G.auto&&!G.ended;
  const btnAuto=document.getElementById('btnAuto');
  btnAuto.textContent=auto?'停止托管':'托管';
  btnAuto.classList.toggle('minor',!auto);      // 托管中变成醒目色,一眼看得见它开着
  btnAuto.hidden=!(G.phase!=='redealing'&&!G.ended);   // 发牌一开始就在;只有重新发牌的空档收起来
  document.getElementById('btnPlay').disabled=auto||!myTurn;
  document.getElementById('btnClear').disabled=auto||!(G.selected.size>0);
  // 扣底:选够 8 张才可点
  const buryReady=G.phase==='kitty'&&G.selected.size===RULES.kittySize;
  document.getElementById('btnBury').disabled=!buryReady;
  document.getElementById('btnBury').textContent=
    G.phase==='kitty'?`${T('bury')}(${G.selected.size}/${RULES.kittySize})`:T('bury');
  // 看底牌:只有你是庄家、且底牌已扣下才可点
  const canSeeKitty=G.declSeat===HUMAN&&G.buried.length>0;
  document.getElementById('btnKitty').disabled=!canSeeKitty;
  // 扣底/看底牌本局用不上(你不坐庄)就收起来,不留灰按钮占地方(托管那颗另有显隐规则)
  document.getElementById('btnBury').hidden=(G.phase!=='kitty');
  document.getElementById('btnKitty').hidden=!canSeeKitty;
  // 不亮:只在「发完牌、最后机会」这一刻出现,固定占 dealerZone 最左边那个位置
  document.getElementById('btnSkipDecl').hidden=(G.phase!=='finalDecl');
  document.getElementById('btnSkipDecl').textContent='不'+T('declareV');
  document.getElementById('btnHint').disabled=auto||!(C.on&&myTurn);
  // 只在发牌/亮主阶段给发牌区留两行高度,其余时候把这块高度还给牌桌
  document.getElementById('controls').classList.toggle('dealing',
    G.phase==='dealing'||G.phase==='finalDecl');
  renderPanel();
}

// ---- 底部面板 ----
function renderPanel(){
  document.querySelectorAll('#tabs button').forEach(b=>
    b.classList.toggle('on',b.dataset.tab===activeTab));
  const el=document.getElementById('panel');
  if(!activeTab){ el.innerHTML='<span style="opacity:.5">点击上方页签展开:抢分记录 / 对局记录 / 教练 / 记牌表 / 笔记</span>'; return; }
  if(activeTab==='coach'){ renderCoachTab(el); return; }
  if(activeTab==='mem'){ renderMemTab(el); return; }
  if(activeTab==='notes'){ renderNotesTab(el); return; }
  if(activeTab==='log'){
    if(logRound!=null&&!M.past[logRound]) logRound=null;    // 重开整场后越界的选择
    /* 看的是「哪一局」和「怎么看」两件独立的事,所以是两行:
     * 第一行选局(只有打完过局才出现),第二行选视图。
     * 往回翻的局全都已经结束,初始手牌一律可看 —— 只有当前这局要防开天眼。 */
    let past=logRound!=null?M.past[logRound]:null;
    // 还没开局(只导入了牌谱)时「本局」无可看 —— 退回最近一局导入 / 往局
    if(!past&&!G&&M.past.length){ logRound=M.past.length-1; past=M.past[logRound]; }
    if(!past&&!G){ el.innerHTML='<span style="opacity:.6">还没开局。可以在设置里「导入牌谱」复盘别人发来的一局。</span>'; return; }
    const src=past||{tricks:G.tricks, log:G.log, initialHands:G.initialHands,
                     buried:G.buried, trump:curTrumpForSort(), declSeat:G.declSeat};
    const done=past?true:!!G.ended;
    let html='', seekPaint=null;   // seekPaint:进度条只重画受影响的那块,见下
    if(M.past.length){
      html+=`<div class="toggleRow" style="flex-wrap:wrap">`+
        `<button class="minor${logRound==null?' on':''}" data-lr="cur" style="padding:3px 10px;font-size:13px">本局</button>`+
        M.past.map((r,i)=>`<button class="minor${logRound===i?' on':''}" data-lr="${i}" style="padding:3px 10px;font-size:13px">${r.imported?r.no:`第${r.no}局`}</button>`).join('')+
        `</div>`;
    }
    const MODES=[['event','事件'],['trick','每墩出牌'],['suit','按花色']];
    html+=`<div class="toggleRow">`+MODES.map(([k,label])=>
      `<button class="minor${logMode===k?' on':''}" data-lm="${k}" style="padding:3px 10px;font-size:13px">${label}</button>`).join('')+
      `<button class="minor wideOnly" id="sideWider" style="padding:3px 10px;font-size:13px"`+
      ` title="把右栏拉宽,复盘时看得清楚些">⇔ ${SIDE_NAMES[sideStep]}</button>`+`</div>`;
    if(past){
      const who=past.declSeat%2===HUMAN%2?'你们':'对方';
      html+=`<div class="suitGroup" style="font-size:13px">${past.imported?past.no:`第${past.no}局`}:${SEAT_NAME[past.declSeat]}(${who})坐庄,`+
        `主 ${past.trump.suit?SUIT_SYM[past.trump.suit]:'无主'}${rankName(past.trump.rank)},`+
        `${T('defenders')}得 ${past.defPoints} 分 → ${past.defendersWin?T('defenders')+'上台':'庄家守住'};`+
        `级数 ${past.levelsBefore.map(x=>rankName(Math.min(x,14))).join('/')} → ${past.levelsAfter.map(x=>rankName(Math.min(x,14))).join('/')}</div>`;
    }
    if(logMode==='event'){
      html+=src.log.map(l=>`<div>· ${l.text}</div>`).join('')||'(尚无记录)';
    }else if(logMode==='trick'){
      // 各家初始手牌:只在这一局打完后开放,局中看等于开天眼
      if(src.initialHands){
        html+=done
          ?`<div class="suitGroup"><b style="color:var(--gold)">初始手牌</b>`+
            src.initialHands.map((h,s)=>
              `<div class="trickRow"><span class="who">${SEAT_NAME[s]}${s===src.declSeat?'(庄)':''}</span>`+
              sortForDisplay(h,src.trump).map(c=>cardHTML(c,'mini')).join('')+`</div>`).join('')+
            (src.buried.length?`<div class="trickRow"><span class="who">底牌</span>`+
              sortForDisplay(src.buried,src.trump).map(c=>cardHTML(c,'mini')).join('')+`</div>`:'')+
           `</div>`
          :`<div style="opacity:.6;margin-bottom:4px">(各家初始手牌本局结束后可看)</div>`;
      }
      /* 默认最新一墩在上:局中最常问的是「刚才那墩谁赢的」。
       * 但复盘一局是从第 1 墩顺着看的,所以顺序可以翻;再给一条进度条,
       * 拖到第 N 墩就把那一墩单独按正常尺寸放大 —— mini 尺寸下四家的牌看不清。 */
      const nT=src.tricks.length;
      if(logFocus>nT) logFocus=0;
      const rowOf=(tk,size)=>
        `<div class="trickRow"><span class="who">第${tk.no}墩 ${SEAT_NAME[tk.winner]}赢${tk.points?` +${tk.points}分`:''}</span>`+
        tk.plays.map(p=>`<span style="font-size:11px;color:#9fd6b5">${seatAbbr(p.seat)}:</span>`+
          sortForDisplay(p.cards,src.trump).map(c=>cardHTML(c,size)).join('')).join('')+`</div>`;
      const focusHTML=()=>{
        const tk=src.tricks[logFocus-1];
        // 累计分按「反方拿到的分」算,和局末结算、状态栏是同一个口径
        const acc=src.tricks.slice(0,logFocus).reduce((a,x)=>
          a+(x.winner%2!==src.declSeat%2?x.points:0),0);
        return `<div class="suitGroup">`+rowOf(tk,'')+
          `<div style="opacity:.7;font-size:12px;margin-top:4px">`+
          `领出:${SEAT_NAME[tk.plays[0].seat]} · 打完这墩${T('defenders')}累计 ${acc} 分</div></div>`;
      };
      const listHTML=()=>
        (logAsc?src.tricks.slice():src.tricks.slice().reverse()).map(tk=>rowOf(tk,'mini')).join('')
        ||'(尚无出牌)';
      if(nT){
        html+=`<div class="toggleRow">`+
          `<button class="minor${logAsc?'':' on'}" data-lo="0" style="padding:3px 10px;font-size:13px">最新在上</button>`+
          `<button class="minor${logAsc?' on':''}" data-lo="1" style="padding:3px 10px;font-size:13px">第1墩在上</button>`+
          `</div>`+
          `<div class="trickSeek"><input type="range" id="trkSeek" min="0" max="${nT}" value="${logFocus}" `+
          `aria-label="拖到第几墩"><span id="trkLabel">${logFocus?`第 ${logFocus} 墩`:'全部'}</span></div>`;
        seekPaint=()=>{
          const lab=document.getElementById('trkLabel'), body=document.getElementById('trkBody');
          if(lab) lab.textContent=logFocus?`第 ${logFocus} 墩`:'全部';
          if(body) body.innerHTML=logFocus?focusHTML():listHTML();
        };
      }
      html+=`<div id="trkBody">${nT?(logFocus?focusHTML():listHTML()):'(尚无出牌)'}</div>`;
    }else{
      // 按花色:算哪门还剩什么用的,主牌排最前,门内从大到小
      const all=src.tricks.flatMap(tk=>tk.plays.flatMap(p=>p.cards.map(c=>({c,seat:p.seat,no:tk.no}))));
      if(!all.length) html+='(尚无出牌)';
      else{
        const t=src.trump;
        const groups={};
        all.forEach(x=>{const s=effSuit(x.c,t);(groups[s]=groups[s]||[]).push(x);});
        const gname=s=>s==='T'?T('trump'):SUIT_NAME[s];
        html+=Object.keys(groups).sort((a,b)=>(a==='T'?-1:1)-(b==='T'?-1:1)).map(s=>{
          const sorted=groups[s].sort((a,b)=>ordIdx(b.c,t)-ordIdx(a.c,t));
          return `<div class="suitGroup"><b style="color:var(--gold)">${gname(s)}(${sorted.length}张)</b><br>${sorted.map(x=>cardHTML(x.c,'mini')).join('')}</div>`;
        }).join('');
      }
    }
    el.innerHTML=html;
    el.querySelectorAll('[data-lm]').forEach(b=>b.onclick=()=>{ logMode=b.dataset.lm; renderPanel(); });
    el.querySelectorAll('[data-lr]').forEach(b=>b.onclick=()=>{
      logRound=b.dataset.lr==='cur'?null:+b.dataset.lr; logFocus=0; renderPanel(); });
    el.querySelectorAll('[data-lo]').forEach(b=>b.onclick=()=>{
      logAsc=b.dataset.lo==='1'; renderPanel(); });
    const wbtn=el.querySelector('#sideWider');
    if(wbtn) wbtn.onclick=()=>{
      sideStep=(sideStep+1)%SIDE_STEPS.length;
      try{ localStorage.setItem(LSP+'sidew',sideStep); }catch(e){}
      applySideW(); fitHandRow(); renderPanel(); };
    const sk=el.querySelector('#trkSeek');
    // 只重画标签和牌区,不整块 renderPanel —— innerHTML 一换,正在拖的滑块就被拆掉了
    if(sk&&seekPaint) sk.oninput=()=>{ logFocus=+sk.value; seekPaint(); };
  }else if(activeTab==='score'){
    const pts=G.capturedCards;
    el.innerHTML=`<div style="margin-bottom:6px">抓分方已抓到 <b style="color:var(--gold)">${G.defPoints}</b> 分,分牌如下:</div>`+
      (pts.length?`<div class="trickRow">${pts.map(c=>cardHTML(c,'mini')).join('')}</div>`:'(还没有抓到分牌)');
  }
}

// ---- 教练页签:提问中的 quiz 置顶,下面是对话历史(最新在上),标注第几墩 ----
function renderCoachTab(el){
  let html='';
  if(G.quiz){
    html+=`<div class="coachBox"><b>🎓 ${G.quiz.q}</b><div style="margin-top:6px">`+
      [0,1,2,3].map(n=>`<button class="minor" data-qz="${n}" style="margin-right:6px;padding:4px 14px">${n===3?'3+':n}</button>`).join('')+
      `</div></div>`;
  }
  if(G.coachChat.length){
    html+=G.coachChat.slice().reverse().map(c=>
      `<div class="coachBox" style="margin-bottom:6px">`+
      `<div style="font-size:11px;color:#9fd6b5;margin-bottom:3px">第${c.no}墩</div>${c.html}</div>`).join('');
  }else if(!G.quiz){
    html+=`<div style="opacity:.6">轮到你时点「问教练」;出现大失误会自动提醒;局终自动复盘关键回合。</div>`;
  }
  el.innerHTML=html;
  el.querySelectorAll('[data-qz]').forEach(b=>b.onclick=()=>{
    const guess=+b.dataset.qz, right=guess===G.quiz.answer;
    G.coachChat.push({no:G.quiz.no,
      html:`<div>${right?'✅ 答对了':'❌ 不对'},实际在外还有 <b>${G.quiz.answer===3?'3张以上':G.quiz.answer+'张'}</b> 更大的。</div>`+G.quiz.advice});
    G.quiz=null; renderPanel();
  });
}

// ---- 记牌表页签(默认蒙住,点开验证;每墩重新蒙上) ----
function renderMemTab(el){
  const inPlay=G.phase==='play'||G.phase==='kitty';
  if(!inPlay){ el.innerHTML='<div style="opacity:.6">开打后这里显示在外大牌统计。</div>'; return; }
  let html='';
  const revealed=C.memShow||G.memRevealTrick===G.tricks.length;
  if(!revealed){
    html+=`<div class="coachBox">🧠 先自己心算:主牌还剩几张?哪几门的分牌还没出?<br>
      <button id="memReveal" style="margin-top:6px">我算好了,点开验证</button></div>`;
    el.innerHTML=html;
    el.querySelector('#memReveal').onclick=()=>{G.memRevealTrick=G.tricks.length;renderPanel();};
    return;
  }
  const t=G.trump, view=viewFor(HUMAN), mem=makeMemory(view);
  const voids=makeVoids(view.history,t);            // 从历史推断谁已确定断门
  const suits=['T','S','H','C','D'].filter(s=>s==='T'||(!t.suit||s!==t.suit));
  html+=suits.map(s=>{
    let cnt=0, top=null;
    const ptBy={};                                   // 分牌明细:rank → 张数
    for(const k in mem.unseen){
      const m=mem.unseen[k]; if(m<=0) continue;
      const c=keyToCard(k);
      if(effSuit(c,t)!==s) continue;
      cnt+=m;
      if(cardPoints(c)>0) ptBy[c.rank]=(ptBy[c.rank]||0)+m;
      if(!top||ordIdx(c,t)>ordIdx(top,t)) top=c;
    }
    const name=s==='T'?T('trump'):SUIT_NAME[s];
    // 你该门最大的一张,以及它是否已经压得住别家(省得自己心算)
    const mine=G.hands[HUMAN].filter(c=>effSuit(c,t)===s);
    const myTop=mine.length?mine.reduce((a,b)=>ordIdx(b,t)>ordIdx(a,t)?b:a):null;
    // 同大小时先出者赢,所以并列最大也算"领出能吃",不能笼统说压不过
    const cmp=myTop?(top?ordIdx(myTop,t)-ordIdx(top,t):1):0;
    const ptTxt=Object.keys(ptBy).sort((a,b)=>b-a).map(r=>`${ptBy[r]}张${rankName(+r)}`).join('、');
    const ptSum=Object.keys(ptBy).reduce((a,r)=>a+cardPoints({rank:+r})*ptBy[r],0);
    const gone=[1,2,3].filter(x=>voids[x]&&voids[x][s]).map(x=>SEAT_NAME[x].replace(/\(.*\)/,'').trim());
    return `<div class="memRow">`+
      `<b style="color:var(--gold)">${name}</b> 别家还剩 <b>${cnt}</b> 张`+
      (cnt?`,最大 ${miniName(top)}`:'(已出尽)')+
      `<div class="memSub">你最大:${myTop?miniName(myTop):'无'}`+
        (myTop?(cmp>0?' <span style="color:#7ee787">— 已是最大,吃得住</span>'
               :cmp===0?' <span style="color:#7ee787">— 并列最大,领出能吃(同大小先出者赢)</span>'
                       :` <span style="color:#ff9d6e">— 压不过 ${miniName(top)}</span>`):'')+`</div>`+
      `<div class="memSub">剩余分牌:${ptSum?`${ptTxt}(共 ${ptSum} 分)`:'无'}</div>`+
      (gone.length?`<div class="memSub">已断门:${gone.join('、')}</div>`:'')+
      `</div>`;
  }).join('');
  html+=`<div style="opacity:.6;margin-top:6px">(「别家还剩」= 三家对手/队友手中 + 底牌,不含你自己的牌;`+
        `底牌${G.declSeat===HUMAN?'你已知,已扣除':'未知,计在其中'})</div>`;
  el.innerHTML=html;
}

// ---- 笔记(右栏页签,不再单独占块) ----
function renderNotesTab(el){
  // 笔记标局数:一场十几局,回头看「这条是哪局记的」原来只能靠记忆
  const esc=t=>String(t).replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));
  el.innerHTML=
    `<div id="noteInputRow"><input id="noteInput" placeholder="记点什么…" maxlength="120"><button id="noteSend">发送</button></div>`+
    `<div id="noteList">${notes.slice().reverse().map(n=>`<div class="note">`+
      (n.r?`<span style="color:var(--gold)">第${n.r}局</span> `:'')+esc(n.t)+`</div>`).join('')}</div>`;
  el.querySelector('#noteSend').onclick=sendNote;
  el.querySelector('#noteInput').onkeydown=e=>{ if(e.key==='Enter') sendNote(); };
}
function sendNote(){
  const el=document.getElementById('noteInput');
  const v=el.value.trim();
  if(!v) return;
  notes.push({r:M.round+1,t:v}); el.value='';
  try{ localStorage.setItem(LSP+'notes',JSON.stringify(notes.slice(-100))); }catch(e){}
  renderPanel();
}

document.getElementById('btnPlay').onclick=humanPlay;
document.getElementById('btnClear').onclick=()=>{G.selected.clear();render();};
document.getElementById('btnBury').onclick=buryKitty;
document.getElementById('btnHint').onclick=askCoach;
document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{
  activeTab=activeTab===b.dataset.tab?null:b.dataset.tab;
  renderPanel();
});

/* 悬停态跟着真实输入设备走,而不是跟着设备"声称"支持什么(见样式里 html.hasHover)。
   pointerdown 用捕获阶段,保证在任何点击处理之前就把类切好。 */
function trackPointerType(){
  const el=document.documentElement;
  const set=on=>el.classList.toggle('hasHover',on);
  set(matchMedia('(hover:hover) and (pointer:fine)').matches);   // 起手按浏览器说的算
  addEventListener('pointerdown',e=>set(e.pointerType==='mouse'),{capture:true,passive:true});
  addEventListener('pointermove',e=>{ if(e.pointerType==='mouse') set(true); },{capture:true,passive:true});
}
trackPointerType();

showStartScreen();

  document.getElementById('overlayContent').innerHTML=

    `<button class="minor" style="margin-left:10px" onclick="window.__openSet()">⚙ 设置</button></div>`;
  document.getElementById('overlay').style.display='flex';
}
window.__start=()=>{ document.getElementById('overlay').style.display='none'; newRound(); };
})();

<script>
/* =====================================================================
   80分 · UI 测试版 v2 表现层(不碰产品逻辑)
   产品 render() 继续往 #status/#msg/#hand/#dealZone/#p0-3/按钮组写内容;
   本脚本负责:扇形手牌排布与指针手势(照搬原型 ui/dist 的 fan.js/table.js
   交互模型)、桌面信息镜像、亮主拖拽、记录抽屉与菜单 sheet。
   ===================================================================== */
(function(){
'use strict';
var $=function(id){return document.getElementById(id);};
var game=$('game'),hand=$('hand'),fanVp=$('fanViewport'),arena=$('arena');

/* ---------- #test 自测模式:让位给产品测试页 ---------- */
if(location.hash==='#test'){game.style.display='none';return;}

/* ---------- 工具 ---------- */
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
function suitOf(cardEl){var m=cardEl.className.match(/\bs([SHDC])\b/);return m?m[1]:(/jb/.test(cardEl.className)?'J':/js/.test(cardEl.className)?'j':'');}
function rankText(cardEl){var t=cardEl.querySelector('.tl');return t?t.textContent.trim():'';}
function isJoker(c){return /jb|js/.test(c.className);}

/* 主牌状态:从镜像 trumpStatus 文本解析(♠ 打2 / 无将 打5 / 待开局) */
var trump={suit:null,rank:0};
function refreshTrump(){
  var t=$('trumpStatus').textContent||'';
  var m=t.match(/([♠♥♦♣])\s*打\s*(\d+)/);
  if(m){trump.suit=m[1];trump.rank=+m[2];return;}
  if(/无将\s*打\s*(\d+)/.test(t)){trump.suit=null;trump.rank=+RegExp.$1;return;}
  trump.suit=null;trump.rank=0;
}
var SUIT_SYM={S:'♠',H:'♥',D:'♦',C:'♣'};
function effGroup(cardEl){
  if(isJoker(cardEl))return 'J';
  var s=suitOf(cardEl),r=rankText(cardEl),rn=({J:11,Q:12,K:13,A:14})[r]||+r;
  if(trump.suit&&SUIT_SYM[s]===trump.suit)return 'T';
  if(trump.rank&&rn===trump.rank)return 'T';
  if(!trump.suit&&trump.rank&&rn===trump.rank)return 'T';
  return s;
}

/* ---------- 扇形排布(几何照原型 fan.js) ---------- */
var panRange=0;
function splitRows(cards){
  var n=cards.length;
  if(n<=16)return [cards];
  var mid=Math.floor(n/2),best=-1,bestD=1e9;
  for(var i=1;i<n;i++){
    if(effGroup(cards[i-1])===effGroup(cards[i]))continue;   // 不拆同门
    var d=Math.abs(i-mid);
    if(d<bestD){bestD=d;best=i;}
  }
  if(best<0)return [cards];                                   // 一整门太长:整行 + 拨动条
  return [cards.slice(0,best),cards.slice(best)];
}
/* 单行步距:按可用宽度算,夹在 [min,max];放不下即 step 跌破 min 时返回 null */
function planRow(n,cw,min,max,availW){
  if(n<=1)return {step:0,fits:true};
  var step=(availW-cw)/(n-1);
  if(step<min)return {step:min,fits:false};
  return {step:Math.min(step,max),fits:true};
}
function layoutHand(){
  var cards=Array.prototype.slice.call(hand.children);
  var W=fanVp.clientWidth,H=fanVp.clientHeight;
  if(!cards.length){setPan(0);$('handCount').textContent='0 张';return;}
  refreshTrump();
  var wide=game.classList.contains('wide');
  var cw,ch,rows;
  if(wide){
    /* 宽屏:卡大一点、单行优先 —— 放得下绝不拆两行;实在放不下再按门拆 */
    cw=window.innerWidth>=1100?96:(game.classList.contains('compact')?74:84);
    ch=cw*1.48;
    var availW=W-40,minS=26,maxS=46;
    var single=planRow(cards.length,cw,minS,maxS,availW);
    rows=single.fits?[cards]:splitRows(cards);
  }else{
    cw=clamp(Math.min(W*.185,(H-84)/1.48),66,78);ch=cw*1.48;
    rows=splitRows(cards);
  }
  var arc=wide?(game.classList.contains('compact')?8:14):8;
  var maxAng=wide?(game.classList.contains('compact')?5:7):7;
  var rowStride=clamp(H-ch-36,52,H);
  var maxRight=0;
  rows.forEach(function(row,ri){
    var n=row.length;
    var plan=planRow(n,cw,wide?26:23,wide?46:31,wide?(W-40):(W-36));
    var step=plan.step;
    var rowW=cw+(n-1)*step;
    var x0=(W-rowW)/2;
    maxRight=Math.max(maxRight,x0+rowW);
    row.forEach(function(c,i){
      var t=n<2?0:(i-(n-1)/2)/((n-1)/2);
      var x=x0+i*step,y=(wide?6:24)+ri*rowStride+t*t*arc;
      var ang=t*maxAng;
      c.style.width=cw+'px';c.style.height=ch+'px';
      c.style.left='0px';c.style.top='0px';
      c.style.transform='translateX('+x+'px) translateY('+(y+(c.classList.contains('sel')?-24:0))+'px) rotate('+ang+'deg)';
      c.style.zIndex=String(i+1+ri*40);
      decorateCard(c);
    });
  });
  hand.style.width=W+'px';hand.style.height=H+'px';
  /* 行超出时 x0 为负:给一个基准偏移,让 pan=0 时最左那张完整可见(8px 边距),
     否则发牌期一开始就有一截牌裁在屏幕外 */
  var minX=1e9;
  Array.prototype.forEach.call(hand.children,function(c){
    var mm=c.style.transform.match(/translateX\\(([-\\d.]+)px\\)/);
    if(mm)minX=Math.min(minX,+mm[1]);
  });
  panBase=minX<8?(8-minX):0;
  panRange=Math.max(0,maxRight+panBase+10-W);
  setPan(panRange<=0?0:null);
  $('pan').disabled=panRange<=0;
  $('panHint').textContent=panRange<=0?'已全部展开':'左右拨牌';
  $('handCount').textContent=cards.length+' 张';
}
var panBase=0;
function decorateCard(c){
  var r=rankText(c);
  c.classList.toggle('two',r==='10');
  if(!c.querySelector('.point-mark')&&(r==='5'||r==='10'||r==='K')){
    var b=document.createElement('span');b.className='point-mark';b.textContent=r;c.appendChild(b);
  }
}
function setPan(v){
  var pan=$('pan');
  if(v===null)v=+pan.value;
  hand.style.transform='translateX('+(panBase-(v/100)*panRange)+'px)';
}
$('pan').addEventListener('input',function(){setPan(+this.value);});

/* 手牌重渲染(产品 render() 重建 innerHTML)→ 重排。
   可见状态下同步排布(25~33 个节点,代价微小),不留"牌已重建、排布还在队列里"
   的空窗 —— 空窗里新牌没有 transform 会叠在左上角;隐藏/后台才走 rAF+定时器 */
var layoutQueued=false;
function queueLayout(){
  if(document.visibilityState==='visible'){layoutHand();return;}
  if(layoutQueued)return;layoutQueued=true;
  var done=false,run=function(){if(done)return;done=true;layoutQueued=false;layoutHand();};
  requestAnimationFrame(run);
  setTimeout(run,40);
}
new MutationObserver(queueLayout).observe(hand,{childList:true});
/* 自愈巡检:任何绘制路径被跳过(视口抖动、节流、异常),最多 1 秒内补排 */
var lastLaidN=-1,lastLaidCls='';
setInterval(function(){
  if(document.visibilityState!=='visible')return;
  var cs=hand.children;
  if(!cs.length){if(lastLaidN!==0){lastLaidN=0;}return;}
  var first=cs[0],cls=game.className;
  if(cs.length!==lastLaidN||first.style.transform.length<10||cls!==lastLaidCls){
    lastLaidN=cs.length;lastLaidCls=cls;layoutHand();
  }
},1000);
document.addEventListener('visibilitychange',function(){
  if(document.visibilityState==='visible'){queueLayout();queueStamp();}
});
new MutationObserver(function(){
  Array.prototype.forEach.call(hand.children,function(c){
    var m=c.style.transform.match(/translateY\(([-\d.]+)px\)/);
    var y=m?+m[1].replace('-24','0'):0;
    c.style.transform=c.style.transform.replace(/translateY\([-\d.]+px\)/,
      'translateY('+(c.classList.contains('sel')?-24:0)+'px)');
  });
}).observe(hand,{attributes:true,attributeFilter:['class'],subtree:true});
window.addEventListener('resize',applyLayout);
/* IAB/部分 webview 改视口不派发 resize,ResizeObserver 的回调又与渲染帧对齐、
   挂起状态下不跑 —— 尺寸轮询兜底:只在变化时排布,常态开销是两次数字比较 */
try{new ResizeObserver(function(){applyLayout();}).observe(document.documentElement);}catch(_){}
var lastW=0,lastH=0;
setInterval(function(){
  if(window.innerWidth!==lastW||window.innerHeight!==lastH){
    lastW=window.innerWidth;lastH=window.innerHeight;applyLayout();
  }
},200);
try{window.visualViewport&&window.visualViewport.addEventListener('resize',function(){applyLayout();});}catch(_){}
function applyLayout(){
  var w=window.innerWidth,h=window.innerHeight;
  var wide=w>=700||(w>=560&&w>h*1.2);
  game.classList.toggle('wide',wide);
  game.classList.toggle('compact',wide&&h<=720);
  document.body.classList.toggle('wide-view',wide);
  /* 桌面出牌堆尺寸跟着布局走:别再和手牌差出一截 */
  game.style.setProperty('--pile-cw',wide?(w>=1100?'72px':'66px'):'56px');
  game.style.setProperty('--pile-step',wide?'24px':'20px');
  layoutHand();
}
applyLayout();

/* ---------- 桌面出牌堆:--i 级联盖章 ---------- */
function stampPiles(){
  Array.prototype.forEach.call(document.querySelectorAll('.played'),function(p){
    var cards=p.children,n=cards.length;
    p.style.width=n?('calc(var(--pile-cw,56px) + '+(n-1)+' * var(--pile-step,20px))'):'0px';
    Array.prototype.forEach.call(cards,function(c,i){
      c.style.setProperty('--i',i);
      decorateCard(c);   /* 桌面牌同样要 two 类与分牌角标,否则 10 会挤出左列 */
    });
  });
}
var stampQueued=false;
function queueStamp(){
  if(stampQueued)return;stampQueued=true;
  var done=false,run=function(){if(done)return;done=true;stampQueued=false;stampPiles();};
  requestAnimationFrame(run);
  setTimeout(run,40);
}
new MutationObserver(queueStamp).observe($('players'),{childList:true,subtree:true});
new MutationObserver(queueStamp).observe($('myPlay'),{childList:true});

/* ---------- 指针手势:点选/长按放大/横扫/拖拽上桌 ---------- */
var loupe=$('loupe'),ghost=$('dragGhost'),dropCue=$('dropCue');
var gest=null;
fanVp.addEventListener('pointerdown',function(e){
  var card=e.target.closest('.card');if(!card)return;
  gest={id:e.pointerId,card:card,x0:e.clientX,y0:e.clientY,t0:Date.now(),mode:'pending',
        startX:card.getBoundingClientRect().left,wasSel:card.classList.contains('sel')};
  try{fanVp.setPointerCapture(e.pointerId);}catch(_){/* 合成/失效指针下拿不到捕获,手势照常 */}
  gest.hold=setTimeout(function(){
    if(gest&&gest.mode==='pending'){gest.mode='peek';showLoupe(gest.card,e.clientX,e.clientY);}
  },180);
});
fanVp.addEventListener('pointermove',function(e){
  if(!gest||e.pointerId!==gest.id)return;
  var dx=e.clientX-gest.x0,dy=e.clientY-gest.y0;
  if(gest.mode==='pending'){
    var shallow=gest.wasSel;
    var isDrag=dy<-(shallow?10:20)&&-dy>Math.abs(dx)*(shallow?.25:.35);
    if(isDrag){clearTimeout(gest.hold);hideLoupe();gest.mode='drag';buildGhost();}
    else if(Math.abs(dx)>12){clearTimeout(gest.hold);gest.mode='scrub';}
    else return;
  }
  if(gest.mode==='peek'&&Math.abs(dx)+Math.abs(dy)>8){hideLoupe();gest.mode='scrub';}
  if(gest.mode==='scrub'){
    var c=cardAtX(e.clientX);
    if(c)showLoupe(c,e.clientX,e.clientY);
    if(panRange>0){
      var r=fanVp.getBoundingClientRect();
      if(e.clientX>r.left+ r.width-34)$('pan').value=clamp(+$('pan').value-2,0,100);
      else if(e.clientX<r.left+34)$('pan').value=clamp(+$('pan').value+2,0,100);
      setPan(null);
    }
  }
  if(gest.mode==='drag'){
    moveGhost(e.clientX,e.clientY);
    var a=arena.getBoundingClientRect();
    var inside=e.clientX>a.left&&e.clientX<a.right&&e.clientY>a.top&&e.clientY<a.bottom;
    arena.classList.toggle('drag-ready',!inside);
    arena.classList.toggle('drag-over',inside);
    dropCue.querySelector('span').textContent='松手出牌';
  }
});
function endGesture(e,cancelled){
  if(!gest||e.pointerId!==gest.id)return;
  clearTimeout(gest.hold);hideLoupe();hideGhost();
  arena.classList.remove('drag-ready','drag-over');
  var g=gest;gest=null;
  if(cancelled)return;
  if(g.mode==='drag'){
    var a=arena.getBoundingClientRect();
    var inside=e.clientX>a.left&&e.clientX<a.right&&e.clientY>a.top&&e.clientY<a.bottom;
    if(inside)commitDrag(g);
    /* 桌外松手:选择保留,什么都不做(原型行为) */
    suppressClick();
  }
}
fanVp.addEventListener('pointerup',function(e){endGesture(e,false);});
fanVp.addEventListener('pointercancel',function(e){endGesture(e,true);});
fanVp.addEventListener('lostpointercapture',function(e){if(gest&&gest.id===e.pointerId)endGesture(e,true);});
var clickSuppressed=0;
function suppressClick(){clickSuppressed=Date.now();}
hand.addEventListener('click',function(e){
  if(Date.now()-clickSuppressed<350){e.stopPropagation();e.preventDefault();}
},true);

function cardAtX(px){
  var r=fanVp.getBoundingClientRect(),x=px-r.left;
  var best=null,bd=1e9;
  Array.prototype.forEach.call(hand.children,function(c){
    var m=c.style.transform.match(/translateX\(([-\d.]+)px\)/);
    if(!m)return;var cx=+m[1]+c.offsetWidth/2,d=Math.abs(cx-x);
    if(d<bd){bd=d;best=c;}
  });
  return bd<40?best:null;
}
function showLoupe(card,x,y){
  loupe.innerHTML=card.outerHTML;
  loupe.querySelector('.card').style.cssText='position:fixed;transform:none!important;width:91px;height:134px;margin:0';
  loupe.hidden=false;
  /* loupe/.drag-ghost 都是 position:fixed —— 直接用视口坐标,别再按 #game 内部坐标换算 */
  loupe.style.left=clamp(x-46,8,window.innerWidth-100)+'px';
  loupe.style.top=clamp(y-150,8,window.innerHeight-146)+'px';
  card.classList.add('peek');
}
function hideLoupe(){
  loupe.hidden=true;
  Array.prototype.forEach.call(hand.querySelectorAll('.peek'),function(c){c.classList.remove('peek');});
}
function draggedSet(g){
  var set=[g.card];
  if(g.wasSel)Array.prototype.forEach.call(hand.querySelectorAll('.card.sel'),function(c){if(c!==g.card)set.push(c);});
  return set;
}
function buildGhost(){
  var g=gest;
  var set=draggedSet(g);
  ghost.innerHTML=set.slice(0,6).map(function(c,i){
    return c.outerHTML.replace('class="card','style="position:static;transform:rotate('+(i*4)+'deg)!important;margin-left:'+(i?'-32px':'0')+'" class="card');
  }).join('')+'<span class="drag-count">'+set.length+'</span>';
  ghost.hidden=false;
}
function moveGhost(x,y){
  ghost.style.left=clamp(x-70,4,window.innerWidth-150)+'px';
  ghost.style.top=clamp(y-120,4,window.innerHeight-160)+'px';
}
function hideGhost(){ghost.hidden=true;}
function commitDrag(g){
  var set=draggedSet(g);
  /* 阶段一:发牌/亮主 —— 拖牌=亮主/加固/反主,转发给 dealZone 里对应的按钮 */
  var dz=$('dealZone');
  if(dz.querySelector('button[data-a]')){
    var st=set.length===2&&rankText(set[0])===rankText(set[1])?2:(isJoker(set[0])&&set.length===2?4:1);
    var suit=set.length===2?'':suitOf(set[0]);
    if(isJoker(set[0])&&set.length===1)st=1;
    var btns=Array.prototype.slice.call(dz.querySelectorAll('button[data-a]'));
    var target=btns.filter(function(b){return b.dataset.a==='d'&&b.dataset.s===suit&&+b.dataset.st===st;})[0]
             ||btns.filter(function(b){return b.dataset.a==='d'&&b.dataset.s===suit&&+b.dataset.st===1;})[0]
             ||btns.filter(function(b){return b.dataset.a==='re';})[0];
    if(target){target.click();}else{toastNow('没有对应的亮主选项');}
    return;
  }
  /* 其余阶段:把拖的牌选中(点击未选中的),扣底阶段到此为止,出牌阶段再提交 */
  set.forEach(function(c){if(!c.classList.contains('sel'))c.click();});
  if(!$('btnPlay').disabled)$('btnPlay').click();
}
function toastNow(t){var el=$('toast');el.textContent=t;el.classList.add('show');setTimeout(function(){el.classList.remove('show');},1600);}

/* ---------- 顶栏/桌面信息镜像 ---------- */
var SEAT_EL={你:'myPlay',南:'myPlay',北:'playerN',西:'playerW',东:'playerE'};
function parseStatus(){
  var spans=$('status').querySelectorAll('span');
  if(spans.length<6)return;
  var trumpB=spans[0].querySelector('b'),dealerB=spans[1].querySelector('b');
  $('trumpStatus').innerHTML=(trumpB?trumpB.innerHTML:'未定')+' · <em>庄家 '+(dealerB?dealerB.textContent:'抢亮中')+'</em>';
  refreshTrump();
  var roleB=spans[3].querySelector('b');
  $('role').textContent='你的队伍:'+(roleB?roleB.textContent:'—');
  var sc=spans[2].querySelector('b');
  var score=sc?+sc.textContent:0;
  $('scoreNow').textContent=score;
  $('scoreFill').style.width=clamp(score/80*100,0,100)+'%';
  var ph=$('status').querySelector('.phaseHint');
  $('phaseLine').textContent=ph?ph.textContent:'';
  $('instruction').textContent=spans[5].textContent.trim();
}
new MutationObserver(parseStatus).observe($('status'),{childList:true});
function parseMsg(){
  var t=$('msg').textContent||'';   /* textContent 不触发回流;innerText 在发牌高频期会强制布局 */
  var m=t.match(/台面\s*(\d+)\s*分/);
  $('trickPoints').textContent=m?m[1]:'0';
  var w=t.match(/目前\s*(你|南|北|西|东)\s*最大/);
  Array.prototype.forEach.call(document.querySelectorAll('.player.winner,.my-play.winner'),function(el){el.classList.remove('winner');});
  Array.prototype.forEach.call(document.querySelectorAll('.winner-label'),function(el){el.remove();});
  if(w){
    var id=SEAT_EL[w[1]];
    var host=$(id);if(host){
      host.classList.add('winner');
      var lab=document.createElement('span');lab.className='winner-label';lab.textContent='暂大';
      host.appendChild(lab);
    }
  }
}
new MutationObserver(parseMsg).observe($('msg'),{childList:true});
parseStatus();parseMsg();

/* ---------- 记录抽屉 ---------- */
function openSide(){$('side').classList.add('open');$('side-backdrop').classList.add('show');}
function closeSide(){$('side').classList.remove('open');$('side-backdrop').classList.remove('show');}
$('recordsBtn').onclick=openSide;
$('sideClose').onclick=closeSide;
$('side-backdrop').onclick=closeSide;
/* Esc 关抽屉/收 sheet —— 弹层开着时 Esc 不应无处可去 */
document.addEventListener('keydown',function(e){
  if(e.key!=='Escape')return;
  if($('side').classList.contains('open')){closeSide();e.stopPropagation();}
  else if(sheet&&sheet.open){sheet.close();e.stopPropagation();}
});
/* 问六六:产品的 askCoach 会切到教练页签,面板在抽屉里,顺手拉开 */
$('btnHint').addEventListener('click',function(){setTimeout(openSide,60);});

/* ---------- 菜单 / 展牌 sheet ---------- */
var sheet=$('sheet');
function openSheet(title,bodyHtml,footerHtml){
  $('sheetTitle').textContent=title;
  $('sheetBody').innerHTML=bodyHtml;
  $('sheetFooter').innerHTML=footerHtml||'';
  if(!sheet.open)sheet.showModal();
}
$('closeSheet').onclick=function(){sheet.close();};
$('menuBtn').onclick=function(){
  openSheet('菜单',
    '<button class="menu-option" id="mSet">⚙ 设置<small>规则 · 节奏 · 教练 · 声音</small></button>'+
    '<button class="menu-option" id="mRec">📖 记录 · 教练 · 笔记<small>抢分 / 对局 / 记牌表 / 笔记</small></button>'+
    '<button class="menu-option" id="mExpand">🔍 展牌<small>整手牌平铺查看</small></button>'+
    '<button class="menu-option" id="mCopy">📋 复制牌谱<small>复盘与分享</small></button>'+
    '<a class="menu-option" href="80fen-learn-ui-test.html">🧁 去学牌<small>六六陪你从一手牌开始</small></a>',
    '');
  $('mSet').onclick=function(){sheet.close();window.__openSet();};
  $('mRec').onclick=function(){sheet.close();openSide();};
  $('mExpand').onclick=function(){sheet.close();expandHand();};
  $('mCopy').onclick=function(){sheet.close();window.__copyRecord();};
};
$('expandBtn').onclick=expandHand;
function expandHand(){
  var cards=Array.prototype.slice.call(hand.children);
  openSheet('展牌 · '+cards.length+' 张',
    '<div class="card-grid">'+cards.map(function(c){return c.outerHTML;}).join('')+'</div>'+
    '<p class="sheet-copy">当前整手牌。点牌选牌请在下方手牌区完成。</p>','');
  Array.prototype.forEach.call($('sheetBody').querySelectorAll('.card'),function(c){
    c.style.cssText='position:static;transform:none!important;margin:0';
  });
}

/* ---------- 开始画面:六六陪打封面(立即检查 + 观察器兜底) ---------- */
var startDone=false,oc=$('overlayContent');
function applyStartScreen(){
  if(startDone||!oc||!oc.firstChild)return;
  if(oc.textContent.indexOf('80分(上海规则)')<0)return;
  startDone=true;
  oc.innerHTML=
    '<div class="leo-start">'+
      '<span class="leo-avatar" role="img" aria-label="六六教练"></span>'+
      '<div style="text-align:left">'+
        '<div class="leo-start-title">80分<small>上海规则</small></div>'+
        '<div class="leo-start-sub">六六陪你打牌 · 启发式 AI 队友与对手 · 教练模式</div>'+
      '</div>'+
    '</div>'+
    '<div style="margin-top:12px"><button onclick="window.__start()">开始游戏</button>'+
    '<button class="minor" style="margin-left:10px" onclick="window.__openSet()">⚙ 设置</button></div>';
}
new MutationObserver(applyStartScreen).observe(oc,{childList:true});
applyStartScreen();
})();

</script>
</body>
</html>
