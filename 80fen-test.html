      ok('台面20分该毙', E.effSuit(rich.cards[0],T)==='T');
    }
    // 2b. 甩牌可被同张数将牌整体压制(引擎一直支持,旧版 AI 从不生成这个候选)
    {
      const thr=[C('H',14),C('H',13),C('H',7)];                 // 三单张甩牌,带10分
      const hand=[C('S',9),C('S',8),C('S',7),C('D',3),C('D',4),C('C',5)];
      const ch=E.aiChooseFollow({seat:2,declSeat:0,hand,trump:T,history:[],buriedKnown:[]},
                                [{seat:1,cards:thr}]);
      ok('带分甩牌会被将牌毙', ch.cards.every(c=>E.effSuit(c,T)==='T')
         && E.resolveTrick([{seat:1,cards:thr},{seat:2,cards:ch.cards}],T).winner===2);
      const thr2=[C('H',14),C('H',14),C('H',7)];                // 一对+一单张
      const h2=[C('S',9),C('S',9),C('S',7),C('D',3),C('C',5)];
      const c2=E.aiChooseFollow({seat:2,declSeat:0,hand:h2,trump:T,history:[],buriedKnown:[]},
                                [{seat:1,cards:thr2}]);
      ok('毙甩牌时结构要对上(对配对、单配单)',
         E.isLegalFollow(h2,E.classify(thr2,T),c2.cards,T)
         && E.resolveTrick([{seat:1,cards:thr2},{seat:2,cards:c2.cards}],T).winner===2);
    }
    // 2c. 毙牌存活率:对手要盖过我,他也得先在领出门断门
    {
      const hand=[C('S',9),...pad(10)];
      const X=E.followCtx({seat:2,declSeat:0,hand,trump:T,history:[],buriedKnown:[]},
                          [{seat:1,cards:[C('H',9)]}]);
      const pRuff=E.pSurvive(X,E.classify([C('S',9)],T),[3]);
      ok('毙牌存活率不再被低估', pRuff>0.6);
    }
    // 3. 手持 A,K,10 被对手领 A 压死 → 出10,留 A+K 以后一起撒
    {
      const ch=E.aiChooseFollow({seat:2,declSeat:1,hand:[C('H',14),C('H',13),C('H',10),...pad(15)],
                                 trump:T,history:[],buriedKnown:[]},[{seat:1,cards:[C('H',14)]}]);
      ok('副门被压死时出10留A+K', ch.cards.length===1&&ch.cards[0].rank===10);
    }
    // 4. 队友暂大(非钢板)且后有对手 → 不无脑贴10;队友钢板且我末手 → 该贴
    {
      const hand=()=>[C('H',10),C('H',4),...pad(16)];
      const risky=E.aiChooseFollow({seat:3,declSeat:1,hand:hand(),trump:T,history:[],buriedKnown:[]},
                                   [{seat:1,cards:[C('H',9)]},{seat:2,cards:[C('H',3)]}]);
      ok('队友仅暂大时不贴10', E.countPoints(risky.cards)===0);
      const safe=E.aiChooseFollow({seat:0,declSeat:2,hand:hand(),trump:T,history:[],buriedKnown:[]},
                                  [{seat:2,cards:[C('H',14)]},{seat:3,cards:[C('H',3)]},{seat:1,cards:[C('H',6)]}]);
      ok('队友稳赢且我末手该贴10', E.countPoints(safe.cards)===10);
    }
    // 5. pSurvive:钢板的存活率必须高于小牌
    {
      const view={seat:0,hand:[C('H',2)],trump:T,history:[],buriedKnown:[]};
      const X=E.followCtx({...view,hand:[C('H',2),...pad(10)]},[{seat:3,cards:[C('H',14)]}]);
      const pA=E.pSurvive(X,{type:'single',suit:'H',top:E.ordIdx(C('H',14),T)},[1]);
      const p9=E.pSurvive(X,{type:'single',suit:'H',top:E.ordIdx(C('H',9),T)},[1]);
      ok('存活概率:A 显著高于 9', pA>0.8&&p9<0.3);
    }
    // 6. 扣底:绝不埋主、短门整门埋掉造缺
    {
      const hand=[...P('S',14),...P('S',13),C('S',12),C('S',11),C('S',9),C('S',2),C('X',16),C('X',15),
                  C('H',14),C('H',13),C('H',10),C('H',9),C('H',7),C('H',5),C('H',3),C('H',4),C('H',6),
                  C('D',4),C('D',6),
                  C('C',8),C('C',7),C('C',6),C('C',5),C('C',4),C('C',3),C('C',2),C('C',9),C('C',10),
                  C('C',11),C('C',12),C('C',14),C('C',13)];
      const b=E.aiDiscard(hand,T);
      ok('扣底:8张', b.length===8);
      ok('扣底:绝不埋主', b.every(c=>E.effSuit(c,T)!=='T'));
      ok('扣底:两张的短门整门埋掉造缺', b.filter(c=>c.suit==='D').length===2);
    }
    // 6b. 断门价值必须真的驱动决策:四张的门,预算够就该整门埋掉造缺。
    //     (断门是集合性质、只在最后一张兑现,若不把价值摊到每张上,贪心根本看不见这个台阶)
    {
      const h=[C('S',14),C('S',13),C('S',12),C('S',11),C('S',9),C('S',2),C('X',16),
               C('H',14),C('H',13),C('H',10),C('H',9),C('H',7),C('H',5),C('H',3),C('H',4),C('H',6),
               C('D',4),C('D',6),C('D',9),C('D',11),
               C('C',8),C('C',7),C('C',6),C('C',5),C('C',4),C('C',3),C('C',2),C('C',9),C('C',10),
               C('C',11),C('C',12),C('C',14),C('C',13)];
      const keep=E.AIP.voidValue;
      const nD=v=>{E.AIP.voidValue=v; const r=E.aiDiscard(h,T).filter(c=>c.suit==='D').length;
                   E.AIP.voidValue=keep; return r;};
      ok('扣底:四张的门在预算内会被整门埋掉', nD(46)===4);
      ok('扣底:断门价值调低则不再造缺(说明这个参数真的在起作用)', nD(10)<4);
    }
    // 7. 超几何外推自带收缩:第1张就是主,也不该外推成满手主
    {
      ok('projectLen 小样本收缩', E.projectLen(1,1,36)<10 && E.projectLen(17,25,36)===17);
    }
    // 7b. 阶梯目标:0/40/80/120/160/200 每条线附近都该敏感,不是只认 80
    {
      const w=d=>E.pointWeight(d,200-d);
      ok('阶梯:临界线是一整排', E.SCORE_LADDER.join()==='0,40,80,120,160,200');
      ok('阶梯:35分(逼近40线)不比80线迟钝', w(35)>=w(80)*0.9);
      ok('阶梯:胜负已定时权重回落', w(200)<w(100));
    }
    // 8. 亮主打分:强牌该亮、烂牌不该亮;队友坐庄比对手坐庄更保守
    {
      const mk=o=>({vis:[],seat:0,trumpRank:2,curDecl:null,dealerKnown:true,dealer:1,
                    firstTaker:0,gates:[],levels:[2,2],...o});
      const strong=[C('S',2),C('S',5),C('S',7),C('S',9),C('S',11),C('S',13),C('X',16),C('H',3),C('D',4),C('C',6)];
      const weak=[C('S',2),C('H',3),C('H',5),C('D',7),C('D',9),C('C',11),C('C',13),C('C',4),C('D',6),C('H',8)];
      ok('亮主:强牌越门槛', E.aiDeclDecide(mk({vis:strong})).pass===true);
      ok('亮主:烂牌不越门槛', E.aiDeclDecide(mk({vis:weak})).pass===false);
      const mate=E.aiDeclDecide(mk({vis:strong,dealer:2})), opp=E.aiDeclDecide(mk({vis:strong,dealer:1}));
      ok('亮主:队友坐庄不高于对手坐庄', mate.score<=opp.score);
      ok('亮主:无庄盘门槛低于有庄盘',
         E.declThreshold({vis:weak,dealerKnown:false})<E.declThreshold({vis:weak,dealerKnown:true}));
      // 造反动力:对手已亮 > 无人亮 > 队友已亮
      const base={vis:strong,dealerKnown:true,dealer:1,seat:0,trumpRank:2,
                  gates:[],levels:[2,2],firstTaker:0};
      const o2={suit:'S',strength:2};
      const vsOpp=E.scoreDeclOption({...base,curDecl:{seat:1,suit:'H',strength:1}},o2).score;
      const vsNone=E.scoreDeclOption({...base,curDecl:null},o2).score;
      const vsMate=E.scoreDeclOption({...base,curDecl:{seat:2,suit:'H',strength:1}},o2).score;
      ok('造反动力:对手已亮 > 无人亮 > 队友已亮', vsOpp>vsNone && vsNone>vsMate);
      // 必打关卡:对手卡关时更愿意亮/反
      const gated=E.scoreDeclOption({...base,curDecl:null,gates:[2,5,10,13],levels:[2,2]},o2).score;
      ok('必打关卡提高扰乱意愿', gated>vsNone)
    }
    // 3b. 从出牌方式反推缺门:硬演绎,不是概率
    {
      const base=[C('S',9),C('S',8),C('D',3),C('D',5),C('C',6),C('C',7),C('C',9),C('D',8)];
      // 东(座1)领 HA、西(座3,东的队友)跟了张不带分的 HQ ——
      // 队友暂大却没贴分 ⇒ 他本门既没有分牌,也没有比 Q 更小的废牌
      const hist=[{seat:1,cards:[C('H',14)]},{seat:2,cards:[C('H',3)]},
                  {seat:3,cards:[C('H',12)]},{seat:0,cards:[C('H',4)]}];
      const view={seat:2,declSeat:0,hand:[C('H',13),C('H',13),C('H',10),C('H',10),...base],
                  trump:T,history:hist,buriedKnown:[]};
      const mem=E.makeMemory(view);
      const withRead=E.maxHoldIn(E.makeReads(hist,T),mem,3,'H',T);
      const noRead=E.maxHoldIn(E.makeReads([],T),mem,3,'H',T);
      ok('出牌方式反推:持有上界大幅收紧', withRead<=3 && noRead>10);
      const pv=E.makeVoidProb(E.makeReads(hist,T),mem,T,view.hand.length);
      ok('出牌方式反推:断门概率显著抬升', pv(3,'H')>0.6);
      // 队友暂大时用贴分序、否则用最便宜序 —— 两条序不能混用
      ok('贴分序:分牌排在废牌之前', E.dumpKey(C('H',10),T)<E.dumpKey(C('H',3),T));
      ok('最便宜序:分牌排在废牌之后', E.cheapKey(C('H',10),T)>E.cheapKey(C('H',3),T));
      // 领出多张时不采信(义务约束下他出什么未必是他想出什么)
      const pairHist=[{seat:1,cards:[C('H',14),C('H',14)]},{seat:2,cards:[C('H',3),C('H',3)]},
                      {seat:3,cards:[C('H',12),C('H',11)]},{seat:0,cards:[C('H',4),C('H',5)]}];
      const r2=E.makeReads(pairHist,T);
      ok('领出多张时不做此推断', !r2.fCheap[3]['H'] && !r2.fDump[3]['H']);
    }
    // 8b. 亮单 vs 亮对:信心足该锁死,信心不足才试探留后手
    {
      const mk=o=>({vis:[],seat:0,trumpRank:2,curDecl:null,dealerKnown:true,dealer:1,
                    firstTaker:0,gates:[],levels:[2,2],...o});
      const conf=[C('S',2),C('S',2),C('S',7),C('S',9),C('S',11),C('S',13),C('S',14),C('X',16),C('H',3),C('D',4)];
      const soft=[C('S',2),C('S',2),C('S',7),C('S',9),C('H',11),C('H',13),C('C',14),C('D',5),C('H',3),C('D',4)];
      const both=E.declOptions(conf,2).filter(o=>o.suit==='S');
      ok('有对时同时提供亮单与亮对', both.length===2&&both.some(o=>o.strength===1)&&both.some(o=>o.strength===2));
      const pick=v=>{const c=mk({vis:v});
        return E.scoreDeclOption(c,{suit:'S',strength:2}).score
             > E.scoreDeclOption(c,{suit:'S',strength:1,hasPair:true}).score ? '对':'单';};
      ok('信心足选亮对', pick(conf)==='对');
      ok('信心不足选亮单试探', pick(soft)==='单');
    }
    // 8c. 无将 + 级数是分牌:不减半,闲家还要再加;无庄盘无将仍拿抢摊红利
    {
      const mk=o=>({vis:[C('X',16),C('X',16),C('S',10),C('H',10),C('D',14),C('C',14),
                         C('H',13),C('S',13),C('D',9),C('C',8)],
                    seat:0,curDecl:null,firstTaker:0,gates:[],levels:[2,2],...o});
      const NTo={suit:null,strength:4};
      const ptDef=E.scoreDeclOption(mk({trumpRank:10,dealerKnown:true,dealer:1}),NTo).score;
      const ptDecl=E.scoreDeclOption(mk({trumpRank:10,dealerKnown:true,dealer:0}),NTo).score;
      const plain=E.scoreDeclOption(mk({trumpRank:7,dealerKnown:true,dealer:1}),NTo).score;
      ok('无将:级数是分牌时加成显著', ptDef-plain>25);
      ok('无将:闲家的加成高于庄家方', ptDef>ptDecl);
      const noDealer=E.scoreDeclOption(mk({trumpRank:7,dealerKnown:false,dealer:-1}),NTo).score;
      ok('无将:无庄盘仍拿抢摊红利', noDealer>plain+40);
      // 有主的抢摊红利要高于无将
      const sOpt={suit:'S',strength:1};
      const gS=E.scoreDeclOption(mk({trumpRank:7,dealerKnown:false,dealer:-1}),sOpt).score
              -E.scoreDeclOption(mk({trumpRank:7,dealerKnown:true,dealer:1}),sOpt).score;
      const gN=noDealer-plain;
      ok('抢摊红利:有主高于无将', gS>gN);
    }
    // 9. globalIdx:主牌恒高于任何副牌
    ok('globalIdx 主牌恒高于副牌', E.globalIdx(C('S',3),T)>E.globalIdx(C('H',14),T));
    // 10. easeEnds:中间平缓、两头陡峭
    {
      const g=E.easeEnds, mid=g(0.55)-g(0.45), end=g(0.10)-g(0.0);
      ok('easeEnds 两头比中间陡', end>mid && Math.abs(g(0.5)-0.5)<1e-9 && g(0)===0);
    }
  }

  // 启发式优于随机:同样的局,聪明防守方比随机防守方抓分更多(均值)
  {
    let smartSum=0,randSum=0,n=0;
    for(let s=1;s<=120;s++){
      const r1=E.simulateRound(s,[0,2]);       // 南北聪明
      const r0=E.simulateRound(s,[]);          // 全随机
      if(r1&&r0&&r1.declSeat%2===1&&r0.declSeat%2===1){ smartSum+=r1.defPoints; randSum+=r0.defPoints; n++; }
    }
    ok(`启发式防守优于随机(${(smartSum/n).toFixed(0)} vs ${(randSum/n).toFixed(0)} 分,${n}局)`,
       n>10 && smartSum>randSum);
  }

  let simOK=true, played=0, nt=0;
  for(let s=1;s<=40;s++){
    try{
      const r=E.simulateRound(s);
      if(r){ played++; if(r.noTrump)nt++;
        if(r.total<0||r.tricks<13) simOK=false; }
    }catch(e){ simOK=false; }
  }
  ok('40局全AI模拟无崩溃(含'+nt+'局无主)', simOK&&played>30);

  return {pass,fail,out};
}
if(typeof module!=='undefined'){ module.exports.runTests=runTests; }
</script>

<script>
/* ============================================================
 * 界面层 —— 只调用引擎公开函数
 * ============================================================ */
(function(){
if(typeof document==='undefined') return;
if(location.hash==='#test'){
  document.getElementById('app').style.display='none';
  const el=document.getElementById('tests'); el.style.display='block';
  const {pass,fail,out}=runTests(ENGINE);
  el.innerHTML=`<h1 class="${fail?'fail':'pass'}">${pass} 通过,${fail} 失败</h1>`+
    out.map(t=>`<div class="${t.cond?'pass':'fail'}">${t.cond?'✓':'✗'} ${t.name}</div>`).join('');
  return;
}

// ---- 术语(全国版/沪语版) ----
const TERMS_CN={bigJoker:'大王',smallJoker:'小王',trump:'主牌',noTrump:'无主',tractor:'拖拉机',
  throwP:'甩牌',ruff:'毙牌',discard:'垫牌',declare:'亮主',counter:'反主',reinforce:'加固',
  declareV:'亮',counterV:'反',   // 按钮上用的短动词,免得"亮主无主(大)"这种叠字
  bury:'扣底',lead:'领出',zheng:'正常主',fu:'副常主',voidSuit:'断门',openVoid:'开局断门',
  rankA:'A',rankK:'K',rankQ:'Q',rankJ:'J',levelUp:'升级',
  defenders:'闲家',tiaoji:'跳级',guangtou:'剃光头'};   // 闲家/跳级/剃光头:沪语全国通用
let useSH=true; try{ const v=localStorage.getItem('80fentest-lang'); if(v) useSH=v==='sh'; }catch(e){}
const T=k=>(useSH&&window.TERMS_SH&&window.TERMS_SH[k])||TERMS_CN[k]||k;

const SUIT_SYM={S:'♠',H:'♥',D:'♦',C:'♣'};
const SUIT_NAME={S:'黑桃♠',H:'红桃♥',D:'方块♦',C:'梅花♣'};
const SEAT_NAME=['南(你)','东','北(队友)','西'];
const HUMAN=0;
const typeName=t=>({single:'单张',pair:'对子',tractor:T('tractor'),throw:T('throwP')}[t]);
const rankName=r=>r===14?T('rankA'):r===13?T('rankK'):r===12?T('rankQ'):r===11?T('rankJ'):String(r);
let G=null, seedBase=Date.now()%100000, activeTab='score', replayMode=false, histBySuit=false;
let notes=[]; try{ notes=JSON.parse(localStorage.getItem('80fentest-notes')||'[]'); }catch(e){}

// ---- 音效(WebAudio 合成,无外部资源,可关) ----
let sndOn=true; try{ sndOn=localStorage.getItem('80fentest-snd')!=='off'; }catch(e){}
let _actx=null;
function beep(freq,dur=0.08,type='sine',gain=0.06,delay=0){
  if(!sndOn) return;
  try{
    _actx=_actx||new (window.AudioContext||window.webkitAudioContext)();
    const o=_actx.createOscillator(), g=_actx.createGain();
    o.type=type; o.frequency.value=freq;
    g.gain.setValueAtTime(gain,_actx.currentTime+delay);
    g.gain.exponentialRampToValueAtTime(0.001,_actx.currentTime+delay+dur);
    o.connect(g); g.connect(_actx.destination);
    o.start(_actx.currentTime+delay); o.stop(_actx.currentTime+delay+dur+0.02);
  }catch(e){}
}
const sndPlay=()=>beep(520,0.05,'triangle',0.05);
const sndWin =()=>{beep(660,0.09,'sine',0.06);beep(880,0.12,'sine',0.06,0.09);};
const sndLose=()=>beep(220,0.15,'sine',0.05);
const sndEnd =()=>{[523,659,784].forEach((f,i)=>beep(f,0.22,'sine',0.05,i*0.12));};
const sndOops=()=>beep(180,0.18,'square',0.04);

// ---- 对局设置(规则 + 节奏),见设置菜单 ----
// 引擎里的 RULES 是运行时真值;这里先快照出厂默认,玩家改动存进 S.rules 再套回 RULES。
// 只放真正被引用、且改了不会和发牌逻辑冲突的项:
// offsuitRankTractor/handSize 代码里没引用,kittySize/levelStart 改了会和 dealRound 的固定 8 张底牌冲突。
const RULE_DEFAULTS={
  pointRebelThreshold:RULES.pointRebelThreshold,
  trumpRebelThreshold:RULES.trumpRebelThreshold,
  maxRedeal:RULES.maxRedeal,
  strictTractorFollow:RULES.strictTractorFollow,
  partialTractorFollow:RULES.partialTractorFollow,
};
const S_DEFAULT={
  fullRebel:'off',   // 低分/少主:off=关闭 | redeal=仅重新发牌(不抢庄) | scramble=完全造反(双方抢庄)
  gatesOn:true,      // 必打关卡:跳级途中撞上就停在关卡上
  gates:[2,5,10,13], // 关卡级数(13=K)

  aiThinkMin:1.0,    // AI 出牌思考秒数(下限)
  aiThinkMax:3.0,    // AI 出牌思考秒数(上限)
  trickHold:3.0,     // 一墩出完后牌留桌秒数
  manualNext:false,  // true = 手动点击进入下一墩
  declWait:10.0,     // 发完牌后留给你亮主/反主的时间(秒),可点「不亮」提前结束
};
let S={...S_DEFAULT, gates:[...S_DEFAULT.gates], rules:{...RULE_DEFAULTS}};
try{
  const saved=JSON.parse(localStorage.getItem('80fentest-set')||'{}');
  Object.assign(S,saved);
  S.rules={...RULE_DEFAULTS,...(saved.rules||{})};   // 老存档没有 rules 字段时回落到出厂值
}catch(e){}
function applyRules(){ Object.assign(RULES,S.rules); }
applyRules();
function saveS(){ try{ localStorage.setItem('80fentest-set',JSON.stringify(S)); }catch(e){} }
// 秒 → 毫秒,顺手挡掉手输的空值/负数/非数字
const secs=(v,fallback)=>1000*Math.max(0,(typeof v==='number'&&isFinite(v))?v:fallback);
function aiThinkMs(){
  const lo=Math.max(0,+S.aiThinkMin||0), hi=Math.max(lo,+S.aiThinkMax||0);
  return 1000*(lo+Math.random()*(hi-lo));
}

  $('stCancel').onclick=()=>{

// 所以领出的差值先除以 LEAD_GAP_SCALE 再比,否则教练会对领出唠叨、对跟牌失明。
const GAP_THR={'高':6,'中':12,'低':22,'关':Infinity};

function cardHTML(c,cls=''){
  if(c.suit==='X'){
    return `<div class="card ${c.rank===16?'jb':'js'} ${cls}" data-id="${c.id}"><span class="joker">JOKER</span>`+
           `<span class="tl">${c.rank===16?'大':'小'}</span></div>`;
  }
  const sym=SUIT_SYM[c.suit];
  const rs=c.rank>10?{11:'J',12:'Q',13:'K',14:'A'}[c.rank]:String(c.rank);
  return `<div class="card s${c.suit} ${cls}" data-id="${c.id}">`+
    `<span class="tl">${rs}</span><span class="tr">${sym}</span>`+
    `<span class="bl">${sym}</span><span class="br">${rs}</span></div>`;
}
function miniName(c){
  if(c.suit==='X') return c.rank===16?T('bigJoker'):T('smallJoker');
  return SUIT_SYM[c.suit]+rankName(c.rank);
}
// 副花色按红黑相间排列(依主花色选择顺序)
const ALT_ORDER={S:['H','C','D'],H:['S','D','C'],C:['D','S','H'],D:['S','H','C'],
                 null:['S','H','C','D']};
function sortForDisplay(hand,trump){
  const alt=ALT_ORDER[trump&&trump.suit?trump.suit:null]||['S','H','C','D'];
  const suitOrd=s=>s==='T'?0:alt.indexOf(s)+1;
  return hand.slice().sort((a,b)=>{
    const sa=effSuit(a,trump),sb=effSuit(b,trump);
    if(sa!==sb) return suitOrd(sa)-suitOrd(sb);
    const oa=ordIdx(a,trump),ob=ordIdx(b,trump);
    if(oa!==ob) return ob-oa;
    // 同级的级数将牌(副常主;无主时各花色常主)ordIdx 相同 —— 再按花色归堆,免得散排
    return suitOrd(a.suit)-suitOrd(b.suit);
  });
}
function trumpLabel(t){ return t? (t.suit?`${SUIT_SYM[t.suit]} 打${rankName(t.rank)}`:`${T('noTrump')} 打${rankName(t.rank)}`) : '未定'; }
function log(t){ G.log.unshift({text:t}); }
function setMsg(t){ document.getElementById('msg').textContent=t||''; }
function curTrumpForSort(){ return G.trump|| (G.decl&&G.decl.suit?{suit:G.decl.suit,rank:G.trumpRank}:{suit:null,rank:G.trumpRank}); }

// ================= 整场状态(跨局) =================
// played:每队已坐庄守住过的最高级数,必打关卡的「打过」判据(见 advanceMatch)
let M={levels:[2,2], dealer:-1, round:0, played:[-1,-1]};
let scrambleNext=false;   // 下一次发牌是否按无庄盘(完全造反后)
let redealCount=0;        // 本局已重新发牌次数
// 无庄盘里各家按自己队伍的级数抢亮;庄定盘全桌用庄家级数
function rankOf(seat){ return G.dealerKnown?G.trumpRank:M.levels[seat%2]; }

// ================= 开局:(首盘切牌定先)→ 逐张发牌抢亮 =================
function newRound(){
  // 上一盘可能还有在途的定时器(AI 思考 / 收墩 / 亮主倒计时),不清掉会打到新一盘的局面上
  if(G){ clearTimeout(G.aiTimer); clearTimeout(G.holdTimer); clearTimeout(G.declTimer);
         clearInterval(G.declTick); }
  const seed=seedBase++;
  const dealerKnown=M.dealer>=0 && !scrambleNext;   // 完全造反重发 → 本盘按无庄盘抢庄
  scrambleNext=false;
  let first, cutsLog='';
  if(dealerKnown){
    first=M.dealer;                      // 庄定盘:庄家先拿牌
  }else{
    const c=cutForFirst(seed); first=c.first;
    cutsLog=`切牌定先:${[0,1,2,3].map(s=>`${SEAT_NAME[s].slice(0,1)}${miniName(c.cuts[s])}`).join(' ')} → ${SEAT_NAME[first]} 先拿牌`;
  }
  const deal=dealRound(seed,first);
  // 无庄盘各家按自己级数抢亮,这里先按先拿牌者的级数起头,谁亮到就换成谁的(见 rankOf)
  const trumpRank=dealerKnown?M.levels[M.dealer%2]:M.levels[first%2];
  G={seed,firstTaker:first,trumpRank,dealerKnown,
     hands:deal.hands,kittyOrig:deal.kitty,buried:[],
     trump:null,declSeat:dealerKnown?M.dealer:-1,
     decl:null,rebelHappened:false,
     visCount:[0,0,0,0],dealt:0,
     leader:-1,trick:[],trickNo:0,tricks:[],defPoints:0,capturedCards:[],lastWinner:-1,
     lastLeadSize:1,phase:'dealing',selected:new Set(),log:[],awaitNext:false,
     aiTimer:null,holdTimer:null,declTimer:null,declTick:null,declDeadline:0,
     coachNotes:[],coachChat:[],hintCards:null,quiz:null};
  if(cutsLog) log(cutsLog);
  if(dealerKnown) log(`第${M.round+1}局:${SEAT_NAME[M.dealer]} 坐庄,打${rankName(trumpRank)}(${T('counter')}只改主色,不易庄不拿底)`);
  render(); setMsg('发牌中…可随时'+T('declare')+'/'+T('counter'));
  dealTick();
}

function visHand(s){ return G.hands[s].slice(0,G.visCount[s]); }

// 发完牌后的亮主窗口:牌桌中心走秒,让人知道还剩多久,而不是干等
function startDeclCountdown(){
  const total=secs(S.declWait,S_DEFAULT.declWait);
  G.declDeadline=Date.now()+total;
  const paint=()=>{
    if(!G||G.phase!=='finalDecl') return;
    const left=Math.max(0,Math.ceil((G.declDeadline-Date.now())/1000));
    setMsg(`发牌完毕 —— 还有 ${left} 秒${T('declare')}/${T('counter')},点「不${T('declareV')}」可立即开始`);
  };
  paint();
  clearInterval(G.declTick);
  G.declTick=total>0?setInterval(paint,250):null;
  clearTimeout(G.declTimer);
  // 存下句柄:玩家点「不亮」时要能取消这个定时器提前结算
  G.declTimer=setTimeout(settleTrump,total);
}
function stopDeclCountdown(){ clearInterval(G.declTick); G.declTick=null; }

function dealTick(){
  if(G.phase!=='dealing') return;
  if(G.dealt>=100){ G.phase='finalDecl'; render();
    startDeclCountdown(); return; }
  const seat=(G.firstTaker+G.dealt)%4;
  G.visCount[seat]++; G.dealt++;
  if(seat!==HUMAN) aiDeclThink(seat);
  if(G.dealt%4===0||G.dealt>=100) render();
  setTimeout(dealTick,120);   // 100张 × 120ms ≈ 12秒发完
}

// AI 抢亮决策(基于已见手牌)—— 打分与门槛在 AI 层的 aiDeclDecide,这里只负责取上下文与执行
function aiDeclThink(seat){
  const vis=visHand(seat);
  const rand=rng(G.seed*13+G.dealt);
  const ctx={
    vis, seat, trumpRank:rankOf(seat), curDecl:G.decl,
    dealerKnown:G.dealerKnown, dealer:M.dealer, firstTaker:G.firstTaker,
    gates:S.gatesOn?S.gates:[], levels:M.levels,
  };
  // 加固:当初亮单张是「信心不足先试一手」,现在牌拿多了信心是否已经够把它锁死?
  // 用同一把尺子比较「亮对」与「维持单张」的分差,而不是一律加固。
  if(canReinforce2(G.decl,seat,vis,rankOf(seat),G.rebelHappened)){
    const asPair=scoreDeclOption(ctx,{suit:G.decl.suit,strength:2}).score;
    const asSingle=scoreDeclOption(ctx,{suit:G.decl.suit,strength:1,hasPair:true}).score;
    if(asPair>asSingle&&rand()<0.9){
      applyDecl(seat,{suit:G.decl.suit,strength:2},true); return;
    }
  }
  const d=aiDeclDecide(ctx);
  if(!d) return;
  // 分数越过门槛越多,越果断;贴着门槛则留一点随机,避免四家行为整齐划一
  const margin=d.score-d.threshold;
  if(margin<0) return;
  if(rand()<Math.min(0.95,0.45+margin/40)) applyDecl(seat,d.opt,false);
}

function applyDecl(seat,opt,isReinforce){
  if(!G.dealerKnown) G.trumpRank=rankOf(seat);   // 无庄盘:主牌级数跟着亮主者走
  G.decl={seat,suit:opt.suit,strength:opt.strength};
  // 亮出的级数牌/王对立即在桌上可见
  const vis=visHand(seat);
  G.declCards={seat, cards: opt.suit
    ? vis.filter(c=>c.suit===opt.suit&&c.rank===G.trumpRank).slice(0,opt.strength)
    : vis.filter(c=>c.rank===(opt.strength===4?16:15)).slice(0,2)};
  if(opt.strength>=3) G.rebelHappened=true;
  if(isReinforce) log(`${SEAT_NAME[seat]} ${T('reinforce')}:${SUIT_SYM[opt.suit]} 单张→一对`);
  else if(opt.suit===null) log(`${SEAT_NAME[seat]} ${opt.strength===4?T('bigJoker'):T('smallJoker')}对${T('counter')} → ${T('noTrump')}`);
  else log(`${SEAT_NAME[seat]} ${T('declare')} ${SUIT_SYM[opt.suit]}${opt.strength===2?'(一对)':''}`);
  render();
}

// 发牌结束:定主(庄定盘庄家不变;无庄盘最终亮主者坐庄拿底)
// 「不亮」:放弃剩余等待时间,立刻定主
window.__skipDecl=()=>{
  if(!G||G.phase!=='finalDecl') return;
  clearTimeout(G.declTimer); G.declTimer=null;
  settleTrump();
};

function settleTrump(){
  if(G.phase!=='finalDecl'&&G.phase!=='dealing') return;   // 防「不亮」和到点结算重复触发
  clearTimeout(G.declTimer); G.declTimer=null;
  stopDeclCountdown();
  G.trump={suit:G.decl?G.decl.suit:null,rank:G.trumpRank};
  G.declSeat=dealerAfterDecl({dealerKnown:G.dealerKnown, dealer:M.dealer,
                              declSeat:G.decl?G.decl.seat:-1, firstTaker:G.firstTaker});
  if(G.dealerKnown){
    log(G.decl?`定${T('trump')}:${trumpLabel(G.trump)}(庄家仍是 ${SEAT_NAME[G.declSeat]})`
              :`无人${T('declare')} → ${T('noTrump')},庄家仍是 ${SEAT_NAME[G.declSeat]}`);
  }else{
    log(G.decl?`定${T('trump')}:${trumpLabel(G.trump)},${SEAT_NAME[G.declSeat]} 坐庄`
              :`无人${T('declare')} → ${T('noTrump')},${SEAT_NAME[G.declSeat]} 坐庄`);
  }
  lowRebelPhase();
}

// 低分/少主:按设置决定是关闭、仅重新发牌,还是完全造反(重发 + 双方抢庄)
const rebelName=()=>S.fullRebel==='redeal'?'重新发牌':`完全${T('counter')}(重新发牌,双方抢庄)`;
function lowRebelPhase(){
  if(S.fullRebel==='off'){ afterTrumpSet(); return; }
  const my=canFullRebel(G.hands[HUMAN],G.trump);
  if(my.ok){
    G.phase='lowrebel'; render();
    const why=[my.byPts?`仅 ${my.pts} 分(≤${RULES.pointRebelThreshold})`:'',
               my.byTrump?`${T('trump')}仅 ${my.nT} 张(≤${RULES.trumpRebelThreshold})`:'']
              .filter(Boolean).join('、');
    setMsg(`你手牌${why},可${rebelName()}`);
    return;
  }
  aiLowRebel();
}
function humanLowRebel(yes){
  if(yes){ log(`你手牌太弱,${rebelName()}`); doRebel(); }
  else aiLowRebel();
}
function aiLowRebel(){
  const rand=rng(G.seed*17+5);
  for(let s=1;s<4;s++){
    const r=canFullRebel(G.hands[s],G.trump);
    if(r.ok && s%2!==G.declSeat%2 && rand()<0.7){
      log(`${SEAT_NAME[s]} ${r.byPts?'手牌分数不足':T('trump')+'太少'},${rebelName()}`);
      doRebel(); return;
    }
  }
  afterTrumpSet();
}
// 两种模式都重新发牌;完全造反模式下新的一盘按无庄盘处理(各家按自己级数抢庄拿底)
function doRebel(){
  if(redealCount>=RULES.maxRedeal){       // 连续重发太多次就直接开打,免得卡死
    log(`已重新发牌 ${redealCount} 次,本局直接开打`);
    afterTrumpSet(); return;
  }
  redealCount++;
  scrambleNext=(S.fullRebel==='scramble');
  G.phase='redealing'; render();
  setMsg('重新发牌…');
  setTimeout(newRound,1200);
}

function afterTrumpSet(){
  G.leader=G.declSeat;
  G.hands[G.declSeat].push(...G.kittyOrig);
  if(G.declSeat===HUMAN){
    G.phase='kitty'; G.selected.clear();
    setMsg(`你是庄家:选 ${RULES.kittySize} 张牌${T('bury')}`); render();
  }else{
    G.buried=aiDiscard(G.hands[G.declSeat],G.trump);
    G.buried.forEach(c=>removeCard(G.hands[G.declSeat],c));
    G.phase='play'; snapshotHands(); render();
    setMsg(`${SEAT_NAME[G.declSeat]} 是庄家`);
    setTimeout(step,900);
  }
}

function buryKitty(){
  if(G.selected.size!==RULES.kittySize){ setMsg(`需要恰好 ${RULES.kittySize} 张,当前 ${G.selected.size} 张`); return; }
  G.buried=G.hands[HUMAN].filter(c=>G.selected.has(c.id));
  G.hands[HUMAN]=G.hands[HUMAN].filter(c=>!G.selected.has(c.id));
  G.selected.clear(); G.phase='play'; snapshotHands();
  log(`你已${T('bury')}`); render();   // render() 会把"本墩:你 领出,等待出牌…"写进牌桌中心,不用再单独提示
  step();
}

// 开打瞬间存一份四家手牌,供局末复盘回看(局中不给看,免得成了透视)
function snapshotHands(){ G.initialHands=G.hands.map(h=>h.slice()); }

// ================= 出牌循环 =================
// step() 可能被重复调用(典型:收墩后排的 setTimeout(step,400) 还没跑,玩家已抢先出牌
// 又走了一次 playCards→step)。若不加约束,同一个座位会被排两次 AI 出牌 —— 那一手就重复出,
// 表现为座位顺序错乱、一墩挤进 5 张、四家手牌张数不等。
// 两道保险:① 排新的 AI 之前先撤掉上一个待执行的;② 回调真正执行时复核局面没被推进过。
function step(){
  if(G.phase!=='play') return;
  if(G.trick.length===4){ finishTrick(); return; }
  const seat=(G.leader+G.trick.length)%4;
  clearTimeout(G.aiTimer); G.aiTimer=null;
  if(seat===HUMAN){ render(); return; }   // 轮到谁由 render() 里的本墩领出信息 + 名字高亮体现,不再单独提示
  render();
  const trickNoAtSchedule=G.trickNo, posAtSchedule=G.trick.length;
  G.aiTimer=setTimeout(()=>{
    G.aiTimer=null;
    // 过期校验:排这一手之后局面若已被推进(换墩/别人先出了/已满),这次回调作废
    if(G.phase!=='play'||G.trickNo!==trickNoAtSchedule||G.trick.length!==posAtSchedule) return;
    if((G.leader+G.trick.length)%4!==seat) return;
    const view=viewFor(seat);
    let cards, reason='';
    if(G.trick.length===0){
      const ch=aiChooseLead(view);
      cards=ch.cards; reason=ch.reason;
      const chk=checkThrow(G.hands,seat,cards,G.trump);
      if(!chk.ok) cards=chk.forced;
    }else{
      const lead=classify(G.trick[0].cards,G.trump);
      const ch=aiChooseFollow(view,G.trick);
      cards=ch.cards; reason=ch.reason;
      if(!isLegalFollow(G.hands[seat],lead,cards,G.trump))
        cards=genFollow(G.hands[seat],lead,G.trump,rng(G.seed+G.trickNo));
    }
    G.lastReasons=G.lastReasons||{}; G.lastReasons[seat]=reason;  // 教练模式(M5)复用
    playCards(seat,cards);
  },aiThinkMs());
}

function humanPlay(){
  // 不能只靠按钮 disabled 把关 —— 渲染有时差,漏一手就会插到别人的顺位里
  if(G.phase!=='play'||G.trick.length>=4||(G.leader+G.trick.length)%4!==HUMAN) return;
  const sel=G.hands[HUMAN].filter(c=>G.selected.has(c.id));
  if(!sel.length){ setMsg('请先选牌'); return; }
  if(G.trick.length===0){
    const cl=classify(sel,G.trump);
    if(!cl){ setMsg(T('lead')+`必须是同一门(${T('trump')}算一门)`); return; }
    if(cl.type==='throw'){
      // 「这明明是拖拉机,为什么算甩牌」—— 报障过一次(6677),但引擎侧全牌型扫描没能复现。
      // 把判成甩牌的**拆解结果**打进出牌记录,下次再遇到就能直接看出是哪一组没接上。
      const TN={single:'单张',pair:'对子',tractor:'拖拉机'};
      log(`判定为${T('throwP')}:拆成 ${cl.comps.length} 组 —— `+
          cl.comps.map(x=>`${TN[x.type]||x.type}(${x.cards.map(c=>miniName(c)).join('')})`).join(' + ')+
          `。拖拉机要求两组在**当前牌序**里紧邻(级牌已从牌序里抽走,主门里正副级牌与大小王另算一档)`);
      const chk=checkThrow(G.hands,HUMAN,sel,G.trump);
      if(!chk.ok){
        log(`${T('throwP')}失败!被迫只出最小的一组(不罚分)`);
        setMsg(T('throwP')+'失败,只出最小的一组');
        G.selected.clear(); playCards(HUMAN,chk.forced); return;
      }
      log(T('throwP')+'成功');
    }
  }else{
    const lead=classify(G.trick[0].cards,G.trump);
    if(!isLegalFollow(G.hands[HUMAN],lead,sel,G.trump)){
      setMsg(`不合法:需出 ${lead.cards.length} 张;有本门必须跟,门内有对必对`);
      return;
    }
  }
  // ---- 教练:失误反馈(同一评分标尺对比) ----
  if(C.on && GAP_THR[C.gapSens]<Infinity && G.phase==='play'){
    const view=viewFor(HUMAN);
    let best,hs;
    const isLead=G.trick.length===0;
    if(isLead){ best=aiChooseLead(view); hs=coachScoreLead(view,sel); }
    else{ best=aiChooseFollow(view,G.trick); hs=coachScoreFollow(view,G.trick,sel); }
    const sameCards=best.cards.length===sel.length&&
      best.cards.every(c=>sel.some(x=>x.id===c.id));
    const gap=sameCards?0:(best.score-hs)/(isLead?LEAD_GAP_SCALE:1);
    if(gap>GAP_THR[C.gapSens]){
      const no=G.tricks.length+1;
      G.coachNotes.push({no,my:sel.slice(),best:best.cards.slice(),gap,reason:best.reason});
      if(C.strict && gap>GAP_THR[C.gapSens]*1.6 &&
         !confirm(`教练:更好的是 ${desc(best.cards)} —— ${best.reason}\n仍要出这手吗?`)) return;
      sndOops();
      // 不再弹到牌桌中心,记进教练页签的对话历史(见 renderCoachTab)
      G.coachChat.push({no,html:`⚠️ 你出 ${desc(sel)},更好的是 <b>${desc(best.cards)}</b> — ${best.reason}`});
      log(`教练(第${no}墩):你出 ${desc(sel)},建议 ${desc(best.cards)} — ${best.reason}`);
    }
  }
  G.selected.clear(); G.hintCards=null;
  playCards(HUMAN,sel);
}

// ---- 教练:问教练(四步框架 + 关键墩提问引导) ----
function askCoach(){
  if(!C.on||G.phase!=='play') return;
  if((G.leader+G.trick.length)%4!==HUMAN||G.trick.length>=4) return;
  const view=viewFor(HUMAN);
  const following=G.trick.length>0;
  const adv=following?aiChooseFollow(view,G.trick):aiChooseLead(view);
  const mem=makeMemory(view);
  const t=G.trump;
  // 提问引导:台面有分或跟主时,先考记牌再揭晓
  const ptsTable=following?countPoints(G.trick.flatMap(p=>p.cards)):0;
  const isKey=following&&(ptsTable>=10||classify(G.trick[0].cards,t).suit==='T');
  const buildAdvice=()=>{
    const lines=[];
    if(following){
      const lead=classify(G.trick[0].cards,t);
      const sn=lead.suit==='T'?T('trump'):SUIT_NAME[lead.suit];
      lines.push(`<span class="coachStep">① 义务</span> 跟 ${lead.cards.length} 张;有${sn}必须跟,门内有对必对`);
      lines.push(`<span class="coachStep">② 候选</span> `+adv.cands.map(c=>`${desc(c.cards)}(${c.reason},${c.score.toFixed(0)}分)`).join(' / '));
      const ctx=adv.ctx;
      const mx=maxUnseenIdx(mem,lead.suit,t);
      lines.push(`<span class="coachStep">③ 确定性</span> ${ctx.partnerWinning?(ctx.curBoss?'队友稳赢——在外已无更大':'队友只是暂大,后手还有对手'):'对手暂大'};${sn}在外最大约位次 ${mx<0?'(已出尽)':mx}`);
      lines.push(`<span class="coachStep">④ 价值</span> 台面 ${ctx.ptsTable} 分${ctx.isLast?';你是最后一手,结果确定':''}`);
    }else{
      lines.push(`<span class="coachStep">① 义务</span> 你${T('lead')},可任选一门`);
      lines.push(`<span class="coachStep">② 候选</span> `+adv.cands.map(c=>`${desc(c.cards)}(${c.reason},${c.score.toFixed(0)}分)`).join(' / '));
      lines.push(`<span class="coachStep">③④</span> 优先钢板收墩、避免白送分、大主牌留后手`);
    }
    lines.push(`<b style="color:#6ec9ff">建议:${desc(adv.cards)}</b> —— ${adv.reason}`);
    return lines.map(l=>`<div>${l}</div>`).join('');
  };
  const no=G.tricks.length+1;
  if(C.quiz&&isKey){
    const lead=classify(G.trick[0].cards,t);
    const myBest=Math.max(-1,...G.hands[HUMAN].filter(c=>effSuit(c,t)===lead.suit).map(c=>ordIdx(c,t)));
    let n=0;
    for(const k in mem.unseen){ if(mem.unseen[k]<=0) continue;
      const c=(k=>{const i=k.indexOf(':');return{suit:k.slice(0,i),rank:+k.slice(i+1)};})(k);
      if(effSuit(c,t)===lead.suit&&ordIdx(c,t)>myBest) n+=mem.unseen[k]; }
    G.quiz={no,answer:Math.min(n,3), advice:buildAdvice(),
      q:`先考你:这一门里,在外还有几张比你手中最大的更大?`};
  }else{
    G.quiz=null;
    // 直接记进对话历史(教练页签),不留"当前建议"这个单独状态,历史列表本身就显示最新一条
    G.coachChat.push({no,html:buildAdvice()});
  }
  G.hintCards=new Set(adv.cards.map(c=>c.id));
  activeTab='coach';
  render();
}

function playCards(seat,cards){
  cards.forEach(c=>removeCard(G.hands[seat],c));
  G.trick.push({seat,cards});
  sndPlay();
  render();
  if(G.trick.length===4) holdTrick();
  else step();
}

// 一墩四家出完:牌留在桌上给人看清楚,到点(或玩家点「下一墩」)再收墩
function holdTrick(){
  if(S.manualNext){
    G.awaitNext=true; render();
    setMsg('本墩出完 —— 点「下一墩」继续');
    return;
  }
  clearTimeout(G.holdTimer);
  G.holdTimer=setTimeout(finishTrick,secs(S.trickHold,S_DEFAULT.trickHold));
}
window.__nextTrick=()=>{ if(G&&G.awaitNext){ G.awaitNext=false; finishTrick(); } };

function finishTrick(){
  if(G.phase!=='play'||G.trick.length!==4) return;   // 防重复收墩/在空墩上再收一次
  clearTimeout(G.holdTimer); G.holdTimer=null;
  G.awaitNext=false;
  const res=resolveTrick(G.trick,G.trump);
  const declTeam=G.declSeat%2;
  const gotPts=res.winner%2!==declTeam;
  if(gotPts){
    G.defPoints+=res.points;
    G.capturedCards.push(...G.trick.flatMap(p=>p.cards).filter(c=>cardPoints(c)>0));
  }
  G.tricks.push({no:G.tricks.length+1,plays:G.trick.slice(),winner:res.winner,points:res.points,gotPts});
  log(`第${G.tricks.length}墩:${SEAT_NAME[res.winner]} 赢${res.points?`,${gotPts?T('defenders')+'得':'庄家方保住'} ${res.points} 分`:',无分'}`);
  G.lastLeadSize=G.trick[0].cards.length;
  G.leader=res.winner; G.lastWinner=res.winner; G.trick=[]; G.trickNo++;
  G.hintCards=null; G.quiz=null;   // 教练提示随墩清空(记牌表重新蒙上)
  (res.winner%2===HUMAN%2?sndWin:sndLose)();
  const nEl=document.getElementById('n'+res.winner);
  if(nEl){ nEl.classList.add('won'); setTimeout(()=>nEl.classList.remove('won'),1900); }
  if(G.hands.every(h=>h.length===0)) endRound();
  else { render(); setMsg(''); setTimeout(step,400); }
}

function endRound(){
  redealCount=0;                 // 本局真正打完了,重发计数归零
  const declTeam=G.declSeat%2;
  const defWonLast=G.lastWinner%2!==declTeam;
  const sc=scoreRound({defPoints:G.defPoints,kitty:G.buried,defWonLastTrick:defWonLast,
                       lastLeadSize:G.lastLeadSize});
  // 整场推进要先算 —— 弹窗里的「升 N 级」必须是**实际生效**的那个数,
  // 否则会出现「上台升1级」和下一行「必打关卡,本次不升级」自相矛盾。
  // played 一直记着(即使关卡开关是关的),中途打开设置才不会丢掉前面的战绩;
  // 关着的时候 gates 传 null,判定本身自然不生效
  const before=M.levels.slice();
  const adv=advanceMatch(M.levels,G.declSeat,sc,S.gatesOn?S.gates:null,M.played);
  const upTeam=sc.defendersWin?1-declTeam:declTeam;
  const realUp=adv.levels[upTeam]-before[upTeam];      // 关卡拦下后可能小于 sc 里的名义级数
  const humanDecl=declTeam===HUMAN%2;
  const humanWon=sc.defendersWin!==humanDecl;
  let html=`<div style="font-size:22px;color:var(--gold)">${humanWon?'你们赢了!':'你们输了'}</div>`;
  html+=`<div>${T('defenders')}共得 <b>${sc.total}</b> 分`;
  if(defWonLast&&sc.kittyPts) html+=`(含${useSH?'灭底翻出':'抠底'} ${sc.kittyPts}×${sc.mult})`;
  html+=`</div>`;
  if(sc.total===0) html+=`<div style="color:var(--gold)">${T('guangtou')}!</div>`;   // 闲家0分
  html+=sc.defendersWin
    ? `<div>${T('defenders')}上台${realUp?`,${T('levelUp')} ${realUp} 级${realUp>1?`(${T('tiaoji')}!)`:''}`:''}</div>`
    : `<div>庄家方守住${realUp?`,${T('levelUp')} ${realUp} 级${realUp>1?`(${T('tiaoji')}!)`:''}`:''}</div>`;
  if(G.buried.length)
    html+=`<div style="margin-top:8px;font-size:13px">底牌:${G.buried.map(c=>miniName(c)).join(' ')}</div>`;
  // 教练:局后复盘关键回合(按分差取前3)
  if(C.on&&C.review&&G.coachNotes.length){
    const top=G.coachNotes.slice().sort((a,b)=>b.gap-a.gap).slice(0,3);
    html+=`<div style="margin-top:10px;text-align:left;font-size:14px;background:rgba(110,201,255,.1);border-radius:8px;padding:8px 12px">`+
      `<b style="color:#6ec9ff">🎓 关键回合复盘</b>`+
      top.map(n=>`<div>第${n.no}墩:你出 ${desc(n.my)} → 教练建议 ${desc(n.best)}(${n.reason})</div>`).join('')+
      `</div>`;
  }else if(C.on&&C.review){
    html+=`<div style="margin-top:8px;font-size:14px;color:#6ec9ff">🎓 教练:本局没有明显失误,漂亮!</div>`;
  }
  // 整场推进(adv 在上面已经算好)
  M.levels=adv.levels; M.dealer=adv.dealer; M.round++;
  if(adv.played) M.played=adv.played;
  G.ended={matchOver:adv.matchOver};
  if(adv.gateStopped!=null)
    html+=`<div style="margin-top:8px;font-size:15px;color:var(--gold)">`+
          `⛔ ${rankName(adv.gateStopped)} 必打,不可跳级 —— 本次升级停在 ${rankName(adv.gateStopped)}</div>`;
  if(adv.gateHeld!=null){
    const who=adv.dealer%2===HUMAN%2?'你们':'对方';
    html+=`<div style="margin-top:8px;font-size:15px;color:var(--gold)">`+
          `⛔ ${rankName(adv.gateHeld)} 必打 —— ${who}还没坐庄守住过 ${rankName(adv.gateHeld)},`+
          `本次不升级,下一局由${who}坐庄打 ${rankName(adv.gateHeld)}</div>`;
  }
  if(adv.matchOver){
    const weWon=adv.winnerTeam===0;
    html+=`<div style="margin-top:10px;font-size:20px;color:var(--gold)">${weWon?'你们打过 A,整场胜利!':'对方打过 A,整场告负'}</div>`;
    html+=`<div style="margin-top:14px"><button onclick="window.__newMatch()">重新开整场</button> <button class="minor" onclick="window.__review()">复盘本局</button></div>`;
  }else{
    html+=`<div style="margin-top:6px;font-size:14px">级数 —— 你们:打${rankName(Math.min(M.levels[0],14))} / 对方:打${rankName(Math.min(M.levels[1],14))}</div>`;
    html+=`<div style="font-size:14px">下一局 ${SEAT_NAME[M.dealer]} 坐庄,打${rankName(M.levels[M.dealer%2])}</div>`;
    html+=`<div style="margin-top:14px"><button onclick="window.__next()">下一局</button> <button class="minor" onclick="window.__review()">复盘本局</button></div>`;
  }
  document.getElementById('overlayContent').innerHTML=html;
  document.getElementById('overlay').style.display='flex';
  sndEnd();
}
window.__next=()=>{ document.getElementById('overlay').style.display='none'; newRound(); };
window.__newMatch=()=>{ M={levels:[2,2],dealer:-1,round:0,played:[-1,-1]}; scrambleNext=false; redealCount=0;
  document.getElementById('overlay').style.display='none'; newRound(); };
window.__review=()=>{ document.getElementById('overlay').style.display='none';
  render(); setMsg('复盘中:可查看出牌历史、教练复盘等记录,准备好后点下方"下一局"继续'); };

// 手牌单行自适应:张数一多就把牌往一起挤(而不是换行),换行会把高度让给牌桌抢走
function fitHandRow(){
  const el=document.getElementById('hand');
  const n=el.children.length;
  if(n<2){ el.style.removeProperty('--handGap'); return; }
  // --cardW 是 clamp(vw+vh) 表达式,getComputedStyle 在自定义属性上只返回原始文本、不会解析成像素,
  // 只能量实际卡牌元素的渲染宽度
  const cardW=el.children[0].getBoundingClientRect().width||60;
  const landscape=matchMedia('(orientation:landscape) and (max-height:600px)').matches;
  const naturalGap=cardW*(landscape?-0.46:-0.38);
  const avail=el.clientWidth-4;
  const neededGap=(avail-n*cardW)/(n-1);   // 总宽 = n*cardW + (n-1)*gap,解出刚好塞进 avail 的 gap
  const minVisible=Math.max(9,cardW*0.2);
  const minGap=-(cardW-minVisible);
  const gap=Math.max(minGap,Math.min(naturalGap,neededGap));
  el.style.setProperty('--handGap',gap+'px');
}
window.addEventListener('resize',()=>{ if(G) fitHandRow(); });

// ================= 渲染 =================
function render(){
  const t=G.trump;
  // 只报当前第几墩,不报总数 —— 一墩可以是单张/对子/拖拉机,总墩数本来就不固定
  const trickNo=G.ended?G.tricks.length:G.tricks.length+1;
  const declNow=G.decl?`${SEAT_NAME[G.decl.seat].slice(0,1)}${T('declare')} ${G.decl.suit?SUIT_SYM[G.decl.suit]+(G.decl.strength===2?'对':''):(G.decl.strength===4?T('bigJoker'):T('smallJoker'))+'对'}`:'未定';

  // 出牌状态显示区拆分:阶段性说明(发牌/造反/扣底)去顶部状态栏;
  // 本墩领出信息(更常用、更值得占牌桌中心)直接写进 #msg,替掉"轮到你跟牌"这类泛泛提示
  let phaseHint='', centerMsg='', winnerMsg='', winnerOurs=false;
  if(G.phase==='dealing'||G.phase==='finalDecl'){
    phaseHint=`发牌中(${G.dealt}/100)… 当前:${G.decl?`${SEAT_NAME[G.decl.seat]} ${G.decl.suit?SUIT_SYM[G.decl.suit]+(G.decl.strength===2?'(一对)':''):T('noTrump')}`:'无人'+T('declare')}`;
  }else if(G.phase==='redealing') phaseHint='重新发牌中…';
  else if(G.phase==='lowrebel') phaseHint=`低分/少${T('trump')}:分数≤${RULES.pointRebelThreshold}或${T('trump')}≤${RULES.trumpRebelThreshold}张可${rebelName()}`;
  else if(G.phase==='kitty') phaseHint=`${T('bury')}阶段:庄家从手牌(含底牌)中选 ${RULES.kittySize} 张扣下`;
  else if(G.phase==='play'){
    if(G.trick.length>0){
      const lead=classify(G.trick[0].cards,G.trump);
      const suitName=lead.suit==='T'?(t.suit?T('trump'):T('noTrump')):SUIT_NAME[lead.suit];
      centerMsg=`本墩:${SEAT_NAME[G.trick[0].seat]} ${T('lead')} 【${suitName}】 ${typeName(lead.type)}(${lead.cards.length}张),有${suitName}必须跟`;
      // 谁暂时最大 —— 决定该抢还是该垫,比"轮到你跟牌"有用得多
      const cw=currentWinner(G.trick,G.trump);
      const ours=cw.seat%2===HUMAN%2;
      const pts=countPoints(G.trick.flatMap(p=>p.cards));
      winnerMsg=`目前 ${cw.seat===HUMAN?'你':SEAT_NAME[cw.seat]} 最大(${ours?'我方':'对方'})`+
                (pts?` · 台面 ${pts} 分`:'');
      winnerOurs=ours;
    }else centerMsg=`本墩:${SEAT_NAME[G.leader]} ${T('lead')},等待出牌…`;
  }
  if(centerMsg){   // 空则保留上一次 setMsg() 的内容(如错误提示)
    document.getElementById('msg').innerHTML=centerMsg+
      (winnerMsg?`<div class="msgWin ${winnerOurs?'ours':'theirs'}">${winnerMsg}</div>`:'');
  }

  document.getElementById('status').innerHTML=
    `<span>${T('trump')}:<b>${t?trumpLabel(t):declNow}</b></span>`+
    `<span>庄家:<b>${G.declSeat>=0?SEAT_NAME[G.declSeat]:'抢亮中'}</b></span>`+
    `<span>${T('defenders')}得分:<b>${G.defPoints}</b></span>`+
    `<span>你的队伍:<b>${G.declSeat<0?'—':(G.declSeat%2===0?'庄家方':T('defenders'))}</b></span>`+
    `<span>级数 你们:<b>${rankName(Math.min(M.levels[0],14))}</b> 对方:<b>${rankName(Math.min(M.levels[1],14))}</b></span>`+
    `<span>第${M.round+1}局 · 第 <b>${trickNo}</b> 墩</span>`+
    `<button id="btnSet" style="margin-left:auto" onclick="window.__openSet()">⚙ 设置</button>`+
    (phaseHint?`<span class="phaseHint">${phaseHint}</span>`:'');

  for(let s=1;s<4;s++){
    const n=(G.phase==='dealing'||G.phase==='finalDecl')?G.visCount[s]:G.hands[s].length;
    document.getElementById('b'+s).textContent='🂠 '+n+' 张';
    document.getElementById('n'+s).classList.toggle('turn',
      G.phase==='play'&&G.trick.length<4&&(G.leader+G.trick.length)%4===s);
  }
  document.getElementById('n0').classList.toggle('turn',
    G.phase==='play'&&G.trick.length<4&&(G.leader+G.trick.length)%4===0);
  const preplay=(G.phase!=='play');   // 开打前:亮主牌摆在亮主者面前
  for(let s=0;s<4;s++){
    const p=G.trick.find(x=>x.seat===s);
    let html=p?p.cards.map(c=>cardHTML(c)).join(''):'';
    if(preplay&&G.declCards&&G.declCards.seat===s)
      html=G.declCards.cards.map(c=>cardHTML(c)).join('');
    // 内容没变就别重建 DOM —— 否则 playIn 动画每次 render 都重放(牌一直闪)
    const slot=document.getElementById('p'+s);
    if(slot.__last!==html){ slot.innerHTML=html; slot.__last=html; }
  }
  const showHand=(G.phase==='dealing'||G.phase==='finalDecl')?visHand(HUMAN):G.hands[HUMAN];
  const hand=sortForDisplay(showHand,curTrumpForSort());
  document.getElementById('hand').innerHTML=
    hand.map(c=>cardHTML(c,G.selected.has(c.id)?'sel':(G.hintCards&&G.hintCards.has(c.id)?'hintc':''))).join('');
  document.querySelectorAll('#hand .card').forEach(el=>{
    el.onclick=()=>{
      if(!(G.phase==='play'||G.phase==='kitty')) return;
      const id=+el.dataset.id;
      G.selected.has(id)?G.selected.delete(id):G.selected.add(id);
      render();
    };
  });
  fitHandRow();

  // 抢亮/造反/低分造反条
  // 注意:内容没变时绝不重建 DOM —— 发牌期高频重绘会把正在点击的按钮销毁(点击被吞 bug)
  const strip=document.getElementById('dealZone');
  let stripHTML, bind=null;
  if(G.ended){
    stripHTML=G.ended.matchOver
      ?`<span style="color:var(--gold)">复盘中</span> <button onclick="window.__newMatch()">重新开整场</button>`
      :`<span style="color:var(--gold)">复盘中</span> <button onclick="window.__next()">下一局</button>`;
    bind=null;
  }else if(G.awaitNext){
    stripHTML=`<button onclick="window.__nextTrick()">下一墩 ▶</button>`;
    bind=null;
  }else if(G.phase==='dealing'||G.phase==='finalDecl'){
    const vis=visHand(HUMAN);
    const V=G.decl?T('counterV'):T('declareV');   // 亮/反(沪语:翻/反)
    // 按钮顺序必须稳定:引擎给的 declOptions 是按强度排的,单张升级成对子会重排导致按钮跳位。
    // 这里改成固定花色顺序,再靠右对齐 —— 位置只会往左长,已有按钮不动。
    const btns=[];
    if(canReinforce2(G.decl,HUMAN,vis,rankOf(HUMAN),G.rebelHappened))
      btns.push(`<button data-a="re">${T('reinforce')}${SUIT_SYM[G.decl.suit]}</button>`);
    const jp=jokerPairOf(vis);
    // 王对(最长的一颗「亮无将(大)」—— 按钮定宽以此为准)排在花色左边,位置最靠前
    if(jp&&canOverride(G.decl,jp,HUMAN))
      btns.push(`<button data-a="d" data-s="" data-st="${jp.strength}">${V}${T('noTrump')}(${jp.strength===4?'大':'小'})</button>`);
    declOptions(vis,rankOf(HUMAN)).filter(o=>canOverride(G.decl,o,HUMAN))
      .sort((a,b)=>SUITS.indexOf(a.suit)-SUITS.indexOf(b.suit))
      .forEach(o=>
        btns.push(`<button data-a="d" data-s="${o.suit}" data-st="${o.strength}">${V}${SUIT_SYM[o.suit]}${o.strength===2?'(对)':''}</button>`));
    // 发完牌进入最后机会时,给一颗「不亮」提前结束等待(它固定在最右,新按钮往左长)
    if(G.phase==='finalDecl')
      btns.push(`<button class="minor" onclick="window.__skipDecl()">不${T('declareV')}</button>`);
    stripHTML=btns.length?btns.join(''):`<span>(暂无可${T('declare')}的牌)</span>`;
    // 只绑亮主类按钮([data-a]);「不亮」用自己的 inline onclick,别被这里覆盖掉
    bind=()=>strip.querySelectorAll('button[data-a]').forEach(b=>b.onclick=()=>{
      if(b.dataset.a==='re') applyDecl(HUMAN,{suit:G.decl.suit,strength:2},true);
      else applyDecl(HUMAN,{suit:b.dataset.s||null,strength:+b.dataset.st},false);
    });
  }else if(G.phase==='lowrebel'){
    stripHTML=`<button id="lr1">${rebelName()}</button><button class="minor" id="lr0">不${T('counter')}</button>`;
    bind=()=>{
      document.getElementById('lr1').onclick=()=>humanLowRebel(true);
      document.getElementById('lr0').onclick=()=>humanLowRebel(false);
    };
  }else stripHTML='<span></span>';
  if(strip.__last!==stripHTML){
    strip.innerHTML=stripHTML; strip.__last=stripHTML;
    if(bind) bind();
  }

  const myTurn=!G.ended&&G.phase==='play'&&G.trick.length<4&&(G.leader+G.trick.length)%4===HUMAN;
  document.getElementById('btnPlay').disabled=!myTurn;
  document.getElementById('btnClear').disabled=!(G.selected.size>0);
  // 扣底:选够 8 张才可点
  const buryReady=G.phase==='kitty'&&G.selected.size===RULES.kittySize;
  document.getElementById('btnBury').disabled=!buryReady;
  document.getElementById('btnBury').textContent=
    G.phase==='kitty'?`${T('bury')}(${G.selected.size}/${RULES.kittySize})`:T('bury');
  // 看底牌:只有你是庄家、且底牌已扣下才可点
  const canSeeKitty=G.declSeat===HUMAN&&G.buried.length>0;
  document.getElementById('btnKitty').disabled=!canSeeKitty;
  // 庄家区本局用不上(你不坐庄)就整块收起来,不留灰按钮占地方
  document.getElementById('btnBury').hidden=(G.phase!=='kitty');
  document.getElementById('btnKitty').hidden=!canSeeKitty;
  document.getElementById('btnHint').disabled=!(C.on&&myTurn);
  // 只在发牌/亮主阶段给发牌区留两行高度,其余时候把这块高度还给牌桌
  document.getElementById('controls').classList.toggle('dealing',
    G.phase==='dealing'||G.phase==='finalDecl');
  renderPanel();
}

// ---- 底部面板 ----
function renderPanel(){
  document.querySelectorAll('#tabs button').forEach(b=>
    b.classList.toggle('on',b.dataset.tab===activeTab));
  const el=document.getElementById('panel');
  if(!activeTab){ el.innerHTML='<span style="opacity:.5">点击上方页签展开:抢分记录 / 对局记录 / 出牌历史 / 教练 / 记牌表 / 笔记</span>'; return; }
  if(activeTab==='coach'){ renderCoachTab(el); return; }
  if(activeTab==='mem'){ renderMemTab(el); return; }
  if(activeTab==='notes'){ renderNotesTab(el); return; }
  if(activeTab==='log'){
    let html=`<div class="toggleRow"><label><input type="checkbox" id="ckReplay" ${replayMode?'checked':''}> 复盘模式(显示每墩出牌)</label></div>`;
    if(replayMode){
      // 各家初始手牌:只在本局打完后开放,局中看等于开天眼
      if(G.initialHands){
        html+=G.ended
          ?`<div class="suitGroup"><b style="color:var(--gold)">本局初始手牌</b>`+
            G.initialHands.map((h,s)=>
              `<div class="trickRow"><span class="who">${SEAT_NAME[s]}${s===G.declSeat?'(庄)':''}</span>`+
              sortForDisplay(h,G.trump).map(c=>cardHTML(c,'mini')).join('')+`</div>`).join('')+
            (G.buried.length?`<div class="trickRow"><span class="who">底牌</span>`+
              sortForDisplay(G.buried,G.trump).map(c=>cardHTML(c,'mini')).join('')+`</div>`:'')+
           `</div>`
          :`<div style="opacity:.6;margin-bottom:4px">(各家初始手牌本局结束后可看)</div>`;
      }
      html+=G.tricks.slice().reverse().map(tk=>
        `<div class="trickRow"><span class="who">第${tk.no}墩 ${SEAT_NAME[tk.winner]}赢${tk.points?` +${tk.points}分`:''}</span>`+
        tk.plays.map(p=>`<span style="font-size:11px;color:#9fd6b5">${SEAT_NAME[p.seat].slice(0,1)}:</span>`+
          p.cards.map(c=>cardHTML(c,'mini')).join('')).join('')+`</div>`).join('')||'(尚无记录)';
    }else{
      html+=G.log.map(l=>`<div>· ${l.text}</div>`).join('')||'(尚无记录)';
    }
    el.innerHTML=html;
    document.getElementById('ckReplay').onchange=e=>{replayMode=e.target.checked;renderPanel();};
  }else if(activeTab==='score'){
    const pts=G.capturedCards;
    el.innerHTML=`<div style="margin-bottom:6px">抓分方已抓到 <b style="color:var(--gold)">${G.defPoints}</b> 分,分牌如下:</div>`+
      (pts.length?`<div class="trickRow">${pts.map(c=>cardHTML(c,'mini')).join('')}</div>`:'(还没有抓到分牌)');
  }else if(activeTab==='hist'){
    let html=`<div class="toggleRow"><label><input type="checkbox" id="ckSuit" ${histBySuit?'checked':''}> 按花色分组(默认按时间)</label></div>`;
    const all=G.tricks.flatMap(tk=>tk.plays.flatMap(p=>p.cards.map(c=>({c,seat:p.seat,no:tk.no}))));
    if(!all.length) html+='(尚无出牌)';
    else if(histBySuit){
      const t=curTrumpForSort();
      const groups={};
      all.forEach(x=>{const s=effSuit(x.c,t);(groups[s]=groups[s]||[]).push(x);});
      const gname=s=>s==='T'?T('trump'):SUIT_NAME[s];
      html+=Object.keys(groups).sort((a,b)=>(a==='T'?-1:1)-(b==='T'?-1:1)).map(s=>{
        const sorted=groups[s].sort((a,b)=>ordIdx(b.c,t)-ordIdx(a.c,t));
        return `<div class="suitGroup"><b style="color:var(--gold)">${gname(s)}(${sorted.length}张)</b><br>${sorted.map(x=>cardHTML(x.c,'mini')).join('')}</div>`;
      }).join('');
    }else{
      html+=G.tricks.map(tk=>
        `<div class="trickRow"><span class="who">第${tk.no}墩</span>`+
        tk.plays.map(p=>`<span style="font-size:11px;color:#9fd6b5">${SEAT_NAME[p.seat].slice(0,1)}:</span>`+
          p.cards.map(c=>cardHTML(c,'mini')).join('')).join('')+`</div>`).join('');
    }
    el.innerHTML=html;
    const ck=document.getElementById('ckSuit');
    if(ck) ck.onchange=e=>{histBySuit=e.target.checked;renderPanel();};
  }
}

// ---- 教练页签:提问中的 quiz 置顶,下面是对话历史(最新在上),标注第几墩 ----
function renderCoachTab(el){

  if(G.quiz){
    html+=`<div class="coachBox"><b>🎓 ${G.quiz.q}</b><div style="margin-top:6px">`+
      [0,1,2,3].map(n=>`<button class="minor" data-qz="${n}" style="margin-right:6px;padding:4px 14px">${n===3?'3+':n}</button>`).join('')+
      `</div></div>`;
  }
  if(G.coachChat.length){
    html+=G.coachChat.slice().reverse().map(c=>
      `<div class="coachBox" style="margin-bottom:6px">`+
      `<div style="font-size:11px;color:#9fd6b5;margin-bottom:3px">第${c.no}墩</div>${c.html}</div>`).join('');
  }else if(!G.quiz){
    html+=`<div style="opacity:.6">轮到你时点「问教练」;出现大失误会自动提醒;局终自动复盘关键回合。</div>`;
  }

      html:`<div>${right?'✅ 答对了':'❌ 不对'},实际在外还有 <b>${G.quiz.answer===3?'3张以上':G.quiz.answer+'张'}</b> 更大的。</div>`+G.quiz.advice});

// ---- 记牌表页签(默认蒙住,点开验证;每墩重新蒙上) ----
function renderMemTab(el){
  const inPlay=G.phase==='play'||G.phase==='kitty';
  if(!inPlay){ el.innerHTML='<div style="opacity:.6">开打后这里显示在外大牌统计。</div>'; return; }
  let html='';
  const revealed=C.memShow||G.memRevealTrick===G.tricks.length;
  if(!revealed){
    html+=`<div class="coachBox">🧠 先自己心算:主牌还剩几张?哪几门的分牌还没出?<br>
      <button id="memReveal" style="margin-top:6px">我算好了,点开验证</button></div>`;
    el.innerHTML=html;
    el.querySelector('#memReveal').onclick=()=>{G.memRevealTrick=G.tricks.length;renderPanel();};
    return;
  }
  const t=G.trump, view=viewFor(HUMAN), mem=makeMemory(view);
  const voids=makeVoids(view.history,t);            // 从历史推断谁已确定断门
  const suits=['T','S','H','C','D'].filter(s=>s==='T'||(!t.suit||s!==t.suit));
  html+=suits.map(s=>{
    let cnt=0, top=null;
    const ptBy={};                                   // 分牌明细:rank → 张数
    for(const k in mem.unseen){
      const m=mem.unseen[k]; if(m<=0) continue;
      const c=keyToCard(k);
      if(effSuit(c,t)!==s) continue;
      cnt+=m;
      if(cardPoints(c)>0) ptBy[c.rank]=(ptBy[c.rank]||0)+m;
      if(!top||ordIdx(c,t)>ordIdx(top,t)) top=c;
    }
    const name=s==='T'?T('trump'):SUIT_NAME[s];
    // 你该门最大的一张,以及它是否已经压得住别家(省得自己心算)
    const mine=G.hands[HUMAN].filter(c=>effSuit(c,t)===s);
    const myTop=mine.length?mine.reduce((a,b)=>ordIdx(b,t)>ordIdx(a,t)?b:a):null;
    // 同大小时先出者赢,所以并列最大也算"领出能吃",不能笼统说压不过
    const cmp=myTop?(top?ordIdx(myTop,t)-ordIdx(top,t):1):0;
    const ptTxt=Object.keys(ptBy).sort((a,b)=>b-a).map(r=>`${ptBy[r]}张${rankName(+r)}`).join('、');
    const ptSum=Object.keys(ptBy).reduce((a,r)=>a+cardPoints({rank:+r})*ptBy[r],0);
    const gone=[1,2,3].filter(x=>voids[x]&&voids[x][s]).map(x=>SEAT_NAME[x].replace(/\(.*\)/,''));
    return `<div class="memRow">`+
      `<b style="color:var(--gold)">${name}</b> 别家还剩 <b>${cnt}</b> 张`+
      (cnt?`,最大 ${miniName(top)}`:'(已出尽)')+
      `<div class="memSub">你最大:${myTop?miniName(myTop):'无'}`+
        (myTop?(cmp>0?' <span style="color:#7ee787">— 已是最大,吃得住</span>'
               :cmp===0?' <span style="color:#7ee787">— 并列最大,领出能吃(同大小先出者赢)</span>'
                       :` <span style="color:#ff9d6e">— 压不过 ${miniName(top)}</span>`):'')+`</div>`+
      `<div class="memSub">剩余分牌:${ptSum?`${ptTxt}(共 ${ptSum} 分)`:'无'}</div>`+
      (gone.length?`<div class="memSub">已断门:${gone.join('、')}</div>`:'')+
      `</div>`;
  }).join('');
  html+=`<div style="opacity:.6;margin-top:6px">(「别家还剩」= 三家对手/队友手中 + 底牌,不含你自己的牌;`+
        `底牌${G.declSeat===HUMAN?'你已知,已扣除':'未知,计在其中'})</div>`;
  el.innerHTML=html;
}

// ---- 笔记(右栏页签,不再单独占块) ----
function renderNotesTab(el){
  el.innerHTML=
    `<div id="noteInputRow"><input id="noteInput" placeholder="记点什么…" maxlength="120"><button id="noteSend">发送</button></div>`+
    `<div id="noteList">${notes.slice().reverse().map(n=>`<div class="note">${n.replace(/[<>&]/g,s=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[s]))}</div>`).join('')}</div>`;
  el.querySelector('#noteSend').onclick=sendNote;
  el.querySelector('#noteInput').onkeydown=e=>{ if(e.key==='Enter') sendNote(); };
}
function sendNote(){
  const el=document.getElementById('noteInput');
  const v=el.value.trim();
  if(!v) return;
  notes.push(v); el.value='';
  try{ localStorage.setItem('80fentest-notes',JSON.stringify(notes.slice(-100))); }catch(e){}
  renderPanel();
}

document.getElementById('btnPlay').onclick=humanPlay;
document.getElementById('btnClear').onclick=()=>{G.selected.clear();render();};
document.getElementById('btnBury').onclick=buryKitty;
document.getElementById('btnHint').onclick=askCoach;
document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{
  activeTab=activeTab===b.dataset.tab?null:b.dataset.tab;
  renderPanel();
});

/* 悬停态跟着真实输入设备走,而不是跟着设备"声称"支持什么(见样式里 html.hasHover)。
   pointerdown 用捕获阶段,保证在任何点击处理之前就把类切好。 */
function trackPointerType(){
  const el=document.documentElement;
  const set=on=>el.classList.toggle('hasHover',on);
  set(matchMedia('(hover:hover) and (pointer:fine)').matches);   // 起手按浏览器说的算
  addEventListener('pointerdown',e=>set(e.pointerType==='mouse'),{capture:true,passive:true});
  addEventListener('pointermove',e=>{ if(e.pointerType==='mouse') set(true); },{capture:true,passive:true});
}
trackPointerType();

showStartScreen();

    `<button class="minor" style="margin-left:10px" onclick="window.__openSet()">⚙ 设置</button></div>`;
  document.getElementById('overlay').style.display='flex';
}
window.__start=()=>{ document.getElementById('overlay').style.display='none'; newRound(); };
})();
