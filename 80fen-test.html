/* =====================================================================
   牌桌:名牌、四摞牌、桌心提示的位置和桌面牌宽,都按牌桌实际大小算,写成行内 left/top
   - 竖屏 / 宽屏(拓扑 A):对家名牌在上、牌摞挂在下面;上下家的名牌在两侧,牌摞在名牌下面
     朝桌心长;我这摞在最下面正中,我的名牌在左下。上下家名牌和对家那摞同一高度、左右错开,
     省出一行,桌面牌能比手牌大
   - 矮横屏(拓扑 B):对家、我两摞在中间一列,名牌在牌摞左边;上下家名牌在上面两角
   桌面牌宽 = 放得下三行(或两行)的最大值,但不超过手牌的 1.25 倍;
   每摞都有最宽多宽,张数多了只收紧叠放间距,不压别家
   ===================================================================== */
var TB={ready:false};window.__TB=TB;
var SEAT_KEYS={N:{lab:'#playerN .player-label',pile:'p2'},W:{lab:'#playerW .player-label',pile:'p3'},
               E:{lab:'#playerE .player-label',pile:'p1'},S:{lab:'#myPlay .player-label',pile:'p0'}};
function labEl(k){return document.querySelector(SEAT_KEYS[k].lab);}
function place(el,x,y){var l=Math.round(x)+'px',t=Math.round(y)+'px';if(el.style.left!==l)el.style.left=l;if(el.style.top!==t)el.style.top=t;}
function layoutTable(){
  var aw=arena.clientWidth,ah=arena.clientHeight;if(!aw||!ah)return;
  var mode=L.mode,wide=mode==='w';
  var pad=wide?18:10,g=wide?16:8,lg=6;
  /* 窄桌面:名牌只留头像 + 名字(队友 / 对手看头像颜色) */
  game.classList.toggle('tight',mode!=='l'&&aw<380);
  var lab={N:labEl('N'),W:labEl('W'),E:labEl('E'),S:labEl('S')};
  var lh=lab.N.offsetHeight||34,lw={};
  for(var k in lab)lw[k]=lab[k].offsetWidth||90;
  var hcw=L.idleCw||(L.hand?L.hand.cw:60);
  var cap=hcw*1.25,hard=wide?118:mode==='l'?84:112;
  var tcw,th,P={};   /* P[k]={x,y,align,max} 牌摞锚点 */
  if(mode==='l'){
    /* 矮横屏:名牌是竖排的小头像。上下家在桌子左右两边的中间,牌摞挨着名牌朝桌心长;
       对家、我两摞在中间一列(上下各一行),头像在牌摞左边 */
    var lhs={};for(var k2 in lab)lhs[k2]=lab[k2].offsetHeight||56;
    th=(ah-2*pad-g)/2;
    tcw=Math.max(34,Math.floor(Math.min(th/1.43,cap,hard)));th=tcw*1.43;
    var lwc=lw.N,yMid=ah/2;
    /* 上下家:名牌放在牌摞旁边(左右两边正中);桌面太窄、旁边连一对都放不下时,名牌退到上面两角、牌摞挂在名牌下面 */
    var x0=Math.round(aw/2-tcw/2),colL=x0-g-lwc;                   /* 中间一列(含对家头像)的左边界 */
    var beside=colL-g-(pad+lw.W+g),stack=beside<tcw*1.4;
    if(stack){
      tcw=Math.max(28,Math.min(tcw,Math.floor((aw/2-lwc-2*g-pad)/1.9)));th=tcw*1.43;
      x0=Math.round(aw/2-tcw/2);colL=x0-g-lwc;
    }
    var side=stack?Math.max(tcw,colL-g-pad):Math.max(tcw,Math.min(beside,tcw*3.2));   /* 上下家牌摞最宽 */
    var xW=stack?pad:pad+lw.W+g,xE=stack?aw-pad:aw-pad-lw.E-g;
    var ySide=stack?pad+Math.max(lhs.W,lhs.E)+lg:yMid-th/2;
    var colMax=Math.max(tcw,xE-side-g-x0);                         /* 中间一列牌摞最宽 */
    var yS=ah-pad-th;
    place(lab.N,x0-g-lw.N,pad+(th-lhs.N)/2);
    place(lab.S,pad,ah-pad-lhs.S);                                 /* 我的头像在左下角,不浮在桌子中间 */
    if(stack){place(lab.W,pad,pad);place(lab.E,aw-pad-lw.E,pad);}
    else{place(lab.W,pad,yMid-lhs.W/2);place(lab.E,aw-pad-lw.E,yMid-lhs.E/2);}
    P.N={x:x0,y:pad,align:'l',max:colMax};
    P.S={x:x0,y:yS,align:'l',max:colMax};
    P.W={x:xW,y:ySide,align:'l',max:side};
    P.E={x:xE,y:ySide,align:'r',max:side};
    TB.center={x:aw/2,y:ah/2};
    TB.slot={x:x0,y:yS};
  }else{
    /* 上下家名牌先试着和对家那摞并排(省一行);并排时对家那摞连一对都放不下,名牌就单占一行 */
    for(var stacked=0;stacked<2;stacked++){
      var extra=stacked?lh+lg:0;
      th=(ah-2*pad-lh-lg-2*g-extra)/3;
      tcw=Math.max(26,Math.floor(Math.min(th/1.43,cap,hard,(aw-2*pad-g)/2/1.4)));th=tcw*1.43;
      /* 上下家牌摞从名牌朝桌心最多长多宽;至少要放得下名牌,桌面牌很小时两个名牌才不会挤到中间撞在一起 */
      /* 竖屏名牌贴着左右两边;宽屏桌子太宽,两摞往桌心收一点 */
      var reach=mode==='p'?(aw-2*pad-g)/2:Math.min((aw-2*pad-g)/2,Math.max(tcw*2.9,Math.max(lw.W,lw.E)+6));
      var xW=aw/2-g/2-reach,xE=aw/2+g/2+reach;
      var nMax=stacked?aw-2*pad:aw-2*(Math.max(xW+lw.W,aw-xE+lw.E)+g);
      if(stacked||nMax>=tcw*1.36)break;
    }
    nMax=Math.max(tcw,nMax);
    /* 多出来的高度:先把行距撑开一点,剩下的上下平分,整组居中 */
    var free=Math.max(0,ah-(2*pad+lh+lg+3*th+2*g+extra));
    var gg=g+Math.min(free/3,th*0.22),top=pad+Math.max(0,(free-2*(gg-g))/2);
    var yN=top+lh+lg,ySide=yN+th+gg+extra,yS=ySide+th+gg;
    place(lab.N,aw/2-lw.N/2,top);
    place(lab.W,xW,ySide-lg-lh);
    place(lab.E,xE-lw.E,ySide-lg-lh);
    place(lab.S,xW,yS+th-lh);
    var sMax=Math.max(tcw,aw-2*(xW+lw.S+g));
    P.N={x:aw/2,y:yN,align:'c',max:nMax};
    P.S={x:aw/2,y:yS,align:'c',max:sMax};
    P.W={x:xW,y:ySide,align:'l',max:reach};
    P.E={x:xE,y:ySide,align:'r',max:reach};
    TB.center={x:aw/2,y:ySide+th/2};
    TB.slot={x:aw/2-tcw/2,y:yS};
  }
  TB.lw=['N','W','E','S'].map(function(k){return lab[k].offsetWidth;}).join();
  TB.P=P;TB.tcw=tcw;TB.th=th;TB.aw=aw;TB.ah=ah;TB.ready=true;
  game.style.setProperty('--tcw',tcw+'px');
  game.style.setProperty('--tstep',Math.max(14,Math.round(tcw*0.34))+'px');
  game.style.setProperty('--wm',Math.round(Math.min(aw,ah)*0.34)+'px');
  game.style.setProperty('--wm-y',Math.round(TB.center.y)+'px');
  place($('turnSlot'),TB.slot.x,TB.slot.y);
  stampPiles();
}
function stampPiles(){
  if(!TB.ready)return;
  var tcw=TB.tcw,step0=Math.max(14,Math.round(tcw*0.34));
  for(var k in SEAT_KEYS){
    var p=$(SEAT_KEYS[k].pile),a=TB.P[k],n=p.children.length,step=step0;
    if(n>1)step=Math.max(6,Math.min(step0,(a.max-tcw)/(n-1)));
    var w=n?tcw+(n-1)*step:0;
    p.style.setProperty('--pstep',step+'px');
    p.style.width=w+'px';
    place(p,a.align==='l'?a.x:a.align==='r'?a.x-w:a.x-w/2,a.y);
    for(var i=0;i<n;i++)p.children[i].style.setProperty('--i',i);
  }
  /* 收墩:四摞都在桌上时记下样子;下一次四摞全变了(产品清桌),就用影子把这四摞飞向赢家 */
  var piles=['p0','p1','p2','p3'].map(function(id){return $(id);});
  if(piles.every(function(p){return p.children.length;}))
    TB.snap=piles.map(function(p){return {html:p.innerHTML,r:rel(p),step:p.style.getPropertyValue('--pstep')};});
  else if(TB.snap&&piles.every(function(p,i){return p.innerHTML!==TB.snap[i].html;})){flyCollect(TB.snap,TB.collect);TB.snap=null;}
  /* 我那摞有牌了,虚线空位就收起来 */
  if($('p0').children.length)$('turnSlot').hidden=true;
  placeSummary();
  placeStamp();
}
/* 桌心提示(只在出牌前的阶段):放在桌心;桌心有牌(亮主的牌)就挪到不压牌的空处 */
function placeSummary(){
  var box=$('trickSummary');if(box.hidden||!TB.ready)return;
  var aw=TB.aw,ah=TB.ah;
  placeFree(box,[TB.center,{x:aw/2,y:ah*0.5},{x:aw*0.74,y:ah*0.74},{x:aw*0.26,y:ah*0.74},{x:aw*0.74,y:ah*0.3}]);
}
/* 按候选点依次试,放在第一个不压牌摞、不压名牌的地方(el 以中心定位) */
function placeFree(el,cands){
  var bw=el.offsetWidth,bh=el.offsetHeight;
  var busy=Array.prototype.map.call(document.querySelectorAll('#arena .played:not(.ghost)'),function(p){return p.children.length?rel(p):null;}).filter(Boolean)
    .concat(['N','W','E','S'].map(function(k){return rel(labEl(k));}));
  /* 候选点都不行时,在整张桌上按网格找压得最少的地方 */
  var aw=TB.aw,ah=TB.ah,all=cands.slice();
  for(var gy=1;gy<6;gy++)for(var gx=1;gx<6;gx++)all.push({x:aw*gx/6,y:ah*gy/6});
  var best=null,bestA=1e9;
  for(var i=0;i<all.length;i++){var c=all[i],r={left:c.x-bw/2,top:c.y-bh/2,right:c.x+bw/2,bottom:c.y+bh/2};
    if(r.left<4||r.right>aw-4||r.top<4||r.bottom>ah-4)continue;
    var a=busy.reduce(function(n,q){return n+Math.max(0,Math.min(r.right,q.right+4)-Math.max(r.left,q.left-4))*Math.max(0,Math.min(r.bottom,q.bottom+4)-Math.max(r.top,q.top-4));},0);
    if(a<bestA){bestA=a;best=c;if(!a&&i<cands.length)break;}
    if(!a&&!best)best=c;}
  best=best||cands[0];
  place(el,best.x,best.y);
}
function rel(el){var a=arena.getBoundingClientRect(),r=el.getBoundingClientRect();return {left:r.left-a.left,top:r.top-a.top,right:r.right-a.left,bottom:r.bottom-a.top};}
function hit(a,b,m){return a.left<b.right+m&&b.left<a.right+m&&a.top<b.bottom+m&&b.top<a.bottom+m;}
/* 收墩:「我方收 10 分」盖在赢的那摞上 */
function placeStamp(){
  var st=arena.querySelector('.winner-label');if(!st||st.__seat==null)return;
  var p=$('p'+st.__seat);if(!p.children.length)return;
  var r=rel(p),hw=st.offsetWidth/2+4,hh=st.offsetHeight/2+3;
  var y=clamp(r.bottom-TB.th*0.22,hh+6,TB.ah-hh-6),x=clamp((r.left+r.right)/2,hw+8,TB.aw-hw-8);
  /* 别盖住名牌:碰到就往远离名牌的方向挪 */
  ['N','W','E','S'].forEach(function(k){var q=rel(labEl(k));
    if(hit({left:x-hw,right:x+hw,top:y-hh,bottom:y+hh},q,4)){x=(q.left+q.right)/2<x?q.right+hw+6:q.left-hw-6;}});
  place(st,clamp(x,hw+8,TB.aw-hw-8),y);
}
function flyCollect(snap,seat){
  if(reduceMotion||seat==null||seat<0)return;
  var t=rel(seat===0?labEl('S'):labEl(['S','E','N','W'][seat]));
  var tx=(t.left+t.right)/2,ty=(t.top+t.bottom)/2;
  snap.forEach(function(sn,i){
    var gh=document.createElement('div');gh.className='played ghost';gh.setAttribute('aria-hidden','true');
    gh.innerHTML=sn.html;gh.style.setProperty('--pstep',sn.step);
    gh.style.left=sn.r.left+'px';gh.style.top=sn.r.top+'px';gh.style.width=(sn.r.right-sn.r.left)+'px';
    arena.appendChild(gh);
    var dx=tx-(sn.r.left+sn.r.right)/2,dy=ty-(sn.r.top+sn.r.bottom)/2;
    requestAnimationFrame(function(){requestAnimationFrame(function(){
      gh.style.transitionDelay=(i*25)+'ms';
      gh.style.transform='translate('+dx.toFixed(1)+'px,'+dy.toFixed(1)+'px) scale(.3)';gh.style.opacity='0';
    });});
    setTimeout(function(){gh.remove();},620);
  });
}
/* 六六气泡:竖屏 / 宽屏盖在我出牌那一行(轮到我时那里本来空着);矮横屏只占中间一列,不盖上下家的牌 */
function placeBubble(){
  var gr=game.getBoundingClientRect(),ar=arena.getBoundingClientRect();
  bubble.style.bottom=(gr.bottom-ar.bottom+6)+'px';
  if(L.mode==='l'&&TB.ready){
    /* 按上下家牌摞实际占到哪算,两边留 12px */
    var wr=rel($('p3')),er=rel($('p1'));
    var edge=Math.max($('p3').children.length?wr.right:TB.P.W.x,$('p1').children.length?TB.aw-er.left:TB.aw-TB.P.E.x);
    var w=Math.min(600,Math.max(340,TB.aw-2*(edge+12)));
    bubble.style.left=(ar.left-gr.left+(TB.aw-w)/2)+'px';bubble.style.right='auto';bubble.style.width=w+'px';bubble.style.maxWidth=w+'px';
  }else{bubble.style.left='';bubble.style.right='';bubble.style.width='';bubble.style.maxWidth='';}
}

new MutationObserver(function(){stampPiles();}).observe($('myPlay'),{childList:true,subtree:true});

/* 手牌每次重画(产品 render 用 innerHTML)都要重新排 */
var bidSel=new Set();
function onHandChange(){
  var G=g();
  var bidding=G&&(G.phase==='dealing'||G.phase==='finalDecl');
  if(bidding){
    Array.prototype.forEach.call(hand.children,function(c){c.classList.toggle('sel',bidSel.has(+c.dataset.id));});
  }else bidSel.clear();

/* =====================================================================
   产品每 render 一次 → 同步一次
   ===================================================================== */
var lastRound=null,lastPhase='';
function phaseOf(G){
  if(!G)return 'idle';
  if(G.ended)return 'ended';
  if(G.phase==='dealing'||G.phase==='finalDecl')return 'dealing';
  return G.phase;
}
function sync(){
  var G=g();
  var ph=phaseOf(G);
  game.classList.toggle('idle',!G);
  var ctl=$('controls');
  ['idle','dealing','kitty','lowrebel','redealing','play','ended'].forEach(function(k){ctl.classList.toggle('ph-'+k,ph===k);});
  if(!G)return;
  var round=(G.start&&G.start.round||0)+'/'+(G.start&&G.start.seed);
  if(round!==lastRound){lastRound=round;L.progress=0;lastTf={};TB.snap=null;lastChatId=maxChatId();hideBubble();hideSays();}
  if(ph!==lastPhase){lastPhase=ph;if(ph!=='play')hideBubble();}
  /* 兜底:手牌张数变了却没排过(或有牌没被摆位),补排一次 */
  var hc=hand.children;
  if(hc.length&&(!L.hand||L.hand.rows.reduce(function(a,r){return a+r.cards.length;},0)!==hc.length||!hc[0].style.transform||L.hand.rows[0].cards[0].el!==hc[0]))layout();
  syncTop(G);
  syncSeats(G);
  chatterDecl(G);
  if(G.ended)setTimeout(function(){var G2=g();if(G2&&G2.ended)chatterEnd(G2);},60);
  syncCenter(G);
  syncControls(G);
  watchCoach(G);
}
new MutationObserver(sync).observe($('status'),{childList:true});

function syncTop(G){
  var tc=$('trumpChip'),html,pending=false;
  if(G.trump){
    var s=G.trump.suit;
    html=s?'<small>主</small><span class="suit '+SUIT_CLS[s]+'">'+SUIT_SYM[s]+'︎</span><span class="num">'+rankName(G.trump.rank)+'</span>'
          :'<small>无主</small><span class="num">'+rankName(G.trump.rank)+'</span>';
  }else if(G.decl){
    var d=G.decl;
    html=(d.seat?'<i class="who s'+d.seat+'" title="'+who(d.seat)+'">'+PLAYERS[d.seat].ini+'</i>':'')+'<small>'+(d.seat?'':'我')+'亮</small>'+(d.suit?'<span class="suit '+SUIT_CLS[d.suit]+'">'+(SUIT_SYM[d.suit]+'︎').repeat(d.strength===2?2:1)+'</span>':'<span>无主</span>');
  }else{html='等待亮主';pending=true;}
  if(tc.__h!==html){tc.innerHTML=html;tc.__h=html;}
  tc.classList.toggle('pending',pending);
  var sc=G.defPoints||0;
  $('scoreNow').textContent=sc;
  if(L.sc!=null&&sc>L.sc&&!reduceMotion){var ch=$('scoreChip');ch.classList.remove('bump');void ch.offsetWidth;ch.classList.add('bump');}
  L.sc=sc;
  $('scoreFill').style.width=clamp(sc/80*100,0,100)+'%';
  $('scoreChip').classList.toggle('over',sc>=80);
  /* 得分条按我方立场上色:我方坐庄时闲家涨分是坏事(红),我方是闲家时涨分是好事(绿);庄还没定时是中性的蜂蜜黄 */
  var side=G.declSeat<0?'':(G.declSeat%2===0?'bad':'good');
  $('scoreChip').classList.toggle('good',side==='good');$('scoreChip').classList.toggle('bad',side==='bad');
  $('scoreChip').title=side==='bad'?'闲家得分:你们坐庄,闲家拿到 80 分就上台':side==='good'?'闲家得分:你们是闲家,拿到 80 分就上台':'闲家得分';
  var spans=$('status').querySelectorAll('span');
  var lv=spans[4]&&spans[4].textContent.match(/你们[:：]?\s*(\S+)\s*对方[:：]?\s*(\S+)/);
  if(lv){
    var narrow=window.innerWidth<=440&&L.mode==='p'||window.innerWidth<700&&L.mode==='l';
    var h2='<small>'+(narrow?'我':'我方')+'</small><span class="num">'+lv[1]+'</span><span class="sep"></span><small>'+(narrow?'对':'对方')+'</small><span class="num">'+lv[2]+'</span>';
    var lc=$('levelChip');if(lc.__h!==h2){lc.innerHTML=h2;lc.__h=h2;lc.setAttribute('aria-label','级数:我方打'+lv[1]+',对方打'+lv[2]);}

function syncCenter(G){

/* =====================================================================
   手势:点选 / 长按放大 / 横扫拨牌 / 上拖出牌
   ===================================================================== */
var loupe=$('loupe'),ghost=$('dragGhost');
var gest=null;
fanVp.addEventListener('pointerdown',function(e){
  var card=e.target.closest?e.target.closest('.card'):null;if(!card)return;
  /* 拖的是哪一组,按下那一刻就定了:按在已选的牌上 = 整组,按在没选的牌上 = 这一张。
     之后长按放大时手指滑到别的牌上,也不改变要出的牌 */
  var id0=+card.dataset.id,G0=g(),bid=G0&&(G0.phase==='dealing'||G0.phase==='finalDecl');
  var selNow=bid?bidSel:(G0&&G0.selected||new Set());
  gest={id:e.pointerId,card:card,id0:id0,x0:e.clientX,y0:e.clientY,mode:'pending',scroll0:L.progress,
        wasSel:selNow.has(id0),ids:selNow.has(id0)?Array.from(selNow):[id0]};
  gest.hold=setTimeout(function(){
    if(gest&&gest.mode==='pending'){gest.mode='peek';showLoupe(gest.card,e.clientX,e.clientY);}
  },260);
});
document.addEventListener('pointermove',function(e){
  if(!gest||e.pointerId!==gest.id)return;
  var dx=e.clientX-gest.x0,dy=e.clientY-gest.y0;
  /* 手指离开手牌区往上走,不管斜成什么角度都算拖牌(往桌心斜着拖是最自然的动作) */
  var above=e.clientY<handArea.getBoundingClientRect().top-4;
  if(gest.mode==='peek'){
    /* 放大镜跟着手指走:移到哪张看哪张(只是看,要出的牌在按下那一刻已经定了) */
    var under=document.elementFromPoint(e.clientX,e.clientY);
    var c=under&&under.closest&&under.closest('#hand .card');
    if(c&&c!==gest.card){gest.card=c;}
    if(above||(dy<-40&&-dy>Math.abs(dx)*0.6)){hideLoupe();gest.mode='pending';}
    else{showLoupe(gest.card,e.clientX,e.clientY);return;}
  }
  if(gest.mode==='pending'){
    var shallow=gest.wasSel;
    var isDrag=above||dy<-(shallow?12:20)&&-dy>Math.abs(dx)*(shallow?.3:.35);
    var canScrub=!!(L.hand&&L.hand.overflow);
    if(isDrag){
      clearTimeout(gest.hold);hideLoupe();gest.mode='drag';
      try{fanVp.setPointerCapture(e.pointerId);}catch(_){}
      buildGhost();
    }else if(canScrub&&Math.abs(dx)>14&&Math.abs(dx)>Math.abs(dy)*1.5){
      clearTimeout(gest.hold);hideLoupe();gest.mode='scrub';
      try{fanVp.setPointerCapture(e.pointerId);}catch(_){}
    }else return;
  }
  if(gest.mode==='scrub'&&L.hand&&L.hand.overflow){
    var max=Math.max.apply(null,L.hand.rows.map(function(r){return r.over;}));
    L.progress=clamp(gest.scroll0-dx/Math.max(1,max),0,1);
    positionHand();
  }
  if(gest.mode==='drag'){
    moveGhost(e.clientX,e.clientY);
    var inside=inArena(e);
    arena.classList.toggle('drag-over',inside);
    arena.classList.toggle('drag-ready',!inside);
  }
});
/* 松手位置只要在手牌区上方(牌桌、甚至顶栏)都算出牌;回到手牌区里松手 = 取消 */
function inArena(e){var h=handArea.getBoundingClientRect(),a=arena.getBoundingClientRect();return e.clientY<h.top-6&&e.clientX>a.left-20&&e.clientX<a.right+20;}
function endGesture(e,cancelled){
  if(!gest||e.pointerId!==gest.id)return;
  clearTimeout(gest.hold);hideLoupe();hideGhost();
  arena.classList.remove('drag-ready','drag-over');
  var G0=gest;gest=null;
  if(cancelled)return;
  if(G0.mode==='drag'){if(inArena(e))commitDrag(G0);suppressClick();}
  else if(G0.mode==='scrub')suppressClick();
  else if(G0.mode==='peek'){suppressClick();}
}

function bidTarget(set){
  var dz=$('dealZone'),state=g();
  var cards=state&&set.map(function(el){return state.hands[0].find(function(c){return String(c.id)===el.dataset.id;});});
  if(!cards||!cards.length||cards.some(function(c){return !c;}))return null;
  var level=window.__rankOf?window.__rankOf(0):state.trumpRank;
  var btns=Array.prototype.slice.call(dz.querySelectorAll('button[data-a]'));
  var suit=cards[0].suit;
  if(cards.length===1&&cards[0].rank===level)
    return btns.find(function(b){return b.dataset.a==='d'&&b.dataset.s===suit&&b.dataset.st==='1';})||null;
  if(cards.length===2&&cards[0].rank===cards[1].rank&&cards[0].suit===cards[1].suit){
    var st=suit==='X'?(cards[0].rank===16?'4':'3'):'2';
    if(suit==='X'||cards[0].rank===level){
      var t=btns.find(function(b){return b.dataset.a==='d'&&b.dataset.s===(suit==='X'?'':suit)&&b.dataset.st===st;});
      if(!t&&suit!=='X'&&state.decl&&state.decl.suit===suit)t=btns.find(function(b){return b.dataset.a==='re';});
      return t||null;
    }
  }
  return null;
}

/* 出了明显更差的一手、或六六自己没把握的一手:产品记一条进消息流,这里弹出来让人看见 */
function watchCoach(G){
  var chat=chatList(),top=maxChatId();
  if(top<lastChatId)lastChatId=0;
  if(top>lastChatId){
    var fresh=chat.filter(function(m){return m.id>lastChatId;});lastChatId=top;
    var warn=fresh.filter(function(m){return m.from==='coach'&&(m.kind==='warn'||m.kind==='doubt');}).pop();
    if(warn){
      bubble.classList.toggle('warn',warn.kind==='warn');
      $('cbText').innerHTML=warn.html.replace(/^⚠️?\s*/,'');
      $('cbActions').innerHTML='';
      bubbleKind='warn';placeBubble();bubble.hidden=false;
      clearTimeout(bubbleTimer);bubbleTimer=setTimeout(hideBubble,8000);
    }
  }
  if(bubbleKind==='hint'){
    var myTurn=!G.ended&&G.phase==='play'&&G.trick.length<4&&(G.leader+G.trick.length)%4===0;
    if(!myTurn||G.auto)hideBubble();
  }
  var ask=$('btnHint');if(ask&&window.__canAskCoach)ask.disabled=!window.__canAskCoach();
}

function snapshotRound(G){
  var no=(G.start&&G.start.round||0)+1;
  return {no:no,initialHands:G.initialHands?G.initialHands.map(function(h){return h.map(cardTxt);}):null,
    tricks:(G.tricks||[]).map(function(t){return {no:t.no,winner:t.winner,points:t.points,
      plays:t.plays.map(function(p){return {seat:p.seat,cards:p.cards.map(cardTxt)};})};})};
}

  var G=g();if(!G)return;

  if(key&&key!==lastEnded){lastEnded=key;roundHistory.push(snapshotRound(G));}
  if(document.body.classList.contains('drawer-open'))renderSide();
},1000);
var lastLogHtml='';
function renderLog(){
  var G=g();
  var rounds=roundHistory.slice();
  if(G&&!G.ended){var cur=snapshotRound(G);cur.live=true;cur.initialHands=null;
    cur.cur=(G.trick||[]).map(function(p){return {seat:p.seat,cards:p.cards.map(cardTxt)};});rounds.push(cur);}
  if(!rounds.length){
    var h0='<div class="empty-note">还没开局。开局后这里按墩记下每家出的牌。</div>';
    if(recPanel.__h!==h0){recPanel.innerHTML=h0;recPanel.__h=h0;}return;
  }
  var cur2=rounds[rounds.length-1];
  if(logRoundSel!=='cur'){var f=rounds.filter(function(r){return String(r.no)===logRoundSel&&!r.live;});if(f.length)cur2=f[0];}
  var html='<div class="log-controls"><select id="logRound" aria-label="选择局">'+rounds.map(function(r){
      var v=r.live?'cur':String(r.no);
      return '<option value="'+v+'"'+((r===cur2)?' selected':'')+'>第 '+r.no+' 局'+(r.live?'(进行中)':'')+'</option>';}).join('')+'</select>'+
    '<select id="logMode" aria-label="查看方式"><option value="trick"'+(logMode==='trick'?' selected':'')+'>按墩</option>'+
    '<option value="suit"'+(logMode==='suit'?' selected':'')+'>按花色</option></select></div>';
  if(!cur2.live&&cur2.initialHands){
    html+='<details class="init-hands"><summary>四家初始手牌</summary>'+cur2.initialHands.map(function(h,s){
      return '<div class="ih-row"><span class="ih-who">'+who(s)+'</span><span class="tcards">'+h.map(txtHtml).join('')+'</span></div>';}).join('')+'</details>';
  }
  if(logMode==='trick'){
    cur2.tricks.forEach(function(t){html+=trickLine(t);});
    if(cur2.cur&&cur2.cur.length)html+=trickLine({no:cur2.tricks.length+1,winner:-1,points:0,plays:cur2.cur,live:true});
    if(!cur2.tricks.length&&!(cur2.cur&&cur2.cur.length))html+='<div class="empty-note">还没有人出牌。</div>';
  }else{
    var by={},order=['T','♠','♥','♦','♣'],names={T:'主牌','♠':'黑桃','♥':'红桃','♦':'方块','♣':'梅花'};
    var tsuit=G&&G.trump&&G.trump.suit?SUIT_SYM[G.trump.suit]:null,trank=G&&G.trump?rankName(G.trump.rank):null;
    function push(pl){pl.forEach(function(p){p.cards.forEach(function(x){
      var k=x.joker||x.txt[0]===tsuit||x.txt.slice(2)===trank?'T':x.txt[0];(by[k]=by[k]||[]).push(x);});});}
    cur2.tricks.forEach(function(t){push(t.plays);});if(cur2.cur)push(cur2.cur);
    order.forEach(function(k){if(by[k])html+='<div class="suit-row"><span class="sg-label">'+names[k]+'</span><span class="tcards">'+by[k].map(txtHtml).join('')+'</span></div>';});
  }
  if(recPanel.__h!==html){
    var body=document.querySelector('.records-body');
    var atBottom=body.scrollTop+body.clientHeight>=body.scrollHeight-30;
    recPanel.innerHTML=html;recPanel.__h=html;
    $('logRound').onchange=function(){logRoundSel=this.value;renderLog();};
    $('logMode').onchange=function(){logMode=this.value;renderLog();};
    if(atBottom&&logMode==='trick')body.scrollTop=body.scrollHeight;
  }
}
function trickLine(t){

  return true;
}
/* 气泡贴着说话人的名牌,在名牌朝桌心那边 / 上面 / 下面里挑压牌最少的一处;尖角指回名牌 */
function placeSay(el,seat){
  if(!TB.ready)return;
  var lab=rel(labEl(SEAT_K[seat])),bw=el.offsetWidth,bh=el.offsetHeight,aw=TB.aw,ah=TB.ah,gap=10;
  var cx=(lab.left+lab.right)/2,cy=(lab.top+lab.bottom)/2;
  var right={x:lab.right+gap+bw/2,y:cy,t:'t-l'},left={x:lab.left-gap-bw/2,y:cy,t:'t-r'};
  var inward=cx<aw/2?right:left;
  /* 先试朝桌心那边,再试另一边(对家在正中,朝哪边都算),再试上、下 */
  var cands=[inward,inward===right?left:right,{x:cx,y:lab.top-gap-bh/2,t:'t-b'},{x:cx,y:lab.bottom+gap+bh/2,t:'t-t'}];
  var busy=Array.prototype.map.call(document.querySelectorAll('#arena .played:not(.ghost)'),function(p){return p.children.length?rel(p):null;}).filter(Boolean)
    .concat(['N','W','E','S'].filter(function(k){return k!==SEAT_K[seat];}).map(function(k){return rel(labEl(k));}))
    .concat(Array.prototype.map.call(arena.querySelectorAll('.winner-label'),rel));
  var best=null,bestA=1e18;
  cands.forEach(function(c){
    var x=clamp(c.x,bw/2+4,aw-bw/2-4),y=clamp(c.y,bh/2+4,ah-bh/2-4);
    var r={left:x-bw/2,top:y-bh/2,right:x+bw/2,bottom:y+bh/2};
    if(hit(r,lab,2))return;
    var a=busy.reduce(function(n,q){return n+Math.max(0,Math.min(r.right,q.right)-Math.max(r.left,q.left))*Math.max(0,Math.min(r.bottom,q.bottom)-Math.max(r.top,q.top));},0);
    if(a<bestA){bestA=a;best={x:x,y:y,t:c.t};}
  });
  best=best||{x:clamp(inward.x,bw/2+4,aw-bw/2-4),y:inward.y,t:inward.t};
  place(el,best.x,best.y);el.classList.add(best.t);
}
function hideSays(){for(var k in CH.bubbles)CH.bubbles[k].classList.remove('show');}
/* 一墩四家出完(收墩戳刚出来):看这墩发生了什么,挑一个人说一句 */
function chatterTrick(G,res){
  var lvl=chatterLevel();if(lvl==='off'||G.auto&&!window.__chatterTest)return;   /* __chatterTest:只给体检脚本用 */
  var key=(G.start&&G.start.seed)+'/'+G.tricks.length;if(CH.trickKey===key)return;CH.trickKey=key;
  var plays=G.trick,w=res.winner,pts=res.points||0,t=G.trump,no=G.tricks.length;
  var ev=[],ai=function(s){return s>0;};
  try{
    var lead=classify(plays[0].cards,t);
    var wi=plays.findIndex(function(p){return p.seat===w;});
    if(lead&&lead.suit!=='T'&&wi>0&&plays[wi].cards.every(function(c){return effSuit(c,t)==='T';})){
      var prev=resolveTrick(plays.slice(0,wi),t).winner;
      if(prev%2!==w%2&&ai(prev))ev.push({seat:prev,key:'ruffed',pri:4,major:pts>=10});
      if(ai(w))ev.push({seat:w,key:'ruff',pri:3,major:pts>=10});
    }
  }catch(_){}
  if(ai(w)&&pts>=20)ev.push({seat:w,key:w===2?'carry':'win',pri:2,major:pts>=30});
  else if(w===2&&pts>=10)ev.push({seat:2,key:'carry',pri:1});
  if(w===0&&pts>=10){ev.push({seat:Math.random()<.5?1:3,key:'sour',pri:2,major:pts>=25});ev.push({seat:2,key:'praise',pri:1.5,major:pts>=25});}
  if(pts>=15){var losers=[1,2,3].filter(function(s){return s%2!==w%2;});
    if(losers.length)ev.push({seat:losers[Math.floor(Math.random()*losers.length)],key:'lose',pri:1,major:pts>=30});}
  var k=lvl==='less'?.45:1;
  ev.sort(function(a,b){return b.pri-a.pri;});
  for(var i=0;i<ev.length;i++){
    var e=ev[i],cool=e.major?2:3;
    if(no-(CH.lastSeat[e.seat]==null?-9:CH.lastSeat[e.seat])<cool)continue;
    if(!e.major&&no-CH.lastTrick<2)continue;
    if(Math.random()>=(e.major?.9:.45)*k)continue;
    if(say(e.seat,e.key)){CH.lastSeat[e.seat]=no;CH.lastTrick=no;}
    break;
  }
}
/* 电脑亮主 / 反主时嘚瑟一句 */
function chatterDecl(G){
  var d=G.decl;if(!d||!(G.phase==='dealing'||G.phase==='finalDecl'))return;
  var key=(G.start&&G.start.seed)+'/'+d.seat+d.suit+d.strength;if(CH.declKey===key)return;CH.declKey=key;
  var lvl=chatterLevel();if(lvl==='off'||G.auto&&!window.__chatterTest||!d.seat)return;
  if(Math.random()<(lvl==='less'?.3:.65))say(d.seat,'declare');
}
/* 一局打完:局终面板里,队友 Kevin 一句、对手里挑一个一句 */
function chatterEnd(G){
  var key=(G.start&&G.start.seed)+'/'+(G.start&&G.start.round);if(CH.endKey===key)return;
  var oc=$('overlayContent'),head=oc&&oc.querySelector('.res-head');if(!head)return;
  CH.endKey=key;hideSays();
  if(chatterLevel()==='off'||oc.querySelector('.res-quips'))return;
  var won=!oc.querySelector('.res-badge.lose');
  var dug=/翻出/.test((oc.querySelector('.res-sub')||{}).textContent||'');
  var defTeam=G.declSeat>=0?(G.declSeat+1)%2:-1;
  var keyFor=function(s){var mine=s%2===0;return dug&&s%2===defTeam&&(mine===won)?'kittyDig':(mine===won?'endWin':'endLose');};
  var opp=Math.random()<.5?1:3;
  var rows=[2,opp].map(function(s){var l=pickLine(s,keyFor(s));return l?'<div class="quip"><span class="ava mug'+(s===2?' mate':'')+'" aria-hidden="true">'+PLAYERS[s].mug+'</span><span><b>'+who(s)+'</b>'+esc(l)+'</span></div>':'';}).join('');
  if(!rows)return;
  var box=document.createElement('div');box.className='res-quips';box.innerHTML=rows;
  var at=oc.querySelector('.res-levels')||oc.querySelector('.panel-actions');
  at.parentNode.insertBefore(box,at);
}

};
