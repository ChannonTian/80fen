  if(view.declSeat===undefined||view.declSeat<0) return null;
  if(cands.length<2||cands.length>AIP.egMaxCands) return null;   // 只有一个候选,没什么可搜的
  const mem=makeMemory(view);
  const unseen=[];
  let uid=0;
  for(const k in mem.unseen){
    const c=keyToCard(k);
    for(let i=0;i<mem.unseen[k];i++) unseen.push({suit:c.suit,rank:c.rank,id:'e'+(uid++)});
  }
  const seats=[0,1,2,3].filter(s=>s!==view.seat);
  const played=new Set((plays||[]).map(p=>p.seat));
  const sizes={}; seats.forEach(s=>{ sizes[s]=n-(played.has(s)?1:0); });
  const kittySize=view.buriedKnown&&view.buriedKnown.length?0:RULES.kittySize;
  if(unseen.length!==seats.reduce((a,s)=>a+sizes[s],0)+kittySize) return null;
  const voids=makeVoids(view.history||[],trump);
  const reads=makeReads(view.history||[],trump);
  const capMemo={};   // 纯函数,记下来(信念服务那边量过:抽样提速约 6 倍,结果逐位相同)
  const capOf=(s,su)=>{ const k=s+su; return capMemo[k]!==undefined?capMemo[k]:(capMemo[k]=maxHoldIn(reads,mem,s,su,trump)); };
  const pVoidOf=AIP.egVoidW>0?makeVoidProb(reads,mem,trump,n,{declSeat:view.declSeat,me:view.seat}):null;
  const rand=rng((view.history||[]).length*7919+view.seat*31+n*17+1);
  /* 亮主者手里钉死的牌:亮 k 张级牌 → 他手里有 k 张该门级牌(减去他已经打出的);王对同理。 */
  const known=[];
  const decl=view.curDecl||view.decl;
  if(AIP.egDeclKnown&&decl&&decl.seat>=0&&decl.seat!==view.seat&&seats.includes(decl.seat)){
    const want=decl.strength>=3?{suit:'X',rank:decl.strength===4?16:15,n:2}
             :decl.suit?{suit:decl.suit,rank:trump.rank,n:decl.strength}:null;
    if(want){
      let playedByHim=0;
      for(const pl of (view.history||[])) if(pl.seat===decl.seat) for(const c of pl.cards) if(c.suit===want.suit&&c.rank===want.rank) playedByHim++;
      for(const pl of (plays||[])) if(pl.seat===decl.seat) for(const c of pl.cards) if(c.suit===want.suit&&c.rank===want.rank) playedByHim++;
      for(let i=0;i<want.n-playedByHim;i++) known.push({seat:decl.seat,suit:want.suit,rank:want.rank});
    }
  }
  const ctx={unseen,sizes,seats,voids,trump,kittySize,capOf,known,pVoidOf};
  const myTeam=view.seat%2, declTeam=view.declSeat%2;
  const rs=roundScore(view);
  const worlds=[];
  const nSamp=AIP.egSamplesBy>0&&n>5?Math.max(AIP.egMinSamples,AIP.egSamples-AIP.egSamplesBy*(n-5)):AIP.egSamples;
  for(let i=0;i<nSamp;i++){
    const w=sampleWorld(ctx,rand);
    if(w) worlds.push(w);
  }
  if(worlds.length<AIP.egMinSamples) return null;
  const out=cands.map(c=>({cards:c.cards,u:0,v:[]}));
  for(const w of worlds){
    const kitty=view.buriedKnown&&view.buriedKnown.length?view.buriedKnown:w.kitty;
    for(const o of out){
      const hands=[[],[],[],[]];
      seats.forEach(s=>{hands[s]=w.hands[s].slice();});
      hands[view.seat]=view.hand.filter(x=>!o.cards.some(y=>y.id===x.id));
      const p2=(plays||[]).map(p=>({seat:p.seat,cards:p.cards.slice()}));
      p2.push({seat:view.seat,cards:o.cards});
      let leader=p2[0].seat, defPoints=rs.def, pl=p2;
      if(p2.length===4){
        const res=resolveTrick(p2,trump);
        if(res.winner%2!==declTeam) defPoints+=res.points;
        leader=res.winner; pl=[];
        if(!hands.some(h=>h.length)){
          const sc=scoreRound({defPoints,kitty,defWonLastTrick:res.winner%2!==declTeam,
                               lastLeadSize:p2[0].cards.length});
          const u=levelUtility(sc,myTeam,declTeam); o.u+=u; o.v.push(u); continue;
        }
      }
      if(AIP.egExact&&n<=AIP.egExact){
        const u=egSolve({hands,plays:pl,leader,defPoints,trump,declSeat:view.declSeat,kitty,rootTeam:myTeam},-1e9,1e9);
        o.u+=u; o.v.push(u);
        continue;
      }
      const r=AIP.egRolloutAI&&n<=AIP.egRolloutAI
        ? rolloutAI({hands,plays:pl,leader,defPoints,trump,declSeat:view.declSeat,kitty,rand,
                     history:(view.history||[]).slice(0,(view.history||[]).length-(plays||[]).length).concat(p2.length===4?p2:[])})
        : rolloutToEnd({hands,plays:pl,leader,defPoints,trump,declSeat:view.declSeat,mem,rand});
      const sc=scoreRound({defPoints:r.defPoints,kitty,
        defWonLastTrick:r.lastWinner>=0?r.lastWinner%2!==declTeam:false,
        lastLeadSize:r.lastLeadSize});
      const u=levelUtility(sc,myTeam,declTeam); o.u+=u; o.v.push(u);
    }
  }
  out.forEach(o=>{o.u/=worlds.length;});
  out.samples=worlds.length;
  return out;
}
/* 搜索要不要推翻启发式那手 cur:最优候选高出 egMargin 级,且(egZ>0 时)配对差显著。返回要改判成的候选或 null。 */
function egOverride(eg, cur){
  const top=eg.slice().sort((a,b)=>b.u-a.u)[0];
  if(!top||!cur||top.cards===cur.cards||top.u-cur.u<=AIP.egMargin) return null;
  if(AIP.egZ>0){
    const n=top.v.length; if(n<2||cur.v.length!==n) return null;
    let m=0; for(let i=0;i<n;i++) m+=top.v[i]-cur.v[i]; m/=n;
    let ss=0; for(let i=0;i<n;i++){ const d=top.v[i]-cur.v[i]-m; ss+=d*d; }
    const se=Math.sqrt(ss/(n-1)/n);
    if(m<=AIP.egZ*se) return null;
  }
  return top;
}

// 领出决策
function aiChooseLead(view){
  const L=leadCtx(view);
  const {trump}=L;
  const bySuit={};
  view.hand.forEach(c=>{(bySuit[effSuit(c,trump)]=bySuit[effSuit(c,trump)]||[]).push(c);});
  const cands=[];
  for(const s in bySuit){
    const comps=decompose(bySuit[s],trump);
    for(const comp of comps){
      const cl={type:comp.type,len:comp.len,suit:s,top:comp.top,cards:comp.cards};
      const r=scoreLeadPlay(L,cl,comp.cards);
      cands.push({cards:comp.cards,score:r.score,reason:r.reason,suit:s,trumpPen:r.trumpPen,pWin:r.pWin});
    }
    // 甩牌候选:整门多组件且全是钢板(引擎 checkThrow 仍会最终把关)
    if(s!=='T'&&comps.length>=2&&bySuit[s].length<=6){
      const cl=classify(bySuit[s],trump);
      if(cl&&cl.type==='throw'){
        const r=scoreLeadPlay(L,cl,bySuit[s]);
        if(r.score>40) cands.push({cards:bySuit[s],score:r.score,reason:r.reason});
      }
    }
    /* 甩**子集**:本门里压不住的那几组一起甩,把带不动的小牌留下。
     *
     * 报障三条其实是同一件事,根子都在上面那段只认「整门」:
     *   · ♣KK 领出后确认没人有 ♣ 对 → 剩下的 ♣10♣10 和 ♣7♣7 该一次甩掉,
     *     可只要手上还有一张管不住的 ♣ 小牌,整门就甩不成立,候选压根不生成;
     *   · 副色 AAK / AKK 同理 —— A 和 KK 各自都压不住,整门带上一张小牌就废了;
     *   · 教练「不能辨别撒牌比单张更大」也是它:候选集里没有子集甩牌,
     *     只能拿单张去比,自然永远建议单张。
     *
     * 为什么值得甩:一墩里「后出的牌结构必须和领出的一样才参与比较」(RULES E)。
     * 分两次打两个对子,对手有**一个**主对就能端走一次;两对一起甩,
     * 他得同时有**两个**主对才拿得走 —— 概率低得多。牌型本身就是护甲。
     *
     * 判据只用「这一组在本门压不住」(isBossPlay),不猜对手断不断门 ——
     * 断门归 ruffable 那一项管,两件事不混在一起。 */
    if(AIP.throwBossSubset&&s!=='T'&&comps.length>=2){
      const boss=comps.filter(cp=>isBossPlay({type:cp.type,len:cp.len,suit:s,top:cp.top},L.mem,trump));
      if(boss.length>=2&&boss.length<comps.length){
        const cs=boss.reduce((a2,cp)=>a2.concat(cp.cards),[]);
        const cl2=classify(cs,trump);
        if(cl2&&cl2.type==='throw'){
          const r2=scoreLeadPlay(L,cl2,cs);
          if(r2.score>40) cands.push({cards:cs,score:r2.score,reason:r2.reason});
        }
      }
    }
  }
  // v3 这里还硬塞过一颗 `score:46 主力雄厚,钓主清场` 的候选。常数 46 无条件压过其他所有
  // 候选,且不看对手还剩几张主 —— 现在钓主的收益由 drawTrumpValue 在正常评分里算出来,
  // 所有主牌组件都能参与竞争,不需要这颗特例。
  /* §7.13 阶段 0:领主的代价是相对的(见 AIP.trumpLeadRel)。
   * 手上没有「副花里高概率赢墩、对手又不太可能断这门」的一手时,钓主不再背那两笔绝对罚分。 */
  let relIntoVoid=false;     // 教练对账用:这一手的钓主候选有没有被退还罚分
  if(AIP.trumpLeadRel&&view.hand.length>AIP.egMaxCards){
    // 只在产品方说的那个情形里改判:原本的首选是**领进对手多半断的副花**。
    // 首选若是副花里的钢板 / 高概率赢墩的牌,或者只是副花小牌探路,都不动。
    const top=cands.reduce((a,c)=>c.score>a.score?c:a,cands[0]);
    const intoVoid=top&&top.suit!=='T'&&L.oppVoidP(top.suit)>=0.5;
    relIntoVoid=!!intoVoid;
    if(intoVoid) for(const c of cands) if(c.suit==='T'&&c.trumpPen>0){
      c.score+=AIP.trumpLeadRel*c.trumpPen;
      c.reason='副花里没有稳当的一手,只剩领进对手断门 —— 钓主,把牌权交出去';
    }
  }
  /* 闲家中盘单领王(#17,产品方原则 7「王留到最后」):joker-lead 反事实(1600 副、596 次,真 AI 打完)量出
   * 闲家领王比最好的非王领出 −0.107 ±0.036 级 / −3.0 分;庄家 −0.04(不显著)、帮家 +0.10(不显著)。只罚闲家。 */
  if(AIP.jokerLeadDef&&view.seat%2!==view.declSeat%2&&view.hand.length>AIP.jokerLeadDefMin)
    for(const c of cands) if(c.cards.length===1&&c.cards[0].suit==='X') c.score-=AIP.jokerLeadDef;
  cands.sort((a,b)=>b.score-a.score);
  let best=cands[0]||{cards:[view.hand[0]],reason:'兜底',score:0};
  /* v0.7.0:收官交给搜索。只用它**排序**(目标函数是「净升几级」,和分制不同量纲),
   * 而且要比启发式选中的那个高出 egMargin 级才改判 —— 样本噪声区里仍然听启发式的。 */
  const eg=endgameSearch(view,null,cands.slice(0,AIP.egMaxCands));
  if(eg){
    const cur=eg.find(o=>o.cards===best.cards);
    const top=egOverride(eg,cur);
    if(top){
      const c=cands.find(x=>x.cards===top.cards);
      if(c) best={...c,reason:'收官推演:'+c.reason+`(${eg.samples}样本,净升 ${top.u.toFixed(2)} 级)`};
    }else if(cur) best={...best,reason:best.reason+`(收官推演确认,净升 ${cur.u.toFixed(2)} 级)`};
  }
  // all / eg / relIntoVoid:给教练对账用(v0.7.31;只多带字段,决策不变)
  return {...best,cands:cands.slice(0,3),all:cands,eg:eg||null,relIntoVoid};
}

// 教练用:给任意一手领出打分
function coachScoreLead(view, cards){
  return scoreLeadPlay(leadCtx(view),classify(cards,view.trump),cards).score;
}

/* ============================================================
 * 教练评估(v0.7.31):你这一手 vs 教练的首选,在 AI 自己那张候选表上对账
 * ============================================================
 *
 * 失误反馈原来是 `best.score − coachScoreFollow(你这手)`。对账(test/audit-coach.js,60 局)查出三处口径不一:
 *   ① aiChooseFollow 给候选加的规则加成 / 罚分(ruffOppBonus、ruffVoidBehind、ruffPartnerBonus、
 *      overPartner、ruffGuardBonus)和钓主墩的牌权口径(tiaoAccept 设的 X.tempoW),
 *      coachScoreFollow 一样都没有 —— 跟牌侧 17% 的候选教练和 AI 给的分对不上,378 个差 ≥6 分;
 *   ② 领出侧 trumpLeadRel 退还罚分的钓主候选,教练照扣,每个多扣约 30 分;
 *   ③ 收官推演改判时,首选的启发式分比候选表第一名低 —— 你出第一名,分差 ≤0,
 *      推演量出来更差的那一手**永远不报**(134 次里 118 次)。
 *
 * coachScoreFollow / coachScoreLead 原样保留:AI 的 partnerRuffDump、自测、cf-* 量具都在用它们,
 * 改了就是改 AI。教练改走这里:
 *   · 你这手就在 AI 的候选表里 → 直接取 AI 给它的分,逐字同口径;
 *   · 不在(候选之外的出法)→ 同一个上下文(含 tempoW)+ 同一套规则加成现场打分,胜负用 currentWinner 判;
 *   · 收官推演生效的局面 → 分差按「净升级数 × COACH_EG_PTS」折算,和 AI 做决定用的是同一把尺子。
 *
 * 「把握」= 首选领先第二名多少(同一单位)。分差小于噪声、或者命中已知短板(跨阶梯线,§7 第一行 /
 * 场景 H1 仍是 todo)时,教练不该用讲规则的语气说它。 */
const COACH_EG_PTS=40;          // 一级 = 40 分(阶梯 0/40/80/120/160)
const COACH_LEAD_SCALE=4;       // 领出含牌权战略值,量纲约为跟牌 4 倍(原 LEAD_GAP_SCALE,从界面搬进来)
const COACH_CONF={high:12, mid:4};
const coachSame=(a,b)=>a.length===b.length&&a.every(x=>b.some(y=>y.id===x.id));

// 候选之外的跟牌:与 aiChooseFollow 同一上下文、同一套规则加成
function coachFollowScoreFull(view, plays, cards){
  const X=followCtx(view,plays);
  const {trump,lead}=X;
  if(AIP.tiaoAccept&&plays[0].seat===X.partnerSeat&&lead.suit==='T'&&lead.type==='single'
     &&plays[0].cards[0].suit!=='X'&&!isBossPlay(lead,X.mem,trump))
    X.tempoW=AIP.leadTempoWeight;
  const wins=currentWinner(plays.concat([{seat:view.seat,cards}]),trump).seat===view.seat;
  const cl=classify(cards,trump);
  const isRuff=wins&&!!cl&&cl.suit==='T'&&lead.suit!=='T';
  let cat='cheap';
  if(wins) cat=isRuff?'ruff':'over';
  else if(countPoints(cards)) cat='dump';
  else if(cards.some(c=>effSuit(c,trump)!==lead.suit)) cat='discard';
  let pen=0;
  if(wins&&!X.partnerWinning&&isRuff){
    if(AIP.ruffOppRule&&X.ptsTable>=AIP.ruffOppMinPts) pen+=AIP.ruffOppBonus;
    if(X.remainingOpp.some(s=>X.voids[s]&&X.voids[s][lead.suit])) pen+=AIP.ruffVoidBehind;
  }else if(wins&&X.partnerWinning){
    const voidLead=!view.hand.some(c=>effSuit(c,trump)===lead.suit);
    if(isRuff&&!X.isLast&&!X.curBoss&&X.ptsTable>=AIP.ruffPartnerMinPts&&voidLead) pen+=AIP.ruffPartnerBonus;
    else pen+=AIP.overPartner;
  }
  return {score:scorePlay(X,cards,cat,wins)-pen, cat, reason:null};
}
function coachLeadScoreFull(view, cards, adv){
  const cl=classify(cards,view.trump);
  if(!cl) return {score:-20,reason:null};
  const r=scoreLeadPlay(leadCtx(view),cl,cards);
  let s=r.score;
  if(adv&&adv.relIntoVoid&&cl.suit==='T'&&r.trumpPen>0) s+=AIP.trumpLeadRel*r.trumpPen;
  return {score:s,reason:null};
}

/* 跨阶梯线的薄冰(只在跟牌侧):首选**不**抢这一墩,而抢下/放掉恰好决定闲家分过不过一条线。
 * 这正是 §7 第一行 / 场景 H1:评分器在这种点上系统性偏保守(cf-line:+0.33 级)。
 * 返回 {line, def, reach, defender} 或 null。 */
function coachLadder(view, plays, adv){
  if(!plays||!plays.length||view.declSeat===undefined||view.declSeat<0) return null;
  const trump=view.trump;
  const mine=cs=>currentWinner(plays.concat([{seat:view.seat,cards:cs}]),trump).seat%2===view.seat%2;
  if(mine(adv.cards)) return null;
  const win=(adv.cands||[]).filter(c=>mine(c.cards));
  if(!win.length) return null;
  const defender=view.seat%2!==view.declSeat%2;
  const {def}=roundScore(view);
  const table=countPoints(plays.flatMap(p=>p.cards));
  const add=defender?Math.max(...win.map(c=>countPoints(c.cards))):countPoints(adv.cards);
  const reach=def+table+add;
  if(table+add<=0) return null;
  const line=[40,80,120,160].find(L=>def<L&&L<=reach);
  return line?{line,def,reach,defender}:null;
}

function coachConf(margin, ladder){
  if(ladder) return 'low';
  return margin>=COACH_CONF.high?'high':margin>=COACH_CONF.mid?'mid':'low';
}

/* 首选、把握、替代方案(问教练用;也是 coachEval* 的底子)。
 * alts:其余候选,delta = 比首选少多少分(同一单位,已按领出 / 推演折算)。 */
function coachJudgeFollow(view, plays, adv){
  adv=adv||aiChooseFollow(view,plays);
  const cands=adv.cands||[];
  const eg=adv.eg;
  let alts, unit='pts';
  const uOf=cs=>{ if(!eg) return null; const o=eg.find(o=>coachSame(o.cards,cs)); return o?o.u:null; };
  const uBest=uOf(adv.cards);
  if(uBest!=null){
    unit='eg';
    alts=eg.filter(o=>!coachSame(o.cards,adv.cards)).map(o=>{
      const c=cands.find(x=>coachSame(x.cards,o.cards));
      return {cards:o.cards,reason:c?c.reason:'',delta:(uBest-o.u)*COACH_EG_PTS};
    });
  }else{
    alts=cands.filter(c=>!coachSame(c.cards,adv.cards)).map(c=>({cards:c.cards,reason:c.reason,delta:adv.score-c.score}));
  }
  alts.sort((a,b)=>a.delta-b.delta);
  // 首选不是候选表第一名、又没有推演撑腰 = 规则改判(贴分改判),分数量不出它好在哪
  const rule=unit==='pts'&&cands.length&&!coachSame(cands[0].cards,adv.cards);
  let margin=alts.length?alts[0].delta:Infinity;
  if(rule) margin=0;
  const ladder=coachLadder(view,plays,adv);
  return {adv,alts,margin,conf:coachConf(margin,ladder),ladder,unit,rule};
}
function coachJudgeLead(view, adv){
  adv=adv||aiChooseLead(view);
  const all=adv.all||adv.cands||[];
  const eg=adv.eg;
  let alts, unit='pts';
  const uOf=cs=>{ if(!eg) return null; const o=eg.find(o=>coachSame(o.cards,cs)); return o?o.u:null; };
  const uBest=uOf(adv.cards);
  if(uBest!=null){
    unit='eg';
    alts=eg.filter(o=>!coachSame(o.cards,adv.cards)).map(o=>{
      const c=all.find(x=>coachSame(x.cards,o.cards));
      return {cards:o.cards,reason:c?c.reason:'',delta:(uBest-o.u)*COACH_EG_PTS};
    });
  }else{
    alts=all.filter(c=>!coachSame(c.cards,adv.cards)).map(c=>({cards:c.cards,reason:c.reason,delta:(adv.score-c.score)/COACH_LEAD_SCALE}));
  }
  alts.sort((a,b)=>a.delta-b.delta);
  const margin=alts.length?alts[0].delta:Infinity;
  return {adv,alts,margin,conf:coachConf(margin,null),ladder:null,unit,rule:false};
}

/* 你出的这一手:gap = 比首选少多少分(≤0 不算失误),单位已统一成「分」。 */
function coachEvalFollow(view, plays, cards, adv){
  const J=coachJudgeFollow(view,plays,adv);
  adv=J.adv;
  const hit=(adv.cands||[]).find(c=>coachSame(c.cards,cards));
  const mine=hit?{score:hit.score,cat:hit.cat,reason:hit.reason}:coachFollowScoreFull(view,plays,cards);
  let gap;
  if(coachSame(adv.cards,cards)) gap=0;
  else if(J.unit==='eg'){
    const a=J.alts.find(x=>coachSame(x.cards,cards));
    if(a) gap=a.delta;
    else{
      // 候选之外的出法:和首选放进同一次推演(同一批抽样世界)再比一次
      const r=endgameSearch(view,plays,[{cards:adv.cards},{cards}]);
      gap=r?(r[0].u-r[1].u)*COACH_EG_PTS:adv.score-mine.score;
    }
  }else gap=adv.score-mine.score;
  if(J.rule) gap=Math.max(0,gap);
  return {...J,gap,inCands:!!hit,mine};
}
function coachEvalLead(view, cards, adv){
  const J=coachJudgeLead(view,adv);
  adv=J.adv;
  const all=adv.all||adv.cands||[];
  const hit=all.find(c=>coachSame(c.cards,cards));
  const mine=hit?{score:hit.score,reason:hit.reason}:coachLeadScoreFull(view,cards,adv);
  let gap;
  if(coachSame(adv.cards,cards)) gap=0;
  else if(J.unit==='eg'){
    const a=J.alts.find(x=>coachSame(x.cards,cards));
    if(a) gap=a.delta;
    else{
      const r=endgameSearch(view,null,[{cards:adv.cards},{cards}]);
      gap=r?(r[0].u-r[1].u)*COACH_EG_PTS:(adv.score-mine.score)/COACH_LEAD_SCALE;
    }
  }else gap=(adv.score-mine.score)/COACH_LEAD_SCALE;
  return {...J,gap,inCands:!!hit,mine};
}

/* ============================================================
 * 教练的建议单与相关事实(v0.7.33)
 * ============================================================
 * 试玩反馈(v0.7.31):「确定的」那段把每一门的最大牌、谁断门、还剩几分全列出来,太长;
 * 「把握低」「差 1 分 / 差 16 分」看不懂。改成:
 *   · 建议单 = 最佳(可并列)+ 出了也不算失误的可选项,最多 3 个,按价值降序;
 *   · 每个候选**只带它自己那门的相关事实**,不再整页罗列;
 *   · 事实全用严格口径(硬演绎,和棋力无关):「别家」= 三家手里 + 底牌(庄家已知底牌时扣掉),
 *     与记牌表页签同一口径。对子是不是「钢板」AI 是按概率判的(pPairAbove),
 *     这里不说「压不住」,只说「♦K 两张都还没出」这种数得出来的事。
 * 纯函数,不碰 DOM、不产出文字(文字归界面块,术语要跟语言档走)。 */
const COACH_TIE=3;     // 与首选相差不到 3 分(统一单位)算并列

// 别家还有哪些比 idx 大的牌(同一门):[{card,n}],从大到小
function coachBiggerUnseen(mem, suit, trump, idx){
  const out=[];
  for(const k in mem.unseen){
    const n=mem.unseen[k]; if(n<=0) continue;
    const c=keyToCard(k);
    if(effSuit(c,trump)===suit&&ordIdx(c,trump)>idx) out.push({card:c,n});
  }
  return out.sort((a,b)=>ordIdx(b.card,trump)-ordIdx(a.card,trump));
}
// 某家第几墩没跟出这门(断门的硬证据);没有就 0
function coachVoidTrick(history, seat, suit, trump){
  for(let i=0;i+1<(history||[]).length;i+=4){
    const trick=history.slice(i,i+4), lead=classify(trick[0].cards,trump);
    if(!lead||lead.suit!==suit) continue;
    for(let j=1;j<trick.length;j++)
      if(trick[j].seat===seat&&trick[j].cards.some(c=>effSuit(c,trump)!==suit)) return i/4+1;
  }
  return 0;
}

/* 一手牌的相关事实。领出看「这一门」;跟牌看「这一墩」。 */
function coachFacts(view, plays, cards){
  const t=view.trump, mem=makeMemory(view), hist=view.history||[];
  const voids=makeVoids(hist,t);
  const isOpp=s=>s%2!==view.seat%2, partner=(view.seat+2)%4;
  const cl=classify(cards,t);
  if(!plays||!plays.length){
    const suit=cl?cl.suit:effSuit(cards[0],t);
    const f={kind:'lead', suit, type:cl?cl.type:'?', out:0, top:null,
             outPts:unseenPointsIn(mem,suit,t),
             mine:view.hand.filter(c=>effSuit(c,t)===suit).length,
             boss:null, bigger:null, pairAbove:null, oppVoid:[], partnerVoid:false};
    for(const k in mem.unseen){
      const n=mem.unseen[k]; if(n<=0) continue;
      const c=keyToCard(k); if(effSuit(c,t)!==suit) continue;
      f.out+=n; if(!f.top||ordIdx(c,t)>ordIdx(f.top,t)) f.top=c;
    }
    if(cl&&cl.type==='single'){
      f.bigger=coachBiggerUnseen(mem,suit,t,cl.top);
      f.boss=!f.bigger.length;
    }else if(cl&&(cl.type==='pair'||cl.type==='tractor')){
      // 严格口径:比我这组最大那对还大、两张都还没露面的点数
      f.pairAbove=coachBiggerUnseen(mem,suit,t,cl.top).filter(x=>x.n>=2).map(x=>x.card);
      f.boss=!f.pairAbove.length;
    }
    if(suit!=='T'){
      f.oppVoid=[1,2,3].map(x=>(view.seat+x)%4).filter(s=>isOpp(s)&&voids[s][suit]);
      f.partnerVoid=!!voids[partner][suit];
    }
    return f;
  }
  const lead=classify(plays[0].cards,t);
  const before=currentWinner(plays,t);
  const after=currentWinner(plays.concat([{seat:view.seat,cards}]),t);
  const behind=[]; for(let i=plays.length+1;i<4;i++) behind.push((plays[0].seat+i)%4);
  const f={kind:'follow', leadSuit:lead.suit, leadType:lead.type, need:lead.cards.length,
           wins:after.seat===view.seat, last:plays.length===3,
           table:countPoints(plays.flatMap(p=>p.cards)), pts:countPoints(cards),
           partnerWinning:before.seat%2===view.seat%2, curSeat:before.seat,
           mineInSuit:view.hand.filter(c=>effSuit(c,t)===lead.suit).length,
           ruff:false, behindOpp:behind.filter(isOpp), behindOppVoid:[],
           bigger:null, partnerCard:null, partnerBigger:null, beatCard:null};
  f.ruff=f.wins&&!!cl&&cl.suit==='T'&&lead.suit!=='T';
  if(lead.suit!=='T') f.behindOppVoid=f.behindOpp.filter(s=>voids[s][lead.suit]);
  if(f.wins&&!f.last&&!f.ruff&&cl&&cl.type==='single') f.bigger=coachBiggerUnseen(mem,lead.suit,t,cl.top);
  if(!f.wins&&before.cl.type==='single'){
    const cur=plays.find(p=>p.seat===before.seat).cards[0];
    if(f.partnerWinning){ f.partnerCard=cur; f.partnerBigger=coachBiggerUnseen(mem,before.cl.suit,t,before.cl.top); }
    else{
      // 对手暂大:「别家已无更大」≠「这墩压得过」—— 桌上可能已被毙,或已有同样大的先出(同样大先出者赢)
      const mine=view.hand.filter(c=>effSuit(c,t)===lead.suit);
      f.beatCard=cur; f.ruffed=before.cl.suit!==lead.suit;
      f.myTop=mine.length?mine.reduce((a,b)=>ordIdx(b,t)>ordIdx(a,t)?b:a):null;
      f.canBeat=!f.ruffed&&!!f.myTop&&ordIdx(f.myTop,t)>before.cl.top;
    }
  }
  return f;
}

/* 建议单:最佳(可并列)+ 与首选相差不超过 okThr 的可选项(= 出了也不会被报失误),最多 max 个。
 * 首选永远是 AI 自己的选择(约束 6);同门、同牌型、同样带几分、同一句理由、同一档的牌合并成一条「或」。 */
function coachReasonCore(r){
  // 收官推演的后缀有两种:「(收官推演确认,净升 0.12 级)」「(44样本,净升 -0.41 级)」—— 玩家看不懂,整段去掉
  return String(r||'').replace(/^收官推演:/,'').replace(/\((收官推演|\d+样本)[^)]*\)/g,'');
}
/* ---- 教练说的理由(v0.7.36)----
 * 候选自带的 reason 是 AI 候选**生成器的标签**,不是这一手的解释:「贴分」那条生成器没挑到分牌时
 * 一律说「这门没分可贴,跟一张」—— 不看谁暂大(对手暂大谈不上「贴」),也不看领的是几张;
 * 断门时才该用的「垫废牌」在有这门时照样挂着;v0.7.32 followBeatsCheck 之后「跟小」也可能其实毙下了。
 * test/audit-coach-text.js 在 60 局里量到:说「贴」而这墩归对手 50.5%、「跟一张」而领的是对子 28.4%、
 * 「垫」而其实有这门 100%、「躲不掉的分」而手里有更小又不带分的同门牌 53.8%。
 * 做法:AI 的原句**和局面对得上就照用**(它常常带着真正的考虑,如「下家已知在这门断门 —— 毙到……」);
 * 对不上就按事实重写。只改说法,不改选择 —— 首选仍是 AI 的。 */
const COACH_OK=6;      // 「也可以」:与首选相差不到 6 分(v0.7.33 用失误门槛 12,太松,把白送 10 分也列了进来)
function coachOkThr(gapThr){ return Math.min(isFinite(gapThr)?gapThr:12,COACH_OK); }

/* 这一手带了分:有没有「一分不带、又不动更大的牌」的合法跟法 ——「躲不掉的分」要它为假才成立。
 *   这门够跟:这门里挑同样张数、不带分、最大那张不比出的大,还要合法(有对必对、有拖拉机跟拖拉机);
 *   这门不够(含断门):这门全跟上,补的那几张换成不带分的副牌小牌(10 以下)。
 * 拿小王 / 副 A 去省一个 5 分不算「便宜」—— 那是另一种取舍。组合多到数不过来时返回 null(不下结论)。 */
function coachCheapZeroAlt(view, plays, cards){
  const t=view.trump, lead=classify(plays[0].cards,t), need=lead.cards.length;
  if(!countPoints(cards)) return false;
  const suit=view.hand.filter(c=>effSuit(c,t)===lead.suit);
  if(suit.length<need){
    if(countPoints(suit)) return false;          // 这门的分是被迫跟出去的
    return view.hand.filter(c=>effSuit(c,t)!==lead.suit&&cardPoints(c)===0&&effSuit(c,t)!=='T'&&c.rank<=10)
      .length>=need-suit.length;
  }
  const top=Math.max(...cards.filter(c=>effSuit(c,t)===lead.suit).map(c=>ordIdx(c,t)));
  const pool=suit.filter(c=>cardPoints(c)===0&&ordIdx(c,t)<=top);
  let tried=0, found=false;
  const pick=[], rec=i=>{
    if(found||tried>4000) return;
    if(pick.length===need){ tried++; found=isLegalFollow(view.hand,lead,pick,t); return; }
    for(let j=i;j<=pool.length-(need-pick.length)&&!found;j++){ pick.push(pool[j]); rec(j+1); pick.pop(); }
  };
  rec(0);
  return found||(tried>4000?null:false);
}
// 真是小牌:9 以下、不是级牌也不是王 ——「跟小」「小牌探路」「垫小主」都要它
function coachSmall(c, t){ return c.suit!=='X'&&c.rank!==t.rank&&c.rank<=9; }
// 这张在它那门里已是最大一档(副牌 A、大王):「别家还有几张比它大」答案恒为 0,不值得问
function coachTopRank(c, t){
  const s=effSuit(c,t), o=ordIdx(c,t);
  return !makeDeck().some(x=>effSuit(x,t)===s&&ordIdx(x,t)>o);
}
// 队友这张赢定了吗:我是末家;或者单张墩里别家已没有更大的、后面的对手也没露出断门(与 factText 同一口径)
function coachPartnerSure(f){
  return f.last||(!!f.partnerBigger&&!f.partnerBigger.length&&!f.behindOppVoid.length);
}

/* 这一手是不是只有一种合法出法。只认得出最常见的三种,认不出的一律当「有得选」:
 *   last:手里剩的正好是要出的张数;all:这门只剩要跟的张数(全跟上);
 *   pair:领一对、这门张数够、手里这门恰好只有一对(有对必对)。 */
function coachForced(view, plays){
  const t=view.trump, h=view.hand;
  if(!plays||!plays.length) return h.length===1?'last':null;
  const lead=classify(plays[0].cards,t), need=lead.cards.length;
  if(h.length===need) return 'last';
  const mine=h.filter(c=>effSuit(c,t)===lead.suit);
  if(mine.length===need) return 'all';
  if(lead.type==='pair'&&mine.length>need){
    const cnt={}; for(const c of mine){ const k=pairKey(c); cnt[k]=(cnt[k]||0)+1; }
    if(Object.values(cnt).filter(n=>n>=2).length===1) return 'pair';
  }
  return null;
}

/* 这门里还有没有「更小、又不更带分」、而且**能替它出**的牌:领对子时只和对子比
 * (领 ♥K♥K、我出 ♥7♥7,手里的单张 ♥4 替代不了一对,所以 ♥7♥7 就是「跟小的」)。 */
function coachCheaperLeft(view, lead, cards){
  const t=view.trump;
  const played=cards.filter(c=>effSuit(c,t)===lead.suit);
  const unplayed=view.hand.filter(c=>effSuit(c,t)===lead.suit&&!cards.some(x=>x.id===c.id));
  const pcl=played.length?classify(played,t):null;
  if(lead.type==='pair'&&pcl&&pcl.type==='pair'){
    const by={}; for(const c of unplayed)(by[pairKey(c)]=by[pairKey(c)]||[]).push(c);
    return Object.values(by).some(v=>v.length>=2&&ordIdx(v[0],t)<pcl.top&&cardPoints(v[0])*2<=countPoints(played));
  }
  return unplayed.some(u=>played.some(p=>ordIdx(u,t)<ordIdx(p,t)&&cardPoints(u)<=cardPoints(p)));
}
// 跟牌:AI 原句和这一手对得上吗(与 test/audit-coach-text.js 同一套判据)
function coachFollowReasonOK(view, plays, cards, f, r){
  const t=view.trump, lead=classify(plays[0].cards,t), need=lead.cards.length;
  const iWin=f.wins, partnerWins=!iWin&&f.partnerWinning;
  const mine=view.hand.filter(c=>effSuit(c,t)===lead.suit);
  const played=cards.filter(c=>effSuit(c,t)===lead.suit);
  const partnerAfter=plays.length<2&&!plays.some(p=>p.seat===(view.seat+2)%4);   // 队友还没出
  const big=c=>cardPoints(c)>0||c.rank>=12||c.suit==='X'||(effSuit(c,t)==='T'&&lead.suit!=='T');
  // 「贴」:这墩最后归队友;或者队友还没出、理由明说在等他毙 —— 两种都要求我自己没赢(我毙下了就不叫贴)
  if(/贴/.test(r)&&(iWin||!(partnerWins||(/队友多半断|会毙/.test(r)&&partnerAfter)))) return false;
  if(/跟一张/.test(r)&&(need!==1||!mine.length)) return false;   // 领的不是单张、或者断了这门(那叫垫)
  if(/垫/.test(r)&&!cards.some(c=>effSuit(c,t)!==lead.suit)) return false;
  if(/跟小|保留实力/.test(r)){
    if(iWin||!mine.length) return false;      // 毙下了、或者断了这门(那叫垫,不叫跟)
    if(coachCheaperLeft(view,lead,cards)) return false;
    if(mine.length&&played.length===mine.length&&played.some(big)) return false;
    if(!played.every(c=>coachSmall(c,t))) return false;   // ♠Q♠A、主 A 不叫「跟小」
  }
  if(/跟分/.test(r)&&(iWin||!mine.length)) return false;  // 毙下了是收分;断了这门是垫分
  if(/队友还在后面/.test(r)&&(iWin||!partnerAfter)) return false;   // AI 第 2 家带分跟 / 垫(v0.7.37,ai-progress 第 10 项)
  if(/先把分跟上/.test(r)&&!mine.length) return false;
  if(/先把分垫上/.test(r)&&mine.length) return false;
  if(/毙/.test(r)&&!/被毙|来毙|会毙|能毙|可能毙|让他毙|再毙/.test(r)&&!f.ruff) return false;
  if(/我断门|断门毙/.test(r)&&mine.length) return false;
  if(/下家已知在这门断门/.test(r)&&!f.behindOppVoid.length) return false;
  if(/躲不掉/.test(r)&&(iWin||coachCheapZeroAlt(view,plays,cards))) return false;
  if(/最后一手/.test(r)&&!f.last) return false;
  if(/能吃住|压住|稳吃|稳拿|尝试吃|争这墩|接过|拿牌权|压到|吃到/.test(r)&&!/被/.test(r)&&!iWin) return false;
  if(/收分|抢分|争这墩分/.test(r)&&f.table+f.pts<=0) return false;
  if(/队友稳赢|队友只是暂大/.test(r)&&!f.partnerWinning) return false;
  if(/队友稳赢/.test(r)&&!coachPartnerSure(f)) return false;   // 事实那句会说「别家还有 N 张比他那张大」
  if(/台面有分/.test(r)&&!f.table) return false;
  if(/而对手暂大/.test(r)&&f.partnerWinning) return false;
  if(/队友那张并非稳赢/.test(r)&&!f.partnerWinning) return false;
  return true;
}
// 跟牌:按事实写一句(对不上时用)
function coachFollowReasonRewrite(view, plays, cards, f, tier, r){
  const t=view.trump, lead=classify(plays[0].cards,t), need=lead.cards.length;
  const mine=view.hand.filter(c=>effSuit(c,t)===lead.suit);
  const played=cards.filter(c=>effSuit(c,t)===lead.suit);
  const big=c=>cardPoints(c)>0||c.rank>=12||c.suit==='X'||(effSuit(c,t)==='T'&&lead.suit!=='T');
  // 只说意图 —— 事实(压没压住、台面几分、带几分)由后面那句 factText 说,两边不要重复
  if(f.wins) return f.last?(f.ruff?'毙下来':'拿下这墩')
                          :(f.ruff?'毙下来,先把牌权拿住':'压上去,争这墩');
  const allForced=mine.length&&played.length===mine.length&&played.some(big);
  const cheaper=coachCheaperLeft(view,lead,cards);
  const noSuit=!mine.length;
  const dumpTrump=cards.filter(c=>effSuit(c,t)==='T'&&lead.suit!=='T');
  if(f.partnerWinning){
    // AI 说「队友稳赢」是它的把握(certainty>0.8),不是硬事实 —— 事实那句还挂着「别家还有 N 张比他那张大」
    if(f.pts) return /队友稳赢/.test(r||'')?'队友多半赢得下,贴分':'给队友贴分';
    return noSuit?'垫不带分的':'不带分跟上';
  }
  if(f.pts){
    const alt=coachCheapZeroAlt(view,plays,cards);
    // 首选本身白送(AI 生成器「躲不掉的分先出」):不替它说「躲不掉」,如实说是它估计留着也保不住
    if(alt) return tier!=='best'?`这手送对手 ${f.pts} 分`
      :noSuit?`先把这 ${f.pts} 分垫掉 —— 我估计这张分牌留着也保不住`
      :`先把这 ${f.pts} 分出掉 —— 我估计这门的分留着也保不住`;
    if(alt===false) return allForced?'这门只剩这几张,带分也只能跟上':'躲不掉,只能带分';
    return '带分跟上';
  }
  if(allForced) return '这门只剩这几张,只能全跟上';
  if(noSuit) return !dumpTrump.length?'垫不带分的':dumpTrump.every(c=>coachSmall(c,t))?'垫小主':'垫主';
  // 手里更小的都带分(♠Q♠A 跟、♠5♠10 留着)—— 那叫「不带分跟上」,不叫「跟小」
  if(cheaper||!played.every(c=>coachSmall(c,t))) return '不带分跟上';
  return need>1?'跟小的':'跟一张小的';
}
/* 领出要改口的几处:
 *   ① 有几条标签是 AI 用来解释「这手为什么扣分」的(「主牌不占优,先不动主」挂在大怪上、「分对慎出」挂在分对上),
 *      这手照样当选时,当成推荐理由读就是反话 —— 改成「这手能做到什么 + 代价」;
 *   ② 钢板怕被毙:「对手多半断这门」在已有对手确定断了、甚至别家一张都没有时,按硬事实说;
 *   ③「小主」其实不小、「小牌」其实是 Q/K 或这门最大、「队友的断门」其实只是推测。 */
function coachLeadReason(view, cards, f, r, tier){
  const t=view.trump, cl=classify(cards,t);
  let risky=false;
  if(/^主牌不占优,先不动主/.test(r)) r='主牌不占优,本不想动主 —— 但这手稳拿这墩';
  else if(/^大主牌留作后手/.test(r)) r='大主本想留到收官 —— 但这手稳拿这墩';
  else if(/^分对慎出/.test(r)){ r='分对,有被压的风险'; risky=true; }
  else if(/压不住场,吊不出对手的大主/.test(r)){ r='小主压不住场,多半把牌权交出去'; risky=true; }
  else if(/下策/.test(r)){ r='探路,把牌权交出去'; risky=true; }
  else if(/^甩牌有风险/.test(r)){ r='甩牌,有被拦下的风险'; risky=true; }
  // 「压得住」是 AI 的把握(p>0.6),不是硬事实 —— 事实那句还挂着「别家还有 1 张比它大」
  if(/^压得住/.test(r)&&f.boss===false) r=r.replace(/^压得住/,'多半压得住');
  if(/对手多半断这门|对手可能缺门来毙/.test(r)&&f.suit!=='T'){
    if(f.out===0) r='这门别家都没有了 —— 对手可以用主毙,也可以垫牌';
    else if(f.oppVoid.length) r=r.replace(/对手多半断这门 —— 按被毙的概率算|对手多半断这门|对手可能缺门来毙/,
      `${f.oppVoid.length>1?'两家对手都':'已有对手'}断了这门,可能被毙`);
    else r=r.replace(' —— 按被毙的概率算',',可能被毙');
  }
  // 「小主」:在外的主至少一半比它大才算小(单张、对子同一口径)
  if(cl&&cl.suit==='T'&&/小主/.test(r)){
    const up=coachBiggerUnseen(makeMemory(view),'T',t,cl.top).reduce((a,x)=>a+x.n,0);
    if(!(f.out>0&&up/f.out>=0.5)) r=r.replace('小主换牌权','用主换牌权').replace('小主','领主');
  }
  if(cl&&cl.type==='single'){
    const suitCards=view.hand.filter(c=>effSuit(c,t)===cl.suit);
    if(/小牌探路/.test(r)&&(!coachSmall(cards[0],t)||suitCards.length>1&&!suitCards.some(c=>ordIdx(c,t)>cl.top)))
      r=r.replace('小牌探路','探路');
    if(/队友的断门/.test(r)&&!f.partnerVoid) r=r.replace('主打队友的断门','队友多半断这门');
  }
  // 当选的是一手有风险的:把「为什么还选它」说出来(AI 的估算里,其他领法更亏)
  if(risky&&tier==='best') r+=',但其他领法更亏';
  return r;
}
function coachReason(view, plays, o){
  const r=coachReasonCore(o.reason), f=o.facts||coachFacts(view,plays,o.cards);
  if(!plays||!plays.length) return coachLeadReason(view,o.cards,f,r,o.tier);
  return coachFollowReasonOK(view,plays,o.cards,f,r)?r:coachFollowReasonRewrite(view,plays,o.cards,f,o.tier,r);
}

function coachOptions(view, plays, J, okThr, max){
  const t=view.trump, follow=!!(plays&&plays.length);
  const list=[{cards:J.adv.cards,reason:J.adv.reason,delta:0,tier:'best'}];
  for(const a of J.alts){
    if(!(a.delta<=okThr)) continue;
    list.push({cards:a.cards,reason:a.reason,delta:a.delta,tier:!J.rule&&a.delta<=COACH_TIE?'tie':'ok'});
  }
  list.sort((a,b)=>(a.tier==='best'?-1:0)-(b.tier==='best'?-1:0)||a.delta-b.delta);
  const out=[];
  let bestPts=0;
  for(const o of list){
    const cl=classify(o.cards,t), facts=coachFacts(view,plays,o.cards);
    if(o.tier==='best') bestPts=facts.pts||0;
    // 白送对手分的不列(v0.7.36):这墩归对手,这一手又比首选多带分 —— 分差再小也不该叫「也可以」
    else if(follow&&!facts.wins&&!facts.partnerWinning&&facts.pts>bestPts) continue;
    const say=coachReason(view,plays,{...o,facts});
    // 事实也要一模一样才合并:♠9♠9 和 ♠J♠J 理由相同,但「比它大、两张都在别家」的不是同一批牌。
    // 真正等价的是中间没有别家牌隔着的那种(♦5 与 ♦6),它们的事实逐字相同。
    const key=[cl?cl.suit:'?',cl?cl.type:'?',o.cards.length,countPoints(o.cards),
               say,o.tier==='ok'?'ok':'top',JSON.stringify(facts)].join('|');
    // 只合并价值也差不多的(相差不到 COACH_TIE),否则「♠J 或 ♠4」会把两手不一样好的牌说成一样
    const hit=out.find(x=>x.key===key&&Math.abs(x.delta-o.delta)<=COACH_TIE);
    if(hit){ hit.same.push(o.cards); continue; }
    out.push({...o,key,same:[],facts,say});
  }
  return out.slice(0,max||3);
}

// 全 AI 无头模拟一整局(测试用;简化亮主为一轮制)
// smartSeats:使用启发式 AI 的座位,其余用随机 AI
function simulateRound(seed, smartSeats=[0,1,2,3]){
  const {first}=cutForFirst(seed);
  const {hands,kitty}=dealRound(seed,first);
  let best=null, declSeat=-1;
  for(let s=0;s<4;s++){
    const o=declOptions(hands[s],RULES.levelStart)[0];
    if(o && (!best||o.strength>best.strength)){ best=o; declSeat=s; }
  }
  const rand=rng(seed^0x9e3779b9);
  let trump;
  if(!best){ trump={suit:null,rank:RULES.levelStart}; declSeat=first; }
  else{
    trump={suit:best.suit,rank:RULES.levelStart};
    for(let s=0;s<4;s++){
      if(s!==declSeat && jokerPairOf(hands[s]) && rand()<0.3){
        trump={suit:null,rank:RULES.levelStart}; declSeat=s; break;  // 无庄盘:造反者坐庄
      }
    }
  }
  hands[declSeat].push(...kitty);
  const buried=aiDiscard(hands[declSeat],trump);
  buried.forEach(c=>removeCard(hands[declSeat],c));
  const declTeam=declSeat%2;
  const smart=new Set(smartSeats);
  const history=[];
  let leader=declSeat, defPoints=0, lastWinner=declSeat, lastLeadSize=1, tricks=0, cardsPlayed=0;
  while(hands.some(h=>h.length)){
    const plays=[];
    for(let i=0;i<4;i++){
      const seat=(leader+i)%4;
      const view={seat,hand:hands[seat],trump,declSeat,history:[...history,...plays],
                  buriedKnown:seat===declSeat?buried:[]};
      let cards;
      if(i===0){
        cards=smart.has(seat)?aiChooseLead(view).cards:aiLead(hands[seat],trump,rand);
        const chk=checkThrow(hands,seat,cards,trump);
        if(!chk.ok) cards=chk.forced;
      }else{
        const lead=classify(plays[0].cards,trump);
        cards=smart.has(seat)?aiChooseFollow(view,plays).cards
                             :genFollow(hands[seat],lead,trump,rand);
        if(!isLegalFollow(hands[seat],lead,cards,trump))
          throw new Error('AI 出牌不合法 seed='+seed+' seat='+seat);
      }
      cards.forEach(c=>removeCard(hands[seat],c));
      cardsPlayed+=cards.length;
      plays.push({seat,cards});
    }
    history.push(...plays);
    lastLeadSize=plays[0].cards.length;
    const res=resolveTrick(plays,trump);
    leader=res.winner; lastWinner=res.winner; tricks++;
    if(res.winner%2!==declTeam) defPoints+=res.points;
    if(tricks>100) throw new Error('死循环 seed='+seed);
  }
  return {...scoreRound({defPoints,kitty:buried,defWonLastTrick:lastWinner%2!==declTeam,lastLeadSize}),
          defPoints, tricks, declSeat, cardsPlayed, noTrump:!trump.suit};
}

    // 领出:AI最优选与教练评分一致(自我一致性)
    const view3={seat:0,hand:[...P('X',16),C('H',4),C('C',7)],trump:T,history:[],buriedKnown:[]};

  // ---- 定主后谁坐庄(王对造反不得在庄定盘换庄) ----
  {
    const D=E.dealerAfterDecl;

    ok('庄定盘:王对造反只改主色,庄家不变',
       D({dealerKnown:true,dealer:1,declSeat:2,firstTaker:1})===1);

    ok('无庄盘:最终亮主者坐庄', D({dealerKnown:false,dealer:-1,declSeat:3,firstTaker:0})===3);
    ok('无庄盘:无人亮主则先拿牌者坐庄', D({dealerKnown:false,dealer:-1,declSeat:-1,firstTaker:2})===2);

  // ---- 整场推进(升级/轮庄/胜负) ----
  {
    let a=E.advanceMatch([2,2],1,{defendersWin:false,declarerLevelsUp:2});
    ok('庄守住:升级且对家连庄', a.levels[1]===4&&a.dealer===3&&!a.matchOver);
    a=E.advanceMatch([2,2],1,{defendersWin:true,defenderLevelsUp:1});
    ok('闲家上台:升级且前庄下家坐庄', a.levels[0]===3&&a.dealer===2);
    a=E.advanceMatch([2,2],1,{defendersWin:true,defenderLevelsUp:0});
    ok('闲家80~119:上台不升级', a.levels[0]===2&&a.dealer===2);
    a=E.advanceMatch([13,2],0,{defendersWin:false,declarerLevelsUp:3});
    ok('打过A:整场结束', a.matchOver&&a.winnerTeam===0);
    a=E.advanceMatch([14,2],0,{defendersWin:false,declarerLevelsUp:1});
    ok('A级守住即打过A', a.matchOver&&a.winnerTeam===0);
  }

  // ---- 必打关卡(不可跳级) ----
  {
    const G4=[2,5,10,13];
    const C=E.clampAtGate;
    ok('跳级撞关卡:3升3级停在5', C(3,6,G4).level===5&&C(3,6,G4).gate===5);
    ok('落点正好是关卡:不算跳过,正常到达', C(3,5,G4).level===5&&C(3,5,G4).gate===null);
    ok('从关卡出发可正常越过下一段', C(5,8,G4).level===8&&C(5,8,G4).gate===null);
    ok('一次跨两个关卡:停在最近的那个', C(4,12,G4).level===5);
    ok('关卡关闭时不拦', C(3,6,null).level===6&&C(3,6,[]).level===6);
    ok('不升级时不受影响', C(5,5,G4).level===5);
    // 接到 advanceMatch 上
    let a=E.advanceMatch([3,2],0,{defendersWin:false,declarerLevelsUp:3},G4);
    ok('advanceMatch:打3升3级被5拦下并报关卡', a.levels[0]===5&&a.gateStopped===5);
    a=E.advanceMatch([3,2],0,{defendersWin:false,declarerLevelsUp:3},null);
    ok('advanceMatch:不开关卡时照常升到6', a.levels[0]===6&&a.gateStopped===null);
    a=E.advanceMatch([5,2],0,{defendersWin:false,declarerLevelsUp:3},G4);
    ok('advanceMatch:已在关卡上,升级不再被同一关卡拦', a.levels[0]===8&&a.gateStopped===null);

    // 第二层:过关要本队坐庄打过这一级(报障:闲家本级2、抢到150分直接打3)
    const win150=E.scoreRound({defPoints:150,kitty:[],defWonLastTrick:false,lastLeadSize:1});
    ok('150分的结算是上台升1级', win150.defendersWin&&win150.defenderLevelsUp===1);
    // 队1坐庄打2,队0(闲家)本级也是2 —— 队0从没坐庄打过2
    a=E.advanceMatch([2,2],1,win150,G4,[-1,-1]);
    ok('必打:闲家停在关卡上,上台只换庄不升级', a.levels[0]===2&&a.gateHeld===2);
    ok('必打:被卡住时下一局由这一方坐庄', a.dealer%2===0);
    // 同一局面,队0此前已坐庄打过2 → 照常升级
    a=E.advanceMatch([2,2],1,win150,G4,[2,-1]);
    ok('必打:已坐庄守住过就放行', a.levels[0]===3&&a.gateHeld===null);
    // 不是关卡的级数不受这条约束
    a=E.advanceMatch([3,2],1,win150,G4,[-1,-1]);
    ok('必打:非关卡级数照常升', a.levels[0]===4&&a.gateHeld===null);
    // 庄家方守住的那一局,本身就是「打过」的证据,不该卡自己
    a=E.advanceMatch([2,2],0,{defendersWin:false,declarerLevelsUp:2},G4,[-1,-1]);
    ok('必打:庄家守住不卡自己(这一局就是在打这一级)', a.levels[0]===4&&a.gateHeld===null);
    ok('必打:坐庄守住这一局记进 played', a.played[0]===2);
    // v0.7.1:坐庄输了不算打过这一关 —— 报障就出在这(关卡10上丢庄,再上台却过了10)
    a=E.advanceMatch([10,10],0,win150,G4,[-1,-1]);
    ok('必打:坐庄丢庄不记进 played', a.played[0]===-1);
    // 队0 在关卡10坐庄丢庄 → 队1 上台也停在10(它自己也没打过10)
    ok('必打:对手同样卡在这一关', a.levels[1]===10&&a.gateHeld===10);
    // 关键报障复现:队0 卡在10,后来上台 —— 若按旧口径(坐过庄就算)会直接过 11
    ok('必打:丢过庄的那一方,上台仍要补打这一关',
       E.advanceMatch([10,10],1,win150,G4,[-1,-1]).levels[0]===10);
    // 不传 played = 只做第一层,老行为不变
    a=E.advanceMatch([2,2],1,win150,G4);
    ok('必打:不传 played 时退回只挡跳级', a.levels[0]===3&&a.gateHeld===null);
    // 不会卡死:被卡住 → 下一局自己坐庄打这一关 → 再上台就能过
    let lv=[2,2], pl=[-1,-1], st=E.advanceMatch(lv,1,win150,G4,pl);
    lv=st.levels; pl=st.played;                       // 队0 卡在 2,拿到庄
    st=E.advanceMatch(lv,0,{defendersWin:false,declarerLevelsUp:1},G4,pl);
    ok('必打:补打一局后即可过关', st.levels[0]===3&&st.gateHeld===null);
  }

  // ---- 速通模式:级数只走 2/5/10/K/A,每局最多一档 ----
  {
    const win=(n)=>({defendersWin:false,declarerLevelsUp:n});
    const G4=[2,5,10,13];
    E.RULES.speedRun=true;
    try{
      let a=E.advanceMatch([2,2],0,win(4),null,[-1,-1]);
      ok('速通:打2赢4级也只到5(不开是6)', a.levels[0]===5);
      a=E.advanceMatch([5,2],0,win(1),null,[-1,-1]);
      ok('速通:5的下一档是10', a.levels[0]===10);
      a=E.advanceMatch([10,2],0,win(3),null,[-1,-1]);
      ok('速通:10的下一档是K', a.levels[0]===13);
      a=E.advanceMatch([13,2],0,win(2),null,[-1,-1]);
      ok('速通:K的下一档是A', a.levels[0]===14&&a.matchOver===false);
      a=E.advanceMatch([14,2],0,win(1),null,[-1,-1]);
      ok('速通:打过A整场结束', a.matchOver===true&&a.winnerTeam===0);
      a=E.advanceMatch([5,2],0,{defendersWin:false,declarerLevelsUp:0},null,[-1,-1]);
      ok('速通:没升级就原地不动', a.levels[0]===5);
      a=E.advanceMatch([2,5],1,{defendersWin:true,defenderLevelsUp:2},null,[-1,-1]);
      ok('速通:闲家赢也走同一条阶梯', a.levels[0]===5&&a.dealer===2);
      a=E.advanceMatch([2,2],0,win(3),G4,[-1,-1]);
      ok('速通:阶梯即关卡,不再被必打关卡二次拦', a.levels[0]===5&&a.gateHeld===null);
    } finally { E.RULES.speedRun=false; }
    // 对照组:关掉之后行为与旧版完全一致
    let b=E.advanceMatch([2,2],0,win(4),null,[-1,-1]);
    ok('速通(关):打2赢4级照常升到6', b.levels[0]===6);
    b=E.advanceMatch([13,2],0,win(2),null,[-1,-1]);
    ok('速通(关):K赢2级直接过A', b.levels[0]===15&&b.matchOver===true);
  }

  // ---- M3 启发式 AI ----
  // 记牌:两张HA都见过后,HK就是本门最大
  {
    const view={seat:0,hand:[C('H',13)],trump:T,
      history:[{seat:1,cards:P('H',14)}],buriedKnown:[]};
    const mem=E.makeMemory(view);
    ok('记牌:HA出尽后HK封顶', E.isBossPlay(E.classify([view.hand[0]],T),mem,T)===true);
    const view2={seat:0,hand:[C('H',13)],trump:T,history:[],buriedKnown:[]};
    ok('记牌:HA未见时HK非最大', E.isBossPlay(E.classify([view2.hand[0]],T),E.makeMemory(view2),T)===false);
    /* 理论最大对子(v4.6):同点数的两张可能分在两家,凑不成对。
     * 开局未见牌多、每家手牌也多,「凑成对」的概率还有 0.26,不该当钢板;
     * 打到只剩几张时同一个局面就该当钢板了。 */
    {
      const filler=n=>{const f=[];for(let i=0;i<n;i++)f.push(C('C',3+(i%9)));return f;};
      const opener={seat:0,hand:[...P('H',13),...filler(23)],trump:T,history:[],buriedKnown:[]};
      const mOpen=E.makeMemory(opener);
      ok('对子:开局 HA 两张全未见 → HK 对不算钢板',
         E.isBossPlay(E.classify([C('H',13),C('H',13)],T),mOpen,T)===false);
      ok('对子:此时「在外有更大对」的概率显著大于阈值',
         E.pPairAbove(mOpen,'H',E.ordIdx(C('H',13),T),T)>0.2);
      // 只剩 3 张手牌:未见牌少,两张 HA 落在同一家的概率掉下来
      const late={seat:0,hand:[...P('H',13),C('C',3)],trump:T,history:[],buriedKnown:[]};
      // 把绝大多数牌都记成已见,只留 HA 两张 + 少量
      const mLate=E.makeMemory(late);
      for(const k in mLate.unseen){
        const c=E.keyToCard(k);
        if(!(c.suit==='H'&&c.rank===14)) mLate.unseen[k]=0;
      }
      ok('对子:收官只剩两张 HA 未见 → 概率降到阈值下,HK 对当钢板',
         E.isBossPlay(E.classify([C('H',13),C('H',13)],T),mLate,T)===true);
      ok('对子:严格意义上仍有更大的对(判据确实走的是概率这条路)',
         E.unseenPairAbove(mLate,'H',E.ordIdx(C('H',13),T),T)===true);
      // 阈值置 0 = 退回旧的布尔判据
      const save=E.AIP.pairBossMaxP; E.AIP.pairBossMaxP=0;
      ok('对子:阈值置 0 时退回旧判据',
         E.isBossPlay(E.classify([C('H',13),C('H',13)],T),mLate,T)===false);
      E.AIP.pairBossMaxP=save;
    }
  }
  /* 跟牌:对手暂大且能吃 → 用最省的牌吃(HQ 而非 HA)。
   *
   * v0.7.19 改过位置。原来的局面是「我坐**第 2 家**、队友坐末手」——
   * `pPartnerCalc` 打开之后 AI 在那里改成不抢了(见下一条),
   * 于是这条断言测不到它本来要测的东西(**用哪张**吃,不是**吃不吃**)。
   * 改成我坐末手:队友已出过、对手暂大、台面 10 分,「吃不吃」没有悬念,
   * 只剩「用哪张」—— 断言的本意原样保留,而且和 `pPartnerCalc` 取值无关。
   * (H7 不能写成 H2:主牌级数是 2,那就成了毙牌,Q 压不过。) */
  {
    const plays=[{seat:3,cards:[C('H',10)]},{seat:0,cards:[C('H',4)]},{seat:1,cards:[C('H',7)]}];
    const view={seat:2,hand:[C('H',12),C('H',14),C('H',3),C('D',4)],trump:T,history:plays,buriedKnown:[]};
    const ch=E.aiChooseFollow(view,plays);

  }
  /* 【这里原本想再锁一条「第 2 家、队友坐末手 → 不越位抢」，v0.7.19 撤掉了。】
   *
   * 撤掉的理由值得留着，因为它是这个测试文件里一类反复出现的坑:
   * 那条断言依托的局面是 `hand` 只有 4 张、`history` 只有本墩一张 ——
   * 按手牌长度它是残局,按记牌却"还有 103 张没露面",**自相矛盾**。
   * `shareDenom` 于是算出「每家手上约 13 张」,`pPartnerTakes` 得到 0.631,
   * AI 就不抢了。算法没错,错的是喂给它的局面。
   *
   * **构造跟牌断言时,手牌张数和 history 必须对得上**,否则量的是一个

  // 跟牌:队友稳赢且自己最后一手 → 贴分(出H10而非H4)
  {

  }
  // 跟牌:对手稳赢 → 跟小不送分(出H4而非H10)
  {
    const plays=[{seat:1,cards:[C('H',14)]},{seat:2,cards:[C('H',6)]},{seat:3,cards:[C('H',3)]}];
    const view={seat:0,hand:[C('H',10),C('H',4),C('D',3)],trump:T,history:plays,buriedKnown:[]};
    const ch=E.aiChooseFollow(view,plays);

  /* 收官只剩 4 张、底牌未知(闲家视角按未见分倒推 → 估得很肥)时,王对该攥着守最后一墩。
   *
   * 这条断言在 v4.3 之前是反的(「钢板先收」)。改口径不是为了迁就实现:

  {

    const ch=E.aiChooseLead(view);

  /* ---- v0.7.1:毙得够高的候选(默认关,但代码要正确) ---- */
  {
    const T4={suit:'S',rank:2};
    const lead=E.classify([C('H',9)],T4);
    const hand=[C('S',5),C('S',13),C('D',3),C('D',4)];        // H 断门,主 S5 / S13
    const mem=E.makeMemory({hand,trump:T4,history:[],buriedKnown:[]});
    // share=1:他大约只摸到一张主 → 他手上最大那张主的期望不高,主K 盖得住
    const hi=E.ruffGuardFollow(hand,lead,T4,lead,mem,false,1);
    ok('毙高一档:选出的是盖得住他期望最大主的那张', !!hi&&hi[0].rank===13);
    // share=3:开局在外主牌多,他手上那张最大的主的期望高过我的主K → 不生成
    ok('他主牌多时,主K 也盖不住 → 不生成(该考虑的是别毙)',
       E.ruffGuardFollow(hand,lead,T4,lead,mem,false,3)===null);
    const weak=[C('S',3),C('D',3),C('D',4)];
    ok('手上只有小主时不生成候选',
       E.ruffGuardFollow(weak,lead,T4,lead,
         E.makeMemory({hand:weak,trump:T4,history:[],buriedKnown:[]}),false,1)===null);
    ok('本门还有牌时轮不到毙',
       E.ruffGuardFollow(hand.concat([C('H',3)]),lead,T4,lead,mem,false,1)===null);
    ok('默认开启,且只在台面 ≥10 分时考虑', E.AIP.ruffGuard===1&&E.AIP.ruffGuardMinPts===10);
  }

  /* ---- v0.7.3:他肯为这一墩花到多大的主(oppSpendCeil)—— 实战三情景 ---- */
  {
    const mkX=(hand,pts,phase,buried)=>{
      const v={seat:0,trump:T,history:[],buriedKnown:buried||[],hand};
      return {trump:T,mem:E.makeMemory(v),ptsTable:pts,pw:1,phase,hand,
              buriedKnown:buried||[],isDecl:true,oppVoidP:()=>0.3};
    };
    const h=[C('S',14),C('S',13),C('S',9),C('H',4),C('H',5),C('D',6),C('D',7),C('C',8)];
    const iBig=E.ordIdx({suit:'X',rank:16},T), iSml=E.ordIdx({suit:'X',rank:15},T);
    const iLvl=E.ordIdx(C('S',2),T), iAce=E.ordIdx(C('S',14),T);
    // ① 空气墩:他不会为一墩 0 分花任何大牌
    ok('空气墩:他肯花的上限低于副级牌',
       E.oppSpendCeil(mkX(h,0,'mid'),12)<E.ordIdx(C('H',2),T));
    // ② 台面有分、中盘:级数牌上面还有王,没有护底那一截 → 他肯花
    ok('中盘 10 分:他肯花到级数牌以上',
       E.oppSpendCeil(mkX(h,10,'mid'),12)>=iLvl);
    // ③ 收官 + 底里有分:大王是他的保底手,不会为这 10 分动
    {
      const endH=[C('S',14),C('S',9),C('H',4),C('D',6)];
      const bur=[C('H',5),C('H',13),C('D',5),C('D',13)];
      const ceil=E.oppSpendCeil(mkX(endH,10,'end',bur),4);
      ok('收官+底里有分:他不会为 10 分花掉大王/小王', ceil<iSml&&ceil<iBig);
      ok('但主A 这一档他仍然肯花 —— 毙到主A 之上就够', ceil>=iAce);
    }
  }

  /* ---- v4.8:对子被压的概率按组合算 ---- */
  {

    ok('对子被压的概率远低于单张', pPair<pSingle*0.5);
    ok('拖拉机比对子更难被压',
       E.pBeaterIn({type:'tractor',len:2},b,4)<pPair);

      const b=E.aiDiscard(hand,T);
      ok('扣底:8张', b.length===8);
      ok('扣底:绝不埋主', b.every(c=>E.effSuit(c,T)!=='T'));
      ok('扣底:两张的短门整门埋掉造缺', b.filter(c=>c.suit==='D').length===2);
    }
    // 6b. 断门价值必须真的驱动决策:四张的门,预算够就该整门埋掉造缺。
    //     (断门是集合性质、只在最后一张兑现,若不把价值摊到每张上,贪心根本看不见这个台阶)
    {
      const h=[C('S',14),C('S',13),C('S',12),C('S',11),C('S',9),C('S',2),C('X',16),
               C('H',14),C('H',13),C('H',10),C('H',9),C('H',7),C('H',5),C('H',3),C('H',4),C('H',6),
               C('D',4),C('D',6),C('D',9),C('D',11),
               C('C',8),C('C',7),C('C',6),C('C',5),C('C',4),C('C',3),C('C',2),C('C',9),C('C',10),
               C('C',11),C('C',12),C('C',14),C('C',13)];
      const keep=E.AIP.voidValue;
      const nD=v=>{E.AIP.voidValue=v; const r=E.aiDiscard(h,T).filter(c=>c.suit==='D').length;
                   E.AIP.voidValue=keep; return r;};
      ok('扣底:四张的门在预算内会被整门埋掉', nD(46)===4);
      ok('扣底:断门价值调低则不再造缺(说明这个参数真的在起作用)', nD(10)<4);
    }
    // 7. 超几何外推自带收缩:第1张就是主,也不该外推成满手主
    {
      ok('projectLen 小样本收缩', E.projectLen(1,1,36)<10 && E.projectLen(17,25,36)===17);
    }
    // 7b. 阶梯目标:0/40/80/120/160/200 每条线附近都该敏感,不是只认 80
    {
      const w=d=>E.pointWeight(d,200-d);
      ok('阶梯:临界线是一整排', E.SCORE_LADDER.join()==='0,40,80,120,160,200');
      ok('阶梯:35分(逼近40线)不比80线迟钝', w(35)>=w(80)*0.9);
      ok('阶梯:胜负已定时权重回落', w(200)<w(100));
    }
    // 8. 亮主打分:强牌该亮、烂牌不该亮;队友坐庄比对手坐庄更保守
    {
      const mk=o=>({vis:[],seat:0,trumpRank:2,curDecl:null,dealerKnown:true,dealer:1,
                    firstTaker:0,gates:[],levels:[2,2],...o});
      const strong=[C('S',2),C('S',5),C('S',7),C('S',9),C('S',11),C('S',13),C('X',16),C('H',3),C('D',4),C('C',6)];
      const weak=[C('S',2),C('H',3),C('H',5),C('D',7),C('D',9),C('C',11),C('C',13),C('C',4),C('D',6),C('H',8)];
      ok('亮主:强牌越门槛', E.aiDeclDecide(mk({vis:strong})).pass===true);
      ok('亮主:烂牌不越门槛', E.aiDeclDecide(mk({vis:weak})).pass===false);
      const mate=E.aiDeclDecide(mk({vis:strong,dealer:2})), opp=E.aiDeclDecide(mk({vis:strong,dealer:1}));
      ok('亮主:队友坐庄不高于对手坐庄', mate.score<=opp.score);
      ok('亮主:无庄盘门槛低于有庄盘',
         E.declThreshold({vis:weak,dealerKnown:false})<E.declThreshold({vis:weak,dealerKnown:true}));
      // 造反动力:对手已亮 > 无人亮 > 队友已亮
      const base={vis:strong,dealerKnown:true,dealer:1,seat:0,trumpRank:2,
                  gates:[],levels:[2,2],firstTaker:0};
      const o2={suit:'S',strength:2};
      const vsOpp=E.scoreDeclOption({...base,curDecl:{seat:1,suit:'H',strength:1}},o2).score;
      const vsNone=E.scoreDeclOption({...base,curDecl:null},o2).score;
      const vsMate=E.scoreDeclOption({...base,curDecl:{seat:2,suit:'H',strength:1}},o2).score;
      ok('造反动力:对手已亮 > 无人亮 > 队友已亮', vsOpp>vsNone && vsNone>vsMate);
      // 必打关卡:对手卡关时更愿意亮/反
      const gated=E.scoreDeclOption({...base,curDecl:null,gates:[2,5,10,13],levels:[2,2]},o2).score;
      ok('必打关卡提高扰乱意愿', gated>vsNone)
    }
    // 3b. 从出牌方式反推缺门:硬演绎,不是概率
    {
      const base=[C('S',9),C('S',8),C('D',3),C('D',5),C('C',6),C('C',7),C('C',9),C('D',8)];
      // 东(座1)领 HA、西(座3,东的队友)跟了张不带分的 HQ ——
      // 队友暂大却没贴分 ⇒ 他本门既没有分牌,也没有比 Q 更小的废牌
      const hist=[{seat:1,cards:[C('H',14)]},{seat:2,cards:[C('H',3)]},
                  {seat:3,cards:[C('H',12)]},{seat:0,cards:[C('H',4)]}];
      const view={seat:2,declSeat:0,hand:[C('H',13),C('H',13),C('H',10),C('H',10),...base],
                  trump:T,history:hist,buriedKnown:[]};
      const mem=E.makeMemory(view);
      const withRead=E.maxHoldIn(E.makeReads(hist,T),mem,3,'H',T);
      const noRead=E.maxHoldIn(E.makeReads([],T),mem,3,'H',T);
      ok('出牌方式反推:持有上界大幅收紧', withRead<=3 && noRead>10);
      const pv=E.makeVoidProb(E.makeReads(hist,T),mem,T,view.hand.length);
      const pv0=E.makeVoidProb(E.makeReads([],T),mem,T,view.hand.length);
      // voidReadTrust(v0.7.21,calib-infer 校准)把行为读牌从「推到 0 张 = 100% 断门」软化了 ——
      // 这条问的是「显著抬升」,按相对无读牌时的抬升量看
      ok('出牌方式反推:断门概率显著抬升', pv(3,'H')>0.6||(E.AIP.voidReadTrust<1&&pv(3,'H')-pv0(3,'H')>0.3));
      // 队友暂大时用贴分序、否则用最便宜序 —— 两条序不能混用
      ok('贴分序:分牌排在废牌之前', E.dumpKey(C('H',10),T)<E.dumpKey(C('H',3),T));
      ok('最便宜序:分牌排在废牌之后', E.cheapKey(C('H',10),T)>E.cheapKey(C('H',3),T));
      // 领出多张时不采信(义务约束下他出什么未必是他想出什么)
      const pairHist=[{seat:1,cards:[C('H',14),C('H',14)]},{seat:2,cards:[C('H',3),C('H',3)]},
                      {seat:3,cards:[C('H',12),C('H',11)]},{seat:0,cards:[C('H',4),C('H',5)]}];
      const r2=E.makeReads(pairHist,T);
      ok('领出多张时不做此推断', !r2.fCheap[3]['H'] && !r2.fDump[3]['H']);
    }
    // 8b. 亮单 vs 亮对:信心足该锁死,信心不足才试探留后手
    {
      const mk=o=>({vis:[],seat:0,trumpRank:2,curDecl:null,dealerKnown:true,dealer:1,
                    firstTaker:0,gates:[],levels:[2,2],...o});
      const conf=[C('S',2),C('S',2),C('S',7),C('S',9),C('S',11),C('S',13),C('S',14),C('X',16),C('H',3),C('D',4)];
      const soft=[C('S',2),C('S',2),C('S',7),C('S',9),C('H',11),C('H',13),C('C',14),C('D',5),C('H',3),C('D',4)];
      const both=E.declOptions(conf,2).filter(o=>o.suit==='S');
      ok('有对时同时提供亮单与亮对', both.length===2&&both.some(o=>o.strength===1)&&both.some(o=>o.strength===2));
      const pick=v=>{const c=mk({vis:v});
        return E.scoreDeclOption(c,{suit:'S',strength:2}).score
             > E.scoreDeclOption(c,{suit:'S',strength:1,hasPair:true}).score ? '对':'单';};
      ok('信心足选亮对', pick(conf)==='对');
      ok('信心不足选亮单试探', pick(soft)==='单');
    }
    // 8c. 无将 + 级数是分牌:不减半,闲家还要再加;无庄盘无将仍拿抢摊红利
    {
      const mk=o=>({vis:[C('X',16),C('X',16),C('S',10),C('H',10),C('D',14),C('C',14),
                         C('H',13),C('S',13),C('D',9),C('C',8)],
                    seat:0,curDecl:null,firstTaker:0,gates:[],levels:[2,2],...o});
      const NTo={suit:null,strength:4};
      const ptDef=E.scoreDeclOption(mk({trumpRank:10,dealerKnown:true,dealer:1}),NTo).score;
      const ptDecl=E.scoreDeclOption(mk({trumpRank:10,dealerKnown:true,dealer:0}),NTo).score;
      const plain=E.scoreDeclOption(mk({trumpRank:7,dealerKnown:true,dealer:1}),NTo).score;
      ok('无将:级数是分牌时加成显著', ptDef-plain>25);
      ok('无将:闲家的加成高于庄家方', ptDef>ptDecl);
      const noDealer=E.scoreDeclOption(mk({trumpRank:7,dealerKnown:false,dealer:-1}),NTo).score;
      ok('无将:无庄盘仍拿抢摊红利', noDealer>plain+40);
      // 有主的抢摊红利要高于无将
      const sOpt={suit:'S',strength:1};
      const gS=E.scoreDeclOption(mk({trumpRank:7,dealerKnown:false,dealer:-1}),sOpt).score
              -E.scoreDeclOption(mk({trumpRank:7,dealerKnown:true,dealer:1}),sOpt).score;
      const gN=noDealer-plain;
      ok('抢摊红利:有主高于无将', gS>gN);
    }
    // 9. globalIdx:主牌恒高于任何副牌
    ok('globalIdx 主牌恒高于副牌', E.globalIdx(C('S',3),T)>E.globalIdx(C('H',14),T));
    // 10. easeEnds:中间平缓、两头陡峭
    {
      const g=E.easeEnds, mid=g(0.55)-g(0.45), end=g(0.10)-g(0.0);
      ok('easeEnds 两头比中间陡', end>mid && Math.abs(g(0.5)-0.5)<1e-9 && g(0)===0);
    }
  }

  // 启发式优于随机:同样的局,聪明防守方比随机防守方抓分更多(均值)
  {
    let smartSum=0,randSum=0,n=0;
    for(let s=1;s<=120;s++){
      const r1=E.simulateRound(s,[0,2]);       // 南北聪明
      const r0=E.simulateRound(s,[]);          // 全随机
      if(r1&&r0&&r1.declSeat%2===1&&r0.declSeat%2===1){ smartSum+=r1.defPoints; randSum+=r0.defPoints; n++; }
    }
    ok(`启发式防守优于随机(${(smartSum/n).toFixed(0)} vs ${(randSum/n).toFixed(0)} 分,${n}局)`,
       n>10 && smartSum>randSum);
  }

  let simOK=true, played=0, nt=0;
  for(let s=1;s<=40;s++){
    try{
      const r=E.simulateRound(s);
      if(r){ played++; if(r.noTrump)nt++;
        /* 这里要保证的是「这一局真的打完了」,而不是「打了至少 13 墩」。
         * 旧判据 tricks<13 悄悄假设了领出多半是单张 —— v0.7.9 的子集甩牌
         * 让一次领出可以带走四张,合法局面下墩数掉到 12 就会误报。
         * 换成真正的不变量:四家 25 张必须全部出完(2×54 − 8 张底牌)。 */
        if(r.total<0||r.cardsPlayed!==100) simOK=false; }
    }catch(e){ simOK=false; }
  }
  ok('40局全AI模拟无崩溃(含'+nt+'局无主)', simOK&&played>30);

  return {pass,fail,out};
}
if(typeof module!=='undefined'){ module.exports.runTests=runTests; }
</script>

    out.map(t=>`<div class="${t.cond?'pass':'fail'}">${t.cond?'✓':'✗'} ${t.name}</div>`).join('');

}

/* ---- 术语表(全国版 / 沪语版 / English)----
 *
 * v0.7.10:沪语那份原来单独挂在 `terms-shanghai.js` 里 —— 产品本体号称单文件,
 * 却拖着一个外部依赖,双击 index.html 时少放一个文件就静默退回全国版。现在并回来了。
 *
 * 三档共用一张表:缺的词逐级回退到全国版,再回退到键名本身。
 * 只译**术语**(牌张、牌型、动作、座位、花色),界面文案仍是中文 ——
 * 英语档的用途是让不懂中文术语的人看懂「这一手在干什么」,不是做完整本地化。
 * 想扩就往 en 里加键,回退机制保证加一半也不会崩。 */
const TERMS={
  cn:{bigJoker:'大王',smallJoker:'小王',trump:'主牌',noTrump:'无主',tractor:'拖拉机',
    throwP:'甩牌',ruff:'毙牌',discard:'垫牌',declare:'亮主',counter:'反主',reinforce:'加固',
    declareV:'亮',counterV:'反',   // 按钮上用的短动词,免得"亮主无主(大)"这种叠字
    bury:'扣底',lead:'领出',zheng:'正常主',fu:'副常主',voidSuit:'断门',openVoid:'开局断门',
    rankA:'A',rankK:'K',rankQ:'Q',rankJ:'J',levelUp:'升级',
    defenders:'闲家',declarers:'庄家方',tiaoji:'跳级',guangtou:'剃光头',
    fishTrump:'钓主',   // 领出主牌:消耗对手的主,或把牌权让给队友。维基写作「吊主」,同音,本项目统一用「钓」
    suitS:'黑桃♠',suitH:'红桃♥',suitD:'方块♦',suitC:'梅花♣',
    seat0:'南(你)',seat1:'东',seat2:'北(队友)',seat3:'西'},
  sh:{bigJoker:'大怪',smallJoker:'小怪',
    trump:'将牌',        // 也可作「王」
    noTrump:'无将',tractor:'飞机大炮',throwP:'撒牌',ruff:'敲脱',discard:'氽废',
    declare:'翻',        // 亮主;也可作「摊」
    counter:'造反',      // 反主
    declareV:'翻',       // 按钮上的短动词,如「翻无将(大)」
    counterV:'反',
    reinforce:'加固',
    bury:'灭底',         // 埋底
    lead:'先出',
    zheng:'主将',        // 级数牌直接跟在后面,如「主2」
    fu:'副将',
    voidSuit:'搿一门么了',   // 断门(无固定术语)
    openVoid:'天绝',
    rankA:'Ace',rankK:'老K',rankQ:'皮蛋',
    rankJ:'J钩',         // 念 djia
    levelUp:'打上去',
    fishTrump:'钓王'},
    // 闲家/跳级/剃光头/花色/座位:沪语与全国版同,回退即可
  en:{bigJoker:'Big Joker',smallJoker:'Small Joker',trump:'trump',noTrump:'no-trump',
    tractor:'tractor',throwP:'throw',ruff:'ruff',discard:'discard',
    declare:'declare',counter:'counter',reinforce:'reinforce',
    declareV:'Declare',counterV:'Counter',
    bury:'bury',lead:'lead',
    zheng:'primary trump',   // 主门的级数牌
    fu:'off-suit trump',     // 其余三门的级数牌
    voidSuit:'void',openVoid:'void from the deal',
    rankA:'A',rankK:'K',rankQ:'Q',rankJ:'J',levelUp:'level up',
    /* 维基 / Pagat 的英文口径:庄家一方叫 declarers(维基也叫 defenders),闲家叫 opponents(也叫 attackers)。
     * 这里曾把闲家译成 defenders —— 恰好和维基反过来。 */
    defenders:'opponents',declarers:'declarers',tiaoji:'skip a level',guangtou:'shutout',
    fishTrump:'draw trumps',
    suitS:'Spades♠',suitH:'Hearts♥',suitD:'Diamonds♦',suitC:'Clubs♣',
    seat0:'South (you)',seat1:'East',seat2:'North (partner)',seat3:'West'}
};
/* localStorage 的前缀按**文件名**走,不写死一个常量:
 *   index.html(以及 / 这个目录首页) → 历史键名
 *   80fen-test.html                  → 80fen-t-
 *   80fen-contest-<选手>-v1.html     → 80fen-c-<选手>-
 * 正式版留用历史键名是有意的 —— 换掉等于把所有在玩的人的设置和笔记凭空抹掉。
 * 而**跟着文件名推、不写成常量**也是有意的:晋级是整份复制 + 改两处身份标记,
 * 前缀要是第三处得手改的东西,迟早有一次会忘 —— 忘了就是把线上玩家切到
 * 测试版的存储上。观察页也吃这条规则,所以生成器不用再替换一遍键名。 */
const LSP=(()=>{
  const f=(String(location.pathname).match(/[^/]*$/)||[''])[0];
  const c=f.match(/^80fen-contest-(.+)-v\d+\.html$/);
  if(c) return '80fen-c-'+c[1]+'-';
  return f==='80fen-test.html' ? '80fen-t-' : f==='80fen-play-ui-test.html' ? '80fen-put-' : '80fentest-';
})();
let lang='sh';
try{ const v=localStorage.getItem(LSP+'lang');
     if(v&&TERMS[v]) lang=v; else if(v==='cn') lang='cn'; }catch(e){}
const T=k=>(TERMS[lang]&&TERMS[lang][k])||TERMS.cn[k]||k;

const SUIT_SYM={S:'♠',H:'♥',D:'♦',C:'♣'};
// 花色与座位跟着语言走:英语档下「南(你)」读不通,而它们和牌型一样是术语。
const SUIT_NAME={get S(){return T('suitS');},get H(){return T('suitH');},
                 get D(){return T('suitD');},get C(){return T('suitC');}};
const SEAT_NAME={get 0(){return T('seat0');},get 1(){return T('seat1');},
                 get 2(){return T('seat2');},get 3(){return T('seat3');},get length(){return 4;}};
const HUMAN=0;
/* 座位简称:中文取首字("北/西/东/南"),拉丁字母的座位名(英语档)取首字母后补一个空格,
 * 否则 "E"+"declare" 会连成 "Edeclare"。原来写在 render() 里,出牌记录也要用,提到顶层。 */
const seatAbbr=i=>{const nm=SEAT_NAME[i];return /^[A-Za-z]/.test(nm)?nm.slice(0,1)+' ':nm.slice(0,1);};
const typeName=t=>({single:'单张',pair:'对子',tractor:T('tractor'),throw:T('throwP')}[t]);
const rankName=r=>r===14?T('rankA'):r===13?T('rankK'):r===12?T('rankQ'):r===11?T('rankJ'):String(r);
// logMode:对局记录页签里的三种看法 —— 事件流 / 每墩出牌 / 按花色归堆。
// 原来「对局记录」和「出牌历史」是两个页签,内容有一半是重的(都在列每墩谁出了什么),
// 合成一个页签、三个视图,右栏少一个按钮,也不用来回切着找同一件事。
let G=null, seedBase=Date.now()%100000, activeTab='score', logMode='event';
// 每墩视图的两个看法开关:logAsc = 第 1 墩在上(复盘从头看),logFocus = 只放大第 N 墩(0 = 列全部)
let logAsc=false, logFocus=0;
let notes=[]; try{ notes=JSON.parse(localStorage.getItem(LSP+'notes')||'[]'); }catch(e){}
// 旧版笔记存的是纯字符串,没有局数;读进来补成 {r,t},历史笔记 r=null 就不显示局号
notes=notes.map(n=>typeof n==='string'?{r:null,t:n}:n).filter(n=>n&&n.t);

/* 右栏宽度:复盘时四家的牌挤在 mini 尺寸里看不清,允许拉宽两档。
 * 存倍率而不是绝对宽度 —— 横屏窄栏那套 @media 基准要保留,只是整体乘一下。 */
const SIDE_STEPS=[1,1.35,1.75], SIDE_NAMES=['标准','加宽','特宽'];
let sideStep=0; try{ sideStep=+(localStorage.getItem(LSP+'sidew')||0); }catch(e){}
if(!(sideStep>=0&&sideStep<SIDE_STEPS.length)) sideStep=0;
function applySideW(){ document.documentElement.style.setProperty('--sideScale',SIDE_STEPS[sideStep]); }
applySideW();

// ---- 音效(WebAudio 合成,无外部资源,可关) ----
let sndOn=true; try{ sndOn=localStorage.getItem(LSP+'snd')!=='off'; }catch(e){}
let _actx=null;
function beep(freq,dur=0.08,type='sine',gain=0.06,delay=0){
  if(!sndOn) return;
  try{
    _actx=_actx||new (window.AudioContext||window.webkitAudioContext)();
    const o=_actx.createOscillator(), g=_actx.createGain();
    o.type=type; o.frequency.value=freq;

    o.connect(g); g.connect(_actx.destination);

  }catch(e){}
}

const ENGINE_PICKER=(()=>{ const f=(String(typeof location!=='undefined'?location.pathname:'').match(/[^/]*$/)||[''])[0];

const engLoading={};
function engReady(v){ return !!(v&&window.__ENGINES&&window.__ENGINES[v]); }
function loadEngine(v){
  if(!v||engReady(v)) return Promise.resolve(true);
  if(!engLoading[v]) engLoading[v]=new Promise(res=>{
    const sc=document.createElement('script');
    sc.src=`engines/${v}.js`;
    sc.onload=()=>res(engReady(v));
    sc.onerror=()=>{ delete engLoading[v]; sc.remove(); res(false); };   // 失败了下次还能重试
    document.head.appendChild(sc);

  return engLoading[v];
}

const JOKER_ART={big:'<span class="joker-art big"><span class="leo-sil"></span></span>',small:'<span class="joker-art small"><span class="leo-sil"></span></span>'};

function cardHTML(c,cls=''){
  if(c.suit==='X'){
    const big=c.rank===16, svg=big?JOKER_ART.big:JOKER_ART.small;
    return `<div class="card ${big?'jb':'js'} ${cls}" data-id="${c.id}"><span class="face">`+
           `<span class="cat-tl">${svg}</span>`+
           `<span class="cat-big">${svg}</span></span></div>`;
  }
  const sym=SUIT_SYM[c.suit]+'︎';
  const rs=c.rank>10?{11:'J',12:'Q',13:'K',14:'A'}[c.rank]:String(c.rank);
  const pt=c.rank===5?5:(c.rank===10||c.rank===13)?10:0;
  return `<div class="card s${c.suit}${rs.length>1?' two':''} ${cls}" data-id="${c.id}"><span class="face">`+
    `<span class="tl">${rs}</span><span class="bl">${sym}</span>`+
    (pt?`<span class="pt">${pt}</span>`:'')+`<span class="pip">${sym}</span></span></div>`;
}
function miniName(c){
  if(c.suit==='X') return c.rank===16?T('bigJoker'):T('smallJoker');

// 副花色按红黑相间排列(依主花色选择顺序)
const ALT_ORDER={S:['H','C','D'],H:['S','D','C'],C:['D','S','H'],D:['S','H','C'],
                 null:['S','H','C','D']};
function sortForDisplay(hand,trump){
  const alt=ALT_ORDER[trump&&trump.suit?trump.suit:null]||['S','H','C','D'];
  const suitOrd=s=>s==='T'?0:alt.indexOf(s)+1;
  return hand.slice().sort((a,b)=>{
    const sa=effSuit(a,trump),sb=effSuit(b,trump);
    if(sa!==sb) return suitOrd(sa)-suitOrd(sb);
    const oa=ordIdx(a,trump),ob=ordIdx(b,trump);
    if(oa!==ob) return ob-oa;
    // 同级的级数将牌(副常主;无主时各花色常主)ordIdx 相同 —— 再按花色归堆,免得散排
    return suitOrd(a.suit)-suitOrd(b.suit);
  });
}

// ================= 整场状态(跨局) =================
// played:每队已坐庄守住过的最高级数,必打关卡的「打过」判据(见 advanceMatch)
/* past:整场里已经打完的每一局的存档,给「跨局复盘」用。
 * 存的是当局结束那一刻的牌面(初始手牌 / 底牌 / 每墩出牌 / 事件流)和结算结果,
 * 都是已经不会再变的数组,直接持引用即可 —— 一整场十几局的量级,不必压缩。 */
let M={levels:[2,2], dealer:-1, round:0, played:[-1,-1], past:[]};
// null = 看当前这一局;数字 = 看 M.past 里的第几局
let logRound=null;
let scrambleNext=false;   // 下一次发牌是否按无庄盘(完全造反后)
let rotNext=0;            // 下一次发牌整桌转几个座位(种子局「交换队伍」,见 swapStart)
let redealCount=0;        // 本局已重新发牌次数
let replayNext=false;     // 下一次发牌是「重打 / 用种子开局」—— 牌谱里要标出来:人可能已经见过这副牌
let autoCarry=false;      // 重新发牌(造反)时把托管带到新的一盘,否则开着托管的人一造反就被交还
// 无庄盘里各家按自己队伍的级数抢亮;庄定盘全桌用庄家级数
function rankOf(seat){ return G.dealerKnown?G.trumpRank:M.levels[seat%2]; }

// ================= 开局:(首盘切牌定先)→ 逐张发牌抢亮 =================
function newRound(){ startRound(seedBase++); }
// seed 单独作为参数(而不是内部固定 seedBase++)是为了让「重打本局」「用种子开局」
// 复用同一套发牌逻辑:前者传回 G.start,后者传解析出的种子码,见 startFromState / seedCode。
function startRound(seed){
  // 上一盘可能还有在途的定时器(AI 思考 / 收墩 / 亮主倒计时),不清掉会打到新一盘的局面上
  if(G){ clearTimeout(G.aiTimer); clearTimeout(G.holdTimer); clearTimeout(G.declTimer);
         clearInterval(G.declTick); }
  promoteCheckpoint();      // 上一局没打完就开了新局(重打 / 种子 / 重开整场):那一局存成残局
  const carryAuto=autoCarry; autoCarry=false;
  const dealerKnown=M.dealer>=0 && !scrambleNext;   // 完全造反重发 → 本盘按无庄盘抢庄
  // 开局那一刻的整场状态,和 seed 一起才能完整复现这一局(见 seedCode / __redoRound)
  const start={seed, dealer:M.dealer, levels:M.levels.slice(), played:M.played.slice(),
               round:M.round, scramble:scrambleNext, rot:rotNext};
  scrambleNext=false; rotNext=0;
  const rot=start.rot;
  let first, cutsLog='';
  if(dealerKnown){
    first=M.dealer;                      // 庄定盘:庄家先拿牌
  }else{
    // 交换队伍:切牌结果跟着整桌转 rot 个座位 —— 先拿牌的人转过去,dealRound 发出来的
    // 每家手牌也就整体转过去了(第 i 张永远发给 first+i),原来谁拿什么牌,现在换成下一座拿
    const c=cutForFirst(seed); first=(c.first+rot)%4;
    const cut=s=>c.cuts[(s-rot+4)%4];
    cutsLog=`切牌定先:${[0,1,2,3].map(s=>`${SEAT_NAME[s].slice(0,1)}${miniName(cut(s))}`).join(' ')} → ${SEAT_NAME[first]} 先拿牌`;
  }
  const deal=dealRound(seed,first);
  // 无庄盘各家按自己级数抢亮,这里先按先拿牌者的级数起头,谁亮到就换成谁的(见 rankOf)
  const trumpRank=dealerKnown?M.levels[M.dealer%2]:M.levels[first%2];
  G={seed,start,firstTaker:first,trumpRank,dealerKnown,
     hands:deal.hands,kittyOrig:deal.kitty,buried:[],
     trump:null,declSeat:dealerKnown?M.dealer:-1,
     decl:null,rebelHappened:false,
     visCount:[0,0,0,0],dealt:0,
     leader:-1,trick:[],trickNo:0,tricks:[],defPoints:0,capturedCards:[],lastWinner:-1,
     lastLeadSize:1,phase:'dealing',selected:new Set(),log:[],awaitNext:false,
     aiTimer:null,holdTimer:null,declTimer:null,declTick:null,declDeadline:0,
     coachNotes:[],hintCards:null,quiz:null,
     /* 托管挂在 G 上而不是 S 上 —— 它按局生效,不跟着设置一起存下来:
      * 新的一局必须从你自己的那一手开始,不能上次开着这次就替你打完。 */
     auto:carryAuto, autoTricks:0,
     undoStack:[],   // 悔牌(见 undoLastPlay):你每出一手前的整桌快照,悔一次弹一个
     // 牌谱(见 makeRecord):开局时刻、叫牌过程、是不是重打的局、各座位引擎、悔了几次
     recId:randId(), t0:Date.now(), declLog:[], replay:replayNext, redeals:redealCount,
     engines:S.engineVer.slice(), undos:0, undoNext:false};
  replayNext=false;
  if(cutsLog) log(cutsLog);
  if(S.engineVer.some(Boolean))
    log('AI 引擎:'+[1,2,3,0].map(s=>`${SEAT_NAME[s]}${s===HUMAN?'(托管)':''} ${engName(s)||'最新版'}`).join('、'));
  if(dealerKnown) log(`第${M.round+1}局:${SEAT_NAME[M.dealer]} 坐庄,打${rankName(trumpRank)}(${T('counter')}只改主色,不易庄不拿底)`);
  render(); setMsg('发牌中…可随时'+T('declare')+'/'+T('counter'));
  dealTick();
}

function visHand(s){ return G.hands[s].slice(0,G.visCount[s]); }

function startDeclCountdown(){
