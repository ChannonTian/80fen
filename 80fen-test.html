.leo-avatar{display:inline-block;flex:none;aspect-ratio:1;background:var(--leo-img) no-repeat 0 50%/300% auto}.leo-avatar.happy{background-position:50% 50%}.leo-avatar.curious{background-position:100% 50%}
/* =====================================================================
   六六八十分 · 打牌页(UI 测试)
   视觉:design-system/(暖纸面、素绿牌桌、蜂蜜黄强调、墨色描边 + 实心下投影)。
   尺寸:牌桌、手牌、桌面牌的大小由页尾表现层的 layout() 按屏幕算好,写进
   #game 上的 --hand-h / --cw / --tcw / --tstep,这里只管样子和摆位。
   三种骨架(#game 上的 class):
     .m-p 竖屏(手机、平板竖放) .m-l 矮横屏(手机横放) .m-w 宽屏(平板横放、电脑)
   ===================================================================== */
html.ll{--danger:var(--brick-deep);--tap:44px}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font:400 16px/1.5 var(--font-sans);overflow:hidden;
  -webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- 按钮(与设计系统 .ll-btn 同一套:药丸形、墨描边、实心投影) ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;flex:none;
  min-height:var(--tap);padding:0 16px;border:2px solid var(--ink);border-radius:999px;
  background:var(--card-face);color:var(--ink);box-shadow:var(--shadow-card);
  font:800 15px/1 var(--font-sans);white-space:nowrap;
  transition:transform var(--dur-tap) var(--ease-out),box-shadow var(--dur-tap) var(--ease-out),background .15s}
.btn:active:not(:disabled){transform:translateY(2px);box-shadow:var(--shadow-press)}
.btn:disabled{background:var(--line);color:var(--ink-faint);border-color:var(--ink-faint);box-shadow:none;cursor:default}
.btn.primary{background:var(--honey);font-weight:900;font-size:17px;min-width:96px}
.btn.primary:disabled{background:var(--line)}
.btn.go{background:var(--felt);color:var(--cream)}
.btn.quiet{background:none;border-color:transparent;box-shadow:none;color:var(--ink-soft)}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn.on{background:var(--teal-tint);color:var(--teal);border-color:var(--teal)}
.btn .leo-avatar{width:24px;height:24px;margin-left:-6px}
.icon-btn{width:var(--tap);height:var(--tap);padding:0;border-radius:14px;display:inline-grid;place-items:center;flex:none;
  background:var(--card-face);border:2px solid var(--ink);box-shadow:var(--shadow-card);color:var(--ink)}
.icon-btn:active{transform:translateY(2px);box-shadow:var(--shadow-press)}
.icon-btn svg{width:22px;height:22px;stroke:currentColor;stroke-width:2.4;fill:none;stroke-linecap:round;stroke-linejoin:round}

/* ---------- 整体骨架 ---------- */
#game{position:relative;isolation:isolate;height:100vh;height:100dvh;width:100%;max-width:1280px;margin:0 auto;
  display:grid;grid-template-columns:minmax(0,1fr);
  grid-template-rows:auto minmax(0,1fr) var(--hand-h,170px) auto;
  grid-template-areas:"top" "arena" "hand" "act";
  padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right)}
/* 矮横屏:操作按钮是牌桌右边一条竖栏,手牌占满整个屏幕宽、贴着屏幕底边 */
#game.m-l{grid-template-columns:minmax(0,1fr) var(--act-w,116px);grid-template-rows:auto minmax(0,1fr) var(--hand-h,80px);
  grid-template-areas:"top top" "arena act" "hand hand"}
/* 开局前:没有手牌也没有可点的操作,只留牌桌当背景 */
#game.idle .hand-area,#game.idle .action-bar{visibility:hidden}

/* ---------- 顶栏 ---------- */
.topbar{grid-area:top;display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;
  padding:max(8px,env(safe-area-inset-top)) 12px 6px;background:var(--paper);position:relative;z-index:20}
.topbar .logo{width:40px;height:40px;flex:none}
/* 六六头像:不套圆框(头像本身不居中,套圆总是歪),改用沿轮廓的一圈墨线,与贴纸风格一致 */
.leo-outline,.topbar .logo,.coach-bubble .leo-avatar,.start-card .leo-avatar,.res-coach .leo-avatar{
  filter:drop-shadow(1.5px 0 0 var(--ink)) drop-shadow(-1.5px 0 0 var(--ink)) drop-shadow(0 1.5px 0 var(--ink)) drop-shadow(0 -1.5px 0 var(--ink)) drop-shadow(0 3px 0 var(--sticker-shadow))}
.topbar .spacer{flex:1 1 0;min-width:0}
.chip{display:inline-flex;align-items:center;gap:5px;height:38px;padding:0 12px;flex:none;
  border:2px solid var(--ink);border-radius:999px;background:var(--card-face);box-shadow:var(--shadow-card);
  font:800 14px/1 var(--font-sans);white-space:nowrap;color:var(--ink)}
.chip small{font-size:12px;font-weight:700;color:var(--ink-soft)}
.chip .num{font:900 18px/1 var(--font-num);letter-spacing:-.02em}
.chip .suit{font:20px/1 var(--font-suit)}
.chip .suit.r{color:var(--suit-heart)}.chip .suit.d{color:var(--suit-diamond)}.chip .suit.c{color:var(--suit-club)}
.chip.trump{background:var(--cream)}
.chip.trump.pending{background:var(--card-face);color:var(--ink-soft)}
.chip.level .sep{width:1px;height:16px;background:var(--line);margin:0 2px}
.score-chip{flex:1 1 100%;order:9;display:flex;align-items:center;gap:8px;height:34px;padding:0 12px;
  border:2px solid var(--ink);border-radius:999px;background:var(--card-face);box-shadow:var(--shadow-card);cursor:pointer;min-width:0}
.score-chip:active{transform:translateY(2px);box-shadow:var(--shadow-press)}
.score-label{font:800 13px/1 var(--font-sans);color:var(--ink-soft);white-space:nowrap}
.score-track{position:relative;flex:1 1 auto;min-width:40px;height:10px;border:1.5px solid var(--ink);border-radius:999px;background:var(--line);overflow:hidden}
.score-track i{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--honey);transition:width .4s var(--ease-out)}
.score-track::after{content:'';position:absolute;left:50%;top:0;bottom:0;width:1.5px;background:var(--ink);opacity:.35}
.score-chip.over #scoreFill{background:var(--brick)}
/* 桌上这一墩的分:进度条上斜纹预览,数字跟在后面 */
.score-track i.pend{width:0;left:0;background:repeating-linear-gradient(-45deg,var(--honey) 0 3px,rgba(237,185,79,.35) 3px 6px);transition:left .4s var(--ease-out),width .4s var(--ease-out)}
.score-gain{font:900 13px/1 var(--font-num);font-style:normal;color:var(--ink);background:var(--cream);border:1.5px solid var(--ink);border-radius:999px;padding:3px 6px 2px;white-space:nowrap}
.score-gain.def{background:var(--honey)}
.score-chip.good #scoreFill{background:linear-gradient(90deg,#9CBB6B,#3F7D4E)}
.score-chip.bad #scoreFill{background:linear-gradient(90deg,#E8A266,var(--brick))}
.score-chip.good #scorePend{background:repeating-linear-gradient(-45deg,#3F7D4E 0 3px,rgba(63,125,78,.3) 3px 6px)}
.score-chip.bad #scorePend{background:repeating-linear-gradient(-45deg,var(--brick) 0 3px,rgba(201,71,47,.3) 3px 6px)}
.score-chip.good .score-gain.def{background:#CFE3C4;border-color:#3F7D4E}
.score-chip.bad .score-gain.def{background:var(--err-tint);color:var(--brick-deep);border-color:var(--brick)}
.score-chip.bump b{animation:scoreBump .5s var(--ease-back)}
.score-chip.bump .score-track{animation:trackGlow .7s ease-out}
@keyframes scoreBump{0%{transform:scale(1)}35%{transform:scale(1.35);color:var(--brick-deep)}100%{transform:scale(1)}}
@keyframes trackGlow{0%{box-shadow:0 0 0 0 rgba(237,185,79,.9)}100%{box-shadow:0 0 0 8px rgba(237,185,79,0)}}
.score-chip b{display:inline-block}
.score-gain:not([hidden]){animation:pop var(--dur-pop) var(--ease-back)}
/* 窄的得分条:有 +N 时省掉「/80」,进度条可以更短 */
@media (max-width:600px){.score-chip:has(.score-gain:not([hidden])) .score-total{display:none}}
#game.m-l .score-chip{gap:6px;padding:0 10px}#game.m-l .score-track{min-width:28px}
.score-chip b{font:900 18px/1 var(--font-num);letter-spacing:-.02em}
.score-total{font:800 12px/1 var(--font-sans);color:var(--ink-soft)}
#game.m-l .score-chip,#game.m-w .score-chip{order:3;flex:1 1 180px;max-width:420px;height:38px}
#game.m-l .topbar{padding:max(4px,env(safe-area-inset-top)) max(10px,env(safe-area-inset-right)) 2px max(10px,env(safe-area-inset-left));gap:6px;flex-wrap:nowrap}
#game.m-l .chip{flex:0 1 auto;min-width:0;padding:0 10px}
@media (max-width:700px){#game.m-l .topbar .logo{display:none}#game.m-l .score-label{display:none}}
#game.m-l .topbar .logo{width:36px;height:36px}
#game.m-l .chip,#game.m-l .score-chip,#game.m-l .icon-btn{height:38px}
#game.m-l .icon-btn{width:40px}
#game.m-w .topbar{padding:12px 20px 8px;gap:10px}
#game.m-w .chip{height:42px;font-size:15px}

/* ---------- 牌桌 ----------
   名牌、四摞牌、桌心提示都是 arena 里的绝对定位块,位置由表现层 layoutTable() 算好写进 left/top:
   名牌一局里不动;牌摞各有「最宽多宽」,张数多了收紧叠放间距,不压别家的名牌和牌摞 */
.arena{grid-area:arena;position:relative;min-height:0;margin:4px 10px 6px;isolation:isolate;touch-action:none}
#game.m-w .arena{margin:6px 20px 10px}
.felt{position:absolute;inset:0;z-index:-1;border:3px solid var(--ink);border-radius:var(--radius-lg);overflow:hidden;
  background:radial-gradient(110% 80% at 50% 42%,rgba(255,255,255,.11),rgba(255,255,255,0) 62%),
    radial-gradient(150% 130% at 50% 50%,rgba(0,0,0,0) 58%,rgba(18,40,29,.32)),var(--felt-table);
  box-shadow:var(--shadow-sticker),inset 0 0 0 6px rgba(255,255,255,.05)}
/* 桌布内圈的细线 + 桌心淡淡的六六,空桌时不显得空 */
.felt::before{content:'';position:absolute;inset:9px;border:1.5px solid rgba(245,237,220,.13);border-radius:calc(var(--radius-lg) - 7px)}
.felt::after{content:'';position:absolute;left:var(--wm-x,50%);top:var(--wm-y,50%);width:var(--wm,110px);aspect-ratio:1;transform:translate(-50%,-50%);
  -webkit-mask:var(--leo-img) no-repeat 0 50%/300% auto;mask:var(--leo-img) no-repeat 0 50%/300% auto;background:rgba(245,237,220,.06)}
.player,.my-play{display:contents}
.player-label,.played,.turn-slot,.trick-summary,.winner-label{position:absolute;left:0;top:0}
/* 名牌:头像 + 两行字(名字 / 座位)。庄、领、托管是贴在头像角上的小徽章,不占名牌宽度 */
.player-label{z-index:5;display:inline-grid;grid-template-columns:auto auto;grid-template-rows:auto auto;column-gap:7px;align-content:center;
  height:40px;padding:0 13px 0 3px;border:2px solid var(--ink);border-radius:999px;background:var(--cream);box-shadow:var(--shadow-card);
  color:var(--ink);white-space:nowrap;transition:background .2s}
.player-label .ava{grid-row:1/3;align-self:center;position:relative;display:grid;place-items:center;width:32px;height:32px;border-radius:50%;
  background:var(--brick);color:var(--card-face);font:900 16px/1 var(--font-heading);box-shadow:inset 0 0 0 2px rgba(255,255,255,.22)}
.player.north .ava{background:var(--teal)}
.my-play .ava{background:var(--honey);color:var(--ink);font-size:15px}
/* 小黄人头像:圆片里画像,外圈一圈队伍色(队友青、对手砖红) */
.player-label .ava.mug{overflow:visible;background:var(--brick);padding:2px}
.player-label .ava.mug svg{display:block;width:100%;height:100%;clip-path:circle(50%)}
.player.north .ava.mug{background:var(--teal)}
.player-label .name{grid-column:2;align-self:end;font:900 14px/1.1 var(--font-heading)}
.player-label .role{grid-column:2;align-self:start;font:700 10.5px/1.25 var(--font-sans);color:var(--ink-soft)}
.player-label .backs{display:none}
/* 我:只留一个头像 */
#game .my-play .player-label{padding:2px!important;column-gap:0}   /* 盖过各骨架里名牌右边的留白 */
.my-play .player-label .name{display:none}
.player-label .tags{position:absolute;inset:0;pointer-events:none}
.player-label .tag{position:absolute;display:grid;place-items:center;height:17px;min-width:17px;padding:0 3px;border-radius:999px;
  background:var(--ink);color:var(--cream);font:900 10px/1 var(--font-heading);box-shadow:0 0 0 1.5px var(--cream)}
.player-label .tag.lead{left:-5px;top:-6px;background:var(--card-face);color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink),0 0 0 1.5px var(--cream)}
.player-label .tag.dealer{left:19px;bottom:-6px}
.player-label .tag.auto{left:-5px;bottom:-6px;background:var(--teal)}
/* 轮到谁:名牌变蜂蜜黄,头像外转一圈 */
.player.turn .player-label,.my-play.turn .player-label{background:var(--honey)}
.player.turn .ava::after,.my-play.turn .ava::after{content:'';position:absolute;inset:-5px;border-radius:50%;border:3px solid var(--card-face);
  border-right-color:transparent;border-bottom-color:transparent;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#game.tight .player-label{height:36px;padding-right:10px;column-gap:6px}
#game.tight .player-label .ava{width:28px;height:28px;font-size:14px}
#game.tight .player-label .name{font-size:13px}#game.tight .player-label .role{font-size:10px}
#game.tight .player-label .tag.dealer{left:15px}
/* 矮横屏:竖排小名牌(头像在上、名字压在头像下沿),占地少,不把中间挤满 */
#game.m-l .player-label{grid-template-columns:auto;grid-template-rows:auto auto;justify-items:center;height:auto;padding:0;column-gap:0;
  border:0;background:none;box-shadow:none}
#game.m-l .player-label .ava{grid-row:1;grid-column:1;width:38px;height:38px;border:2px solid var(--ink);box-shadow:var(--shadow-card)}
#game.m-l .player-label .ava.mug{padding:1.5px}
#game.m-l .player-label .name{grid-row:2;grid-column:1;margin-top:-7px;padding:2px 7px 1px;border:1.5px solid var(--ink);border-radius:999px;
  background:var(--cream);font-size:12px;line-height:1.15;position:relative;z-index:1}
#game.m-l .player-label .role{display:none}
#game.m-l .player.turn .player-label,#game.m-l .my-play.turn .player-label{background:none}
#game.m-l .player.turn .player-label .name{background:var(--honey)}
#game.m-l .my-play .player-label .ava{width:40px;height:40px}
#game.m-l .player-label .tag.lead{left:calc(50% - 26px);top:-5px}
#game.m-l .player-label .tag.dealer{left:calc(50% + 9px);top:-5px;bottom:auto}
#game.m-l .player-label .tag.auto{left:calc(50% - 26px);top:22px;bottom:auto}
#game.m-w .player-label{height:46px;padding-right:16px;column-gap:9px}
#game.m-w .player-label .ava{width:38px;height:38px;font-size:19px}
#game.m-w .player-label .name{font-size:16px}#game.m-w .player-label .role{font-size:12px}
#game.m-w .player-label .tag.dealer{left:25px}
#game.m-w .player-label .tag{height:20px;min-width:20px;font-size:11px}
.played{z-index:3;height:calc(var(--tcw,52px)*1.43);width:0;flex:none}
.played .card{position:absolute;top:0;left:calc(var(--i,0)*var(--pstep,var(--tstep,18px)));--w:var(--tcw,52px);
  animation:playIn .32s var(--ease-out) both;animation-delay:calc(var(--i,0)*28ms)}
/* 牌从出牌人那边飞进来 */
#p2 .card{--fy:-36px}#p0 .card{--fy:36px}#p3 .card{--fx:-36px}#p1 .card{--fx:36px}
@keyframes playIn{from{opacity:0;transform:translate(var(--fx,0),var(--fy,0)) scale(.86) rotate(var(--fr,0deg))}to{opacity:1;transform:none}}
.played.ghost{z-index:6;pointer-events:none;transition:transform .5s var(--ease-in-out),opacity .5s ease-in}
.played.ghost .card{animation:none}
.player.winning .played .card .face{box-shadow:0 0 0 3px var(--honey),0 max(2px,calc(var(--w)*.05)) 0 var(--sticker-shadow)}
.winner-label{z-index:8;transform:translate(-50%,-50%) rotate(-3deg);padding:5px 12px;border:2px solid var(--ink);border-radius:999px;
  background:var(--honey);box-shadow:var(--shadow-card);font:900 14px/1.1 var(--font-heading);white-space:nowrap;
  animation:stamp var(--dur-stamp) var(--ease-back)}
.winner-label.theirs{background:var(--card-face)}
@keyframes stamp{from{transform:translate(-50%,-50%) scale(1.18) rotate(-6deg);opacity:0}to{transform:translate(-50%,-50%) scale(1) rotate(-3deg);opacity:1}}
/* 轮到我:我出牌的位置画一个虚线空位 */
.turn-slot{z-index:2;width:var(--tcw,52px);height:calc(var(--tcw,52px)*1.43);border:2.5px dashed rgba(245,237,220,.75);border-radius:calc(var(--tcw,52px)*.115);
  display:grid;place-items:center;text-align:center;color:var(--cream);font:900 13px/1.25 var(--font-heading);pointer-events:none;
  background:rgba(245,237,220,.07);animation:slotPulse 1.8s var(--ease-in-out) infinite}
.turn-slot:not([hidden]){animation:slotPulse 1.8s var(--ease-in-out) infinite,slotIn .3s var(--ease-back)}
@keyframes slotIn{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:none}}
/* 小黄人说话的气泡:贴着名牌,尖角指回名牌,2.8 秒后淡出 */
.say{position:absolute;left:0;top:0;z-index:9;transform:translate(-50%,-50%) scale(.85);max-width:min(170px,46%);width:max-content;
  padding:6px 11px 7px;border:2px solid var(--ink);border-radius:14px;background:var(--card-face);box-shadow:var(--shadow-card);
  font:800 13px/1.35 var(--font-sans);color:var(--ink);text-align:center;pointer-events:none;opacity:0;
  transition:opacity .2s,transform .25s var(--ease-back)}
.say.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
.say::after{content:'';position:absolute;width:9px;height:9px;background:var(--card-face);border:2px solid var(--ink);border-width:0 0 2px 2px}
.say.t-l::after{left:-6px;top:calc(50% - 5px);transform:rotate(45deg)}
.say.t-r::after{right:-6px;top:calc(50% - 5px);transform:rotate(-135deg)}
.say.t-b::after{bottom:-6px;left:calc(50% - 5px);transform:rotate(-45deg)}
.say.t-t::after{top:-6px;left:calc(50% - 5px);transform:rotate(135deg)}
#game.m-w .say{font-size:15px;max-width:220px}
/* 说话时头像跟着动:开心弹一下,生气抖一下 */
.ava.emo-happy{animation:emoHop .7s var(--ease-back)}
.ava.emo-mad{animation:emoShake .5s ease-in-out}
@keyframes emoHop{0%,100%{transform:none}35%{transform:translateY(-6px) scale(1.12)}65%{transform:translateY(1px)}}
@keyframes emoShake{0%,100%{transform:none}20%{transform:translateX(-3px) rotate(-6deg)}40%{transform:translateX(3px) rotate(6deg)}60%{transform:translateX(-2px) rotate(-4deg)}80%{transform:translateX(2px)}}
.turn-slot span{display:flex;flex-direction:column;align-items:center;gap:3px;padding:0 4px}
.turn-slot{font-size:clamp(11px,calc(var(--tcw,52px)*.19),15px)}
.turn-slot small{font:800 .78em/1 var(--font-sans);opacity:.85}
@keyframes slotPulse{0%,100%{border-color:rgba(245,237,220,.75)}50%{border-color:var(--honey);background:rgba(237,185,79,.14)}}
.arena.drag-over .turn-slot{border-style:solid;border-color:var(--honey);background:rgba(237,185,79,.25)}

/* 桌心提示:只在发牌、亮主、扣底这些还没出牌的阶段出现(出牌阶段桌心留给牌) */
.trick-summary{z-index:4;transform:translate(-50%,-50%);pointer-events:none;
  display:flex;flex-direction:column;align-items:center;gap:3px;min-width:96px;max-width:min(80%,260px);padding:8px 14px 9px;
  border:2px solid var(--ink);border-radius:16px;background:var(--cream);box-shadow:var(--shadow-card);color:var(--ink);text-align:center}
.trick-summary .ts-main{display:flex;align-items:baseline;gap:3px;font:800 12px/1 var(--font-sans);white-space:nowrap}
.trick-summary strong{font:900 16px/1.2 var(--font-heading)}
.trick-summary small{font:700 12px/1.3 var(--font-sans);color:var(--ink-soft);text-wrap:balance}
#game.m-w .trick-summary{padding:10px 18px 11px}
#game.m-w .trick-summary strong{font-size:19px}
#game.m-w .trick-summary small{font-size:14px}

/* 桌面通知(出错、阶段说明) */
.center-toast{position:absolute;left:50%;top:50%;z-index:9;transform:translate(-50%,-50%);width:max-content;max-width:min(86%,360px);
  padding:10px 16px;border:2px solid var(--ink);border-radius:16px;background:var(--card-face);box-shadow:var(--shadow-sticker);
  font:700 15px/1.45 var(--font-sans);text-align:center;color:var(--ink);pointer-events:none;opacity:0;transition:opacity .2s}
.center-toast.show{opacity:1;animation:toastIn .26s var(--ease-back)}
@keyframes toastIn{from{transform:translate(-50%,-50%) scale(.9)}to{transform:translate(-50%,-50%) scale(1)}}
.center-toast.err.show{animation:toastIn .26s var(--ease-back),shake .36s .05s ease-in-out}
@keyframes shake{0%,100%{margin-left:0}20%{margin-left:-6px}40%{margin-left:6px}60%{margin-left:-4px}80%{margin-left:3px}}
.center-toast.err{background:var(--err-tint);color:var(--brick-deep)}
.center-toast.info{background:var(--cream)}
.drop-cue{position:absolute;inset:8px;z-index:7;border:3px dashed var(--cream);border-radius:20px;display:none;
  align-items:flex-start;justify-content:center;padding-top:14px;pointer-events:none;background:rgba(245,237,220,.06)}
.drop-cue span{padding:8px 18px;border:2px solid var(--ink);border-radius:999px;background:var(--honey);font:900 16px/1 var(--font-heading);box-shadow:var(--shadow-card)}
.arena.drag-ready .drop-cue,.arena.drag-over .drop-cue{display:flex}
.arena.drag-over .drop-cue{background:rgba(245,237,220,.16);border-style:solid}

/* ---------- 牌面(手牌、桌面、拖拽影子共用;--w 决定一切尺寸) ---------- */
.card{--w:64px;position:relative;display:block;width:var(--w);height:calc(var(--w)*1.43);flex:none;
  container-type:inline-size;user-select:none;-webkit-user-select:none;color:var(--suit-spade)}
.card .face{position:absolute;inset:0;background:var(--card-face);border:max(1.5px,calc(var(--w)*.032)) solid var(--ink);
  border-radius:calc(var(--w)*.115);box-shadow:0 max(2px,calc(var(--w)*.05)) 0 var(--sticker-shadow);overflow:hidden;
  transition:background .12s,border-color .12s,box-shadow .12s}
.card.sH,.card.jb{color:var(--suit-heart)}
.card.sD{color:var(--suit-diamond)}
.card.sC{color:var(--suit-club)}
.card .tl{position:absolute;left:8cqw;top:4cqw;font:900 38cqw/1 var(--font-num);letter-spacing:-.05em}
.card.two .tl{font-size:33cqw;letter-spacing:-.12em;left:5cqw;top:6cqw}
.card .bl{position:absolute;left:9cqw;top:43cqw;font:30cqw/1 var(--font-suit)}
.card .pt{position:absolute;left:6cqw;top:80cqw;padding:2cqw 4cqw;border:max(1px,1.6cqw) solid var(--ink);border-radius:999px;
  background:var(--honey);color:var(--ink);font:900 14cqw/1 var(--font-num)}
/* 大小王只靠六六的颜色分:彩色是大王、灰色是小王(左上角的轮廓放大,叠在手牌里也看得清) */
.card .cat-tl{position:absolute;left:3cqw;top:4cqw;width:40cqw;height:40cqw}
.card .cat-tl>.joker-art,.card .cat-big>.joker-art{width:100%;height:100%}
/* 六六轮廓:用头像图当遮罩,里面填颜色;墨线描边加在外层(滤镜在遮罩之前算,放同一层会被剪掉) */
.joker-art{display:inline-block;vertical-align:middle;
  filter:drop-shadow(1px 0 0 var(--ink)) drop-shadow(-1px 0 0 var(--ink)) drop-shadow(0 1px 0 var(--ink)) drop-shadow(0 -1px 0 var(--ink))}
.leo-sil{display:block;width:100%;height:100%;
  -webkit-mask:var(--leo-img) no-repeat 0 50%/300% auto;mask:var(--leo-img) no-repeat 0 50%/300% auto}
.joker-art.big .leo-sil{background:
  radial-gradient(circle,rgba(36,24,15,.28) 22%,transparent 26%) 0 0/9% 9%,
  conic-gradient(from 45deg at 50% 55%,#EDB94F 0 25%,#E2457A 0 50%,#2F9FB0 0 75%,#F07E2E 0)}
.joker-art.small .leo-sil{background:
  radial-gradient(circle,rgba(255,255,255,.35) 22%,transparent 26%) 0 0/9% 9%,#9E978D}
.card .cat-big{position:absolute;right:6cqw;bottom:8cqw;width:60cqw;height:60cqw}
.card.js{color:var(--ink-soft)}
.card.jb .face{background:linear-gradient(135deg,var(--card-face) 55%,#FCEBC4)}
.card .tr,.card .br{display:none}
/* 右下角的大花色:桌面上整张露出来的牌不再是一大片空白 */
.card .pip{display:none;position:absolute;right:7cqw;bottom:5cqw;font:58cqw/1 var(--font-suit)}
.card.two .pip{font-size:54cqw}
/* 只有整张露出来的牌(桌面、放大镜、拖拽影子)才画;手牌和记录里叠着的牌露出一截大花色反而乱 */
.played .card .pip,#loupe .card .pip,#dragGhost .card:last-child .pip{display:block}

/* ---------- 手牌 ---------- */
.hand-area{grid-area:hand;position:relative;min-height:0;min-width:0}
.fan-viewport{position:absolute;inset:0;overflow:hidden;touch-action:none}
#hand{position:absolute;inset:0}
#hand .card{position:absolute;left:0;top:0;cursor:pointer;transform-origin:50% 100%;
  transition:transform var(--dur-tap) var(--ease-out)}
#hand .card.sel .face{background:var(--teal-tint);border-color:var(--teal);box-shadow:0 0 0 2px var(--teal),0 3px 0 var(--sticker-shadow)}
#hand .card.hintc .face{box-shadow:0 0 0 3px var(--honey),0 3px 0 var(--sticker-shadow)}
#hand .card.hintc.sel .face{box-shadow:0 0 0 2px var(--teal),0 0 0 5px var(--honey)}
html.hasHover #hand .card:hover .face{border-color:var(--teal)}
.hand-wheel{position:absolute;left:50%;bottom:2px;transform:translateX(-50%);width:min(280px,70%);height:22px;z-index:400;
  display:flex;align-items:center;gap:6px;color:var(--ink-soft);font-size:16px}
.hand-wheel.is-off{display:none}
.hand-wheel input{flex:1;min-width:0;height:22px;accent-color:var(--teal);cursor:ew-resize}
.hand-area.overflow::before,.hand-area.overflow::after{content:'';position:absolute;top:0;bottom:0;width:18px;z-index:350;pointer-events:none}
.hand-area.overflow::before{left:0;background:linear-gradient(90deg,var(--paper),transparent)}
.hand-area.overflow::after{right:0;background:linear-gradient(-90deg,var(--paper),transparent)}

/* ---------- 底部操作 ---------- */
.action-bar{grid-area:act;display:flex;align-items:center;gap:8px;min-width:0;
  padding:8px 12px max(8px,env(safe-area-inset-bottom));border-top:2px solid var(--ink);background:var(--paper);position:relative;z-index:30}
.action-bar .spacer{flex:1 1 0;min-width:0}
.action-bar .status-text{min-width:0;font:700 14px/1.3 var(--font-sans);color:var(--ink-soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#dealZone{display:flex;align-items:center;gap:8px;min-width:0}
#dealZone:empty,#dealZone>span:only-child:empty{display:none}
#dealZone span{font:700 14px/1.3 var(--font-sans);color:var(--ink-soft)}
#game.m-l .action-bar{display:grid;grid-template-columns:1fr 1fr;align-content:end;gap:6px;border:0;background:none;
  width:var(--act-w,116px);padding:4px max(8px,env(safe-area-inset-right)) 6px 0}
#game.m-l .action-bar .spacer{display:none}
#game.m-l .action-bar>*{order:5}
#game.m-l #btnHint{order:1}#game.m-l #btnAuto{order:2}#game.m-l #btnUndo{order:3}#game.m-l #btnClear{order:4}
#game.m-l #dealZone,#game.m-l #btnSkipDecl,#game.m-l #bidAction,#game.m-l #btnBury,#game.m-l #btnPlay{grid-column:1/-1}
#game.m-l #dealZone{flex-direction:column;align-items:stretch;gap:6px}
#game.m-l #dealZone>span{display:none}
#game.m-l .action-bar .btn{min-height:42px;padding:0 6px;font-size:14px;width:100%;min-width:0}
#game.m-l .action-bar .btn.primary{min-height:50px;font-size:17px}
#game.m-w .action-bar{padding:10px 20px max(10px,env(safe-area-inset-bottom));gap:10px}
#game.m-w .btn{min-height:48px;padding:0 20px;font-size:16px}
#game.m-w .btn.primary{font-size:18px;min-width:120px}
@media (max-width:380px){
  .action-bar{gap:6px;padding-left:8px;padding-right:8px}
  .btn{padding:0 12px;font-size:14px}
  .btn.primary{min-width:80px;font-size:16px}
  .btn .leo-avatar{margin-left:-4px}
  .topbar{padding-left:8px;padding-right:8px;gap:5px 6px}
  .chip{padding:0 9px;height:36px}
  .topbar .logo{width:36px;height:36px}
  .icon-btn{width:40px;height:40px}
}
@media (max-width:360px){.topbar .logo{display:none}}
#recordsBtn,#menuBtn{order:10}
/* 竖屏顶栏两行:第一行头像 / 主 / 级数 / 两个按钮,不许折行;第二行得分 */
#game.m-p .topbar{display:grid;grid-template-columns:auto minmax(0,max-content) minmax(0,max-content) minmax(0,1fr) auto auto;align-items:center}
#game.m-p .score-chip{grid-column:1/-1;grid-row:2}
#game.m-p .topbar .logo{grid-column:1;grid-row:1}#game.m-p #trumpChip{grid-column:2;grid-row:1}#game.m-p #levelChip{grid-column:3;grid-row:1}
#game.m-p .topbar .spacer{grid-column:4;grid-row:1}#game.m-p #recordsBtn{grid-column:5;grid-row:1}#game.m-p #menuBtn{grid-column:6;grid-row:1}
#game.m-p .chip{min-width:0;overflow:hidden;padding:0 10px;gap:4px}
#game.m-p .chip>*{flex:none}
#game.m-p #recordsBtn,#game.m-p #menuBtn{order:0}
/* 面板内容多时自身滚动,底部操作永远看得见 */
#overlay .panel:has(.res-head){padding-bottom:0}
#overlay .panel:has(.res-head) .panel-actions{position:sticky;bottom:0;margin:18px -22px 0;padding:12px 16px 16px;background:var(--card-face);border-top:1.5px solid var(--line)}
@media (max-height:560px){
  #overlay .panel{padding:14px 18px}
  #overlay .panel:has(.res-head) .panel-actions{margin:12px -18px 0;padding:10px 12px 12px}
  #overlay .res-head{flex-direction:row;flex-wrap:wrap;justify-content:center;column-gap:14px}
  #overlay .res-badge{width:64px;height:64px;margin:0}
  #overlay .res-badge .n{font-size:28px}#overlay .res-badge .u{margin-top:-8px}
  #overlay .res-head>div:not(.res-badge){flex-basis:auto}
  #overlay .res-kitty,#overlay .res-coach,#overlay .res-levels{margin-top:8px}
}

/* 各阶段露出哪些按钮(产品 render 管 hidden/disabled,这里再按阶段收一遍) */
#btnKitty{display:none!important}
#btnClear:disabled{display:none}
#btnAuto:not(.minor){background:var(--teal);color:var(--card-face);border-color:var(--ink)}
/* 次要操作(问六六 / 托管 / 悔牌):图标 + 小字的方块,省出宽度给主按钮 */
.tool{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;flex:none;
  width:50px;height:48px;padding:0;border:2px solid var(--ink);border-radius:14px;background:var(--card-face);color:var(--ink);
  box-shadow:var(--shadow-card);font:800 12px/1 var(--font-sans);white-space:nowrap;
  transition:transform var(--dur-tap) var(--ease-out),box-shadow var(--dur-tap) var(--ease-out)}
.tool:active:not(:disabled){transform:translateY(2px);box-shadow:var(--shadow-press)}
.tool:disabled{background:var(--line);color:var(--ink-faint);border-color:var(--ink-faint);box-shadow:none;cursor:default}
.tool:disabled .ico{opacity:.45;filter:grayscale(1)}
.tool svg{width:22px;height:22px;stroke:currentColor;stroke-width:2.2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.tool .ico{width:24px;height:24px}
.action-bar .btn{min-height:46px}
.action-bar .btn.primary{flex:0 1 auto;min-width:88px}
#game.m-l .tool{width:100%;height:44px;font-size:11px}
#game.m-l .tool svg{width:19px;height:19px}#game.m-l .tool .ico{width:21px;height:21px}
#game.m-w .tool{width:64px;height:56px;font-size:13px}
/* 问六六:「问」+ 头像,横排的小药丸 */
.tool.ask{flex-direction:row;width:auto;height:44px;padding:0 4px 0 11px;gap:1px;border-radius:999px;font:900 16px/1 var(--font-heading)}
.tool.ask .ico{width:28px;height:28px}
#game.m-l .tool.ask{width:100%;height:44px;padding:0 3px;justify-content:center;font-size:14px}#game.m-l .tool.ask .ico{width:22px;height:22px}
#game.m-w .tool.ask{width:auto;height:50px;font-size:17px;padding:0 8px 0 16px}#game.m-w .tool.ask .ico{width:34px;height:34px}
@media (max-width:360px){.action-bar{gap:4px!important}.action-bar .btn{padding:0 9px}.tool{width:46px;height:48px;font-size:11px}.tool.ask{height:42px;padding:0 4px 0 10px}.tool.ask .ico{width:26px;height:26px}.action-bar .btn.primary{min-width:70px}}
.ph-dealing #btnHint,.ph-dealing #btnPlay,.ph-dealing #btnClear,.ph-dealing #dealZone,
.ph-kitty #btnHint,.ph-kitty #btnPlay,.ph-lowrebel #btnPlay,.ph-lowrebel #btnHint,.ph-lowrebel #btnClear,
.ph-redealing #btnPlay,.ph-redealing #btnHint,.ph-redealing #btnClear,
.ph-ended #btnPlay,.ph-ended #btnHint,.ph-ended #btnClear,.ph-ended #btnUndo{display:none!important}
#dealZone button{display:inline-flex;align-items:center;justify-content:center;min-height:var(--tap);padding:0 18px;border:2px solid var(--ink);
  border-radius:999px;background:var(--honey);box-shadow:var(--shadow-card);font:900 16px/1 var(--font-sans);white-space:nowrap}
#dealZone button.minor{background:var(--card-face);font-weight:800}
#dealZone button:active{transform:translateY(2px);box-shadow:var(--shadow-press)}
#dealZone span{color:var(--ink-soft)!important}
#game.m-l #dealZone button{min-height:42px;padding:0 6px;font-size:14px}
#btnPlay.ready{animation:readyPulse 1.8s var(--ease-in-out) infinite}
@keyframes readyPulse{0%,100%{box-shadow:var(--shadow-card),0 0 0 0 rgba(237,185,79,.8)}50%{box-shadow:var(--shadow-card),0 0 0 7px rgba(237,185,79,0)}}

/* ---------- 六六气泡(问六六 / 失误提醒) ---------- */
.coach-bubble{position:absolute;left:12px;right:12px;bottom:calc(var(--hand-h,170px) + 64px);z-index:60;
  display:flex;gap:10px;align-items:flex-start;max-width:520px;margin:0 auto;pointer-events:auto;
  animation:pop var(--dur-pop) var(--ease-back)}

@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.96)}to{opacity:1;transform:none}}
.coach-bubble .leo-avatar{width:56px;height:56px;flex:none}
#game.m-w .coach-bubble{max-width:620px}
#game.m-l .coach-bubble .leo-avatar{width:42px;height:42px}
#game.m-l .coach-bubble .cb-body{padding:8px 10px 8px 12px;font-size:14px}
#game.m-l .cb-actions{margin-top:6px}#game.m-l .cb-actions .btn{min-height:34px}
.coach-bubble .cb-body{position:relative;flex:1;min-width:0;background:var(--card-face);border:2px solid var(--ink);border-radius:16px;
  box-shadow:var(--shadow-sticker);padding:10px 12px 10px 14px;font:400 15px/1.5 var(--font-sans)}
.coach-bubble .cb-body::before{content:'';position:absolute;left:-8px;top:20px;width:13px;height:13px;background:var(--card-face);
  border-left:2px solid var(--ink);border-bottom:2px solid var(--ink);transform:rotate(45deg)}
.coach-bubble.warn .cb-body{background:var(--err-tint)}
.coach-bubble.warn .cb-body::before{background:var(--err-tint)}
.cb-text{max-height:min(34vh,220px);overflow-y:auto;padding-right:24px}
.cb-text b{font-weight:800}
.cb-more{margin-top:6px;padding-top:6px;border-top:1.5px dashed var(--line);font-size:14px;color:var(--ink-soft)}
.cb-more>div{margin:2px 0}
.cb-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.cb-actions .btn{min-height:36px;padding:0 12px;font-size:14px}
.cb-actions{gap:6px}
.cb-close{position:absolute;right:4px;top:4px;width:32px;height:32px;border:0;background:none;color:var(--ink-soft);font-size:20px;line-height:1;border-radius:50%}
.coachStep{color:var(--teal);font-weight:800}
.cards-inline{white-space:nowrap;font-weight:800}

/* ---------- 遮罩、面板(开局、局终、设置、底牌、分牌) ---------- */
#overlay,#setOverlay,.zmodal{position:fixed;inset:0;z-index:70;display:none;align-items:center;justify-content:center;
  padding:16px;background:rgba(36,24,15,.55)}
#setOverlay{z-index:72}
.zmodal{display:flex;z-index:75}
.zmodal[hidden]{display:none!important}
#overlay .panel,#setOverlay .panel,.zpanel{position:relative;width:min(460px,100%);max-height:calc(100dvh - 32px);overflow-y:auto;
  background:var(--card-face);border:3px solid var(--ink);border-radius:var(--radius-lg);box-shadow:var(--shadow-sticker);
  padding:24px 22px;color:var(--ink);text-align:center;font:400 16px/1.6 var(--font-sans);overscroll-behavior:contain}
#overlay .panel b,#setOverlay .panel b{font-weight:800}
/* 弹窗弹出、遮罩淡入 */
#overlay .panel,#setOverlay .panel,.zpanel{animation:panelIn var(--dur-pop) var(--ease-back)}
#overlay,#setOverlay,.zmodal{animation:fadeIn .2s linear}
@keyframes panelIn{from{opacity:0;transform:translateY(14px) scale(.95)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.panel-actions{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:18px}
/* 开局封面 */
.start-card{display:flex;flex-direction:column;align-items:center;gap:6px}
.start-card .leo-avatar{width:120px;height:120px;margin-bottom:6px}
@media (max-height:560px){
  #overlay .start-card .leo-avatar{width:64px;height:64px;margin:0}
  #overlay .start-card .start-sub+.start-sub{display:none}
  #overlay .start-title{font-size:26px}
  #overlay .start-card .panel-actions{margin-top:10px}
}
.start-title{font:900 32px/1.1 var(--font-heading);letter-spacing:-.01em}
.start-sub{font:700 15px/1.5 var(--font-sans);color:var(--ink-soft)}
.start-ver{font:700 12px/1.4 var(--font-sans);color:var(--ink-faint)}
.start-card .btn.primary{min-width:180px;min-height:52px;font-size:18px}
/* 局终 */
.res-head{display:flex;flex-direction:column;align-items:center;gap:4px}
.res-badge{display:grid;place-items:center;width:96px;height:96px;border-radius:50%;background:var(--honey);
  border:3px solid var(--ink);box-shadow:var(--shadow-sticker);margin-bottom:6px}
.res-badge.lose{background:var(--cream)}
.res-badge .n{font:900 40px/1 var(--font-num);letter-spacing:-.04em}
.res-badge .u{font:900 12px/1 var(--font-heading);margin-top:-12px}
.res-title{font:900 26px/1.2 var(--font-heading)}
.res-title.lose{color:var(--ink-soft)}
.res-line{font:700 15px/1.5 var(--font-sans)}
.res-sub{font:400 14px/1.5 var(--font-sans);color:var(--ink-soft)}
.res-gate{margin-top:8px;padding:8px 12px;border-radius:12px;background:var(--cream);font:700 14px/1.5 var(--font-sans)}
.res-kitty{margin-top:12px;padding:10px;border-radius:16px;background:var(--cream);border:1.5px solid var(--line)}
.res-kitty .res-sub{margin-bottom:6px}
/* 底牌八张排成一行叠着放,不折成 7 + 1 */
.res-kitty .mini-row{flex-wrap:nowrap;gap:0}
.res-kitty .mini-row .card{--w:40px}
.res-kitty .mini-row .card+.card{margin-left:-11px}
.mini-row{display:flex;flex-wrap:wrap;justify-content:center;gap:4px}
.mini-row .card{--w:34px}
.res-coach{display:flex;gap:10px;align-items:flex-start;text-align:left;margin-top:12px;padding:10px 12px;border-radius:16px;
  background:var(--teal-tint);font:400 14px/1.55 var(--font-sans)}
.res-coach .leo-avatar{width:42px;height:42px;flex:none}
.res-coach b{color:var(--teal)}
.res-coach .dim{color:var(--ink-soft)}
.res-levels{display:flex;justify-content:center;gap:10px;margin-top:12px}
.res-levels>div{flex:1;max-width:150px;padding:8px;border:2px solid var(--ink);border-radius:14px;background:var(--card-face);box-shadow:var(--shadow-card)}
.res-levels>div.us{background:var(--honey)}
.res-levels small{display:block;font:700 12px/1.2 var(--font-sans);color:var(--ink-soft)}
.res-levels .num{font:900 26px/1.1 var(--font-num)}
.res-next{margin-top:8px;font:700 14px/1.5 var(--font-sans);color:var(--ink-soft)}
.res-final{margin-top:12px;font:900 20px/1.3 var(--font-heading)}
/* 测试版:第一次结算时说一声会上传牌谱 */
.res-upload{margin-top:12px;padding:10px 12px;border-radius:14px;background:var(--cream);border:1.5px solid var(--line);
  font:700 13px/1.5 var(--font-sans);color:var(--ink);text-align:left}
.res-upload .dim{margin:2px 0 8px;font-weight:400;font-size:12px;color:var(--ink-soft)}
.res-upload-btns{display:flex;gap:8px;justify-content:flex-end}
.res-upload-btns .btn{min-height:36px;padding:0 14px;font-size:14px}
.res-coach .dim{color:var(--ink-soft);font-size:13px}
/* 局终:小黄人各说一句 */
.res-quips{display:flex;flex-direction:column;gap:6px;margin-top:12px;text-align:left}
.quip{display:flex;align-items:center;gap:8px;font:700 14px/1.4 var(--font-sans)}
.quip b{margin-right:6px;font-family:var(--font-heading)}
.quip .ava{flex:none;width:30px;height:30px;border-radius:50%;padding:2px;background:var(--brick)}
.quip .ava.mate{background:var(--teal)}
.quip .ava svg{display:block;width:100%;height:100%;clip-path:circle(50%)}
.setVer{display:block;margin-top:3px;font:700 12px/1.2 var(--font-sans);color:var(--ink-faint)}
.setHeader b{min-width:4em}

/* 设置(产品原件的 .set* 结构,只换皮) */
#setOverlay .panel{text-align:left;width:min(520px,100%);padding:0 20px 20px}
.setHeader{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:10px;margin:0 -20px 8px;padding:14px 20px 12px;
  background:var(--card-face);border-bottom:2px solid var(--line)}
.setHeader b{flex:1;font:900 20px/1.2 var(--font-heading)}
.setHeaderBtns{display:flex;gap:8px;flex-wrap:wrap}
.setHeaderBtns .btn{min-height:38px;padding:0 14px;font-size:14px}
.setSection{margin:18px 0 4px;font:900 15px/1.3 var(--font-heading);color:var(--ink)}
.setRow{display:flex;align-items:center;flex-wrap:wrap;gap:8px 10px;min-height:44px;padding:4px 0;border-bottom:1px solid var(--line);font:400 15px/1.4 var(--font-sans)}
.setRow>label:first-child{flex:1 1 180px;min-width:0}
.setRow label{display:inline-flex;align-items:center;gap:8px;cursor:pointer}
.setRow.center{justify-content:flex-start;border-bottom:0}
.setRow input[type=checkbox]{width:22px;height:22px;accent-color:var(--teal);flex:none;margin:0}
.setRow select,.setRow input[type=number],.setRow input[type=text],.setRow textarea{min-height:38px;padding:4px 10px;border:2px solid var(--ink);border-radius:10px;background:var(--card-face);font-size:15px}
.setRow input[type=number]{width:76px}
.setRow code{font:700 14px/1.2 ui-monospace,Menlo,monospace;background:var(--cream);padding:4px 8px;border-radius:8px}
.setRow .btn{min-height:38px;padding:0 14px;font-size:14px}
.setHint{margin:4px 0 6px;font:400 13px/1.5 var(--font-sans);color:var(--ink-soft)}
.setRow .setHint{margin:0}
/* 弹出的小面板(看底牌、复制种子码等) */
.modal-title{font:900 18px/1.3 var(--font-heading);margin-bottom:10px}
.trickRow{display:flex;flex-wrap:wrap;justify-content:center;gap:4px}
.trickRow .card{--w:44px}

/* 分牌弹窗 */
.zpanel{padding:0;text-align:left;display:flex;flex-direction:column;width:min(440px,100%)}
.zhead{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 12px 20px;border-bottom:2px solid var(--line)}
.zhead b{font:900 18px/1.2 var(--font-heading)}
.zbody{padding:12px 20px 18px;overflow-y:auto;font:400 15px/1.6 var(--font-sans)}
.sc-total{display:flex;align-items:baseline;gap:6px;margin-bottom:10px;font:700 15px/1.2 var(--font-sans)}
.sc-total .num{font:900 34px/1 var(--font-num)}
.sc-trick{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line)}
.sc-trick:last-child{border-bottom:0}
.sc-trick .sc-no{flex:none;width:3.6em;font:700 13px/1.2 var(--font-sans);color:var(--ink-soft)}
.sc-trick .mini-row{justify-content:flex-start;flex:1}
.sc-trick .sc-pts{flex:none;font:900 16px/1 var(--font-num)}
.sc-empty{color:var(--ink-soft);padding:12px 0}
.close-x{width:40px;height:40px;border-radius:50%;border:2px solid var(--ink);background:var(--card-face);display:grid;place-items:center;flex:none;box-shadow:var(--shadow-card);font-size:20px;line-height:1;padding:0}

/* 菜单(底部弹出) */
#sheet{margin:auto auto 0;width:min(520px,100%);max-width:100%;max-height:min(86dvh,640px);padding:0;border:3px solid var(--ink);border-bottom:0;
  border-radius:24px 24px 0 0;background:var(--paper);color:var(--ink);box-shadow:0 -4px 0 var(--sticker-shadow);overflow:hidden}
#sheet[open]{display:flex;flex-direction:column}
#sheet::backdrop{background:rgba(36,24,15,.55)}
.sheet-header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 10px 20px}
.sheet-header h2{margin:0;font:900 20px/1.2 var(--font-heading)}
#sheetBody{padding:0 16px max(16px,env(safe-area-inset-bottom));overflow-y:auto}
.menu-option{display:flex;align-items:center;gap:14px;width:100%;min-height:60px;margin:0 0 10px;padding:10px 16px;text-align:left;
  border:2px solid var(--ink);border-radius:16px;background:var(--card-face);box-shadow:var(--shadow-card);color:var(--ink);text-decoration:none}
.menu-option:active{transform:translateY(2px);box-shadow:var(--shadow-press)}
.menu-option svg{width:24px;height:24px;flex:none;stroke:currentColor;stroke-width:2.2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.menu-option span{display:flex;flex-direction:column;gap:2px;font:800 16px/1.2 var(--font-sans)}
.menu-option small{font:400 13px/1.3 var(--font-sans);color:var(--ink-soft)}
.menu-foot{padding:4px 4px 0;font:400 12px/1.4 var(--font-sans);color:var(--ink-faint);text-align:center}
body.m-l #sheet{margin:auto 0 auto auto;height:100dvh;max-height:100dvh;width:min(380px,60vw);border:0;border-left:3px solid var(--ink);border-radius:24px 0 0 24px}

/* ---------- 记录与教练(抽屉) ---------- */
#side{display:none;position:fixed;left:0;right:0;bottom:0;z-index:50;height:min(74dvh,640px);flex-direction:column;
  background:var(--paper);border:3px solid var(--ink);border-bottom:0;border-radius:24px 24px 0 0;box-shadow:0 -4px 0 var(--sticker-shadow)}
body.drawer-open #side{display:flex;animation:sheetUp var(--dur-slide) var(--ease-out)}
@keyframes sheetUp{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
body.drawer-open::before{content:'';position:fixed;inset:0;z-index:49;background:rgba(36,24,15,.55)}
body.m-l #side,body.m-w #side{left:auto;top:0;height:100dvh;width:min(440px,max(52vw,300px));border:0;border-left:3px solid var(--ink);border-radius:24px 0 0 24px}
#side .records-head{flex:none;display:flex;align-items:center;gap:10px;padding:12px 14px 8px 18px}
#side .records-head #tabs{flex:1;display:flex;gap:6px;min-width:0}
#side #tabs button{min-height:38px;padding:0 14px;border:2px solid var(--ink);border-radius:999px;background:var(--card-face);
  font:800 14px/1 var(--font-sans);color:var(--ink-soft);box-shadow:var(--shadow-card)}
#side #tabs button.on{background:var(--honey);color:var(--ink)}
#side .records-body{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:4px max(18px,env(safe-area-inset-right)) 18px 18px;font:400 15px/1.6 var(--font-sans);overscroll-behavior:contain}
#side .records-foot{flex:none;display:flex;align-items:center;gap:14px;padding:8px 18px max(10px,env(safe-area-inset-bottom));border-top:1.5px solid var(--line)}
#side .records-foot:empty{display:none}
.filter{display:inline-flex;align-items:center;gap:6px;font:700 13px/1 var(--font-sans);color:var(--ink-soft)}
.filter input{width:18px;height:18px;accent-color:var(--teal);margin:0}
.log-controls{display:flex;gap:8px;align-items:center;margin:4px 0 10px}
.log-controls select{min-height:36px;border:2px solid var(--ink);border-radius:10px;padding:2px 8px;background:var(--card-face);font:700 14px/1 var(--font-sans)}
.init-hands{margin-bottom:10px;padding:8px 12px;border:1.5px solid var(--line);border-radius:12px;background:var(--card-face)}
.init-hands summary{cursor:pointer;font:700 14px/1.6 var(--font-sans);color:var(--ink-soft)}
.ih-row{display:grid;grid-template-columns:3em minmax(0,1fr);gap:6px;margin-top:8px;align-items:baseline}
.ih-who{font-size:13px;color:var(--ink-soft);white-space:nowrap}
.trick-line{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:2px 10px;align-items:baseline;padding:7px 10px;margin:4px 0;border-radius:12px;background:var(--card-face);border:1.5px solid var(--line)}
.trick-line.win{background:var(--ok-tint)}
.trick-line .tno{font:700 12px/1.4 var(--font-sans);color:var(--ink-soft);white-space:nowrap}
.trick-line .tcards,.ih-row .tcards,.suit-row .tcards{display:flex;flex-wrap:wrap;align-items:center;row-gap:3px;min-width:0;font:900 15px/1.5 var(--font-num);letter-spacing:.01em}
.tplay{display:inline-flex;flex-wrap:wrap;align-items:center;row-gap:3px;margin-right:10px}
.tplay .who,.chip .who{display:inline-grid;place-items:center;width:17px;height:17px;margin-right:3px;border-radius:50%;flex:none;
  background:var(--brick);color:var(--card-face);font:900 10px/1 var(--font-heading);font-style:normal}
.tplay .who.s2,.chip .who.s2{background:var(--teal)}.tplay .who.s0{background:var(--honey);color:var(--ink)}
.chip .who{width:20px;height:20px;font-size:11px;margin-right:0}
.tplay:last-child{margin-right:0}
.trick-line .tsum{margin-left:auto;font:700 12px/1.4 var(--font-sans);color:var(--ink-soft);white-space:nowrap}
.tcard{white-space:nowrap;margin-right:4px;font-family:var(--font-num);font-weight:900}

.mem[open]>summary::after{transform:rotate(-135deg)}

<script>
/* ============================================================
 * 80分 游戏引擎 —— 纯函数,不碰 DOM。
 * trump = {suit:'S'|'H'|'D'|'C'|null, rank}。suit 为 null 表示无主。
 * ============================================================ */

const RULES = {
  levelStart: 2,
  handSize: 25,
  kittySize: 8,
  // 抠底倍数 = 最后一墩每人出牌数 × 2
  kittyMultiplier: (lastLeadSize)=>2*(lastLeadSize||1),
  offsuitRankTractor: true,     // 主AA+副常主对可连(常驻)
  strictTractorFollow: true,    // 领出拖拉机、手中有同长(或更长可拆)拖拉机必须跟
  partialTractorFollow: true,   // 【可调】领出长拖拉机、手中只有更短拖拉机时必须跟出短的(默认开)
  pointRebelThreshold: 15,      // 【可调】手牌分数 ≤ 此值可完全造反(5的倍数,≤30;0=关闭)
  trumpRebelThreshold: 3,       // 【可调】手牌主牌张数 ≤ 此值也可完全造反(-1=关闭)
  maxRedeal: 3,                 // 同一局最多连续重新发牌次数(防止一直重发)
  /* 速通模式:级数只在 2/5/10/K/A 这几档上走,每局最多前进一档。
   * 一整场从 2 打到 A 正常要十几局,试玩时太长;速通把它压到最多 4 局。
   * 打开时必打关卡自动失效 —— 阶梯本身就是关卡,再叠一层只会更慢。 */
  speedRun: false,
  speedLadder: [2,5,10,13,14],  // 2 / 5 / 10 / K / A
};

const SUITS = ['S','H','D','C'];

function makeDeck(){                      // 两副牌 108 张,id 唯一
  const cards=[]; let id=0;
  for(let copy=0;copy<2;copy++){
    for(const s of SUITS) for(let r=2;r<=14;r++) cards.push({suit:s,rank:r,id:id++});
    cards.push({suit:'X',rank:15,id:id++});   // 小王
    cards.push({suit:'X',rank:16,id:id++});   // 大王
  }
  return cards;
}

function cardPoints(c){ return c.rank===5?5 : (c.rank===10||c.rank===13)?10 : 0; }
function countPoints(cards){ return cards.reduce((a,c)=>a+cardPoints(c),0); }

function rng(seed){ let a=seed>>>0; return function(){ a|=0; a=(a+0x6D2B79F5)|0;
  let t=Math.imul(a^(a>>>15),1|a); t=(t+Math.imul(t^(t>>>7),61|t))^t;
  return ((t^(t>>>14))>>>0)/4294967296; }; }

function shuffle(arr, rand){ const a=arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(rand()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a; }

// 切牌定先:各抽一张按自然大小(无级数,A>K>…>2,王最大;平手按黑桃>红桃>梅花>方块)
function cutForFirst(seed){
  const deck=shuffle(makeDeck(), rng(seed*7+3));
  const cuts=[0,1,2,3].map(s=>deck[s]);
  const sv={S:3,H:2,C:1,D:0,X:4};
  let first=0;
  for(let s=1;s<4;s++){
    const a=cuts[s],b=cuts[first];
    if(a.rank>b.rank||(a.rank===b.rank&&sv[a.suit]>sv[b.suit])) first=s;
  }
  return {cuts, first};
}

// firstTaker 先拿牌,逆时针轮流;前 100 张为手牌,后 8 张为底
function dealRound(seed, firstTaker=0){
  const deck=shuffle(makeDeck(), rng(seed));
  const hands=[[],[],[],[]];
  for(let i=0;i<100;i++) hands[(firstTaker+i)%4].push(deck[i]);
  return {hands, kitty:deck.slice(100), deck};
}

// ---- 主牌与大小序 ----
function effSuit(c, trump){
  if(c.suit==='X' || c.rank===trump.rank) return 'T';
  if(trump.suit && c.suit===trump.suit) return 'T';
  return c.suit;
}

function natOrder(trumpRank){ const r=[]; for(let x=2;x<=14;x++) if(x!==trumpRank) r.push(x); return r; }

// 有主:0..11 主花色散牌,12 副常主,13 正常主,14 小王,15 大王。
// 相邻可连:主A+副常、副常+正常、正常+小王、小王+大王;异花副常同级不连。
// 无主:13 常主(各花色同级),14 小王,15 大王。
function ordIdx(c, trump){
  if(c.rank===16) return 15;
  if(c.rank===15) return 14;
  if(c.rank===trump.rank){
    if(!trump.suit) return 13;
    return c.suit===trump.suit?13:12;
  }
  return natOrder(trump.rank).indexOf(c.rank);
}

// ---- 牌型判定 ----
function pairKey(c){ return c.suit+':'+c.rank; }

function decompose(cards, trump){
  const by={};
  for(const c of cards)(by[pairKey(c)]=by[pairKey(c)]||[]).push(c);
  const pairs=[], singles=[];
  for(const k in by){
    const arr=by[k];
    if(arr.length>=2) pairs.push([arr[0],arr[1]]);
    if(arr.length%2===1) singles.push(arr[arr.length-1]);
  }
  pairs.sort((a,b)=>ordIdx(a[0],trump)-ordIdx(b[0],trump));
  const comps=[]; let run=[];
  const flush=()=>{
    if(!run.length) return;
    if(run.length>=2) comps.push({type:'tractor',len:run.length,cards:run.flat(),
                                  top:ordIdx(run[run.length-1][0],trump)});
    else comps.push({type:'pair',cards:run[0],top:ordIdx(run[0][0],trump)});
    run=[];
  };
  /* 同一个 ordIdx 可能有不止一对 —— 三门副级牌对全是同一个序号,无主局的四门级数牌对
   * 也是。它们对成链是**可替换**的,所以不能一趟扫:遇到同序号当场断链的话,
   * **手上多出一对同序号的对子反而会把本来连得上的链切短**。主♠打2、手上
   * ♠A♠A(11)+♥2♥2(12)+♦2♦2(12)+♠2♠2(13),一趟扫切成两个二连对,而 11→12→13
   * 本该是一个三连对。
   * 改成分层:同序号的第 1 对算第 0 层、第 2 对第 1 层……,一层一层地扫,
   * 层内 ordIdx 严格递增,最长的链必然落在第 0 层。
   * 只有一层时(绝大多数手牌)这一段和原来的一趟扫**逐字等价**。 */
  const layer=[];
  for(let i=0;i<pairs.length;i++)
    layer.push(i && ordIdx(pairs[i-1][0],trump)===ordIdx(pairs[i][0],trump) ? layer[i-1]+1 : 0);
  const nLayer=layer.length ? Math.max(...layer)+1 : 0;
  for(let L=0;L<nLayer;L++){
    for(let i=0;i<pairs.length;i++){
      if(layer[i]!==L) continue;
      const p=pairs[i];
      if(run.length && ordIdx(p[0],trump)===ordIdx(run[run.length-1][0],trump)+1) run.push(p);
      else { flush(); run=[p]; }
    }
    flush();
  }
  for(const s of singles) comps.push({type:'single',cards:[s],top:ordIdx(s,trump)});
  return comps;
}

function classify(cards, trump){
  if(!cards||!cards.length) return null;
  const es=effSuit(cards[0],trump);
  if(!cards.every(c=>effSuit(c,trump)===es)) return null;
  if(cards.length===1) return {type:'single',suit:es,top:ordIdx(cards[0],trump),cards};
  const comps=decompose(cards,trump);
  if(comps.length===1){ const c=comps[0]; return {type:c.type,len:c.len,suit:es,top:c.top,cards}; }
  return {type:'throw',suit:es,cards,comps,top:Math.max(...comps.map(c=>c.top))};
}

// ---- 跟牌合法性(门内有对必对) ----
function countPairsIn(cards){
  const by={}; for(const c of cards) by[pairKey(c)]=(by[pairKey(c)]||0)+1;
  return Object.values(by).reduce((a,n)=>a+Math.floor(n/2),0);
}
function maxTractorLen(cards, trump){
  return Math.max(0,...decompose(cards,trump).filter(c=>c.type==='tractor').map(c=>c.len));
}
function pairsInLead(lead){
  if(lead.type==='pair') return 1;
  if(lead.type==='tractor') return lead.len;
  if(lead.type==='throw') return lead.comps.reduce((a,c)=>a+(c.type==='pair'?1:c.type==='tractor'?c.len:0),0);
  return 0;
}

function isLegalFollow(hand, lead, chosen, trump){
  const n=lead.cards.length;
  if(chosen.length!==n) return false;
  const ids=new Set(hand.map(c=>c.id));
  const seen=new Set();
  for(const c of chosen){ if(!ids.has(c.id)||seen.has(c.id)) return false; seen.add(c.id); }
  const suitInHand=hand.filter(c=>effSuit(c,trump)===lead.suit);
  const chosenInSuit=chosen.filter(c=>effSuit(c,trump)===lead.suit);
  if(chosenInSuit.length!==Math.min(n,suitInHand.length)) return false;
  const need=pairsInLead(lead);
  if(need>0){
    const must=Math.min(need,countPairsIn(suitInHand));
    if(countPairsIn(chosenInSuit)<must) return false;
  }
  if(RULES.strictTractorFollow && lead.type==='tractor'){
    const m=maxTractorLen(suitInHand,trump);
    const cm=maxTractorLen(chosenInSuit,trump);
    if(m>=lead.len && cm<lead.len) return false;                    // 有长必跟(可拆子拖拉机)
    if(RULES.partialTractorFollow && m>=2 && m<lead.len && cm<m) return false; // 【可调】短拖也必须跟
  }
  return true;
}

// ---- 一墩胜负 ----
function structSig(comps){ return comps.map(c=>c.type+(c.len||'')).sort().join(','); }
/* 候选这一手够不够格和领出比大小 —— 「结构对得上」的准确含义。
 *
 * 口径:候选的组件可以**拆**,不能**并**。拖拉机拆得成对子和单张、对子拆得成两张单;
 * 反过来两张单并不成一对、两个不相连的对子并不成拖拉机。于是:
 *   · 一对主 盖得住「两张单」的甩牌 —— 毙掉撒牌最常见的形态就是这个
 *   · 一副主拖拉机 盖得住「两个不相连的对子」
 *   · 两张单 盖不住一对、两个不相连的对子 盖不住拖拉机(和以前一样)
 *
 * 旧版要求组件构成**逐字相同**(structSig 相等),于是主 ♥8♥8 去毙 ♦Q+♦J 的撒牌时,
 * 这一手在 resolveTrick 里被整个跳过,撒牌方反而收了这一墩。
 * 而 checkThrow 那一侧的 canBeatComp 早就认「拖拉机压对子」—— 一副引擎里两套口径。
 *
 * 实现:只需要把领出里的**连对段**(对子算 1 段、长度 L 的拖拉机算 L 段)装进候选的
 * 连对段里,一段装得下几对就是它的容量;单张不用管,装完之后剩的牌必然正好够。
 * 段数是个位数,直接回溯。 */
function structMatches(cand, lead){
  if(cand.cards.length!==lead.cards.length) return false;
  const runs=x=>(x.type==='throw'?x.comps:[x])
    .filter(c=>c.type!=='single').map(c=>c.type==='tractor'?c.len:1).sort((a,b)=>b-a);
  const need=runs(lead), cap=runs(cand);
  const fit=(i)=>{
    if(i===need.length) return true;
    for(let j=0;j<cap.length;j++){
      if(cap[j]<need[i]) continue;
      cap[j]-=need[i];
      if(fit(i+1)) return true;
      cap[j]+=need[i];
    }
    return false;
  };
  return fit(0);
}

function resolveTrick(plays, trump){
  const lead=classify(plays[0].cards,trump);
  let winIdx=0, best=lead;
  for(let i=1;i<plays.length;i++){
    const cl=classify(plays[i].cards,trump);
    if(!cl || !structMatches(cl,lead)) continue;
    if(cl.suit===best.suit){ if(cl.top>best.top){winIdx=i;best=cl;} }
    else if(cl.suit==='T'){ winIdx=i; best=cl; }
  }
  return {winner:plays[winIdx].seat,
          points:countPoints(plays.flatMap(p=>p.cards)),
          winningPlay:best};
}

// ---- 甩牌校验(失败仅强制出小,不罚分) ----
function canBeatComp(suitCards, comp, trump){
  if(comp.type==='single') return suitCards.some(c=>ordIdx(c,trump)>comp.top);
  const comps=decompose(suitCards,trump);
  if(comp.type==='pair')
    return comps.some(c=>(c.type==='pair'||c.type==='tractor')&&c.top>comp.top);
  return comps.some(c=>c.type==='tractor'&&c.len>=comp.len&&c.top>comp.top);
}
function checkThrow(hands, seat, cards, trump){
  const lead=classify(cards,trump);
  if(!lead||lead.type!=='throw') return {ok:true};
  /* 先把**被压住的**组件全找出来,不是找到一个就收工 —— 罚出哪一组只在这些里面挑。 */
  const beaten=lead.comps.filter(comp=>{
    for(let p=0;p<4;p++){
      if(p===seat) continue;
      const sc=hands[p].filter(c=>effSuit(c,trump)===lead.suit);
      if(canBeatComp(sc,comp,trump)) return true;
    }
    return false;
  });
  if(!beaten.length) return {ok:true};
  /* 罚出**被压住的那些里最小的一组**:先比张数(单张 < 对子 < 拖拉机),张数相同再比 top。
   *
   * 两处都曾经写错(v0.7.16 一起改口):
   *   ① 挑选范围是「被压住的」,不是全部组件。甩 ♥3♥3 + ♥A、别家 ♥K♥K —— ♥A 是这门
   *      最大的,没人压得住,被压的只有 ♥3♥3,那就出 ♥3♥3,不能因为「♥A 张数少」去出 ♥A。
   *   ② 在这个范围里「最小」先比张数。甩 ♠4♠4 + ♠9、别家 ♠5♠5 + ♠K 两组都被压,
   *      出 ♠9;旧写法只比 top 会出 ♠4♠4 —— 一对比一张单贵得多,「罚」反而罚重了,
   *      还把一对拆散。
   * 两个例子单看任何一个都分不出这两条,合起来才定得下来。 */
  const size=c=>c.cards.length;
  const lowest=beaten.reduce((a,c)=>
    size(c)!==size(a) ? (size(c)<size(a)?c:a) : (c.top<a.top?c:a));
  return {ok:false, forced:lowest.cards};
}

// ---- 亮主/反主/造反/加固 ----
// strength: 1=单张常主,2=一对常主,3=小王对,4=大王对(王对→无主)。
function declarationOf(cards, trumpRank){
  if(cards.length===1 && cards[0].rank===trumpRank) return {suit:cards[0].suit,strength:1};
  if(cards.length===2 && pairKey(cards[0])===pairKey(cards[1])){
    if(cards[0].rank===trumpRank) return {suit:cards[0].suit,strength:2};
    if(cards[0].rank===15) return {suit:null,strength:3};
    if(cards[0].rank===16) return {suit:null,strength:4};
  }
  return null;
}
// 反主:强度必须更高。**同一个人不能反自己** —— 他想加强只有「加固」这一条路
// (同花色单张→一对,见 canReinforce2);改花色、或用王对把自己的主反成无将,
// 都不是加固而是自己打乱自己。旧版这里只比 strength、不看座位,而 aiDeclDecide
// 拿它当唯一的合法性闸门,于是 AI 真的会反自己(实测:自己亮♠单张后,
// 改亮♥对 / 小王对 / 大王对三种都返回 true),对应的惩罚却只有 −9 分,压不住无将的抢摊红利。
function canOverride(cur, next, seat){
  if(!cur) return true;
  if(next.strength<=cur.strength) return false;
  if(seat!==undefined && cur.seat===seat) return false;
  return true;
}
// 有对并非必亮对 —— 亮单与亮对是两个不同的选择,都要交给打分:
//   亮单:不暴露这一对,更容易被别家一对常主反掉,但保留了「加固」这条后路;
//   亮对:除大小王对外无人能反,但把一对牌明明白白摊给对手看。
// 实战里,对该门作主信心不足却想试一手、或扰乱对手的动机大过手牌本身好坏时,会选亮单。
function declOptions(hand, trumpRank){
  const opts=[];
  for(const s of SUITS){
    const n=hand.filter(c=>c.suit===s&&c.rank===trumpRank).length;
    if(n>=2){ opts.push({suit:s,strength:2}); opts.push({suit:s,strength:1,hasPair:true}); }
    else if(n===1) opts.push({suit:s,strength:1});
  }
  return opts.sort((a,b)=>b.strength-a.strength);
}
function jokerPairOf(hand){
  const bj=hand.filter(c=>c.rank===16).length, sj=hand.filter(c=>c.rank===15).length;
  if(bj>=2) return {suit:null,strength:4};
  if(sj>=2) return {suit:null,strength:3};
  return null;
}
// 定主后谁坐庄。庄定盘:庄家恒不变 —— 亮主/反主/王对造反都只改主色,不易庄不拿底;
// 无庄盘(首局、或完全造反后的抢庄盘):最终亮主者坐庄,无人亮主则先拿牌者坐庄。
function dealerAfterDecl({dealerKnown, dealer, declSeat, firstTaker}){
  if(dealerKnown) return dealer;
  return declSeat>=0?declSeat:firstTaker;
}

// 加固:仅亮主者本人、单张→一对、且必须先于任何造反(王对/低分造反)
function canReinforce2(decl, seat, hand, trumpRank, rebelHappened){
  if(!decl||decl.seat!==seat||decl.strength!==1||rebelHappened||decl.suit===null) return false;
  return hand.filter(c=>c.suit===decl.suit&&c.rank===trumpRank).length>=2;
}

// 完全造反资格:手牌分数 ≤ pointRebelThreshold,或主牌张数 ≤ trumpRebelThreshold
function canFullRebel(hand, trump){
  const p=RULES.pointRebelThreshold, t=RULES.trumpRebelThreshold;
  const pts=countPoints(hand);
  const nT=hand.filter(c=>effSuit(c,trump)==='T').length;
  const byPts=p>0&&pts<=p, byTrump=t>=0&&nT<=t;
  return {ok:byPts||byTrump, pts, nT, byPts, byTrump};
}

// ---- 本局结算 ----
function scoreRound({defPoints, kitty, defWonLastTrick, lastLeadSize}){
  const kittyPts=countPoints(kitty);
  const mult=RULES.kittyMultiplier(lastLeadSize);
  const total=defPoints + (defWonLastTrick ? kittyPts*mult : 0);
  if(total<80){
    return {defendersWin:false, total, kittyPts, mult, declarerLevelsUp: total===0?3 : total<40?2 : 1};
  }
  return {defendersWin:true, total, kittyPts, mult, defenderLevelsUp: Math.floor((total-80)/40)};
}

// ---- 整场推进:升级与庄家轮换 ----
// 庄家方守住 → 升级、前庄对家连庄;闲家上台 → 闲家升级、前庄下家坐庄。
// 任一队级数打过 A(>14)整场获胜。
// 必打关卡有两层,旧版只做了第一层:
//   1) **不可跳级**:升级途中跨过关卡就停在关卡上(打3升3级本应到6,5是关卡则停在5)。
//   2) **必须打过**:过这一关的条件是本队在该级**坐庄守住**过(v0.7.1 前只要求坐过庄)。
// 第二层原来是缺的,而且缺得不显眼:旧注释写「落点正好等于关卡不算跳过 ——
// 那本来就要在该级打一局」,这句话对庄家成立、对闲家不成立 ——
// 一局打的是**庄家方**的级数,所以一支队停在 2 上当闲家、上台升一级,
// 是从没打过这一关就过去了(实战报障:闲家本级 2,抢到 150 分直接打 3)。
function clampAtGate(from, to, gates){
  if(!gates||!gates.length||to<=from) return {level:to, gate:null};
  const hit=gates.filter(g=>g>from&&g<to).sort((a,b)=>a-b)[0];
  return hit===undefined?{level:to, gate:null}:{level:hit, gate:hit};
}

/* played[team] = 该队已经**坐庄守住**过的最高级数(没有则 -1)。
 * 传 null / 不传 = 只做第一层(不可跳级),用于旧调用方与消融。
 * 返回值里带上更新后的 played,调用方存回去即可 —— 引擎自己不留状态。
 *
 * v0.7.1:口径从「坐过庄」收紧为「坐庄且守住」。
 * 旧版把「这一局在打这一级」本身当成打过的证据 —— 但坐庄输了是**没打过这一关**,
 * 只是被人从这一级上打下去了。实战报障:关卡 10 上坐庄丢庄,下一次上台却直接过了 10。
 * 收紧之后不会卡死:停在关卡上的一方下一局必坐庄(守住是对家连庄、上台是自己坐庄),
 * 只是可能要在同一级上反复坐几局,直到真正守住。 */
function advanceMatch(levels, declSeat, sc, gates, played){
  const declTeam=declSeat%2;
  const L=levels.slice();
  const pl=played?played.slice():null;
  if(pl&&!sc.defendersWin) pl[declTeam]=Math.max(pl[declTeam],L[declTeam]);
  let dealer, up, team;
  if(!sc.defendersWin){ team=declTeam; up=sc.declarerLevelsUp; dealer=(declSeat+2)%4; }
  else { team=1-declTeam; up=sc.defenderLevelsUp; dealer=(declSeat+1)%4; }
  if(RULES.speedRun){
    // 只在阶梯上走,一局最多一档;在 A 上再赢就是打过 A(>14 → 整场结束)
    const ld=RULES.speedLadder;
    const nx=ld.find(x=>x>L[team]);
    L[team]=up>0?(nx===undefined?L[team]+1:nx):L[team];
    const over=L[0]>14||L[1]>14;
    return {levels:L, dealer, matchOver:over,
            winnerTeam:over?(L[0]>14?0:1):null,
            gateStopped:null, gateHeld:null, played:pl};
  }
  const c=clampAtGate(L[team], L[team]+up, gates);
  let level=c.level, gateStopped=c.gate, gateHeld=null;
  // 停在关卡上、却没在这一级坐庄守住过 → 原地不动。
  if(gates&&gates.length&&pl&&up>0&&gates.includes(L[team])&&pl[team]<L[team]){
    level=L[team]; gateStopped=null; gateHeld=L[team];
  }
  L[team]=level;
  const matchOver=L[0]>14||L[1]>14;
  return {levels:L, dealer, matchOver, winnerTeam:matchOver?(L[0]>14?0:1):null,
          gateStopped,        // 非 null = 跳级被关卡拦下,停在关卡上
          gateHeld,           // 非 null = 卡在这一关上,因为本队还没坐庄守住过这一级
          played:pl};
}

/* ---- 随机合法 AI(M3 换启发式) ---- */
function removeCard(hand,c){ const i=hand.findIndex(x=>x.id===c.id); hand.splice(i,1); }
function pickRandom(arr,k,rand){ return shuffle(arr,rand).slice(0,k); }

function aiLead(hand, trump, rand){
  if(rand()<0.3){
    const bySuit={};
    hand.forEach(c=>{(bySuit[effSuit(c,trump)]=bySuit[effSuit(c,trump)]||[]).push(c);});
    const pairs=[];
    for(const s in bySuit) decompose(bySuit[s],trump).forEach(c=>{
      if(c.type==='pair') pairs.push(c.cards);
      if(c.type==='tractor') for(let i=0;i<c.len;i++) pairs.push(c.cards.slice(i*2,i*2+2));
    });
    if(pairs.length) return pairs[Math.floor(rand()*pairs.length)];
  }
  return [hand[Math.floor(rand()*hand.length)]];
}

function bruteFollow(hand, lead, trump, rand){
  const n=lead.cards.length;
  for(let t=0;t<300;t++){
    const c=pickRandom(hand,n,rand);
    if(isLegalFollow(hand,lead,c,trump)) return c;
  }
  return hand.slice(0,n);
}

function genFollow(hand, lead, trump, rand){
  const n=lead.cards.length;
  const inSuit=hand.filter(c=>effSuit(c,trump)===lead.suit);
  const rest=hand.filter(c=>effSuit(c,trump)!==lead.suit);
  let chosen=[];
  if(inSuit.length<=n){
    chosen=[...inSuit, ...pickRandom(rest,n-inSuit.length,rand)];
  }else{
    const comps=decompose(inSuit,trump);
    if(RULES.strictTractorFollow && lead.type==='tractor'){
      const full=comps.find(c=>c.type==='tractor'&&c.len>=lead.len);
      if(full) chosen=full.cards.slice(0,lead.len*2);
      else if(RULES.partialTractorFollow){
        const part=comps.filter(c=>c.type==='tractor').sort((a,b)=>b.len-a.len)[0];
        if(part) chosen=part.cards.slice();
      }
    }
    const targetPairs=Math.min(pairsInLead(lead),countPairsIn(inSuit));
    if(targetPairs>0){
      const used=new Set(chosen.map(c=>c.id));
      const pairUnits=[];
      comps.forEach(c=>{
        if(c.type==='pair') pairUnits.push(c.cards);
        if(c.type==='tractor') for(let i=0;i<c.len;i++) pairUnits.push(c.cards.slice(i*2,i*2+2));
      });
      let have=Math.floor(chosen.length/2);
      for(const u of pairUnits){
        if(have>=targetPairs||chosen.length+2>n) break;
        if(u.some(c=>used.has(c.id))) continue;
        u.forEach(c=>used.add(c.id));
        chosen.push(...u); have++;
      }
    }
    const used2=new Set(chosen.map(c=>c.id));
    chosen.push(...pickRandom(inSuit.filter(c=>!used2.has(c.id)),n-chosen.length,rand));
  }
  return isLegalFollow(hand,lead,chosen,trump)?chosen:bruteFollow(hand,lead,trump,rand);
}

/* ============================================================
 * v3 公共标尺 —— 三个阶段(亮主/扣底/出牌)共用的基础量。
 * 一切分值都尽量折算成「分」(5/10/K 的那个分),这样期望收益与
 * 机会成本能直接相减,而不是靠一堆不同量纲的魔法数打架。
 * ============================================================ */

const AIP = {                 // v3 可调参数,全部集中在这里便于调参
  voidValue: 68,              // 完全断门的战略价值(折算成分;扫参在 62~100 区间是平的,取低端)
  voidChainCredit: 0.55,      // 靠稳赢牌保住牌权再断门的折价(笔记里的「视为50%」)
  buryTrumpBlock: 400,        // 主牌埋底的硬性阻力
  buryAceBlock: 200,          // 副花色 A 埋底的硬性阻力(见 faceValue;旧版是 +30,会被断门收益压过)
  /* 跟牌侧「他这门有几张」的两条收紧(见 pSurvive 的 kOf)。各自 0 = 退回人均份额。 */
  holdKRange: 1,             // 持有区间(硬上下界)夹一道
  voidCondK: 1,              // 已知断门 → 条件概率抬高他在别门(尤其主门)的密度
  voidCondMax: 2.2,          // 抬高倍数的上限(断三门时 pool 会很小,别让它发散)
  /* 「毙得够高」的候选(见 ruffGuardFollow + oppSpendCeil)。默认开,台面 ≥10 分才考虑。
   *
   * v0.7.1 第一版按「他有没有更大的主」定门槛,实测 −0.92 ±0.15,插桩查明原因:
   * 断门那家主牌密度高,能过门槛的只剩大小王 —— 178 次触发里 85% 打的是王,
   * 而 78% 的墩台面是 0 分。掏一张王去赢一墩空气。
   *
   * v0.7.3 换成「他肯不肯花」(oppSpendCeil):门槛取「他拿得出」与「他肯拿出」的小者。
   * 王的占比 85% → 29%,中间那一档(副级牌 25%、主Q 10%、主A 9%、正级牌 7%)终于出线。
   * 配对四批 2800 副:+0.11±0.12 / +0.14±0.10 / +0.07±0.12 / +0.23±0.10,
   * 合并 **+0.15 ±0.05(t=2.69)**;可避免的被盖毙 118 → 110 次、870 → 765 分;
   * 庄家丢最后一墩 +1.7 个百分点(不设闸时是 +2.8~4.6,所以分的闸还是要留)。 */
  ruffGuard: 1,
  /* 埋分的影子成本:每 1 分底分,额外折算多少「分」的留手负担。
   * 动机是 riskBury 只算直接损失,没算「为守住这笔底分,整局都要留手」。
   * 实测这个杠杆推不动:shadow 0.15/0.3/0.6 三档,平均埋底分只从 11.8 掉到
   * 11.3/11.2/10.7,分数 −0.18±0.12 / −0.13±0.15 / +0.25±0.25 全在噪声里。
   * 默认 0。留着是因为它是上面那个 2×2 的自变量。 */
  buryPtShadow: 0,
  buryLowConf: 2,             // (v0.7.23 测试版默认开)守末墩没信心时每分底分的额外代价(0 = 旧行为),见 aiDiscard
  buryConfLine: 0.75,
  buryConfBand: 0.2,
  /* 队友「压回来」要分清是被本门大牌压的、还是被毙掉的(见 partnerRescueP)。
   * 0 = 退回旧行为(两种情形共用一个 share)。 */
  rescueRuffAware: 1,

  /* ② 钓主里那条「逼对手吐主」的收益。**默认 0 —— v0.6.0 起改由 pTeam 表达。**
   * 领出一张小主,两个对手各跟一张他们最小的主,大主一张不掉 ——
   * 这条收益大半是虚的。实测关掉它之后:小主领出的将牌墩里
   * **队友接走 25.2% → 30.3%**、领出方输掉 54.1% → 52.7%。 */
  tiaoDrawOut: 0,
  /* ② 队友救回来的概率到多少才算「这是一次钓主」。**只影响理由字符串,不影响出牌。**
   * partnerRescueP 的典型值是 share(≈1/3) × leadRescueDamp(0.7) ≈ 0.23,
   * 所以门槛取 0.20;取 0.30 的话教练面板几乎标不出钓主,可行为本身是在调的。 */
  tiaoLabelP: 0.20,

  /* 第 2 波:拆掉两处补丁堆。 */
  leadEV: 1,                  // ④⑥ 非钢板领出走统一期望分口径(0=退回三条手写常数式)
  /* ② v0.6.0:领出侧的牌权概率改问「本队赢不赢得下这墩」。
   * 这是钓主的病根 —— 旧口径把「队友压过去」和「对手压过去」都算成失败。 */
  leadTeamP: 1,               // 0 = 退回旧的 pSurvive 口径
  leadRescueDamp: 0.7,        // 队友「压回来」的折扣(他要压的是对手那张,不是我这张)
  leadShapeBonus: 4,          // ④⑥ 牌型可打性:拖拉机/对子难被跟死,同 p 下更该打。
                              //     这是 p 表达不了的那一小截,不是原来那个 20/16 的基础分
  endNearGamma: 0.5,          // ①③ 护底曲线的幂(1=旧的线性,视野入口几乎不给分)
  /* ①③ 护底封顶 = kp×kittyMult 的几倍(0=不封顶,退回 endKittyWeight 那条式子)。
   *
   * **默认 0 —— 这一条是被实测否掉的,量纲论证输给了数字。**
   *
   * 我原来的理由是量纲:护底 flat 项峰值 133,而它保护的那笔分只有 kp×kittyMult≈27,
   * 「守最后一墩这个期权不可能比它保护的那笔分更值钱」,所以该封在 1.0。
   * 先撞见的是单元测试:收官 4 张、王对+两张输牌、底估 13.7 时,
   * cap 1.0/1.5/2.0 都会把王对领出去(错),2.5 才攥得住 —— 因为钢板领出那一支的
   * 基础分 bossBase 40 + size×8 = 56 本身就是个比真实 stake 还大的**标定常数**。
   * 接着配对对照(800 副,同桌新旧对局,共同种子逐局相减):
   *
   *     cap 2.5 → 净胜 2.67 分/局,庄家丢最后一墩 28.8%
   *     cap 0   → 净胜 3.38 分/局,庄家丢最后一墩 23.5%    配对差 +0.71 ±0.39
   *
   * 也就是 endKittyWeight 上面那句「这个量纲错误的大数值,买到的正是收官阶段那条硬约束」
   * 是对的。真正让护底「提前就存在」的是 endNearGamma 和 endHorizon 前移这两条
   * (见下面的实测表),不是封顶。开关留着:等 bossBase 重标定之后应该一起再试一次。 */
  endKittyCap: 0,
  /* ①③ 边际护底的下限。**同样被实测否掉,默认 0(即旧行为)。**
   * 动机是 reserveMarginal 的 `max(0, p(最好)−p(次好))`:手上有大王(0.95)+小王对(0.90)时
   * 这个系数只有 0.05,护底几乎归零 —— 「牌越好护底越弱」。加了下限之后配对差 −0.47 ±0.48,
   * 方向为负。开关留着:那个局面确实存在,但补法不对 ——
   * 下限是个常数,而真正该算的是「两手护底被同时耗光」的联合概率。 */
  reserveFloor: 0,

  /* ========== v0.6.0:最后一墩的口径 ========== */
  kittyMultDyn: 1,            // 抠底倍数按 reserveUnit 的张数估,不再是常数 2(0=退回常数)
  kittyMultMaxSize: 3,        // 估计时最多按几张算(拖拉机 ×8 已经很极端,别外推更远)
  ladderKitty: 1,             // 阶梯目标的「当前总分」含那笔待翻倍的底分(0=退回旧行为)
  guardPw: 1,                 // 护底项也过 pointWeight,与当墩 ev 用同一把尺子(0=退回旧行为)

  /* ========== v0.7.11:多张垫/贴的取牌口径 ========== */
  discardGreedy: 1,           // 跟对子/拖拉机要垫多张时逐张贪心,每取一张重算排序键
                              // (0=退回旧的「一次排序取前 k 张」,即拆对子、两门各丢一张、
                              //  同点不同花被成对取走那版行为;见 fillPick 的注释)
};

// 全局牌力序:主牌恒高于任何副牌。
// 修的是「无分墩最后一手拿低将牌当废牌垫掉」——根因是 ordIdx 在各门内
// 独立编号,主花色的 3 和副花色的 3 数值相近,排序时被当成等价废牌。
function globalIdx(c, trump){ return effSuit(c,trump)==='T' ? 100+ordIdx(c,trump) : ordIdx(c,trump); }

// 中间平缓、两头陡峭、单调递增,g(0)=0 g(0.5)=0.5 g(1)=1。
// 笔记里无将折扣要的就是这条曲线:将牌从 0→3 张和从 7→10 张时收益变化剧烈,
// 中间区间(4~6 张)则钝感。
function easeEnds(t){ t=Math.max(0,Math.min(1,t)); return 0.5-Math.asin(1-2*t)/Math.PI; }
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));

// 某门(副花色)里我手上从最大往下能连着「稳赢」的张数。
// 有 A 则 A 稳赢;A 出完 K 变最大,于是 K 也算进链条,以此类推。
// 这条链决定了「牌权易手之前我还能撒掉几张」。
function bossChain(suitCards, trump, mem){
  const sorted=suitCards.slice().sort((a,b)=>ordIdx(b,trump)-ordIdx(a,trump));
  const held={};
  sorted.forEach(c=>{ held[pairKey(c)]=(held[pairKey(c)]||0)+1; });
  // 在外(别家手里)比我某张牌更大的牌,若已被我全部持有则该牌仍是稳赢
  let n=0;
  for(const c of sorted){
    const idx=ordIdx(c,trump);
    let bigger=0;
    for(const k in mem.unseen){
      if(mem.unseen[k]<=0) continue;
      const u=keyToCard(k);
      if(effSuit(u,trump)!==effSuit(c,trump)) continue;
      if(ordIdx(u,trump)>idx) bigger+=mem.unseen[k];
    }
    if(bigger>0) break;
    n++;
  }
  return n;
}

// 庄家方赢下最后一墩的概率(决定分牌该不该扣底)。
// 主要看主牌厚度与是否握有大怪 —— 能压到最后的才敢把分埋进底。
/* pLastFit(2026-10-24):pWinLastTrick 的校准小模型(test/fit-plast.js,自对弈 2000 副)。
 * 旧式在主少的时候偏乐观:8~9 张主估 55% 实 45%;真人牌谱更甚(AI 做庄 11 局估 73% 实 36% —— 真人把王留到最后)。
 * 特征 [1, logit(旧估计), 主张数/10, 大王, 小王, 主级牌, 副级牌, 主对子, 断门数, 无主]。只用在 aiDiscard。 */
function pLastModel(hand, trump){
  const p0=pWinLastTrick(hand,trump), w=AIP.pLastW;
  const tr=hand.filter(c=>effSuit(c,trump)==='T');
  const keys={}; tr.forEach(c=>{const k=c.suit+c.rank; keys[k]=(keys[k]||0)+1;});
  const sides=['S','H','D','C'].filter(su=>su!==trump.suit);
  const f=[1,Math.log(p0/(1-p0)),tr.length/10,hand.filter(c=>c.rank===16).length,hand.filter(c=>c.rank===15).length,
    hand.filter(c=>trump.suit&&c.suit===trump.suit&&c.rank===trump.rank).length,
    hand.filter(c=>c.rank===trump.rank&&c.suit!==trump.suit&&c.suit!=='X').length,
    Object.values(keys).filter(v=>v>=2).length,
    sides.filter(su=>!hand.some(c=>effSuit(c,trump)===su)).length, trump.suit?0:1];
  let z=0; for(let i=0;i<w.length;i++) z+=w[i]*f[i];
  return clamp(1/(1+Math.exp(-z)),0.05,0.95);
}
function pWinLastTrick(hand, trump){
  const nT=hand.filter(c=>effSuit(c,trump)==='T').length;
  const bj=hand.filter(c=>c.rank===16).length, sj=hand.filter(c=>c.rank===15).length;
  const avg=trump.suit?9:3;                       // 无将时主牌总数只有12张
  let p=easeEnds(clamp(nT/(avg*2),0,1));          // 主牌厚度
  p+=bj>=2?0.22:bj?0.10:0;                        // 大王对≈锁死最后一墩
  p+=sj>=2?0.10:sj?0.04:0;
  return clamp(p,0.05,0.95);
}

/* ============================================================
 * 阶段二:扣底适合度评分(v3)
 *
 *   Bury(c) = −Face(c) + Void(c) + PointΔ(c)
 *
 * Face  牌面价值(留着能赢墩拿分的能力),越大越不该埋
 * Void  该牌对「牌权易手前断门」的边际贡献 × 无将折扣
 * PointΔ 分牌专用:持有丢分风险 − 扣底丢分风险(正=埋更划算)
 *
 * 断门是集合性质(埋掉一门的最后一张才算断),所以不是一次性排序,
 * 而是贪心逐张选:每选一张就重算剩余各门的断门增益。
 * ============================================================ */

// 牌面价值:留在手里能赢墩/拿分的能力
function faceValue(c, groups, trump){
  const s=effSuit(c,trump);
  if(s==='T') return AIP.buryTrumpBlock+ordIdx(c,trump)*6;   // 绝不埋主
  const g=groups[s]||[];
  const same=g.filter(x=>pairKey(x)===pairKey(c)).length;
  let v=ordIdx(c,trump)*2.2;
  if(same>=2) v+=18;                                  // 别拆对
  /* 副花色 A:硬性阻力,不是「+30 分再和断门收益比大小」。
   * 实战反馈 + 实测:旧版在手握副 A 的局里有 19.3% 把它埋了。
   * 判据很简单 —— A 赢不下一墩,只可能是有人在这门断门并毙掉它;
   * 开局各家 25 张、一门 12~13 张,天然断门的概率很低,
   * 也就是说这张 A 赢一墩几乎是确定的,而底里埋一张牌换来的是「可能」造出一个断门。
   * 拿一个确定的墩去换一个可能的断门,不划算 —— 没有人扣 A。 */
  if(c.rank===14) v+=AIP.buryAceBlock;
  else if(c.rank===13){
    v+=14;
    if(g.some(x=>x.rank===14)) v+=10;                 // 手握 A 时 K 是撒牌的第二张
  }
  return v;
}

// 埋掉 suit 门的第 k 张之后,该门的断门概率
function voidProb(remaining, chain){
  if(remaining<=0) return 1;
  if(remaining<=chain) return AIP.voidChainCredit;     // 靠稳赢牌撒完再断
  return 0;
}

// 埋底 v3:断门贡献 + 牌面价值 + 分牌丢分风险对比 + 无将折扣 + 必打关卡
function aiDiscard(hand, trump, opt){
  opt=opt||{};
  const n=RULES.kittySize;
  const mem=opt.mem||makeMemory({hand,history:[],buriedKnown:[]});
  const nT=hand.filter(c=>effSuit(c,trump)==='T').length;
  // 无将/少主时断门价值大打折扣:毙牌选择少,断门换不来多少墩。
  // 分母是「再多的主牌也换不来更多毙牌机会」的饱和点,取人均主牌数的约 1.35 倍:
  //   有主局主牌 36 张、人均 9  → 饱和在 12
  //   无将局主牌总共 12 张、人均 3 → 饱和在 5(单家不可能到 12,那是全场总数)
  const nTsat=trump.suit?AIP.ruffSatTrump:AIP.ruffSatNT;
  const voidDiscount=easeEnds(clamp(nT/nTsat,0,1));
  const pLast=AIP.pLastFit?pLastModel(hand,trump):pWinLastTrick(hand,trump);
  const gateDamp=opt.gateAhead?AIP.gateDamp:1;        // 对手面临必打关卡 → 损失封顶

  const rest=hand.slice();
  const picked=[];
  for(let step=0;step<n;step++){
    const groups={};
    rest.forEach(c=>{const s=effSuit(c,trump);(groups[s]=groups[s]||[]).push(c);});
    const nSide=rest.filter(c=>effSuit(c,trump)!=='T').length;
    const remain=n-step;                                // 连这一张在内还要埋几张
    const chains={}, share={};
    for(const s in groups){
      if(s==='T'){ chains[s]=0; share[s]=0; continue; }
      chains[s]=bossChain(groups[s],trump,mem);
      // 断门是集合性质:整门埋完才兑现。若只在「埋掉最后一张」时给分,
      // 这个台阶对贪心是不可见的 —— 它永远走不到那一步,于是 voidValue 形同虚设。
      // 所以把整门的断门价值**摊到需要埋的那几张上**,让梯度露出来。
      const len=groups[s].length, ch=chains[s];
      if(len<=remain) share[s]=AIP.voidValue*voidDiscount/len;                    // 整门埋掉=天绝
      else if(len-ch>0&&len-ch<=remain)
        share[s]=AIP.voidChainCredit*AIP.voidValue*voidDiscount/(len-ch);         // 埋到只剩稳赢牌
      else share[s]=0;                                                            // 这门这轮断不掉
    }
    let best=null;
    for(const c of rest){
      const s=effSuit(c,trump);
      const gain=s==='T'?0:share[s];
      // 分牌:比较「持有丢分」与「扣底丢分」两种风险
      let ptDelta=0;
      const pts=cardPoints(c);
      if(pts){
        // 「门长于平均」要按**埋完之后**的手牌算,不是按现在这 33 张:
        //   门长 —— 扣掉这门还会被埋走的那一份;
        //   基准 —— 埋完剩 25 张,其中 nT 张是主,副牌人均门长 = (25−nT)/3。
        const willBury=nSide>0?remain*((groups[s]||[]).length/nSide):0;
        const lenFinal=Math.max(0,(groups[s]||[]).length-willBury);
        const bench=Math.max(1,(25-nT)/3);
        const pHold=clamp(0.50-0.035*(lenFinal-bench),0.15,0.65);
        const riskHold=pts*pHold;
        /* 底牌翻倍,但只在丢掉最后一墩时兑现 —— 这是**直接**损失。
         * v0.7.1 补一项影子成本(buryPtShadow):把分埋进底里,等于给后半局
         * 加了一条「必须守住最后一墩」的约束,整局都要为它留手。
         * 这笔钱以前没人付:pLast 被当成外生给定的,其实它是被这个决定买下来的。
         * ruffGuard 那次实验第一次量到了它 —— 想在中盘花一张大主去躲盖毙,
         * 就得拿丢最后一墩 26.3%→33.7% 去换,净 −0.51/局。 */
        let riskBury=pts*(AIP.kittyMult*(1-pLast)*gateDamp+AIP.buryPtShadow);
        /* buryLowConf(产品方,2026-09-25):「庄家对守住最后一墩没信心时,埋底干脆 0 分」。
         * pWinLastTrick 本身是准的(audit-bury:估 54% 实 51% … 估 93% 实 89%),
         * 但线性的 `分 × 2 ×(1 − p)` 压不过断门收益 —— p 在 0.5~0.7 的局仍平均埋 9~12 分、每局被抠 9~10 分。
         * 信心低于 buryConfLine 时每分再加一笔,越低越重(buryConfBand 内线性爬满)。 */
        if(AIP.buryLowConf) riskBury+=pts*AIP.buryLowConf*clamp((AIP.buryConfLine-pLast)/AIP.buryConfBand,0,1);
        // 扣底阶段还没开打,reserveUnit 无从谈起,这里保持常数 2
        ptDelta=riskHold-riskBury;
      }
      const score=-faceValue(c,groups,trump)+gain+ptDelta;
      if(!best||score>best.score) best={c,score};
    }
    picked.push(best.c);
    rest.splice(rest.findIndex(x=>x.id===best.c.id),1);
  }
  return picked;
}

/* ============================================================
 * 阶段一:亮主/造反评分(v3)
 *
 *   V(opt) = 100·Grab + 60·SuitFit + 25·Level + 20·Dealer
 *          + 30·Rebel + 18·Gate − 12·Reveal
 *   亮 ⇔ V ≥ θ(v),θ 随已见牌数 v 递减(等下去的信息价值在缩水)
 *
 * 每发到一张牌重算一次:v 越大,SuitFit 的外推越可信、观望价值越低。
 * ============================================================ */

// 已见 v 张里有 seen 张符合条件,外推我最终 25 张手牌里的期望张数。
// 用超几何期望而不是线性外推 —— 后者在 v 小时会疯掉(第1张就是主 ⇒ 25张全是主),
// 这条式子天然带收缩:v 小则结果贴近先验均值,v 大则贴近实际观测。
function projectLen(seen, v, total){
  total=total||36;
  if(v<=0) return total*25/108;
  return seen+(25-v)*(total-seen)/(108-v);
}

// 若以 opt 为主,我手上算作主牌的可见张数
function trumpCountUnder(vis, opt, trumpRank){
  return vis.filter(c=>c.suit==='X'||c.rank===trumpRank
                    ||(opt.suit&&c.suit===opt.suit)).length;
}

// 副牌面质量(无将局特别看重):A/K/对子的密度
function sideQuality(vis, opt, trumpRank){
  const side=vis.filter(c=>c.suit!=='X'&&c.rank!==trumpRank&&c.suit!==opt.suit);
  if(!side.length) return 0;
  const cnt={};
  side.forEach(c=>{cnt[pairKey(c)]=(cnt[pairKey(c)]||0)+1;});
  let q=0;
  side.forEach(c=>{ if(c.rank===14) q+=1; else if(c.rank===13) q+=0.6; });
  for(const k in cnt) if(cnt[k]>=2) q+=0.8;
  return clamp(q/(side.length*0.42)-1,-1,1);
}

// D: {vis, seat, trumpRank, curDecl, dealerKnown, dealer, firstTaker, gates, levels}
// 别家凑出一对常主(从而反掉我亮的单张)的粗略概率。
// 某一门的两张级牌都落进同一家 25 张手里 ≈ (25/108)(24/107) ≈ 0.052,两个对手则约 0.104;
// 对「两张都还没见过」的每一门独立累计。
function pPairOverride(vis, trumpRank){
  let f=0;
  for(const s of SUITS){
    const seen=vis.filter(c=>c.suit===s&&c.rank===trumpRank).length;
    if(seen===0) f++;
  }
  return clamp(1-Math.pow(1-0.104,f),0,0.8);
}

/* 手牌契合度那一段单独拆出来(v4)。
 * 它回答的是纯粹的「以这个花色(或无将)为主时,我这手牌有多强」——
 * 不含抢庄红利、暴露代价、谁已亮主这些与主色无关的项。
 * 拆出来是为了给造反做**基线**:造反的正确判据不是「新主够不够好」,
 * 而是「比现在这个主好多少」。v3 从头到尾没有算过现状,于是会出现
 * 「手握长♠、却因为摸到小王对去反无将」这种没有逻辑的行为。
 */
function declHandQuality(D, opt){
  const v=D.vis.length, why=[];
  const iAmDefender=D.dealerKnown&&D.dealer>=0&&D.dealer%2!==D.seat%2;
  let fit;
  if(opt.suit){
    const L=projectLen(trumpCountUnder(D.vis,opt,D.trumpRank),v,36);
    fit=clamp((L-9)/5,-1,1);                        // 有主局主牌总数36张,人均9
    if(fit>0.25) why.push(`预计${L.toFixed(0)}张主`);
  }else{
    // 无将:主牌总共只有 12 张(4王+8级牌)。这时候「期望长度」不是好尺子 ——
    // 关键是这 12 张里**最大的那几张**在不在我手上:握大王对 + 两张级牌(4/12)
    // 和握四张级牌无王(4/12)在张数上完全等价,实战里天差地别。
    // 所以无将的 fit 用**牌力占比**:大王 1.0、小王 0.75、级牌 0.4,除以全场总和归一。
    const reluctance=AIP.ntReluctance*(D.dealerKnown?1:0.3);
    fit=0.6*ntTrumpShare(D.vis,D.trumpRank)*2-0.6
       +0.6*sideQuality(D.vis,opt,D.trumpRank)-reluctance
       +(iAmDefender?AIP.ntDefenderEdge:-AIP.ntDefenderEdge*0.6);
    fit=clamp(fit,-1,1);
    if(fit>0) why.push('无将且大牌集中在我手上');
  }
  let s=60*fit;
  // 级数为 5/10/K:那 8 张级牌本身就是 40 或 80 分。
  //    关键在稀释度 —— 有主局它们被摊薄在 36 张主牌里,谁主花色长谁通吃;
  //    无将局主牌总共 12 张,其中 8 张是分,即「主牌里三分之二是分」,
  //    且常主压死一切副牌,每张≈一墩稳赢外加 5~10 分。
  //    对闲家更是如此:改无将等于拆掉庄家那台长将牌碾压机,把分牌拉回可争夺状态,
  //    庄家没了长主也更难保住最后一墩,抠底对闲家开了口子。所以不减半,反而要加。
  if([5,10,13].includes(D.trumpRank)){
    let lv=opt.suit?1:1.35;
    if(!opt.suit&&iAmDefender) lv+=0.35;
    s+=AIP.ptLevelBonus*lv; why.push(opt.suit?'级数带分':'无将局主牌里大半是分');
  }
  return {q:s, fit, why};
}

// 无将局那 12 张主牌里,我手上占了多少「牌力」(而不是多少张)
function ntTrumpShare(vis, trumpRank){
  const w=c=>c.rank===16?1.0:c.rank===15?0.75:c.rank===trumpRank?0.4:0;
  const total=2*1.0+2*0.75+8*0.4;                 // 全场:2大王 + 2小王 + 8张级牌
  return clamp(vis.reduce((a,c)=>a+w(c),0)/total,0,1);
}

function scoreDeclOption(D, opt){
  const v=D.vis.length;
  const iAmDefender=D.dealerKnown&&D.dealer>=0&&D.dealer%2!==D.seat%2;
  const hq=declHandQuality(D,opt);
  const fit=hq.fit, why=hq.why.slice();
  let s=hq.q;
  // 1. 无庄开局:亮主=坐庄=拿底8张(外加自己定主色),抢摊抢反是默认策略。
  //    无将的红利略低一档 —— 无庄盘坐庄的价值有一半来自长将牌压场,
  //    而无将局主牌总共才 12 张,谁也压不了场。但红利仍在,不该被排除。
  /* v0.5.8 ⑤:**庄位已经在本队手上时,这份红利已经到手了,不能再算一遍。**
   *
   * 「打2 造反自己对门」的根因就在这一行。无庄盘里最终亮主者坐庄拿底,
   * 而 grabBonus(85)只加在候选上、不进 base(base 只取 declHandQuality),
   * 于是从**自己队友**手里把庄抢过来,账面上白赚 85 分;
   * 「队友已亮」的罚分只有 −30,无庄盘门槛又只有 10−10·prog(+12)≈12~22。
   *
   * 实测(♠2♠2 + 长♠,队友已亮 ♦):
   *   无庄开局、队友已亮 → 增量 +91.7 / 门槛 17.2 → 造反自己对门
   *   同一手牌、庄已定   → 增量  −7.3 / 门槛 35.4 → 正确地不动
   * 而且 base 用的是**我自己**在队友主色下的契合度,队友主色我越短基线越负、
   * 增量越大 —— AI 恰好在「队友有长门而我没有」时最想反队友,正好反了。
   *
   * 队友已亮时只保留 grabPartnerKeep 这一小截:同队之内谁坐庄确实有差别
   * (我手更适合坐庄时值一点),但那是个位数,不是 85。grabPartnerKeep=1 退回旧行为。 */
  if(!D.dealerKnown){
    const partnerHasIt=D.curDecl&&D.curDecl.seat%2===D.seat%2&&D.curDecl.seat!==D.seat;
    const raw=opt.suit?AIP.grabBonus:AIP.grabBonusNT;
    s+=partnerHasIt?raw*AIP.grabPartnerKeep:raw;
    why.push(partnerHasIt?'庄位已在本队':'无庄抢摊');
  }
  // 2~3. 手牌契合度 + 级数,已在 declHandQuality 里算好(拆出去是为了给造反做基线)
  // 4. 庄家归属
  if(D.dealerKnown){
    if(D.dealer===D.seat) s+=20*0.5;
    else if(D.dealer%2===D.seat%2){                 // 队友坐庄:让他先亮,除非我这门极强
      if(fit<0.6){ s+=20*(-0.7); why.push('队友坐庄,先观望'); }
    }else{ s+=20*0.3; why.push('对手坐庄'); }
  }
  // 5. 谁已亮主(只影响造反)
  if(D.curDecl){
    const prog=v/25;
    if(D.curDecl.seat===D.seat) s+=30*(-0.3);
