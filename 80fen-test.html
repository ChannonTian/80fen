function dealTick(){
  if(G.phase!=='dealing') return;
  if(G.dealt>=100){ G.phase='finalDecl'; render();
    saveCheckpoint();
    startDeclCountdown();
    if(G.auto) window.__skipDecl();      // 托管:AI 已在发牌中决定过了,不必再等倒计时
    return; }
  const seat=(G.firstTaker+G.dealt)%4;
  G.visCount[seat]++; G.dealt++;
  if(seat!==HUMAN||G.auto) aiDeclThink(seat);   // 托管:你这一家的抢亮/加固也交给 AI
  if(G.dealt%4===0||G.dealt>=100) render();
  setTimeout(dealTick,120);   // 100张 × 120ms ≈ 12秒发完
}

// AI 抢亮决策(基于已见手牌)—— 打分与门槛在 AI 层的 aiDeclDecide,这里只负责取上下文与执行
function aiDeclThink(seat){
  const vis=visHand(seat);
  const rand=rng(G.seed*13+G.dealt);
  const ctx={
    vis, seat, trumpRank:rankOf(seat), curDecl:G.decl,
    dealerKnown:G.dealerKnown, dealer:M.dealer, firstTaker:G.firstTaker,
    gates:S.gatesOn?S.gates:[], levels:M.levels,
  };
  // 加固:当初亮单张是「信心不足先试一手」,现在牌拿多了信心是否已经够把它锁死?
  // 用同一把尺子比较「亮对」与「维持单张」的分差,而不是一律加固。
  if(canReinforce2(G.decl,seat,vis,rankOf(seat),G.rebelHappened)){
    const asPair=eng(seat).scoreDeclOption(ctx,{suit:G.decl.suit,strength:2}).score;
    const asSingle=eng(seat).scoreDeclOption(ctx,{suit:G.decl.suit,strength:1,hasPair:true}).score;
    if(asPair>asSingle&&rand()<0.9){
      applyDecl(seat,{suit:G.decl.suit,strength:2},true); return;
    }
  }
  const d=eng(seat).aiDeclDecide(ctx);
  if(!d) return;
  // 分数越过门槛越多,越果断;贴着门槛则留一点随机,避免四家行为整齐划一
  const margin=d.score-d.threshold;
  if(margin<0) return;
  if(rand()<Math.min(0.95,0.45+margin/40)) applyDecl(seat,d.opt,false);
}

function applyDecl(seat,opt,isReinforce){
  if(!G.dealerKnown) G.trumpRank=rankOf(seat);   // 无庄盘:主牌级数跟着亮主者走
  G.decl={seat,suit:opt.suit,strength:opt.strength};
  // 叫牌过程进牌谱:at = 当时发到第几张;你这一家的亮主若是托管替你亮的,标 a
  G.declLog.push({seat,suit:opt.suit,strength:opt.strength,at:G.dealt,
                  ...(isReinforce?{re:1}:{}),...(seat===HUMAN&&G.auto?{a:1}:{})});
  // 亮出的级数牌/王对立即在桌上可见
  const vis=visHand(seat);
  G.declCards={seat, cards: opt.suit
    ? vis.filter(c=>c.suit===opt.suit&&c.rank===G.trumpRank).slice(0,opt.strength)
    : vis.filter(c=>c.rank===(opt.strength===4?16:15)).slice(0,2)};
  if(opt.strength>=3) G.rebelHappened=true;
  if(isReinforce) log(`${SEAT_NAME[seat]} ${T('reinforce')}:${SUIT_SYM[opt.suit]} 单张→一对`);
  else if(opt.suit===null) log(`${SEAT_NAME[seat]} ${opt.strength===4?T('bigJoker'):T('smallJoker')}对${T('counter')} → ${T('noTrump')}`);
  else log(`${SEAT_NAME[seat]} ${T('declare')} ${SUIT_SYM[opt.suit]}${opt.strength===2?'(一对)':''}`);
  render();
}

// 发牌结束:定主(庄定盘庄家不变;无庄盘最终亮主者坐庄拿底)
// 「不亮」:放弃剩余等待时间,立刻定主
window.__skipDecl=()=>{
  if(!G||G.phase!=='finalDecl') return;
  clearTimeout(G.declTimer); G.declTimer=null;
  settleTrump();
};

function settleTrump(){
  if(G.phase!=='finalDecl'&&G.phase!=='dealing') return;   // 防「不亮」和到点结算重复触发
  clearTimeout(G.declTimer); G.declTimer=null;
  stopDeclCountdown();
  G.trump={suit:G.decl?G.decl.suit:null,rank:G.trumpRank};
  G.declSeat=dealerAfterDecl({dealerKnown:G.dealerKnown, dealer:M.dealer,
                              declSeat:G.decl?G.decl.seat:-1, firstTaker:G.firstTaker});
  if(G.dealerKnown){
    log(G.decl?`定${T('trump')}:${trumpLabel(G.trump)}(庄家仍是 ${SEAT_NAME[G.declSeat]})`
              :`无人${T('declare')} → ${T('noTrump')},庄家仍是 ${SEAT_NAME[G.declSeat]}`);
  }else{
    log(G.decl?`定${T('trump')}:${trumpLabel(G.trump)},${SEAT_NAME[G.declSeat]} 坐庄`
              :`无人${T('declare')} → ${T('noTrump')},${SEAT_NAME[G.declSeat]} 坐庄`);
  }
  lowRebelPhase();
}

// 低分/少主:按设置决定是关闭、仅重新发牌,还是完全造反(重发 + 双方抢庄)
const rebelName=()=>S.fullRebel==='redeal'?'重新发牌':`完全${T('counter')}(重新发牌,双方抢庄)`;
function lowRebelPhase(){
  if(S.fullRebel==='off'){ afterTrumpSet(); return; }
  if(G.auto){ aiLowRebel(); return; }     // 托管:你这一家也按 AI 的口径决定造不造反
  const my=canFullRebel(G.hands[HUMAN],G.trump);
  if(my.ok){
    G.phase='lowrebel'; render();
    const why=[my.byPts?`仅 ${my.pts} 分(≤${RULES.pointRebelThreshold})`:'',
               my.byTrump?`${T('trump')}仅 ${my.nT} 张(≤${RULES.trumpRebelThreshold})`:'']
              .filter(Boolean).join('、');
    setMsg(`你手牌${why},可${rebelName()}`);
    return;
  }
  aiLowRebel();
}
function humanLowRebel(yes){
  if(yes){ log(`你手牌太弱,${rebelName()}`); doRebel(); }
  else aiLowRebel();
}
function aiLowRebel(){
  const rand=rng(G.seed*17+5);
  for(const s of (G.auto?[1,2,3,HUMAN]:[1,2,3])){      // 托管时你排在最后,不改变三家 AI 原有的先后
    const r=canFullRebel(G.hands[s],G.trump);
    if(r.ok && s%2!==G.declSeat%2 && rand()<0.7){
      log(`${SEAT_NAME[s]} ${r.byPts?'手牌分数不足':T('trump')+'太少'},${rebelName()}`);
      doRebel(); return;
    }
  }
  afterTrumpSet();
}
// 两种模式都重新发牌;完全造反模式下新的一盘按无庄盘处理(各家按自己级数抢庄拿底)
function doRebel(){
  if(redealCount>=RULES.maxRedeal){       // 连续重发太多次就直接开打,免得卡死
    log(`已重新发牌 ${redealCount} 次,本局直接开打`);
    afterTrumpSet(); return;
  }
  redealCount++;
  dropCheckpoint();       // 按规则重发的那副牌没打,不算残局(打完的那局会在 redeals 里记重发了几次)
  scrambleNext=(S.fullRebel==='scramble');
  autoCarry=!!G.auto;
  G.phase='redealing'; render();
  setMsg('重新发牌…');
  setTimeout(newRound,1200);
}

function afterTrumpSet(){
  G.leader=G.declSeat;
  G.hands[G.declSeat].push(...G.kittyOrig);
  if(G.declSeat===HUMAN&&!G.auto){
    G.phase='kitty'; G.selected.clear();
    setMsg(`你是庄家:选 ${RULES.kittySize} 张牌${T('bury')}`); render();
  }else{
    G.buried=eng(G.declSeat).aiDiscard(G.hands[G.declSeat],G.trump);
    G.buried.forEach(c=>removeCard(G.hands[G.declSeat],c));
    G.phase='play'; snapshotHands(); render();
    setMsg(`${SEAT_NAME[G.declSeat]} 是庄家`);
    setTimeout(step,900);
  }
}

function buryKitty(){
  if(G.selected.size!==RULES.kittySize){ setMsg(`需要恰好 ${RULES.kittySize} 张,当前 ${G.selected.size} 张`); return; }
  G.buried=G.hands[HUMAN].filter(c=>G.selected.has(c.id));
  G.hands[HUMAN]=G.hands[HUMAN].filter(c=>!G.selected.has(c.id));
  G.selected.clear(); G.phase='play'; snapshotHands();
  log(`你已${T('bury')}`); render();   // render() 会把"本墩:你 领出,等待出牌…"写进牌桌中心,不用再单独提示
  step();
}

// 开打瞬间存一份四家手牌,供局末复盘回看(局中不给看,免得成了透视)
function snapshotHands(){ G.initialHands=G.hands.map(h=>h.slice());
  G.buryBy=G.declSeat===HUMAN?(G.auto?'a':'h'):null;
  saveCheckpoint(); }   // 你坐庄时,底是你扣的还是托管扣的

// ================= 出牌循环 =================
// step() 可能被重复调用(典型:收墩后排的 setTimeout(step,400) 还没跑,玩家已抢先出牌
// 又走了一次 playCards→step)。若不加约束,同一个座位会被排两次 AI 出牌 —— 那一手就重复出,
// 表现为座位顺序错乱、一墩挤进 5 张、四家手牌张数不等。
// 两道保险:① 排新的 AI 之前先撤掉上一个待执行的;② 回调真正执行时复核局面没被推进过。
function step(){
  /* `endRound` 只置 G.ended,不改 G.phase(结算弹层期间 phase 仍是 play)——
   * 所以光看 phase 挡不住「局已结束还被排上一手」:那时四家手牌全空,
   * aiChooseLead 会在空手牌上取 cards[0] 而炸掉。以前没人撞到,是因为局末最后一手
   * 一定是人点出来的、点完就没有下一次排程了;托管/自动出把那一手也接管之后,
   * 收尾阶段第一次有了「结算之后还有定时器在飞」的可能。 */
  if(G.phase!=='play'||G.ended) return;
  if(G.hands.every(h=>!h.length)) return;
  if(G.trick.length===4){ finishTrick(); return; }
  const seat=(G.leader+G.trick.length)%4;
  clearTimeout(G.aiTimer); G.aiTimer=null;
  // 轮到谁由 render() 里的本墩领出信息 + 名字高亮体现,不再单独提示
  if(seat===HUMAN){ render(); scheduleHumanAuto(); return; }
  render();
  const trickNoAtSchedule=G.trickNo, posAtSchedule=G.trick.length;
  G.aiTimer=setTimeout(()=>{
    G.aiTimer=null;
    // 过期校验:排这一手之后局面若已被推进(换墩/别人先出了/已满),这次回调作废
    if(G.phase!=='play'||G.trickNo!==trickNoAtSchedule||G.trick.length!==posAtSchedule) return;
    if((G.leader+G.trick.length)%4!==seat) return;
    const view=viewFor(seat);
    let cards, reason='';
    if(G.trick.length===0){
      const ch=eng(seat).aiChooseLead(view);
      cards=ch.cards; reason=ch.reason;
      const chk=checkThrow(G.hands,seat,cards,G.trump);
      if(!chk.ok) cards=chk.forced;
    }else{
      const lead=classify(G.trick[0].cards,G.trump);
      const ch=eng(seat).aiChooseFollow(view,G.trick);
      cards=ch.cards; reason=ch.reason;
      if(!isLegalFollow(G.hands[seat],lead,cards,G.trump))
        cards=genFollow(G.hands[seat],lead,G.trump,rng(G.seed+G.trickNo));
    }
    G.lastReasons=G.lastReasons||{}; G.lastReasons[seat]=reason;  // 教练模式(M5)复用
    playCards(seat,cards);
  },aiThinkMs());
}

/* 「这一手你没得选」:手上剩的牌恰好等于本墩要出的张数 —— 领出时是最后一张,
 * 跟牌时是最后一手,全出是唯一的合法选择。需求表里的「最后一墩自动出」说的就是它:
 * 没有选择余地,还要点一次。
 * 兜底:理论上全出必然合法(牌都在这儿了),真判成不合法就交还给人,别自作主张。 */
function forcedHand(){
  const hand=G.hands[HUMAN];
  if(!hand.length) return null;
  if(G.trick.length===0) return hand.length===1?hand.slice():null;
  const lead=classify(G.trick[0].cards,G.trump);
  if(!lead||hand.length!==lead.cards.length) return null;
  return isLegalFollow(hand,lead,hand,G.trump)?hand.slice():null;
}

/* 托管 / 最后一手自动出 —— 轮到你、但这一手不需要你做决定时,替你出掉。
 *
 * 两件事共用一条排程,因为它们的风险是同一个:排下去之后局面可能已经被推进
 * (你抢先点了出牌、上一墩收掉了),回调必须复核。校验与 step() 里排 AI 那一手同一套。
 * 教练:托管的墩**不写 coachNotes** —— 那不是你的选择,记进失误统计等于把 AI 的账
 * 算到你头上(局末复盘那句话也会跟着改口,见 endRound)。所以这里走的是 playCards,
 * 不是 humanPlay:后者才是「你自己出的牌」那条路,失误反馈只挂在那上面。 */
function scheduleHumanAuto(){
  if(!G||G.phase!=='play'||G.ended||G.trick.length>=4) return;
  if((G.leader+G.trick.length)%4!==HUMAN) return;
  const forced=S.autoLast?forcedHand():null;
  if(!G.auto&&!forced) return;
  clearTimeout(G.aiTimer);
  const trickNoAtSchedule=G.trickNo, posAtSchedule=G.trick.length;
  G.aiTimer=setTimeout(()=>{
    G.aiTimer=null;
    if(G.phase!=='play'||G.ended) return;
    if(G.trickNo!==trickNoAtSchedule||G.trick.length!==posAtSchedule) return;
    if((G.leader+G.trick.length)%4!==HUMAN) return;
    if(!G.auto&&!(S.autoLast&&forced)) return;        // 中途被关掉了
    let cards=forced;      // 没得选的那一手直接出,不必再劳烦 AI 算一遍
    if(!cards){
      const view=viewFor(HUMAN);
      if(G.trick.length===0){
        const ch=eng(HUMAN).aiChooseLead(view); cards=ch.cards;
        const chk=checkThrow(G.hands,HUMAN,cards,G.trump);
        if(!chk.ok) cards=chk.forced;
      }else{
        const lead=classify(G.trick[0].cards,G.trump);
        const ch=eng(HUMAN).aiChooseFollow(view,G.trick); cards=ch.cards;
        if(!isLegalFollow(G.hands[HUMAN],lead,cards,G.trump))
          cards=genFollow(G.hands[HUMAN],lead,G.trump,rng(G.seed+G.trickNo));
      }
      G.autoTricks++;                       // 只数「AI 真替你做了选择」的那几墩
    }
    G.selected.clear(); G.hintCards=null;
    playCards(HUMAN,cards,forced?'f':'a');
  }, forced?FORCED_MS:aiThinkMs());
}

/* 托管开关。它不在 S 里(不持久化),也只在出牌阶段有意义 ——
 * 扣底、亮主、低分造反这些「一局只做一次」的决定仍然归你。 */
window.__G=()=>G;      // html 里的 inline onclick 在 IIFE 外面,取不到 G
window.__rankOf=rankOf; // UI 拖牌亮主需使用当前玩家的级数（无庄盘两队可能不同级）
// 新界面(v0.7.43,来自打牌 UI 测试页):悔牌放到操作栏(原来只在设置里)
window.__undo=()=>undoLastPlay();
window.__canUndo=()=>!!S.allowUndo&&!!G&&G.phase==='play'&&!G.ended&&G.undoStack.length>0;
window.__setAuto=on=>{
  if(!G) return;
  G.auto=!!on;
  if(G.auto){ G.selected.clear(); G.hintCards=null; log('托管开始 —— AI 替你出牌'); }
  else if(G.autoTricks||G.phase==='play') log('托管结束');
  render();
  if(G.auto){
    // 托管从哪个阶段打开,就从那个阶段起接手:每个阶段的收尾都是「等你点一下」,得替你点
    if(G.phase==='finalDecl') window.__skipDecl();
    else if(G.phase==='lowrebel') aiLowRebel();
    else if(G.phase==='kitty'){
      G.selected=new Set(eng(HUMAN).aiDiscard(G.hands[HUMAN],G.trump).map(c=>c.id));
      buryKitty();
    }else step();             // 出牌阶段可能正轮到你:立刻把这一手排上
  }
  else scheduleHumanAuto();   // 关掉托管后,「没得选」那条仍然生效
};

function humanPlay(){
  // 不能只靠按钮 disabled 把关 —— 渲染有时差,漏一手就会插到别人的顺位里
  if(G.phase!=='play'||G.trick.length>=4||(G.leader+G.trick.length)%4!==HUMAN) return;
  const sel=G.hands[HUMAN].filter(c=>G.selected.has(c.id));
  if(!sel.length){ setMsg('请先选牌'); return; }
  const meta=humanMeta(sel);
  if(G.trick.length===0){
    const cl=classify(sel,G.trump);
    if(!cl){ setMsg(T('lead')+`必须是同一门(${T('trump')}算一门)`); return; }
    if(cl.type==='throw'){
      // 「这明明是拖拉机,为什么算甩牌」—— 报障过一次(6677),但引擎侧全牌型扫描没能复现。
      // 把判成甩牌的**拆解结果**打进出牌记录,下次再遇到就能直接看出是哪一组没接上。
      const TN={single:'单张',pair:'对子',tractor:'拖拉机'};
      log(`判定为${T('throwP')}:拆成 ${cl.comps.length} 组 —— `+
          cl.comps.map(x=>`${TN[x.type]||x.type}(${x.cards.map(c=>miniName(c)).join('')})`).join(' + ')+
          `。拖拉机要求两组在**当前牌序**里紧邻(级牌已从牌序里抽走,主门里正副级牌与大小王另算一档)`);
      const chk=checkThrow(G.hands,HUMAN,sel,G.trump);
      if(!chk.ok){
        log(`${T('throwP')}失败!被迫只出最小的一组(不罚分)`);
        setMsg(T('throwP')+'失败,只出最小的一组');
        if(C.on) coachSay(G.tricks.length+1,
          `${T('throwP')}没成:你想一次出 ${desc(sel)},但别家有压得住其中一组的牌,`+
          `按规则只出了最小的那一组 <b>${desc(chk.forced)}</b>。<br><span class="dim">`+
          `${T('throwP')}要每一组在别家都压不住才成立 —— 出之前看一眼记牌表里那门「别家还剩」的最大牌。</span>`,'warn');
        G.selected.clear(); recordUndoPoint(); playCards(HUMAN,chk.forced,'h',meta); return;
      }
      log(T('throwP')+'成功');
    }
  }else{
    const lead=classify(G.trick[0].cards,G.trump);
    if(!isLegalFollow(G.hands[HUMAN],lead,sel,G.trump)){
      // 新界面(v0.7.43,来自打牌 UI 测试页):说清楚到底哪一条没满足,而不是把三条规则一起念一遍
      const n=lead.cards.length, sn=lead.suit==='T'?T('trump'):SUIT_NAME[lead.suit];
      const have=G.hands[HUMAN].filter(c=>effSuit(c,G.trump)===lead.suit).length;
      const put=sel.filter(c=>effSuit(c,G.trump)===lead.suit).length;
      setMsg('不合法:'+(sel.length!==n?`这一墩要出 ${n} 张,你选了 ${sel.length} 张`
        :put<Math.min(n,have)?`你手里还有${sn},要先跟${sn}`
        :`${sn}里有对子(或拖拉机)就要先跟对子`));
      return;
    }
  }
  // ---- 教练:失误反馈(同一张候选表上对账,见块① coachEvalFollow) ----
  if(C.on && GAP_THR[C.gapSens]<Infinity && G.phase==='play'){
    const view=viewFor(HUMAN);
    const isLead=G.trick.length===0;
    const ev=isLead?coachEvalLead(view,sel):coachEvalFollow(view,G.trick,sel);
    const best=ev.adv, thr=GAP_THR[C.gapSens];
    const bestSay=coachReason(view,G.trick,{cards:best.cards,reason:best.reason,tier:'best'});
    if(ev.gap>thr){
      const no=G.tricks.length+1;
      /* 跨阶梯线(§7 第一行、场景 H1 仍未修):首选不抢、你抢了、抢下正好过线 ——
       * 这种点上评分器系统性偏保守,你多半是对的。记下来,但不算你的失误。 */
      const youTake=!isLead&&currentWinner(G.trick.concat([{seat:HUMAN,cards:sel}]),G.trump).seat%2===HUMAN%2;
      const doubt=!!(ev.ladder&&youTake);
      G.coachNotes.push({no,my:sel.slice(),best:best.cards.slice(),gap:ev.gap,reason:bestSay,
                         unit:ev.unit,doubt,ladder:ev.ladder});
      if(doubt){
        coachSay(no,`🤔 你出 ${desc(sel)},我会出 <b>${desc(best.cards)}</b> —— ${bestSay}。<br>`+
          `但${ladderLine(ev.ladder)}。「抢不抢过线」正是我已知的短板,<b>这一手存疑,不计入你的失误</b>。`,'doubt');
      }else{
        if(C.strict && ev.gap>thr*1.6 &&
           !confirm(`教练:更好的是 ${desc(best.cards)} —— ${bestSay}\n仍要出这手吗?`)){ G.coachNotes.pop(); return; }
        sndOops();
        coachSay(no,`⚠️ 你出 ${desc(sel)},更好的是 <b>${desc(best.cards)}</b> —— ${bestSay}`+
          `<div class="dim">按我的估算,比建议的那手约亏 ${Math.round(ev.gap)} 分${ev.unit==='eg'?'(收官按推演折算)':''}</div>`,'warn');
      }
      log(`教练(第${no}墩):你出 ${desc(sel)},建议 ${desc(best.cards)} — ${bestSay}${doubt?'(存疑)':''}`);
    }
  }
  G.selected.clear(); G.hintCards=null;
  recordUndoPoint();
  playCards(HUMAN,sel,'h',meta);
}
function humanMeta(sel){
  const m={};
  if(G.hintCards&&G.hintCards.size===sel.length&&sel.every(c=>G.hintCards.has(c.id))) m.hint=1;
  return m;
}

/* 悔牌(设置里开关默认关):与教练撤回(严格模式的出牌前确认)完全独立、不依赖它。
 * v0.7.24 只存了「trick 长度」,下一家一跟就对不上、按钮变灰 —— 实际上你打开设置时
 * AI 早就跟完了,所以等于永远悔不了。改成你每出一手之前给整桌拍一张快照(G 本身,
 * 不含定时器与快照栈),悔牌 = 丢掉之后发生的一切(包括 AI 跟的牌、收的墩)、回到快照。
 * 快照入栈,可以连续悔好几手;一局结束(G.ended)之后不能再悔。 */
function recordUndoPoint(){
  const {undoStack,aiTimer,holdTimer,declTimer,declTick,...rest}=G;
  undoStack.push(structuredClone(rest));
}
function undoLastPlay(){
  if(!G||G.phase!=='play'||G.ended||!G.undoStack.length) return false;
  clearTimeout(G.aiTimer); clearTimeout(G.holdTimer);
  const stack=G.undoStack, snap=stack.pop(), undos=G.undos+1;
  G=Object.assign(snap,{undoStack:stack,aiTimer:null,holdTimer:null,declTimer:null,declTick:null,
                        undos, undoNext:true});    // 悔牌次数要跨过快照记下来,快照里的是旧值
  G.selected=new Set(); G.hintCards=null; G.quiz=null; G.awaitNext=false;
  saveCheckpoint();      // 悔回去可能跨过了收墩,进度里不能留着已经撤掉的墩
  render(); setMsg('已悔回上一手出牌前,重新选牌');
  return true;
}

// ---- 教练:问教练(v0.7.33:先问一道题 → 公布答案 → 给建议) ----
/* v0.7.31 试玩反馈(产品方):
 *   · 「确定的」那段太长:「你先出,任选一门」是废话,甩牌规则没必要每次都写;
 *     各门的最大牌、谁断、还剩几分不要全列 —— 只把和候选相关的写进候选的理由里;
 *   · 不要直接给答案:先问一个和「这一手价值最高的候选」相关、答案是已知事实的问题,可以跳过;
 *     答完或跳过,都先公布这道题的答案,再给建议;
 *   · 「把握低」「差 1 分 / 差 16 分」看不懂 —— 建议单改成「最佳(可并列)+ 也可以」,最多 3 个,按价值排。
 *     「也可以」的门槛就是失误反馈的门槛:列出来的这几手,你出哪一手教练都不会报失误。
 * 题目、答案、候选后面那句事实,数全部来自块① coachFacts(硬演绎,与记牌表同一口径),
 * 不靠 AI 的判断,也不靠大模型。 */
const seatShort=s=>SEAT_NAME[s].replace(/\(.*\)|（.*）/,'').trim();
const SN=s=>s==='T'?T('trump'):SUIT_SYM[s];
const cntOf=arr=>arr.reduce((a,x)=>a+x.n,0);
const cardsLine=(arr,max)=>arr.slice(0,max||99).map(x=>miniName(x.card)+(x.n>1?`×${x.n}`:'')).join('、')+
  (max&&arr.length>max?' 等':'');
const bucketOf=(v,cuts)=>{ const i=cuts.findIndex(c=>v<=c); return i<0?cuts.length:i; };
const topOf=(cs,t)=>cs.reduce((a,b)=>!a||ordIdx(b,t)>ordIdx(a,t)?b:a,null);
function ladderLine(L){
  return L.defender
    ? `这墩抢下来,${T('defenders')}就从 ${L.def} 分到 ${L.reach} 分,过 ${L.line} 线`
    : `这墩放给对手,${T('defenders')}就从 ${L.def} 分到 ${L.reach} 分,过 ${L.line} 线`;
}
// 「东家(第 5 墩没跟♠)」—— 断门是事实,顺手把证据给出来
function voidWho(view,seats,suit){
  return seats.map(s=>{ const k=coachVoidTrick(view.history,s,suit,view.trump);
    return `${seatShort(s)}${k?`(第 ${k} 墩没跟${SN(suit)})`:''}`; }).join('、');
}

/* 候选后面那一句:只说这一手用得上的事实 */
function factText(f){
  const P=[];
  if(f.kind==='lead'){
    const s=SN(f.suit);
    if(f.suit==='T'){
      P.push(`${T('trump')}别家${f.out?`还剩 ${f.out} 张`:'一张都没有了'},你有 ${f.mine} 张`);
      if(f.type==='single'&&f.out) P.push(f.boss?'别家没有比它大的':`别家还有 ${cntOf(f.bigger)} 张比它大`);
      return P.join(',');
    }
    if(!f.out) return `${s}别家一张都没有了`;      // 谁大、谁断都不用再说
    if(f.type==='single'){
      const n=cntOf(f.bigger);
      P.push(f.boss?`别家没有比它大的${s}`:`别家还有 ${n} 张比它大${n<=3?`(${cardsLine(f.bigger)})`:''}`);
    }else if(f.pairAbove){
      // 「♦9两张都在别家」读起来像是在说两张牌 —— 说清楚是「可能有的更大对子」
      P.push(f.boss?`别家没有能压过它的${s}对子`
        :`别家可能有更大的对子:${f.pairAbove.slice(0,3).map(miniName).join('、')}${f.pairAbove.length>3?' 等':''}(各两张都在别家,同在一家才成对)`);
    }
    P.push(`${s}别家还剩 ${f.out} 张`);
    if(f.oppVoid.length) P.push(`${f.oppVoid.map(seatShort).join('、')}已断${s}`);
    if(f.partnerVoid) P.push(`队友已断${s}`);
    if(f.boss===false&&f.outPts) P.push(`这门别家还有 ${f.outPts} 分`);
    return P.join(',');
  }
  const s=SN(f.leadSuit);
  if(f.wins&&f.last) P.push(`你最后出,这墩归你${f.table+f.pts?`(共 ${f.table+f.pts} 分)`:''}`);
  else if(f.ruff){
    P.push(`用${T('trump')}毙下${f.table?`(台面 ${f.table} 分)`:''}`);
    P.push(f.behindOppVoid.length?`但${f.behindOppVoid.map(seatShort).join('、')}也断${s},可能再毙`
                                  :`后面的对手都还没露出断${s}`);
  }else if(f.wins){
    P.push(`先压住${f.table?`(台面 ${f.table} 分)`:''}`);
    if(f.bigger) P.push(cntOf(f.bigger)?`别家还有 ${cntOf(f.bigger)} 张比它大`:`别家没有比它大的${s}`);
    if(f.behindOppVoid.length) P.push(`${f.behindOppVoid.map(seatShort).join('、')}已断${s},可能毙`);
  }else if(f.partnerWinning&&f.last){
    // 你是最后一手:后面没人了,这墩就是队友的 —— 再说「别家还有几张比他大」只会和「稳赢」打架
    P.push('你最后出,这墩归队友');
    P.push(f.pts?`贴 ${f.pts} 分`:'不贴分');
  }else if(f.partnerWinning){
    P.push(!f.partnerBigger?'队友暂大'
      :cntOf(f.partnerBigger)?`队友暂大,别家还有 ${cntOf(f.partnerBigger)} 张比他那张大`:'别家没有比队友那张更大的');
    // 这门里最大 ≠ 稳:后面的对手已经断了这门,照样能毙
    if(f.behindOppVoid.length) P.push(`但${f.behindOppVoid.map(seatShort).join('、')}已断${s},可能毙`);
    P.push(f.pts?`贴 ${f.pts} 分`:'不贴分');
  }else if(f.last){
    // 台面上的分也跟着归对手 —— 只说「不送分」会让人以为这手没代价
    if(f.table){ P.push(`你最后出,这墩连台面 ${f.table} 分归对手`); P.push(f.pts?`你这手再添 ${f.pts} 分`:'你不再添分'); }
    else{ P.push('你最后出,这墩归对手'); P.push(f.pts?`这手带 ${f.pts} 分`:'不送分'); }
  }else{
    let a='对手暂大';
    if(f.beatCard&&f.mineInSuit&&!f.canBeat)
      a+=f.ruffed?`(已被 ${miniName(f.beatCard)} 毙)`:`,你这门压不过 ${miniName(f.beatCard)}`;
    P.push(a);
    P.push(f.pts?`这手带 ${f.pts} 分`:'不送分');
  }
  return P.join(',');
}

// 跟牌时只在「要求不止一句废话」时提一句:领的不是单张、这门不够、或者你断了这门
function obligationNote(view,plays){
  if(!plays.length) return '';
  const t=view.trump, lead=classify(plays[0].cards,t), s=SN(lead.suit);
  const mine=view.hand.filter(c=>effSuit(c,t)===lead.suit).length, n=lead.cards.length;
  const hasTrump=view.hand.some(c=>effSuit(c,t)==='T');
  // 领的是主、或者手里已经没有主:「可以用主毙」就是空话
  if(!mine) return lead.suit==='T'?`你没有${T('trump')}了:垫别门的牌`
    :hasTrump?`你没有${s}:可以用${T('trump')}毙,也可以垫别的`:`你没有${s},也没有${T('trump')}了:只能垫别门的牌`;
  if(mine<n) return `${s}只剩 ${mine} 张,全出,不够的用别门补`;
  // 甩的全是单张就没有「有对必对」这回事
  if(lead.type!=='single') return !pairsInLead(lead)?`要跟 ${n} 张${s}`
    :lead.type==='tractor'?`要跟 ${n} 张${s},有拖拉机跟拖拉机,再有对必对`:`要跟 ${n} 张${s},门内有对必对`;
  return '';
}

// 没得选时说一句为什么(块① coachForced)
const FORCED_WHY={last:'手里就剩这几张',all:'这门只剩这几张,全要跟上',pair:'有对必须出对,你这门只有这一对'};
function suggestHTML(view,plays,J){
  const forced=coachForced(view,plays);
  if(forced) return `<div class="cSec">没得选</div><div>${FORCED_WHY[forced]},只能出 <b>${desc(J.adv.cards)}</b>。</div>`;
  // 「也可以」:与首选相差不到 6 分(且不超过失误门槛),白送对手分的不列 —— 见块① coachOptions
  const opts=coachOptions(view,plays,J,coachOkThr(GAP_THR[C.gapSens]),3);
  const tied=opts.some(o=>o.tier==='tie');
  const tagOf=o=>o.tier==='ok'?'也可以':(tied?'并列最佳':'最佳');
  const ob=obligationNote(view,plays);
  let h=`<div class="cSec">建议</div>`+(ob?`<div class="dim">${ob}</div>`:'');
  h+=opts.map(o=>{
    const names=[o.cards,...o.same].map(desc).join(' 或 ');
    const ft=factText(o.facts);
    return `<div class="opt"><b>${names}</b> <span class="tag ${o.tier==='ok'?'ok':'top'}">${tagOf(o)}</span>`+
      `<div class="dim">${o.say}${ft?`。${ft}`:''}</div></div>`;
  }).join('');
  if(opts.length===1&&J.alts.length) h+=`<div class="dim">其他出法我都不推荐。</div>`;
  if(J.ladder) h+=`<div class="dim" style="margin-top:4px">⚠️ ${ladderLine(J.ladder)}。「抢不抢过线」是我已知的短板,这类局面你的判断可能比我准。</div>`;
  return h;
}

/* 题目:围绕「价值最高的那一手」要看的那个已知事实。没有值得问的就不问,直接给建议。 */
function quizFor(view,plays,o){
  const f=o.facts, t=view.trump, B4=['0','1','2','3+'];
  // 答案是 0 的时候把意思说出来,光说「还有 0 张」等于没说
  const countQ=(q,n,list,zero)=>({q,choices:B4,answer:Math.min(n,3),
    reveal:n?`还有 <b>${n}</b> 张:${cardsLine(list,6)}。`:`<b>一张都没有</b> —— ${zero}。`});
  const suitCountQ=(suit,out,extra)=>({q:`${SN(suit)}别家还剩几张?`,choices:['0–2','3–5','6–9','10+'],
    answer:bucketOf(out,[2,5,9]),reveal:out?`${SN(suit)}别家还剩 <b>${out}</b> 张${extra}。`
      :`${SN(suit)}别家<b>一张都没有了</b> —— 这门领出去,谁都可以拿${T('trump')}毙,也可以垫牌。`});
  const tableQ=()=>{ const pc=plays.flatMap(p=>p.cards).filter(c=>cardPoints(c)>0);
    return {q:'台面上现在一共几分?',choices:['5','10','15','20+'],answer:Math.min(f.table/5-1,3),
      reveal:`台面 <b>${f.table}</b> 分:${pc.map(miniName).join('、')}。`}; };
  if(f.kind==='lead'){
    if(f.suit==='T') return {q:`${T('trump')}别家还剩几张?`,choices:['0–4','5–9','10–15','16+'],answer:bucketOf(f.out,[4,9,15]),
      reveal:f.out?`${T('trump')}别家还剩 <b>${f.out}</b> 张${f.top?`,最大的是 ${miniName(f.top)}`:''};你手里有 ${f.mine} 张。`
        :`${T('trump')}别家<b>一张都没有了</b>;你手里有 ${f.mine} 张。`};
    if(f.type==='single'&&!f.boss) return countQ(`${SN(f.suit)}里,别家还有几张比 ${miniName(o.cards[0])} 大?`,cntOf(f.bigger),f.bigger,'');
    return suitCountQ(f.suit,f.out,
      (f.oppVoid.length?`;${voidWho(view,f.oppVoid,f.suit)}已经断了`:';还没有对手露出断这门')+
      `。剩得越少,越可能有人已经没有这门、拿${T('trump')}来毙`);
  }
  const s=SN(f.leadSuit);
  // 后面的对手有没有确定断这门(副牌墩才有意义:领的是主,断了也只是垫牌)
  const voidQ=what=>f.leadSuit==='T'||!f.behindOpp.length?null:
    {q:`你后面的对手里,有人已经确定断了${s}吗?`,choices:['有','没有'],answer:f.behindOppVoid.length?0:1,
     reveal:f.behindOppVoid.length
       ?`有:${voidWho(view,f.behindOppVoid,f.leadSuit)}。他手里还有${T('trump')}的话,可能${what}。`
       :`没有:后面的${f.behindOpp.map(seatShort).join('、')}${f.behindOpp.length>1?'都':''}还没露出断${s}。`};
  if(f.wins&&f.last) return f.table>0?tableQ():null;
  if(f.ruff) return voidQ('盖过你');
  // 「别家还有几张比 ♠A / 大王大」答案恒为 0 —— 副牌 A 该问的是后面有没有人能毙它
  if(f.wins&&f.bigger) return coachTopRank(o.cards[0],t)?voidQ('毙掉你这张')
    :countQ(`${s}里,别家还有几张比 ${miniName(o.cards[0])} 大?`,cntOf(f.bigger),f.bigger,
      `${miniName(o.cards[0])} 在这门里别家已经压不过了`);
  if(f.partnerCard&&f.partnerBigger&&!f.last) return coachTopRank(f.partnerCard,t)?voidQ('毙掉队友这张')
    :countQ(`队友的 ${miniName(f.partnerCard)},别家还有几张比它大?`,cntOf(f.partnerBigger),f.partnerBigger,
      `队友那张在这门里别家已经压不过了`+(f.behindOppVoid.length?`(但${f.behindOppVoid.map(seatShort).join('、')}已断${s},还是可能被毙)`:''));
  // 已经被毙的墩不问「你的♣压不压得过桌上那张主」—— 答案永远是没有,问了像在考脑筋急转弯
  if(f.beatCard&&f.mineInSuit&&!f.ruffed){
    const cur=miniName(f.beatCard), my=miniName(f.myTop);
    return {q:`这墩你手里有压得过桌上 ${cur} 的${s}吗?`,choices:['有','没有'],answer:f.canBeat?0:1,
      reveal:f.canBeat?`有:你的 ${my} 比它大。`
        :ordIdx(f.myTop,t)===ordIdx(f.beatCard,t)?`没有:你的 ${my} 和它一样大,同样大先出者赢。`
        :`没有:你这门最大的是 ${my},比它小。`};
  }
  return null;      // 「台面几分」只在「你最后出、这墩归你」时才和怎么出有关,别的时候不问
}

const canAskCoach=()=>!!G&&C.on&&!G.ended&&G.phase==='play'&&!G.auto&&G.trick.length<4
  &&(G.leader+G.trick.length)%4===HUMAN&&G.hands[HUMAN].length>0;
function askCoach(){
  if(!canAskCoach()) return;
  // 这一墩已经出过题、还没答 —— 不重复出题,把人带回那道题
  if(G.quiz){ const m=chat.find(x=>x.id===G.quiz.mid);
    if(m&&m.quiz.state==='open'){ activeTab='coach'; chatStick=true; render(); return; } }
  const view=viewFor(HUMAN), plays=G.trick.slice(), no=G.tricks.length+1;
  const J=plays.length?coachJudgeFollow(view,plays):coachJudgeLead(view);
  const advice=suggestHTML(view,plays,J), hint=J.adv.cards.map(c=>c.id);
  const Q=C.quiz&&!coachForced(view,plays)?quizFor(view,plays,{cards:J.adv.cards,facts:coachFacts(view,plays,J.adv.cards)}):null;
  if(Q){
    const m=coachSay(no,`先考你:${Q.q}`,'quiz');
    m.quiz={...Q,advice,hint,state:'open'};
    G.quiz={mid:m.id};
  }else{
    G.quiz=null;
    coachSay(no,advice,'advice');
    G.hintCards=new Set(hint);      // 答案和建议出来之后才点亮提示,不然题目就白问了
  }
  activeTab='coach';
  render();
}
// idx = 选的第几个;−1 = 跳过。都先公布答案,再给建议
function answerQuiz(m,idx){
  const q=m.quiz; if(!q||q.state!=='open') return;
  q.state='done';
  if(G&&G.quiz&&G.quiz.mid===m.id) G.quiz=null;
  chatPush({from:'me',t:idx<0?'跳过,直接看建议':`我选「${q.choices[idx]}」`});
  coachSay(m.no,(idx<0?'':idx===q.answer?'✅ 对了。':'❌ 不对。')+q.reveal,'answer');
  coachSay(m.no,q.advice,'advice');
  if(G&&G.phase==='play'&&!G.ended&&G.tricks.length+1===m.no) G.hintCards=new Set(q.hint);
  chatStick=true;
  render();
}

/* 局末复盘:按分差取前 3 条真失误;命中已知短板(存疑)的另列一段「我可能错的地方」。
 * 托管的墩不进失误统计(见 scheduleHumanAuto),所以措辞要跟着改口。 */
function reviewHTML(autoNote){
  const real=G.coachNotes.filter(n=>!n.doubt), doubt=G.coachNotes.filter(n=>n.doubt);
  let h='';
  if(real.length){
    const top=real.slice().sort((a,b)=>b.gap-a.gap).slice(0,3);
    h+=top.map(n=>`<div>第${n.no}墩:你出 ${desc(n.my)} → 我建议 ${desc(n.best)} · 约亏 ${Math.round(n.gap)} 分<div class="dim">${n.reason}</div></div>`).join('');
    if(real.length>3) h+=`<div class="dim">另有 ${real.length-3} 手差得少一些,不一一列了</div>`;
  }else{
    h+=`<div>${G.autoTricks?'你自己出的那几墩没有明显失误':'本局没有明显失误,漂亮!'}</div>`;
  }
  if(doubt.length){
    h+=`<div style="margin-top:6px"><b>我可能错的地方</b></div>`+
      doubt.map(n=>`<div>第${n.no}墩:我说出 ${desc(n.best)},你出了 ${desc(n.my)} —— ${ladderLine(n.ladder)}。这类局面我有已知短板,这一手大概率是你对。</div>`).join('');
  }
  if(autoNote) h+=`<div class="dim">${autoNote}</div>`;
  return h;
}

/* by(只标你这一家):h = 你自己出的,a = 托管替你选的,f = 没得选自动出的;
 * meta 里 hint = 出的正是教练提示的那手,u = 悔牌之后重出的。牌谱靠它把「真人的决定」挑出来。 */
function playCards(seat,cards,by,meta){
  cards.forEach(c=>removeCard(G.hands[seat],c));
  if(by&&G.undoNext){ meta={...meta,u:1}; G.undoNext=false; }
  G.trick.push(by?{seat,cards,by,...meta}:{seat,cards});
  sndPlay();
  render();
  if(G.trick.length===4) holdTrick();
  else step();
}

// 一墩四家出完:牌留在桌上给人看清楚,到点(或玩家点「下一墩」)再收墩
function holdTrick(){
  // 托管时忽略「手动点下一墩」:每墩都要点一下的话,托管就没有意义了
  if(S.manualNext&&!G.auto){
    G.awaitNext=true; render();
    setMsg('本墩出完 —— 点「下一墩」继续');
    return;
  }
  clearTimeout(G.holdTimer);
  G.holdTimer=setTimeout(finishTrick,
    G.auto?AUTO_HOLD_MS:secs(S.trickHold,S_DEFAULT.trickHold));
}
window.__nextTrick=()=>{ if(G&&G.awaitNext){ G.awaitNext=false; finishTrick(); } };

function finishTrick(){
  if(G.phase!=='play'||G.trick.length!==4) return;   // 防重复收墩/在空墩上再收一次
  clearTimeout(G.holdTimer); G.holdTimer=null;
  G.awaitNext=false;
  const res=resolveTrick(G.trick,G.trump);
  const declTeam=G.declSeat%2;
  const gotPts=res.winner%2!==declTeam;
  if(gotPts){
    G.defPoints+=res.points;
    G.capturedCards.push(...G.trick.flatMap(p=>p.cards).filter(c=>cardPoints(c)>0));
  }
  G.tricks.push({no:G.tricks.length+1,plays:G.trick.slice(),winner:res.winner,points:res.points,gotPts});
  log(`第${G.tricks.length}墩:${SEAT_NAME[res.winner]} 赢${res.points?`,${gotPts?T('defenders')+'得':T('declarers')+'保住'} ${res.points} 分`:',无分'}`);
  G.lastLeadSize=G.trick[0].cards.length;
  G.leader=res.winner; G.lastWinner=res.winner; G.trick=[]; G.trickNo++;
  // 教练提示随墩清空(记牌表重新蒙上);没答的提问在聊天里标成过期,不留一排点不了的按钮
  if(G.quiz){ const m=chat.find(x=>x.id===G.quiz.mid); if(m&&m.quiz.state==='open') m.quiz.state='expired'; }
  G.hintCards=null; G.quiz=null;
  (res.winner%2===HUMAN%2?sndWin:sndLose)();
  const nEl=document.getElementById('n'+res.winner);
  if(nEl){ nEl.classList.add('won'); setTimeout(()=>nEl.classList.remove('won'),1900); }
  if(G.hands.every(h=>h.length===0)) endRound();
  else { saveCheckpoint(); render(); setMsg(''); setTimeout(step,400); }
}

function endRound(){
  redealCount=0;                 // 本局真正打完了,重发计数归零
  G.auto=false;                  // 托管按局生效:这一局打完就交还,下一局从你自己的手开始
  const declTeam=G.declSeat%2;
  const defWonLast=G.lastWinner%2!==declTeam;
  const sc=scoreRound({defPoints:G.defPoints,kitty:G.buried,defWonLastTrick:defWonLast,
                       lastLeadSize:G.lastLeadSize});
  // 整场推进要先算 —— 弹窗里的「升 N 级」必须是**实际生效**的那个数,
  // 否则会出现「上台升1级」和下一行「必打关卡,本次不升级」自相矛盾。
  // played 一直记着(即使关卡开关是关的),中途打开设置才不会丢掉前面的战绩;
  // 关着的时候 gates 传 null,判定本身自然不生效
  const before=M.levels.slice();
  const adv=advanceMatch(M.levels,G.declSeat,sc,S.gatesOn?S.gates:null,M.played);
  const upTeam=sc.defendersWin?1-declTeam:declTeam;
  const realUp=adv.levels[upTeam]-before[upTeam];      // 关卡拦下后可能小于 sc 里的名义级数
  const humanDecl=declTeam===HUMAN%2;
  const humanWon=sc.defendersWin!==humanDecl;
  /* 新界面:局终面板按设计系统重排 —— 得分徽章 + 一句结论 + 底牌 + 六六复盘 + 两队级数 + 操作 */
  const lvName=x=>rankName(Math.min(x,14));
  const upLine=realUp?`,${T('levelUp')} ${realUp} 级${realUp>1?`(${T('tiaoji')}!)`:''}`:'';
  let html=`<div class="res-head"><div class="res-badge${humanWon?'':' lose'}"><span class="n">${sc.total}</span><span class="u">分</span></div>`+
    `<div class="res-title${humanWon?'':' lose'}">${humanWon?'你们赢了':'这局输了'}</div>`+
    `<div class="res-line">${sc.defendersWin?`${T('defenders')}上台${upLine}`:`庄家方守住${upLine}`}</div>`+
    `<div class="res-sub">${T('defenders')}共得 ${sc.total} 分`+
    (defWonLast&&sc.kittyPts?`,含${T('bury')}翻出 ${sc.kittyPts}×${sc.mult}`:'')+
    (sc.total===0?` · ${T('guangtou')}!`:'')+`</div></div>`;
  if(G.buried.length)
    html+=`<div class="res-kitty"><div class="res-sub">底牌</div><div class="mini-row">`+
      sortForDisplay(G.buried,curTrumpForSort()).map(c=>cardHTML(c,'mini')).join('')+`</div></div>`;
  // 教练:局后复盘关键回合(按分差取前3)
  /* 托管的墩不进失误统计(它们不是你的选择),所以这里也要**改口** ——
   * 否则替你打了十墩之后还夸你「没有明显失误」,这句表扬就不作数了。 */
  const autoNote=G.autoTricks?`本局有 ${G.autoTricks} 墩是托管的,不计入失误统计。`:'';
  if(C.on&&C.review){
    const rv=reviewHTML(autoNote);
    html+=`<div class="res-coach"><span class="leo-avatar${G.coachNotes.some(n=>!n.doubt)?'':' happy'}" aria-hidden="true"></span><div><b>六六帮你复盘</b>${rv}</div></div>`;
    coachSay(null,`<b>本局复盘</b>${rv}`,'review');
  }
  // 存档这一局,供跨局复盘(要在 M.round++ 之前拿局号,也要在 M.levels 被改写之前拿 before)
  M.past.push({no:M.round+1, trump:G.trump, declSeat:G.declSeat,
               defPoints:sc.total, defendersWin:sc.defendersWin,
               kittyPts:sc.kittyPts, mult:sc.mult,
               levelsBefore:before, levelsAfter:adv.levels.slice(),
               initialHands:G.initialHands, buried:G.buried.slice(),
               tricks:G.tricks, log:G.log});
  {  // 牌谱:存本机,同意过就顺手上传(没传上的下次再补)
    const r=M.past[M.past.length-1];
    try{ r.rec=makeRecord(r); storeRecord(r.rec); }catch(e){ console.error('牌谱存档失败',e); }
    dropCheckpoint();
    flushUploads();
  }
  // 整场推进(adv 在上面已经算好)
  M.levels=adv.levels; M.dealer=adv.dealer; M.round++;
  if(adv.played) M.played=adv.played;
  G.ended={matchOver:adv.matchOver};
  if(adv.gateStopped!=null)
    html+=`<div class="res-gate">${lvName(adv.gateStopped)} 必打,不可跳级 —— 本次升级停在 ${lvName(adv.gateStopped)}</div>`;
  if(adv.gateHeld!=null){
    const who=adv.dealer%2===HUMAN%2?'你们':'对方';
    html+=`<div class="res-gate">${lvName(adv.gateHeld)} 必打 —— ${who}还没坐庄守住过 ${lvName(adv.gateHeld)},`+
          `本次不升级,下一局由${who}坐庄打 ${lvName(adv.gateHeld)}</div>`;
  }
  const levels=`<div class="res-levels"><div class="us"><small>我方打</small><span class="num">${lvName(M.levels[0])}</span></div>`+
    `<div><small>对方打</small><span class="num">${lvName(M.levels[1])}</span></div></div>`;
  const more=`<button class="btn" onclick="window.__review()">看看这局</button><button class="btn" onclick="window.__copyRecord()">复制牌谱</button>`;
  if(adv.matchOver){
    const weWon=adv.winnerTeam===0;
    html+=`<div class="res-final">${weWon?'你们打过 A,整场胜利!':'对方打过 A,整场告负'}</div>`+levels+uploadAskHTML();
    html+=`<div class="panel-actions"><button class="btn primary" onclick="window.__newMatch()">再来一场</button>${more}</div>`;
  }else{
    html+=levels+`<div class="res-next">下一局${['你',' Bob ',' Kevin ',' Stuart '][M.dealer]}坐庄,打 ${lvName(M.levels[M.dealer%2])}</div>`+uploadAskHTML();
    html+=`<div class="panel-actions"><button class="btn primary" onclick="window.__next()">下一局</button>${more}</div>`;
  }
  // 弹层之下的牌桌也要跟着进「已结束」态(托管按钮收起、发牌区改成「复盘中」),
  // 否则点「复盘本局」把弹层关掉之前,底下还留着上一秒的按钮
  render();
  document.getElementById('overlayContent').innerHTML=html;
  document.getElementById('overlay').style.display='flex';
  sndEnd();
}
window.__next=()=>{ document.getElementById('overlay').style.display='none'; newRound(); };
window.__newMatch=()=>{ M={levels:[2,2],dealer:-1,round:0,played:[-1,-1],past:[]}; logRound=null; logFocus=0;
  scrambleNext=false; redealCount=0;
  // 笔记是记这一场的(第几局谁扣了什么底),整场重开就该跟着清空 —— 否则局号会串到新的一场
  notes=[]; try{ localStorage.removeItem(LSP+'notes'); }catch(e){}
  chat=[]; chatUnread=0;
  document.getElementById('overlay').style.display='none'; newRound(); };
/* 导入牌谱(v0.7.22):把「复制牌谱」导出的那段文字贴回来,载入到「对局记录」里复盘。
 * 载入的这一局追加在跨局复盘的局号按钮里(标成「导入 N」),不影响当前这一场的级数和比分。 */
window.__importRecord=()=>{
  showModal(`<div style="margin-bottom:6px">把「复制牌谱」得到的那段文字粘贴到下面:</div>`+
    `<textarea id="impText" style="width:100%;height:140px;font-size:11px"></textarea>`+
    `<div class="panel-actions"><button class="btn primary" id="impGo">载入复盘</button></div><div id="impMsg" class="setHint" style="color:var(--brick-deep);text-align:center"></div>`);
  document.getElementById('impGo').onclick=()=>{
    try{
      const rec=JSON.parse(document.getElementById('impText').value.trim());
      if(!rec.initialHands||!rec.tricks) throw new Error('缺少手牌或出牌记录');
      let uid=0; const card=code=>({suit:code[0],rank:+code.slice(1),id:'imp'+(uid++)});
      const hands=rec.initialHands.map(h=>h.map(card));
      const pool=hands.map(h=>h.slice());
      // 出牌里的牌从对应那家的初始手牌里取,这样复盘时同一张牌前后是同一个对象
      const take=(seat,code)=>{ const h=pool[seat]; const i=h.findIndex(x=>x.suit+x.rank===code);
        return i>=0?h.splice(i,1)[0]:card(code); };
      const tricks=rec.tricks.map((t,i)=>({no:i+1,winner:t.winner,points:t.points,
        plays:t.plays.map(p=>({seat:p.seat,cards:p.cards.map(cd=>take(p.seat,cd))}))}));
      const nImp=M.past.filter(r=>r.imported).length+1;
      M.past.push({no:'导入 '+nImp, imported:true, trump:rec.trump, declSeat:rec.declSeat,
        defPoints:rec.defPoints, defendersWin:rec.defPoints>=80, kittyPts:rec.kittyPts, mult:rec.mult,
        levelsBefore:rec.levelsBefore||[2,2], levelsAfter:rec.levelsAfter||[2,2],
        initialHands:hands, buried:(rec.buried||[]).map(card), tricks,
        log:[{text:`导入的牌谱(${rec.version||'版本不明'},原局第 ${rec.no} 局,人坐${SEAT_NAME[rec.human]||'?'})`}]});
      logRound=M.past.length-1; logMode='trick'; logFocus=0; activeTab='log';
      // 还没开局时 G 是空的:牌桌不重画(render 要读 G),只画右侧的复盘面板
      window.__closeSet(); if(G) render(); renderPanel();
      if(G) setMsg('牌谱已载入:「对局记录」页签里可以逐墩复盘');
    }catch(e){ document.getElementById('impMsg').textContent='读不懂这段文字:'+e.message; }
  };
};
/* ================= 牌谱:每局自动存本机 + 自动上传(v0.7.38) =================
 * 起因:AI 线要真人牌谱跳出自对弈的偏差,但不能指望试玩的人每局手动「复制牌谱」再发过来。
 * · 每打完一局(endRound)写一份 80fen-record-2,存进本机(localStorage,最多 REC_MAX 局);
 *   设置里「导出全部牌谱」一次导出成一个文件(手机上走系统分享)—— 上传不通时的备用路。
 * · 测试版自动上传到开发者的收集表；正式版需玩家开启。
 *   (Google Apps Script + Google 表格,服务端代码和部署步骤见 docs/upload/)。
 *   传不上的(离线、被墙、地址没配)留在本机,下次打完一局 / 下次打开页面再补;服务端按 id 去重。
 * 格式是 80fen-record-1 的超集(字段说明见 docs/upload/README.md),「导入牌谱」和
 * test/replay-record.js 照样能读。 */
const UPLOAD_URL='https://script.google.com/macros/s/AKfycbw7wsJ-VDNMwAWNuW41b3DLjI2_g23U7fi9aI71NnHgst8SL2MJXsYGyC2nt8fi4PAQbw/exec';   // Apps Script 部署后的 …/exec 地址;空 = 只存本机、不上传
const REC_MAX=300;     // 一局约 5KB,300 局 ≈ 1.5MB,离 localStorage 的 5MB 上限留足余量
const lsGet=(k,d)=>{ try{ const v=localStorage.getItem(LSP+k); return v==null?d:JSON.parse(v); }catch(e){ return d; } };
const lsSet=(k,v)=>{ try{ localStorage.setItem(LSP+k,JSON.stringify(v)); return true; }catch(e){ return false; } };
// file:// 打开时 crypto.randomUUID 不可用(非安全上下文),退回时间戳 + 随机串
function randId(){ try{ return crypto.randomUUID(); }catch(e){ return Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,12); } }
// 匿名玩家编号:随机生成、只存在本机,用来把同一个人的局归到一起(水平分层),不含任何个人信息
function playerId(){ let id=lsGet('pid',null); if(!id){ id=randId(); lsSet('pid',id); } return id; }
// 测试版默认上传、正式版默认不传:按文件名认身份,同 ENGINE_PICKER(正式版 = index.html)。设置里改过就按改过的
const UPLOAD_DEFAULT=ENGINE_PICKER;
const uploadOn=()=>{ const v=lsGet('upload',null); return !!UPLOAD_URL&&(v===null?UPLOAD_DEFAULT:v===true); };

/* r = 刚打完、push 进 M.past 的那一局 → 完整牌谱;r 省略 → 按当前 G 写一份残局(partial,见 saveCheckpoint)。
 * 两种共用一个 id(G.recId):同一局要么留下完整的,要么留下残局,不会两份都有。 */
function makeRecord(r){
  const cs=c=>c.suit+c.rank, css=a=>(a||[]).map(cs);
  const nick=String(lsGet('nick','')||'').slice(0,20);
  const part=!r;
  const tricks=(part?G.tricks:r.tricks)||[];
  return {fmt:'80fen-record-2', id:G.recId, pid:playerId(), ...(nick?{nick}:{}),
    version:(document.getElementById('versionTag')||{}).textContent||'',
    t:new Date().toISOString(), dur:Math.round((Date.now()-G.t0)/1000),
    // 残局:stage = 停在哪个阶段(dealing 发牌中 / finalDecl 亮主等待 / lowrebel 造反 / kitty 扣底 / play 出牌),
    // tricks 只有已经收掉的墩,defPoints 是到那时为止闲家的墩上分
    ...(part?{partial:true, stage:G.phase, tricksDone:tricks.length}:{}),
    human:HUMAN, no:part?G.start.round+1:r.no, seed:seedCode(G.start), replay:!!G.replay, redeals:G.redeals,
    dealer:G.start.dealer, firstTaker:G.firstTaker,
    declSeat:part?G.declSeat:r.declSeat, trump:part?G.trump:r.trump,
    levelsBefore:part?G.start.levels.slice():r.levelsBefore,
    ...(part?{defPoints:G.defPoints}:{levelsAfter:r.levelsAfter, defPoints:r.defPoints,
      defendersWin:r.defendersWin, kittyPts:r.kittyPts, mult:r.mult}),
    rules:{...S.rules, fullRebel:S.fullRebel, speedRun:!!S.speedRun, gates:S.gatesOn?S.gates.slice():[]},
    engines:G.engines.map(v=>v||'latest'), coach:C.on?C.gapSens:'off',
    undos:G.undos, autoTricks:G.autoTricks,
    decl:G.declLog.map(d=>({...d})), kitty:css(G.kittyOrig), buryBy:G.buryBy??null,
    ...(part&&!G.initialHands?{}:{initialHands:(part?G.initialHands:r.initialHands||[]).map(css),
                                   buried:css(part?G.buried:r.buried)}),
    tricks:tricks.map(t=>({plays:t.plays.map(p=>({seat:p.seat,cards:css(p.cards),
      ...(p.by?{by:p.by}:{}),...(p.hint?{hint:1}:{}),...(p.u?{u:1}:{})})),winner:t.winner,points:t.points}))};
}
/* 残局进度:发完牌、开打、每收一墩、悔牌之后各覆盖写一次(本机一格 'cur')。正常打完就清掉;
 * 没打完就离开了(刷新 / 关页面 / 被系统杀掉 / 重打 / 用种子开局 / 重开整场),
 * 下一次开局或下次打开页面时把它转成一份残局牌谱(promoteCheckpoint)。
 * 不在「关页面那一刻」存 —— 手机上那一刻经常不给执行代码的机会。 */
function saveCheckpoint(){
  if(!G||G.ended||G.dealt<100) return;      // 发完牌才算一局开始
  try{ lsSet('cur',makeRecord()); }catch(e){ console.error('残局进度存档失败',e); }
}
function dropCheckpoint(){ try{ localStorage.removeItem(LSP+'cur'); }catch(e){} }
function promoteCheckpoint(){
  const c=lsGet('cur',null);
  if(!c) return;
  dropCheckpoint();
  if(!lsGet('recs',[]).some(x=>x.id===c.id)) storeRecord(c);
}
function storeRecord(rec){
  let all=lsGet('recs',[]);
  all.push(rec);
  if(all.length>REC_MAX) all=all.slice(-REC_MAX);
  // 存不下(别的页面也占着 localStorage):先丢已上传过的,再丢最旧的
  while(!lsSet('recs',all)&&all.length>1){
    const up=all.filter(x=>x.up);
    all=up.length?all.filter(x=>!x.up):all.slice(Math.ceil(all.length/4));
  }
}
let upBusy=false;
async function flushUploads(){
  if(!uploadOn()||upBusy||typeof fetch!=='function') return;
  upBusy=true;
  try{
    for(let n=0;n<30;n++){
      const batch=lsGet('recs',[]).filter(x=>!x.up).slice(0,8);
      if(!batch.length) break;
      // text/plain 是「简单请求」,不发预检 —— Apps Script 不回应 OPTIONS
      const res=await fetch(UPLOAD_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
                                        body:JSON.stringify(batch)});
      const j=await res.json()||{};
      // saved / dup = 收到了;bad = 服务端不收(格式不对等),也不再重传 —— 只有 'rate'(传太快)下次再试
      const done=new Set([...(j.saved||[]),...(j.dup||[])]);
      const rej=new Set((j.bad||[]).filter(b=>b&&b.why!=='rate').map(b=>b.id));
      if(!done.size&&!rej.size) break;
      const all=lsGet('recs',[]);
      all.forEach(x=>{ if(done.has(x.id)) x.up=1; else if(rej.has(x.id)) x.up=2; });
      lsSet('recs',all);
    }
  }catch(e){ /* 离线 / 被墙 / 地址失效:留在本机,下次再传 */ }
  upBusy=false;
  const h=document.getElementById('stRecHint'); if(h) h.textContent=recStatus();
}
function recStatus(){
  const all=lsGet('recs',[]), pend=all.filter(x=>!x.up).length;
  return `本机存了 ${all.length} 局`+(UPLOAD_URL?(uploadOn()?(pend?`,${pend} 局还没传上去(下次打完一局会再试)`:',都已上传'):',自动上传没开'):'')+
    `(最多保留最近 ${REC_MAX} 局)。你的匿名编号:${playerId().slice(0,8)}`;
}
window.__setUpload=on=>{
  lsSet('upload',!!on);
  const ask=document.getElementById('upAsk'); if(ask) ask.remove();
  if(on){ showToast('谢谢!之后每局打完会自动上传'); flushUploads(); }
};
// 第一次结算时问一次;答过就不再问(设置里随时可改)
function uploadAskHTML(){
  if(!UPLOAD_URL||!UPLOAD_DEFAULT||lsGet('upload',null)!==null) return '';
  return `<div id="upAsk" class="res-upload">`+
    `测试版会把打过的牌局自动上传给开发者,用来改进 AI。<div class="dim">`+
    `只传牌局本身(发牌、叫牌、扣底、每一手出牌、规则设置)和一个随机的匿名编号,不含任何个人信息;设置里随时可以关。</div>`+
    `<div class="res-upload-btns"><button class="btn" onclick="window.__setUpload(true)">知道了</button><button class="btn quiet" onclick="window.__setUpload(false)">不要上传</button></div></div>`;
}
window.__exportRecords=()=>{
  const all=lsGet('recs',[]);
  if(!all.length){ showToast('本机还没有存下的牌谱'); return; }
  const txt=all.map(({up,...x})=>JSON.stringify(x)).join('\n')+'\n';   // 一行一局(JSONL)
  const d=new Date(), p2=n=>String(n).padStart(2,'0');
  // 文件名只用 ASCII:Chromium 遇到中文文件名会退回成「download」
  const name=`80fen-records-${d.getFullYear()}${p2(d.getMonth()+1)}${p2(d.getDate())}-${p2(d.getHours())}${p2(d.getMinutes())}-${all.length}.txt`;
  // 手机上直接走系统分享(发微信 / 邮件),电脑上下载文件
  try{
    const f=new File([txt],name,{type:'text/plain'});
    if(matchMedia('(pointer:coarse)').matches&&navigator.canShare&&navigator.canShare({files:[f]})){
      navigator.share({files:[f],title:'80分牌谱'}).catch(()=>{}); return;
    }
  }catch(e){}
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([txt],{type:'text/plain'})); a.download=name;
  document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },60000);   // 撤早了有的浏览器会丢文件名
};
window.__clearRecords=()=>{
  const all=lsGet('recs',[]), pend=uploadOn()?all.filter(x=>!x.up).length:0;
  if(!all.length) return;
  if(!confirm(`清空本机存的 ${all.length} 局牌谱?`+(pend?`其中 ${pend} 局还没上传,清掉就没了。`:'')+'建议先导出。')) return;
  lsSet('recs',[]);
  const h=document.getElementById('stRecHint'); if(h) h.textContent=recStatus();
};

/* 复制牌谱(v0.7.22):把刚打完的这一局原样导出,供开发者逐手还原 AI 的决定。
 * 牌写成「花色 + 点数」:S/H/D/C,11~14 = J Q K A;X15 小王、X16 大王。
 * initialHands 是扣底之后、开打之前四家的手牌;buried 是庄家扣的 8 张;tricks 是每一墩四家按出牌顺序出的牌。
 * 离线打开(file://)时剪贴板可能不让写,就把文字放进弹层里让人手动复制。 */
window.__copyRecord=()=>{
  const r=M.past[M.past.length-1]; if(!r) return;
  const cs=c=>c.suit+c.rank;
  // v0.7.38 起结算时已经存了一份完整的 80fen-record-2(见 makeRecord),有就直接用它
  const rec=r.rec||{fmt:'80fen-record-1', version:(document.getElementById('versionTag')||{}).textContent||'',
    human:HUMAN, no:r.no, declSeat:r.declSeat, trump:r.trump, levelsBefore:r.levelsBefore, levelsAfter:r.levelsAfter,
    defPoints:r.defPoints, kittyPts:r.kittyPts, mult:r.mult,
    initialHands:(r.initialHands||[]).map(h=>h.map(cs)), buried:(r.buried||[]).map(cs),
    tricks:(r.tricks||[]).map(t=>({plays:t.plays.map(p=>({seat:p.seat,cards:p.cards.map(cs)})),winner:t.winner,points:t.points}))};
  const txt=JSON.stringify(rec);
  const fallback=()=>showModal(`<div style="margin-bottom:6px">复制下面这段文字,发给开发者:</div>`+
    `<textarea readonly style="width:100%;height:160px;font-size:11px" onclick="this.select()">${txt.replace(/</g,'&lt;')}</textarea>`);
  try{ navigator.clipboard.writeText(txt).then(()=>showToast('复制牌谱成功-代码已在剪贴板'),fallback); }catch(e){ fallback(); }
};
window.__review=()=>{ document.getElementById('overlay').style.display='none';
  render(); setMsg('复盘中:可查看出牌历史、教练复盘等记录,准备好后点下方"下一局"继续'); };

/* 种子码:发牌种子 + 开局那一刻的整场状态。光有发牌种子不够——谁先拿牌取决于庄家,
 * 打几取决于级数,局数/关卡记录影响后面的升级,所以要一起带上才能在任何时候(包括
 * 打完几局之后、在别人手机上)还原出完全一样的这一局。格式举例:
 *   29857-D2-L3.5-R4        庄家=座位2,我方打3、对方打5,第5局(R 从 0 数)
 *   29857-L2.2-R0-X         X = 无庄盘(首局切牌定先 / 完全造反后抢庄)
 *   …-P5.-1                 关卡记录(必打关卡守住过的级,-1=没有),全是 -1 时省略
 *   …-T1                    交换队伍(整桌转了一座,见 swapStart);只有无庄盘的切牌要用到它,
 *                           庄定盘的庄家/级数在码里本身就已经是换过之后的
 * 必须是完整的码:光一个数字说不清庄家和级数,发出来的不是同一局,所以不收。 */
function seedCode(st){
  let c=`${st.seed}`;
  if(st.dealer>=0) c+=`-D${st.dealer}`;
  c+=`-L${st.levels[0]}.${st.levels[1]}-R${st.round}`;
  if(st.dealer<0||st.scramble) c+='-X';
  if(st.played.some(v=>v!==-1)) c+=`-P${st.played[0]}.${st.played[1]}`;
  if(st.rot) c+=`-T${st.rot}`;
  return c;
}
function parseSeedCode(txt){
  const t=String(txt||'').trim().toUpperCase().replace(/\s+/g,'');
  const m=t.match(/^(\d+)((?:-[A-Z][-\d.]*?)*)$/);
  if(!m) return null;
  const st={seed:+m[1]};
  if(!m[2]) return null;                     // 纯数字:缺庄家/级数,不收
  const parts=m[2].split(/-(?=[A-Z])/).filter(Boolean);
  let scr=false;
  for(const p of parts){
    const k=p[0], v=p.slice(1);
    if(k==='D'){ const d=+v; if(!(d>=0&&d<=3)) return null; st.dealer=d; }
    else if(k==='L'){ const l=v.split('.').map(Number);
      if(l.length!==2||l.some(x=>!(x>=2&&x<=14))) return null; st.levels=l; }
    else if(k==='R'){ const r=+v; if(!(r>=0)) return null; st.round=r; }
    else if(k==='P'){ const q=v.split('.').map(Number);
      if(q.length!==2||q.some(x=>!Number.isInteger(x))) return null; st.played=q; }
    else if(k==='X') scr=true;
    else if(k==='T'){ const r=+v; if(![0,1,2,3].includes(r)) return null; st.rot=r; }
    else return null;
  }
  if(!st.levels) return null;
  if(st.dealer==null&&!scr) return null;     // 既没庄家又没标无庄,说不清是哪种开局
  st.dealer=st.dealer==null?-1:st.dealer;
  st.scramble=scr&&st.dealer>=0;
  st.round=st.round||0; st.played=st.played||[-1,-1]; st.rot=st.rot||0;
  return st;
}
/* 交换队伍:同一局牌,两队角色互换 —— 整桌每人往下家挪一座(再换一次挪回来,
 * 不会挪两座变成跟队友换牌)。原来 A 队拿的牌、坐的庄、打的级数、关卡记录,
 * 全部换给 B 队;先拿牌的人、发牌顺序跟着转,所以每一张牌落在同一个「角色」手里。 */
function swapStart(st){
  const d=st.rot===1?-1:1;
  return {...st, dealer:st.dealer>=0?(st.dealer+d+4)%4:-1,
          levels:[st.levels[1],st.levels[0]], played:[st.played[1],st.played[0]],
          rot:(st.rot+d+4)%4};
}
// 把整场状态拨回 st 记的那一刻再发牌(M.past 这类历史存档不动)
function startFromState(st){
  M.levels=st.levels.slice(); M.dealer=st.dealer; M.round=st.round; M.played=st.played.slice();
  scrambleNext=!!st.scramble; rotNext=st.rot||0;
  redealCount=0; replayNext=true;
  document.getElementById('overlay').style.display='none';
  startRound(st.seed);
}
window.__copySeed=()=>{
  if(!G) return;
  const txt=seedCode(G.start);
  const fallback=()=>showModal(`<div style="margin-bottom:6px">复制下面这个种子码,发给对方:</div>`+
    `<textarea readonly style="width:100%;height:40px;font-size:13px" onclick="this.select()">${txt}</textarea>`);
  try{ navigator.clipboard.writeText(txt).then(()=>showToast('种子码已复制到剪贴板'),fallback); }catch(e){ fallback(); }
};
window.__redoRound=(swap)=>{
  if(!G) return;
  if(!confirm(swap?'交换队伍重打本局:同一副牌,两队角色互换(对方的牌、庄位、级数换给你们),当前进度会丢失。确定吗?'
                  :'重打本局:同一副牌、同样的庄家和级数重新发一次,当前进度会丢失。确定吗?')) return;
  const st=swap?swapStart(G.start):G.start;
  // 结算后重打:刚才那一局已经存进跨局复盘了,重打的这一局会重新存一次,先把旧的撤掉
  if(G.ended&&M.past.length&&M.past[M.past.length-1].no===st.round+1) M.past.pop();
  closeSettings();
  startFromState(st);
};
window.__seedRound=()=>{
  const el=document.getElementById('stSeedInput');
  const st=el&&parseSeedCode(el.value);
  if(!st){ alert('种子码格式不对。请粘贴完整的种子码(如 29857-D2-L3.5-R4),光一个数字不行'); return; }
  const swap=document.getElementById('stSeedSwap').checked;
  if(!confirm(`用这个种子码开局${swap?'(交换队伍)':''}:当前进度会丢失,庄家、级数、局数都按种子码里的来。确定吗?`)) return;
  closeSettings();
  startFromState(swap?swapStart(st):st);
};

// 手牌单行自适应:张数一多就把牌往一起挤(而不是换行),换行会把高度让给牌桌抢走
function fitHandRow(){
  return;   // 新界面(v0.7.43,来自打牌 UI 测试页):手牌由表现层排布;这里量尺寸会强制排版,让新牌从左上角飞入
  const el=document.getElementById('hand');
  const n=el.children.length;
  if(n<2){ el.style.removeProperty('--handGap'); return; }
  // --cardW 是 clamp(vw+vh) 表达式,getComputedStyle 在自定义属性上只返回原始文本、不会解析成像素,
  // 只能量实际卡牌元素的渲染宽度
  const cardW=el.children[0].getBoundingClientRect().width||60;
  const landscape=matchMedia('(orientation:landscape) and (max-height:600px)').matches;
  const naturalGap=cardW*(landscape?-0.46:-0.38);
  const avail=el.clientWidth-4;
  const neededGap=(avail-n*cardW)/(n-1);   // 总宽 = n*cardW + (n-1)*gap,解出刚好塞进 avail 的 gap
  const minVisible=Math.max(9,cardW*0.2);
  const minGap=-(cardW-minVisible);
  const gap=Math.max(minGap,Math.min(naturalGap,neededGap));
  el.style.setProperty('--handGap',gap+'px');
}
window.addEventListener('resize',()=>{ if(G) fitHandRow(); });

// ================= 渲染 =================
function render(){
  const t=G.trump;
  // 只报当前第几墩,不报总数 —— 一墩可以是单张/对子/拖拉机,总墩数本来就不固定
  const trickNo=G.ended?G.tricks.length:G.tricks.length+1;
  /* 座位缩写后面紧跟术语:中文「东翻」连写没问题,英文 "E"+"declare" 会糊成
   * "Edeclare"。拉丁字母开头就补一个空格。 */
  const declNow=G.decl?`${seatAbbr(G.decl.seat)}${T('declare')} ${G.decl.suit?SUIT_SYM[G.decl.suit]+(G.decl.strength===2?'对':''):(G.decl.strength===4?T('bigJoker'):T('smallJoker'))+'对'}`:'未定';

  // 出牌状态显示区拆分:阶段性说明(发牌/造反/扣底)去顶部状态栏;
  // 本墩领出信息(更常用、更值得占牌桌中心)直接写进 #msg,替掉"轮到你跟牌"这类泛泛提示
  let phaseHint='', centerMsg='', winnerMsg='', winnerOurs=false;
  if(G.phase==='dealing'||G.phase==='finalDecl'){
    phaseHint=`发牌中(${G.dealt}/100)${G.auto?'·托管中':''}… 当前:${G.decl?`${SEAT_NAME[G.decl.seat]} ${G.decl.suit?SUIT_SYM[G.decl.suit]+(G.decl.strength===2?'(一对)':''):T('noTrump')}`:'无人'+T('declare')}`;
  }else if(G.phase==='redealing') phaseHint='重新发牌中…';
  else if(G.phase==='lowrebel') phaseHint=`低分/少${T('trump')}:分数≤${RULES.pointRebelThreshold}或${T('trump')}≤${RULES.trumpRebelThreshold}张可${rebelName()}`;
  else if(G.phase==='kitty') phaseHint=`${T('bury')}阶段:庄家从手牌(含底牌)中选 ${RULES.kittySize} 张扣下`;
  else if(G.phase==='play'){
    // 托管中要一眼看得见 —— 否则「我的牌怎么自己出掉了」就是下一条报障
    if(G.auto) phaseHint='托管中:AI 正在替你出牌 —— 点「停止托管」随时收回';
    if(G.trick.length>0){
      const lead=classify(G.trick[0].cards,G.trump);
      const suitName=lead.suit==='T'?(t.suit?T('trump'):T('noTrump')):SUIT_NAME[lead.suit];
      centerMsg=`本墩:${SEAT_NAME[G.trick[0].seat]} ${T('lead')} 【${suitName}】 ${typeName(lead.type)}(${lead.cards.length}张),有${suitName}必须跟`;
      // 谁暂时最大 —— 决定该抢还是该垫,比"轮到你跟牌"有用得多
      const cw=currentWinner(G.trick,G.trump);
      const ours=cw.seat%2===HUMAN%2;
      const pts=countPoints(G.trick.flatMap(p=>p.cards));
      winnerMsg=`目前 ${cw.seat===HUMAN?'你':SEAT_NAME[cw.seat]} 最大(${ours?'我方':'对方'})`+
                (pts?` · 台面 ${pts} 分`:'');
      winnerOurs=ours;
    }else centerMsg=`本墩:${SEAT_NAME[G.leader]} ${T('lead')},等待出牌…`;
  }
  if(centerMsg){   // 空则保留上一次 setMsg() 的内容(如错误提示)
    document.getElementById('msg').innerHTML=centerMsg+
      (winnerMsg?`<div class="msgWin ${winnerOurs?'ours':'theirs'}">${winnerMsg}</div>`:'');
  }

  document.getElementById('status').innerHTML=
    `<span>${T('trump')}:<b>${t?trumpLabel(t):declNow}</b></span>`+
    `<span>庄家:<b>${G.declSeat>=0?SEAT_NAME[G.declSeat]:'抢亮中'}</b></span>`+
    `<span>${T('defenders')}得分:<b>${G.defPoints}</b></span>`+
    `<span>你的队伍:<b>${G.declSeat<0?'—':(G.declSeat%2===0?T('declarers'):T('defenders'))}</b></span>`+
    `<span>级数 你们:<b>${rankName(Math.min(M.levels[0],14))}</b> 对方:<b>${rankName(Math.min(M.levels[1],14))}</b></span>`+
    `<span>第${M.round+1}局 · 第 <b>${trickNo}</b> 墩</span>`+
    `<button id="btnSet" style="margin-left:auto" onclick="window.__openSet()">⚙ 设置</button>`+
    (phaseHint?`<span class="phaseHint">${phaseHint}</span>`:'');

  /* 座位名跟着语言走。这四个 span 的文字原来只写在静态 HTML 里、从不更新 ——
   * 加英语档之前没人发现,因为三种中文写法恰好一样。 */
  // 测试版:换了 AI 引擎的座位在名字后面挂版本号,一眼看出这家是哪一版在打
  for(let s=0;s<4;s++) document.getElementById('n'+s).textContent=
    ['我','下家','对家','上家'][s]+(s===HUMAN&&G.auto?'（托管）':'');
  for(let s=1;s<4;s++){
    const n=(G.phase==='dealing'||G.phase==='finalDecl')?G.visCount[s]:G.hands[s].length;
    document.getElementById('b'+s).textContent='🂠 '+n+' 张';
    document.getElementById('n'+s).classList.toggle('turn',
      G.phase==='play'&&G.trick.length<4&&(G.leader+G.trick.length)%4===s);
  }
  document.getElementById('n0').classList.toggle('turn',
    G.phase==='play'&&G.trick.length<4&&(G.leader+G.trick.length)%4===0);
  const preplay=(G.phase!=='play');   // 开打前:亮主牌摆在亮主者面前
  for(let s=0;s<4;s++){
    const p=G.trick.find(x=>x.seat===s);
    /* 出牌区和手牌用同一把尺子(sortForDisplay)。原来这里按打出顺序摆:同一副牌
     * 在桌上和手上长得不一样,看的人得先在脑子里做一次映射 —— 甩四五张时尤其明显。 */
    let html=p?sortForDisplay(p.cards,curTrumpForSort()).map(c=>cardHTML(c)).join(''):'';
    if(preplay&&G.declCards&&G.declCards.seat===s)
      html=sortForDisplay(G.declCards.cards,curTrumpForSort()).map(c=>cardHTML(c)).join('');
    // 内容没变就别重建 DOM —— 否则 playIn 动画每次 render 都重放(牌一直闪)
    const slot=document.getElementById('p'+s);
    if(slot.__last!==html){ slot.innerHTML=html; slot.__last=html; }
  }
  const showHand=(G.phase==='dealing'||G.phase==='finalDecl')?visHand(HUMAN):G.hands[HUMAN];
  const handTrump=(G.phase==='dealing'||G.phase==='finalDecl')
    ?{suit:G.decl&&G.decl.suit,rank:rankOf(HUMAN)}:curTrumpForSort();
  const hand=sortForDisplay(showHand,handTrump);
  document.getElementById('hand').innerHTML=
    hand.map(c=>cardHTML(c,G.selected.has(c.id)?'sel':(G.hintCards&&G.hintCards.has(c.id)?'hintc':''))).join('');
  document.querySelectorAll('#hand .card').forEach(el=>{
    el.onclick=()=>{
      if(G.phase==='dealing'||G.phase==='finalDecl'){
        if(window.__toggleBidCard)window.__toggleBidCard(+el.dataset.id);
        return;
      }
      if(!(G.phase==='play'||G.phase==='kitty')) return;
      const id=+el.dataset.id;
      G.selected.has(id)?G.selected.delete(id):G.selected.add(id);
      render();
    };
  });
  fitHandRow();

  // 抢亮/造反/低分造反条
  // 注意:内容没变时绝不重建 DOM —— 发牌期高频重绘会把正在点击的按钮销毁(点击被吞 bug)
  const strip=document.getElementById('dealZone');
  let stripHTML, bind=null;
  if(G.ended){
    stripHTML=G.ended.matchOver
      ?`<span style="color:var(--gold)">复盘中</span> <button onclick="window.__newMatch()">重开整场</button>`
      :`<span style="color:var(--gold)">复盘中</span> <button onclick="window.__next()">下一局</button>`;
    bind=null;
  }else if(G.awaitNext){
    stripHTML=`<button onclick="window.__nextTrick()">下一墩 ▶</button>`;
    bind=null;
  }else if(G.phase==='dealing'||G.phase==='finalDecl'){
    const vis=visHand(HUMAN);
    const V=G.decl?T('counterV'):T('declareV');   // 亮/反(沪语:翻/反)
    // 按钮顺序必须稳定:引擎给的 declOptions 是按强度排的,单张升级成对子会重排导致按钮跳位。
    // 这里改成固定花色顺序,再靠右对齐 —— 位置只会往左长,已有按钮不动。
    const btns=[];
    if(canReinforce2(G.decl,HUMAN,vis,rankOf(HUMAN),G.rebelHappened))
      btns.push(`<button data-a="re">${T('reinforce')}${SUIT_SYM[G.decl.suit]}</button>`);
    const jp=jokerPairOf(vis);
    // 王对(最长的一颗「亮无将(大)」—— 按钮定宽以此为准)排在花色左边,位置最靠前
    if(jp&&canOverride(G.decl,jp,HUMAN))
      btns.push(`<button data-a="d" data-s="" data-st="${jp.strength}">${V}${T('noTrump')}(${jp.strength===4?'大':'小'})</button>`);
    declOptions(vis,rankOf(HUMAN)).filter(o=>canOverride(G.decl,o,HUMAN))
      .sort((a,b)=>SUITS.indexOf(a.suit)-SUITS.indexOf(b.suit))
      .forEach(o=>
        btns.push(`<button data-a="d" data-s="${o.suit}" data-st="${o.strength}">${V}${SUIT_SYM[o.suit]}${o.strength===2?'(对)':''}</button>`));
    // 「不亮」不在这条 btns 里——它挪到 #dealerZone 的固定按钮了(见下面 btnSkipDecl),
    // 免得发完最后一张牌它一冒出来就顶到这条不断在长的亮主按钮行上,变成误点。
    stripHTML=btns.length?btns.join(''):`<span>(暂无可${T('declare')}的牌)</span>`;
    // 只绑亮主类按钮([data-a]);「不亮」用自己的 inline onclick,别被这里覆盖掉
    bind=()=>strip.querySelectorAll('button[data-a]').forEach(b=>b.onclick=()=>{
      if(b.dataset.a==='re') applyDecl(HUMAN,{suit:G.decl.suit,strength:2},true);
      else applyDecl(HUMAN,{suit:b.dataset.s||null,strength:+b.dataset.st},false);
    });
  }else if(G.phase==='lowrebel'){
    stripHTML=`<button id="lr1">${rebelName()}</button><button class="minor" id="lr0">不${T('counter')}</button>`;
    bind=()=>{
      document.getElementById('lr1').onclick=()=>humanLowRebel(true);
      document.getElementById('lr0').onclick=()=>humanLowRebel(false);
    };
  }else stripHTML='<span></span>';
  if(strip.__last!==stripHTML){
    strip.innerHTML=stripHTML; strip.__last=stripHTML;
    if(bind) bind();
  }

  const myTurn=!G.ended&&G.phase==='play'&&G.trick.length<4&&(G.leader+G.trick.length)%4===HUMAN;
  /* 托管自己占一颗按钮,落在庄家区(和扣底/看底牌同一区)—— 第一版把它塞进设置里、
   * 让「出牌」改口成「停止托管」,开一次要点三下,实测太不方便。放到桌面上要解决的是
   * 宽度:竖屏那一行原本按最长文案定死 min-width,五颗就挤爆了,所以竖屏改成按文案自适应
   * (见 @media 里的 #controls button)。托管中「出牌/重选/问教练」照旧灰掉 —— 不是不能点,
   * 是这时候本来就没有你要做的决定。 */
  const auto=!!G.auto&&!G.ended;
  const btnAuto=document.getElementById('btnAuto');
  btnAuto.textContent=auto?'停止托管':'托管';
  btnAuto.classList.toggle('minor',!auto);      // 托管中变成醒目色,一眼看得见它开着
  btnAuto.hidden=!(G.phase!=='redealing'&&!G.ended);   // 发牌一开始就在;只有重新发牌的空档收起来
  document.getElementById('btnPlay').disabled=auto||!myTurn;
  document.getElementById('btnClear').disabled=auto||!(G.selected.size>0);
  // 扣底:选够 8 张才可点
  const buryReady=G.phase==='kitty'&&G.selected.size===RULES.kittySize;
  document.getElementById('btnBury').disabled=!buryReady;
  document.getElementById('btnBury').textContent=
    G.phase==='kitty'?`${T('bury')}(${G.selected.size}/${RULES.kittySize})`:T('bury');
  // 看底牌:只有你是庄家、且底牌已扣下才可点
  const canSeeKitty=G.declSeat===HUMAN&&G.buried.length>0;
  document.getElementById('btnKitty').disabled=!canSeeKitty;
  // 扣底/看底牌本局用不上(你不坐庄)就收起来,不留灰按钮占地方(托管那颗另有显隐规则)
  document.getElementById('btnBury').hidden=(G.phase!=='kitty');
  document.getElementById('btnKitty').hidden=!canSeeKitty;
  // 不亮:只在「发完牌、最后机会」这一刻出现,固定占 dealerZone 最左边那个位置
  document.getElementById('btnSkipDecl').hidden=(G.phase!=='finalDecl');
  document.getElementById('btnSkipDecl').textContent='不'+T('declareV');
  document.getElementById('btnHint').disabled=auto||!(C.on&&myTurn);
  // 只在发牌/亮主阶段给发牌区留两行高度,其余时候把这块高度还给牌桌
  document.getElementById('controls').classList.toggle('dealing',
    G.phase==='dealing'||G.phase==='finalDecl');
  renderPanel();
}

// ---- 底部面板 ----
function renderPanel(){
  document.querySelectorAll('#tabs button').forEach(b=>
    b.classList.toggle('on',b.dataset.tab===activeTab));
  const el=document.getElementById('panel');
  if(activeTab==='coach') chatUnread=0;
  const dot=document.getElementById('chatDot');
  if(dot) dot.textContent=chatUnread?String(Math.min(chatUnread,99)):'';
  if(activeTab!=='coach') el.classList.remove('chatMode');
  if(!activeTab){ el.innerHTML='<span style="opacity:.5">点击上方页签展开:抢分记录 / 对局记录 / 教练·笔记 / 记牌表</span>'; return; }
  if(activeTab==='coach'){ renderChatTab(el); return; }
  if(activeTab==='mem'){ renderMemTab(el); return; }
  if(activeTab==='log'){
    if(logRound!=null&&!M.past[logRound]) logRound=null;    // 重开整场后越界的选择
    /* 看的是「哪一局」和「怎么看」两件独立的事,所以是两行:
     * 第一行选局(只有打完过局才出现),第二行选视图。
     * 往回翻的局全都已经结束,初始手牌一律可看 —— 只有当前这局要防开天眼。 */
    let past=logRound!=null?M.past[logRound]:null;
    // 还没开局(只导入了牌谱)时「本局」无可看 —— 退回最近一局导入 / 往局
    if(!past&&!G&&M.past.length){ logRound=M.past.length-1; past=M.past[logRound]; }
    if(!past&&!G){ el.innerHTML='<span style="opacity:.6">还没开局。可以在设置里「导入牌谱」复盘别人发来的一局。</span>'; return; }
    const src=past||{tricks:G.tricks, log:G.log, initialHands:G.initialHands,
                     buried:G.buried, trump:curTrumpForSort(), declSeat:G.declSeat};
    const done=past?true:!!G.ended;
    let html='', seekPaint=null;   // seekPaint:进度条只重画受影响的那块,见下
    if(M.past.length){
      html+=`<div class="toggleRow" style="flex-wrap:wrap">`+
        `<button class="minor${logRound==null?' on':''}" data-lr="cur" style="padding:3px 10px;font-size:13px">本局</button>`+
        M.past.map((r,i)=>`<button class="minor${logRound===i?' on':''}" data-lr="${i}" style="padding:3px 10px;font-size:13px">${r.imported?r.no:`第${r.no}局`}</button>`).join('')+
        `</div>`;
    }
    const MODES=[['event','事件'],['trick','每墩出牌'],['suit','按花色']];
    html+=`<div class="toggleRow">`+MODES.map(([k,label])=>
      `<button class="minor${logMode===k?' on':''}" data-lm="${k}" style="padding:3px 10px;font-size:13px">${label}</button>`).join('')+
      `<button class="minor wideOnly" id="sideWider" style="padding:3px 10px;font-size:13px"`+
      ` title="把右栏拉宽,复盘时看得清楚些">⇔ ${SIDE_NAMES[sideStep]}</button>`+`</div>`;
    if(past){
      const who=past.declSeat%2===HUMAN%2?'你们':'对方';
      html+=`<div class="suitGroup" style="font-size:13px">${past.imported?past.no:`第${past.no}局`}:${SEAT_NAME[past.declSeat]}(${who})坐庄,`+
        `主 ${past.trump.suit?SUIT_SYM[past.trump.suit]:'无主'}${rankName(past.trump.rank)},`+
        `${T('defenders')}得 ${past.defPoints} 分 → ${past.defendersWin?T('defenders')+'上台':'庄家守住'};`+
        `级数 ${past.levelsBefore.map(x=>rankName(Math.min(x,14))).join('/')} → ${past.levelsAfter.map(x=>rankName(Math.min(x,14))).join('/')}</div>`;
    }
    if(logMode==='event'){
      html+=src.log.map(l=>`<div>· ${l.text}</div>`).join('')||'(尚无记录)';
    }else if(logMode==='trick'){
      // 各家初始手牌:只在这一局打完后开放,局中看等于开天眼
      if(src.initialHands){
        html+=done
          ?`<div class="suitGroup"><b style="color:var(--gold)">初始手牌</b>`+
            src.initialHands.map((h,s)=>
              `<div class="trickRow"><span class="who">${SEAT_NAME[s]}${s===src.declSeat?'(庄)':''}</span>`+
              sortForDisplay(h,src.trump).map(c=>cardHTML(c,'mini')).join('')+`</div>`).join('')+
            (src.buried.length?`<div class="trickRow"><span class="who">底牌</span>`+
              sortForDisplay(src.buried,src.trump).map(c=>cardHTML(c,'mini')).join('')+`</div>`:'')+
           `</div>`
          :`<div style="opacity:.6;margin-bottom:4px">(各家初始手牌本局结束后可看)</div>`;
      }
      /* 默认最新一墩在上:局中最常问的是「刚才那墩谁赢的」。
       * 但复盘一局是从第 1 墩顺着看的,所以顺序可以翻;再给一条进度条,
       * 拖到第 N 墩就把那一墩单独按正常尺寸放大 —— mini 尺寸下四家的牌看不清。 */
      const nT=src.tricks.length;
      if(logFocus>nT) logFocus=0;
      const rowOf=(tk,size)=>
        `<div class="trickRow"><span class="who">第${tk.no}墩 ${SEAT_NAME[tk.winner]}赢${tk.points?` +${tk.points}分`:''}</span>`+
        tk.plays.map(p=>`<span style="font-size:11px;color:#9fd6b5">${seatAbbr(p.seat)}:</span>`+
          sortForDisplay(p.cards,src.trump).map(c=>cardHTML(c,size)).join('')).join('')+`</div>`;
      const focusHTML=()=>{
        const tk=src.tricks[logFocus-1];
        // 累计分按「反方拿到的分」算,和局末结算、状态栏是同一个口径
        const acc=src.tricks.slice(0,logFocus).reduce((a,x)=>
          a+(x.winner%2!==src.declSeat%2?x.points:0),0);
        return `<div class="suitGroup">`+rowOf(tk,'')+
          `<div style="opacity:.7;font-size:12px;margin-top:4px">`+
          `领出:${SEAT_NAME[tk.plays[0].seat]} · 打完这墩${T('defenders')}累计 ${acc} 分</div></div>`;
      };
      const listHTML=()=>
        (logAsc?src.tricks.slice():src.tricks.slice().reverse()).map(tk=>rowOf(tk,'mini')).join('')
        ||'(尚无出牌)';
      if(nT){
        html+=`<div class="toggleRow">`+
          `<button class="minor${logAsc?'':' on'}" data-lo="0" style="padding:3px 10px;font-size:13px">最新在上</button>`+
          `<button class="minor${logAsc?' on':''}" data-lo="1" style="padding:3px 10px;font-size:13px">第1墩在上</button>`+
          `</div>`+
          `<div class="trickSeek"><input type="range" id="trkSeek" min="0" max="${nT}" value="${logFocus}" `+
          `aria-label="拖到第几墩"><span id="trkLabel">${logFocus?`第 ${logFocus} 墩`:'全部'}</span></div>`;
        seekPaint=()=>{
          const lab=document.getElementById('trkLabel'), body=document.getElementById('trkBody');
          if(lab) lab.textContent=logFocus?`第 ${logFocus} 墩`:'全部';
          if(body) body.innerHTML=logFocus?focusHTML():listHTML();
        };
      }
      html+=`<div id="trkBody">${nT?(logFocus?focusHTML():listHTML()):'(尚无出牌)'}</div>`;
    }else{
      // 按花色:算哪门还剩什么用的,主牌排最前,门内从大到小
      const all=src.tricks.flatMap(tk=>tk.plays.flatMap(p=>p.cards.map(c=>({c,seat:p.seat,no:tk.no}))));
      if(!all.length) html+='(尚无出牌)';
      else{
        const t=src.trump;
        const groups={};
        all.forEach(x=>{const s=effSuit(x.c,t);(groups[s]=groups[s]||[]).push(x);});
        const gname=s=>s==='T'?T('trump'):SUIT_NAME[s];
        html+=Object.keys(groups).sort((a,b)=>(a==='T'?-1:1)-(b==='T'?-1:1)).map(s=>{
          const sorted=groups[s].sort((a,b)=>ordIdx(b.c,t)-ordIdx(a.c,t));
          return `<div class="suitGroup"><b style="color:var(--gold)">${gname(s)}(${sorted.length}张)</b><br>${sorted.map(x=>cardHTML(x.c,'mini')).join('')}</div>`;
        }).join('');
      }
    }
    el.innerHTML=html;
    el.querySelectorAll('[data-lm]').forEach(b=>b.onclick=()=>{ logMode=b.dataset.lm; renderPanel(); });
    el.querySelectorAll('[data-lr]').forEach(b=>b.onclick=()=>{
      logRound=b.dataset.lr==='cur'?null:+b.dataset.lr; logFocus=0; renderPanel(); });
    el.querySelectorAll('[data-lo]').forEach(b=>b.onclick=()=>{
      logAsc=b.dataset.lo==='1'; renderPanel(); });
    const wbtn=el.querySelector('#sideWider');
    if(wbtn) wbtn.onclick=()=>{
      sideStep=(sideStep+1)%SIDE_STEPS.length;
      try{ localStorage.setItem(LSP+'sidew',sideStep); }catch(e){}
      applySideW(); fitHandRow(); renderPanel(); };
    const sk=el.querySelector('#trkSeek');
    // 只重画标签和牌区,不整块 renderPanel —— innerHTML 一换,正在拖的滑块就被拆掉了
    if(sk&&seekPaint) sk.oninput=()=>{ logFocus=+sk.value; seekPaint(); };
  }else if(activeTab==='score'){
    const pts=G.capturedCards;
    el.innerHTML=`<div style="margin-bottom:6px">抓分方已抓到 <b style="color:var(--gold)">${G.defPoints}</b> 分,分牌如下:</div>`+
      (pts.length?`<div class="trickRow">${pts.map(c=>cardHTML(c,'mini')).join('')}</div>`:'(还没有抓到分牌)');
  }
}

// ---- 记牌表页签(默认蒙住,点开验证;每墩重新蒙上) ----
function renderMemTab(el){
  const inPlay=G.phase==='play'||G.phase==='kitty';
  if(!inPlay){ el.innerHTML='<div style="opacity:.6">开打后这里显示在外大牌统计。</div>'; return; }
  let html='';
  const revealed=C.memShow||G.memRevealTrick===G.tricks.length;
  if(!revealed){
    html+=`<div class="coachBox">🧠 先自己心算:主牌还剩几张?哪几门的分牌还没出?<br>
      <button id="memReveal" style="margin-top:6px">我算好了,点开验证</button></div>`;
    el.innerHTML=html;
    el.querySelector('#memReveal').onclick=()=>{G.memRevealTrick=G.tricks.length;renderPanel();};
    return;
  }
  const t=G.trump, view=viewFor(HUMAN), mem=makeMemory(view);
  const voids=makeVoids(view.history,t);            // 从历史推断谁已确定断门
  const suits=['T','S','H','C','D'].filter(s=>s==='T'||(!t.suit||s!==t.suit));
  html+=suits.map(s=>{
    let cnt=0, top=null;
    const ptBy={};                                   // 分牌明细:rank → 张数
    for(const k in mem.unseen){
      const m=mem.unseen[k]; if(m<=0) continue;
      const c=keyToCard(k);
      if(effSuit(c,t)!==s) continue;
      cnt+=m;
      if(cardPoints(c)>0) ptBy[c.rank]=(ptBy[c.rank]||0)+m;
      if(!top||ordIdx(c,t)>ordIdx(top,t)) top=c;
    }
    const name=s==='T'?T('trump'):SUIT_NAME[s];
    // 你该门最大的一张,以及它是否已经压得住别家(省得自己心算)
    const mine=G.hands[HUMAN].filter(c=>effSuit(c,t)===s);
    const myTop=mine.length?mine.reduce((a,b)=>ordIdx(b,t)>ordIdx(a,t)?b:a):null;
    // 同大小时先出者赢,所以并列最大也算"领出能吃",不能笼统说压不过
    const cmp=myTop?(top?ordIdx(myTop,t)-ordIdx(top,t):1):0;
    const ptTxt=Object.keys(ptBy).sort((a,b)=>b-a).map(r=>`${ptBy[r]}张${rankName(+r)}`).join('、');
    const ptSum=Object.keys(ptBy).reduce((a,r)=>a+cardPoints({rank:+r})*ptBy[r],0);
    const gone=[1,2,3].filter(x=>voids[x]&&voids[x][s]).map(x=>SEAT_NAME[x].replace(/\(.*\)/,'').trim());
    return `<div class="memRow">`+
      `<b style="color:var(--gold)">${name}</b> 别家还剩 <b>${cnt}</b> 张`+
      (cnt?`,最大 ${miniName(top)}`:'(已出尽)')+
      `<div class="memSub">你最大:${myTop?miniName(myTop):'无'}`+
        (myTop?(cmp>0?' <span style="color:#7ee787">— 已是最大,吃得住</span>'
               :cmp===0?' <span style="color:#7ee787">— 并列最大,领出能吃(同大小先出者赢)</span>'
                       :` <span style="color:#ff9d6e">— 压不过 ${miniName(top)}</span>`):'')+`</div>`+
      `<div class="memSub">剩余分牌:${ptSum?`${ptTxt}(共 ${ptSum} 分)`:'无'}</div>`+
      (gone.length?`<div class="memSub">已断门:${gone.join('、')}</div>`:'')+
      `</div>`;
  }).join('');
  html+=`<div style="opacity:.6;margin-top:6px">(「别家还剩」= 三家对手/队友手中 + 底牌,不含你自己的牌;`+
        `底牌${G.declSeat===HUMAN?'你已知,已扣除':'未知,计在其中'})</div>`;
  el.innerHTML=html;
}

// 新界面(v0.7.43,来自打牌 UI 测试页):记牌表搬进抽屉的「六六教练」页签,由表现层画;这里只给数据(口径与 renderMemTab 相同)
window.__memData=()=>{
  if(!G||!(G.phase==='play'||G.phase==='kitty')||G.ended) return null;
  const t=G.trump, view=viewFor(HUMAN), mem=makeMemory(view);
  const voids=makeVoids(view.history,t);
  const REL=['我','下家','对家','上家'];
  const rows=['T','S','H','C','D'].filter(s=>s==='T'||(!t.suit||s!==t.suit)).map(s=>{
    let cnt=0, top=null; const ptBy={};
    for(const k in mem.unseen){
      const m=mem.unseen[k]; if(m<=0) continue;
      const c=keyToCard(k);
      if(effSuit(c,t)!==s) continue;
      cnt+=m;
      if(cardPoints(c)>0) ptBy[c.rank]=(ptBy[c.rank]||0)+m;
      if(!top||ordIdx(c,t)>ordIdx(top,t)) top=c;
    }
    const mine=G.hands[HUMAN].filter(c=>effSuit(c,t)===s);
    const myTop=mine.length?mine.reduce((a,b)=>ordIdx(b,t)>ordIdx(a,t)?b:a):null;
    const cmp=myTop?(top?ordIdx(myTop,t)-ordIdx(top,t):1):0;
    const pts=Object.keys(ptBy).sort((a,b)=>b-a).map(r=>({rank:+r,n:ptBy[r]}));
    const ptSum=pts.reduce((a,x)=>a+cardPoints({rank:x.rank})*x.n,0);
    const gone=[1,2,3].filter(x=>voids[x]&&voids[x][s]).map(x=>REL[x]);
    return {suit:s,name:s==='T'?T('trump'):SUIT_NAME[s],cnt,top,myTop,cmp,pts,ptSum,gone,mine:mine.length};
  });
  return {revealed:!!(C.memShow||G.memRevealTrick===G.tricks.length),kittyKnown:G.declSeat===HUMAN,rows};
};

// ---- 教练·笔记:一个聊天流(v0.7.31) ----
/* 原来是两个页签:「教练」(对话历史最新在上、quiz 置顶)和「笔记」(输入框在上、列表倒序)。
 * 合成一个标准消息界面:新消息在最下面、旧的往上叠,输入框钉在底部。
 *   · 你发的是笔记(右侧气泡),照旧存 localStorage、标局数、留最近 100 条;
 *   · 问教练、教练提问、失误提醒、复盘都是教练发的消息(左侧气泡);
 *   · 教练消息只在内存里,整场重开或刷新就没了 —— 和原来一样;刷新后笔记还在,排在最上面。
 * 两个老毛病顺手修了:
 *   · render() 每出一张牌都整块重画右栏,笔记打到一半就被清空。现在输入框只建一次,之后只重画消息区;
 *   · 中文输入法选字时按回车会把半截拼音当笔记发出去(isComposing)。 */
let chat=[], chatSeq=0, chatUnread=0, chatDraft='', chatSeen=0;
chat=notes.map(n=>({id:++chatSeq,from:'me',r:n.r,t:n.t,old:true}));
chatSeen=chatSeq;
function chatPush(m){
  m.id=++chatSeq;
  if(m.r==null) m.r=M.round+1;
  chat.push(m);
  if(chat.length>400) chat.splice(0,chat.length-400);
  if(m.from!=='me'&&activeTab!=='coach') chatUnread++;
  return m;
}
function coachSay(no,html,kind){ return chatPush({from:'coach',no,html,kind:kind||''}); }
const escHTML=t=>String(t).replace(/[<>&"]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));

function chatItemHTML(m){
  if(m.from==='me')
    return `<div class="msg me${m.old?' old':''}">${escHTML(m.t)}</div>`;
  const meta=m.no?`<div class="meta">第${m.no}墩</div>`:'';
  let body=m.html;
  if(m.kind==='quiz'){
    const q=m.quiz;
    if(q.state==='open')
      body+=`<div class="qz">`+q.choices.map((c,i)=>`<button class="minor" data-qz="${i}" data-mid="${m.id}">${c}</button>`).join('')+
        `<button class="minor skip" data-qz="-1" data-mid="${m.id}">跳过问题看建议</button></div>`;
    else if(q.state==='expired') body+=`<div class="dim">(这墩已经打完了)</div>`;
  }
  const cls=m.kind==='warn'?' warn':m.kind==='doubt'?' doubt':m.kind==='intro'?' intro':'';
  return `<div class="msg coach${cls}">${meta}${body}</div>`;
}
function chatLogHTML(){
  if(!chat.length){
    return chatItemHTML({from:'coach',kind:'intro',html:C.on
      ?'我是教练。轮到你出牌时点「问教练」(下面左边这颗,牌桌上也有):我先考你一道和这手牌有关的题,'+
       '答完或跳过就告诉你答案和建议;出现大失误我会提醒,局末复盘关键回合。<br>'+
       '这里也是你的笔记本:在下面记一笔,存在这台设备上。'
      :'教练已关(设置 → 教练 可以打开)。这里照样可以记笔记,存在这台设备上。'});
  }
  let h='', lastR=undefined, prevOld=false;
  for(const m of chat){
    if(m.old&&!prevOld&&lastR===undefined){ h+=`<div class="chatSep">以前记的笔记</div>`; lastR=null; }
    // 局号变了、或者从「以前的笔记」过渡到这一场,都插一条分隔
    if(m.r&&(m.r!==lastR||(prevOld&&!m.old))){ h+=`<div class="chatSep">第 ${m.r} 局</div>`; lastR=m.r; }
    prevOld=!!m.old;
    h+=chatItemHTML(m);
  }
  return h;
}
function renderChatTab(el){
  if(!el.classList.contains('chatMode')||!document.getElementById('chatLog')){
    el.classList.add('chatMode');
    el.innerHTML=`<div id="chatLog" aria-label="教练与笔记"></div>`+
      `<button id="chatNew" class="minor" hidden>↓ 新消息</button>`+
      `<div id="chatBar"><button id="chatAsk" title="轮到你出牌时可以问">问教练</button>`+
      `<input id="chatInput" placeholder="记一笔……什么牌值得记下？" maxlength="120" `+
      `aria-label="记一笔笔记" autocomplete="off"><button id="chatSend">发送</button></div>`;
    const inp=el.querySelector('#chatInput'), logEl=el.querySelector('#chatLog');

/* 把 n 张(已理好的)牌切成 r 行:尽量切在有效花色的分界上,差得太多就按张数平分 */
function splitRows(groups,r){
  var n=groups.length;if(r<=1||n<=1)return [n];
  var target=n/r,cuts=[],sizes=[],start=0;
  for(var k=1;k<r;k++){
    var ideal=Math.round(target*k),best=-1,bd=1e9;
    for(var i=start+1;i<n;i++){
      if(groups[i]!==groups[i-1]){var d=Math.abs(i-ideal);if(d<bd){bd=d;best=i;}}
    }
    if(best<0||bd>1)best=ideal;      /* 分界离平分点超过一张就不迁就花色,免得一行太长挤不下 */
    best=clamp(best,start+1,n-(r-k));
    cuts.push(best);start=best;
  }
  var prev=0;cuts.concat([n]).forEach(function(c){sizes.push(c-prev);prev=c;});

function planHand(groups,W,H,cfg,planN){

        el.style.transition='none';el.style.transform=from||tf;

        lastTf[el.dataset.id]=tf;
        el.style.zIndex=String(ri*100+i+1);decorateHandCard(el,sel);
        return;
      }
      lastTf[el.dataset.id]=tf;
      el.style.transform=tf;
      el.style.zIndex=String(ri*100+i+1);
      decorateHandCard(el,sel);
    });
  });
  $('handPan').value=Math.round(L.progress*1000);
  if(!flushQueued){flushQueued=true;requestAnimationFrame(function(){requestAnimationFrame(function(){
    flushQueued=false;
    Array.prototype.forEach.call(hand.children,function(el){el.style.transition='';});
    pendingTf.splice(0).forEach(function(x){if(!x[0].isConnected)return;
      if(x[2]){var el=x[0];el.style.transition='transform .42s var(--ease-out),opacity .18s linear';el.style.opacity='';
        setTimeout(function(){el.style.transition='';},460);}
      x[0].style.transform=lastTf[x[0].dataset.id]||x[1];});
  });});}
}
var lastTf={},pendingTf=[],flushQueued=false;
var reduceMotion=!!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches);
/* 牌堆在桌心:换算成手牌坐标系里的起点(缩小、略转) */
function deckFrom(plan){
  var hr=hand.getBoundingClientRect(),ar=arena.getBoundingClientRect();
  var x=ar.left+ar.width/2-hr.left-plan.cw/2,y=ar.top+ar.height/2-hr.top-plan.ch/2;
  return 'translate('+x.toFixed(1)+'px,'+y.toFixed(1)+'px) scale(.55) rotate(-10deg)';
}
var SUIT_ARIA={sS:'黑桃',sH:'红桃',sD:'方块',sC:'梅花'};
function decorateHandCard(el,sel){
  if(!el.hasAttribute('role')){
    var cls=Object.keys(SUIT_ARIA).find(function(k){return el.classList.contains(k);});
    var tl=el.querySelector('.tl');
    el.setAttribute('role','button');el.tabIndex=0;
    el.setAttribute('aria-label',cls?SUIT_ARIA[cls]+(tl?tl.textContent:''):(el.classList.contains('jb')?'大王':'小王'));
