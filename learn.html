<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>80分教学 · 第一单元</title>
<style>
/* ============================================================
   80分教学版 —— 原型 v0.0.2
   视觉语言对照 Duolingo 国际象棋课的真实界面:
     顶栏 X + 细进度条 / 题型行 + 角色气泡指令 / 关键词高亮 /
     「新规则」徽章 / 底部 小圆提示钮 + 宽 CTA / 底部滑入反馈条 /
     蜿蜒关卡路径 + 单元 banner。
   牌面沿用正式版 index.html 的四色牌与「牌宽是唯一标尺」的做法。
   ============================================================ */
:root{
  --green:#58CC02; --green-rim:#58A700; --green-bg:#D7FFB8; --green-tx:#4B9B00;
  --red:#FF4B4B;   --red-rim:#EA2B2B;   --red-bg:#FFDFE0;   --red-tx:#EA2B2B;
  --blue:#1CB0F6;  --blue-rim:#1899D6;  --blue-bg:#DDF4FF;
  --purple:#CE82FF; --purple-tx:#A560E8;
  --yellow:#FFC800;
  --tx:#3C3C3C; --tx2:#777777; --line:#E5E5E5; --dis:#E5E5E5; --dis-tx:#AFAFAF;
  --page:#FFFFFF; --felt:#F1F7F3;

  /* 牌宽是唯一标尺。教学版一屏只有 2~8 张牌,给得比正式版大得多 —— 看得清是学习的前提 */
  --cardW:clamp(50px,14.5vw,72px);
  --cardH:calc(var(--cardW)*1.44);
  --fs:clamp(15px,4vw,17px);
}
@media (max-height:680px){ :root{--cardW:clamp(42px,12vw,58px)} }
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{background:var(--page);color:var(--tx);overflow:hidden;
  font:600 var(--fs)/1.45 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif}
#app{height:100svh;display:flex;flex-direction:column;max-width:560px;margin:0 auto;position:relative;overflow:hidden}

/* ---------- 实体感按钮(下沿 4px,按下时下沉) ---------- */
.btn{display:block;width:100%;border:0;border-radius:16px;padding:14px 20px;
  font:800 clamp(15px,4.2vw,17px)/1.2 inherit;letter-spacing:.5px;color:#fff;
  background:var(--green);border-bottom:4px solid var(--green-rim);cursor:pointer}
.btn:active:not(:disabled){transform:translateY(4px);border-bottom-width:0;margin-bottom:4px}
.btn:disabled{background:var(--dis);color:var(--dis-tx);border-bottom-color:#D0D0D0;cursor:default}
.rnd{width:52px;height:52px;flex:none;border-radius:14px;border:2px solid var(--line);border-bottom-width:4px;
  background:#fff;font-size:22px;cursor:pointer;display:grid;place-items:center;color:var(--blue)}
.rnd:active{transform:translateY(3px);border-bottom-width:1px}
.rnd:disabled{opacity:.4;cursor:default}

/* ---------- 顶栏 ---------- */
#top{display:flex;align-items:center;gap:14px;padding:12px 16px 6px;flex:none}
#quit{border:0;background:none;color:var(--dis-tx);font-size:26px;line-height:1;cursor:pointer;padding:0 2px}
#bar{flex:1;height:14px;background:var(--line);border-radius:7px;overflow:hidden}
#barIn{height:100%;width:0;background:var(--green);border-radius:7px;position:relative;
  transition:width .35s cubic-bezier(.4,0,.2,1)}
#barIn::after{content:"";position:absolute;left:7px;right:7px;top:3px;height:3px;border-radius:2px;background:rgba(255,255,255,.4)}

/* ---------- 题型行 + 新规则徽章 ---------- */
#badge{padding:4px 18px 0;flex:none}
#badge span{display:inline-flex;align-items:center;gap:6px;color:var(--purple-tx);
  font:800 11px/1 inherit;letter-spacing:1.2px}
#badge span::before{content:"";width:14px;height:14px;border-radius:50%;background:var(--purple)}
#task{padding:2px 18px 8px;font:800 clamp(18px,5vw,21px)/1.3 inherit;flex:none}

/* ---------- 教练 + 气泡 ---------- */
#coach{display:flex;align-items:flex-start;gap:8px;padding:0 18px 8px;flex:none}
#face{width:56px;height:56px;flex:none}
#bub{position:relative;background:#fff;border:2px solid var(--line);border-radius:14px;
  padding:9px 13px;font:600 clamp(13px,3.7vw,15px)/1.4 inherit;flex:1}
#bub::before,#bub::after{content:"";position:absolute;top:16px;border:8px solid transparent}
#bub::before{left:-16px;border-right-color:var(--line)}
#bub::after{left:-13px;border-right-color:#fff}
#bub b{color:var(--purple-tx)}                 /* 关键词高亮 */
#bub .term{color:var(--purple-tx);border-bottom:2px dotted var(--purple);cursor:help}

/* ---------- 牌桌 ---------- */
#table{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:10px;padding:2px 12px}

.seatmap{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:min(300px,88%);place-items:center}
.seatbtn{border:2px solid var(--line);border-bottom-width:4px;border-radius:14px;background:#fff;
  padding:10px 4px;width:100%;font:800 14px/1.25 inherit;color:var(--tx);cursor:pointer}
.seatbtn small{display:block;font-weight:700;font-size:11px;color:var(--tx2);margin-top:3px}
.seatbtn.me{background:var(--felt);cursor:default;border-color:#CFE3D7}
.seatbtn.sel{border-color:var(--blue);background:var(--blue-bg);color:#1179A8}
.seatbtn.ok{border-color:var(--green);background:var(--green-bg);color:var(--green-tx)}
.seatbtn.no{border-color:var(--red);background:var(--red-bg);color:var(--red-tx)}
.arrowbox{font:700 11px/1.3 inherit;color:var(--tx2);text-align:center}

.trick{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;width:100%;max-width:330px;
  place-items:center;background:var(--felt);border-radius:18px;padding:8px 4px}
.slot{display:flex;flex-direction:column;align-items:center;gap:3px;justify-content:center;
  min-height:calc(var(--cardH) + 18px)}
.slot .who{font:700 11px/1 inherit;color:var(--tx2);white-space:nowrap}
.slot.mine .who,.slot.mate .who{color:var(--green-tx)}
.slot .who.win{background:var(--yellow);color:#5a4200;border-radius:5px;padding:2px 6px}
.slot .ph{width:var(--cardW);height:var(--cardH);border-radius:7px;border:2px dashed #CCDCD2}
.tcenter{grid-column:2;font:700 11px/1.35 inherit;color:var(--tx2);text-align:center}

.pile{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:330px}
.opts{display:flex;flex-direction:column;gap:9px;width:100%;max-width:330px}
.opt{border:2px solid var(--line);border-bottom-width:4px;border-radius:14px;background:#fff;
  padding:12px 15px;font:700 clamp(14px,4vw,16px)/1.3 inherit;color:var(--tx);cursor:pointer;text-align:left}
.opt.sel{border-color:var(--blue);background:var(--blue-bg);color:#1179A8}
.opt.ok{border-color:var(--green);background:var(--green-bg);color:var(--green-tx)}
.opt.no{border-color:var(--red);background:var(--red-bg);color:var(--red-tx)}

/* ---------- 牌 ---------- */
.card{position:relative;display:inline-block;width:var(--cardW);height:var(--cardH);flex:none;
  background:#fff;color:#111;border-radius:7px;border:1.5px solid #C8C8C8;font-weight:800;
  user-select:none;box-shadow:0 2px 0 rgba(0,0,0,.10);vertical-align:top}
.card.sS{color:#141414} .card.sH{color:#c0392b} .card.sD{color:#b0185c} .card.sC{color:#0a3b23}
.card .tl{position:absolute;top:3px;left:5px;font-size:calc(var(--cardW)*.40);line-height:1}
.card .bl{position:absolute;bottom:3px;left:5px;font-size:calc(var(--cardW)*.38);line-height:1}
.card .pt{position:absolute;right:3px;bottom:3px;font-size:calc(var(--cardW)*.25);line-height:1;
  background:var(--yellow);color:#5a4200;border-radius:5px;padding:2px 4px;font-weight:800}
  /* 角标只能放右下:左上是点数(「10」占两个字宽)、左下是花色 */
.card.pick{cursor:pointer;transition:transform .1s}
.card.sel{transform:translateY(-13px);box-shadow:0 2px 0 rgba(0,0,0,.10),0 0 0 3px var(--blue)}
.card.ok{box-shadow:0 2px 0 rgba(0,0,0,.1),0 0 0 3px var(--green)}
.card.no{box-shadow:0 2px 0 rgba(0,0,0,.1),0 0 0 3px var(--red);opacity:.6}
.card.dim{opacity:.35}
.card.hint{box-shadow:0 2px 0 rgba(0,0,0,.1),0 0 0 3px var(--yellow)}
.card.played{animation:playIn .3s cubic-bezier(.2,.9,.3,1.3)}
@keyframes playIn{from{transform:translateY(24px) scale(.85);opacity:0}to{transform:none;opacity:1}}
.flyer{position:fixed;z-index:60;transition:transform .5s cubic-bezier(.5,0,.6,1),opacity .5s;pointer-events:none}

#hand{flex:none;display:flex;justify-content:center;gap:8px;padding:8px 12px 2px;
  min-height:calc(var(--cardH) + 20px)}

/* ---------- 底部 ---------- */
#foot{flex:none;display:flex;gap:12px;align-items:center;
  padding:8px 16px calc(10px + env(safe-area-inset-bottom));border-top:2px solid var(--line);background:#fff}
#foot .btn{flex:1}
#fb{position:absolute;left:0;right:0;bottom:0;transform:translateY(115%);z-index:40;
  padding:14px 16px calc(12px + env(safe-area-inset-bottom));border-radius:20px 20px 0 0;
  transition:transform .28s cubic-bezier(.2,.9,.3,1)}
#fb.show{transform:none}
#fb.good{background:var(--green-bg)} #fb.bad{background:var(--red-bg)}
#fbTitle{font:800 clamp(17px,4.6vw,19px)/1.2 inherit;margin-bottom:5px}
#fbText{font:600 clamp(13px,3.6vw,15px)/1.45 inherit;margin-bottom:11px}
#fb.good #fbTitle,#fb.good #fbText{color:var(--green-tx)}
#fb.bad  #fbTitle,#fb.bad  #fbText{color:var(--red-tx)}
#fbRow{display:flex;gap:12px;align-items:center}
#fbRow .btn{flex:1}
#fb.bad .btn{background:var(--red);border-bottom-color:var(--red-rim)}
#fb.good .rnd{border-color:#B7E88A;color:var(--green-tx);background:#fff}
#fb.bad  .rnd{border-color:#FFC2C4;color:var(--red-tx);background:#fff}

/* ---------- 地图 / 完成页 ---------- */
.page{position:absolute;inset:0;background:var(--page);z-index:50;display:flex;flex-direction:column;
  overflow-y:auto;-webkit-overflow-scrolling:touch}
.page.hide{display:none}
.unithead{margin:14px 16px 4px;background:var(--green);color:#fff;border-radius:16px;
  padding:13px 18px;border-bottom:4px solid var(--green-rim);flex:none}
.unithead small{display:block;font:800 11px/1 inherit;letter-spacing:1.4px;opacity:.92;margin-bottom:5px}
.unithead b{font-size:19px}
.path{padding:52px 0 48px;flex:none}
.step{display:flex;justify-content:center;position:relative}
.node{width:76px;height:68px;border-radius:50%;border:0;background:var(--green);
  border-bottom:8px solid var(--green-rim);color:#fff;font-size:27px;cursor:pointer;
  display:grid;place-items:center;position:relative}
.node:active{transform:translateY(5px);border-bottom-width:3px}
.node.lock{background:var(--dis);border-bottom-color:#CFCFCF;color:#fff;cursor:default}
.node.done{background:var(--yellow);border-bottom-color:#E0A500}
.tip{position:absolute;top:-42px;left:50%;transform:translateX(-50%);background:#fff;
  color:var(--green-tx);border:2px solid var(--line);border-radius:12px;font:800 12px/1 inherit;
  padding:8px 12px;white-space:nowrap;animation:bob 1.5s ease-in-out infinite}
.tip::after{content:"";position:absolute;bottom:-8px;left:50%;margin-left:-6px;
  border:6px solid transparent;border-top-color:#fff}
@keyframes bob{0%,100%{transform:translateX(-50%)}50%{transform:translateX(-50%) translateY(-5px)}}
.dots{display:flex;gap:4px;justify-content:center;margin-top:7px}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--line);display:block}
.dots i.on{background:var(--yellow)}
.lbl{text-align:center;font:700 12px/1.3 inherit;color:var(--tx2);margin-top:6px}
#done{align-items:center;justify-content:center;text-align:center;padding:24px;gap:2px}
#done .big{font-size:62px}
#done h2{font:800 25px/1.2 inherit;color:var(--green-tx);margin:8px 0 2px}
#done p{color:var(--tx2);font-weight:600;margin:0 0 20px}
.stats{display:flex;gap:12px;margin-bottom:24px}
.stat{border:2px solid var(--yellow);border-radius:14px;padding:8px 20px;min-width:100px}
.stat b{display:block;font-size:22px;color:#B58900}
.stat small{font-size:11px;color:var(--tx2);font-weight:800;letter-spacing:1px}
</style>
</head>
<body>
<div id="app">

  <div class="page" id="map">
    <div class="unithead"><small>第一部 · 会打一墩</small><b>单元 1 · 你和你的搭档</b></div>
    <div class="path" id="path"></div>
  </div>

  <div id="top">
    <button id="quit" title="退出">&times;</button>
    <div id="bar"><div id="barIn"></div></div>
  </div>
  <div id="badge"></div>
  <div id="task"></div>
  <div id="coach">
    <svg id="face" viewBox="0 0 64 64" aria-hidden="true">
      <ellipse cx="32" cy="60" rx="19" ry="9" fill="#F7C6A0"/>
      <circle cx="32" cy="34" r="20" fill="#F7C6A0"/>
      <path d="M11 30c0-13 42-13 42 0 0 3-42 3-42 0z" fill="#2F6B4F"/>
      <path d="M9 30h46a2 2 0 0 1 0 4H9a2 2 0 0 1 0-4z" fill="#245640"/>
      <circle cx="25" cy="36" r="2.6" fill="#3C3C3C"/><circle cx="39" cy="36" r="2.6" fill="#3C3C3C"/>
      <path d="M25 45q7 5 14 0" stroke="#3C3C3C" stroke-width="2.6" fill="none" stroke-linecap="round"/>
    </svg>
    <div id="bub"></div>
  </div>
  <div id="table"></div>
  <div id="hand"></div>
  <div id="foot">
    <button class="rnd" id="hintBtn" title="问教练">💡</button>
    <button class="btn" id="cta" disabled>检查</button>
  </div>

  <div id="fb">
    <div id="fbTitle"></div>
    <div id="fbText"></div>
    <div id="fbRow">
      <button class="rnd" id="whyBtn" title="为什么">?</button>
      <button class="btn" id="fbBtn">继续</button>
    </div>
  </div>

  <div class="page hide" id="done">
    <div class="big">🎉</div>
    <h2>这一课通关了</h2>
    <p>你已经看得懂一墩牌了</p>
    <div class="stats">
      <div class="stat"><b id="sAcc">—</b><small>正确率</small></div>
      <div class="stat"><b id="sTime">—</b><small>用时</small></div>
    </div>
    <button class="btn" id="doneBtn" style="max-width:300px">继续</button>
  </div>
</div>

<script>
(function(){
'use strict';

/* ================= 牌与术语 ================= */
const SYM={S:'♠',H:'♥',D:'♦',C:'♣'};
const PTS={5:5,10:10,13:10};
const RS=r=>r>10?({11:'J',12:'Q',13:'K',14:'A'})[r]:String(r);
const C=(s,r,i)=>({suit:s,rank:r,id:s+r+(i||0)});
const H=(r,i)=>C('H',r,i);
const pts=c=>PTS[c.rank]||0;
function cardHTML(c,cls,showPt){
  const p=pts(c);
  return `<div class="card s${c.suit} ${cls||''}" data-id="${c.id}">`+
    `<span class="tl">${RS(c.rank)}</span><span class="bl">${SYM[c.suit]}</span>`+
    (showPt&&p?`<span class="pt">${p}</span>`:'')+`</div>`;
}
const SEAT=['南','东','北','西'];
const isUs=s=>s%2===0;
const nameOf=s=>SEAT[s]+(s===0?'(你)':s===2?'(队友)':'');

/* ================= 第一课 =================
   每题 {badge?, task, prompt, hint, ...}
   task   = 题型行(短)     prompt = 教练气泡里的指令
   badge  = 「新规则」徽章  hint   = 💡 给出的提示
*/
const LESSON={ qs:[

{ type:'seat', badge:'新概念',
  task:'认认人',
  prompt:'四个人两两搭档。你坐<b>南</b>边 —— 谁是你的队友?',
  hint:'队友不在你旁边。',
  answer:2,
  good:'对。<b>坐你对面</b>的是队友,左右两家都是对手。',
  bad:'不对。左右两家是对手,<b>坐你对面</b>的那家才是队友。' },

{ type:'multi', badge:'新概念',
  task:'挑出分牌',
  prompt:'一副牌里只有<b>三种牌算分</b>。把有分的都点出来。',
  hint:'一共三张。最大的那张 A 不算分。',
  cards:[H(3),H(5),H(9),H(13),H(10),H(14)],
  answer:['H50','H130','H100'],
  good:'对。<b>5 算 5 分,10 和 K 各算 10 分</b>,其余的牌一分没有。',
  bad:'有分的只有三种:<b>5(5分)、10(10分)、K(10分)</b>。A 再大也不算分。' },

{ type:'choice',
  task:'算一算',
  prompt:'这三张牌一共多少分?',
  hint:'K 和 10 都是 10 分。',
  cards:[H(13),H(5),H(10)], showPt:true,
  opts:['15 分','20 分','25 分','30 分'], answer:2,
  good:'对。10 + 5 + 10 = <b>25 分</b>。',
  bad:'再数一次:K 算 <b>10</b>、5 算 <b>5</b>、10 算 <b>10</b> —— 合起来 25 分。' },

{ type:'choice', badge:'新规则',
  task:'谁收这一墩',
  prompt:'四家各出一张牌,叫做一<span class="term">墩</span>。这一墩谁收走?',
  hint:'大家出的都是红桃 —— 只要比点数。',
  simplify:'本关:所有人手里只有红桃',
  played:[H(7),H(13),H(4),H(9)],
  opts:['南(你)','东','北(队友)','西'], answer:1,
  good:'对。出的是同一门,<b>最大的那张收走这一墩</b>。',
  bad:'比点数:7 / K / 4 / 9 —— <b>K 最大</b>,东家收走。' },

{ type:'choice', badge:'新规则',
  task:'这分算谁的',
  prompt:'刚才那一墩里有 10 分,被<b>东家</b>收走了。这 10 分算谁的?',
  hint:'想想谁和东家是一队的。',
  played:[H(7),H(13),H(4),H(9)], showPt:true,
  opts:['算东家一个人的','算东、西两家的','算你和北家的','谁都不算'], answer:1,
  good:'对。<b>分是算一队的,不算个人的。</b>东和西是一队,这 10 分进他们队的账。',
  bad:'80分是<b>两队</b>在打 —— 东家收的分,和他队友西家记同一本账。' },

{ type:'trickpick',
  task:'出一张牌',
  prompt:'轮到你了(你是最后一家)。出一张<b>能收走这一墩</b>的牌。',
  hint:'先看场上最大的是哪张。',
  simplify:'本关:所有人手里只有红桃',
  played:[null,H(9),H(3),H(6)], lead:1,
  hand:[H(4),H(12),H(2)], answer:'H120',
  good:'对!<b>♥Q 比场上最大的 ♥9 还大</b>,这一墩归你。',
  bad:'场上最大的是 <b>♥9</b>。你手里只有 <b>♥Q</b> 压得过它 —— 出小牌收不走。' },

{ type:'trickpick', badge:'新技巧',
  task:'出一张牌',
  prompt:'队友的 <b>♥A</b> 已经最大,谁也压不过了。你出哪张<b>最划算</b>?',
  hint:'队友赢定了 —— 那就往这一墩里放分。',
  simplify:'本关:所有人手里只有红桃',
  played:[null,H(8),H(14),H(3)], lead:1,
  hand:[H(2),H(5)], showPt:true, answer:'H50',
  good:'漂亮。队友反正赢定了,你把 <b>♥5 的 5 分</b>递给他 —— 这 5 分就进了你们队的账。这叫<span class="term">贴分</span>。',
  bad:'队友已经赢定了。这时候出 <b>♥5(5分)</b>,分就进你们队;出 ♥2 白白浪费一次机会。' },

{ type:'mini',
  task:'连打两墩',
  prompt:'自己打两墩看看。轮到你的时候,点一张牌出。',
  hint:'能压就压;压不过、又是队友最大,就把分贴进去。',
  simplify:'本关:所有人手里只有红桃',
  hands:[[H(13),H(6)],[H(11),H(4)],[H(5),H(9)],[H(10),H(3)]], lead:0,
  good:'一墩牌的规矩就这些了 —— <b>同一门里最大的收走,分算一队的。</b>' },
]};

/* ================= 运行时 ================= */
const $=id=>document.getElementById(id);
const LS='80fenlearn-';
let qi=0,sel=null,selMulti=[],answered=false,wrong=0,t0=0,mini=null,hinted=false;

const addCls=(el,c)=>{ if(c) el.classList.add(c); };   // classList.add('') 会抛 InvalidCharacterError
const QUI=['top','badge','task','coach','table','hand','foot'];
function show(p){
  $('map').classList.toggle('hide',p!=='map');
  $('done').classList.toggle('hide',p!=='done');
  QUI.forEach(id=>$(id).style.visibility = p==='q'?'visible':'hidden');
}

/* ---------- 地图:蜿蜒路径 ---------- */
const OFFS=[0,-56,-82,-56,0,56,82,56];   // 左右交替,像 Duolingo 那条蜿蜒的路
function drawMap(){
  const done=+(localStorage.getItem(LS+'u1l1')||0);
  const rows=[
    {icon:done?'★':'🃏',cls:done?'done':'',lbl:'1 · 你和你的搭档',tip:!done,dots:done?3:0,go:start},
    {icon:'🔒',cls:'lock',lbl:'2 · 有这门必须跟'},
    {icon:'🔒',cls:'lock',lbl:'3 · 主牌是哪些'},
    {icon:'🔒',cls:'lock',lbl:'4 · 垫还是毙'},
  ];
  $('path').innerHTML=rows.map((r,i)=>
    `<div class="step" style="margin:${i?18:0}px 0 0;transform:translateX(${OFFS[i%OFFS.length]}px)">
       <div>
         <button class="node ${r.cls}" ${r.go?`id="n${i}"`:''}>${r.icon}${r.tip?'<span class="tip">开始</span>':''}</button>
         ${r.dots?`<div class="dots">${[0,1,2].map(k=>`<i class="${k<r.dots?'on':''}"></i>`).join('')}</div>`:''}
         <div class="lbl">${r.lbl}</div>
       </div>
     </div>`).join('');
  if($('n0')) $('n0').onclick=rows[0].go;
}

/* ---------- 出牌区 ---------- */
function trickHTML(played,lead,winner,showPt){
  const cell=s=>{
    const c=played[s];
    return `<div class="slot ${s===0?'mine':s===2?'mate':''}" data-seat="${s}">`+
      `<div class="who ${winner===s?'win':''}">${nameOf(s)}</div>`+
      (c?cardHTML(c,'played',showPt):'<div class="ph"></div>')+`</div>`;
  };
  return `<div class="trick"><div></div>${cell(2)}<div></div>`+
    `${cell(3)}<div class="tcenter">${lead!=null?SEAT[lead]+' 领出':''}</div>${cell(1)}`+
    `<div></div>${cell(0)}<div></div></div>`;
}

/* ---------- 渲染 ---------- */
function render(){
  const q=LESSON.qs[qi];
  sel=null;selMulti=[];answered=false;hinted=false;
  $('barIn').style.width=(qi/LESSON.qs.length*100)+'%';
  $('badge').innerHTML=q.badge?`<span>${q.badge}</span>`:'';
  $('task').textContent=q.task;
  $('bub').innerHTML=q.prompt+(q.simplify?`<br><small style="color:#777">(${q.simplify})</small>`:'');
  $('hand').innerHTML='';$('fb').className='';
  $('cta').textContent='检查';$('cta').disabled=true;
  $('hintBtn').disabled=!q.hint;$('foot').style.display='';$('cta').style.display='';

  if(q.type==='seat'){
    $('table').innerHTML=`<div class="seatmap">
      <div></div><button class="seatbtn" data-s="2">北<small>?</small></button><div></div>
      <button class="seatbtn" data-s="3">西<small>?</small></button>
      <div class="arrowbox">牌桌</div>
      <button class="seatbtn" data-s="1">东<small>?</small></button>
      <div></div><button class="seatbtn me">南<small>你</small></button><div></div></div>`;
    $('table').querySelectorAll('.seatbtn[data-s]').forEach(b=>b.onclick=()=>{
      if(answered)return;
      $('table').querySelectorAll('.seatbtn').forEach(x=>x.classList.remove('sel'));
      b.classList.add('sel');sel=+b.dataset.s;$('cta').disabled=false;});
  }
  else if(q.type==='multi'){
    $('table').innerHTML=`<div class="pile">${q.cards.map(c=>cardHTML(c,'pick')).join('')}</div>`;
    $('table').querySelectorAll('.card').forEach(n=>n.onclick=()=>{
      if(answered)return;
      const i=selMulti.indexOf(n.dataset.id);
      if(i<0){selMulti.push(n.dataset.id);n.classList.add('sel');}
      else{selMulti.splice(i,1);n.classList.remove('sel');}
      $('cta').disabled=!selMulti.length;});
  }
  else if(q.type==='choice'){
    const top=q.played?trickHTML(q.played,null,null,q.showPt)
             :q.cards?`<div class="pile">${q.cards.map(c=>cardHTML(c,'',q.showPt)).join('')}</div>`:'';
    $('table').innerHTML=top+`<div class="opts">${q.opts.map((o,i)=>`<button class="opt" data-i="${i}">${o}</button>`).join('')}</div>`;
    $('table').querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
      if(answered)return;
      $('table').querySelectorAll('.opt').forEach(x=>x.classList.remove('sel'));
      b.classList.add('sel');sel=+b.dataset.i;$('cta').disabled=false;});
  }
  else if(q.type==='trickpick'){
    $('table').innerHTML=trickHTML(q.played,q.lead,null,q.showPt);
    $('hand').innerHTML=q.hand.map(c=>cardHTML(c,'pick',q.showPt)).join('');
    $('hand').querySelectorAll('.card').forEach(n=>n.onclick=()=>{
      if(answered)return;
      $('hand').querySelectorAll('.card').forEach(x=>x.classList.remove('sel'));
      n.classList.add('sel');sel=n.dataset.id;$('cta').disabled=false;});
  }
  else if(q.type==='mini') startMini(q);
}

/* ---------- 判分 ---------- */
function check(){
  const q=LESSON.qs[qi];let ok;
  if(q.type==='seat'){
    ok=sel===q.answer;
    $('table').querySelectorAll('.seatbtn[data-s]').forEach(b=>{
      const s=+b.dataset.s;b.classList.remove('sel');
      addCls(b, s===q.answer?'ok':s===sel?'no':'');
      b.querySelector('small').textContent=s===q.answer?'队友':'对手';});
  } else if(q.type==='multi'){
    ok=selMulti.length===q.answer.length&&q.answer.every(a=>selMulti.includes(a));
    $('table').querySelectorAll('.card').forEach(n=>{
      const isA=q.answer.includes(n.dataset.id);n.classList.remove('sel');
      n.classList.add(isA?'ok':selMulti.includes(n.dataset.id)?'no':'dim');
      if(isA){const c=q.cards.find(x=>x.id===n.dataset.id);
              n.insertAdjacentHTML('beforeend',`<span class="pt">${pts(c)}</span>`);}});
  } else if(q.type==='choice'){
    ok=sel===q.answer;
    $('table').querySelectorAll('.opt').forEach(b=>{
      const i=+b.dataset.i;b.classList.remove('sel');
      addCls(b, i===q.answer?'ok':i===sel?'no':'');});
  } else if(q.type==='trickpick'){
    ok=sel===q.answer;
    $('hand').querySelectorAll('.card').forEach(n=>{
      n.classList.remove('sel','hint');
      addCls(n, n.dataset.id===q.answer?'ok':n.dataset.id===sel?'no':'');});
  }
  answered=true;if(!ok)wrong++;
  feedback(ok,ok?q.good:q.bad);
}
function feedback(ok,text){
  $('fbTitle').textContent=ok?'答对了':'再想想';
  $('fbText').innerHTML=text;
  $('fbBtn').textContent=ok?'继续':'知道了';
  $('whyBtn').style.display=ok?'none':'';
  $('fb').className=(ok?'good':'bad')+' show';
  $('fb').dataset.ok=ok?'1':'0';
}

/* 错了:不扣分、不打断,就地重试同一题面 */
$('fbBtn').onclick=()=>{
  const ok=$('fb').dataset.ok==='1';$('fb').className='';
  if(ok){qi++;qi>=LESSON.qs.length?finish():render();}else render();
};
$('whyBtn').onclick=()=>{ $('fbText').innerHTML=LESSON.qs[qi].bad+'<br><br>'+(LESSON.qs[qi].hint||''); };
$('cta').onclick=()=>{ if(!answered)check(); };
$('hintBtn').onclick=()=>{
  const q=LESSON.qs[qi];if(!q.hint||hinted)return;hinted=true;
  $('bub').innerHTML+=`<br><small style="color:#A560E8">💡 ${q.hint}</small>`;
  $('hintBtn').disabled=true;
};

/* ---------- 小局 ---------- */
function startMini(q){
  mini={hands:q.hands.map(h=>h.slice()),lead:q.lead,played:[null,null,null,null],
        turn:q.lead,score:[0,0],trick:1,busy:false};
  $('foot').style.display='none';paintMini();
  if(mini.turn!==0)setTimeout(aiStep,700);
}
function paintMini(msg){
  const m=mini;
  $('task').innerHTML=msg||`第 ${m.trick} 墩`;
  $('bub').innerHTML=`你们队已经拿到 <b>${m.score[0]}</b> 分。轮到你就点一张牌出。`;
  $('table').innerHTML=trickHTML(m.played,m.lead,null,true);
  $('hand').innerHTML=m.hands[0].map(c=>cardHTML(c,'pick',true)).join('');
  $('hand').querySelectorAll('.card').forEach(n=>n.onclick=()=>{
    // busy:一墩打满之后到下一墩画出来之前,turn 已经绕回 0,但这时候不该再收牌
    if(mini.turn!==0||mini.busy)return;
    playCard(0,mini.hands[0].find(c=>c.id===n.dataset.id));});
}
function playCard(seat,card){
  const m=mini;
  m.hands[seat]=m.hands[seat].filter(c=>c.id!==card.id);
  m.played[seat]=card;m.turn=(m.turn+1)%4;
  const full=m.played.every(Boolean);
  if(full)m.busy=true;
  paintMini();
  setTimeout(full?endTrick:aiStep,700);
}
function aiStep(){
  const m=mini;if(m.turn===0){paintMini();return;}
  const h=m.hands[m.turn].slice().sort((a,b)=>a.rank-b.rank);
  let best=-1,bs=null;
  m.played.forEach((c,s)=>{if(c&&c.rank>best){best=c.rank;bs=s;}});
  let pick;
  if(bs!==null&&bs%2===m.turn%2&&bs!==m.turn)              // 队友暂时最大 → 贴分
    pick=h.slice().sort((a,b)=>pts(b)-pts(a)||a.rank-b.rank)[0];
  else{const w=h.filter(c=>c.rank>best);pick=w.length?w[0]:h[0];}
  playCard(m.turn,pick);
}
function endTrick(){
  const m=mini;let win=0,best=-1;
  m.played.forEach((c,s)=>{if(c.rank>best){best=c.rank;win=s;}});
  const got=m.played.reduce((a,c)=>a+pts(c),0);
  m.score[win%2===0?0:1]+=got;
  flyToWinner(win,()=>{
    $('table').innerHTML=trickHTML(m.played,m.lead,win,true);
    $('task').innerHTML=`${nameOf(win)} 收走`;
    $('bub').innerHTML=got?`这一墩有 <b>${got} 分</b>,${isUs(win)?'进<b>你们队</b>的账。':'被<b>对手</b>拿走了。'}`
                          :'这一墩<b>没有分</b>。';
    setTimeout(()=>{
      if(!m.hands[0].length){          // 打完了:留着最后一墩的牌面,别清空
        $('foot').style.display='';$('cta').style.display='none';answered=true;
        feedback(true,LESSON.qs[qi].good+`<br><br>这两墩你们队拿到 <b>${m.score[0]} 分</b>,对手 <b>${m.score[1]} 分</b>。`);
        return;
      }
      m.played=[null,null,null,null];m.lead=win;m.turn=win;m.trick++;m.busy=false;
      paintMini();if(m.turn!==0)setTimeout(aiStep,700);
    },1400);
  });
}
/* 收墩动画:四张牌飞向赢家 —— 让「谁收走了」变成看得见的事,不是装饰 */
function flyToWinner(win,cb){
  const t=[...$('table').querySelectorAll('.slot')].find(s=>+s.dataset.seat===win).getBoundingClientRect();
  [...$('table').querySelectorAll('.slot .card')].forEach(c=>{
    const r=c.getBoundingClientRect(),f=c.cloneNode(true);
    f.classList.add('flyer');f.classList.remove('played');
    f.style.cssText+=`position:fixed;left:${r.left}px;top:${r.top}px;width:${r.width}px;height:${r.height}px;margin:0`;
    document.body.appendChild(f);
    requestAnimationFrame(()=>{
      f.style.transform=`translate(${t.left-r.left+10}px,${t.top-r.top+8}px) scale(.45)`;
      f.style.opacity='0';});
    setTimeout(()=>f.remove(),520);
  });
  setTimeout(cb,540);
}

/* ---------- 起止 ---------- */
function start(){qi=0;wrong=0;t0=Date.now();$('cta').style.display='';show('q');render();}
function finish(){
  const n=LESSON.qs.length;
  const sec=Math.round((Date.now()-t0)/1000);
  $('sAcc').textContent=Math.round(n/(n+wrong)*100)+'%';
  $('sTime').textContent=sec>=60?Math.floor(sec/60)+':'+String(sec%60).padStart(2,'0'):sec+'秒';
  localStorage.setItem(LS+'u1l1','1');
  $('barIn').style.width='100%';show('done');drawMap();
}
$('doneBtn').onclick=()=>show('map');
$('quit').onclick=()=>{ if(confirm('退出这一课?这次的进度不保存。'))show('map'); };

drawMap();show('map');
})();
</script>
