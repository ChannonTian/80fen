<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>80分教学 · 第一单元</title>
<style>
/* ============================================================
   80分教学版 —— 原型 v0.0.3
   四段式框架:进度条 / 出题区 / 牌桌区 / 答题区。
   反馈不做全屏浮层 —— 讲解回到出题区(猫改口),对错与「继续」落在
   答题区,手牌全程可见。看反馈的时候手里还有什么牌,是要一起看的。
   配色:橄榄绿系,不用 Duolingo 那支亮绿。
   ============================================================ */
:root{
  /* 橄榄绿主色系 */
  --ol:#6A8D2F; --ol-rim:#52701F; --ol-bg:#EDF4DB; --ol-tx:#496517; --ol-dk:#3D5416;
  /* 砖红(错) */
  --rd:#BC4A33; --rd-rim:#98371F; --rd-bg:#FAE8E2; --rd-tx:#9A3A24;
  /* 靛蓝(选中) */
  --bl:#4A7FA5; --bl-rim:#3A6A8A; --bl-bg:#E7F0F6; --bl-tx:#345F7C;
  /* 梅紫(新规则徽章、关键词) */
  --pu:#7E5C99; --pu-bg:#F0EAF5;
  /* 金(分值角标) */
  --gd:#DDA32C; --gd-tx:#4A3708;
  --tx:#33362E; --tx2:#7A7C72; --line:#E2E0D6; --dis:#E4E2D8; --dis-tx:#A9A79C;
  --page:#FFFCF6; --felt:#F3F1E7;

  /* 牌宽是唯一标尺 */
  --cardW:clamp(50px,14.5vw,72px);
  --cardH:calc(var(--cardW)*1.44);
  --fs:clamp(15px,4vw,17px);
}
@media (max-height:680px){ :root{--cardW:clamp(42px,12vw,58px)} }
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{background:var(--page);color:var(--tx);overflow:hidden;
  font:600 var(--fs)/1.45 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif}
#app{height:100svh;display:flex;flex-direction:column;max-width:560px;margin:0 auto;position:relative;overflow:hidden}

/* ---------- 按钮 ---------- */
.btn{display:block;width:100%;border:0;border-radius:14px;padding:13px 20px;
  font:800 clamp(15px,4.2vw,17px)/1.2 inherit;letter-spacing:.5px;color:#fff;
  background:var(--ol);border-bottom:4px solid var(--ol-rim);cursor:pointer}
.btn:active:not(:disabled){transform:translateY(4px);border-bottom-width:0;margin-bottom:4px}
.btn:disabled{background:var(--dis);color:var(--dis-tx);border-bottom-color:#CFCDC2;cursor:default}
.btn.red{background:var(--rd);border-bottom-color:var(--rd-rim)}
.rnd{width:50px;height:50px;flex:none;border-radius:13px;border:2px solid var(--line);
  border-bottom-width:4px;background:#fff;font-size:21px;cursor:pointer;display:grid;
  place-items:center;color:var(--ol-tx)}
.rnd:active:not(:disabled){transform:translateY(3px);border-bottom-width:1px}
.rnd:disabled{opacity:.35;cursor:default}

/* ==========  ① 进度条  ========== */
#top{display:flex;align-items:center;gap:13px;padding:11px 16px 5px;flex:none}
#quit{border:0;background:none;color:var(--dis-tx);font-size:25px;line-height:1;cursor:pointer;padding:0 2px}
#bar{flex:1;height:13px;background:var(--line);border-radius:7px;overflow:hidden}
#barIn{height:100%;width:0;background:var(--ol);border-radius:7px;position:relative;
  transition:width .35s cubic-bezier(.4,0,.2,1)}
#barIn::after{content:"";position:absolute;left:6px;right:6px;top:3px;height:3px;border-radius:2px;background:rgba(255,255,255,.35)}

/* ==========  ② 出题区  ========== */
#ask{flex:none;padding:2px 16px 8px}
#badge{min-height:15px}
#badge span{display:inline-flex;align-items:center;gap:6px;color:var(--pu);font:800 11px/1 inherit;letter-spacing:1.2px}
#badge span::before{content:"";width:13px;height:13px;border-radius:50%;background:var(--pu)}
#task{font:800 clamp(17px,4.8vw,20px)/1.3 inherit;margin:2px 0 7px}
#coach{display:flex;align-items:flex-start;gap:8px}
#face{width:54px;height:54px;flex:none}
#bub{position:relative;background:#fff;border:2px solid var(--line);border-radius:14px;
  padding:9px 12px;font:600 clamp(13px,3.7vw,15px)/1.45 inherit;flex:1;transition:background .2s,border-color .2s}
#bub::before,#bub::after{content:"";position:absolute;top:15px;border:8px solid transparent}
#bub::before{left:-16px;border-right-color:var(--line)}
#bub::after{left:-13px;border-right-color:#fff}
#bub b{color:var(--pu)}
#bub .term{color:var(--pu);border-bottom:2px dotted var(--pu);cursor:help}
#bub .sim{display:block;margin-top:4px;font-size:.85em;color:var(--tx2);font-weight:600}
#bub.good .sim,#bub.bad .sim{color:inherit;opacity:.78}
#bub .tip{display:block;margin-top:5px;color:var(--pu);font-size:.9em}
/* 讲解态:猫改口说反馈 */
#bub.good{background:var(--ol-bg);border-color:#C6DA9A} #bub.good::after{border-right-color:var(--ol-bg)}
#bub.good::before{border-right-color:#C6DA9A}
#bub.bad{background:var(--rd-bg);border-color:#EFC4B7} #bub.bad::after{border-right-color:var(--rd-bg)}
#bub.bad::before{border-right-color:#EFC4B7}
#bub.good b,#bub.bad b{color:inherit;text-decoration:underline;text-underline-offset:3px}

/* ==========  ③ 牌桌区 + ④ 手牌:作为一个整体居中,中间只留一点  ========== */
#board{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:4px;padding:2px 12px 22px}   /* 下留白把整组往上顶 */
#table{display:flex;flex-direction:column;align-items:center;gap:9px;width:100%}
#hand{display:flex;justify-content:center;gap:8px;min-height:calc(var(--cardH) + 10px);
  align-items:flex-end}

.seatmap{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:min(300px,90%);place-items:center}
.seatbtn{border:2px solid var(--line);border-bottom-width:4px;border-radius:14px;background:#fff;
  padding:11px 4px;width:100%;font:800 14px/1.25 inherit;color:var(--tx);cursor:pointer}
.seatbtn small{display:block;font-weight:700;font-size:11px;color:var(--tx2);margin-top:3px}
.seatbtn.me{background:var(--felt);cursor:default;border-color:#D8D5C6}
.seatbtn.sel{border-color:var(--bl);background:var(--bl-bg);color:var(--bl-tx)}
.seatbtn.ok{border-color:var(--ol);background:var(--ol-bg);color:var(--ol-tx)}
.seatbtn.no{border-color:var(--rd);background:var(--rd-bg);color:var(--rd-tx)}
.arrowbox{font:700 11px/1.3 inherit;color:var(--tx2);text-align:center}

.trick{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;width:100%;max-width:330px;
  place-items:center;background:var(--felt);border-radius:18px;padding:8px 4px}
.slot{display:flex;flex-direction:column;align-items:center;gap:3px;justify-content:center;
  min-height:calc(var(--cardH) + 18px)}
.slot .who{font:700 11px/1 inherit;color:var(--tx2);white-space:nowrap}
.slot.mine .who,.slot.mate .who{color:var(--ol-tx)}
.slot .who.win{background:var(--gd);color:var(--gd-tx);border-radius:5px;padding:2px 6px}
.slot .ph{width:var(--cardW);height:var(--cardH);border-radius:7px;border:2px dashed #D3D0C1}
.tcenter{grid-column:2;font:700 11px/1.35 inherit;color:var(--tx2);text-align:center}
.pile{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:330px}
.opts{display:flex;flex-direction:column;gap:8px;width:100%;max-width:330px}
.opt{border:2px solid var(--line);border-bottom-width:4px;border-radius:13px;background:#fff;
  padding:11px 15px;font:700 clamp(14px,4vw,16px)/1.3 inherit;color:var(--tx);cursor:pointer;text-align:left}
.opt.sel{border-color:var(--bl);background:var(--bl-bg);color:var(--bl-tx)}
.opt.ok{border-color:var(--ol);background:var(--ol-bg);color:var(--ol-tx)}
.opt.no{border-color:var(--rd);background:var(--rd-bg);color:var(--rd-tx)}

/* ---------- 牌 ---------- */
.card{position:relative;display:inline-block;width:var(--cardW);height:var(--cardH);flex:none;
  background:#fff;color:#111;border-radius:7px;border:1.5px solid #CBC8BA;font-weight:800;
  user-select:none;box-shadow:0 2px 0 rgba(0,0,0,.09);vertical-align:top}
.card.sS{color:#141414} .card.sH{color:#B33A2B} .card.sD{color:#A8286A} .card.sC{color:#14472C}
.card.jb{color:#B33A2B} .card.js{color:#141414}
.card .tl.two{font-size:calc(var(--cardW)*.32)}
.trumpTag{position:absolute;left:0;right:0;top:38%;text-align:center;font:800 calc(var(--cardW)*.2)/1 inherit;
  color:#fff;background:var(--ol);padding:2px 0;letter-spacing:1px;opacity:.92}
.card .tl{position:absolute;top:3px;left:5px;font-size:calc(var(--cardW)*.40);line-height:1}
.card .bl{position:absolute;bottom:3px;left:5px;font-size:calc(var(--cardW)*.38);line-height:1}
/* 角标只能放右下:左上是点数(「10」占两个字宽)、左下是花色 */
.card .pt{position:absolute;right:3px;bottom:3px;font-size:calc(var(--cardW)*.25);line-height:1;
  background:var(--gd);color:var(--gd-tx);border-radius:5px;padding:2px 4px;font-weight:800}
.card.pick{cursor:pointer;transition:transform .1s}
.card.sel{transform:translateY(-13px);box-shadow:0 2px 0 rgba(0,0,0,.09),0 0 0 3px var(--bl)}
.card.ok{box-shadow:0 2px 0 rgba(0,0,0,.09),0 0 0 3px var(--ol)}
.card.no{box-shadow:0 2px 0 rgba(0,0,0,.09),0 0 0 3px var(--rd);opacity:.6}
.card.dim{opacity:.32}
.card.played{animation:playIn .28s cubic-bezier(.2,.9,.3,1.3)}
@keyframes playIn{from{transform:translateY(22px) scale(.85);opacity:0}to{transform:none;opacity:1}}
.flyer{position:fixed;z-index:60;transition:transform .48s cubic-bezier(.5,0,.6,1),opacity .48s;pointer-events:none}

/* ==========  ⑤ 答题区(按钮 / 反馈)  ========== */
#foot{flex:none;padding:9px 16px calc(10px + env(safe-area-inset-bottom));
  border-top:2px solid var(--line);background:#fff;transition:background .2s,border-color .2s}
#foot.good{background:var(--ol-bg);border-top-color:#C6DA9A}
#foot.bad{background:var(--rd-bg);border-top-color:#EFC4B7}
#verdict{display:none;font:800 clamp(16px,4.4vw,18px)/1.2 inherit;margin-bottom:8px}
#foot.good #verdict{display:block;color:var(--ol-tx)}
#foot.bad  #verdict{display:block;color:var(--rd-tx)}
#btnRow{display:flex;gap:11px;align-items:center}
#btnRow .btn{flex:1}
#foot.good .rnd,#foot.bad .rnd{background:#fff;border-color:rgba(0,0,0,.09)}

/* ==========  地图:一个单元 = 一「手」牌  ========== */
.page{position:absolute;inset:0;background:var(--page);z-index:50;display:flex;flex-direction:column;
  overflow-y:auto;-webkit-overflow-scrolling:touch}
.page.hide{display:none}
.unit{margin:14px 16px 0;background:var(--ol);color:#fff;border-radius:16px;padding:12px 17px;
  border-bottom:4px solid var(--ol-rim)}
.unit.lock{background:var(--dis);border-bottom-color:#CFCDC2;color:#8B897E}
.unit small{display:block;font:800 11px/1 inherit;letter-spacing:1.4px;opacity:.9;margin-bottom:5px}
.unit b{font-size:18px}
.fan{display:flex;justify-content:center;padding:22px 12px 4px;min-height:130px;align-items:flex-end}
.lnode{--w:clamp(50px,15vw,64px);width:var(--w);height:calc(var(--w)*1.44);flex:none;
  margin-left:-10px;border-radius:8px;border:0;padding:0;position:relative;cursor:default;
  transition:transform .16s;transform-origin:bottom center}
.lnode:first-child{margin-left:0}
/* 牌背 */
.lnode.back{background:
   repeating-linear-gradient(45deg,rgba(255,255,255,.14) 0 3px,transparent 3px 7px),
   repeating-linear-gradient(-45deg,rgba(255,255,255,.14) 0 3px,transparent 3px 7px),
   linear-gradient(160deg,var(--ol),var(--ol-dk));
  box-shadow:0 2px 0 rgba(0,0,0,.14);border:2px solid rgba(255,255,255,.5)}
.lnode.back.lock{background:
   repeating-linear-gradient(45deg,rgba(255,255,255,.16) 0 3px,transparent 3px 7px),
   linear-gradient(160deg,#BFBDB1,#9E9C90);border-color:rgba(255,255,255,.45)}
.lnode.back::after{content:"80";position:absolute;inset:0;display:grid;place-items:center;
  color:rgba(255,255,255,.82);font:800 calc(var(--w)*.34)/1 inherit;letter-spacing:1px}
/* 正面(已完成) */
.lnode.face{background:#fff;border:1.5px solid #CBC8BA;box-shadow:0 2px 0 rgba(0,0,0,.09);color:#B33A2B}
.lnode.face .r{position:absolute;top:4px;left:6px;font:800 calc(var(--w)*.4)/1 inherit}
.lnode.face .s{position:absolute;bottom:4px;left:6px;font:800 calc(var(--w)*.38)/1 inherit}
.lnode.face .star{position:absolute;right:3px;bottom:3px;background:var(--gd);color:var(--gd-tx);
  border-radius:5px;font:800 calc(var(--w)*.26)/1 inherit;padding:2px 4px}
/* 当前:抬起 + 可点 */
.lnode.now{cursor:pointer;transform:translateY(-16px) rotate(-2deg);z-index:3;
  box-shadow:0 4px 0 rgba(0,0,0,.16),0 0 0 3px var(--gd)}
.lnode.face{z-index:2}
.lnode.now:active{transform:translateY(-10px)}
.nowline{text-align:center;font:800 clamp(15px,4.2vw,17px)/1.3 inherit;margin:12px 16px 3px}
.nowsub{text-align:center;font:600 12px/1.3 inherit;color:var(--tx2);margin-bottom:12px}
.golead{margin:0 16px 6px}
.locknote{text-align:center;color:var(--tx2);font:600 12px/1.4 inherit;padding:10px 16px 20px}

#done{align-items:center;justify-content:center;text-align:center;padding:24px;gap:2px}
#done .big{font-size:58px}
#done h2{font:800 24px/1.2 inherit;color:var(--ol-tx);margin:8px 0 2px}
#done p{color:var(--tx2);font-weight:600;margin:0 0 20px}
.stats{display:flex;gap:12px;margin-bottom:24px}
.stat{border:2px solid var(--gd);border-radius:14px;padding:8px 20px;min-width:100px}
.stat b{display:block;font-size:21px;color:#8A6510}
.stat small{font-size:11px;color:var(--tx2);font-weight:800;letter-spacing:1px}
</style>
</head>
<body>
<div id="app">

  <div class="page" id="map"></div>

  <!-- ① 进度条 -->
  <div id="top">
    <button id="quit" title="退出">&times;</button>
    <div id="bar"><div id="barIn"></div></div>
  </div>

  <!-- ② 出题区 -->
  <div id="ask">
    <div id="badge"></div>
    <div id="task"></div>
    <div id="coach"><span id="face"></span><div id="bub"></div></div>
  </div>

  <!-- ③ 牌桌区 + 手牌 -->
  <div id="board">
    <div id="table"></div>
    <div id="hand"></div>
  </div>

  <!-- ④ 答题区 -->
  <div id="foot">
    <div id="verdict"></div>
    <div id="btnRow">
      <button class="rnd" id="hintBtn" title="问教练">💡</button>
      <button class="btn" id="cta" disabled>检查</button>
    </div>
  </div>

  <div class="page hide" id="done">
    <div class="big">🐱</div>
    <h2>这一课通关了</h2>
    <p>你已经看得懂一墩牌了</p>
    <div class="stats">
      <div class="stat"><b id="sAcc">—</b><small>正确率</small></div>
      <div class="stat"><b id="sTime">—</b><small>用时</small></div>
    </div>
    <button class="btn" id="doneBtn" style="max-width:300px">继续</button>
  </div>
</div>

<script>
(function(){
'use strict';

/* ================= 教练:狸花猫 ================= */
function catSVG(mood){
  const eyes = mood==='good'
    ? `<path d="M20 36q5-5 10 0M42 36q5-5 10 0" stroke="#2B2A24" stroke-width="3" fill="none" stroke-linecap="round"/>`
    : mood==='bad'
    ? `<ellipse cx="25" cy="37" rx="6" ry="6.5" fill="#F2EFE4"/><ellipse cx="47" cy="37" rx="6" ry="6.5" fill="#F2EFE4"/>
       <ellipse cx="25" cy="37" rx="5" ry="5.6" fill="#A9B84E"/><ellipse cx="47" cy="37" rx="5" ry="5.6" fill="#A9B84E"/>
       <ellipse cx="25" cy="37" rx="1.9" ry="5" fill="#1E1D18"/><ellipse cx="47" cy="37" rx="1.9" ry="5" fill="#1E1D18"/>
       <circle cx="23.2" cy="34.6" r="1.5" fill="#fff"/><circle cx="45.2" cy="34.6" r="1.5" fill="#fff"/>`
    : `<ellipse cx="25" cy="37" rx="6" ry="5.6" fill="#F2EFE4"/><ellipse cx="47" cy="37" rx="6" ry="5.6" fill="#F2EFE4"/>
       <ellipse cx="25" cy="37" rx="5.1" ry="4.8" fill="#A9B84E"/><ellipse cx="47" cy="37" rx="5.1" ry="4.8" fill="#A9B84E"/>
       <ellipse cx="25" cy="37" rx="1.7" ry="4.3" fill="#1E1D18"/><ellipse cx="47" cy="37" rx="1.7" ry="4.3" fill="#1E1D18"/>
       <circle cx="23.3" cy="35" r="1.4" fill="#fff"/><circle cx="45.3" cy="35" r="1.4" fill="#fff"/>`;
  const mouth = mood==='good'
    ? `<path d="M30 50q6 6 12 0" stroke="#5C5344" stroke-width="2.2" fill="none" stroke-linecap="round"/>`
    : mood==='bad'
    ? `<path d="M31 52q5-4 10 0" stroke="#5C5344" stroke-width="2.2" fill="none" stroke-linecap="round"/>`
    : `<path d="M31 49q2.5 3 5 0M36 49q2.5 3 5 0" stroke="#5C5344" stroke-width="2.2" fill="none" stroke-linecap="round"/>`;
  return `<svg viewBox="0 0 72 72" width="100%" height="100%" aria-hidden="true">
   <path d="M11 30 L13 7 L31 17 Z" fill="#A2977F"/><path d="M15 26 L16.5 13 L27 19 Z" fill="#DCA9A6"/>
   <path d="M61 30 L59 7 L41 17 Z" fill="#A2977F"/><path d="M57 26 L55.5 13 L45 19 Z" fill="#DCA9A6"/>
   <ellipse cx="36" cy="39" rx="26" ry="24" fill="#A99E86"/>
   <path d="M36 15 L31 26 M36 15 L41 26 M26 19 L23 28 M46 19 L49 28" stroke="#5C5344" stroke-width="3" stroke-linecap="round" fill="none"/>
   <path d="M12 36 L4 33 M12 42 L4 42 M60 36 L68 33 M60 42 L68 42" stroke="#5C5344" stroke-width="2.4" stroke-linecap="round" opacity=".55"/>
   <ellipse cx="36" cy="49" rx="13" ry="10" fill="#EFEADC"/>
   ${eyes}
   <path d="M33 44 L39 44 L36 47.6 Z" fill="#D0757E"/>
   ${mouth}
   <path d="M22 46 L8 44 M22 49 L9 51 M50 46 L64 44 M50 49 L63 51" stroke="#8E8878" stroke-width="1.4" opacity=".55" stroke-linecap="round"/>
  </svg>`;
}
const setCat=m=>{ document.getElementById('face').innerHTML=catSVG(m); };

/* ================= 牌与规则(教学子集) =================
   只做单张:跟牌义务、主副归属、一墩胜负。对子/拖拉机/甩牌是后面单元的事。
   固定打 2 —— 所有花色的 2 都是主牌(副级),这是新手最容易搞错的一条。 */
const LEVEL=2;
const SYM={S:'♠',H:'♥',D:'♦',C:'♣'};
const PTS={5:5,10:10,13:10};
const RS=r=>r>10?({11:'J',12:'Q',13:'K',14:'A'})[r]:String(r);
const C=(s,r,i)=>({suit:s,rank:r,id:s+r+(i||0)});
const H=(r,i)=>C('H',r,i), S=(r,i)=>C('S',r,i), D=(r,i)=>C('D',r,i), Cl=(r,i)=>C('C',r,i);
const BJ=C('X',16), SJ=C('X',15);
const pts=c=>PTS[c.rank]||0;

/* 花色归属:王、级牌、主花色 → 主('T');其余按本花色 */
function eff(c,tr){ if(c.suit==='X')return 'T'; if(!tr)return c.suit;
  if(c.rank===LEVEL)return 'T'; return c.suit===tr?'T':c.suit; }
/* 大小:主牌一档,副牌按点数 */
function ord(c,tr){
  if(!tr) return c.rank;
  if(c.suit==='X') return c.rank===16?120:118;
  if(c.rank===LEVEL) return c.suit===tr?116:114;   // 正级 / 副级
  return c.rank;
}
function cardName(c){ return c.suit==='X'?(c.rank===16?'大王':'小王'):SYM[c.suit]+RS(c.rank); }
function cardHTML(c,cls,showPt,tr){
  if(c.suit==='X') return `<div class="card ${c.rank===16?'jb':'js'} ${cls||''}" data-id="${c.id}">`+
    `<span class="tl">${c.rank===16?'大':'小'}</span><span class="bl">王</span></div>`;
  const p=pts(c), isT=tr&&tr!=='hide'&&eff(c,tr)==='T';
  return `<div class="card s${c.suit} ${cls||''}" data-id="${c.id}">`+
    `<span class="tl${RS(c.rank).length>1?' two':''}">${RS(c.rank)}</span><span class="bl">${SYM[c.suit]}</span>`+
    (isT?'<span class="trumpTag">主</span>':'')+
    (showPt&&p?`<span class="pt">${p}</span>`:'')+`</div>`;
}
/* 跟牌义务:有领出那门就只能出那门 */
function legalSet(hand,ledSuit,tr){
  if(ledSuit==null) return hand.slice();
  const same=hand.filter(c=>eff(c,tr)===ledSuit);
  return same.length?same:hand.slice();
}
/* 一墩谁收:同门比大小,主牌盖副牌,平手先出者收 */
function winnerOf(played,leadSeat,tr){
  const led=eff(played[leadSeat],tr);
  let win=leadSeat,wT=(led==='T'),wO=ord(played[leadSeat],tr);
  for(let k=1;k<4;k++){
    const s=(leadSeat+k)%4,c=played[s]; if(!c)continue;
    const es=eff(c,tr),isT=(es==='T');
    if(!isT&&es!==led)continue;                       // 别的副门,不参与比较
    if(isT&&!wT){win=s;wT=true;wO=ord(c,tr);continue;}
    if(isT===wT&&ord(c,tr)>wO){win=s;wO=ord(c,tr);}   // 严格大于:平手先出者收
  }
  return win;
}
function partialWinner(played,leadSeat,tr){
  const f=played.slice(); let n=0;
  for(let k=0;k<4;k++){ if(f[(leadSeat+k)%4])n=k; else break; }
  const tmp=[null,null,null,null];
  for(let k=0;k<=n;k++){const s=(leadSeat+k)%4;tmp[s]=f[s];}
  return winnerOf(tmp,leadSeat,tr);
}

  if($('go'))$('go').onclick=()=>start(dn);
  if($('nod'))$('nod').onclick=()=>start(dn);
  if($('again'))$('again').onclick=()=>{localStorage.setItem(LS+'u1','0');drawMap();};
}

/* ---------- 出牌区 ---------- */
function trickHTML(played,lead,winner,showPt){
  const cell=s=>{
    const c=played[s];
    return `<div class="slot ${s===0?'mine':s===2?'mate':''}" data-seat="${s}">`+
      `<div class="who ${winner===s?'win':''}">${nameOf(s)}</div>`+
      (c?cardHTML(c,'played',showPt,TR):'<div class="ph"></div>')+`</div>`;
  };
  return `<div class="trick"><div></div>${cell(2)}<div></div>`+
    `${cell(3)}<div class="tcenter">${lead!=null?SEAT[lead]+' 领出':''}</div>${cell(1)}`+
    `<div></div>${cell(0)}<div></div></div>`;
}

/* ---------- 出题区文案 ---------- */
function saySetup(q){
  setCat('idle'); $('bub').className='';
  $('bub').innerHTML=q.prompt+(q.simplify?`<span class="sim">(${q.simplify})</span>`:'');
}
function sayFeedback(ok,text){
  setCat(ok?'good':'bad');
  $('bub').className=ok?'good':'bad';
  $('bub').innerHTML=text;
  $('verdict').textContent=ok?'答对了':'再想想';
  $('foot').className=ok?'good':'bad';
  $('hintBtn').style.display='none';
  $('cta').textContent=ok?'继续':'知道了';
  $('cta').disabled=false;
  $('cta').className='btn'+(ok?'':' red');
  $('cta').dataset.mode=ok?'next':'retry';
}

/* ---------- 渲染 ---------- */
function render(){
  const q=L.qs[qi];
  sel=null;selMulti=[];answered=false;hinted=false;
  $('barIn').style.width=(qi/L.qs.length*100)+'%';
  $('badge').innerHTML=q.badge?`<span>${q.badge}</span>`:'';
  $('task').textContent=q.task;
  saySetup(q);
  $('hand').innerHTML='';$('table').innerHTML='';$('hand').style.minHeight='';
  $('foot').className='';$('verdict').textContent='';
  $('hintBtn').style.display='';$('hintBtn').disabled=!q.hint;
  $('cta').textContent='检查';$('cta').disabled=true;$('cta').className='btn';$('cta').dataset.mode='check';
  $('btnRow').style.display='';

  if(q.type==='seat'){
    $('table').innerHTML=`<div class="seatmap">
      <div></div><button class="seatbtn" data-s="2">北<small>?</small></button><div></div>
      <button class="seatbtn" data-s="3">西<small>?</small></button>
      <div class="arrowbox">牌桌</div>
      <button class="seatbtn" data-s="1">东<small>?</small></button>
      <div></div><button class="seatbtn me">南<small>你</small></button><div></div></div>`;
    $('table').querySelectorAll('.seatbtn[data-s]').forEach(b=>b.onclick=()=>{
      if(answered)return;
      $('table').querySelectorAll('.seatbtn').forEach(x=>x.classList.remove('sel'));
      b.classList.add('sel');sel=+b.dataset.s;$('cta').disabled=false;});
  }
  else if(q.type==='multi'){
    $('table').innerHTML=`<div class="pile">${q.cards.map(c=>cardHTML(c,'pick',false,q.noTrumpTag?'hide':TR)).join('')}</div>`;
    $('table').querySelectorAll('.card').forEach(n=>n.onclick=()=>{
      if(answered)return;
      const i=selMulti.indexOf(n.dataset.id);
      if(i<0){selMulti.push(n.dataset.id);n.classList.add('sel');}
      else{selMulti.splice(i,1);n.classList.remove('sel');}
      $('cta').disabled=!selMulti.length;});
  }
  else if(q.type==='choice'){
    const top=q.played?trickHTML(q.played,q.lead!=null?q.lead:null,null,q.showPt)
             :q.cards?`<div class="pile">${q.cards.map(c=>cardHTML(c,'',q.showPt,q.noTrumpTag?'hide':TR)).join('')}</div>`:'';
    $('table').innerHTML=top+`<div class="opts">${q.opts.map((o,i)=>`<button class="opt" data-i="${i}">${o}</button>`).join('')}</div>`;
    $('table').querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
      if(answered)return;
      $('table').querySelectorAll('.opt').forEach(x=>x.classList.remove('sel'));
      b.classList.add('sel');sel=+b.dataset.i;$('cta').disabled=false;});
  }
  else if(q.type==='trickpick'){
    $('table').innerHTML=trickHTML(q.played,q.lead,null,q.showPt);
    // 正在教的规则:非法牌照样可点 —— 错误就是这一关的教学素材
    $('hand').innerHTML=q.hand.map(c=>cardHTML(c,'pick',q.showPt,TR)).join('');
    $('hand').querySelectorAll('.card').forEach(n=>n.onclick=()=>{
      if(answered)return;
      $('hand').querySelectorAll('.card').forEach(x=>x.classList.remove('sel'));
      n.classList.add('sel');sel=n.dataset.id;$('cta').disabled=false;});
  }
  else if(q.type==='mini') startMini(q);
  if(!$('hand').children.length) $('hand').style.minHeight='0';
}

/* ---------- 判分 ---------- */
function check(){
  const q=L.qs[qi];let ok,msg=null;
  if(q.type==='seat'){
    ok=sel===q.answer;
    $('table').querySelectorAll('.seatbtn[data-s]').forEach(b=>{
      const s=+b.dataset.s;b.classList.remove('sel');
      addCls(b,s===q.answer?'ok':s===sel?'no':'');
      b.querySelector('small').textContent=s===q.answer?'队友':'对手';});
  } else if(q.type==='multi'){
    ok=selMulti.length===q.answer.length&&q.answer.every(a=>selMulti.includes(a));
    $('table').querySelectorAll('.card').forEach(n=>{
      const isA=q.answer.includes(n.dataset.id);n.classList.remove('sel');
      addCls(n,isA?'ok':selMulti.includes(n.dataset.id)?'no':'dim');
      if(q.noTrumpTag&&TR){const c=q.cards.find(x=>x.id===n.dataset.id);
        if(eff(c,TR)==='T')n.insertAdjacentHTML('beforeend','<span class="trumpTag">主</span>');}});
  } else if(q.type==='choice'){
    ok=sel===q.answer;
    $('table').querySelectorAll('.opt').forEach(b=>{
      const i=+b.dataset.i;b.classList.remove('sel');
      addCls(b,i===q.answer?'ok':i===sel?'no':'');});
  } else if(q.type==='trickpick'){
    const led=q.lead!=null&&q.played[q.lead]?eff(q.played[q.lead],TR):null;
    const legal=legalSet(q.hand,led,TR).map(c=>c.id);
    const isLegal=legal.includes(sel);
    ok = q.anyLegal ? isLegal : (isLegal && sel===q.answer);
    if(!isLegal&&q.illegal) msg=q.illegal;              // 违规牌:指着他手里剩的那张说
    $('hand').querySelectorAll('.card').forEach(n=>{
      n.classList.remove('sel');
      const good = q.anyLegal ? legal.includes(n.dataset.id) : n.dataset.id===q.answer;
      addCls(n, good?'ok' : n.dataset.id===sel?'no':'');});
  }
  answered=true;if(!ok)wrong++;
  sayFeedback(ok, ok?q.good:(msg||q.bad));
}

$('cta').onclick=()=>{
  const m=$('cta').dataset.mode;
  if(m==='check'){ if(!answered)check(); return; }
  if(m==='next'){ qi++; qi>=L.qs.length?finish():render(); return; }
  render();                                   // retry:同一题面重来,不换题
};
$('hintBtn').onclick=()=>{
  const q=L.qs[qi];if(!q.hint||hinted)return;hinted=true;
  $('bub').innerHTML+=`<span class="tip">💡 ${q.hint}</span>`;
  $('hintBtn').disabled=true;
};

/* ---------- 小局 ---------- */
function startMini(q){
  mini={hands:q.hands.map(h=>h.slice()),lead:q.lead,played:[null,null,null,null],
        turn:q.lead,score:[0,0],trick:1,busy:false,gen:(mini?mini.gen+1:1)};
  $('btnRow').style.display='none';paintMini();
  step(()=>aiStep(),PACE.step);
}
/* 所有小局定时器都走这里:gen 一变,在途的回调全部作废 —— 
   裸 setTimeout 会让上一墩的排程回来再出一张牌,同一家出两张、endTrick 跑两次 */
function step(fn,ms){
  const g=mini.gen;
  setTimeout(()=>{ if(mini&&mini.gen===g&&mini.turn!==0) fn(); },ms);
}
function stepAny(fn,ms){
  const g=mini.gen;
  setTimeout(()=>{ if(mini&&mini.gen===g) fn(); },ms);
}
function ledSuitNow(){
  const m=mini,c=m.played[m.lead];
  return c?eff(c,TR):null;
}
function paintMini(){
  const m=mini;
  $('task').textContent=`第 ${m.trick} 墩`;
  $('bub').className='';
  $('bub').innerHTML=`你们队已经拿到 <b>${m.score[0]}</b> 分。轮到你就点一张牌出。`;
  $('table').innerHTML=trickHTML(m.played,m.lead,null,true);
  const legal=legalSet(m.hands[0],ledSuitNow(),TR).map(c=>c.id);
  // 已经学过的规则:非法牌直接点不动(第 2 课教过跟牌义务了)
  $('hand').innerHTML=m.hands[0].map(c=>cardHTML(c,'pick'+(legal.includes(c.id)?'':' dim'),true,TR)).join('');
  $('hand').querySelectorAll('.card').forEach(n=>n.onclick=()=>{
    // busy:一墩打满之后到下一墩画出来之前,turn 已经绕回 0,但这时候不该再收牌
    if(mini.turn!==0||mini.busy)return;
    if(!legal.includes(n.dataset.id))return;
    playCard(0,mini.hands[0].find(c=>c.id===n.dataset.id));});
}
function playCard(seat,card){
  const m=mini;
  if(!card||m.busy||seat!==m.turn||m.played[seat])return;   // 不是你、已经出过、或正在收墩
  m.hands[seat]=m.hands[seat].filter(c=>c.id!==card.id);
  m.played[seat]=card;m.turn=(m.turn+1)%4;
  const full=m.played.every(Boolean);
  if(full)m.busy=true;
  paintMini();
  if(full) stepAny(endTrick,PACE.step); else step(()=>aiStep(),PACE.step);
}
function aiStep(){
  const m=mini;if(m.turn===0){paintMini();return;}
  const legal=legalSet(m.hands[m.turn],ledSuitNow(),TR).slice().sort((a,b)=>ord(a,TR)-ord(b,TR));
  if(!m.played[m.lead]){                       // 轮到自己领出:这一墩还没有牌,无从比较
    playCard(m.turn,legal[legal.length-1]);    // 领出手里最大的那张,牌面清楚
    return;
  }
  const w=partialWinner(m.played,m.lead,TR);
  const mateWinning = m.played[w] && w%2===m.turn%2 && w!==m.turn;
  let pick;
  if(mateWinning)                                   // 队友暂时最大 → 贴分
    pick=legal.slice().sort((a,b)=>pts(b)-pts(a)||ord(a,TR)-ord(b,TR))[0];
  else{
    const cur=m.played[w];
    const beats=legal.filter(c=>{
      const t=m.played.slice(); t[m.turn]=c;
      return winnerOf(fill(t,m),m.lead,TR)===m.turn;
    });
    pick=beats.length?beats[0]:legal[0];             // 压得过就用最省的,压不过出最小
  }
  playCard(m.turn,pick);
}
/* 只把已出的位置交给 winnerOf,空位补成不参与比较 */
function fill(t,m){
  const out=[null,null,null,null];
  for(let k=0;k<4;k++){const s=(m.lead+k)%4; if(t[s])out[s]=t[s]; else break;}
  if(t[m.turn])out[m.turn]=t[m.turn];
  return out;
}
function endTrick(){
  const m=mini;
  const win=winnerOf(m.played,m.lead,TR);
  const got=m.played.reduce((a,c)=>a+pts(c),0);
  m.score[win%2===0?0:1]+=got;
  m.busy=true;
  flyToWinner(win,()=>{
    $('table').innerHTML=trickHTML(m.played,m.lead,win,true);
    $('task').textContent=`${nameOf(win)} 收走`;
    setCat(isUs(win)?'good':'idle');
    $('bub').className=isUs(win)?'good':'';
    $('bub').innerHTML=got?`这一墩有 <b>${got} 分</b>,${isUs(win)?'进<b>你们队</b>的账。':'被<b>对手</b>拿走了。'}`
                          :'这一墩<b>没有分</b>。';
    stepAny(()=>{
      if(!m.hands[0].length){        // 打完了:留着最后一墩的牌面,别清空
        $('btnRow').style.display='';$('hintBtn').style.display='none';answered=true;
        sayFeedback(true,L.qs[qi].good+`<span class="sim">这两墩你们队拿到 ${m.score[0]} 分,对手 ${m.score[1]} 分。</span>`);
        return;
      }
      m.gen++;                                   // 新的一墩:作废上一墩所有在途排程
      m.played=[null,null,null,null];m.lead=win;m.turn=win;m.trick++;m.busy=false;
      paintMini();step(()=>aiStep(),PACE.step);
    },PACE.review);
  });
}
/* 收墩动画:四张牌飞向赢家 —— 让「谁收走了」变成看得见的事,不是装饰 */
function flyToWinner(win,cb){
  const t=[...$('table').querySelectorAll('.slot')].find(s=>+s.dataset.seat===win).getBoundingClientRect();
  [...$('table').querySelectorAll('.slot .card')].forEach(c=>{
    const r=c.getBoundingClientRect(),f=c.cloneNode(true);
    f.classList.add('flyer');f.classList.remove('played');
    f.style.cssText+=`position:fixed;left:${r.left}px;top:${r.top}px;width:${r.width}px;height:${r.height}px;margin:0`;
    document.body.appendChild(f);
    requestAnimationFrame(()=>{
      f.style.transform=`translate(${t.left-r.left+10}px,${t.top-r.top+8}px) scale(.45)`;
      f.style.opacity='0';});
    setTimeout(()=>f.remove(),PACE.fly+40);
  });
  setTimeout(cb,PACE.fly+60);
}

/* ---------- 起止 ---------- */
function start(i){
  if(mini)mini.gen++;                 // 上一课的小局定时器作废
  li=i; L=LESSONS[i]; TR=L.trump;
  qi=0;wrong=0;t0=Date.now();show('q');render();
}
function finish(){
  const n=L.qs.length,sec=Math.round((Date.now()-t0)/1000);
  $('sAcc').textContent=Math.round(n/(n+wrong)*100)+'%';
  $('sTime').textContent=sec>=60?Math.floor(sec/60)+':'+String(sec%60).padStart(2,'0'):sec+'秒';
  if(li+1>doneCount()) localStorage.setItem(LS+'u1',String(li+1));
  const nxt=LESSONS[li+1];
  $('done').querySelector('h2').textContent='这一课通关了';
  $('done').querySelector('p').textContent=nxt?`下一课:${nxt.name}`:'单元 1 全部打完了';
  $('barIn').style.width='100%';show('done');drawMap();
}
$('doneBtn').onclick=()=>show('map');
$('quit').onclick=()=>{ if(confirm('退出这一课?这次的进度不保存。'))show('map'); };

setCat('idle');drawMap();show('map');
})();
</script>
