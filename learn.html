/* ---------- 出牌区 ---------- */
const asArr=x=>x?(Array.isArray(x)?x:[x]):null;
/* 领出题上面挂了可视条的时候,别人那三格全是空的 —— 占掉大半屏高度,信息量是零。
   只留自己这一格,自己那张牌才画得下、也画得大。 */
const soloOpt=q=>({solo:!!(q.bars&&q.bars.length)&&(q.played||[]).every(x=>!x)});

/* 跟牌位置课:你出完之后,身后的人接着把这一墩打完 —— 「位置」的意思就是「后面还有谁」,
   只判对错不打完,学的人看不见那张 ♣K 是怎么从末家手里掏出来的。
   q.rest = {座位: [这门里他手上的几张]}。后手的出法写死成一条简单规则,不用 AI:
   队友最大 → 贴分;压得过 → 末家挑分最多的、非末家挑最小的那张压;压不过 → 出最没分的。
   这条规则不是在教「对手就是这么打」,只是让结果可复现 —— 判对错看的永远是这一手本身。 */
function restPick(s,hand,P,lead,tr){
  const led=effSuit(asArr(P[lead])[0],tr);
  const lo=(a,b)=>ordIdx(a,tr)-ordIdx(b,tr);
  const legal=legalSet(hand,led,tr).slice().sort(lo);
  const w=winnerOf(P,lead,tr);
  if(w%2===s%2) return legal.slice().sort((a,b)=>pts(b)-pts(a)||lo(a,b))[0];
  const beats=legal.filter(c=>{ const t=P.slice(); t[s]=c; return winnerOf(t,lead,tr)===s; });
  if(beats.length) return s===(lead+3)%4 ? beats.slice().sort((a,b)=>pts(b)-pts(a)||lo(a,b))[0] : beats[0];
  return legal.slice().sort((a,b)=>pts(a)-pts(b)||lo(a,b))[0];
}
function finishTrick(q,mine,tr){
  tr=tr||TR;
  const P=q.played.slice(); P[0]=mine;
  const after=[];
  for(let k=1;k<4;k++){
    const s=(q.lead+k)%4;
    if(P[s]||!q.rest||!q.rest[s]) continue;
    // 只有排在你后面的座位才会接着出;排在你前面的早就出过了
    const pos=(s-q.lead+4)%4, me=(0-q.lead+4)%4;
    if(pos<me) continue;
    P[s]=restPick(s,q.rest[s],P,q.lead,tr); after.push(s);
  }
  const done=P.every(x=>x);
  const win=done?winnerOf(P,q.lead,tr):null;
  const got=P.reduce((a,c)=>a+(c?pts(c):0),0);
  return {P,after,win,got,done};
}
/* ===== 残局求解(单元 5 · 护底)=====
   最后几墩(只出单张)穷举到底:每一家都按「对自己这队最好」出,算出闲家最后拿多少分。
   这是 L2 真值(DESIGN §二):明牌、穷举,不用任何启发式。
   目标不是「分数最多」,是**阶梯**:先比落在哪一档(关光 / 升 2 / 升 1 / 上台 / 升 1 …),
   同一档里再比分数 —— 75 分和 60 分对庄家是一回事,79 和 80 是两个世界。
   状态:hands[4](各家剩的牌)、lead、played(这一墩已出的)、def(闲家已有的分)、
   declTeam(庄家那一队:0 = 南北)、kitty(底分)。 */
function ladderKey(F){
  const lv=F===0?-3:F<40?-2:F<80?-1:Math.floor((F-80)/40);
  return lv*1000+F;
}
function endSolve(st,tr){
  const {hands,lead,played,def,declTeam,kitty}=st;
  const n=played.filter(Boolean).length;
  if(n===4){
    const w=winnerOf(played,lead,tr);
    const got=played.reduce((a,c)=>a+pts(c),0);
    const d=def+((w%2)!==declTeam?got:0);
    if(hands.every(h=>!h.length)){
      // 末墩归闲家:底分 × 2 × 末墩每人张数(这里只出单张 → ×2)
      const F=d+((w%2)!==declTeam?kitty*2:0);
      return {v:ladderKey(F),F,line:[{played,lead,win:w}]};
    }
    const r=endSolve({hands,lead:w,played:[null,null,null,null],def:d,declTeam,kitty},tr);
    return {v:r.v,F:r.F,line:[{played,lead,win:w}].concat(r.line)};
  }
  const s=(lead+n)%4;
  const led=n?effSuit(played[lead],tr):null;
  const seen=new Set(); let best=null;
  const defSide=(s%2)!==declTeam;
  for(const c of legalSet(hands[s],led,tr)){
    const k=c.suit+c.rank; if(seen.has(k)) continue; seen.add(k);   // 两张一样的牌,出哪张都一样
    const h2=hands.slice(); h2[s]=hands[s].filter(x=>x!==c);
    const p2=played.slice(); p2[s]=c;
    const r=endSolve({hands:h2,lead,played:p2,def,declTeam,kitty},tr);
    if(!best||(defSide?r.v>best.v:r.v<best.v)) best={v:r.v,F:r.F,line:r.line,card:c};
  }
  return best;
}
/* 我(南)这一手每张牌各自的结果:其余几手都按最优打完 */
function endMoves(st,tr){
  const n=st.played.filter(Boolean).length;
  if((st.lead+n)%4!==0) throw new Error(`残局题:现在轮到${SEAT[(st.lead+n)%4]},不是你`);
  const sz=st.hands.map((h,s)=>h.length+(st.played[s]?1:0));
  if(sz.some(x=>x!==sz[0])) throw new Error('残局题:四家张数对不上 '+sz.join('/'));
  const led=n?effSuit(st.played[st.lead],tr):null;
  return legalSet(st.hands[0],led,tr).map(c=>{
    const h2=st.hands.slice(); h2[0]=st.hands[0].filter(x=>x!==c);
    const p2=st.played.slice(); p2[0]=c;
    const r=endSolve({...st,hands:h2,played:p2},tr);
    return {card:c,v:r.v,F:r.F,line:r.line};
  });
}

/* 残局题(q.end):另外三家剩的牌摊在各自座位下面(明牌残局,DESIGN §9.14 登记的简化),
   座位名写成「北 · 帮家」—— 同一个残局,坐不同的座位要的东西不一样。 */
const roleOf=(s,decl)=>s===decl?'庄家':(s%2===decl%2?'帮家':'闲家');
function endState(q){
  const e=q.end;
  return {hands:[q.hand,e.hands[1],e.hands[2],e.hands[3]],lead:q.lead,played:q.played.slice(),
          def:e.def,declTeam:e.decl%2,kitty:e.kitty};
}
function ladderText(F){
  return F===0?'庄家方升 3 级(关光)':F<40?'庄家方升 2 级':F<80?'庄家方升 1 级'
       :F<120?'闲家上台':`闲家上台,还升 ${Math.floor((F-80)/40)} 级`;
}
let endGen=0;
/* 答完之后,剩下几墩按最优打完,一墩一墩摆出来,最后报结算。
   endGen 是代次令牌:换题 / 重做时自增,在途的定时器全部作废(DESIGN §9.3 那个坑)。 */
function playOutEnd(q,mv,st0){
  const g=++endGen, st=st0||endState(q), hands=st.hands.map(h=>h.slice());
  const lineAll=mv.line, last=lineAll[lineAll.length-1];
  const drop=t=>{ for(let s=0;s<4;s++) if(t.played[s]) hands[s]=hands[s].filter(c=>c.id!==t.played[s].id); };
  const paint=(t,i)=>{
    drop(t);
    $('table').innerHTML=`<div class="endno">第 ${i+1} / ${lineAll.length} 墩</div>`+
      trickHTML(t.played,t.lead,t.win,true,{open:hands,decl:q.end.decl});
    if(i===0){ const m=$('table').querySelector('.slot[data-seat="0"]'); if(m) m.classList.add(q._ok?'okslot':'noslot'); }
    $('hand').innerHTML=hands[0].map(c=>cardHTML(c,'dim',true,TR)).join('');
  };
  paint(lineAll[0],0);
  lineAll.slice(1).forEach((t,k)=>setTimeout(()=>{ if(endGen===g) paint(t,k+1); },PACE.review*(k+1)));
  setTimeout(()=>{
    if(endGen!==g) return;
    const defWon=(last.win%2)!==st.declTeam, K=st.kitty;
    $('bub').innerHTML+=`<span class="res">末墩${defWon?'<b>闲家</b>':'<b>庄家方</b>'}收`+
      (defWon&&K?`,底 ${K} × 2 = ${K*2}`:'')+` —— 闲家共 <b>${mv.F} 分</b>,${ladderText(mv.F)}。</span>`;
  },PACE.review*(lineAll.length-1)+200);
}

/* ===== 收官实战(type:'endplay')=====
   整个残局由你打完:轮到你就出,其余三家按 endSolve 的最优出。
   你的每一手都当场交给 endSolve 判:和最优一样好就过,差了就停下来、把这一手的后果打完给你看。
   判的是**每一手**,不是结果 —— 最优打法本来就可能守不住,那不算你错。 */
function endplayStart(q){
  const e=q.end;
  q._st={hands:[q.hand.slice(),e.hands[1].slice(),e.hands[2].slice(),e.hands[3].slice()],
         lead:q.lead,played:q.played.slice(),def:e.def,declTeam:e.decl%2,kitty:e.kitty};
  q._n=q.hand.length; q._good=0;
  endplayAdvance(q);
}
const trickNo=q=>q._n-q._st.hands[0].length+(q._st.played[0]?0:1);
function endplayDraw(q,pick){
  const st=q._st;
  $('task').textContent=`第 ${Math.min(trickNo(q),q._n)} / ${q._n} 墩`;
  $('table').innerHTML=trickHTML(st.played,st.lead,null,true,
    {wait:true,open:{1:st.hands[1],2:st.hands[2],3:st.hands[3]},decl:q.end.decl});
  const n=st.played.filter(Boolean).length;
  const led=n?effSuit(st.played[st.lead],TR):null;
  const legal=pick?legalSet(st.hands[0],led,TR).map(c=>c.id):[];
  $('hand').innerHTML=st.hands[0].map(c=>cardHTML(c,legal.includes(c.id)?'pick'+(sel===c.id?' sel':''):'dim',true,TR)).join('');
  if(pick) $('hand').querySelectorAll('.card.pick').forEach(el=>el.onclick=()=>{
    if(answered)return; sel=(sel===el.dataset.id?null:el.dataset.id);
    $('cta').disabled=!sel; $('cta').textContent='出牌'; endplayDraw(q,true);});
}
function endplayAdvance(q){
  const g=++endGen;
  const tick=()=>{
    if(endGen!==g) return;
    const st=q._st, n=st.played.filter(Boolean).length;
    if(n===4){
      const w=winnerOf(st.played,st.lead,TR), got=st.played.reduce((a,c)=>a+pts(c),0);
      $('table').innerHTML=trickHTML(st.played,st.lead,w,true,
        {open:{1:st.hands[1],2:st.hands[2],3:st.hands[3]},decl:q.end.decl});
      setTimeout(()=>{
        if(endGen!==g) return;
        const last=st.hands.every(h=>!h.length);
        q._st={...st,lead:w,played:[null,null,null,null],def:st.def+((w%2)!==st.declTeam?got:0)};
        if(last){
          const defWon=(w%2)!==st.declTeam, K=st.kitty, F=q._st.def+(defWon?K*2:0);
          answered=true;
          sayFeedback(true,q.good+`<span class="res">末墩${defWon?'<b>闲家</b>':'<b>庄家方</b>'}收`+
            (defWon&&K?`,底 ${K} × 2 = ${K*2}`:'')+` —— 闲家共 <b>${F} 分</b>,${ladderText(F)}。</span>`);
          return;
        }
        tick();
      },PACE.review);
      return;
    }
    const s=(st.lead+n)%4;
    if(s===0){ sel=null; $('cta').disabled=true; $('cta').textContent='出牌'; $('cta').dataset.mode='check';
               endplayDraw(q,true); return; }
    const c=endSolve(st,TR).card;
    const h2=st.hands.slice(); h2[s]=st.hands[s].filter(x=>x!==c);
    const p2=st.played.slice(); p2[s]=c; q._st={...st,hands:h2,played:p2};
    endplayDraw(q,false);
    setTimeout(tick,PACE.step);
  };
  tick();
}
function endplayCheck(q){
  const st=q._st;
  if((st.lead+st.played.filter(Boolean).length)%4!==0) return;   // 不是我出牌的时候,点了不算
  const mv=endMoves(st,TR), mine=(st.declTeam===0);
  const best=mine?Math.min(...mv.map(m=>m.v)):Math.max(...mv.map(m=>m.v));
  const ch=mv.find(m=>m.card.id===sel), bm=mv.find(m=>m.v===best);
  if(ch.v===best){
    const h2=st.hands.slice(); h2[0]=st.hands[0].filter(x=>x.id!==sel);
    const p2=st.played.slice(); p2[0]=ch.card; q._st={...st,hands:h2,played:p2};
    // 手牌马上重画成不可点:我这张要是正好补满一墩,下一步是收墩动画,
    // 旧的手牌 DOM 还挂着点击 —— 别人出牌的时候还能点出一张,状态就乱了
    sel=null; setCat('good'); $('cta').disabled=true; endplayDraw(q,false);
    endplayAdvance(q); return;
  }
  answered=true; wrong++;
  sayFeedback(false,(q.bad?q.bad+' ':'')+`出 ${cardName(ch.card)} 闲家最后 ${ch.F} 分;出 ${cardName(bm.card)} 是 ${bm.F} 分。`);
  q._ok=false; playOutEnd(q,ch,st);
}

function restLine(r){
  if(!r.after.length||!r.done) return '';
  const who=r.after.map(s=>`${SEAT[s]}家出 ${cardName(r.P[s])}`).join(',');
  return `<span class="res">${who} —— 这一墩 <b>${r.got} 分</b>,`+
         `${isUs(r.win)?'<b>你们队</b>':'被<b>对手</b>'}收走。</span>`;
}
function trickHTML(played,lead,winner,showPt,opt){
  opt=opt||{};
  const P=played.map(asArr);
  const wide=Math.max(1,...P.map(a=>a?a.length:1));
  const cell=s=>{
    const a=P[s];
    const cls=[s===0?'mine':s===2?'mate':'', opt.pick?'pickable':'',
               opt.selSeat===s?'selslot':'', opt.okSeat===s?'okslot':'', opt.noSeat===s?'noslot':'',
               opt.open&&opt.open[s]?.length?'has-open':''].join(' ');
    // 队伍题:队伍直接写进座位名,不另加标签(加了会挡住座位名)
    const who = opt.teamTag ? `${SEAT[s]} · ${isUs(s)?'你们队':'对手队'}`
              : opt.decl!=null ? `${SEAT[s]} · ${roleOf(s,opt.decl)}${s===0?'(你)':''}` : nameOf(s);
    const wcls = opt.teamTag ? (isUs(s)?'us':'them') : '';
    return `<div class="slot ${cls}" data-seat="${s}">`+
      `<div class="who ${wcls} ${winner===s?'win':''}">${who}</div>`+
      (a?`<div class="cards${a.length>1?' ov':''}">${a.map(c=>cardHTML(c,'played',showPt,TR)).join('')}</div>`
         :`<div class="ph${opt.wait&&s!==0?' wait':''}"></div>`)+
      (opt.open&&s!==0?`<div class="mini${opt.open[s].length?'':' none'}">`+
        opt.open[s].map(c=>cardHTML(c,'',false,TR)).join('')+`</div>`:'')+`</div>`;
  };
  const wcls=(wide>=3?' m4':wide===2?' m2':'')+(opt.solo?' solo':'');
  if(opt.solo) return `<div class="trickWrap"><div class="trick${wcls}">${cell(0)}</div></div>`;
  return `<div class="trickWrap"><div class="trick${wcls}"><div></div>${cell(2)}<div></div>`+
    `${cell(3)}<div class="tcenter">${lead!=null?SEAT[lead]+' 领出':''}</div>${cell(1)}`+
    `<div></div>${cell(0)}<div></div></div></div>`;
}

/* 摊开给你看的几行牌:出牌记录、明牌残局、自己手上剩什么 */
function rowsHTML(q,rows){
  let h=(rows||q.rows||[]).map(r=>
    `<div class="openrow ${r.me?'me':''}"><b>${r.who}</b><div class="opencards${r.spread?' spread':''}">`+
    r.cards.map(c=>cardHTML(c,'',true,TR)).join('')+`</div></div>`).join('');
  for(const bar of (q.bars||[])){
    const out=bar.out||0, mine=bar.mine||0, left=bar.total-out-mine;
    const cell=(n,cls)=>Array.from({length:Math.max(0,n)},()=>`<i class="${cls}"></i>`).join('');
    h+=`<div class="barrow"><b>${bar.who}</b><div class="bar">`+
       cell(out,'out')+cell(mine,'mine')+cell(left,'')+`</div></div>`+
       `<div class="barfoot"><span class="barsum">外面还有 <b>${left}</b> 张`+
       (bar.note?` · ${bar.note}`:'')+`</span></div>`;
  }
  if((q.bars||[]).length)
    h+=`<div class="barfoot"><span><i class="out"></i>已出过</span>`+
       `<span><i class="mine"></i>你手上</span><span><i></i>还在外面</span></div>`;
  return h;
}
function saySetup(q){
  setCat('idle'); $('bub').className='';
  $('bub').innerHTML=q.prompt+(q.simplify?`<span class="sim">(${q.simplify})</span>`:'');
}
function sayFeedback(ok,text){
  const q=L&&L.qs[qi];
  // 两方案题不是对错题 —— 说「答对了」等于把「取舍」讲成了「标准答案」
  const trade = q && q.badge==='两方案';
  setCat(ok?'good':'bad');
  $('bub').className=ok?'good':'bad';
  $('bub').innerHTML=text;
  $('verdict').textContent = trade ? (ok?'这一手更好':'另一手更好') : (ok?'答对了':'再想想');
  $('foot').className=ok?'good':'bad';
  $('hintBtn').style.display='none';
  $('cta').textContent=ok?'继续':'知道了';
  $('cta').disabled=false;
  $('cta').className='btn'+(ok?'':' red');
  $('cta').dataset.mode=ok?'next':'retry';
}
function paintCtx(q){
  let h='';
  if(q&&q.phase) h+=`<i class="phase">${q.phase}</i>`;
  if(TR&&TR.suit) h+=`<i>打 ${RS(TR.rank)} · ${SYM[TR.suit]}主</i>`;
  const sc=q&&q.score;
  if(sc!=null) h+=`<i class="pts">已抓 ${sc} 分</i>`;
  // 残局题:比分写成「闲家 N 分」(你不一定是闲家);底分只有庄家知道
  if(q&&q.end) h+=`<i class="pts">闲家 ${q.end.def} 分</i><i>底 ${q.end.kittyKnown||q.end.kitty} 分</i>`;
  $('ctx').innerHTML=h;
}

/* ---------- 渲染 ---------- */
function render(){
  saveCheckpoint();
  const q=L.qs[qi];
  $('app').dataset.type=q.type;
  $('app').dataset.evidence=String(!!(q.rows&&q.rows.length));
  $('app').dataset.dense=String(!!(q.hand&&q.hand.length>5));
  TR = q.tr!==undefined ? q.tr : L.tr;                 // 题可以自带一局(用来演示「换级」)
  endGen++;                                            // 上一题还在打的残局,作废
  if(q.end&&!q.phase) q.phase='你是'+roleOf(0,q.end.decl);
  sel=null;selMulti=[];answered=false;hinted=false;
  $('barIn').style.width=(qi/L.qs.length*100)+'%';
  $('lessonPosition').textContent=(qi+1)+' / '+L.qs.length;
  $('badge').textContent=q.badge||'';
  $('task').textContent=q.task;
  paintCtx(q); saySetup(q);
  $('hand').innerHTML='';$('table').innerHTML='';$('hand').style.minHeight='';
  $('foot').className='';$('verdict').textContent='';
  $('hintBtn').style.display='';$('hintBtn').disabled=!q.hint;
  $('cta').textContent=q.type==='discard'?'扣底':(q.type==='trickpick'||q.type==='playset'||q.type==='endplay')?'出牌':'检查';
  $('cta').disabled=true;$('cta').className='btn';$('cta').dataset.mode='check';
  $('btnRow').style.display='';

  if(q.type==='seat'){
    $('table').innerHTML=`<div class="seatmap">
      <div></div><button class="seatbtn" data-s="2">北<small>?</small></button><div></div>
      <button class="seatbtn" data-s="3">西<small>?</small></button>
      <div class="arrowbox">牌桌</div>
      <button class="seatbtn" data-s="1">东<small>?</small></button>
      <div></div><button class="seatbtn me">南<small>你</small></button><div></div></div>`;
    $('table').querySelectorAll('.seatbtn[data-s]').forEach(b=>b.onclick=()=>{
      if(answered)return;
      $('table').querySelectorAll('.seatbtn').forEach(x=>x.classList.remove('sel'));
      b.classList.add('sel');sel=+b.dataset.s;$('cta').disabled=false;});
  }
  else if(q.type==='multi'||q.type==='cardpick'){
    const tr=q.noTrumpTag?'hide':TR;
    $('table').innerHTML=rowsHTML(q)+
      `<div class="pile">${q.cards.map(c=>cardHTML(c,'pick',q.showPt,tr)).join('')}</div>`;
    $('app').querySelectorAll('#hand .card, #table .pile .card').forEach(n=>n.onclick=()=>{
      if(answered)return;
      if(q.type==='cardpick'){
        $('app').querySelectorAll('#hand .card, #table .pile .card').forEach(x=>x.classList.remove('sel'));
        n.classList.add('sel');sel=n.dataset.id;$('cta').disabled=false;return;
      }
      const i=selMulti.indexOf(n.dataset.id);
      if(i<0){selMulti.push(n.dataset.id);n.classList.add('sel');}
      else{selMulti.splice(i,1);n.classList.remove('sel');}
      $('cta').disabled=!selMulti.length;});
  }
  else if(q.type==='ladder'){
    const head=`<div class="ladderHead">闲家方一共抓到 <b>${q.defPoints} 分</b>`+
      (q.kitty?` <small>(含抠底)</small>`:'')+`</div>`;
    $('table').innerHTML=head+`<div class="chips l3">${LADDER.map((o,i)=>`<button class="opt" data-i="${i}">${o}</button>`).join('')}</div>`;
    $('table').querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
      if(answered)return;
      $('table').querySelectorAll('.opt').forEach(x=>x.classList.remove('sel'));
      b.classList.add('sel');sel=+b.dataset.i;$('cta').disabled=false;});
  }
  else if(q.type==='numpick'){
    const top=rowsHTML(q)+(q.cards?`<div class="pile">${q.cards.map(c=>cardHTML(c,'',q.showPt,TR)).join('')}</div>`:'');
    $('table').innerHTML=top+`<div class="chips">${q.opts.map((o,i)=>`<button class="opt" data-i="${i}">${o}</button>`).join('')}</div>`;
    $('table').querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
      if(answered)return;
      $('table').querySelectorAll('.opt').forEach(x=>x.classList.remove('sel'));
      b.classList.add('sel');sel=+b.dataset.i;$('cta').disabled=false;});
  }
  else if(q.type==='winpick'||q.type==='teampick'){
    const tag = q.type==='teampick' ? true : null;
    const draw=()=>{
      $('table').innerHTML=trickHTML(q.played,q.lead,null,q.showPt,
        {pick:true, selSeat:(q.type==='teampick'&&sel!=null)?-1:sel, teamTag:tag, decl:q.decl});
      if(q.type==='teampick'&&sel!=null)
        $('table').querySelectorAll('.slot').forEach(sl=>{ if(+sl.dataset.seat%2===sel) sl.classList.add('selslot'); });
      $('table').querySelectorAll('.slot').forEach(sl=>sl.onclick=()=>{
        if(answered)return;
        sel = q.type==='teampick' ? (+sl.dataset.seat)%2 : +sl.dataset.seat;
        $('cta').disabled=false; draw();});
    };
    draw();
  }
  else if(q.type==='trickpick'||q.type==='playset'||q.type==='discard'){ drawPlay(q); }
  else if(q.type==='endplay'){ endplayStart(q); }
  else if(q.type==='throwjudge'||q.type==='forcedpick'){ drawThrow(q); }
  else if(q.type==='mini') startMini(q);
  if(!$('hand').children.length) $('hand').style.minHeight='0';
}

/* 出牌题:点手牌 → 牌直接打到你的位子上,手牌里那张就不留空位了。
   playset 是它的多张版:领出几张就要挑几张(对子、拖拉机)。 */
function need(q){
  if(q.type==='discard') return q.n;
  return q.type==='playset' ? asArr(q.played[q.lead]).length : 1;
}
/* 选牌只在手牌区完成(选中的牌抬起来),点「出牌」才落到牌桌上 ——
   边点边往桌上飞,交互上像是已经出了,可是还能反悔,自相矛盾 */
function drawPlay(q,handOnly){
  const n=need(q);
  const multi=(q.type==='playset'||q.type==='discard');
  const picked=multi?selMulti:(sel?[sel]:[]);
  // 牌桌只画一次 —— 每点一张手牌就重建牌桌的话,别人已经出的牌会把 playIn 动画
  // 重放一遍(牌一直闪)。正式版 §11.3 早就写过这条,这里同样适用。
  if(!handOnly) $('table').innerHTML=rowsHTML(q)+
    (q.played?trickHTML(q.played,q.lead,null,q.showPt||!!q.end,
       q.end?{wait:true,open:q.end.hands,decl:q.end.decl}:{...soloOpt(q),wait:q.type==='trickpick'})
             :`<div class="kittyBox">扣下去的 ${n} 张<div class="kittySlot">`+
              picked.map(id=>cardHTML(q.hand.find(c=>c.id===id),'',true,TR)).join('')+
              Array.from({length:Math.max(0,n-picked.length)},()=>'<i class="kph"></i>').join('')+
              `</div></div>`);
  $('hand').innerHTML=q.hand.map(c=>cardHTML(c,'pick'+(picked.includes(c.id)?' sel':''),q.showPt,TR)).join('');
  $('hand').querySelectorAll('.card').forEach(el=>el.onclick=()=>{
    if(answered)return;
    const id=el.dataset.id;
    if(multi){
      const i=selMulti.indexOf(id);
      if(i>=0) selMulti.splice(i,1);
      else if(selMulti.length<n) selMulti.push(id);
    } else sel = (sel===id?null:id);
    const ready = multi ? selMulti.length===n : !!sel;
    $('cta').disabled=!ready;
    $('cta').textContent = ready ? (q.type==='discard'?`扣这 ${n} 张`:(n>1?`出这 ${n} 张`:'出牌')) : (q.type==='discard'?'扣底':'出牌');
    drawPlay(q,q.type!=="discard");});
  if($('cta').dataset.mode==='check')
    $('cta').textContent = q.type==='discard'
      ? (picked.length===n?`扣这 ${n} 张`:'扣底')
      : (n>1?(picked.length===n?`出这 ${n} 张`:`已选 ${picked.length} / ${n} 张`):'出牌');
}

/* 甩牌题:四家的这一门牌全摊开(明牌),成不成立交给引擎的 checkThrow 算 */
function throwCards(q){ return q.hands[0].filter(c=>q.throwIds.includes(c.id)); }
function throwResult(q){ return checkThrow(q.hands,0,throwCards(q),TR); }
function drawThrow(q){
  const pickable = q.type==='forcedpick';
  const row=(who,cards,cls,pick)=>
    `<div class="openrow ${cls||''}"><b>${who}</b><div class="opencards${pick?' pickset':''}">`+
    cards.map(c=>cardHTML(c,pick&&selMulti.includes(c.id)?'sel':'',true,TR)).join('')+`</div></div>`;
  let html = row(pickable?'只能出':'你要甩', throwCards(q), 'me', pickable);
  for(const s2 of [1,2,3]) html += row(SEAT[s2], q.hands[s2], '');
  if(q.type==='throwjudge')
    html += `<div class="chips" style="margin-top:8px">${q.opts.map((o,i)=>`<button class="opt" data-i="${i}">${o}</button>`).join('')}</div>`;
  $('table').innerHTML=html;
  if(pickable){
    $('table').querySelectorAll('.pickset .card').forEach(n=>n.onclick=()=>{
      if(answered)return;
      const i=selMulti.indexOf(n.dataset.id);
      if(i<0){selMulti.push(n.dataset.id);n.classList.add('sel');}
      else{selMulti.splice(i,1);n.classList.remove('sel');}
      $('cta').disabled=!selMulti.length;});
  }else{
    $('table').querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
      if(answered)return;
      $('table').querySelectorAll('.opt').forEach(x=>x.classList.remove('sel'));
      b.classList.add('sel');sel=+b.dataset.i;$('cta').disabled=false;});
  }
}

/* ---------- 判分 ---------- */
function check(){
  const q=L.qs[qi];let ok,msg=null,tail='';
  if(q.type==='endplay'){ if(sel) endplayCheck(q); return; }
  if(q.type==='seat'){
    ok=sel===q.answer;
    $('table').querySelectorAll('.seatbtn[data-s]').forEach(b=>{
      const s=+b.dataset.s;b.classList.remove('sel');
      addCls(b,s===q.answer?'ok':s===sel?'no':'');
      b.querySelector('small').textContent=s===q.answer?'队友':'对手';});
  } else if(q.type==='multi'){
    ok=selMulti.length===q.answer.length&&q.answer.every(a=>selMulti.includes(a));
    $('app').querySelectorAll('#hand .card, #table .pile .card').forEach(n=>{
      const isA=q.answer.includes(n.dataset.id);n.classList.remove('sel');
      addCls(n,isA?'ok':selMulti.includes(n.dataset.id)?'no':'dim');
      if(q.noTrumpTag&&TR){const c=q.cards.find(x=>x.id===n.dataset.id);
        if(effSuit(c,TR)==='T')n.insertAdjacentHTML('beforeend','<span class="trumpTag">主</span>');}});
  } else if(q.type==='cardpick'){
    ok=sel===q.answer;
    $('app').querySelectorAll('#hand .card, #table .pile .card').forEach(n=>{
      n.classList.remove('sel');
      addCls(n,n.dataset.id===q.answer?'ok':n.dataset.id===sel?'no':'');});
  } else if(q.type==='ladder'){
    const want=ladderIdx(q.defPoints,q.kitty,q.wonLast,q.lastLeadSize);
    ok=sel===want;
    $('table').querySelectorAll('.opt').forEach(b=>{
      const i=+b.dataset.i;b.classList.remove('sel');
      addCls(b,i===want?'ok':i===sel?'no':'');});
  } else if(q.type==='numpick'){
    ok=sel===q.answer;
    $('table').querySelectorAll('.opt').forEach(b=>{
      const i=+b.dataset.i;b.classList.remove('sel');
      addCls(b,i===q.answer?'ok':i===sel?'no':'');});
  } else if(q.type==='winpick'||q.type==='teampick'){
    ok=sel===q.answer;
    const hit=s=>q.type==='teampick'?s%2===q.answer:s===q.answer;
    const miss=s=>q.type==='teampick'?s%2===sel:s===sel;
    $('table').innerHTML=trickHTML(q.played,q.lead,q.type==='winpick'?q.answer:null,q.showPt,
      {teamTag:q.type==='teampick'?true:null, decl:q.decl});
    $('table').querySelectorAll('.slot').forEach(sl=>{
      const s=+sl.dataset.seat;
      if(hit(s))sl.classList.add('okslot'); else if(miss(s))sl.classList.add('noslot');});
  } else if(q.type==='throwjudge'){
    const r=throwResult(q);                       // 成不成立由引擎说了算,题里不写死
    const want=r.ok?0:1;
    ok=sel===want;
    $('table').querySelectorAll('.opt').forEach(b=>{
      const i=+b.dataset.i;b.classList.remove('sel');
      addCls(b,i===want?'ok':i===sel?'no':'');});
  } else if(q.type==='forcedpick'){
    const r=throwResult(q);
    const want=(r.forced||[]).map(c=>c.id);
    ok = want.length===selMulti.length && want.every(id=>selMulti.includes(id));
    $('table').querySelectorAll('.pickset .card').forEach(n=>{
      n.classList.remove('sel');
      addCls(n, want.includes(n.dataset.id)?'ok':selMulti.includes(n.dataset.id)?'no':'dim');});
  } else if(q.type==='discard'){
    ok = q.answer.length===selMulti.length && q.answer.every(a=>selMulti.includes(a));
    const pts=countPoints(selMulti.map(id=>q.hand.find(c=>c.id===id)));
    $('table').innerHTML=rowsHTML(q)+
      `<div class="kittyBox ${ok?'ok':'no'}">扣下去的 ${q.n} 张 · 带走 <b>${pts} 分</b>`+
      `<div class="kittySlot">`+selMulti.map(id=>cardHTML(q.hand.find(c=>c.id===id),'',true,TR)).join('')+`</div></div>`;
    $('hand').innerHTML=q.hand.filter(c=>!selMulti.includes(c.id))
      .map(c=>cardHTML(c,q.answer.includes(c.id)?'ok':'dim',true,TR)).join('');
  } else if(q.type==='playset'){
    // 合法性交给引擎的 isLegalFollow —— 「门里有对必出对、有拖必跟拖」这套判定
    // 自己重写一份必错,这正是把那一段整体搬过来的理由
    const leadCards=asArr(q.played[q.lead]);
    const lead=classify(leadCards,TR);
    const chosen=selMulti.map(id=>q.hand.find(c=>c.id===id));
    const isLegal=isLegalFollow(q.hand,lead,chosen,TR);
    ok = q.anyLegal ? isLegal
       : (isLegal && q.answer.length===chosen.length && q.answer.every(a=>selMulti.includes(a)));
    if(!isLegal&&q.illegal) msg=q.illegal;
    const played=q.played.slice(); played[0]=chosen;
    $('table').innerHTML=trickHTML(played,q.lead,null,q.showPt);
    const mine=$('table').querySelector('.slot[data-seat="0"]');
    if(mine)mine.classList.add(ok?'okslot':'noslot');
    const right=q.anyLegal?[]:q.answer;
    $('hand').innerHTML=q.hand.filter(c=>!selMulti.includes(c.id))
      .map(c=>cardHTML(c,right.includes(c.id)?'ok':'dim',q.showPt,TR)).join('');
  } else if(q.type==='trickpick'){
    const led=q.lead!=null&&q.played[q.lead]?effSuit(q.played[q.lead],TR):null;
    const legal=legalSet(q.hand,led,TR).map(c=>c.id);
    const isLegal=legal.includes(sel);
    // accept:几张牌同样好的时候(比如两张都不带分的小牌)都算对,别为了唯一答案硬挑一张
    ok = q.anyLegal ? isLegal : (isLegal && (sel===q.answer || (q.accept||[]).includes(sel)));
    if(!isLegal&&q.illegal) msg=q.illegal;              // 违规牌:指着他手里剩的那张说
    if(q.end&&isLegal){
      // 残局:这一手之后,四家都按最优打完 —— 结果一墩一墩摆给他看
      q._ok=ok;
      const mv=endMoves(endState(q),TR).find(m=>m.card.id===sel);
      answered=true;if(!ok)wrong++;
      sayFeedback(ok, ok?q.good:(msg||q.bad));
      playOutEnd(q,mv);
      return;
    }
    const r=finishTrick(q,q.hand.find(c=>c.id===sel));
    $('table').innerHTML=rowsHTML(q)+trickHTML(r.P,q.lead,r.done?r.win:null,q.showPt,soloOpt(q));
    if(isLegal) tail=restLine(r);
    const mine=$('table').querySelector('.slot[data-seat="0"]');
    if(mine)mine.classList.add(ok?'okslot':'noslot');
    $('hand').innerHTML=q.hand.filter(c=>c.id!==sel)
      .map(c=>cardHTML(c,c.id===q.answer||(q.accept||[]).includes(c.id)?'ok':'dim',q.showPt,TR)).join('');
  }
  answered=true;if(!ok)wrong++;
  // key:这道题真正要看的那张牌(通常是身后那家掏出来的 ♣K)。圈出来,比一句解释省地方
  if(q.key) $('app').querySelectorAll('#hand .card, #table .pile .card').forEach(n=>{ if(q.key.includes(n.dataset.id)) n.classList.add('key'); });
  sayFeedback(ok, (ok?q.good:(msg||q.bad))+tail);
}

$('cta').onclick=()=>{
  const m=$('cta').dataset.mode;
  if(m==='check'){ if(!answered)check(); return; }
  if(m==='next'){ qi++; qi>=L.qs.length?finish():render(); return; }
  render();
};
$('hintBtn').onclick=()=>{
  const q=L.qs[qi];if(!q.hint||hinted)return;hinted=true;
  $('bub').innerHTML+=`<span class="tip">💡 ${relativeCopy(q.hint)}</span>`;
  $('hintBtn').disabled=true;
};

/* ---------- 小局 ---------- */
function startMini(q){
  mini={hands:q.hands.map(h=>h.slice()),lead:q.lead,played:[null,null,null,null],
        turn:q.lead,score:[0,0],trick:1,busy:false,gen:(mini?mini.gen+1:1),
        goal:q.goal||'',start:q.score||0,
        kitty:q.kitty||[],lastWin:null,lastSize:1};
  $('btnRow').style.display='none';paintMini();
  step(()=>aiStep(),PACE.step);
}
/* 所有小局定时器都走这里:gen 一变,在途的回调全部作废 ——
   裸 setTimeout 会让上一墩的排程回来再出一张牌,同一家出两张、endTrick 跑两次 */
function step(fn,ms){ const g=mini.gen; setTimeout(()=>{ if(mini&&mini.gen===g&&mini.turn!==0) fn(); },ms); }
function stepAny(fn,ms){ const g=mini.gen; setTimeout(()=>{ if(mini&&mini.gen===g) fn(); },ms); }
function ledSuitNow(){ const m=mini,c=m.played[m.lead]; return c?effSuit(c,TR):null; }
function paintMini(){
  const m=mini;
  $('task').textContent=`第 ${m.trick} 墩`;
  paintCtx({score:m.start+m.score[0]});                 // 抓到的分实时跳,和目标挂上钩
  $('bub').className='';
  // 说清楚这一手在决定什么,而不是干巴巴报个比分
  const onTable=m.played.reduce((a,c)=>a+(c?pts(c):0),0);
  let line;
  if(m.turn!==0) line=`目前已抓 <b>${m.start+m.score[0]} 分</b>。<b>${nameOf(m.turn)}</b> 在出牌…`;
  else if(!m.played[m.lead]) line=`轮到你<b>领出</b> —— 这一墩由你起头。`;
  else{
    const w=partialWinner(m.played,m.lead,TR);
    line=`轮到你了。台面 <b>${onTable} 分</b>,现在最大的是 <b>${nameOf(w)}</b> —— `+
         (isUs(w)?'这一墩暂时是你们队的。':'要不要抢下来?');
  }
  $('bub').innerHTML=line;
  $('table').innerHTML=trickHTML(m.played,m.lead,null,true);
  const legal=legalSet(m.hands[0],ledSuitNow(),TR).map(c=>c.id);
  // 已经学过的规则:非法牌直接点不动
  $('hand').innerHTML=m.hands[0].map(c=>cardHTML(c,'pick'+(legal.includes(c.id)?'':' dim'),true,TR)).join('');
  $('hand').querySelectorAll('.card').forEach(n=>n.onclick=()=>{
    if(mini.turn!==0||mini.busy)return;
    if(!legal.includes(n.dataset.id))return;
    playCard(0,mini.hands[0].find(c=>c.id===n.dataset.id));});
  if(!$('hand').children.length) $('hand').style.minHeight='0';
}
function playCard(seat,card){
  const m=mini;
  if(!card||m.busy||seat!==m.turn||m.played[seat])return;
  m.hands[seat]=m.hands[seat].filter(c=>c.id!==card.id);
  m.played[seat]=card;m.turn=(m.turn+1)%4;
  const full=m.played.every(Boolean);
  if(full)m.busy=true;
  paintMini();
  if(full) stepAny(endTrick,PACE.step); else step(()=>aiStep(),PACE.step);
}
function aiStep(){
  const m=mini;if(m.turn===0){paintMini();return;}
  const legal=legalSet(m.hands[m.turn],ledSuitNow(),TR).slice().sort((a,b)=>ordIdx(a,TR)-ordIdx(b,TR));
  if(!m.played[m.lead]){ playCard(m.turn,legal[legal.length-1]); return; }   // 领出:出最大的
  const w=partialWinner(m.played,m.lead,TR);
  const mateWinning = m.played[w] && w%2===m.turn%2 && w!==m.turn;
  let pick;
  if(mateWinning)
    pick=legal.slice().sort((a,b)=>pts(b)-pts(a)||ordIdx(a,TR)-ordIdx(b,TR))[0];   // 队友最大 → 贴分
  else{
    const beats=legal.filter(c=>{
      const t=m.played.slice(); t[m.turn]=c;
      return winnerOf(fill(t,m),m.lead,TR)===m.turn;
    });
    pick=beats.length?beats[0]:legal[0];
  }
  playCard(m.turn,pick);
}
function fill(t,m){
  const out=[null,null,null,null];
  for(let k=0;k<4;k++){const s=(m.lead+k)%4; if(t[s])out[s]=t[s]; else break;}
  if(t[m.turn])out[m.turn]=t[m.turn];
  return out;
}
function endTrick(){
  const m=mini;
  const win=winnerOf(m.played,m.lead,TR);
  const got=m.played.reduce((a,c)=>a+countPoints(asArr(c)||[]),0);
  m.score[win%2===0?0:1]+=got;
  m.lastWin=win; m.lastSize=asArr(m.played[m.lead]).length;   // 抠底倍数看最后一墩每人出几张
  m.busy=true;
  flyToWinner(win,()=>{
    $('table').innerHTML=trickHTML(m.played,m.lead,win,true);
    $('task').textContent=`${nameOf(win)} 收走`;
    paintCtx({score:m.start+m.score[0]});
    setCat(isUs(win)?'good':'idle');
    $('bub').className=isUs(win)?'good':'';
    $('bub').innerHTML=got?`这一墩有 <b>${got} 分</b>,${isUs(win)?'进<b>你们队</b>的账。':'被<b>对手</b>拿走了。'}`
                          :'这一墩<b>没有分</b>。';
    stepAny(()=>{
      if(!m.hands[0].length){
        $('btnRow').style.display='';$('hintBtn').style.display='none';answered=true;
        sayFeedback(true,
          `你们队又抓了 <b>${m.score[0]} 分</b>。`+
          settleLine(m.start+m.score[0], m.kitty, isUs(m.lastWin), m.lastSize)+
          `<span class="sim">${L.qs[qi].good}</span>`);
        return;
      }
      m.gen++;
      m.played=[null,null,null,null];m.lead=win;m.turn=win;m.trick++;m.busy=false;
      paintMini();step(()=>aiStep(),PACE.step);
    },PACE.review);
  });
}
function flyToWinner(win,cb){
  const generation=mini&&mini.gen;
  const t=[...$('table').querySelectorAll('.slot')].find(s=>+s.dataset.seat===win).getBoundingClientRect();
  [...$('table').querySelectorAll('.slot .card')].forEach(c=>{
    const r=c.getBoundingClientRect(),f=c.cloneNode(true);
    f.classList.add('flyer');f.classList.remove('played');
    f.style.cssText+=`position:fixed;left:${r.left}px;top:${r.top}px;width:${r.width}px;height:${r.height}px;margin:0`;
    document.body.appendChild(f);
    requestAnimationFrame(()=>{
      f.style.transform=`translate(${t.left-r.left+10}px,${t.top-r.top+8}px) scale(.45)`;
      f.style.opacity='0';});
    setTimeout(()=>f.remove(),PACE.fly+40);
  });
  setTimeout(()=>{if(mini&&mini.gen===generation&&$('app').dataset.screen==='q')cb();},PACE.fly+60);
}

/* ---------- 起止 ---------- */
function start(u,i){
  if(new URLSearchParams(location.search).has('course-preview')){location.assign(location.pathname+'?template='+UNITS[u].lessons[i].qs[0].type);return;}
  if(mini)mini.gen++;
  ui=u; li=i; L=UNITS[u].lessons[i]; TR=L.tr;
  const saved=readCheckpoint();
  const resume=saved&&saved.ui===u&&saved.li===i;
  qi=resume?saved.qi:0;wrong=resume?saved.wrong:0;t0=Date.now()-(resume?saved.elapsed:0);show('q');render();
}
function finish(){
  studyStore.remove('checkpoint');
  if(mini)mini.gen++;
  const n=L.qs.length,sec=Math.round((Date.now()-t0)/1000);
  $('sAcc').textContent=Math.round(n/(n+wrong)*100)+'%';
  $('sTime').textContent=sec>=60?Math.floor(sec/60)+':'+String(sec%60).padStart(2,'0'):sec+'秒';
  const U=UNITS[ui];
  if(li+1>doneCount(U.key)) studyStore.set(U.key,String(li+1));
  const nxt=U.lessons[li+1], nu=UNITS[ui+1];
  $('done').querySelector('h2').textContent=nxt?'这一课通关了':`${U.name.split(' · ')[1]} 打完了`;
  $('done').querySelector('p').textContent=
    nxt?`下一课:${nxt.name}`:(nu?`解锁:${nu.name}`:'所有课程都练过了，去牌桌试试吧');
  $('memo').innerHTML=L.sum?`<b>这一课记住一句</b>${L.sum}`:'';
  $('doneBtn').textContent=nxt?'下一课 · '+nxt.name:nu?'开始下一单元':'回到课程';
  $('barIn').style.width='100%';show('done');drawMap();
}
$('doneBtn').onclick=()=>{const U=UNITS[ui];if(U.lessons[li+1])start(ui,li+1);else if(UNITS[ui+1])start(ui+1,0);else show('map');};
$('doneMap').onclick=()=>show('map');
$('quit').setAttribute('aria-label','保存进度，返回课程');
$('quit').onclick=()=>{pauseLesson();drawMap();show('map');};

/* Presentation-only adapter v2. Course content and answer evaluation remain in the source lesson.
   与原型 ui/scripts/study-surface.js 的差异:
   1. 不再整体替换 trickHTML —— 新版学牌的 trickHTML 支持 opt.wait / opt.open / opt.decl /
      solo 等残局特性,替换会丢信息。改为渲染后给 .trick 补 .learning-table 类换肤,
      study-layout.css / table-surface.css 的槽位规则与原 DOM 同构,直接生效。
   2. hasHand 类型清单补上 endplay(残局实战要用手牌,否则手牌行被压到 20px)。
   3. 甩牌/forcedpick 的证据牌桌、认牌/扣底模板照搬原型(输入同构,已核对)。 */
function relativeCopy(text){return String(text||'').replace(/你坐\s*<b>南<\/b>\s*边/g,'你在牌桌下方').replace(/[东南西北](?=<\/b>)/g,s=>({'东':'下家','西':'上家','北':'对家','南':'你'}[s])).replace(/南北/g,'你和对家').replace(/东西/g,'上家和下家').replace(/北家|北边/g,'对家').replace(/东家|东边/g,'下家').replace(/西家|西边/g,'上家').replace(/南家|南边/g,'你这边');}
function fanStudyHand(){
  const cards=[...$('hand').querySelectorAll('.card')],n=cards.length;
  $('hand').style.setProperty('--fan-count',Math.max(1,n));
  cards.forEach((c,i)=>{const t=n<2?0:(i-(n-1)/2)/((n-1)/2);c.style.setProperty('--fan-i',i);c.style.setProperty('--fan-angle',(t*Math.min(18,n*2.4))+'deg');c.style.setProperty('--fan-arc',(t*t*10)+'px');});
}
/* 换肤钩子(关键):直接包一层 trickHTML,把 learning-table 类写进生成产物。
   winpick/teampick 点座位、mini 收墩、残局逐墩推进都会**绕过 render()** 局部重写
   #table.innerHTML —— 事后由 decorateStudy 补类的方案在这些路径上会让新一帧
   牌桌短暂失去毡面/槽位布局(用户看到的"牌桌变形、检查后又变回")。
   在函数产出上注入,任何调用方、任何时机都带上换肤。 */
const sourceTrickHTML=trickHTML;
trickHTML=function(played,lead,winner,showPt,opt){
  return sourceTrickHTML(played,lead,winner,showPt,opt)
    .replace(/class="trick(?=[" ])/,'class="trick learning-table');
};
function decorateStudy(){
  if(!L)return;
  const q=L.qs[qi],pickCards=q.type==='multi'||q.type==='cardpick';
  $('app').dataset.surface=['ladder','discard'].includes(q.type)||(q.type==='numpick'&&!q.cards)?'focused':'table';
  $('app').dataset.hasHand=String(pickCards||['trickpick','playset','discard','mini','endplay'].includes(q.type));
  if(pickCards&&!answered)renderRecognition(q);
  if(q.type==='discard'){renderKitty(q);if(!answered){$('task').textContent='完成 8 张底牌';$('bub').innerHTML=q.n===3?'8 张底牌中，已固定扣下 <b>5 张</b>。再从手牌选 <b>3 张</b>，留意能否断门，以及带走的分数。':`已固定扣下 <b>${8-q.n} 张</b>，还需选 <b>${q.n} 张</b>。`+relativeCopy(q.prompt);}}
  if(q.type==='numpick'&&q.cards&&!$('table').querySelector('.learning-table')){
    const board=document.createElement('div');board.className='learning-table number-table';
    const pile=$('table').querySelector('.pile'),chips=$('table').querySelector('.chips');if(pile)board.append(pile);if(chips)board.append(chips);$('table').append(board);
  }
  if(q.type==='seat'){$('table').querySelector('.seatmap')?.classList.add('learning-table');const names={2:'对家',3:'上家',1:'下家'};$('table').querySelectorAll('.seatbtn[data-s]').forEach(b=>{b.firstChild.textContent=names[b.dataset.s];});const me=$('table').querySelector('.seatbtn.me');if(me){me.firstChild.textContent='你';me.querySelector('small').textContent='自己';}}
  $('bub').innerHTML=relativeCopy($('bub').innerHTML);
  $('table').querySelectorAll('.openrow>b').forEach(n=>{n.textContent=relativeCopy(n.textContent).replace(/^北(?=\s|$)/,'对家').replace(/^东(?=\s|$)/,'下家').replace(/^西(?=\s|$)/,'上家');});
  // 换肤钩子:给本墩牌桌穿上 learning-table 外观(布局规则见 study-layout/table-surface)
  $('table').querySelectorAll('.trick').forEach(t=>t.classList.add('learning-table'));
  fanStudyHand();
}
function renderRecognition(q){
  const picked=q.type==='multi'?selMulti:(sel?[sel]:[]),tr=q.noTrumpTag?'hide':TR;
  $('table').innerHTML=rowsHTML(q)+`<div class="learning-table recognition-table"><div class="recognition-caption">${picked.length?'已选 '+picked.length+' 张 · 点牌可收回':'把符合条件的牌选到桌上'}</div><div class="picked-cards pile">${q.cards.filter(c=>picked.includes(c.id)).map(c=>cardHTML(c,'pick sel',q.showPt,tr)).join('')}</div></div>`;
  $('hand').innerHTML=q.cards.filter(c=>!picked.includes(c.id)).map(c=>cardHTML(c,'pick',q.showPt,tr)).join('');
  $('app').querySelectorAll('#hand .card,#table .picked-cards .card').forEach(n=>n.onclick=()=>{
    if(answered)return;const id=n.dataset.id;
    if(q.type==='cardpick')sel=sel===id?null:id;
    else{const i=selMulti.indexOf(id);if(i<0)selMulti.push(id);else selMulti.splice(i,1);}
    $('cta').disabled=q.type==='multi'?!selMulti.length:!sel;
    renderRecognition(q);fanStudyHand();
  });
}
function renderKitty(q){
  const fixed=8-q.n,chosen=selMulti.map(id=>q.hand.find(c=>c.id===id));
  $('table').innerHTML=rowsHTML(q)+`<section class="kitty-display"><div class="kitty-heading"><strong>底牌 ${fixed+chosen.length} / 8</strong><span>${answered?'本次扣入 '+countPoints(chosen)+' 分':(chosen.length===q.n?'已选满，可点牌调整':'已固定 '+fixed+' 张，还差 '+(q.n-chosen.length)+' 张')}</span></div><div class="eight-kitty">${Array.from({length:fixed},(_,i)=>`<div class="kitty-fixed" aria-label="已固定扣下的底牌 ${i+1}"><span>✓</span><small>已扣</small></div>`).join('')}${Array.from({length:q.n},(_,i)=>chosen[i]?cardHTML(chosen[i],answered?'':'pick sel',true,TR):'<div class="kitty-empty" aria-label="待扣底牌">＋</div>').join('')}</div></section>`;
  if(answered)return;
  $('hand').innerHTML=q.hand.filter(c=>!selMulti.includes(c.id)).map(c=>cardHTML(c,'pick',q.showPt,TR)).join('');
  $('app').querySelectorAll('#hand .card,#table .eight-kitty .card').forEach(n=>n.onclick=()=>{
    if(answered)return;const id=n.dataset.id,i=selMulti.indexOf(id);
    if(i>=0)selMulti.splice(i,1);else if(selMulti.length<q.n)selMulti.push(id);
    $('cta').disabled=selMulti.length!==q.n;$('cta').textContent=selMulti.length===q.n?'确认这 8 张底牌':`已扣 ${fixed+selMulti.length} / 8 张`;
    renderKitty(q);fanStudyHand();
  });
  $('cta').textContent=selMulti.length===q.n?'确认这 8 张底牌':`已扣 ${fixed+selMulti.length} / 8 张`;
}
drawThrow=function(q){
  const pick=q.type==='forcedpick',attempt=throwCards(q),count=Math.max(...q.hands.map(h=>h.length));
  const evidence=[2,3,1].map(s=>`<div class="evidence-hand" data-seat="${s}"><span>${SEAT[s]} · ${s===2?'队友':'对手'}</span><div class="evidence-cards">${Array.from({length:count-q.hands[s].length},()=>'<div class="evidence-back" aria-label="与本题判断无关的手牌牌背"></div>').join('')}${q.hands[s].map(c=>cardHTML(c,'',false,TR)).join('')}</div></div>`).join('');
  $('table').innerHTML=`<div class="learning-table throw-table">${evidence}<div class="throw-center">${pick?'<span>甩牌失败<br>点选必须打出的牌</span>':`<div class="chips">${q.opts.map((o,i)=>`<button class="opt" data-i="${i}">${o}</button>`).join('')}</div>`}</div><div class="attempted-play"><span>你尝试甩出</span><div class="cards ov ${pick?'pickset':''}">${attempt.map(c=>cardHTML(c,pick?'played pick':'played',true,TR)).join('')}</div></div></div>`;
  if(pick){$('hand').innerHTML='';$('table').querySelectorAll('.pickset .card').forEach(n=>n.onclick=()=>{if(answered)return;const i=selMulti.indexOf(n.dataset.id);if(i<0)selMulti.push(n.dataset.id);else selMulti.splice(i,1);n.classList.toggle('sel',i<0);$('cta').disabled=!selMulti.length;});}
  else $('table').querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(answered)return;$('table').querySelectorAll('.opt').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');sel=+b.dataset.i;$('cta').disabled=false;});
};
const sourceRender=render,sourceDrawPlay=drawPlay,sourceCheck=check,sourcePaintMini=paintMini,sourceFeedback=sayFeedback;
render=function(){sourceRender();decorateStudy();};
drawPlay=function(q,handOnly){sourceDrawPlay(q,handOnly);fanStudyHand();};
check=function(){sourceCheck();decorateStudy();};
paintMini=function(){sourcePaintMini();decorateStudy();};
sayFeedback=function(ok,text){sourceFeedback(ok,relativeCopy(text));};

// Design review entry points. Fixtures never read/write real lesson completion.
const templateParams=new URLSearchParams(location.search),templateType=templateParams.get('template');
if(templateType){
  const fixtures=[];
  UNITS.forEach((u,unit)=>u.lessons.forEach((lesson,lessonIndex)=>lesson.qs.forEach((q,index)=>{if(q.type===templateType)fixtures.push({unit,lessonIndex,index});})));
  const variant=Math.max(0,Math.min(fixtures.length-1,Number(templateParams.get('variant'))||0)),fixture=fixtures[variant];
  if(fixture){
    ui=fixture.unit;li=fixture.lessonIndex;L=UNITS[ui].lessons[li];qi=fixture.index;TR=L.tr;t0=Date.now();show('q');render();
    $('quit').onclick=()=>location.assign(location.pathname);$('quit').setAttribute('aria-label','返回题型模板');
    $('lessonPosition').textContent='模板 '+(variant+1)+' / '+fixtures.length;
    const state=templateParams.get('state')||'idle';
    if(templateType==='mini'){if(mini)mini.gen++;}
    if(state==='selected'){
      const first=$('hand').querySelector('.card:not(.dim)')||$('table').querySelector('.pickset .card,.pile .card.pick,.slot.pickable,.seatbtn[data-s],.opt');
      if(first)first.click();
      if(mini)mini.gen++;
    }
    if(state==='correct'||state==='wrong'){
      answered=true;if(mini){mini.gen++;const q=L.qs[qi],played=q.hands.map(h=>h[0]);$('table').innerHTML=trickHTML(played,q.lead,winnerOf(played,q.lead,TR),true);}
      sayFeedback(state==='correct',state==='correct'?(L.qs[qi].good||'这一手完成了。看看桌上的牌，再继续下一题。'):(L.qs[qi].bad||'再看看领出的花色，想一想这一手该怎么跟。'));
      $('btnRow').style.display='';syncStudyControls();
    }
    if(state==='waiting'){
      if(mini)mini.gen++;
      $('btnRow').style.display='none';$('verdict').textContent='对手正在出牌…';
      $('hand').querySelectorAll('.card').forEach(n=>{n.onclick=null;n.tabIndex=-1;n.setAttribute('aria-disabled','true');});
    }
    // Template navigation stays in this fixture and cannot complete a real lesson.
    $('cta').onclick=()=>{if(answered)render();else check();};
    $('doneBtn').onclick=()=>location.assign(location.pathname);
    $('app').dataset.template='true';
  }else{drawMap();show('map');}
}else{setCat('idle');drawMap();show('map');}


/* 给测试用的出口。整段代码在 IIFE 里,页面上看不见 —— 没有这个出口,
   走查脚本只能点界面,没法把每道题的标答拿去问引擎「这手合法吗、赢不赢」。
   ♥A♥A+♥J♥J 算不算拖拉机这种事,脑内推演是会推错的。 */
window.__LEARN__={UNITS,endSolve,endMoves,ladderKey,winnerOf,isLegalFollow,legalSet,effSuit,classify,structMatches,countPoints,finishTrick};
})();
</script>
