<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fffcf6"><title>80分 · 手中有牌</title><link rel="stylesheet" href="table.css?v=d48efb9869eb"><link rel="stylesheet" href="landscape.css?v=c65481e452b8"><link rel="stylesheet" href="theme.css?v=5989a8d21e5c"><link rel="stylesheet" href="leo-theme.css?v=f6202a27e3d7"><link rel="stylesheet" href="table-surface.css?v=d2be5610854c"></head>
<body><main class="game" id="game">
<header class="status-bar"><div class="status-main"><span class="brand">80<span>分</span></span><nav class="mode-nav" aria-label="模式"><span aria-current="page">打牌</span><a href="learn.html">学牌</a></nav><div class="trump-status" id="trumpStatus"></div><button class="menu-button" id="menu" aria-label="打开牌局菜单">☰</button></div><div class="score-line"><span id="role">我方攻分</span><div class="score-track" role="progressbar" id="scoreTrack" aria-label="抢分进度" aria-valuemin="0" aria-valuemax="80"><i id="scoreFill"></i></div><span><b id="score">55</b><span class="score-goal"> / 80</span></span></div></header>
<section class="arena" id="arena" aria-label="牌桌，拖到这里出牌"><div class="felt" aria-hidden="true"></div><div class="table-mark" aria-hidden="true">八十分<span>SHENG JI</span></div><div id="players"></div><div class="table-points" id="tablePoints"><strong id="instruction"></strong><div><span>本墩 </span><b id="trickPoints">20</b><span> 分</span></div></div><div id="myPlay" class="my-play"></div><div id="declarationPile" class="declaration-pile"></div><div class="drop-cue" id="dropCue"><span>松手出牌</span></div></section>
<section class="table-edge" id="tableEdge" aria-label="当前动作"><div class="turn-copy"><span id="context"></span></div><button id="tapPlay" hidden>出牌</button><div class="bid-actions" id="bidActions" hidden><button id="bidAction">亮 / 反主</button></div></section>
<section class="hand-area" id="handArea" aria-label="我的扇形手牌"><div class="fan-viewport" id="fanViewport"><div class="fan-row" id="fan0" role="group" aria-label="上层手牌"></div><div class="fan-row" id="fan1" role="group" aria-label="下层手牌"></div></div><div class="hand-empty" id="handEmpty" hidden>本次演示结束</div></section>
<div class="hand-wheel" id="handWheel"><span id="handCount">25 张</span><input type="range" id="pan" min="0" max="100" value="50" aria-label="左右移动手牌"><span id="panHint">左右拨牌</span></div>
<footer class="bottom-tools"><button id="coachHelp" class="coach-tool" aria-label="问六六教练"><span class="leo-avatar" aria-hidden="true"></span><span>问六六</span></button><button id="kitty"><span aria-hidden="true">▱</span> 看底牌</button><button id="clear">清选</button><button id="sort">理牌 ↓</button><button id="expand">展牌</button><button id="buryConfirm" hidden>埋底 0/8</button></footer>
<div class="live-message" id="liveMessage" role="status" aria-live="polite"></div>
</main><div id="loupe" class="loupe" hidden aria-hidden="true"></div><div id="dragGhost" class="drag-ghost" hidden aria-hidden="true"></div>
<dialog id="sheet" aria-labelledby="sheetTitle"><header class="sheet-header"><h2 id="sheetTitle"></h2><button id="closeSheet" aria-label="关闭">✕</button></header><div id="sheetBody"></div><footer id="sheetFooter" hidden><div id="sheetSelection" aria-live="polite"></div><div class="sheet-actions"><button id="clearAll">清选</button><button id="sheetSubmit">出牌</button></div></footer></dialog>
<script src="engine.js?v=0d6754d1a17a"></script><script src="fan.js?v=1abd3ffdf357"></script><script src="table.js?v=40b1619ad041"></script></body></html>
