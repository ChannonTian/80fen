<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f6f5f1"><title>80分 · 竖屏新牌桌</title><link rel="stylesheet" href="table.css"></head>
<body>
<main class="game">
  <header class="topbar"><div class="game-title">80<span>分</span></div><div class="trump-label"><span class="red">♥</span> 主 · 打 5</div><button class="icon-button" id="menu" aria-label="打开菜单">•••</button></header>
  <section class="round" aria-label="当前牌局">
    <div class="round-meta"><span id="role">我方攻分</span><div><strong id="score">55</strong><span class="score-target"> / 80</span></div><button id="history">本墩 <b id="trickPoints">20</b> 分 <span aria-hidden="true">↗</span></button></div>
    <div class="trick" id="trick"></div>
  </section>
  <section class="hand-section" aria-label="我的手牌">
    <div class="hand-heading"><div><h1 id="instruction">跟一对方块</h1><p id="context">轮到你 · 对家暂大</p></div><button id="overview">全手牌 <span id="handCount">25</span><span aria-hidden="true"> ↗</span></button></div>
    <div class="suit-tabs" id="suitTabs" role="tablist" aria-label="选择手牌花色"></div>
    <div class="hand-scroll" id="handScroll" tabindex="0" role="tabpanel" aria-label="当前花色手牌"><div class="card-grid" id="hand"></div><p class="hand-end" id="handEnd"></p></div>
  </section>
  <footer class="action-dock"><div class="selection-status" id="selectionStatus" aria-live="polite"></div><div class="actions"><button id="clear">清空</button><button id="submit" disabled><span id="submitLabel">选 2 张牌出牌</span><span aria-hidden="true">↑</span></button></div></footer>
</main>
<dialog id="sheet" aria-labelledby="sheetTitle"><div class="sheet-header"><h2 id="sheetTitle"></h2><button class="icon-button" id="closeSheet" aria-label="关闭">✕</button></div><div id="sheetBody"></div><div class="sheet-footer" id="sheetFooter" hidden><div id="sheetSelection" aria-live="polite"></div><div class="actions"><button id="clearAll">清空</button><button id="backToTable">出牌</button></div></div></dialog>
<script src="engine.js"></script><script src="table.js"></script>
</body></html>
