<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>80分 · 屏幕实验室</title><link rel="stylesheet" href="lab.css"></head><body>
<aside><a href="index.html">← 回到牌桌</a><h1>屏幕实验室</h1><p>保持实际 CSS 像素大小。<br>不缩放整张牌桌。</p><h2>屏幕大小</h2><div id="sizes"><button data-w="320" data-h="568">320 × 568 · 小屏竖向</button><button data-w="390" data-h="844">390 × 844 · 手机竖向</button><button data-w="568" data-h="320">568 × 320 · 小屏横向</button><button data-w="844" data-h="390" class="active">844 × 390 · 手机横向</button><button data-w="768" data-h="1024">768 × 1024 · 平板竖向</button><button data-w="1024" data-h="768">1024 × 768 · 平板横向</button><button data-w="1440" data-h="900">1440 × 900 · 桌面</button></div><h2>演示局面</h2><div id="scenes"><button data-scene="follow" class="active">跟对子</button><button data-scene="lead">出拖拉机</button><button data-scene="bury">33 张 · 扣底</button><button data-scene="declare">亮主 / 加固</button><button data-scene="counter">反主</button></div><p>宽屏优先单层扇形；空间不足时保留双层或左右拨牌。换尺寸不会重开局面。</p><a href="DESIGN.md">设计说明 ↗</a></aside>
<main><div class="ruler" id="dimensions">844 × 390</div><iframe src="index.html?layout=auto" title="可切换横竖屏的牌桌原型" id="table" width="844" height="390"></iframe></main>
<script>const f=document.getElementById('table');document.querySelectorAll('[data-w]').forEach(b=>b.onclick=()=>{f.width=b.dataset.w;f.height=b.dataset.h;document.getElementById('dimensions').textContent=b.dataset.w+' × '+b.dataset.h;document.querySelectorAll('[data-w]').forEach(x=>x.classList.toggle('active',x===b));});document.querySelectorAll('[data-scene]').forEach(b=>b.onclick=()=>{f.contentWindow.postMessage({type:'scene',scene:b.dataset.scene},location.origin);document.querySelectorAll('[data-scene]').forEach(x=>x.classList.toggle('active',x===b));});</script></body></html>
