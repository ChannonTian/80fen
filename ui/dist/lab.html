<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>80分 · 尺寸实验室</title><link rel="stylesheet" href="lab.css"></head><body>
<aside><a href="index.html">← 回到牌桌</a><h1>尺寸实验室</h1><p>保持实际 CSS 像素大小。<br>不缩放整张牌桌。</p><h2>屏幕大小</h2><div id="sizes"><button data-w="320" data-h="568">320 × 568 · 小屏</button><button data-w="375" data-h="667">375 × 667 · 标准</button><button data-w="390" data-h="844" class="active">390 × 844 · 长屏</button><button data-w="430" data-h="932">430 × 932 · 大屏</button></div><h2>演示局面</h2><div id="scenes"><button data-scene="follow" class="active">跟对子</button><button data-scene="lead">出拖拉机</button><button data-scene="bury">33 张 · 扣底</button></div><p>手牌保持大小，空间不够时在手牌区上下滚动。确认按钮固定在底部。</p><a href="DESIGN.md">设计说明 ↗</a></aside>
<main><div class="ruler" id="dimensions">390 × 844</div><iframe src="index.html" title="竖屏牌桌尺寸实验" id="table" width="390" height="844"></iframe></main>
<script>const f=document.getElementById('table');document.querySelectorAll('[data-w]').forEach(b=>b.onclick=()=>{f.width=b.dataset.w;f.height=b.dataset.h;document.getElementById('dimensions').textContent=b.dataset.w+' × '+b.dataset.h;document.querySelectorAll('[data-w]').forEach(x=>x.classList.toggle('active',x===b));});document.querySelectorAll('[data-scene]').forEach(b=>b.onclick=()=>{f.contentWindow.postMessage({type:'scene',scene:b.dataset.scene},location.origin);document.querySelectorAll('[data-scene]').forEach(x=>x.classList.toggle('active',x===b));});</script></body></html>
